<!doctype html>
<!-- 02 End screen, variant A "Two slots + subscribe". 16:9 1920x1080, 30 fps, 8 s. Full kind: always shows footage.
     Blurred, graded gameplay bed; two 16:9 video slots and a round subscribe slot on YouTube's end-screen grid as real 3D
     chrome bezels (Three.js, media/es3d.js); an extruded red WATCH THIS NEXT; a hand-painted arrow that lands on slot 2,
     which locks in (scale punch, snaps anodised red, two light bands race round its bevel). See DECISIONS.md / README.md. -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="media/glyphs.js"></script>
    <script src="media/es3d.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Archivo", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #bed, #push, #ov, #stage, #glHost, #ov2 { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .shot { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
      #shade { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
        background:
          radial-gradient(70% 55% at 32% 18%, rgba(4,4,8,.55), rgba(4,4,8,0) 70%),
          radial-gradient(130% 100% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%),
          linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,.35)); }
      /* screens: DOM under the WebGL bezels, posed by ES3D.pose to match them exactly */
      .scr { position: absolute; display: block; border-radius: 16px; transform-origin: 50% 50%; backface-visibility: hidden;
        background: radial-gradient(120% 95% at 28% 18%, #1c2433 0%, #0a0d13 55%, #050608 100%);
        box-shadow: 0 34px 60px rgba(0,0,0,.62), 0 10px 20px rgba(0,0,0,.45); }
      .halo { position: absolute; left: -26px; top: -26px; right: -26px; bottom: -26px; border-radius: 40px; opacity: 0;
        box-shadow: 0 0 46px 8px rgba(255,46,58,.5), 0 0 100px 18px rgba(255,46,58,.16); }
      .scrIn { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 16px; overflow: hidden; }
      .tv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
      .sheen { position: absolute; top: -20%; left: 0; width: 46%; height: 140%;
        background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.16) 45%, rgba(255,255,255,.24) 50%, rgba(255,255,255,.16) 55%, rgba(255,255,255,0) 100%); }
      .glass { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 16px;
        background: linear-gradient(162deg, rgba(255,255,255,.13) 0%, rgba(255,255,255,.03) 34%, rgba(255,255,255,0) 35%);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.05), inset 0 14px 26px rgba(0,0,0,.55), inset 0 -8px 18px rgba(0,0,0,.35); }
      .ava { position: absolute; display: block; border-radius: 50%; overflow: hidden; transform-origin: 50% 50%; backface-visibility: hidden;
        box-shadow: 0 26px 46px rgba(0,0,0,.6); background: #0b0d12; }
      .ava img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
      .ava .avaShade { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 50%;
        box-shadow: inset 0 10px 22px rgba(0,0,0,.45), inset 0 -6px 14px rgba(0,0,0,.25); }
      #gl { filter: drop-shadow(0 18px 22px rgba(0,0,0,.5)); }
      #pill { position: absolute; display: block; height: 64px; border-radius: 32px; padding: 0 30px; transform-origin: 50% 50%;
        background: linear-gradient(180deg, #FF6A70 0%, #F2202C 46%, #C30E1B 100%);
        box-shadow: inset 0 2px 0 rgba(255,255,255,.5), inset 0 -5px 9px rgba(90,0,10,.5), 0 0 0 4px rgba(12,8,10,.92), 0 12px 24px rgba(0,0,0,.6); }
      .pillGloss { position: absolute; left: 10px; right: 10px; top: 4px; height: 26px; border-radius: 26px;
        background: linear-gradient(180deg, rgba(255,255,255,.38), rgba(255,255,255,0)); }
      #pillText { position: relative; display: block; color: #fff; font-weight: 900; font-stretch: 68%; font-size: 40px; line-height: 64px;
        letter-spacing: 0.035em; white-space: nowrap; text-shadow: 0 2px 0 rgba(110,0,10,.55); }
      #subWrap, #arrowBox { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 50% 50%; }
      #arrow { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
      #black { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: #000; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div id="shake">
        <div id="bed"><div id="push">
          <video id="bgA" class="clip shot" src="assets/shots/v35-penthouse-dusk-h.mp4" muted playsinline data-start="0" data-duration="8" data-media-start="0" data-track-index="0"></video>
        </div></div>
        <div id="ov">
          <div id="shade"></div>
          <div id="stage">
            <div class="scr" id="scr0"><div class="halo"></div><div class="scrIn" id="scrIn0">
              <video id="tv0a" class="clip tv" src="assets/shots/v57-gp-red-car-highway-h.mp4" muted playsinline data-start="1.25" data-duration="2.03" data-media-start="0" data-track-index="1"></video>
              <video id="tv0b" class="clip tv" src="assets/shots/v52-gp-police-bridge-h.mp4" muted playsinline data-start="3.28" data-duration="4.72" data-media-start="0" data-track-index="1"></video>
              <div class="sheen" id="sheen0"></div></div><div class="glass"></div></div>
            <div class="scr" id="scr1"><div class="halo" id="halo1"></div><div class="scrIn" id="scrIn1">
              <video id="tv1a" class="clip tv" src="assets/shots/v56-gp-truck-crash-h.mp4" muted playsinline data-start="1.35" data-duration="5.05" data-media-start="0" data-track-index="2"></video>
              <video id="tv1b" class="clip tv" src="assets/shots/v54-gp-trevor-walk-h.mp4" muted playsinline data-start="6.4" data-duration="1.6" data-media-start="0.6" data-track-index="2"></video>
              <div class="sheen" id="sheen1"></div></div><div class="glass"></div></div>
            <div class="ava" id="ava"><img src="media/avatar.jpg" alt="" /><div class="avaShade"></div></div>
          </div>
          <div id="glHost"></div>
          <div id="ov2">
            <div id="arrowBox"><svg id="arrow" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg></div>
            <div id="subWrap"><div id="pill"><div class="pillGloss"></div><div id="pillText">SUBSCRIBE</div></div></div>
          </div>
          <div id="black"></div>
        </div>
      </div>
    </div>
    <script>
      const CONFIG = {
        // the title: extruded Archivo (wdth 64, wght 900) caps, sheared into an italic
        title: { runs: [{ text: "WATCH THIS NEXT", face: ["#8E0510", "#D9121E", "#FF4A52"], side: "#E9ECF1" }],
                 x: 102, baseline: 266, cap: 128, shear: 0.16, depth: 34, bevel: 4.5 },
        // the YouTube end-screen grid (screen rects in px); slot `pick` is the one the arrow lands on
        slots: [ { cx: 522, cy: 704, w: 760, h: 428 }, { cx: 1398, cy: 704, w: 760, h: 428 } ], pick: 1,
        bezel: { border: 22, r: 16, depth: 20, bevel: 5, chrome: "#DFE3EA", picked: "#FF2A36" },
        subscribe: { cx: 1684, cy: 236, r: 104, ring: 24, color: "#E3121E", label: "SUBSCRIBE", pillY: 370 },
        // the hand-painted arrow: cubic Bezier shaft (P0..P3) + a painted head; width profile in px
        arrow: { p: [[1398, 296], [1446, 352], [1428, 420], [1356, 444]], width: [10, 36, 30], head: { len: 64, half: 48 },
                 fill: ["#FF4A52", "#D3101D"], outline: "#FFD23C", outlineW: 8 },
        bed: { blur: 16, brightness: 0.6, contrast: 1.14, saturate: 1.18 },
        // hold: seconds the finished layout holds after the payoff. Longer holds: raise it, set the root data-duration to
        // timing.end (printed to the console) and extend the background / slot videos to match.
        timing: { titleIn: 0.26, letterGap: 0.032, slotIn: [0.52, 0.66], ringIn: 0.82, on: [1.25, 1.35], pill: 1.3,
                  arrow: 1.55, arrowDur: 0.42, pay: 2.08, hold: 4.4 }
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const C = CONFIG, T = C.timing, $ = (s) => document.querySelector(s);
        T.out = T.pay + 0.55 + T.hold; T.black = T.out + 0.2; T.end = T.out + 0.97;
        const W = 1920, H = 1080, FPS = 30, SHUT = 0.42 / FPS;
        const clamp = (x, a, b) => Math.min(b, Math.max(a, x)), lerp = (a, b, k) => a + (b - a) * k;
        const smooth = (a, b, x) => { const k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };
        // fast-start damped arrival: 0 -> 1 with ~8% overshoot (k: damping, w: ring frequency)
        const fly = (tau, k, w) => tau <= 0 ? 0 : 1 - Math.exp(-k * tau) * Math.cos(w * tau);
        const E = (n) => gsap.parseEase(n), P3IN = E("power3.in"), EXPO = E("expo.out");

        // ---------- the 3D layer ----------
        const G = ES3D({ W, H, host: $("#glHost"), exposure: 1.0 });
        ["#stage", "#ov2"].forEach((s) => { $(s).style.perspective = G.DIST.toFixed(3) + "px"; $(s).style.perspectiveOrigin = (W / 2) + "px " + (H / 2) + "px"; });
        const arrowBox = $("#arrowBox"), subWrap = $("#subWrap");

        const chromeMat = () => new THREE.MeshPhysicalMaterial({ color: new THREE.Color(C.bezel.chrome), metalness: 1, roughness: 0.2, clearcoat: 0.5, clearcoatRoughness: 0.1, envMapIntensity: 1.3 });
        const slots = C.slots.map((s, i) => {
          const dom = $("#scr" + i), pad = 6;
          dom.style.left = (s.cx - s.w / 2 - pad) + "px"; dom.style.top = (s.cy - s.h / 2 - pad) + "px";
          dom.style.width = (s.w + 2 * pad) + "px"; dom.style.height = (s.h + 2 * pad) + "px";
          const n = G.frame({ cx: s.cx, cy: s.cy, w: s.w, h: s.h, r: C.bezel.r, border: C.bezel.border, depth: C.bezel.depth, bevel: C.bezel.bevel, mat: chromeMat(), dom });
          n.inner = $("#scrIn" + i); n.halfDiag = Math.hypot(s.w, s.h) / 2; return n;
        });
        const S = C.subscribe, avaEl = $("#ava");
        avaEl.style.left = (S.cx - S.r) + "px"; avaEl.style.top = (S.cy - S.r) + "px"; avaEl.style.width = (2 * S.r) + "px"; avaEl.style.height = (2 * S.r) + "px";
        const ringMat = new THREE.MeshPhysicalMaterial({ color: new THREE.Color(S.color), metalness: 0.55, roughness: 0.26, clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: 1.2 });
        const ring = G.ring({ cx: S.cx, cy: S.cy, r: S.r - 4, width: S.ring, depth: 16, bevel: 5, mat: ringMat, dom: avaEl });
        ring.halfDiag = S.r;
        const title = G.title(Object.assign({ glyphs: window.TITLE_GLYPHS }, C.title));

        // ---------- the painted arrow (SVG): tapered shaft polygon along a cubic, painted head, revealed by a stroke mask ----------
        const A = C.arrow, NS = "http://www.w3.org/2000/svg", svg = $("#arrow");
        const mk = (tag, at, parent) => { const n = document.createElementNS(NS, tag); for (const k in at) n.setAttribute(k, at[k]); (parent || svg).appendChild(n); return n; };
        const bez = (t) => { const [a, b, c, d] = A.p, u = 1 - t; return [0, 1].map((j) => u * u * u * a[j] + 3 * u * u * t * b[j] + 3 * u * t * t * c[j] + t * t * t * d[j]); };
        const bezD = (t) => { const [a, b, c, d] = A.p, u = 1 - t; return [0, 1].map((j) => 3 * u * u * (b[j] - a[j]) + 6 * u * t * (c[j] - b[j]) + 3 * t * t * (d[j] - c[j])); };
        // brush width: a soft start, full by 40%, easing to the head
        const wAt = (t) => t < 0.4 ? lerp(A.width[0], A.width[1], Math.sin((t / 0.4) * Math.PI / 2)) : lerp(A.width[1], A.width[2], smooth(0.4, 1, t));
        const N = 90, Lp = [], Rp = [], mid = [];
        for (let i = 0; i <= N; i++) {
          const t = i / N, p = bez(t), d = bezD(t), l = Math.hypot(d[0], d[1]) || 1, nx = -d[1] / l, ny = d[0] / l, w = wAt(t) / 2;
          Lp.push([p[0] + nx * w, p[1] + ny * w]); Rp.push([p[0] - nx * w, p[1] - ny * w]); mid.push(p);
        }
        const f2 = (q) => q[0].toFixed(1) + " " + q[1].toFixed(1);
        const shaftD = "M" + Lp.map(f2).join("L") + "L" + Rp.slice().reverse().map(f2).join("L") + "Z";
        const dEnd = bezD(1), lEnd = Math.hypot(dEnd[0], dEnd[1]), ux = dEnd[0] / lEnd, uy = dEnd[1] / lEnd, P3 = A.p[3];
        const tip = [P3[0] + ux * A.head.len, P3[1] + uy * A.head.len];
        const hb = [P3[0] - ux * 8, P3[1] - uy * 8];
        const headD = "M" + f2([hb[0] - uy * A.head.half, hb[1] + ux * A.head.half]) + "L" + f2(tip) + "L" + f2([hb[0] + uy * A.head.half, hb[1] - ux * A.head.half]) +
          "Q" + f2([P3[0] + ux * 10, P3[1] + uy * 10]) + " " + f2([hb[0] - uy * A.head.half, hb[1] + ux * A.head.half]) + "Z";
        const midD = "M" + mid.map(f2).join("L");
        const defs = mk("defs", {});
        const rough = mk("filter", { id: "rough", x: "-10%", y: "-10%", width: "120%", height: "120%" }, defs);
        mk("feTurbulence", { type: "fractalNoise", baseFrequency: "0.045", numOctaves: "2", seed: "7", result: "n" }, rough);
        mk("feDisplacementMap", { in: "SourceGraphic", in2: "n", scale: "5", xChannelSelector: "R", yChannelSelector: "G", result: "d" }, rough);
        mk("feDropShadow", { in: "d", dx: "0", dy: "8", stdDeviation: "7", "flood-color": "#000", "flood-opacity": "0.65" }, rough);
        const soft = mk("filter", { id: "soft", x: "-10%", y: "-10%", width: "120%", height: "120%" }, defs);
        mk("feGaussianBlur", { stdDeviation: "2.2" }, soft);
        const gr = mk("linearGradient", { id: "agr", x1: "0", y1: "0", x2: "0", y2: "1" }, defs);
        mk("stop", { offset: "0", "stop-color": A.fill[0] }, gr); mk("stop", { offset: "1", "stop-color": A.fill[1] }, gr);
        const mask = mk("mask", { id: "amask", maskUnits: "userSpaceOnUse", x: "0", y: "0", width: "1920", height: "1080" }, defs);
        const mline = mk("path", { d: midD, fill: "none", stroke: "#fff", "stroke-width": "80", "stroke-linecap": "round", "stroke-dasharray": "2000", "stroke-dashoffset": "2000" }, mask);
        const g = mk("g", { filter: "url(#rough)", id: "arrowG" });
        const shaft = mk("g", { mask: "url(#amask)" }, g);
        mk("path", { d: shaftD, fill: A.outline, stroke: A.outline, "stroke-width": String(A.outlineW * 2), "stroke-linejoin": "round" }, shaft);
        mk("path", { d: shaftD, fill: "url(#agr)" }, shaft);
        // paint gloss: a soft lighter band along the upper edge of the shaft
        const gl = []; for (let i = 6; i <= N - 8; i++) { const t = i / N, p = bez(t), d = bezD(t), l = Math.hypot(d[0], d[1]), w = wAt(t) * 0.2; gl.push([p[0] - d[1] / l * w, p[1] + d[0] / l * w]); }
        mk("path", { d: "M" + gl.map(f2).join("L"), fill: "none", stroke: "rgba(255,255,255,.3)", "stroke-width": "9", "stroke-linecap": "round", filter: "url(#soft)" }, shaft);
        const head = mk("g", { id: "head", opacity: "1" }, g);
        mk("path", { d: headD, fill: A.outline, stroke: A.outline, "stroke-width": String(A.outlineW * 2), "stroke-linejoin": "round" }, head);
        mk("path", { d: headD, fill: "url(#agr)" }, head);
        const mlen = mline.getTotalLength() + 90;
        mline.setAttribute("stroke-dasharray", mlen.toFixed(1)); mline.setAttribute("stroke-dashoffset", mlen.toFixed(1));
        const headOrigin = P3;
        const picked = slots[C.pick];
        const tipAng = picked.angleOf(tip[0] + ux * 6, tip[1] + uy * 6);

        // the SUBSCRIBE pill on the ring
        const pill = $("#pill"); $("#pillText").textContent = S.label;

        // ---------- poses: one pure function of time ----------
        const OUT = (t) => P3IN(clamp((t - T.out) / 0.5, 0, 1));      // one rigid clock for the whole exit (a dolly back)
        function poses(t) {
          const out = -2600 * OUT(t);
          const L = title.nodes.map((n, i) => {
            const tau = t - (T.titleIn + i * T.letterGap), u = fly(tau, 9, 12);
            return { hide: tau < 0, dz: 380 * (1 - u) + out, rx: 0.4 * (1 - u), dy: -20 * (1 - u), s: 1, u };
          });
          const Sl = slots.map((n, i) => {
            const tau = t - T.slotIn[i], u = fly(tau, 7, 9), dir = i === 0 ? -1 : 1;
            let s = 1, lift = 0;
            if (i === C.pick) {
              const pt = t - T.pay;
              if (pt > 0) {
                const env = pt < 0.066 ? Math.sin((pt / 0.066) * Math.PI / 2) : Math.exp(-9 * (pt - 0.066)) * Math.cos(13 * (pt - 0.066));
                s = 1 + 0.035 * env; lift = 22 * fly(pt - 0.05, 8, 10);
              }
            }
            return { hide: tau < 0, dz: -3800 * (1 - u) + lift + out, dx: dir * 260 * (1 - u), dy: -60 * (1 - u), rx: 0.32 * (1 - u), ry: -dir * 0.55 * (1 - u), s, u };
          });
          const tau = t - T.ringIn, u = fly(tau, 7, 9);
          const breath = 0.16 * Math.sin((t - T.ringIn) * 1.7) * smooth(T.ringIn + 0.6, T.ringIn + 1.4, t) * (1 - OUT(t));
          const R = { hide: tau < 0, dz: -2400 * (1 - u) + out, ry: Math.PI * (1 - u) + breath, rx: 0.12 * Math.sin(t * 1.3) * smooth(1.6, 2.4, t) * (1 - OUT(t)), s: 1, u };
          return { L, Sl, R, out };
        }
        const pickCol = new THREE.Color(C.bezel.picked), chromeCol = new THREE.Color(C.bezel.chrome);
        function state(t) {
          const P = poses(t);
          title.nodes.forEach((n, i) => G.pose(n, P.L[i]));
          slots.forEach((n, i) => G.pose(n, P.Sl[i]));
          G.pose(ring, P.R);
          // payoff: the picked bezel snaps to anodised red on the hit frame, and two hot bands race round it from the arrow tip
          const pt = t - T.pay, pk = pt >= -1e-4 ? 1 : 0;   // a hard snap on the hit frame (no chrome->red blend)
          picked.mesh.material.color.copy(chromeCol).lerp(pickCol, pk);
          picked.mesh.material.roughness = lerp(0.2, 0.26, pk);
          const run = E("power2.out")(clamp(pt / 0.5, 0, 1)) * Math.PI;
          const B = picked.band;
          B.uA1.value = tipAng + run; B.uA2.value = tipAng - run; B.uRun.value = run;
          B.uBAmp.value = pt <= 0 ? 0 : 5 * clamp(pt / 0.033, 0, 1) * (1 - smooth(0.36, 0.6, pt));
          // key light drifts across the run; the rake crosses the picked slot on the payoff
          const ka = lerp(-0.75, 0.35, clamp(t / T.end, 0, 1));
          G.key.position.set(Math.sin(ka), 0.85, Math.cos(ka));
          const rp = clamp((pt - 0.04) / 0.7, 0, 1);
          G.rake.position.set(lerp(W * 0.05, W * 0.62, E("sine.inOut")(rp)), -H * 0.05, 900);
          G.rake.intensity = 3.0 * Math.pow(Math.sin(Math.PI * rp), 0.7);
          return P;
        }
        // DOM motion blur + landing shadow, from the same poses
        const proj = (n, q) => { const z = q.dz, k = G.DIST / (G.DIST - z); return [W / 2 + (n.X + q.dx) * k, H / 2 - (n.Y + q.dy) * k, k]; };
        function domBlur(n, q0, q1) {
          if (q1.hide) { n.dom.style.filter = "none"; return; }
          const a = proj(n, Object.assign({ dx: 0, dy: 0 }, q0)), b = proj(n, Object.assign({ dx: 0, dy: 0 }, q1));
          const px = Math.min(22, 0.5 * (Math.hypot(b[0] - a[0], b[1] - a[1]) + Math.abs(b[2] - a[2]) * n.halfDiag + Math.abs((q1.ry || 0) - (q0.ry || 0)) * n.halfDiag));
          n.dom.style.filter = px > 0.6 ? "blur(" + px.toFixed(2) + "px)" : "none";
        }
        const moving = (t) => (t > T.titleIn - 0.02 && t < T.ringIn + 0.9) || t > T.out;
        function renderAt(t) {
          const mb = moving(t);
          G.render(state, t, mb ? 16 : 1, SHUT);
          const P1 = poses(t), P0 = poses(t - SHUT);
          slots.forEach((n, i) => {
            domBlur(n, P0.Sl[i], P1.Sl[i]);
            const u = clamp(P1.Sl[i].u, 0, 1);
            n.dom.style.boxShadow = "0 " + lerp(70, 34, u).toFixed(1) + "px " + lerp(110, 58, u).toFixed(1) + "px rgba(0,0,0," + lerp(0.25, 0.62, u).toFixed(3) + "), 0 10px 20px rgba(0,0,0," + lerp(0, 0.45, u).toFixed(3) + ")";
          });
          domBlur(ring, P0.R, P1.R);
          // the 2D overlays recede on the same rigid clock as the 3D
          const tz = "translate3d(0px,0px," + P1.out.toFixed(2) + "px)";
          arrowBox.style.transform = tz; subWrap.style.transform = tz;
        }
        window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") renderAt(e.detail.time); });

        const FACES = ["900 100px Archivo", "800 100px Archivo"];
        Promise.all(FACES.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
          pill.style.left = (S.cx - pill.offsetWidth / 2) + "px"; pill.style.top = (S.pillY - 32) + "px";
          const tl = gsap.timeline({ paused: true });
          Look.drive(tl, 0, T.end, (p) => renderAt(p * T.end));
          // the bed: the last shot racks out of focus and drops under the end screen (keeps its blacks)
          const B = C.bed;
          const G0 = "blur(0px) brightness(1) contrast(1.04) saturate(1.05)";
          const G1 = "blur(" + B.blur + "px) brightness(" + B.brightness + ") contrast(" + B.contrast + ") saturate(" + B.saturate + ")";
          gsap.set("#bed", { filter: G0 });
          tl.fromTo("#bed", { filter: G0 }, { filter: G1, duration: 0.7, ease: "power2.inOut", immediateRender: false }, 0.12);
          tl.fromTo("#shade", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out", immediateRender: true }, 0.15);
          Look.push(tl, "#push", 0, T.end, { from: 1.06, to: 1.13 });
          // the title lands: a small hit on the whole frame
          Look.impact(tl, T.titleIn + 0.5, { shake: "#shake", amp: 4, dur: 0.28, flash: 0, zoom: 1.006 });
          // screens power on: a vertical open from the centre line with a small exposure overshoot local to the screen
          slots.forEach((n, i) => {
            const t0 = T.on[i], el = n.inner;
            Look.drive(tl, t0, 0.3, (p) => {
              const k = EXPO(clamp(p / 0.75, 0, 1)), ins = (50 * (1 - k)).toFixed(2);
              el.style.clipPath = p <= 0 ? "inset(50% 0% 50% 0%)" : (k >= 0.999 ? "none" : "inset(" + ins + "% 0% " + ins + "% 0% round 16px)");
              el.style.filter = p <= 0 || p >= 1 ? "none" : "brightness(" + (1 + 0.3 * (1 - p) * (1 - p)).toFixed(3) + ")";
            });
          });
          // the pill springs onto the ring (opaque from its first frame)
          gsap.set("#pill", { scale: 0, opacity: 0 });
          tl.fromTo("#pill", { scale: 0.35 }, { scale: 1, duration: 0.55, ease: "elastic.out(1, 0.55)", immediateRender: false }, T.pill);
          tl.fromTo("#pill", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none", immediateRender: false }, T.pill);
          // the arrow paints on, then the head pops on its base; before the exit it retracts along its path
          const AD = T.out + 0.04 - T.arrow;
          Look.drive(tl, T.arrow, AD, (p) => {
            const t = T.arrow + p * AD, dr = clamp((t - T.arrow) / T.arrowDur, 0, 1), rt = clamp((t - (T.out - 0.18)) / 0.2, 0, 1);
            mline.setAttribute("stroke-dashoffset", (mlen * ((1 - E("power2.inOut")(dr)) + E("power2.in")(rt))).toFixed(1));
          });
          gsap.set("#head", { scale: 0, svgOrigin: headOrigin[0] + " " + headOrigin[1] });
          tl.fromTo("#head", { scale: 0 }, { scale: 1, duration: 0.24, ease: "back.out(3)", svgOrigin: headOrigin[0] + " " + headOrigin[1], immediateRender: false }, T.arrow + T.arrowDur - 0.06);
          tl.fromTo("#head", { scale: 1 }, { scale: 0, duration: 0.1, ease: "power2.in", svgOrigin: headOrigin[0] + " " + headOrigin[1], immediateRender: false }, T.out - 0.24);
          // payoff: the picked slot locks in: scale punch + red snap + bands round the bevel (in 3D), bloom behind, a small hit
          Look.impact(tl, T.pay, { shake: "#shake", amp: 3, dur: 0.24, flash: 0, zoom: 1.004 });
          gsap.set("#halo1", { opacity: 0 });
          tl.fromTo("#halo1", { opacity: 0 }, { opacity: 1, duration: 0.066, ease: "none", immediateRender: false }, T.pay);
          tl.fromTo("#halo1", { opacity: 1 }, { opacity: 0.55, duration: 0.6, ease: "power2.out", immediateRender: false }, T.pay + 0.166);
          gsap.set(".sheen", { xPercent: -160 });
          tl.fromTo("#sheen1", { xPercent: -160 }, { xPercent: 260, duration: 0.75, ease: "power2.inOut", immediateRender: false }, T.pay + 0.1);
          tl.fromTo("#sheen0", { xPercent: -160 }, { xPercent: 260, duration: 0.9, ease: "power2.inOut", immediateRender: false }, T.pay + 0.3);
          // exit: the whole card dollies back on one clock while the picture goes to black (the video is over)
          tl.fromTo("#halo1", { opacity: 0.55 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, T.out);
          tl.fromTo("#black", { opacity: 0 }, { opacity: 1, duration: T.end - 0.17 - T.black, ease: "power2.in", immediateRender: false }, T.black);
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
          renderAt(0);
        });
        renderAt(0);
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
