<!doctype html>
<!-- GTA-niche 03 Word captions, variant B (9:16 Shorts, 1080x1920, 30 fps).
     One word at a time in big narrow heavy caps. Running words are DOM type built as a bevelled block (ink edge, graded
     extrusion with a lit lip; gold hit words add a top-edge highlight and a warm seam). The payoff ("MINIGUN.") is real
     geometry: Three.js extruded, bevelled letters traced from Archivo, landing white and turning to polished gold behind a
     feathered hot-white light front as the minigun opens up, with a raking key light, one wide specular sweep and HDR bloom,
     wrapped in the same ink edge. See ../DECISIONS.md.
     Variable: bg "plate" (sample GTA V footage) / "none" (transparent overlay). -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="media/glyphs.js"></script>
    <script src="media/payoff3d.js"></script>
    <style>
      @font-face { font-family: "Archivo"; font-style: normal; font-weight: 100 900; font-stretch: 62% 125%; font-display: block; src: url("../../../shared/fonts/Archivo.ttf") format("truetype"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Archivo", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ov { position: absolute; inset: 0; pointer-events: none; }
      .grp { position: absolute; left: 0; width: 100%; text-align: center; white-space: nowrap; opacity: 0; }
      .grp3d { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; }
      .grp3d .bump, .grp3d .shade { position: absolute; }
      .grp3d .bump { left: 0; top: 0; width: 100%; height: 100%; }
      .w { position: relative; display: inline-block; vertical-align: top; text-transform: uppercase; white-space: nowrap; }
      .w .l { display: block; white-space: nowrap; line-height: 1; padding: 0 0.08em 0.25em; }
      .w .abs, .w .set { position: absolute; left: 0; top: 0; }
      .w .set { width: 100%; height: 100%; }
      .w .glow { opacity: 0; }
      .fx { position: absolute; width: 0; height: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <!-- the bevel on DOM gold: a top-edge highlight on every upward-facing edge and a warm seam on every downward-facing edge -->
    <svg class="fx" aria-hidden="true">
      <filter id="bevel" x="-5%" y="-10%" width="110%" height="120%" color-interpolation-filters="sRGB">
        <feOffset in="SourceAlpha" dx="-0.9" dy="3.2" result="dn" />
        <feComposite in="SourceAlpha" in2="dn" operator="out" result="topE" />
        <feGaussianBlur in="topE" stdDeviation="0.75" result="topB" />
        <feFlood flood-color="#FFFBE8" flood-opacity="0.95" />
        <feComposite in2="topB" operator="in" result="hiC" />
        <feComposite in="hiC" in2="SourceAlpha" operator="in" result="hi" />
        <feOffset in="SourceAlpha" dx="0" dy="-2.2" result="up" />
        <feComposite in="SourceAlpha" in2="up" operator="out" result="botE" />
        <feGaussianBlur in="botE" stdDeviation="0.6" result="botB" />
        <feFlood flood-color="#8A3E00" />
        <feComposite in2="botB" operator="in" result="seamC" />
        <feComposite in="seamC" in2="SourceAlpha" operator="in" result="seam" />
        <feMerge><feMergeNode in="SourceGraphic" /><feMergeNode in="seam" /><feMergeNode in="hi" /></feMerge>
      </filter>
    </svg>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.9" data-width="1080" data-height="1920">
      <div id="shake"><div id="push">
        <video id="shotA" class="clip shot" src="assets/shots/v52-gp-police-bridge-v.mp4" muted playsinline data-start="0" data-duration="2.45" data-media-start="0.75" data-track-index="0"></video>
        <video id="shotB" class="clip shot" src="assets/shots/v09-juggernaut-minigun-v.mp4" muted playsinline data-start="2.45" data-duration="0.91" data-media-start="0.3" data-track-index="0"></video>
        <video id="shotC" class="clip shot" src="assets/shots/v30-street-explosion-v.mp4" muted playsinline data-start="3.36" data-duration="1.26" data-media-start="0.38" data-track-index="0"></video>
        <video id="shotD" class="clip shot" src="assets/shots/v26-bridge-explosion-v.mp4" muted playsinline data-start="4.62" data-duration="1.28" data-media-start="0.1" data-track-index="0"></video>
      </div></div>
      <div id="ov" class="clip" data-start="0" data-duration="5.9" data-track-index="1"></div>
    </div>
    <script>
      const CONFIG = {
        // The creator's commentary line, one word on screen at a time. t = the second the word is spoken.
        // hot:1 = hit word (lands gold, bigger). pay:1 = the payoff, rendered as real 3D gold: it lands white on its t and
        // ignites at `ignite` (put it just before the biggest light in the footage, so the gold reads before the flash).
        words: [
          { w: "THE", t: 0.20 }, { w: "COPS", t: 0.42, hot: 1 }, { w: "BLOCKED", t: 0.80 }, { w: "THE", t: 1.16 },
          { w: "WHOLE", t: 1.34 }, { w: "BRIDGE...", t: 1.66 },
          { w: "SO", t: 2.45 }, { w: "I", t: 2.70 }, { w: "BROUGHT", t: 2.86 }, { w: "A", t: 3.18 },
          { w: "MINIGUN.", t: 3.36, hot: 1, pay: 1, ignite: 3.50 }   // lands white on the cut, ignites 2 frames before the muzzle blast whites out the street
        ],
        lastOut: 5.45,          // when the payoff starts its exit
        end: 5.9,
        type: {
          family: "Archivo", weight: 900, stretch: 64, tracking: -0.01,  // narrow heavy caps
          size: 168, hotSize: 186, paySize: 220, maxWidth: 690,         // px; DOM words auto-fit to maxWidth (keeps the squash inside x 72-936)
          payMaxInk: 660,       // the 3D payoff's ink width cap, px (it is optically centred without its period)
          capCentreY: 1240,     // y of the word's cap-height centre
          edge: 6,              // visible outer ink edge, px (wraps face + extrusion)
          rim: 2,               // thin line between face and side, px (ink on white words, a warm seam on gold)
          depth: 11, hotDepth: 13, // DOM words: graded extrusion straight down, px
          tilt: 3,              // entry tilt in degrees, springs to 0
          ink: "#07080B"
        },
        payoff3d: { depth: 30, bevel: 6.5, tilt: 0.3, shade: 0.35 },   // px, px, radians (top leans back), local contact shade
        colors: {
          face:     ["#FFFFFF", "#F7F9FC", "#EEF2F7", "#E4E9F0"],
          side:     ["#2A2F3A", "#07080B"],
          goldFace: ["#FFF1A0", "#FFC21E", "#E07F0A"],
          goldLip:  "#F7B23A",
          goldSide: ["#C46A00", "#3A1400"],
          seam:     "#8A3E00",
          hot:      "#FFF6D0",
          glow:     "#FFB000"
        },
        shots: ["#shotA", "#shotB", "#shotC", "#shotD"]
      };

      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const $ = (s) => document.querySelector(s);
        const C = CONFIG, T = C.type, K = C.colors, FR = 1 / 30;
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));

        const words = C.words.map((wd, i) => Object.assign({}, wd, { i: i, end: i < C.words.length - 1 ? C.words[i + 1].t : C.lastOut }));

        // ---------- the DOM word: a bevelled block (same builder as variant A) ----------
        function metrics(size) {
          const cv = document.createElement("canvas").getContext("2d");
          cv.font = T.weight + " " + size + "px " + T.family;
          const m = cv.measureText("H"), fa = m.fontBoundingBoxAscent, fd = m.fontBoundingBoxDescent, cap = m.actualBoundingBoxAscent;
          const base = (size - (fa + fd)) / 2 + fa;
          return { cap: cap, base: base, top: base - cap };
        }
        const mix = (a, b, k) => { const p = (h) => [1, 3, 5].map((i) => parseInt(h.substr(i, 2), 16)); const A = p(a), B = p(b);
          return "rgb(" + A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(",") + ")"; };
        const inkChain = (n, c) => Array.from({ length: n }, () => "drop-shadow(0 1px 0 " + c + ")").join(" ");
        const sideChain = (n, c, lip) => Array.from({ length: n }, (_, k) => "drop-shadow(0 1px 0 " + (lip && k === 0 ? lip : mix(c[0], c[1], n > 1 ? (k - (lip ? 1 : 0)) / (n - 1 - (lip ? 1 : 0)) : 1)) + ")").join(" ");
        const px = (v) => v.toFixed(1) + "px";
        const whiteGrad = (M) => "linear-gradient(180deg, " + K.face[0] + " " + px(M.top - 2) + ", " + K.face[1] + " " + px(M.top + M.cap * 0.42) + ", " +
          K.face[2] + " " + px(M.top + M.cap * 0.78) + ", " + K.face[3] + " " + px(M.top + M.cap + 1) + ")";
        const goldGrad = (M) => "linear-gradient(180deg, " + K.goldFace[0] + " " + px(M.top - 1) + ", " + mix(K.goldFace[0], K.goldFace[1], 0.55) + " " + px(M.top + M.cap * 0.22) + ", " +
          K.goldFace[1] + " " + px(M.top + M.cap * 0.5) + ", " + mix(K.goldFace[1], K.goldFace[2], 0.55) + " " + px(M.top + M.cap * 0.8) + ", " + K.goldFace[2] + " " + px(M.top + M.cap + 1) + ")";
        const band = (X, hw) => "linear-gradient(104deg, rgba(255,250,235,0) " + px(X - hw - 10) + ", rgba(255,250,235,.42) " + px(X - hw * 0.45) + ", rgba(255,252,242,.72) " + px(X) + ", rgba(255,250,235,.42) " + px(X + hw * 0.45) + ", rgba(255,250,235,0) " + px(X + hw + 10) + ")";

        function buildWord(text, size, depth, hot, M) {
          const w = document.createElement("span"); w.className = "w";
          w.style.cssText = "font:" + T.weight + " " + size + "px/1 '" + T.family + "';" + (T.stretch ? "font-stretch:" + T.stretch + "%;" : "") +
            "letter-spacing:" + T.tracking + "em;transform-origin:50% " + M.base.toFixed(1) + "px";
          const k = size / T.size, mk = (cls, parent) => { const s = document.createElement("span"); s.className = "l " + cls; s.textContent = text; (parent || w).appendChild(s); return s; };
          const out = {};
          if (hot) { out.glow = mk("abs glow"); out.glow.style.cssText = "color:" + K.glow + ";filter:blur(" + Math.round(size * 0.14) + "px)"; }
          out.outline = mk("outline");
          out.outline.style.cssText = "color:" + T.ink + ";-webkit-text-stroke:" + (2 * T.edge * k).toFixed(1) + "px " + T.ink + ";filter:" + inkChain(depth, T.ink) +
            " drop-shadow(0 " + Math.round(8 * k) + "px " + Math.round(12 * k) + "px rgba(0,0,0,.45)) drop-shadow(0 " + Math.round(18 * k) + "px " + Math.round(30 * k) + "px rgba(0,0,0,.32))";
          const set = (cls, gold) => {
            const s = document.createElement("span"); s.className = "set " + cls; w.appendChild(s);
            const sd = mk("abs side", s); sd.style.cssText = "color:" + (gold ? K.goldLip : K.side[0]) + ";filter:" + sideChain(depth, gold ? K.goldSide : K.side, gold ? K.goldLip : null);
            const rm = mk("abs rim", s); rm.style.cssText = "color:" + (gold ? K.seam : T.ink) + ";-webkit-text-stroke:" + (2 * T.rim * k).toFixed(1) + "px " + (gold ? K.seam : T.ink);
            const fc = mk("abs face", s); if (gold) fc.style.filter = "url(#bevel)";
            return { el: s, face: fc, gold: gold };
          };
          out.cold = set("cold", false);
          if (hot) out.hot = set("hot", true);
          out.spec = mk("abs spec");
          out.w = w; out.M = M; out.size = size;
          return out;
        }
        function paintWord(o) {
          [o.cold, o.hot].forEach((s) => { if (s) Look.fill(s.face, s.gold ? goldGrad(o.M) : whiteGrad(o.M)); });
          Look.fill(o.spec, band(-400, 10)); o.specL = o.spec.offsetWidth * 0.9703 + o.spec.offsetHeight * 0.2419;
        }

        // load the caption face before measuring (fonts.ready alone resolves before an unused face is requested)
        Promise.all([document.fonts.load(T.weight + " 100px \"" + T.family + "\"", "MINIGUN")]).then(() => document.fonts.ready).then(() => {
          const ov = $("#ov");
          let P = null;
          words.forEach((wd) => {
            if (wd.pay) {   // the payoff: real geometry
              const pc = C.payoff3d;
              P = Payoff3D({
                W: 1080, H: 1920, glyphs: window.PAYOFF_GLYPHS, text: wd.w, size: T.paySize, tracking: T.tracking, maxInk: T.payMaxInk,
                cx: 540, cy: T.capCentreY, depth: pc.depth, bevel: pc.bevel, tilt: pc.tilt, inkPx: T.edge, inkColor: T.ink, shadow: 0.6, shadowOff: 10,
                colors: { whiteFace: [K.face[0], K.face[3]], whiteSide: K.side, goldFace: K.goldFace, goldLip: K.goldLip, goldSide: K.goldSide, hot: K.hot },
                timing: { ignite: wd.ignite, frontDur: 0.18, specAt: wd.ignite + 0.06, specDur: 0.45, rakeDur: 0.6, holdEnd: C.lastOut }
              });
              const el = document.createElement("div"); el.className = "grp3d"; el.id = "w" + wd.i;
              const bump = document.createElement("div"); bump.className = "bump";
              const shade = document.createElement("div"); shade.className = "shade";
              const sw = P.inkW * 1.3, shH = P.cap * 2.6;
              shade.style.cssText = "left:" + (540 - sw / 2) + "px;top:" + (T.capCentreY - shH / 2 + 10) + "px;width:" + sw + "px;height:" + shH + "px;" +
                "background:radial-gradient(closest-side, rgba(0,0,0," + pc.shade + ") 0%, rgba(0,0,0," + (pc.shade * 0.6).toFixed(3) + ") 55%, rgba(0,0,0,0) 100%)";
              bump.appendChild(shade); bump.appendChild(P.canvas); el.appendChild(bump); ov.appendChild(el);
              wd.el = el; wd.bump = bump; wd.originY = T.capCentreY + P.cap / 2;
              return;
            }
            let size = wd.hot ? T.hotSize : T.size;
            // auto-fit: measure the word's ink at the asked size, shrink so it stays inside maxWidth
            const probe = document.createElement("span"); probe.className = "w";
            probe.style.cssText = "position:absolute;visibility:hidden;font:" + T.weight + " " + size + "px/1 '" + T.family + "';font-stretch:" + T.stretch + "%;letter-spacing:" + T.tracking + "em";
            probe.textContent = wd.w; ov.appendChild(probe);
            const ink = probe.offsetWidth; ov.removeChild(probe);
            if (ink > T.maxWidth) size = Math.floor(size * T.maxWidth / ink);
            const M = metrics(size);
            const el = document.createElement("div"); el.className = "grp"; el.id = "w" + wd.i;
            wd.o = buildWord(wd.w, size, wd.hot ? T.hotDepth : T.depth, !!wd.hot, M);
            el.appendChild(wd.o.w); ov.appendChild(el);
            el.style.top = (T.capCentreY - (M.top + M.cap / 2)) + "px";
            paintWord(wd.o); wd.el = el;
          });
          document.querySelectorAll("#ov .grp, #ov .grp3d, #ov .bump, #ov canvas, #ov .shade, #ov .w, #ov .l, #ov .set").forEach((n) => { n.setAttribute("data-layout-allow-overlap", ""); n.setAttribute("data-layout-allow-occlusion", ""); });

          const tl = gsap.timeline({ paused: true });

          if (plate) C.shots.forEach((s) => {
            const v = $(s), st = parseFloat(v.dataset.start), du = parseFloat(v.dataset.duration);
            gsap.set(v, { scale: 1, transformOrigin: "50% 45%" });
            tl.fromTo(v, { scale: 1 }, { scale: 1.04, duration: du, ease: "none", immediateRender: false }, st);
          });

          // one wide soft specular (0.45em, 10px falloff), skewed 14 deg, clipped to the glyphs
          function specular(o, at, dur) {
            const E = gsap.parseEase("power2.inOut"), L = o.specL, hw = 0.225 * o.size;
            return Look.drive(tl, at, dur, (p) => { o.spec.style.backgroundImage = band(p <= 0 || p >= 1 ? -400 : -hw - 20 + (L + 2 * hw + 40) * E(p), hw); });
          }

          words.forEach((wd) => {
            const el = wd.el, o = wd.o, t0 = wd.t, pay = wd.pay, out = pay ? wd.end : wd.end - 2 * FR;
            const r0 = (Look.hash(wd.i * 7 + 3) > 0.5 ? 1 : -1) * T.tilt * (0.6 + 0.4 * Look.hash(wd.i * 13 + 1));
            gsap.set(el, { transformOrigin: pay ? "540px " + wd.originY.toFixed(1) + "px" : "50% " + (o.M.base).toFixed(1) + "px" });
            const drop = pay ? 22 : 16;
            tl.set(el, { opacity: 1 }, t0);
            // drop onto the baseline with a 4px vertical motion blur, land 6px low in a light squash, spring back over 6 frames
            tl.fromTo(el, { scaleX: 0.84, scaleY: 0.84, y: -drop, rotation: r0 }, { scaleX: 1.06, scaleY: 0.94, y: 6, rotation: r0 * 0.3, duration: 2 * FR, ease: "power2.in", immediateRender: false }, t0);
            tl.to(el, { scaleX: 1, scaleY: 1, y: 0, rotation: 0, duration: Math.min(6 * FR, out - (t0 + 2 * FR) - 0.001), ease: "back.out(2.2)" }, t0 + 2 * FR);
            Look.mblur(tl, el, t0, 2 * FR, { x: 0, y: 4, ease: "none" });

            if (pay) {
              const at = wd.ignite;
              gsap.set(wd.bump, { transformOrigin: "540px " + wd.originY.toFixed(1) + "px" });
              tl.to(wd.bump, { scale: 1.06, duration: 0.07, ease: "power2.out" }, at);
              tl.to(wd.bump, { scale: 1, duration: 0.22, ease: "back.out(2.2)" }, at + 0.07);
              if (plate) {
                // the blast supplies the light: the expose barely lifts (blacks stay black), the punch carries the hit
                Look.expose(tl, at, { target: "#push", peak: 1.03, hold: 2 / 30, dur: 0.3, saturate: 1.08 });
                Look.impact(tl, at, { shake: "#shake", amp: 14, dur: 0.34, zoom: 1.04, flash: 0 });
              }
              // designed exit (5 frames, DESIGN 11.14): opaque snap into its baseline anchor with an 8px vertical blur, hard cut at zero
              tl.fromTo(el, { scaleX: 1, scaleY: 1, y: 0 }, { scaleX: 0.6, scaleY: 0.6, y: -18, duration: 5 * FR, ease: "power3.in", immediateRender: false }, out);
              Look.mblur(tl, el, out, 5 * FR, { x: 0, y: 0, to: [0, 8], ease: "power2.in" });
              tl.set(el, { opacity: 0 }, out + 5 * FR);
              return;
            }
            if (wd.hot) {   // hit words land already gold: warm flare and one wide soft specular at the landing peak
              tl.fromTo(o.glow, { opacity: 0 }, { opacity: 0.7, duration: 0.07, ease: "power2.out", immediateRender: false }, t0 + 0.02);
              tl.to(o.glow, { opacity: 0.26, duration: 0.5, ease: "sine.out" }, t0 + 0.12);
              specular(o, t0 + 0.06, 0.45);
            }
            // swap (DESIGN 11.15): opaque 2-frame compress, hard cut on the frame the next word lands. Never two words at once.
            tl.to(el, { scaleX: 0.93, scaleY: 0.93, duration: 2 * FR, ease: "power2.in" }, out);
            tl.set(el, { opacity: 0 }, wd.end);
          });

          if (P) { Look.drive(tl, 0, C.end, (p) => P.renderAt(p * C.end)); P.renderAt(0); }
          tl.set({}, {}, C.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
</body>
</html>
