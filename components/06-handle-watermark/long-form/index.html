<!doctype html>
<!-- 06 Handle watermark, variant A: "Corner handle" (16:9, 1920x1080, 30 fps, 7 s).
     The creator's avatar as a real 3D gold medallion + @handle, docked in a corner at watermark opacity, drifting to the
     opposite corner mid-video so a crop can't remove it. Variable: bg "plate" (sample footage) / "none" (transparent overlay). -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="media/coin3d.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ov { position: absolute; inset: 0; }
      #wm { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .coin { position: absolute; left: 0; top: 0; z-index: 3; will-change: transform; }
      .coin canvas { filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.55)) drop-shadow(0 6px 9px rgba(0,0,0,.42)); }
      .tx { position: absolute; z-index: 2; white-space: nowrap; font-weight: 800; line-height: 1; }
      .tx .layer { position: absolute; left: 0; top: 0; white-space: nowrap; }
      .tx .ch { display: inline-block; transform-origin: 50% 70%; will-change: transform, opacity; }
      .tx .back { color: #07090d; paint-order: stroke fill; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1920" data-height="1080">
      <div id="shake"><div id="push">
        <video id="shot1" class="clip shot" src="assets/shots/v17-deluxo-sunset-h.mp4" muted playsinline data-start="0" data-duration="1.55" data-media-start="0" data-track-index="0"></video>
        <video id="shot2" class="clip shot" src="assets/shots/v57-gp-red-car-highway-h.mp4" muted playsinline data-start="1.55" data-duration="1.85" data-media-start="0.1" data-track-index="0"></video>
        <video id="shot3" class="clip shot" src="assets/shots/v11-yacht-h.mp4" muted playsinline data-start="3.4" data-duration="2" data-media-start="0.05" data-track-index="0"></video>
        <video id="shot4" class="clip shot" src="assets/shots/v44-bridge-skyline-h.mp4" muted playsinline data-start="5.4" data-duration="1.6" data-media-start="0.05" data-track-index="0"></video>
      </div></div>
      <div id="ov" class="clip" data-start="0" data-duration="7" data-track-index="1">
        <div id="wm" data-layout-allow-occlusion data-layout-allow-overflow></div>
      </div>
    </div>
    <script>
      const CONFIG = {
        handle: "@everestchris6",
        avatar: "media/avatar.jpg",          // square image; the coin shows its inscribed circle
        mark: "@",                           // struck on the coin's gold back
        corners: ["top-left", "top-right"],  // docks in the first, drifts to the second mid-video
        margin: { x: 64, y: 56 },            // docked distance from the frame edges (px)
        coin: 112,                           // coin diameter on entry (px); docked = coin x dockScale
        text: 50,                            // handle size on entry (px)
        gap: 18,                             // coin edge to text
        dockScale: 0.86,
        hold: 0.7,                           // watermark opacity once docked
        colors: {
          face: "linear-gradient(180deg, #FFFFFF 0%, #FFFFFF 40%, #E9EDF3 62%, #C8D0DB 100%)",
          at: "linear-gradient(180deg, #FFE7A1 0%, #F6C453 46%, #E59A1C 100%)",
          band: "rgba(255,196,84,.92)",          // warm gold specular, white-hot core
          stroke: "rgba(7,9,13,.92)",
          glow: "rgba(255,214,128,.9)"
        },
        timing: { in: 0.15, payoff: 1.0, dock: 1.62, drift: 3.4, out: 6.2, end: 7.0 }
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const C = CONFIG, T = C.timing, $ = (s) => document.querySelector(s), PI = Math.PI;
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));
        const Ez = (n) => gsap.parseEase(n);
        const seg = (t, a, b, e) => { const p = t <= a ? 0 : t >= b ? 1 : (t - a) / (b - a); return e ? Ez(e)(p) : p; };
        const wob = (t, t0, amp, f, k) => (t < t0 ? 0 : amp * Math.exp(-k * (t - t0)) * Math.sin(2 * PI * f * (t - t0)));

        const W = 1920, H = 1080, R = C.coin / 2, DS = C.dockScale, SZ = Math.round(C.coin * 2.5);
        const corner = (name) => { const left = name.indexOf("left") >= 0, top = name.indexOf("top") >= 0;
          return { left, top, ox: left ? C.margin.x : W - C.margin.x, oy: top ? C.margin.y : H - C.margin.y }; };
        const K0 = corner(C.corners[0]), K1 = corner(C.corners[1]);
        const O = { x: K0.ox, y: K0.oy };                                   // #wm scales about the docked coin's outer corner
        const C0 = { x: O.x + (K0.left ? R : -R), y: O.y + (K0.top ? R : -R) };
        const S1 = { x: K1.ox + (K1.left ? R * DS : -R * DS), y: K1.oy + (K1.top ? R * DS : -R * DS) };
        const C1 = { x: O.x + (S1.x - O.x) / DS, y: O.y + (S1.y - O.y) / DS }; // local coords that land on corner 2 once docked

        const wm = $("#wm");
        gsap.set(wm, { transformOrigin: O.x + "px " + O.y + "px" });

        const img = new Image(); img.src = C.avatar;
        const FACES = ["800 100px Inter", "900 100px Inter"];
        Promise.all(FACES.map((f) => document.fonts.load(f)).concat([img.decode().catch(() => {})])).then(() => document.fonts.ready).then(() => {
          // ---------- text: an ink outline + contact-shadow layer under a satin face layer, split into characters ----------
          function makeText(cx, cy, coinLeft) {
            const el = document.createElement("div"); el.className = "tx"; el.style.fontSize = C.text + "px";
            el.style.letterSpacing = "-0.012em";
            const back = document.createElement("div"), front = document.createElement("div");
            back.className = "layer back"; front.className = "layer front";
            back.style.webkitTextStroke = (C.text * 0.15).toFixed(1) + "px " + C.colors.stroke;
            back.style.textShadow = "0 2px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.42)";
            Array.from(C.handle).forEach((ch, i) => [back, front].forEach((L) => {
              const s = document.createElement("span"); s.className = "ch" + (i === 0 && ch === "@" ? " at" : ""); s.textContent = ch; L.appendChild(s);
            }));
            el.appendChild(back); el.appendChild(front); wm.appendChild(el);
            const tw = front.offsetWidth, th = front.offsetHeight;
            el.style.width = tw + "px"; el.style.height = th + "px";
            const left = coinLeft ? cx + R + C.gap : cx - R - C.gap - tw;
            el.style.left = left + "px"; el.style.top = (cy - th / 2 - C.text * 0.04) + "px";
            // characters live only on the far side of the coin's centre line (they slide out from under it)
            const cl = cx - left;
            el.style.clipPath = coinLeft ? "inset(-60px -60px -60px " + cl + "px)" : "inset(-60px " + (tw - cl) + "px -60px -60px)";
            // satin face with a warm specular band (band sized 1.2x the word so it reads as a light, not a wash)
            const fr = Array.from(front.children), bk = Array.from(back.children);
            fr.forEach((n) => {
              const x = n.offsetLeft, at = n.classList.contains("at");
              n.style.backgroundImage = (at ? "" : "linear-gradient(105deg, rgba(255,190,70,0) 32%, " + C.colors.band + " 45%, rgba(255,248,226,1) 50%, " + C.colors.band + " 55%, rgba(255,190,70,0) 68%), ") + (at ? C.colors.at : C.colors.face);
              n.style.backgroundRepeat = "no-repeat";
              n.style.backgroundSize = at ? n.offsetWidth + "px " + th + "px" : (tw * 1.2) + "px " + th + "px, " + tw + "px " + th + "px";
              n.style.backgroundPosition = at ? "0px 0px" : (-tw * 2 - x) + "px 0px, " + (-x) + "px 0px";
              n.style.webkitBackgroundClip = "text"; n.style.backgroundClip = "text";
              n.style.color = "transparent"; n.style.webkitTextFillColor = "transparent";
              n.__x = x; n.__at = at;
            });
            const pairs = fr.map((f, i) => [bk[i], f]);
            const frac = fr.map((n) => (n.offsetLeft + n.offsetWidth / 2) / tw);
            const sx = (coinLeft ? -1 : 1) * (tw + R + C.gap + 8);          // the whole word parked under the coin
            const near = fr.map((n, i) => (coinLeft ? i : fr.length - 1 - i)); // 0 = the character next to the coin
            gsap.set([back, front], { x: sx }); pairs.forEach((p) => gsap.set(p, { opacity: 0 }));
            return { el, front, back, fr, pairs, frac, tw, th, left, sx, near, dir: coinLeft ? -1 : 1 };
          }
          const TA = makeText(C0.x, C0.y, K0.left), TB = makeText(C1.x, C1.y, K1.left);

          // ---------- coin + its payoff bloom ----------
          const wrap = document.createElement("div"); wrap.className = "coin"; wrap.style.width = wrap.style.height = SZ + "px";
          wm.appendChild(wrap);
          const coin = Coin3D({ size: SZ, ss: 2, R, h: 0.105, ri: 0.79, avatar: img, mark: C.mark, rakeI: 4.5, exposure: 1.0 });
          wrap.appendChild(coin.canvas);
          const NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS, "svg");
          svg.setAttribute("width", "0"); svg.setAttribute("height", "0"); svg.style.position = "absolute";
          svg.innerHTML = '<filter id="mbx" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB"><feGaussianBlur id="mbxg" stdDeviation="0 0"/></filter>';
          document.body.appendChild(svg);
          const mbg = document.getElementById("mbxg");

          const P = T.payoff, D0 = T.drift + 0.36, D1 = D0 + 1.02, X0 = T.out + 0.34, X1 = T.out + 0.54;
          const travel = (t) => { const p = seg(t, D0, D1), e = Ez("power2.inOut")(p);
            return { x: C0.x + (C1.x - C0.x) * e, y: C0.y + (C1.y - C0.y) * e - 12 * Math.sin(PI * p) }; };
          function coinAt(t) {
            const st = {};
            st.s = 0.3 + 0.7 * seg(t, T.in, T.in + 0.45, "back.out(1.7)");
            st.ry = -2.5 * PI * (1 - seg(t, T.in, T.in + 0.62, "power3.out")) + wob(t, T.in + 0.62, 0.13, 2.1, 6.5);
            // payoff: the coin seats (a press and rebound), tilts into a raking light that crosses rim and glass
            const tilt = Math.sin(PI * seg(t, P - 0.02, P + 0.62, "sine.inOut"));
            st.rx = -0.38 * tilt; st.ry += 0.50 * tilt;
            st.s *= 1 - (t > P ? 0.1 * Math.exp(-9 * (t - P)) * Math.sin(2 * PI * 2.6 * (t - P)) : 0);
            if (t < D1 - 0.2) {
              st.lx = -1.5 + 3.0 * seg(t, P - 0.04, P + 0.42, "power1.inOut");
              st.spec = seg(t, P - 0.04, P + 0.08) * (1 - seg(t, P + 0.24, P + 0.56, "power2.out"));
              // a specular band crosses the bevel and glass, peak held >= 3 frames, with an exposure lift on the coin only
              st.band = -1.7 + 3.4 * seg(t, P - 0.02, P + 0.3, "power1.inOut");
              st.bandAmp = seg(t, P - 0.04, P + 0.03) * (1 - seg(t, P + 0.24, P + 0.34));
              st.expo = seg(t, P, P + 0.034) * (1 - seg(t, P + 0.134, P + 0.4, "power2.out"));
            } else {                                          // a smaller glint as it lands in the second corner
              st.lx = -1.5 + 3.0 * seg(t, D1 - 0.1, D1 + 0.3, "power1.inOut");
              st.spec = 0.5 * seg(t, D1 - 0.1, D1) * (1 - seg(t, D1 + 0.12, D1 + 0.4));
              st.band = 1.7 - 3.4 * seg(t, D1 - 0.04, D1 + 0.26, "power1.inOut");
              st.bandAmp = 0.6 * seg(t, D1 - 0.06, D1) * (1 - seg(t, D1 + 0.2, D1 + 0.3));
            }
            st.ry += wob(t, T.dock + 0.42, 0.07, 2.2, 7);
            // drift: two full turns about its axis while it glides corner to corner, then a damped settle
            const pd = seg(t, D0, D1);
            st.ry += -2 * PI * seg(t, D0, D1, "power2.inOut") + wob(t, D1, 0.1, 2.2, 6.5);
            st.rz = -Math.sign(C1.x - C0.x) * 0.13 * Math.sin(PI * pd);              // banks into the glide
            const sq = seg(t, D1 - 0.05, D1) * (1 - seg(t, D1 + 0.034, D1 + 0.18, "power2.out"));   // 2-frame landing squash
            st.sx = 1 + 0.08 * sq; st.sy = 1 - 0.06 * sq;
            // exit: turns edge-on as it shrinks into its corner
            const pe = seg(t, X0, X1, "power2.in");
            st.ry += 0.5 * PI * pe; st.s *= 1 - 0.75 * pe;
            return st;
          }
          function renderAt(t) {
            const p = travel(t), q = travel(t + 1 / 60), q0 = travel(t - 1 / 60);
            const v = Math.hypot(q.x - q0.x, q.y - q0.y) * 15;      // px per frame
            wrap.style.transform = "translate(" + (p.x - SZ / 2).toFixed(2) + "px," + (p.y - SZ / 2).toFixed(2) + "px)";
            const on = t >= T.in && t < X1;
            wrap.style.opacity = on ? "1" : "0";
            const mb = t > D1 - 0.15 ? 0 : Math.min(8, Math.max(0, v - 18) * 0.09);   // directional only, at speed; the last 0.15 s is sharp
            if (mb > 0.4) { mbg.setAttribute("stdDeviation", mb.toFixed(2) + " 0"); wrap.style.filter = "url(#mbx)"; }
            else wrap.style.filter = (t > X0 && t < X1) ? "blur(" + (6 * seg(t, X0, X1)).toFixed(2) + "px)" : "";
            if (on) coin.render(coinAt(t));
          }

          // layered type, the coin over the handle's root and the bloom are intentional overlaps
          [wm].concat(Array.from(wm.querySelectorAll("*"))).forEach((nd) => ["occlusion", "overlap", "overflow"].forEach((k) => nd.setAttribute("data-layout-allow-" + k, "")));
          const tl = gsap.timeline({ paused: true });
          Look.drive(tl, 0, T.end, (p) => renderAt(p * T.end));
          window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") renderAt(e.detail.time); });

          // ---------- text out: characters spring out from under the coin, nearest first ----------
          // the handle is one strip that pulls out from under the coin (masked at the coin's centre line), no per-letter wobble
          function textOut(X, at) {
            tl.set(X.pairs.flat(), { opacity: 1 }, at);
            tl.fromTo([X.back, X.front], { x: X.sx }, { x: 0, duration: 0.46, ease: "expo.out", immediateRender: false }, at);
            Look.mblur(tl, X.el, at, 0.3, { x: 12, ease: "power2.out" });
          }
          function textIn(X, at) {
            tl.fromTo([X.back, X.front], { x: 0 }, { x: X.sx, duration: 0.3, ease: "power3.in", immediateRender: false }, at);
            Look.mblur(tl, X.el, at + 0.1, 0.2, { x: 0, to: [10, 0], ease: "power2.in" });
            tl.set(X.pairs.flat(), { opacity: 0 }, at + 0.3);
          }
          function lightPass(X, at, dur, ltr) {
            const leaves = X.fr.filter((n) => !n.__at);
            Look.drive(tl, at, dur, (p) => {
              const k = Ez("power1.inOut")(p), c = (ltr ? -0.45 + 1.9 * k : 1.45 - 1.9 * k) * X.tw;
              leaves.forEach((n) => { n.style.backgroundPosition = (c - 0.6 * X.tw - n.__x) + "px 0px, " + (-n.__x) + "px 0px"; });
            });
            X.fr.forEach((n, i) => {                     // each glyph blooms warm as the light front reaches it
              const f = ltr ? X.frac[i] : 1 - X.frac[i], t = at + dur * (0.12 + 0.72 * f);
              tl.fromTo(n, { filter: "drop-shadow(0 0 0px rgba(255,214,128,0))" }, { filter: "drop-shadow(0 0 " + (C.text * 0.26).toFixed(1) + "px " + C.colors.glow + ")", duration: 0.08, ease: "power2.out", immediateRender: false }, t);
              tl.to(n, { filter: "drop-shadow(0 0 0px rgba(255,214,128,0))", duration: 0.3, ease: "power2.in" }, t + 0.1);
              tl.set(n, { filter: "none" }, t + 0.41);
            });
          }

          textOut(TA, T.in + 0.24);
          // payoff: the light comes off the coin and runs out along the handle
          lightPass(TA, P + 0.06, 0.62, K0.left);
          // dock: the whole mark settles into its corner at watermark strength
          tl.fromTo(wm, { scale: 1, opacity: 1 }, { scale: DS, opacity: C.hold, duration: 0.46, ease: "expo.inOut", immediateRender: false }, T.dock);
          // drift to the second corner: the handle tucks under the coin, the coin glides, the handle springs back out
          textIn(TA, T.drift);
          textOut(TB, D1 - 0.08);
          // exit: the handle tucks away, the coin turns edge-on into the corner
          textIn(TB, T.out);
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
</body>
</html>
