<!-- 07 Hit transitions, variant B: "Vertical pack" (9:16, 1080x1920, 30 fps, 7.07 s).
     Five GTA V shots: slide-split (1.40), VHS colour-bar tear (2.80), zoom-through punch (4.20), flash hit (5.40, payoff), then a 1.3 s settled hold.
     Full-kind component: the transitions are treatments of the footage, so bg "none" keeps the footage.
     The slide-split is DOM. From 2.67 on, a WebGL pass (#fx) draws the frame from the injected video frames: a VHS signal model
     (line jitter, tears, chroma bleed and offset, noise, tracking bar, SMPTE bars), a true 48-tap radial shutter blur, and the flash
     (the sun's own glare on the tower's glass blooms into the cut; on the bridge's first 3 frames an exposure punch keyed to the
     skyline's tall tower: a white-hot crown, the skyline and lit steel punching with a fast falloff, blacks pinned, the sky held by a
     rotoscoped skyline matte, under a punch and shake, then a clean release into the hold).
     Everything is driven by one pure function of timeline time (seek-safe). See ../README.md. -->

          const env = f < 3 ? 1 - 0.08 * f : Math.pow(1 - (f - 2) / (nF - 2), 2), s = f % 2 ? 1 : -1; // full swing for the first frames, then decays
          return [s * (0.55 + 0.45 * Look.hash(f * 3 + 21)) * F.ampX * env, -s * (0.35 + 0.65 * Look.hash(f * 3 + 22)) * F.ampY * env,
                  (Look.hash(f * 3 + 23) * 2 - 1) * F.rot * env];
        };
        // keep the shake inside the punch's overscan, so the frame edge never shows: the punch scales about F.centre, so the margin
        // differs per side (lo = towards 0, hi = towards the far edge); 12 px are left for the roll
        const inFrame = (v, S, c, size) => Math.max(Math.min(0, -(S - 1) * (size - c) + 12), Math.min(Math.max(0, (S - 1) * c - 12), v));
        const fx = makeFX($("fx"), W, Hh);

        function fxState(t) {
          if (t < V.start - 1e-4) return null; // the DOM slide-split rig owns the frame until the tear starts (identical state at the handoff)
          const u = U0(W, Hh); u.uFrame = Math.round(t * 30);
          const vf = Math.round((t - V.start) * 30);
          if (vf < V.frames.length) {
            // ---- VHS colour-bar tear: one signal-model frame per entry ----
            const fr = V.frames[vf], pick = (k) => (k === "a" ? [vids.s2a, yS(t)] : [vids.s3, dS(t)]);
            u.uVhs = 1;
            if (fr.a === "bars") u.uSrc = 2; else { const pk = pick(fr.a); u.tex = pk[0]; u.uS = pk[1]; }
            if (fr.b) { if (fr.b === "bars") u.uSrc2 = 2; else { const pk = pick(fr.b); u.tex2 = pk[0]; u.uS2 = pk[1]; } u.uRowMix = fr.mix || 0; }
            u.uJit = fr.jit; u.uSine = fr.sine; u.uTear = fr.tear; u.uNoise = fr.noise; u.uBleed = fr.bleed; u.uBleedOff = fr.off;
            u.uTrackY = fr.trackY; u.uTrackA = fr.trackA; u.uScan = fr.scan;
            return u;
          }
          if (t < Z.at) {
            // ---- Deluxo: slow push, then it accelerates into the lens (radial shutter blur, barrel lens, edge chroma) ----
            const S = dS(t), Sp = dS(t - FR), e = E3i(seg(t, Z.at - Z.outDur, Z.at));
            u.tex = vids.s3; u.uS = S; u.uS0 = S - (S - Sp) * Z.shutter; u.uTaps = e > 0 && S - Sp > 0.002 ? Z.taps : 1;
            u.uLens = Z.lens * e; u.uChroma = Z.chroma * e; u.uContrast = 1 + (Z.contrast - 1) * e; u.vig = Z.edgeDark * e; u.bloom = Z.bloom * e; u.bloomTh = 0.72;
            return u;
          }
          if (t < F.at) {
            // ---- glass tower: lands out of the lens, slow push, then the flash build: the sun's own glare on the lower glass blooms
            //      and the highlights lift (a fast attack that stays under the peak) under a radial suck-in ----
            const S = bS(t), landing = t < Z.at + Z.inDur, build = E2i(seg(t, F.at - F.build, F.at));
            u.tex = vids.s4; u.uS = S;
            u.uS0 = landing ? S + (S - bS(t + FR)) * Z.shutter : S - (S - bS(t - FR)) * F.buildShutter;
            u.uTaps = Math.abs(u.uS0 - S) > 0.002 ? Z.taps : 1;
            const li = 1 - EXo(seg(t, Z.at, Z.at + Z.lensIn));
            u.uLens = Z.lens * li; u.uChroma = Z.chroma * li; u.uContrast = 1 + (Z.contrast - 1) * li; u.vig = Z.edgeDark * li;
            u.uBright = 1 + F.buildGain * build; u.uHiLift = F.buildLift * build; u.uHiKey = 0.55; u.uWarm = F.warm; u.uWarmAmt = build;
            u.bloom = Math.max(Z.bloom * li, F.buildBloom * build); u.bloomTh = build > 0.001 ? F.buildTh : 0.72; u.bloomTint = [1, 0.92, 0.78];
            u.knee = F.knee; u.kneeAmt = build;
            return u;
          }
          // ---- flash hit (payoff): the peak lands on the bridge's first frames, held 3 frames, then releases to a clean hold ----
          const uF = t - F.at, f = Math.floor(uF * 30 + 1e-6), S = pS(t);
          const sh0 = shakeAt(f), pr0 = shakeAt(f - 1), Sp = pS(t - FR);
          const cx = F.centre[0], cy = F.centre[1];
          const sh = [inFrame(sh0[0], S, cx, W), inFrame(sh0[1], S, cy, Hh), sh0[2]], pr = [inFrame(pr0[0], Sp, cx, W), inFrame(pr0[1], Sp, cy, Hh)];
          u.tex = vids.s5; u.uS = S; u.uC = F.centre; u.uChromaC = F.centre; u.uS0 = S + (S - pS(t + FR)) * F.punchShutter;
          u.uT = [sh[0], sh[1]]; u.uT0 = [sh[0] + (pr[0] - sh[0]) * F.shakeBlur, sh[1] + (pr[1] - sh[1]) * F.shakeBlur]; u.uRot = sh[2] * Math.PI / 180;
          u.uTaps = Math.abs(u.uS0 - S) > 0.002 || Math.abs(pr[0] - sh[0]) + Math.abs(pr[1] - sh[1]) > 0.5 ? 32 : 1;
          // the peak holds on frames 0..hold-1 (easing slightly within the hold, so it stays alive), then releases over `decay`
          const h0 = (F.hold - 1) / 30, pk = F.peak[F.hold - 1], k = f < F.hold ? F.peak[Math.max(0, f)] : pk * (1 - E2o(seg(uF, h0, h0 + F.decay)));
          // light added from the footage itself: full gain plus a highlight lift on the tower core, a toe-pinned floor elsewhere (blacks
          // stay black), extra contrast, a warm bloom keyed off the core, and a filmic shoulder so the core rolls off to white
          u.uBright = 1 + (F.gain - 1) * k; u.uHot = F.hot; u.uHotFall = F.hotFall; u.uFloor = F.floor; u.uFloorR = F.floorR; u.uFloorV = F.floorV; u.uToe = F.toe;
          u.uZone = F.zone; u.uArchY = F.archY; u.uOwnKey = F.ownKey; u.uSkyDim = F.skyDim * k; u.uSat = 1 + (F.sat - 1) * k;
          u.uHiLift = F.lift * k; u.uHiKey = F.key; u.uWarm = F.warm; u.uWarmAmt = k; u.uContrast = 1 + (F.contrast - 1) * k;
          u.bloom = F.bloom * k; u.bloomTh = F.bloomTh; u.skyRej = F.skyRej; u.bloomTint = [1, 0.9, 0.74]; u.bloomStep = F.bloomStep;
          u.knee = F.knee; u.kneeAmt = k;
          u.uChroma = uF < F.chromaDur ? F.chroma * (1 - E2o(uF / F.chromaDur)) : 0;
          return u;
        }
        function drawFX(t) { if (!fx) return; const u = fxState(t); if (u) fx.draw(u); else fx.clear(); }

        function render(t) {
          // ---- slide-split (DOM): three slabs of shot 2 slide in from alternating sides over the receding shot 1 ----
          const S = C.split;
          el.L1.style.transform = "scale(" + f3(1 + 0.05 * seg(t, 0, S.lock)) + ")";
          const rec = S.recede * E2o(seg(t, S.starts[0], S.lock));
          el.L1.style.filter = rec > 0.002 ? "brightness(" + f3(1 - rec) + ")" : "";
          // once every slab has landed, nothing needs the receding shot: drop it so it can never show through a slab edge
          el.L1.style.opacity = t >= Math.max(...S.starts) + S.dur ? "0" : "1";
          bands.forEach((b, k) => {
            const a = S.starts[k], dir = S.dirs[k], p = seg(t, a, a + S.dur);
            const x = dir * W * (1 - EXo(p)), xp = dir * W * (1 - EXo(seg(t - FR, a, a + S.dur)));
            const sig = Math.min(S.maxBlur, S.blurPerPx * Math.abs(x - xp)), moving = p > 0 && p < 1;
            b.el.style.transform = "translateX(" + x.toFixed(1) + "px)";
            b.g.setAttribute("stdDeviation", sig.toFixed(1) + " 0");
            b.el.style.filter = moving && sig > 0.3 ? b.f : "";
            // a slab is a physical sheet: leading-edge shadow onto the shot it covers, a contact shadow dropped onto the slab below,
            // a lit leading edge and a lit top edge; all of it resolves to nothing as the slab locks into place
            const sh = moving ? S.shadow * (1 - p) : 0, dr = moving ? S.drop * Math.pow(1 - p, 0.8) : 0;
            b.sh.style.transform = "translateX(" + x.toFixed(1) + "px)";
            b.sh.style.boxShadow = sh > 0.01 ? (-dir * 46) + "px 0 90px 18px rgba(0,0,0," + f3(sh) + "), 0 24px 34px rgba(0,0,0," + f3(dr) + "), 0 -24px 34px rgba(0,0,0," + f3(dr) + ")" : "none";
            b.rim.style.transform = "translateX(" + (x + (dir > 0 ? -1 : W - 1)).toFixed(1) + "px)";
            b.rim.style.opacity = moving ? f3(S.rim * Math.pow(1 - p, 0.7)) : "0";
            b.rimh.style.opacity = moving ? f3(S.rimH * Math.pow(1 - p, 0.6)) : "0";
          });
          const u2 = t - S.lock;
          const kick = u2 >= 0 ? S.kick * (1 - EXo(seg(u2, 0, 0.35))) : 0;
          const tick = u2 >= 0 ? S.tick * (u2 < 2 / 30 ? 1 : 1 - E2o(seg(u2, 2 / 30, 0.3))) : 0;
          el.L2.style.transform = "scale(" + f3((1 + kick) * yS(t)) + ")";
          el.L2.style.filter = tick > 0.002 ? "brightness(" + f3(1 + tick) + ")" : "";
          // ---- everything from the tear on: the WebGL pass ----
          drawFX(t);
        }

        // Snap to the 30 fps grid: the runtime nudges seeks by ~1 ms, and a cut frame must never render its pre-cut state.
        const snap = (x) => Math.round(x * 30) / 30 + 1e-6;
        const tl = gsap.timeline({ paused: true });
        Look.drive(tl, 0, C.end, (p) => render(snap(p * C.end)));
        tl.set({}, {}, C.end);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        // the renderer injects each video frame after the timeline seek, then re-dispatches hf-seek: redraw then so the pass reads this frame's footage
        window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") drawFX(snap(e.detail.time)); });
        tl.seek(0);
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
