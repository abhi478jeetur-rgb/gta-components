<!doctype html>
<!-- 08 Title sting, variant A: "Chrome title (3D)". 16:9 1920x1080, 30 fps, 5.3 s.
     A Three.js extruded, bevelled metal title (deep blue anodised face, polished gold bevel) lit by a travelling key light,
     reflecting the footage behind it. The camera dollies from a raking close-up to the wide lockup while the letters slam
     forward onto their mark (per-letter overshoot + a hit), then a specular sweep runs across the metal and the gold bevel
     blooms (real HDR bloom, no sprite). Exit: the camera rushes through the gap between the lines into the next shot.
     Variable: bg "plate" / "none". This is a full-kind component: the footage always shows. See gta/DESIGN.md. -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="media/glyphs.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; background: #000;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push { position: absolute; inset: 0; }
      #grade { position: absolute; inset: -16px; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #gl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
      #ov { position: absolute; inset: 0; pointer-events: none; }
      .bar { position: absolute; left: 0; width: 100%; height: 132px; background: #000; }
      #barT { top: 0; } #barB { bottom: 0; }
      #dark { position: absolute; inset: 0; background: radial-gradient(ellipse 62% 48% at 50% 48%, rgba(0,0,0,.32) 0%, rgba(0,0,0,.18) 55%, rgba(0,0,0,0) 100%); }
      #kicker { position: absolute; left: 0; width: 100%; bottom: 54px; height: 30px; text-align: center; color: rgba(255,255,255,.92);
        font: 700 30px/30px "Inter"; letter-spacing: .28em; text-indent: .28em; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
      #kickIn { display: inline-block; }
      #kicker b { color: #F6C453; font-weight: 800; }
      #kicker i { font-style: normal; display: inline-block; padding: 0 .62em 0 .34em; color: rgba(255,255,255,.45); letter-spacing: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.3" data-width="1920" data-height="1080">
      <div id="shake">
        <div id="push"><div id="grade">
          <video id="shotA" class="clip shot" src="assets/shots/v07-biplane-sunset-h.mp4" muted playsinline data-start="0" data-duration="2.2" data-media-start="0" data-track-index="0"></video>
          <video id="shotB" class="clip shot" src="assets/shots/v47-gp-chiliad-aerial-h.mp4" muted playsinline data-start="2.2" data-duration="1.9" data-media-start="0" data-track-index="0"></video>
          <video id="shotC" class="clip shot" src="assets/shots/v37-tower-looking-up-h.mp4" muted playsinline data-start="4.1" data-duration="1.2" data-media-start="0" data-track-index="0"></video>
        </div></div>
        <div id="dark"></div>
        <canvas id="gl" width="1920" height="1080"></canvas>
      </div>
      <div id="ov" class="clip" data-start="0" data-duration="5.3" data-track-index="1">
        <div class="bar" id="barT"></div>
        <div class="bar" id="barB"><div id="kicker"></div></div>
      </div>
    </div>
    <script>
      const CONFIG = {
        // Title lines, top to bottom. Each line is justified to the same ink width (a poster lockup), so shorter lines set bigger.
        lines: ["THE CHILIAD", "MYSTERY"],
        tracking: 14,                   // extra letter spacing in font units (cap height = 688)
        kicker: "A GTA 5 INVESTIGATION<i>·</i><b>PART 1</b>",   // the credit line in the bottom letterbox bar ("" to hide)
        // Material: the blue anodised face (top -> bottom gradient) and the polished gold bevel / walls.
        face: ["#4594DC", "#2A6FB0", "#163A64"],
        bevel: "#EBB54C",
        // Footage (assets/shots or your own clip). Cuts are mirrored on the <video> tags above. "glow" is the light behind
        // the title (and its rim light) while that shot plays: pick it from the shot's own light so it never fights the plate.
        shots: [
          { id: "shotA", start: 0.0, dur: 2.2, glow: "#FFB15A" },   // sunset biplane: amber
          { id: "shotB", start: 2.2, dur: 1.9, glow: "#FFC98A" },   // Mount Chiliad from above: warm, so it sits with the gold
          { id: "shotC", start: 4.1, dur: 1.2, glow: "#9FD0FF" }    // the reveal shot after the exit: cool
        ],
        faceReflect: 0.15,                                         // how strongly the playing shot reflects in the blue faces
        rake: { power: 22, dur: 0.55 },                             // the payoff light raked across the bevels on the landing
        bloom: { strength: 0.6, threshold: 1.3, radius: 0.35 },   // HDR bloom on the hot metal (the bevel glint)
        timing: { land: 1.45, payoff: 1.5, kicker: 1.42, exit: 4.1, end: 5.3 }
      };

      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const T = CONFIG.timing, W = 1920, H = 1080, $ = (s) => document.querySelector(s);
        const F = window.TITLE_GLYPHS;
        const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
        const lerp = (a, b, p) => a + (b - a) * p;
        const smooth = (a, b, x) => { const p = clamp((x - a) / (b - a), 0, 1); return p * p * (3 - 2 * p); };
        const E = (name) => gsap.parseEase(name);
        const eIO = E("power3.inOut"), eExpoIn = E("expo.in"), eOut = E("power2.out"), eSine = E("sine.inOut");

        $("#kicker").innerHTML = '<span id="kickIn">' + CONFIG.kicker + "</span>";

        // ---------- renderer ----------
        const canvas = $("#gl");
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true, premultipliedAlpha: true });
        renderer.setPixelRatio(1);
        renderer.setSize(W, H, false);
        renderer.setClearColor(0x000000, 0);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.05;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 200);

        // ---------- HDR bloom (the glint comes from the metal itself, not a sprite) ----------
        // The scene renders linear HDR into an MSAA half-float target; a bright pass keeps only the hot metal (the alpha
        // weighting leaves the additive glow behind the title out), a 3-level gaussian chain spreads it, and the composite
        // adds it back, then applies ACES + sRGB once. Alpha stays the title's, so bloom outside the letters adds over the DOM.
        const BLOOM_OK = renderer.capabilities.isWebGL2 && renderer.extensions.has("EXT_color_buffer_float");
        const rtMain = new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 });
        const RTO = { type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false };
        const LV = [2, 4, 8].map((d) => [new THREE.WebGLRenderTarget(W / d, H / d, RTO), new THREE.WebGLRenderTarget(W / d, H / d, RTO)]);
        const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), postScene = new THREE.Scene();
        const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2)); quad.frustumCulled = false; postScene.add(quad);
        const VS = "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }";
        const post = (u, fs, extra) => new THREE.ShaderMaterial(Object.assign({ uniforms: u, vertexShader: VS, fragmentShader: fs, depthTest: false, depthWrite: false, blending: THREE.NoBlending }, extra || {}));
        const brightMat = post({ tSrc: { value: null }, uTh: { value: 1.3 }, uKnee: { value: 0.7 } }, [
          "uniform sampler2D tSrc; uniform float uTh, uKnee; varying vec2 vUv;",
          "void main(){ vec4 c = texture2D(tSrc, vUv); float l = max(c.r, max(c.g, c.b));",
          "  float k = smoothstep(uTh, uTh + uKnee, l); gl_FragColor = vec4(c.rgb * k * c.a, 1.0); }"].join("\n"));
        const blurMat = post({ tSrc: { value: null }, uDir: { value: new THREE.Vector2() } }, [
          "uniform sampler2D tSrc; uniform vec2 uDir; varying vec2 vUv;",
          "void main(){ vec3 c = texture2D(tSrc, vUv).rgb * 0.2270270270;",
          "  c += (texture2D(tSrc, vUv + uDir * 1.3846153846).rgb + texture2D(tSrc, vUv - uDir * 1.3846153846).rgb) * 0.3162162162;",
          "  c += (texture2D(tSrc, vUv + uDir * 3.2307692308).rgb + texture2D(tSrc, vUv - uDir * 3.2307692308).rgb) * 0.0702702703;",
          "  gl_FragColor = vec4(c, 1.0); }"].join("\n"));
        const compMat = post({ tMain: { value: null }, t1: { value: null }, t2: { value: null }, t3: { value: null }, uStr: { value: 0.7 }, uW: { value: new THREE.Vector3(1, 0.7, 0.5) } }, [
          "uniform sampler2D tMain, t1, t2, t3; uniform float uStr; uniform vec3 uW; varying vec2 vUv;",
          "void main(){ vec4 m = texture2D(tMain, vUv);",
          "  vec3 b = texture2D(t1, vUv).rgb * uW.x + texture2D(t2, vUv).rgb * uW.y + texture2D(t3, vUv).rgb * uW.z;",
          "  gl_FragColor = vec4(m.rgb + b * uStr, m.a);",
          "  #include <tonemapping_fragment>",
          "  #include <colorspace_fragment>",
          "}"].join("\n"), { toneMapped: true });
        function runPass(mat, target) { quad.material = mat; renderer.setRenderTarget(target); renderer.render(postScene, postCam); }
        function renderFrame(bloomStr) {
          if (!BLOOM_OK) { renderer.setRenderTarget(null); renderer.render(scene, camera); return; }
          renderer.setRenderTarget(rtMain); renderer.render(scene, camera);
          brightMat.uniforms.tSrc.value = rtMain.texture; runPass(brightMat, LV[0][0]);
          let src = LV[0][0];
          LV.forEach(([A, B], i) => {   // H into B (at this level's size), V back into A
            blurMat.uniforms.tSrc.value = src.texture; blurMat.uniforms.uDir.value.set(1 / A.width, 0); runPass(blurMat, B);
            blurMat.uniforms.tSrc.value = B.texture; blurMat.uniforms.uDir.value.set(0, 1 / A.height); runPass(blurMat, A);
            src = A;
          });
          const r = CONFIG.bloom.radius;
          compMat.uniforms.tMain.value = rtMain.texture;
          compMat.uniforms.t1.value = LV[0][0].texture; compMat.uniforms.t2.value = LV[1][0].texture; compMat.uniforms.t3.value = LV[2][0].texture;
          compMat.uniforms.uW.value.set(1, 0.2 + r, r);
          compMat.uniforms.uStr.value = bloomStr;
          runPass(compMat, null);
        }

        // ---------- the environment: a live PMREM of a little studio that holds the footage ----------
        // A banded studio dome (alternating dark-bronze and hot-cream bands, so polished gold always shows contrast, on any
        // shot), the current footage frame on a band in front of the title (behind the camera, so the faces reflect the shot),
        // and a top softbox.
        const envScene = new THREE.Scene();
        const dome = new THREE.Mesh(new THREE.SphereGeometry(60, 48, 24), new THREE.ShaderMaterial({
          side: THREE.BackSide, depthWrite: false,
          vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
          fragmentShader: [
            "varying vec3 vP;",
            "void main(){",
            "  float y = vP.y;",
            "  vec3 dark = vec3(0.023, 0.010, 0.002);",            // #2A1A08
            "  vec3 hot = vec3(1.0, 0.88, 0.56) * 1.25;",            // #FFF1C4, a little over 1
            "  float f = 0.5 + 0.5 * sin(y * 11.0 + vP.x * 1.7 + 0.8);",
            "  float band = smoothstep(0.42, 0.62, f) * (0.55 + 0.45 * smoothstep(-0.6, 0.4, y));",
            "  vec3 c = mix(dark, hot, band);",
            "  c = mix(c, dark * 0.5, smoothstep(-0.2, -0.85, y));",  // a dark floor
            "  gl_FragColor = vec4(c, 1.0);",
            "}"
          ].join("\n")
        }));
        envScene.add(dome);
        // the footage frame is copied into a fixed 480x270 canvas each frame, so the GPU texture never changes size or source
        const footCanvas = document.createElement("canvas"); footCanvas.width = 480; footCanvas.height = 270;
        const footCtx = footCanvas.getContext("2d");
        const footTex = new THREE.CanvasTexture(footCanvas);
        footTex.colorSpace = THREE.SRGBColorSpace;
        footTex.minFilter = THREE.LinearFilter; footTex.generateMipmaps = false;
        const footMat = new THREE.MeshBasicMaterial({ map: footTex, side: THREE.BackSide, color: new THREE.Color(1.6, 1.6, 1.6) });
        // only the 120 degrees in front of the title (theta 0 = +z): the walls keep reflecting the banded studio
        const footBand = new THREE.Mesh(new THREE.CylinderGeometry(40, 40, 30, 32, 1, true, -Math.PI / 3, 2 * Math.PI / 3), footMat);
        footBand.position.y = 4;
        envScene.add(footBand);
        const hdr = (r, g, b) => new THREE.MeshBasicMaterial({ color: new THREE.Color(r, g, b), side: THREE.DoubleSide });
        const softTop = new THREE.Mesh(new THREE.PlaneGeometry(26, 9), hdr(3.2, 3.1, 3.0));
        softTop.position.set(0, 26, 10); softTop.lookAt(0, 0, 0);
        envScene.add(softTop);
        const pmrem = new THREE.PMREMGenerator(renderer);
        let envRT = null;

        // ---------- lights ----------
        const key = new THREE.DirectionalLight(0xfff0dc, 2.4); scene.add(key);
        const rim = new THREE.DirectionalLight(new THREE.Color(CONFIG.shots[0].glow), 1.6); rim.position.set(0, 6, -9); scene.add(rim);
        const hemi = new THREE.HemisphereLight(0xa9c4ff, 0x2a1c10, 0.85); scene.add(hemi);


        // ---------- materials ----------
        function faceTexture() {
          const c = document.createElement("canvas"); c.width = 64; c.height = 512;
          const x = c.getContext("2d"), g = x.createLinearGradient(0, 0, 0, 512);
          g.addColorStop(0, CONFIG.face[0]); g.addColorStop(0.42, CONFIG.face[1]); g.addColorStop(1, CONFIG.face[2]);
          x.fillStyle = g; x.fillRect(0, 0, 64, 512);
          for (let i = 0; i < 512; i += 2) {   // fine brushed streaks (deterministic)
            const v = Look.hash(i * 7 + 3);
            x.fillStyle = v > 0.5 ? "rgba(255,255,255," + ((v - 0.5) * 0.035).toFixed(3) + ")" : "rgba(0,0,0," + ((0.5 - v) * 0.045).toFixed(3) + ")";
            x.fillRect(0, i, 64, 1);
          }
          const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
        }
        // The face also carries the playing shot as a moving reflection: the current frame, looked up along the view-space
        // reflection vector plus the mirrored screen position (so it slides as the camera moves), screen-blended at
        // CONFIG.faceReflect.
        const FOOT = { tex: { value: footTex }, amt: { value: CONFIG.faceReflect }, res: { value: new THREE.Vector2(W, H) } };
        function addFootReflection(mat) {
          mat.onBeforeCompile = (sh) => {
            sh.uniforms.uFoot = FOOT.tex; sh.uniforms.uFootAmt = FOOT.amt; sh.uniforms.uRes = FOOT.res;
            sh.fragmentShader = "uniform sampler2D uFoot; uniform float uFootAmt; uniform vec2 uRes;\n" + sh.fragmentShader.replace("#include <opaque_fragment>",
              "  { vec3 rv = reflect(-normalize(vViewPosition), normal);\n" +
              "    vec2 sp = gl_FragCoord.xy / uRes;\n" +
              "    vec2 fuv = vec2(0.5) + (sp - 0.5) * vec2(-0.75, 0.75) + rv.xy * vec2(-0.9, 0.9);\n" +
              "    vec3 fr = texture2D(uFoot, clamp(fuv, 0.0, 1.0)).rgb * (0.35 + 1.3 * diffuseColor.rgb);\n" +
              "    outgoingLight += fr * uFootAmt * (1.0 - clamp(outgoingLight, 0.0, 1.0)); }\n#include <opaque_fragment>");
          };
          return mat;
        }
        // The payoff light lives in the gold only: a hot light raked across in front of the title on the landing (a
        // Blinn-Phong lobe from a moving point), so each bevel and wall flares in turn, left to right, and the HDR bloom
        // carries the flare. The blue faces don't catch it, so there is no hotspot blob on the faces.
        const RAKE = { pos: { value: new THREE.Vector3(-99, 0, 0) }, amt: { value: 0 } };
        const goldMat = new THREE.MeshPhysicalMaterial({ color: new THREE.Color(CONFIG.bevel), metalness: 1, roughness: 0.15, envMapIntensity: 1.5, side: THREE.DoubleSide });
        goldMat.onBeforeCompile = (sh) => {
          sh.uniforms.uRakePos = RAKE.pos; sh.uniforms.uRakeAmt = RAKE.amt;
          sh.vertexShader = "varying vec3 vWP;\n" + sh.vertexShader.replace("#include <worldpos_vertex>",
            "#include <worldpos_vertex>\n  vWP = (modelMatrix * vec4(transformed, 1.0)).xyz;");
          sh.fragmentShader = "varying vec3 vWP; uniform vec3 uRakePos; uniform float uRakeAmt;\n" + sh.fragmentShader.replace("#include <opaque_fragment>",
            "  { vec3 Nw = normalize(inverseTransformDirection(normal, viewMatrix));\n" +
            "    vec3 Lr = uRakePos - vWP; float d2 = dot(Lr, Lr); Lr = normalize(Lr);\n" +
            "    vec3 Hh = normalize(Lr + normalize(cameraPosition - vWP));\n" +
            "    float wx = (vWP.x - uRakePos.x) / 1.7;\n" +
            "    float sp = pow(max(dot(Nw, Hh), 0.0), 90.0) * exp(-wx * wx) / (1.0 + 0.03 * d2);\n" +
            "    outgoingLight += mix(diffuseColor.rgb, vec3(1.0), 0.4) * sp * uRakeAmt; }\n#include <opaque_fragment>");
        };

        // ---------- the title: traced Archivo outlines, kerned, extruded with a rounded bevel ----------
        function glyphShapes(d, ox, oy, s) {
          const sp = new THREE.ShapePath(); const re = /([MLQCZ])([^MLQCZ]*)/g; let m;
          while ((m = re.exec(d))) {
            const n = m[2].trim() ? m[2].trim().split(/[\s,]+/).map(Number) : [];
            const P = []; for (let i = 0; i < n.length; i += 2) P.push(ox + n[i] * s, oy - n[i + 1] * s);
            if (m[1] === "M") sp.moveTo(P[0], P[1]);
            else if (m[1] === "L") sp.lineTo(P[0], P[1]);
            else if (m[1] === "Q") sp.quadraticCurveTo(P[0], P[1], P[2], P[3]);
            else if (m[1] === "C") sp.bezierCurveTo(P[0], P[1], P[2], P[3], P[4], P[5]);
          }
          // Flatten each contour and drop points closer than MIN_SEG: TrueType outlines carry tiny curve segments that
          // would otherwise fold over when the bevel offsets the contour (torn faces on S / R).
          const clean = (pts) => {
            const out = [];
            for (const p of pts) if (!out.length || p.distanceTo(out[out.length - 1]) > MIN_SEG) out.push(p);
            while (out.length > 3 && out[0].distanceTo(out[out.length - 1]) <= MIN_SEG) out.pop();
            return out;
          };
          return sp.toShapes(false).map((sh) => {
            const s2 = new THREE.Shape(clean(sh.getPoints(CURVE_SEG)));
            sh.holes.forEach((h) => s2.holes.push(new THREE.Path(clean(h.getPoints(CURVE_SEG)))));
            return s2;
          });
        }
        function layoutLine(text) {   // pen positions in font units, ink box
          const out = []; let pen = 0;
          for (let i = 0; i < text.length; i++) {
            const ch = F.g[text[i]] ? text[i] : " ", g = F.g[ch];
            out.push({ ch, x: pen, g });
            pen += g[0] + (i < text.length - 1 ? (F.k[text[i] + text[i + 1]] || 0) + CONFIG.tracking : 0);
          }
          const ink = out.filter((o) => o.ch !== " ");
          return { glyphs: out, inkL: ink[0].x + ink[0].g[2], inkR: ink[ink.length - 1].x + ink[ink.length - 1].g[3] };
        }
        const TITLE_W = 16.0, GAP = 0.46, DEPTH = 0.78, BT = 0.12, BS = 0.105, MIN_SEG = 0.05, CURVE_SEG = 8;
        const lines = CONFIG.lines.map(layoutLine);
        lines.forEach((L) => { L.s = TITLE_W / (L.inkR - L.inkL); L.cap = F.cap * L.s; });
        const totalH = lines.reduce((a, L) => a + L.cap, 0) + GAP * (lines.length - 1);
        let yTop = totalH / 2;
        const title = new THREE.Group(); scene.add(title);
        const letters = [];
        lines.forEach((L, li) => {
          const base = yTop - L.cap; L.base = base; L.top = yTop;
          const ox0 = -TITLE_W / 2 - L.inkL * L.s;
          const tex = faceTexture();
          tex.repeat.set(1, 1 / L.cap); tex.offset.set(0, -base / L.cap);   // gradient runs baseline -> cap top on every line
          const faceMat = addFootReflection(new THREE.MeshPhysicalMaterial({ map: tex, metalness: 0.8, roughness: 0.22, clearcoat: 0.5, clearcoatRoughness: 0.08, envMapIntensity: 0.65 }));
          L.glyphs.forEach((G) => {
            if (G.ch === " ") return;
            const shapes = glyphShapes(G.g[1], ox0 + G.x * L.s, base, L.s);
            const geo = new THREE.ExtrudeGeometry(shapes, { depth: DEPTH, bevelEnabled: true, bevelThickness: BT, bevelSize: BS, bevelOffset: -BS, bevelSegments: 5, curveSegments: 1 });
            geo.computeBoundingBox();
            const bb = geo.boundingBox.clone(), cx = (bb.min.x + bb.max.x) / 2, cy = (bb.min.y + bb.max.y) / 2;
            geo.translate(-cx, -cy, -(DEPTH + BT));
            geo.computeVertexNormals();
            const mesh = new THREE.Mesh(geo, [faceMat, goldMat]);
            mesh.position.set(cx, cy, 0);
            mesh.userData = { line: li, ch: G.ch, cx, cy, x0: bb.min.x, y1: bb.max.y, i: letters.length };
            title.add(mesh); letters.push(mesh);
          });
          yTop = base - GAP;
        });
        const gapY = lines.length > 1 ? (lines[0].base + lines[1].top) / 2 : 0;
        // the landing: each letter winds back (WIND s, ZBACK units) and then slams forward onto its mark with an overshoot
        // (back.out 2.2, about 15% past the mark toward the camera), staggered 25 ms in reading order around T.land.
        const ZBACK = -3.2, WIND = 0.24, SLAM = 0.5, eLand = E("back.out(2.2)"), NL = letters.length;
        const hitAt = (i) => T.land + (i - (NL - 1) / 2) * 0.025;     // back.out(2.2) first reaches the mark at p = 0.3125
        const cLetter = letters.find((m) => m.userData.line === 0 && m.userData.ch === "C") || letters[Math.min(4, letters.length - 1)];
        const focus0 = new THREE.Vector3(cLetter.userData.cx + 0.4, cLetter.userData.cy + 0.15, -0.2);

        // ---------- the glow behind (additive: it only adds light to the plate) ----------
        const glowMat = new THREE.ShaderMaterial({
          transparent: true, depthWrite: false,
          blending: THREE.CustomBlending, blendEquation: THREE.AddEquation,
          blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor, blendSrcAlpha: THREE.ZeroFactor, blendDstAlpha: THREE.OneFactor,
          uniforms: { uColor: { value: new THREE.Color(CONFIG.shots[0].glow) }, uAmp: { value: 0.5 } },
          vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
          fragmentShader: [
            "uniform vec3 uColor; uniform float uAmp; varying vec2 vUv;",
            "void main(){",
            "  vec2 p = (vUv - 0.5) * vec2(2.0, 2.0);",
            "  float r = length(p * vec2(1.0, 1.25));",
            "  float g = exp(-r * r * 3.2) * 0.85 + exp(-r * r * 14.0) * 0.5;",
            "  gl_FragColor = vec4(uColor * g * uAmp, 0.0);",
            "}"
          ].join("\n")
        });
        const glow = new THREE.Mesh(new THREE.PlaneGeometry(30, 12), glowMat);
        glow.position.set(0, 0, -3.2); scene.add(glow);

        // ---------- footage frame source (the framework's injected frame at render time, the <video> in preview) ----------
        function frameSource(t) {
          let s = CONFIG.shots[0];
          for (const sh of CONFIG.shots) if (t >= sh.start - 1e-4) s = sh;
          const v = document.getElementById(s.id); if (!v) return null;
          const img = v.nextElementSibling;
          if (img && img.classList && img.classList.contains("__render_frame__") && img.complete && img.naturalWidth > 0 && img.style.visibility !== "hidden") return img;
          if (v.readyState >= 2 && v.videoWidth > 0) return v;
          return null;
        }

        // ---------- camera path ----------
        const RUSH = 0.62, LIN = 0.7;          // LIN: share of linear progress (the dolly is still moving when it lands)
        const SET = { k: 5.0, w: 8.0 };        // the settle: a damped overshoot along the arrival velocity (about 1.5% past the mark)
        const P_END = new THREE.Vector3(0, 0.12, 20.4);
        const camPos = new THREE.Vector3(), camTgt = new THREE.Vector3();
        function bez(a, b, c, d, p, out) {
          const q = 1 - p;
          return out.set(
            q * q * q * a.x + 3 * q * q * p * b.x + 3 * q * p * p * c.x + p * p * p * d.x,
            q * q * q * a.y + 3 * q * q * p * b.y + 3 * q * p * p * c.y + p * p * p * d.y,
            q * q * q * a.z + 3 * q * q * p * b.z + 3 * q * p * p * c.z + p * p * p * d.z);
        }
        // a raking close-up across CHILIAD (readable from the first frames), pulling out and swinging round to the lockup
        const C0 = new THREE.Vector3(focus0.x + 3.6, focus0.y + 1.5, focus0.z + 8.0);
        const C1 = new THREE.Vector3(focus0.x + 6.8, focus0.y + 2.4, 9.5);
        const C2 = new THREE.Vector3(2.4, 1.0, 16.7);
        const V_END = P_END.clone().sub(C2).multiplyScalar(3 * LIN / T.land);   // camera velocity at the landing, units/s
        const TG0 = focus0.clone(), TG1 = new THREE.Vector3(0, 0, 0);
        function cameraAt(t) {
          let roll = 0, fov = 30;
          if (t < T.land) {
            const x = clamp(t / T.land, 0, 1), p = LIN * x + (1 - LIN) * eIO(x);   // moving from frame 1, still travelling as it lands
            bez(C0, C1, C2, P_END, p, camPos);
            camTgt.copy(TG0).lerp(TG1, E("power2.inOut")(clamp(t / (T.land * 0.9), 0, 1)));
            roll = lerp(-0.12, 0, E("power2.out")(clamp(t / T.land, 0, 1)));
          } else {
            const u = t - T.land;
            // the settle: the dolly carries past its mark (velocity-matched, peak about 0.13 s after landing) and settles back
            const g = Math.exp(-SET.k * u) * Math.sin(SET.w * u) / SET.w;
            const push = eSine(clamp(u / (T.exit - T.land), 0, 1));
            camPos.set(lerp(0, -0.35, push) + V_END.x * g, lerp(0.12, 0.02, push) + V_END.y * g, P_END.z + V_END.z * g - 1.45 * push);
            camTgt.set(lerp(0, -0.1, push), 0, 0);
            if (t > T.exit) {   // the rush through the gap between the lines
              const r = E("power3.in")(clamp((t - T.exit) / RUSH, 0, 1));
              camPos.set(lerp(camPos.x, 0, r), lerp(camPos.y, gapY, r), lerp(camPos.z, -4, r));
              camTgt.set(lerp(camTgt.x, 0, r), lerp(0, gapY, r), lerp(0, -12, r));
              fov = 30 + 22 * r;
            }
          }
          camera.fov = fov; camera.updateProjectionMatrix();
          camera.position.copy(camPos); camera.up.set(Math.sin(roll), Math.cos(roll), 0); camera.lookAt(camTgt);
        }

        // ---------- the glow colour follows the shot (a short blend after each cut) ----------
        const glowCols = CONFIG.shots.map((sh) => new THREE.Color(sh.glow || "#2EE6A6"));
        const glowNow = new THREE.Color();
        function glowAt(t) {
          let k = 0; CONFIG.shots.forEach((sh, i) => { if (t >= sh.start - 1e-4) k = i; });
          const blend = k > 0 ? smooth(0, 0.3, t - CONFIG.shots[k].start) : 1;
          return glowNow.copy(glowCols[Math.max(0, k - 1)]).lerp(glowCols[k], blend);
        }

        // ---------- per-frame render ----------
        function renderAt(t) {
          t = clamp(t, 0, T.end);
          cameraAt(t);
          // lights on: the scene exposes up from black in the first 0.3 s (the entrance is light + camera)
          const on = E("power2.out")(clamp(t / 0.3, 0, 1));
          renderer.toneMappingExposure = lerp(0.04, 1.05, on);
          // the landing: per-letter wind-back, then the slam with overshoot and a small tip forward as each one hits
          letters.forEach((m) => {
            const s0 = hitAt(m.userData.i) - 0.3125 * SLAM;
            let k;
            if (t < s0) k = eSine(clamp((t - (s0 - WIND)) / WIND, 0, 1));          // 0 -> 1: winding back
            else k = 1 - eLand(clamp((t - s0) / SLAM, 0, 1));                      // 1 -> 0 with overshoot: the slam
            m.position.z = ZBACK * k;
            m.rotation.x = -0.24 * k;
          });
          // the moving key: orbits left -> right across the run
          const ka = lerp(-1.05, 0.85, clamp(t / T.end, 0, 1));
          key.position.set(Math.sin(ka) * 10, 7, Math.cos(ka) * 10);
          key.intensity = 2.3;
          // the payoff: on the landing, a hot light rakes across in front of the title, left to right, low and close, so
          // each bevel flares in turn (the bloom carries the flare)
          const rp = clamp((t - T.payoff) / CONFIG.rake.dur, 0, 1), swp = rp > 0 && rp < 1 ? Math.sin(Math.PI * rp) : 0;
          RAKE.pos.value.set(lerp(-11, 11, E("sine.inOut")(rp)), 1.8, 2.6);
          RAKE.amt.value = CONFIG.rake.power * Math.pow(swp, 0.6);
          // footage reflected in the metal
          const src = frameSource(t);
          let drew = false;
          if (src) { try { footCtx.drawImage(src, 0, 0, 480, 270); drew = true; } catch (err) { drew = false; } }
          footTex.needsUpdate = true; footBand.visible = drew;
          const rt = pmrem.fromScene(envScene, 0.0, 0.1, 200);
          scene.environment = rt.texture;
          if (envRT) envRT.dispose();
          envRT = rt;
          // glow behind, in the shot's colour: breathes, swells on the payoff; the rim light takes the same colour.
          // It dies during the rush, before the camera reaches its plane (else the lens flies through it: a washed frame)
          const gc = glowAt(t);
          glowMat.uniforms.uColor.value.copy(gc); rim.color.copy(gc);
          glowMat.uniforms.uAmp.value = ((0.11 + 0.02 * Math.sin(t * 2.1)) * smooth(0.1, 1.2, t) + 0.16 * Math.exp(-Math.pow((t - T.payoff - 0.25) / 0.35, 2))) * (BLOOM_OK ? 1 : 3) * (1 - smooth(T.exit + 0.15, T.exit + 0.42, t));
          // bloom: steady on the hot bevel, pushed while the rake crosses the title
          const bs = CONFIG.bloom.strength * (1 + 0.5 * swp);
          brightMat.uniforms.uTh.value = CONFIG.bloom.threshold;
          renderFrame(bs);
          // exit: motion blur on the 3D layer as it rushes past, then it is gone (cut on the frame it clears the lens)
          const ex = clamp((t - T.exit - 0.3) / 0.3, 0, 1);
          canvas.style.filter = ex > 0 ? "blur(" + (22 * ex * ex).toFixed(2) + "px)" : "none";
          canvas.style.opacity = t >= T.exit + RUSH - 1 / 60 ? "0" : "1";
        }
        window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") renderAt(e.detail.time); });

        Promise.all(["700 30px Inter", "800 30px Inter"].map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
          const tl = gsap.timeline({ paused: true });
          Look.drive(tl, 0, T.end, (p) => renderAt(p * T.end));
          // footage grade: the plate keeps its blacks (contrast up, dimmed, defocused) behind the title, and clears to
          // full brightness / sharpness as the camera rushes out; the dark ellipse sits only behind the lockup
          const G0 = "brightness(0) contrast(1.15) saturate(1.15) blur(6px)", G1 = "brightness(0.68) contrast(1.15) saturate(1.15) blur(6px)", G2 = "brightness(1) contrast(1.04) saturate(1.06) blur(0px)";
          gsap.set("#grade", { filter: G1 });
          tl.fromTo("#grade", { filter: G0 }, { filter: G1, duration: 0.55, ease: "power2.out", immediateRender: true }, 0);
          tl.fromTo("#grade", { filter: G1 }, { filter: G2, duration: 0.5, ease: "power2.inOut", immediateRender: false }, T.exit + 0.2);
          tl.fromTo("#dark", { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power2.inOut", immediateRender: false }, T.exit + 0.2);
          Look.push(tl, "#push", 0, T.end, { from: 1.0, to: 1.06 });
          // the hit: the letters slam onto their mark (title and plate shake together)
          Look.impact(tl, T.land, { shake: "#shake", amp: 5, dur: 0.3, flash: 0, zoom: 1.012 });
          // ...and the plate takes a short exposure hit under it (held 3 frames; the plate is dimmed, so this never washes out)
          Look.expose(tl, T.land, { target: "#push", peak: 1.25, hold: 3 / 30, dur: 0.3, saturate: 1.08 });
          // letterbox bars retract as the sting hands off to the video; the kicker leaves with its bar
          tl.to("#barT", { y: -134, duration: 0.5, ease: "expo.inOut" }, T.exit + 0.26);
          tl.to("#barB", { y: 134, duration: 0.5, ease: "expo.inOut" }, T.exit + 0.26);
          // the kicker rises into its bar through a mask (no fade: it is fully opaque on every frame it shows)
          if (CONFIG.kicker) tl.fromTo("#kickIn", { yPercent: 135 }, { yPercent: 0, duration: 0.45, ease: "expo.out", immediateRender: true }, T.kicker);
          else $("#kicker").style.display = "none";
          Look.install(tl, { duration: T.end, grain: 0.06, vignette: 0.14 });
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
          renderAt(0);
        });
        renderAt(0);
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
</body>
