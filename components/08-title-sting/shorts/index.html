<!doctype html>
<!-- 08 Title sting, variant B: "Footage in letters". 9:16 1080x1920, 30 fps, 4.3 s.
     A huge stacked title on a black plate. LOS and SANTOS are hollow channel letters in real 3D (Three.js: the outlines
     extruded with a hard chamfer and the front left open), so each word has a lit lip and real walls and the GTA V footage
     is seen through them, sharp at 1:1 from the native 1920x1080 shot (one continuous framing behind both words).
     STORIES is a solid red chiselled slab, tilted back so its top chamfer catches the key. One raking key and one light rig
     light all three. The lines slam in; the cut to the last shot is the payoff (the lockup steps up, and one
     soft white band crosses LOS, SANTOS and the slab's top chamfer, with a bloom on the chrome lips only); then the letters open: the camera rushes through the "L" with a radial zoom blur and a
     2-frame exposure lift through the stem, and cuts clean onto the full-frame shot.
     Variable: bg "plate" / "none". Full-kind component: the footage always shows. See gta/DESIGN.md. -->

            <div class="vw" id="vw0"><video id="s0" class="clip" src="assets/shots/v44-bridge-skyline-h.mp4" muted playsinline data-start="0" data-duration="1.22" data-media-start="0.1" data-track-index="0"></video></div>

            <div class="vw" id="vw2"><video id="s2" class="clip" src="assets/shots/v07-biplane-sunset-h.mp4" muted playsinline data-start="2.42" data-duration="1.88" data-media-start="0.34" data-track-index="0"></video></div>

    <script>

          { text: "SANTOS", kind: "window" },
          { text: "STORIES", kind: "solid" }

        centerX: 504, centerY: 905,     // centre of the lockup

        frame: { color: "#CCD3DE", lip: 0.03, lipMin: 5, lipMax: 12, depth: 0.1, depthMin: 20, depthMax: 40 },
        // The solid line: a chiselled red slab in clear-coated lacquer (it reflects a studio: an overhead softbox, a strip

          { start: 2.42, tint: "#FFB45E", frame: { x: 1150, y: 580 }, cover: 1010,      // the biplane across mid-LOS, the ridge and power line in SANTOS (the payoff cut)

        ],
        windowGrade: { brightness: 1.1, contrast: 1.15, saturate: 1.25 },   // inside the letters; eases to neutral as they open
        // The beats on the cuts. punch: a transient kick that settles back; step: a state change, the lockup steps up and
        // stays (back.out(2.6) over 0.28 s); rake: the strength of one soft specular band (bandPx wide, feathered) that runs
        // left to right along the top chamfers in rakeDur s, peak held 3 frames; slabLag: STORIES lands that many seconds
        // after the window words (with a 0.9 -> 1 squash); shake: px.
        beats: [
          { at: 1.22, punch: 0.02, step: 0, rake: 0, slabLag: 0 },
          { at: 2.42, punch: 0, step: 0.07, rake: 2.2, slabLag: 1 / 30, shake: 3 }
        ],
        // the payoff band: px wide at half height, dur s to cross; slant: it leans so it crosses LOS, then SANTOS, then
        // STORIES; peak: [from, to] s at full strength; bloom: the chrome lips' glow (radius px, thresholded on the facets)
        band: { px: 150, sheen: 1.1, dur: 0.3, slant: 0.6, peak: [2.467, 2.533], bloom: 12 },
        // the hold's light: a broad, soft specular drift across the chrome lips (start, seconds, strength, px wide)
        drift: { from: 0.7, dur: 1.5, amt: 0.32, px: 220 },
        openOn: "L",                    // the letter the camera flies into when the title opens (first match in a window line)
        // blurPx: the zoom-blur streak on the stem's edges in the push-through; liftEV: the 2-frame stem exposure lift;
        // cover: the cut comes once the stem's opening covers this share of the frame width
        open: { blurPx: 11, liftEV: 0.35, cover: 0.6 },
        timing: { in: 0.1, stagger: 0.14, open: 3.14, openDur: 0.66, end: 4.3 }
      };

      (function () {
        const W = 1080, H = 1920, T = CONFIG.timing, F = window.TITLE_GLYPHS, $ = (s) => document.querySelector(s);
        const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

          stemU = Math.min(185, (gi[3] - gi[2]) * 0.47);   // the stem's width, font units

        }
        const accentLine = lines.find((L) => L.kind === "solid");
        const landAccent = accentLine ? T.in + lines.indexOf(accentLine) * T.stagger + 0.2 : T.in + 0.4;
        function shotIndex(t) { let k = 0; CONFIG.shots.forEach((sh, i) => { if (t >= sh.start - 1e-4) k = i; }); return k; }

        }
        // the lockup's scale about its centre: transient punches (settle back) x steps (the state change: it steps up and
        // stays). STORIES follows each beat slabLag later.
        function lockScale(t, slab) {
          let sc = lerp(1, 1 + CONFIG.grow, eSine(clamp((t - 0.5) / 2.4, 0, 1)));   // the hold's slow grow, about the centre
          for (const b of CONFIG.beats) {

        // the payoff light: one soft specular band (gaussian, px wide at half height), leaning so it crosses LOS, then
        // SANTOS, then STORIES' top chamfer; it rises to its peak, holds it 3 frames (band.peak), then falls
        const STACK_TOP = lines[0].top, STACK_DROP = lines[lines.length - 1].base - lines[0].top;

          return { x: lerp(CONFIG.centerX - CONFIG.width * 0.7, CONFIG.centerX + CONFIG.width * 0.7, eSine(dp)), amt: D.amt * Math.pow(Math.sin(Math.PI * dp), 0.7), w: D.px / 1.665 };

          }
