<!doctype html>
<!-- 09 Facecam frame, variant B "Stacked cam" (9:16, 1080x1920, 30 fps, 6.2 s).
     The Shorts layout: facecam band on top (0-800), gameplay below, joined by a physical seam: a bevelled gunmetal bar with a
     caption-yellow inlay (real Three.js geometry), and a glossy yellow name pill with a red LIVE plate on the seam. On the
     crash the cam takes over: the seam drops 160 px on a spring, the face punches in, the pill squashes on the landing, the
     inlay ignites from the pill outward and a light rakes the pill; then it all springs back to the dock line.
     Variable: bg "plate" (sample GTA V footage + facecam stand-in) / "none" (transparent overlay: seam, pill and their shadows
     only). See gta/DESIGN.md. -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="media/gloss3d.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #band { position: absolute; left: 0; top: 0; width: 1080px; overflow: hidden; background: #0b0c0f; z-index: 2; }
      #fcv { position: absolute; }
      #gp { position: absolute; left: 0; width: 1080px; overflow: hidden; background: #0b0c0f; z-index: 1; }
      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; top: 0; }
      #seam { position: absolute; left: 0; width: 1080px; z-index: 3; }
      .sh { position: absolute; left: 0; width: 1080px; }
      #pill { position: absolute; transform-origin: 50% 50%; will-change: transform; z-index: 4; }
      .pin { position: absolute; left: 0; top: 0; width: 0; height: 0; }
      .plateTxt { position: absolute; white-space: nowrap; line-height: 1; font-family: "Inter"; font-weight: 800; }
      #nameTxt { color: #14151A; letter-spacing: 0.02em; text-shadow: 0 1.5px 0 rgba(255,246,200,.55); }
      #liveTxt { color: #FFFFFF; letter-spacing: 0.06em; text-shadow: 0 -1px 0 rgba(90,0,8,.55), 0 1px 3px rgba(90,0,8,.35); }
      #liveDot { position: absolute; border-radius: 50%; background: radial-gradient(circle at 38% 34%, #ffffff 0%, #ffe9ea 45%, #ffc2c6 100%); }
      .mask { position: absolute; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.2" data-width="1080" data-height="1920">
      <div id="band">
        <video id="fcv" class="clip" src="assets/plates/facecam-sample.mp4" muted playsinline data-start="0" data-duration="6.2" data-media-start="0.4" data-track-index="1"></video>
      </div>
      <div id="gp"><div id="shake"><div id="push">
        <video id="shotA" class="clip shot" src="assets/shots/v57-gp-red-car-highway-h.mp4" muted playsinline data-start="0" data-duration="2.0" data-media-start="0" data-track-index="0"></video>
        <video id="shotB" class="clip shot" src="assets/shots/v56-gp-truck-crash-h.mp4" muted playsinline data-start="2.0" data-duration="2.7" data-media-start="0.1" data-track-index="0"></video>
        <video id="shotC" class="clip shot" src="assets/shots/v52-gp-police-bridge-h.mp4" muted playsinline data-start="4.7" data-duration="1.5" data-media-start="0.5" data-track-index="0"></video>
      </div></div></div>
      <div id="seam"><div class="sh" id="shTop"></div><div class="sh" id="shBot"></div></div>
      <div id="pill">
        <div class="pin" id="livePin"><div id="liveDot"></div><div class="plateTxt" id="liveTxt"></div></div>
        <div class="pin" id="namePin"><div class="mask" id="nameMask"><div class="plateTxt" id="nameTxt"></div></div></div>
      </div>
    </div>
    <script>
      const CONFIG = {
        name: "EVERESTCHRIS",            // the name pill
        live: "LIVE",                    // the badge on the pill ("LIVE" or "REC")
        seamY: 800,                      // facecam band 0-800 (42%), gameplay below
        reactY: 960,                     // on the reaction the cam takes over: the seam drops to 960 (50%)
        colors: { bar: "#4a4f58", inlay: "#FFD23C", pill: "#FFD23C", pillTop: "#FFE680", pillBot: "#F2AE14",
                  live: "#FF2E3A", liveTop: "#FF5A63", liveBot: "#C8102E" },
        facecam: { scale: 1.0, x: -395, y: 0, faceX: 935, faceY: 300, punch: 1.14 },  // 1920x1080 source at 1:1, face centred
        gameplay: { w: 1991, x: -455 },  // -h shots cover the 1080x1120 window at 1.04x
        timing: { seam: 0.3, pill: 0.55, live: 0.68, name: 0.6, react: 2.9, back: 4.25, out: 5.5, end: 6.2 }
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const T = CONFIG.timing, $ = (s) => document.querySelector(s), SY = CONFIG.seamY, DY = CONFIG.reactY - CONFIG.seamY;
        if (!plate) {
          document.querySelectorAll("video").forEach((v) => (v.style.display = "none"));
          $("#band").style.background = "transparent"; $("#gp").style.background = "transparent";
        }
        const band = $("#band"), gp = $("#gp"), fcv = $("#fcv"), F = CONFIG.facecam;
        band.style.height = SY + "px"; gp.style.top = SY + "px"; gp.style.height = (1920 - SY) + "px";
        Object.assign(fcv.style, { width: 1920 * F.scale + "px", height: 1080 * F.scale + "px", left: F.x + "px", top: F.y + "px" });
        document.querySelectorAll(".shot").forEach((v) => Object.assign(v.style, { width: CONFIG.gameplay.w + "px", height: (1920 - SY) + "px", left: CONFIG.gameplay.x + "px" }));

        const FACES = ["800 100px Inter", "900 100px Inter"];
        Promise.all(FACES.map((f) => document.fonts.load(f, "EVERESTCHRIS LIVE"))).then(() => document.fonts.ready).then(() => {
          // ---------- seam: a full-width bevelled gunmetal bar with a raised yellow inlay ----------
          const SH = 120, seam = $("#seam"); seam.style.top = (SY - SH / 2) + "px"; seam.style.height = SH + "px";
          Object.assign($("#shTop").style, { top: "4px", height: "40px", background: "linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.42))" });
          Object.assign($("#shBot").style, { top: "76px", height: "44px", background: "linear-gradient(180deg, rgba(0,0,0,.58), rgba(0,0,0,.22) 45%, rgba(0,0,0,0))" });
          const S = Gloss3D({ W: 1080, H: SH, pivot: [540, SH / 2], exposure: 1.05, env: { front: 0.6, top: 1.15 } });
          const barM = S.mat("metal", { color: CONFIG.colors.bar });
          const inlayM = S.mat("lacquer", { color: CONFIG.colors.inlay, toneMapped: false, glow: 0.1, specGain: 0.9 });
          S.add([-40, SH / 2 - 17, 1160, 34, 17], null, { mat: barM, z: 18, depth: 2, bt: 9, bs: 9, bseg: 7 });
          S.add([-40, SH / 2 - 6.5, 1160, 13, 6.5], null, { mat: inlayM, z: 21, depth: 1, bt: 3.5, bs: 3.5, bseg: 4 });
          seam.appendChild(S.canvas);

          // ---------- pill: a buckle on the seam. Gunmetal bezel, glossy yellow lacquer face, raised red LIVE chip ----------
          const nameTxt = $("#nameTxt"), liveTxt = $("#liveTxt"), dot = $("#liveDot"), pill = $("#pill");
          nameTxt.textContent = CONFIG.name; nameTxt.style.fontSize = "44px";
          liveTxt.textContent = CONFIG.live; liveTxt.style.fontSize = "26px";
          const nW = nameTxt.offsetWidth, lW = liveTxt.offsetWidth;
          const BZ = 10, PH = 104, FH = PH - 2 * BZ, LH = 56, dotD = 14, PAD = 34;
          const liveW = Math.round(16 + dotD + 10 + lW + 18), lx = BZ + 12, ly = (PH - LH) / 2;
          const nameX = lx + liveW + 22, PW = Math.round(nameX + nW + 32 + BZ);
          Object.assign(pill.style, { left: (540 - PW / 2) + "px", top: (SY - PH / 2) + "px", width: PW + "px", height: PH + "px" });
          const P = Gloss3D({ W: PW + 2 * PAD, H: PH + 2 * PAD, left: -PAD, top: -PAD, pivot: [PAD + PW / 2, PAD + PH / 2], exposure: 1.05, env: { front: 0.6, top: 1.15 } });
          const C = CONFIG.colors;
          const bezM = P.mat("metal", { color: C.bar });
          const pillM = P.mat("lacquer", { color: C.pill, toneMapped: false, glow: 0.04, specGain: 0.8,
            grad: { top: PAD + BZ + 6, bottom: PAD + PH - BZ - 6, colTop: C.pillTop, colBot: C.pillBot } });
          const liveM = P.mat("lacquer", { color: C.live, toneMapped: false, glow: 0.03, specGain: 0.7,
            grad: { top: PAD + ly + 4, bottom: PAD + ly + LH - 4, colTop: C.liveTop, colBot: C.liveBot } });
          P.add([PAD, PAD, PW, PH, PH / 2], null, { mat: bezM, z: 22, depth: 4, bt: 9, bs: 9, bseg: 7 });
          P.add([PAD + BZ, PAD + BZ, PW - 2 * BZ, FH, FH / 2], null, { mat: pillM, z: 31, depth: 3, bt: 7, bs: 7, bseg: 6 });
          const liveMesh = P.add([PAD + lx, PAD + ly, liveW, LH, LH / 2], null, { mat: liveM, z: 36, depth: 2, bt: 4, bs: 4, bseg: 5, origin: [PAD + lx + liveW / 2, PAD + PH / 2] });
          P.canvas.style.filter = "drop-shadow(0 6px 7px rgba(0,0,0,.45))";
          pill.insertBefore(P.canvas, $("#livePin"));
          // type placement (pill px); caps centred on the cap-height box
          const mask = $("#nameMask");
          Object.assign(mask.style, { left: (nameX - 4) + "px", top: (PH / 2 - 32) + "px", width: (nW + 8) + "px", height: "64px" });
          Object.assign(nameTxt.style, { left: "4px", top: (32 - 22 - 1) + "px" });
          Object.assign(dot.style, { width: dotD + "px", height: dotD + "px", left: (lx + 16) + "px", top: (PH / 2 - dotD / 2) + "px" });
          Object.assign(liveTxt.style, { left: (lx + 16 + dotD + 10) + "px", top: (PH / 2 - 13 - 0.5) + "px" });
          const pins = [{ el: $("#namePin"), x: PAD + nameX + nW / 2, y: PAD + PH / 2, z: 31 }, { el: $("#livePin"), mesh: liveMesh, at: T.live, x: PAD + lx + liveW / 2, y: PAD + PH / 2, z: 36 }];
          pins.forEach((q) => { q.el.style.transformOrigin = (q.x - PAD) + "px " + (q.y - PAD) + "px"; });
          // the LIVE chip pops in WITH its type: one spring drives the mesh scale and the pinned DOM scale
          const popS = (t, at) => (t < at ? 0 : t >= at + 0.5 ? 1 : 0.35 + 0.65 * (1 - Math.exp(-6 * (t - at) / 0.5) * Math.cos(6.2832 * 1.2 * (t - at) / 0.5) * (1 - (t - at) / 0.5)));

          // ---------- 3D state as a pure function of time ----------
          const clamp = (x, a, b) => Math.min(b, Math.max(a, x)), eIO = gsap.parseEase("power2.inOut"), eO = gsap.parseEase("expo.out"), eO3 = gsap.parseEase("power3.out");
          const wob = (t, t0, amp, decay, freq) => (t < t0 ? amp : amp * Math.exp(-decay * (t - t0)) * Math.cos(6.2832 * freq * (t - t0)));
          const LAND = T.react + 0.1;      // the dropping seam reaches its new line (the spring's first crossing)
          function glowAt(t) {             // inlay ignition: 1-frame attack on landing, 3-frame peak, settles hot, cools on the way back
            if (t < LAND - 1 / 30) return 0.1;
            const u = t - (LAND - 1 / 30);
            let g = u < 1 / 30 ? 0.1 + 2.3 * u * 30 : u < 4 / 30 ? 2.4 : 0.8 + 1.6 * Math.exp(-(u - 4 / 30) * 5);
            if (t >= T.back) g = 0.1 + (g - 0.1) * (1 - eO3(clamp((t - T.back) / 0.45, 0, 1)));
            return g;
          }
          function renderAt(t) {
            // seam: the draw-out front is a hot light at both tips; on landing a light front runs outward from the pill
            S.U.uSpecAbs.value = 1; S.U.uSpecDir.value.set(1, 0);
            const d = clamp((t - T.seam) / 0.5, 0, 1), r = clamp((t - LAND) / 0.45, 0, 1), x = clamp((t - (T.out + 0.12)) / 0.32, 0, 1);
            if (t >= LAND && r < 1) { S.U.uSpecX.value = -40 + 660 * eO3(r); S.U.uSpecAmp.value = 2.6 * (1 - r * r); S.U.uSpecW.value = 80; }
            else if (t >= T.seam && d < 1) { S.U.uSpecX.value = 540 * eO(d) - 18; S.U.uSpecAmp.value = 2.2 * (1 - d); S.U.uSpecW.value = 34; }
            else if (t >= T.out + 0.12 && x < 1) { S.U.uSpecX.value = 540 * (1 - gsap.parseEase("power3.in")(x)) - 18; S.U.uSpecAmp.value = 1.6 * x; S.U.uSpecW.value = 34; }
            else { S.U.uSpecAmp.value = 0; S.U.uSpecX.value = -1e5; }
            const glow = glowAt(t);
            inlayM.userData.G.uGlow.value = glow;
            S.render();
            // pill: lands tipped back and wobbles flat; the drop rocks it forward; one soft sweep after landing, one rake on the hit
            let rx = t < T.pill ? 0.32 : wob(t, T.pill, 0.32, 6.0, 1.4);
            let ry = t < T.pill ? 0 : wob(t, T.pill, -0.10, 5.5, 1.1);
            if (t >= T.react) { rx += wob(t, T.react, -0.2, 6.5, 1.5); ry += wob(t, T.react, 0.08, 6, 1.2); }
            if (t >= T.back) rx += wob(t, T.back, 0.12, 6.5, 1.5);
            P.group.rotation.set(rx, ry, 0);
            pins.forEach((q) => {
              const o = P.pinOffset(q.x, q.y, q.z), sc = q.mesh ? popS(t, q.at) : 1;
              if (q.mesh) { q.mesh.visible = sc > 0; q.mesh.scale.set(Math.max(sc, 1e-3), Math.max(sc, 1e-3), 1); q.el.style.visibility = sc > 0 ? "visible" : "hidden"; }
              q.el.style.transform = "translate(" + o[0].toFixed(2) + "px," + o[1].toFixed(2) + "px)" + (q.mesh ? " scale(" + Math.max(sc, 1e-3).toFixed(4) + ")" : "");
            });
            const s1 = clamp((t - (T.pill + 0.5)) / 0.7, 0, 1), s2 = clamp((t - LAND) / 0.42, 0, 1), dg = PW * 0.62;
            if (t >= LAND && s2 < 1) { P.U.uSpecX.value = -dg + 2 * dg * eIO(s2); P.U.uSpecAmp.value = 1.8 * Math.sin(Math.PI * s2); P.U.uSpecW.value = 70; }
            else if (t >= T.pill + 0.5 && s1 < 1) { P.U.uSpecX.value = -dg + 2 * dg * eIO(s1); P.U.uSpecAmp.value = 0.8 * Math.sin(Math.PI * s1); P.U.uSpecW.value = 70; }
            else { P.U.uSpecAmp.value = 0; P.U.uSpecX.value = -1e5; }
            pillM.userData.G.uGlow.value = 0.04 + (glow - 0.1) * 0.16;
            liveM.userData.G.uGlow.value = 0.03 + (glow - 0.1) * 0.12;
            P.render();
          }

          // ---------- timeline ----------
          const tl = gsap.timeline({ paused: true });
          const spring = (z, f) => (p) => (p >= 1 ? 1 : 1 - Math.exp(-z * p) * Math.cos(6.2832 * f * p) * (1 - p));
          // seam draws out from the centre
          gsap.set(seam, { clipPath: "inset(0px 540px 0px 540px)" });
          tl.fromTo(seam, { clipPath: "inset(0px 540px 0px 540px)" }, { clipPath: "inset(0px 0px 0px 0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, T.seam);
          // pill springs up out of the seam (opaque within one frame: no ghosting)
          gsap.set(pill, { scale: 0.3, opacity: 0, filter: "blur(10px)" });
          tl.fromTo(pill, { scale: 0.3 }, { scale: 1, duration: 0.75, ease: spring(5, 1.25), immediateRender: false }, T.pill);
          tl.set(pill, { opacity: 1 }, T.pill);
          tl.fromTo(pill, { filter: "blur(10px)" }, { filter: "blur(0px)", duration: 0.24, ease: "power2.out", immediateRender: false }, T.pill);
          tl.set(pill, { filter: "none" }, T.pill + 0.25);
          // type lands on the pill
          gsap.set(nameTxt, { yPercent: 120 });
          tl.fromTo(nameTxt, { yPercent: 120 }, { yPercent: 0, duration: 0.5, ease: "expo.out", immediateRender: false }, T.name);
          // LIVE dot breathes once a second and flares on the landing
          Look.drive(tl, T.live, T.out - T.live, (p) => {
            const t = T.live + p * (T.out - T.live), u = t - LAND;
            let a = 0.45 + 0.55 * (0.5 + 0.5 * Math.cos(6.2832 * ((t - T.live) % 1.0)));
            if (u >= 0) a = Math.max(a, u < 3 / 30 ? 2.2 : 0.6 + 1.6 * Math.exp(-(u - 3 / 30) * 6));
            dot.style.boxShadow = "0 0 " + (5 + 7 * a).toFixed(1) + "px rgba(255,255,255," + Math.min(1, 0.55 + 0.4 * a).toFixed(2) + "), 0 0 " + (10 + 14 * a).toFixed(1) + "px rgba(255,120,130," + Math.min(0.95, 0.4 + 0.45 * a).toFixed(2) + ")";
          });

          // ---------- the reaction: the cam takes over ----------
          // the seam drops 160 px with a spring (band grows over the gameplay), the face punches in, the pill squashes on the
          // landing and stretches back, the inlay ignites and a light front runs outward, the gameplay takes the hit
          const dropE = spring(6, 1.4), backE = spring(6.5, 1.25);
          tl.fromTo(band, { height: SY }, { height: SY + DY, duration: 0.6, ease: dropE, immediateRender: false }, T.react);
          tl.fromTo([seam, pill], { y: 0 }, { y: DY, duration: 0.6, ease: dropE, immediateRender: false }, T.react);
          tl.fromTo(band, { height: SY + DY }, { height: SY, duration: 0.65, ease: backE, immediateRender: false }, T.back);
          tl.fromTo([seam, pill], { y: DY }, { y: 0, duration: 0.65, ease: backE, immediateRender: false }, T.back);
          if (plate) {
            gsap.set(fcv, { transformOrigin: F.faceX + "px " + F.faceY + "px" });
            tl.fromTo(fcv, { scale: 1 }, { scale: F.punch, duration: 0.6, ease: dropE, immediateRender: false }, T.react);
            tl.fromTo(fcv, { scale: F.punch }, { scale: 1, duration: 0.65, ease: backE, immediateRender: false }, T.back);
            Look.impact(tl, LAND, { shake: "#shake", amp: 9, dur: 0.34, flash: 0, zoom: 1.03 });
          }
          // pill: inertia stretch while it is yanked down, squash on the landing, stretch on the rebound, settle
          tl.fromTo(pill, { scaleX: 1, scaleY: 1 }, { scaleX: 0.95, scaleY: 1.07, duration: 0.06, ease: "power2.out", immediateRender: false }, T.react);
          tl.fromTo(pill, { scaleX: 0.95, scaleY: 1.07 }, { scaleX: 1.12, scaleY: 0.82, duration: 0.07, ease: "power2.in", immediateRender: false }, T.react + 0.06);
          tl.fromTo(pill, { scaleX: 1.12, scaleY: 0.82 }, { scaleX: 0.96, scaleY: 1.08, duration: 0.11, ease: "power2.out", immediateRender: false }, T.react + 0.13);
          tl.fromTo(pill, { scaleX: 0.96, scaleY: 1.08 }, { scaleX: 1, scaleY: 1, duration: 0.45, ease: spring(5.5, 1.3), immediateRender: false }, T.react + 0.24);
          // and a softer squash when it lands back on the dock line
          tl.fromTo(pill, { scaleX: 1, scaleY: 1 }, { scaleX: 1.06, scaleY: 0.9, duration: 0.08, ease: "power2.in", immediateRender: false }, T.back + 0.08);
          tl.fromTo(pill, { scaleX: 1.06, scaleY: 0.9 }, { scaleX: 1, scaleY: 1, duration: 0.45, ease: spring(5.5, 1.3), immediateRender: false }, T.back + 0.16);

          // exit: pill folds into the seam, then the seam retracts to the centre; cut on zero
          tl.fromTo(pill, { scaleX: 1, scaleY: 1 }, { scaleX: 0.72, scaleY: 0.06, duration: 0.22, ease: "power3.in", immediateRender: false }, T.out);
          tl.fromTo(pill, { filter: "blur(0px)" }, { filter: "blur(6px)", duration: 0.22, ease: "power2.in", immediateRender: false }, T.out);
          tl.set(pill, { opacity: 0 }, T.out + 0.22);
          tl.fromTo(seam, { clipPath: "inset(0px 0px 0px 0px)" }, { clipPath: "inset(0px 540px 0px 540px)", duration: 0.32, ease: "power3.in", immediateRender: false }, T.out + 0.12);
          tl.set(seam, { opacity: 0 }, T.out + 0.44);

          if (plate) Look.push(tl, "#push", 0, T.end, { to: 1.035 });
          Look.drive(tl, 0, T.end, (p) => renderAt(p * T.end));
          renderAt(0);
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
</body>
</html>
