<!doctype html>
<!-- 10 Avatar cutout, variant B (9:16, 1080x1920, 30 fps, 6.2 s): "Mascot pop-up".
     The same illustrated presenter sticker for a Short: it rises from behind its cyan name blade at the bottom of the
     safe zone, says a line in a comic speech balloon, flips to a yellow SHOUT balloon with the shock face on the payoff,
     then drops back behind the blade. Variable bg: "plate" (sample GTA V footage) / "none" (transparent). -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="media/avatar.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ov { position: absolute; inset: 0; }
      #avClip { position: absolute; left: 0; top: 0; width: 1080px; overflow: hidden; }
      #avPos { position: absolute; will-change: transform; }
      #avSq { position: absolute; inset: 0; }
      #avSq svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
      #barWrap, #bubWrap { position: absolute; }
      #barIn, #bubIn { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
      .barName { position: absolute; white-space: nowrap; color: #fff; font-family: "Archivo"; font-weight: 900; font-stretch: 72%;
        letter-spacing: -0.01em; line-height: 1; paint-order: stroke fill; -webkit-text-stroke: 9px #15110E;
        text-shadow: 0 4px 0 rgba(10, 30, 40, .35); transform: skewX(-10deg); }
      .barTag { position: absolute; white-space: nowrap; color: #05384C; font-family: "Inter"; font-weight: 800; line-height: 1;
        letter-spacing: 0.01em; transform: skewX(-10deg); }
      #bubWin { position: absolute; overflow: hidden; }
      .bubLine { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; color: #15110E; font-family: "Archivo";
        font-weight: 900; font-stretch: 72%; letter-spacing: -0.015em; word-spacing: 0.16em; line-height: 1; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.2" data-width="1080" data-height="1920">
      <div id="shake"><div id="push">
        <video id="s1" class="clip shot" src="assets/shots/v11-yacht-v.mp4" muted playsinline data-start="0" data-duration="1.3" data-media-start="0.3" data-track-index="0"></video>
        <video id="s2" class="clip shot" src="assets/shots/v17-deluxo-sunset-v.mp4" muted playsinline data-start="1.3" data-duration="1.58" data-media-start="0" data-track-index="1"></video>
        <video id="s3" class="clip shot" src="assets/shots/v26-bridge-explosion-v.mp4" muted playsinline data-start="2.88" data-duration="1.68" data-media-start="0" data-track-index="2"></video>
        <video id="s4" class="clip shot" src="assets/shots/v36-hills-city-view-v.mp4" muted playsinline data-start="4.56" data-duration="1.64" data-media-start="0.2" data-track-index="3"></video>
      </div></div>
      <div id="ov" class="clip" data-start="0" data-duration="6.2" data-track-index="5">
        <div id="avClip"><div id="avPos"><div id="avSq"></div></div></div>
        <div id="barWrap"><div id="barIn"></div></div>
        <div id="bubWrap"><div id="bubIn"><div id="bubWin"><div class="bubLine" id="bub1"></div><div class="bubLine" id="bub2"></div></div></div></div>
      </div>
    </div>
    <script>
      const CONFIG = {
        name: "EVEREST",
        handle: "@everestchris6",
        line: "WAIT FOR IT…",                // the balloon line while talking
        shout: "NO WAY!!",                   // the SHOUT balloon on the payoff
        colors: {
          hoodie: ["#FFE58A", "#FFC93A", "#E0901A"], skin: ["#FFDCC2", "#F4BC94", "#D98B68"],
          hair: ["#6A432C", "#3C2518", "#22140C"], gear: ["#565F72", "#2B303B", "#171A21"],
          accent: "#33D6FF", rim: "#FFC27E", iris: ["#9A6236", "#40240F"]
        },
        bar: { colors: ["#B4F4FF", "#4CDDFF", "#16B0E4", "#0B8FC2"], w: 700, h: 82, nameSize: 70, tagSize: 29 },
        bubble: { x: 136, y: 320, w: 776, h: 268, lineSize: 116, shoutSize: 176, tail: [230, 330, 262, 340] },
        place: { scale: 0.95, x: 124, y: 706, barX: 88, barY: 1368 },
        talk: [[0.98, 2.40], [2.58, 3.08], [3.98, 4.80]],
        mood: [[0, "talk"], [2.52, "shock"], [3.92, "laugh"]],
        blinks: [1.86],
        glance: [1.40, 2.00],
        timing: { bar: 0.22, in: 0.36, bubble: 0.84, hit: 2.52, out: 5.0, end: 6.2 }
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const T = CONFIG.timing, PL = CONFIG.place, FPS = 30, $ = (s) => document.querySelector(s), $$ = (s) => Array.from(document.querySelectorAll(s));
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));

        const S = PL.scale;
        // the avatar lives behind the blade: clip it a little below the blade's top edge
        $("#avClip").style.height = (PL.barY + 6) + "px";
        const pos = $("#avPos");
        pos.style.left = (PL.x - 70 * S) + "px"; pos.style.top = (PL.y - 70 * S) + "px";
        pos.style.width = (740 * S) + "px"; pos.style.height = (1080 * S) + "px";
        $("#avSq").innerHTML = Avatar.build(CONFIG.colors);
        const B = CONFIG.bar, bw = $("#barWrap");
        bw.style.left = PL.barX + "px"; bw.style.top = PL.barY + "px"; bw.style.width = B.w + "px"; bw.style.height = B.h + "px";
        $("#barIn").innerHTML = Avatar.bar({ w: B.w, h: B.h, colors: B.colors, glossId: "barGloss" }) +
          '<div class="barName" id="barName"></div><div class="barTag" id="barTag"></div>';
        $("#barName").textContent = CONFIG.name; $("#barTag").textContent = CONFIG.handle;
        const U = CONFIG.bubble, bb = $("#bubWrap");
        bb.style.left = U.x + "px"; bb.style.top = U.y + "px"; bb.style.width = U.w + "px"; bb.style.height = U.h + "px";
        $("#bubIn").insertAdjacentHTML("afterbegin", Avatar.bubble({ w: U.w, h: U.h, r: 118, tail: U.tail }));
        const win = $("#bubWin");
        win.style.left = "30px"; win.style.top = "18px"; win.style.width = (U.w - 60) + "px"; win.style.height = (U.h - 36) + "px";
        $("#bub1").textContent = CONFIG.line; $("#bub2").textContent = CONFIG.shout;

        const FACES = ["900 100px Archivo", "800 100px Inter"];
        Promise.all(FACES.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
          const nm = $("#barName"), tg = $("#barTag");
          nm.style.fontSize = B.nameSize + "px"; tg.style.fontSize = B.tagSize + "px";
          const capN = B.nameSize * 0.70, capT = B.tagSize * 0.72;
          nm.style.left = "52px"; nm.style.top = (B.h / 2 - capN / 2 - B.nameSize * 0.155) + "px";
          const nW = nm.getBoundingClientRect().width;
          tg.style.left = (52 + nW + 22) + "px"; tg.style.top = (B.h / 2 - capT / 2 - B.tagSize * 0.16 + 3) + "px";
          if (!CONFIG.handle) tg.style.display = "none";
          // balloon lines: fit to the window, optically centred on the cap height
          const wh = U.h - 36, ww = U.w - 60;
          [["#bub1", U.lineSize], ["#bub2", U.shoutSize]].forEach(([id, size]) => {
            const n = $(id); n.style.fontSize = size + "px";
            const w = n.scrollWidth; if (w > ww - 20) { size = Math.floor(size * (ww - 20) / w); n.style.fontSize = size + "px"; }
            n.style.top = (wh / 2 - size * 0.70 / 2 - size * 0.155) + "px";
          });

          const tl = gsap.timeline({ paused: true });
          const pivotY = (((PL.barY + 6) - PL.y) / S + 70) * S;   // the clip line inside the sticker box
          gsap.set("#avSq", { transformOrigin: "50% " + pivotY + "px" });

          // ---------- blade slams in, then the avatar springs up from behind it ----------
          gsap.set("#barIn", { x: -860 });
          tl.fromTo("#barIn", { x: -860 }, { x: 0, duration: 0.46, ease: "back.out(1.25)", immediateRender: false }, T.bar);
          Look.mblur(tl, "#barIn", T.bar, 0.28, { x: 34 });
          gsap.set("#barGloss", { x: -120 });
          tl.fromTo("#barGloss", { x: -120 }, { x: B.w + 140, duration: 0.6, ease: "power2.inOut", immediateRender: false }, T.bar + 0.44);

          gsap.set("#avPos", { y: 800 });
          tl.fromTo("#avPos", { y: 800 }, { y: -40, duration: 0.30, ease: "power3.out", immediateRender: false }, T.in);
          tl.to("#avPos", { y: 0, duration: 0.55, ease: "elastic.out(1, 0.45)" }, T.in + 0.30);
          gsap.set("#avSq", { rotation: -8, scaleX: 0.92, scaleY: 1.10 });
          tl.fromTo("#avSq", { rotation: -8, scaleX: 0.92, scaleY: 1.10 }, { rotation: 2, scaleX: 1.05, scaleY: 0.94, duration: 0.30, ease: "power2.out", immediateRender: false }, T.in);
          tl.to("#avSq", { rotation: 0, scaleX: 1, scaleY: 1, duration: 0.6, ease: "elastic.out(1, 0.4)" }, T.in + 0.30);
          Look.mblur(tl, "#avPos", T.in, 0.26, { y: 22 });
          gsap.set("#avHair", { svgOrigin: "300 250", scaleY: 0.9 });
          tl.fromTo("#avHair", { scaleY: 0.9 }, { scaleY: 1.08, duration: 0.3, ease: "power2.out", immediateRender: false }, T.in + 0.1);
          tl.to("#avHair", { scaleY: 1, duration: 0.7, ease: "elastic.out(1, 0.35)" }, T.in + 0.4);
          ["#avStrL", "#avStrR"].forEach((id, i) => {
            gsap.set(id, { svgOrigin: (i ? 316 : 284) + " 624", rotation: 0 });
            tl.fromTo(id, { rotation: i ? -14 : 14 }, { rotation: 0, duration: 1.0, ease: "elastic.out(1, 0.3)", immediateRender: false }, T.in + 0.28);
          });

          // ---------- balloon pops out of its tail, words rise in ----------
          const tipX = U.tail[2] + 0, tipY = U.tail[3];
          gsap.set("#bubIn", { transformOrigin: tipX + "px " + tipY + "px", scale: 0, rotation: -7 });
          tl.fromTo("#bubIn", { scale: 0, rotation: -7 }, { scale: 1.07, rotation: 1.5, duration: 0.2, ease: "power3.out", immediateRender: false }, T.bubble);
          tl.to("#bubIn", { scale: 1, rotation: 0, duration: 0.5, ease: "elastic.out(1, 0.45)" }, T.bubble + 0.2);
          const w1 = Look.split("#bub1", { by: "words", mask: true });
          gsap.set(w1.inners, { yPercent: 115 });
          tl.fromTo(w1.inners, { yPercent: 115 }, { yPercent: 0, duration: 0.34, ease: "back.out(1.6)", stagger: 0.08, immediateRender: false }, T.bubble + 0.1);
          gsap.set("#bub2", { yPercent: 140 });
          gsap.set("#bubShout", { transformOrigin: "50% 50%", scale: 0 });
          gsap.set("#bubGloss", { x: -160 });

          // ---------- the face + pose: lip-sync, moods (talk / shock / laugh), blinks, glance, head motion (all from time) ----------
          const MOUTHS = ["avMA", "avMO", "avME", "avMC", "avMA", "avME", "avMO"];
          const mouthEls = {}; ["avMC", "avMA", "avMO", "avME", "avMS", "avML"].forEach((id) => (mouthEls[id] = $("#" + id)));
          const N = Math.round(T.end * FPS) + 1, mouthF = [], moodF = [];
          const moodAt = (name) => (CONFIG.mood.find((m) => m[1] === name) || [T.end])[0];
          const H = T.hit, L = moodAt("laugh");
          for (let f = 0; f < N; f++) {
            const t = f / FPS;
            let mood = "talk"; CONFIG.mood.forEach((m) => { if (t >= m[0]) mood = m[1]; }); moodF[f] = mood;
            let m = mood === "shock" ? "avMS" : (mood === "laugh" ? "avML" : "avMC");
            CONFIG.talk.forEach((w, wi) => {
              if (t >= w[0] && t < w[1]) {
                const k = Math.floor((f - Math.round(w[0] * FPS)) / 3);
                if (mood === "shock") m = (k % 3 === 2) ? "avMA" : "avMS";
                else if (mood === "laugh") m = (k % 2) ? "avME" : "avML";
                else { m = MOUTHS[Math.floor(Look.hash(k * 7 + wi * 131 + 3) * MOUTHS.length)]; if (k % 4 === 3) m = "avMC"; }
              }
            });
            mouthF[f] = m;
          }
          const eyes = { talk: $("#avEyesT"), shock: $("#avEyesS"), laugh: $("#avEyesL") };
          const brows = { talk: $("#avBrowsT"), shock: $("#avBrowsS"), laugh: $("#avBrowsL") };
          const lids = $("#avLids"), irises = $$("#avEyesT .avIris"), bob = $("#avBob");
          const armsS = $("#avArmsS"), armP = $("#avArmP"), armSL = $("#avArmSL"), armSR = $("#avArmSR");
          function face(t) {
            const f = Math.max(0, Math.min(N - 1, Math.round(t * FPS))), mood = moodF[f];
            for (const k in eyes) { const on = k === mood ? 1 : 0; eyes[k].style.opacity = on; brows[k].style.opacity = on; }
            for (const id in mouthEls) mouthEls[id].style.opacity = (id === mouthF[f]) ? 1 : 0;
            armsS.style.opacity = mood === "shock" ? 1 : 0; armP.style.opacity = mood === "laugh" ? 1 : 0;
            const blink = mood === "talk" && CONFIG.blinks.some((b) => f >= Math.round(b * FPS) && f < Math.round(b * FPS) + 3);
            lids.style.opacity = blink ? 1 : 0;
            // gaze: at the gameplay (right) by default, at the camera inside the glance window (2-frame move)
            const g0 = CONFIG.glance[0], g1 = CONFIG.glance[1];
            const gz = t < g0 ? 0 : t < g0 + 0.07 ? (t - g0) / 0.07 : t < g1 ? 1 : t < g1 + 0.07 ? 1 - (t - g1) / 0.07 : 0;
            irises.forEach((n) => n.setAttribute("transform", "translate(" + (-11 * gz).toFixed(2) + " " + (-2 * gz).toFixed(2) + ")"));
            const talking = CONFIG.talk.some((w) => t >= w[0] && t < w[1]);
            const lift = talking && mood === "talk" ? -5 * Math.max(0, Math.sin(t * Math.PI * 2 * 1.3)) : 0;
            brows.talk.setAttribute("transform", "translate(0 " + lift.toFixed(2) + ")");
            // head: a talking bob, a decaying shock tremble after the hit, a "ha-ha" bounce while laughing
            let rx = 0, ry = 0, rr = 0, wave = 0;
            if (mood === "talk" && talking) { rr = 2.2 * Math.sin(t * Math.PI * 2 * 0.9 + 0.6); ry = -4 * Math.pow(Math.sin(t * Math.PI * 2 * 1.9), 2); }
            const dt = t - H;
            if (mood === "shock" && dt > 0.12) {
              const env = Math.max(0.25, 1 - (dt - 0.12) / 1.2), q = Math.floor(f / 2);
              rx = (Look.hash(q * 3 + 11) * 2 - 1) * 2.2 * env; ry = (Look.hash(q * 3 + 12) * 2 - 1) * 1.4 * env; rr = (Look.hash(q * 3 + 13) * 2 - 1) * 0.7 * env;
              wave = 4 * Math.sin(dt * Math.PI * 2 * 2.4) * env;
            }
            if (mood === "laugh") { const u = t - L; ry = -8 * Math.abs(Math.sin(u * Math.PI * 3.2)); rr = -2.5 + 1.5 * Math.sin(u * Math.PI * 3.2); }
            bob.setAttribute("transform", "translate(" + rx.toFixed(2) + " " + ry.toFixed(2) + ") rotate(" + rr.toFixed(2) + " 300 520)");
            armSL.setAttribute("transform", "rotate(" + (-wave).toFixed(2) + " 40 900)");
            armSR.setAttribute("transform", "rotate(" + wave.toFixed(2) + " 560 900)");
          }
          Look.drive(tl, 0, T.end, (p) => face(p * T.end));

          // ---------- payoff: anticipation dip -> SHOCK (new drawing: wide eyes, scream, hands up; head snaps back while the body squashes) ----------
          gsap.set("#avHead", { svgOrigin: "300 520", y: 0, rotation: 0 });
          gsap.set("#avBody", { svgOrigin: "300 900", scaleX: 1, scaleY: 1 });
          tl.to("#avHead", { y: 12, rotation: 2, duration: 0.10, ease: "power2.in" }, H - 0.10);
          tl.to("#avBody", { scaleY: 0.97, scaleX: 1.02, duration: 0.10, ease: "power2.in" }, H - 0.10);
          tl.to("#avHead", { y: -42, rotation: -7, duration: 0.10, ease: "power3.out" }, H);
          tl.to("#avHead", { y: 0, rotation: 0, duration: 0.8, ease: "elastic.out(1, 0.4)" }, H + 0.10);
          tl.to("#avBody", { scaleX: 1.06, scaleY: 0.94, duration: 0.08, ease: "power2.out" }, H);
          tl.to("#avBody", { scaleX: 1, scaleY: 1, duration: 0.6, ease: "elastic.out(1, 0.4)" }, H + 0.08);
          tl.to("#avSq", { scaleX: 1.035, scaleY: 1.035, duration: 0.08, ease: "power2.out" }, H);
          tl.to("#avSq", { scaleX: 1, scaleY: 1, duration: 0.55, ease: "elastic.out(1, 0.45)" }, H + 0.08);
          gsap.set("#avArmsS", { y: 0 });
          tl.fromTo("#avArmsS", { y: 190 }, { y: 0, duration: 0.17, ease: "back.out(2.2)", immediateRender: false }, H);
          // follow-through: hair springs up, strings and mic boom lag the head
          tl.to("#avHair", { scaleY: 1.2, duration: 0.09, ease: "power2.out" }, H);
          tl.to("#avHair", { scaleY: 1, duration: 0.85, ease: "elastic.out(1, 0.3)" }, H + 0.09);
          ["#avStrL", "#avStrR"].forEach((id, i) => {
            tl.to(id, { rotation: i ? 12 : -12, duration: 0.1, ease: "power2.out" }, H + 0.03);
            tl.to(id, { rotation: 0, duration: 0.9, ease: "elastic.out(1, 0.3)" }, H + 0.13);
          });
          gsap.set("#avMic", { svgOrigin: "124 362", rotation: 0 });
          tl.to("#avMic", { rotation: -9, duration: 0.1, ease: "power2.out" }, H + 0.06);
          tl.to("#avMic", { rotation: 0, duration: 0.8, ease: "elastic.out(1, 0.35)" }, H + 0.16);
          // shock marks: yellow flash wedges pop out and pulse; sweat drop slides
          const wedges = $$("#avShock .avWedge");
          gsap.set(wedges, { transformOrigin: "50% 100%", scale: 0 });
          wedges.forEach((w, i) => {
            const at = H + 0.02 + (i % 3) * 0.035;
            tl.fromTo(w, { scale: 0 }, { scale: 1, duration: 0.24, ease: "back.out(3)", immediateRender: false }, at);
            tl.to(w, { scale: 1.12, duration: 0.1, ease: "sine.inOut", yoyo: true, repeat: 5 }, at + 0.3);
            tl.to(w, { scale: 0, duration: 0.12, ease: "power2.in" }, L - 0.12);
          });
          const sweat = $("#avSweat");
          gsap.set(sweat, { svgOrigin: "420 256", opacity: 0, scale: 0.4, y: -6 });
          tl.fromTo(sweat, { opacity: 0, scale: 0.4, y: -6 }, { opacity: 1, scale: 1, y: 0, duration: 0.2, ease: "back.out(2.5)", immediateRender: false }, H + 0.08);
          tl.to(sweat, { y: 26, duration: 1.1, ease: "power1.in" }, H + 0.3);
          tl.to(sweat, { scale: 0, duration: 0.1, ease: "power2.in" }, L - 0.1);
          // light: the explosion-side rim snaps on hot (1-frame attack, 3-frame peak), then embers down
          const hots = $$("#av .avHot");
          gsap.set(hots, { opacity: 0 });
          tl.fromTo(hots, { opacity: 0 }, { opacity: 1, duration: 1 / FPS, ease: "none", immediateRender: false }, H);
          tl.to(hots, { opacity: 0.34, duration: 0.42, ease: "power2.out" }, H + 4 / FPS);
          tl.to(hots, { opacity: 0, duration: 0.25, ease: "power1.in" }, L - 0.25);
          if (plate) { Look.impact(tl, H, { shake: "#shake", amp: 9, dur: 0.30, flash: 0, zoom: 1.025 }); Look.expose(tl, H, { target: "#shake", peak: 1.3, hold: 2 / FPS, dur: 0.3 }); }

          // ---------- second beat: LAUGH (squeezed eyes + tears, pointing at the gameplay) ----------
          gsap.set("#avArmP", { svgOrigin: "520 940", rotation: 0 });
          tl.fromTo("#avArmP", { rotation: 40 }, { rotation: 0, duration: 0.3, ease: "back.out(2)", immediateRender: false }, L);
          tl.to("#avHead", { y: -16, rotation: -5, duration: 0.08, ease: "power2.out" }, L);
          tl.to("#avHead", { y: 0, rotation: 0, duration: 0.6, ease: "elastic.out(1, 0.45)" }, L + 0.08);
          tl.to("#avSq", { scaleX: 1.05, scaleY: 1.05, duration: 0.07, ease: "power2.out" }, L);
          tl.to("#avSq", { scaleX: 1, scaleY: 1, duration: 0.5, ease: "back.out(3)" }, L + 0.07);
          tl.to("#avMic", { rotation: 6, duration: 0.1, ease: "power2.out" }, L + 0.05);
          tl.to("#avMic", { rotation: 0, duration: 0.7, ease: "elastic.out(1, 0.35)" }, L + 0.15);

          // balloon: punch + yellow fill bursting out from the tail + the line rolls up to the shout
          tl.to("#bubIn", { scale: 1.13, rotation: 2.5, duration: 0.08, ease: "power2.out" }, H);
          tl.to("#bubIn", { scale: 1, rotation: 0, duration: 0.7, ease: "elastic.out(1, 0.38)" }, H + 0.08);
          tl.fromTo("#bubShout", { scale: 0 }, { scale: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, H);
          tl.to("#bub1", { yPercent: -150, duration: 0.10, ease: "power3.in" }, H);
          tl.fromTo("#bub2", { yPercent: 140 }, { yPercent: 0, duration: 0.24, ease: "back.out(1.7)", immediateRender: false }, H + 0.08);
          tl.fromTo("#bubGloss", { x: -160 }, { x: U.w + 200, duration: 0.55, ease: "power2.inOut", immediateRender: false }, H + 0.12);
          // the laugh beat kicks the balloon too
          tl.to("#bubIn", { scale: 1.06, rotation: -1.5, duration: 0.07, ease: "power2.out" }, L);
          tl.to("#bubIn", { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(3)" }, L + 0.07);
          // the blade takes the hit too
          gsap.set("#barIn", { rotation: 0, transformOrigin: "20% 50%" });
          tl.to("#barIn", { rotation: -2.4, y: -6, duration: 0.09, ease: "power2.out" }, H + 0.03);
          tl.to("#barIn", { rotation: 0, y: 0, duration: 0.7, ease: "elastic.out(1, 0.35)" }, H + 0.12);

          // ---------- entrance gloss: light catches the laminate as the sticker lands ----------
          gsap.set("#avGloss", { x: -520 });
          tl.fromTo("#avGloss", { x: -520 }, { x: 1120, duration: 0.7, ease: "power2.inOut", immediateRender: false }, T.in + 0.42);

          // ---------- exit: balloon sucks back into its tail, avatar ducks behind the blade, blade retracts ----------
          tl.to("#bubIn", { scale: 0, rotation: -6, duration: 0.2, ease: "back.in(2)" }, T.out);
          tl.to("#avPos", { y: -16, duration: 0.10, ease: "power2.out" }, T.out + 0.12);
          tl.to("#avSq", { scaleY: 0.95, scaleX: 1.04, duration: 0.10, ease: "power2.out" }, T.out + 0.12);
          tl.to("#avPos", { y: 760, duration: 0.30, ease: "power3.in" }, T.out + 0.22);
          tl.to("#avSq", { scaleY: 1.07, scaleX: 0.95, duration: 0.30, ease: "power2.in" }, T.out + 0.22);
          Look.mblur(tl, "#avPos", T.out + 0.30, 0.22, { y: 0, to: [0, 26], ease: "power2.in" });
          tl.to("#barIn", { x: -880, duration: 0.30, ease: "power3.in" }, T.out + 0.42);
          Look.mblur(tl, "#barIn", T.out + 0.54, 0.18, { x: 0, to: [30, 0], ease: "power2.in" });
          gsap.set(["#avPos", "#barIn", "#bubIn"], { autoAlpha: 1 });
          tl.set("#bubIn", { autoAlpha: 0 }, T.out + 0.2); tl.set("#avPos", { autoAlpha: 0 }, T.out + 0.52); tl.set("#barIn", { autoAlpha: 0 }, T.out + 0.72);

          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
