     A real 3D clear-coated red block arrow swoops in and points at the player, the label slams out of its tail,
     and a quick brush circle loops his head. Tracked to the subject (CONFIG.track). Variable bg: "plate" / "none". -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">

    <script>
      const CONFIG = {
        clip: { src: "assets/shots/v35-penthouse-dusk-h.mp4", in: 4.45, crop: 25.7 },   // 16:9 master reframed to 9:16 (object-position x %)
        label: { text: "THAT'S", key: "ME" },               // key word in caption yellow
        // The subject's head, per frame, measured from the clip. track:null uses the fixed target.
        target: { x: 800, y: 840 },
        track: { t0: 4.5, fps: 30, map: { scale: 1.7778, dx: -600, dy: 0 },   // head, template-tracked on the 16:9 master, mapped into this crop
          x: [736,737,739,741,743,745,747,749,750,752,753,754,754,754,754,753,752,751,750,749,747,746,745,743,742,742,741,741,741,741,742,743,744,746,747,749,751,752,753,754,755,756,756,755,754,753,751,749,747,745,743,740,738,736,734,732,731,729,729,728,728,728,728,729,730,730,731,732,732,733,733,732,732,730,729,727,724,721,718,715,712,708,705,702,699,697,694,693,691,691,690,690,691,692,693,695,696,698,701,703,705,707,710,712,714,716,717,719,720,721,722,723,724,724,724,725,725,725,725,725,725,724,724,724,724,723,723,723,723,722,722,722,722,722],
          y: [422,423,425,426,427,428,429,430,430,431,431,431,431,432,432,432,432,432,432,432,433,433,433,432,432,432,432,432,431,431,431,431,431,431,431,431,431,431,431,431,431,431,431,431,431,431,431,431,431,432,432,432,433,433,433,433,433,433,432,432,432,432,432,432,433,433,433,434,434,435,435,435,436,436,437,437,438,438,439,439,439,439,439,439,438,438,437,435,434,432,431,429,427,425,424,422,421,419,418,417,417,416,415,415,415,414,414,414,414,414,414,414,414,414,414,413,413,413,413,413,413,413,413,413,413,413,413,412,412,412,412,412,412,412] },
        arrow: { dir: [0.82, 0.57], gap: 162, length: 400, headLen: 165, headHalf: 118, neck: 50, tail: 42, depth: 40,
                 color: "#FF1F2E", side: "#C40F22" },
        circle: { rx: 118, ry: 132, tilt: 6, start: 200, sweep: 388, width: 23 },
        labelOffset: [20, -48],                              // label bottom-centre from the arrow's tail
        timing: { arrowIn: 0.42, land: 0.78, label: 0.84, circleIn: 0.88, circleDur: 0.30, band: 1.12, bob: 1.45, out: 3.85, end: 4.5 }
      };

      /* Brush: variable-width paint stroke (same engine as variant A). */
      const Brush = (function () {
        const NS = "http://www.w3.org/2000/svg";
        const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
        const f1 = (v) => Math.round(v * 10) / 10;
        return function (body, strandHost, o) {
          const P = o.pts, n = P.length, L = [0];
          for (let i = 1; i < n; i++) L.push(L[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));
          const S = L.map((l) => l / L[n - 1]);
          const TG = P.map((p, i) => { const a = P[Math.max(0, i - 1)], b = P[Math.min(n - 1, i + 1)]; const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1; return [dx / d, dy / d]; });
          const wAt = (s) => {
            let w = o.W * (1 + (o.wob || 0.06) * Math.sin(s * Math.PI * 2 * 1.3 + (o.seed || 0)));
            if (o.tin) w *= 0.14 + 0.86 * Math.pow(sm(0, o.tin, s), 0.6);
            if (o.tout) w *= Math.pow(1 - sm(1 - o.tout, 1, s), 0.75);
            return Math.max(0, w);
          };
          const nibA = (o.nib || 0) * Math.PI / 180, nibK = o.nibAmt || 0;   // chisel-tip marker
          const wQ = (q) => wAt(q.s) * ((1 - nibK) + nibK * Math.abs(Math.sin(Math.atan2(q.t[1], q.t[0]) - nibA)));
          const at = (s) => {
            let lo = 0, hi = n - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (S[m] <= s) lo = m; else hi = m; }
            const k = S[hi] > S[lo] ? (s - S[lo]) / (S[hi] - S[lo]) : 0;
            return { p: [P[lo][0] + (P[hi][0] - P[lo][0]) * k, P[lo][1] + (P[hi][1] - P[lo][1]) * k], t: TG[k < 0.5 ? lo : hi], i: lo };
          };
          const samples = (s0, s1, step) => {
            const out = [Object.assign(at(s0), { s: s0 })];
            for (let i = 0; i < n; i += step) if (S[i] > s0 && S[i] < s1) out.push({ p: P[i], t: TG[i], s: S[i] });
            out.push(Object.assign(at(s1), { s: s1 })); return out;
          };
          const strands = (o.strands || []).map((st) => {
            const el = document.createElementNS(NS, "path");
            el.setAttribute("fill", "none"); el.setAttribute("stroke", st.c); el.setAttribute("stroke-opacity", st.op);
            el.setAttribute("stroke-width", st.w); el.setAttribute("stroke-linecap", "round"); el.setAttribute("stroke-linejoin", "round");
            strandHost.appendChild(el); return { st, el };
          });
          function draw(s0, s1) {
            if (s1 - s0 < 0.002) { body.setAttribute("d", ""); strands.forEach((x) => x.el.setAttribute("d", "")); return; }
            const Q = samples(s0, s1, 1), Lf = [], Rt = [];
            Q.forEach((q) => { const w = wQ(q) / 2, nx = -q.t[1], ny = q.t[0]; Lf.push([q.p[0] + nx * w, q.p[1] + ny * w]); Rt.push([q.p[0] - nx * w, q.p[1] - ny * w]); });
            const cap = (q, dir) => {
              const r = wQ(q) / 2, nx = -q.t[1], ny = q.t[0], out = [];
              for (let k = 1; k < 8; k++) { const a = (k / 8) * Math.PI, c = Math.cos(a), s = Math.sin(a);
                out.push([q.p[0] + (nx * c + q.t[0] * s) * r * dir, q.p[1] + (ny * c + q.t[1] * s) * r * dir]); }
              return out;
            };
            let d = "M" + Lf.map((p) => f1(p[0]) + " " + f1(p[1])).join("L");
            d += "L" + cap(Q[Q.length - 1], 1).map((p) => f1(p[0]) + " " + f1(p[1])).join("L");
            d += "L" + Rt.slice().reverse().map((p) => f1(p[0]) + " " + f1(p[1])).join("L");
            d += "L" + cap(Q[0], -1).map((p) => f1(p[0]) + " " + f1(p[1])).join("L") + "Z";
            body.setAttribute("d", d);
            strands.forEach(({ st, el }) => {
              const a = Math.max(s0, st.a), b = Math.min(s1, st.b);
              if (b - a < 0.004) { el.setAttribute("d", ""); return; }
              const R = samples(a, b, 2);
              el.setAttribute("d", "M" + R.map((q) => { const lit = st.lit ? (-q.t[1] * -0.7071 + q.t[0] * -0.7071) : 1;
                const off = st.o * 0.5 * Math.max(wQ(q), o.W * 0.5) * lit;
                return f1(q.p[0] - q.t[1] * off) + " " + f1(q.p[1] + q.t[0] * off); }).join("L"));
            });
          }
          return { draw };
        };
      })();

      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const C = CONFIG, T = C.timing, $ = (s) => document.querySelector(s), W = 1080, H = 1920;
        document.querySelectorAll("video.shot").forEach((v) => (v.style.objectPosition = C.clip.crop + "% 50%"));
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));
        const clamp = (x, a, b) => Math.min(b, Math.max(a, x)), seg = (t, a, d) => clamp((t - a) / d, 0, 1), lerp = (a, b, k) => a + (b - a) * k;
        const E = (n) => gsap.parseEase(n);
        const trackAt = (t) => {
          if (!C.track) return [C.target.x, C.target.y];
          const k = (C.clip.in + t - C.track.t0) * C.track.fps, X = C.track.x, Y = C.track.y;
          const i = clamp(Math.floor(k), 0, X.length - 1), j = Math.min(X.length - 1, i + 1), f = clamp(k - i, 0, 1);
          const M = C.track.map || { scale: 1, dx: 0, dy: 0 };
          return [(X[i] + (X[j] - X[i]) * f) * M.scale + M.dx, (Y[i] + (Y[j] - Y[i]) * f) * M.scale + M.dy];
        };

        // ---------- the quick brush circle ----------
        const ci = C.circle, tr = ci.tilt * Math.PI / 180, cpts = [];
        for (let i = 0; i <= 320; i++) {
          const u = i / 320, th = (ci.start + ci.sweep * u) * Math.PI / 180;
          const r = (1 + 0.05 * Math.sin(2 * th + 1.1) + 0.025 * Math.sin(3 * th + 0.4)) * (0.96 + 0.1 * Math.pow(u, 1.6));
          const x = ci.rx * r * Math.cos(th), y = ci.ry * r * Math.sin(th);
          cpts.push([x * Math.cos(tr) - y * Math.sin(tr), x * Math.sin(tr) + y * Math.cos(tr)]);
        }
        const STR = [
          { o: 0.56, w: 5, c: "#FF9C92", op: 0.62, a: 0.02, b: 0.975, lit: true }, { o: -0.52, w: 7, c: "#9E0A16", op: 0.58, a: 0, b: 1, lit: true },
          { o: 0.12, w: 1.4, c: "#8E0714", op: 0.35, a: 0.05, b: 0.99 }];
        const circle = Brush($("#cBody"), $("#cStr"), { pts: cpts, W: ci.width, tin: 0.05, tout: 0.2, wob: 0.07, seed: 0.4, nib: 40, nibAmt: 0.45, strands: STR });

        // ---------- label ----------
        const lab = $("#label");
        lab.innerHTML = C.label.text + ' <span class="k" data-layout-allow-occlusion>' + C.label.key + "</span>";

        // ---------- Three.js: z = 0 maps 1:1 to page px ----------
        const canvas = $("#gl");
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true, premultipliedAlpha: true });
        renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.setClearColor(0x000000, 0);
        renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.25;
        const scene = new THREE.Scene();
        const FOV = 24, DIST = (H / 2) / Math.tan((FOV / 2) * Math.PI / 180);
        const camera = new THREE.PerspectiveCamera(FOV, W / H, 10, DIST * 3);
        camera.position.set(0, 0, DIST); camera.lookAt(0, 0, 0);
        const wx = (x) => x - W / 2, wy = (y) => H / 2 - y;

        // studio environment for the clear coat: a warm softbox above, a strip front-left, a dusk-pink bar behind
        const envScene = new THREE.Scene();
        envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 48, 24), new THREE.ShaderMaterial({
          side: THREE.BackSide, depthWrite: false,
          vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
          fragmentShader: "varying vec3 vP; void main(){ float y = vP.y; vec3 top = vec3(0.95,0.85,0.9), hor = vec3(0.16,0.06,0.1), low = vec3(0.02,0.005,0.01);" +
            " vec3 c = y > 0.0 ? mix(hor, top, smoothstep(0.05, 0.85, y)) : mix(hor, low, smoothstep(0.0, 0.5, -y)); gl_FragColor = vec4(c, 1.0); }"
        })));
        const panel = (w, h, x, y, z, c) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); envScene.add(m); };
        panel(34, 12, -6, 30, 24, new THREE.Color(3.4, 3.3, 3.2));
        panel(4, 30, -28, 2, 24, new THREE.Color(3.0, 2.9, 2.9));
        panel(40, 5, 4, 20, -28, new THREE.Color(3.4, 1.6, 2.2));
        panel(20, 20, 30, -6, 14, new THREE.Color(1.4, 0.5, 0.7));
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(envScene, 0.0, 0.1, 200).texture;

        const key = new THREE.DirectionalLight(0xfff2ea, 1.5); scene.add(key); scene.add(key.target);
        const rim = new THREE.DirectionalLight(0xff9cc0, 1.1); rim.position.set(0.8, 0.35, -0.6); scene.add(rim);
        scene.add(new THREE.HemisphereLight(0xffeef4, 0x2a0a18, 0.55));

        // arrow shape: tip at origin, pointing +x, round corners
        const A = C.arrow;
        const corners = [[0, 0, 13], [-A.headLen, -A.headHalf, 12], [-A.headLen + 6, -A.neck, 9], [-A.length, -A.tail, 16], [-A.length, A.tail, 16], [-A.headLen + 6, A.neck, 9], [-A.headLen, A.headHalf, 12]];
        const shape = new THREE.Shape();
        corners.forEach((p, i) => {
          const a = corners[(i + corners.length - 1) % corners.length], b = corners[(i + 1) % corners.length];
          const ua = [a[0] - p[0], a[1] - p[1]], ub = [b[0] - p[0], b[1] - p[1]], la = Math.hypot(ua[0], ua[1]), lb = Math.hypot(ub[0], ub[1]), r = p[2];
          const p1 = [p[0] + ua[0] / la * r, p[1] + ua[1] / la * r], p2 = [p[0] + ub[0] / lb * r, p[1] + ub[1] / lb * r];
          if (i === 0) shape.moveTo(p1[0], p1[1]); else shape.lineTo(p1[0], p1[1]);
          shape.quadraticCurveTo(p[0], p[1], p2[0], p2[1]);
        });
        shape.closePath();
        const geo = new THREE.ExtrudeGeometry(shape, { depth: A.depth, bevelEnabled: true, bevelThickness: 12, bevelSize: 9, bevelSegments: 7, curveSegments: 10 });
        geo.translate(0, 0, -A.depth / 2);
        const faceMat = new THREE.MeshPhysicalMaterial({ color: new THREE.Color(A.color), roughness: 0.32, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.06, envMapIntensity: 1.0 });
        const sideMat = new THREE.MeshPhysicalMaterial({ color: new THREE.Color(A.side), roughness: 0.36, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.08, envMapIntensity: 0.9 });
        const arrowMesh = new THREE.Mesh(geo, [faceMat, sideMat]);
        const backGeo = new THREE.ExtrudeGeometry(shape, { depth: 8, bevelEnabled: true, bevelThickness: 3, bevelSize: 16, bevelSegments: 3, curveSegments: 10 });
        backGeo.translate(0, 0, -A.depth / 2 - 10);
        const back = new THREE.Mesh(backGeo, new THREE.MeshStandardMaterial({ color: 0x1a0207, roughness: 0.55, metalness: 0 }));
        const bandMat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false,
          uniforms: { uPos: { value: -1e4 }, uAmp: { value: 0 } },
          vertexShader: "varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
          fragmentShader: "uniform float uPos; uniform float uAmp; varying vec2 vP; void main(){ float d = dot(vP, normalize(vec2(0.62, 0.78))); float a = uAmp * exp(-pow((d - uPos) / 46.0, 2.0)); gl_FragColor = vec4(1.0, 0.97, 0.95, a); }" });
        const band = new THREE.Mesh(new THREE.ShapeGeometry(shape, 12), bandMat); band.position.z = A.depth / 2 + 12.4;
        const squash = new THREE.Group(); squash.add(arrowMesh); squash.add(back); squash.add(band);
        const bank = new THREE.Group(); bank.add(squash);
        const pivot = new THREE.Group(); pivot.add(bank); scene.add(pivot);

        // soft silhouette shadow that lands on the footage
        const SC = document.createElement("canvas"); SC.width = 1024; SC.height = 512;
        const sx = SC.getContext("2d"), pad = 70, sW = A.length + 2 * pad, sH = 2 * A.headHalf + 2 * pad;
        sx.filter = "blur(16px)"; sx.fillStyle = "#000"; sx.beginPath();
        corners.forEach((p, i) => { const X = (p[0] + A.length + pad) / sW * 1024, Y = (A.headHalf + pad - p[1]) / sH * 512; i ? sx.lineTo(X, Y) : sx.moveTo(X, Y); });
        sx.closePath(); sx.fill();
        const stex = new THREE.CanvasTexture(SC); stex.colorSpace = THREE.SRGBColorSpace;
        const shMat = new THREE.MeshBasicMaterial({ map: stex, transparent: true, opacity: 0.5, depthWrite: false, color: 0x0a0004 });
        const shMesh = new THREE.Mesh(new THREE.PlaneGeometry(sW, sH), shMat);
        shMesh.position.set(-A.length / 2, 0, 0);
        const shPivot = new THREE.Group(); shPivot.add(shMesh); scene.add(shPivot); shMesh.renderOrder = -1;

        // ---------- motion (state is a pure function of t) ----------
        const dl = Math.hypot(A.dir[0], A.dir[1]), us = [A.dir[0] / dl, A.dir[1] / dl];   // screen-space pointing direction
        const uw = [us[0], -us[1]], vw = [us[1], us[0]];                                   // world dir and its normal (toward screen up-right)
        const head0 = Math.atan2(uw[1], uw[0]);
        const eOut3 = E("power3.out"), eIn3 = E("power3.in"), eKey = E("power2.inOut"), eBack = E("back.out(2.4)"), eEl = E("elastic.out(1,0.5)");
        const lab0 = { w: 0, h: 0 };

        function renderAt(t) {
          const [hx, hy] = trackAt(t);
          $("#ann").setAttribute("transform", "translate(" + hx.toFixed(2) + " " + hy.toFixed(2) + ")");
          // circle
          const c1 = t < T.circleIn ? 0 : E("power2.inOut")(seg(t, T.circleIn, T.circleDur));
          circle.draw(E("power2.in")(seg(t, T.out, 0.28)), c1);

          // arrow: final tip position (world) beside the head
          const Fx = wx(hx - us[0] * A.gap), Fy = wy(hy - us[1] * A.gap);
          const tau = t - T.land;
          let px, py, pz = 0, hd = head0, bk = 0, sxq = 1, vis = t >= T.arrowIn && t < T.out + 0.32;
          if (t < T.land) {          // swoop on a curve, banked, from off-frame upper-left
            const u = seg(t, T.arrowIn, T.land - T.arrowIn), e = u * (1.35 - 0.35 * u);
            const S0 = [Fx - uw[0] * 980 + vw[0] * 420, Fy - uw[1] * 980 + vw[1] * 420], C1 = [Fx - uw[0] * 470, Fy - uw[1] * 470];
            const a = (1 - e) * (1 - e), b = 2 * e * (1 - e), c = e * e;
            px = a * S0[0] + b * C1[0] + c * Fx; py = a * S0[1] + b * C1[1] + c * Fy;
            const dx = 2 * (1 - e) * (C1[0] - S0[0]) + 2 * e * (Fx - C1[0]), dy = 2 * (1 - e) * (C1[1] - S0[1]) + 2 * e * (Fy - C1[1]);
            hd = Math.atan2(dy, dx); pz = 520 * (1 - e) * (1 - e); bk = 1.25 * (1 - e);
          } else {
            px = Fx; py = Fy; bk = -0.16 * Math.exp(-7 * tau) * Math.sin(2 * Math.PI * 2.2 * tau);
          }
          // overshoot along the axis, the landing squash, the attention bob, the exit retract
          let ax = 0;
          let cross = 1;
          if (tau >= 0) {
            const hold = 2 / 30, eu = eEl(seg(tau, hold, 0.35)), k = tau < hold ? 0 : eu;
            sxq = 0.82 + 0.18 * k; cross = 1.12 - 0.12 * k;
            ax -= 18 * (tau < hold ? tau / hold : 1 - eu);
          }
          if (t > T.bob) ax += 13 * seg(t, T.bob, 0.25) * (0.5 - 0.5 * Math.cos(2 * Math.PI * 1.6 * (t - T.bob)));
          const ex = eIn3(seg(t, T.out, 0.3)); ax -= 1150 * ex; bk -= 0.9 * ex; pz += 260 * ex;
          px += uw[0] * ax; py += uw[1] * ax;
          pivot.visible = vis; shPivot.visible = vis;
          pivot.position.set(px, py, pz); pivot.rotation.z = hd; bank.rotation.x = bk;
          squash.scale.set(sxq, cross, cross);
          // shadow: farther and softer while the arrow is high, tight at contact
          const lift = pz + 40;
          shPivot.position.set(px + lift * 0.45 + 16, py - lift * 0.6 - 24, -90); shPivot.rotation.z = hd;
          shPivot.scale.set(sxq, Math.max(0.25, Math.abs(Math.cos(bk))), 1);
          shMat.opacity = 0.5 * clamp(1 - pz / 700, 0.25, 1);
          // light: the key swings across the clear coat at the landing and peaks
          const ks = eKey(seg(t, T.land - 0.1, 0.55));
          key.position.set(lerp(-0.9, 0.7, ks), 0.85, 1.0);
          key.intensity = 1.5 + 2.4 * Math.exp(-Math.pow((t - T.land - 0.1) / 0.12, 2));
          const bu = seg(t, T.band, 0.32);
          bandMat.uniforms.uPos.value = bu <= 0 || bu >= 1 ? -1e4 : lerp(-400, 150, eKey(bu));
          bandMat.uniforms.uAmp.value = 0.42 * Math.sin(Math.PI * bu);
          // the ring blooms for 3 frames as it closes
          const gt = t - (T.circleIn + T.circleDur);
          $("#glowG").setAttribute("opacity", (gt < 0 ? 0 : gt < 0.033 ? 0.85 * gt / 0.033 : gt < 0.133 ? 0.85 : 0.85 * Math.exp(-(gt - 0.133) / 0.14)).toFixed(3));
          renderer.render(scene, camera);

          // label: slams out of the tail on the landing, collapses into it on the exit
          const tailX = hx - us[0] * (A.gap + A.length), tailY = hy - us[1] * (A.gap + A.length);
          if (!lab0.w) { lab0.w = lab.offsetWidth; lab0.h = lab.offsetHeight; }
          let cx = tailX + C.labelOffset[0], cy = tailY + C.labelOffset[1];   // label bottom-centre
          cx = clamp(cx, 72 + lab0.w * 1.22 / 2 + 8, 936 - lab0.w * 1.22 / 2 - 8); cy = Math.max(cy, 240 + lab0.h);
          const lt = t - T.label, ls = lt < 0 ? 0 : 1 + 0.2 * Math.exp(-9 * lt) * Math.cos(2 * Math.PI * 1.9 * lt);
          // exit: the caption collapses into the arrow's tail (fully opaque, directional blur), cut on the zero frame
          const lout = seg(t, T.out - 0.02, 0.17), le = eIn3(lout), lsc = ls * (1 - le);
          const rot = -3 - 5 * Math.exp(-8 * Math.max(0, lt));
          const ox = (tailX - cx) * le, oy = (tailY - (cy - lab0.h * 0.4)) * le;
          lab.style.transform = "translate(" + (cx - lab0.w / 2 + ox).toFixed(1) + "px," + (cy - lab0.h + oy).toFixed(1) + "px) rotate(" + rot.toFixed(2) + "deg) scale(" + lsc.toFixed(4) + ")";
          lab.style.opacity = lt < 0 || lsc < 0.04 ? 0 : 1;
          lab.style.filter = lout > 0 ? "blur(" + (6 * lout).toFixed(1) + "px)" : "none";
        }
        window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") renderAt(e.detail.time); });

        const FACES = ["900 100px Inter", "900 100px Archivo"];
        Promise.all(FACES.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
          const tl = gsap.timeline({ paused: true });
          renderAt(0);
          Look.drive(tl, 0, T.end, (p) => renderAt(p * T.end));
          Look.impact(tl, T.land, { shake: "#shake", amp: 7, dur: 0.3, flash: 0, host: "#root", zoom: 1.018 });
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
