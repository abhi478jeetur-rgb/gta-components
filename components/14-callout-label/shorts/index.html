<!-- 14 Callout label, variant B (9:16, 1080x1920, 30 fps): "Stacked callouts, one locks in".
     Three callouts pop onto people in a gameplay shot (FRANKLIN, OG, FAMILIES), staggered, each with its own bead pin and a
     bold enamel elbow leader, each tracking its subject: pins sit on hair, a vest and a back (never on a face), leaders run
     clear of every head, and OG hangs under its pin from an overline. OG and FAMILIES retract; on the hard cut to a sharp
     close shot of Franklin his callout re-pins on his hair (the leader stays attached) and locks in: a light pulse charges
     the leader green, a bevelled lacquer plaque hinges up behind the word and locks with a punch and a rim flash, a light
     front ignites the type from white enamel to Franklin green, and the locked label holds still for 1.2 s while its leader
     follows his head. All payoff light sits on the plaque and the leader, never on his face.
     Sample plate: media/plate-v.mp4 (the Shorts blur-fill layout, every shot at native 1.0x; media/make_plate.sh).
     Variable: bg "plate" / "none". See README.md. -->

                // bloom: a 3-frame peak on the lock-in frame, then a lift through the ignite
                const bt = t - LOCKED, env = bt < 0 ? 0 : bt < 0.1 ? 1 : Math.exp(-(bt - 0.1) / 0.28);
                const it = t - PO.ignite, ienv = it < 0 ? 0 : Math.exp(-Math.pow((it - 0.12) / 0.14, 2));
                bloom = Math.max(bloom, 0.1 + 0.7 * Math.max(env, 0.6 * ienv) + (t > PO.ignite && t < c.out ? 0.06 : 0));
                keyBoost = Math.max(keyBoost, 3.0 * Math.max(env, ienv));
                payPin = o.pin;
              }
            });
            // the key-light boost lights the plaque and the type; the pin is dimmed by the same amount so it never flares on his hair
            if (payPin) payPin.st.dim = 2.0 / (2.0 + keyBoost);
            const ka = -0.9 + 1.7 * eIO(seg(t, PO.ignite - 0.05, 0.9));
            C3.render({ keyAngle: ka, keyBoost, bloom });
          }
          const tl = gsap.timeline({ paused: true });
          Look.drive(tl, 0, END, (p) => renderAt(p * END));
          window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") renderAt(e.detail.time); });
          renderAt(0);
          tl.set({}, {}, END);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
