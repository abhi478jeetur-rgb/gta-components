<!doctype html>
<!-- 15 Meme cut-in, variant A (16:9, 1920x1080, 30 fps): "Framed slam". A glossy meme print slams onto the gameplay at a tilt,
     top caption on, the punchline stamps with a face snap-zoom and a real 3D keyword that ignites gold, holds, whips out.
     Variable bg: "plate" (sample GTA V gameplay) / "none". -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="media/glyphs.js"></script>
    <script src="media/payoff3d.js"></script>
    <style>
      @font-face { font-family: "Archivo"; font-style: normal; font-weight: 100 900; font-stretch: 62% 125%; font-display: block; src: url("../../../shared/fonts/Archivo.ttf") format("truetype"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ov { position: absolute; inset: 0; }

      /* cast shadows: follow the card's 2D pose, offset and softened by its height above the footage */
      .shd { position: absolute; border-radius: 12px; background: #000; opacity: 0; transform-origin: 50% 50%; }

      #cardPos { position: absolute; opacity: 0; }
      #cardBlur, #cardMb, #persp { position: absolute; inset: 0; }
      #persp { perspective: 2300px; perspective-origin: 50% 50%; }
      #c3 { position: absolute; inset: 0; transform-style: preserve-3d; transform-origin: 50% 50%; }
      #c3 > div { position: absolute; }
      .front { left: 0; top: 0; width: 100%; height: 100%; border-radius: 8px; overflow: hidden; }
      .back { left: 0; top: 0; width: 100%; height: 100%; border-radius: 8px; background: #B9B1A3; }
      .s-top, .s-bot { left: 0; width: 100%; transform-origin: 50% 0; }
      .s-top { top: 0; background: linear-gradient(180deg, #FFFFFF, #E4DFD4); }
      .s-bot { background: linear-gradient(180deg, #A39B8C, #6F685B); }
      .s-l, .s-r { top: 0; height: 100%; transform-origin: 0 50%; }
      .s-l { left: 0; background: linear-gradient(90deg, #ECE7DE, #CFC8BA); }
      .s-r { background: linear-gradient(90deg, #ACA496, #837B6D); }

      /* paper: warm 3-stop stock with a fine grain, a lit top-left lip and a shaded bottom-right lip */
      .paper { position: absolute; inset: 0; border-radius: 8px;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='7' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .30  0 0 0 0 .26  0 0 0 0 .20  0 0 0 .95 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>"),
          linear-gradient(158deg, #FBF9F4 0%, #F1ECE2 40%, #DED6C7 100%);
        background-size: 220px 220px, 100% 100%;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 1px 0 0 rgba(255,255,255,.85), inset 0 2px 4px rgba(255,255,255,.5), inset 0 -3px 0 rgba(96,84,66,.38), inset -2.5px 0 0 rgba(96,84,66,.26),
                    inset 0 0 26px rgba(110,94,70,.14); }
      .photo { position: absolute; overflow: hidden; border-radius: 3px; background: #1a1c20;
        box-shadow: 0 0 0 1px rgba(88,76,60,.55), 0 0 0 5px #FDFBF6, 0 0 0 6px rgba(120,106,86,.40), 0 1px 0 6px rgba(255,255,255,.9); }
      #meme { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; display: block; filter: url(#sharpen) contrast(1.08) saturate(1.1) brightness(.97); }
      .vig { position: absolute; inset: 0; background: radial-gradient(ellipse 78% 72% at 46% 44%, rgba(0,0,0,0) 58%, rgba(0,0,0,.30) 100%),
        linear-gradient(0deg, rgba(4,5,8,.42) 0%, rgba(4,5,8,.16) 18%, rgba(4,5,8,0) 32%); }
      .gloss { position: absolute; left: -20%; top: -20%; width: 140%; height: 140%;
        background: linear-gradient(124deg, rgba(255,255,255,.11) 0%, rgba(255,255,255,.035) 14%, rgba(255,255,255,0) 24%, rgba(255,255,255,0) 86%, rgba(255,255,255,.03) 100%); }
      .inset { position: absolute; inset: 0; border-radius: 3px;
        box-shadow: inset 0 0 0 1px rgba(20,16,10,.65), inset 3px 5px 10px rgba(0,0,0,.45), inset 0 -1px 0 rgba(255,255,255,.22); }
      .spec { position: absolute; top: -30%; left: 0; width: 220px; height: 160%; opacity: 0; mix-blend-mode: screen;
        background: linear-gradient(90deg, rgba(255,252,246,0) 0%, rgba(255,252,246,.08) 25%, rgba(255,252,246,.35) 50%, rgba(255,252,246,.08) 75%, rgba(255,252,246,0) 100%); }

      /* image-macro caption: bevelled white heavy narrow caps over an ink edge and a graded 3-step extrusion */
      .capLayer { position: absolute; }
      .cap { position: absolute; left: 0; width: 100%; text-align: center; white-space: nowrap; transform-origin: 50% 60%; }
      .capIn { position: relative; display: inline-block; font-family: "Archivo"; font-weight: 900; font-stretch: 64%;
        letter-spacing: -0.012em; word-spacing: 0.16em; line-height: 1; text-transform: uppercase; }
      .ink, .dp { position: absolute; left: 0; top: 0; width: 100%; color: #07080B; -webkit-text-stroke: 13px #07080B; }
      .dp.d1 { transform: translateY(3px); color: #1B2130; -webkit-text-stroke: 13px #1B2130; }
      .dp.d2 { transform: translateY(6px); color: #10141D; -webkit-text-stroke: 13px #10141D; }
      .dp.d3 { transform: translateY(9px); color: #05060A; -webkit-text-stroke: 13px #05060A; }
      .face { position: relative; color: #FFFFFF; }
      .hide3d { visibility: hidden; }
      .shadowed { filter: drop-shadow(0 10px 14px rgba(0,0,0,.45)); }
      .c3d { position: absolute; left: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="sharpen" x="0" y="0" width="100%" height="100%"><feConvolveMatrix order="3" kernelMatrix="0 -0.5 0 -0.5 3 -0.5 0 -0.5 0" preserveAlpha="true" edgeMode="duplicate" /></filter></svg>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.3" data-width="1920" data-height="1080">
      <div id="shake"><div id="push">
        <video id="shotA" class="clip shot" src="assets/shots/v52-gp-police-bridge-h.mp4" muted playsinline data-start="0" data-duration="4.3" data-media-start="0.3" data-track-index="0"></video>
      </div></div>
      <div id="ov" class="clip" data-start="0" data-duration="4.3" data-track-index="1">
        <div class="shd" id="shdAmb"></div>
        <div class="shd" id="shdCon"></div>
        <div class="shd" id="shdOcc"></div>
        <div id="cardPos">
          <div id="cardBlur"><div id="cardMb"><div id="persp">
            <div id="c3">
              <div class="back"></div>
              <div class="s-top"></div><div class="s-bot"></div><div class="s-l"></div><div class="s-r"></div>
              <div class="front">
                <div class="paper"></div>
                <div class="photo" id="photo">
                  <img id="meme" src="media/meme-lamar.jpg" alt="" />
                  <div class="vig"></div>
                  <div class="gloss" id="gloss"></div>
                  <div class="inset"></div>
                </div>
                <div class="spec" id="spec"></div>
                <div class="capLayer" id="capLayer">
                  <div class="cap shadowed" id="capTop"></div>
                  <div class="cap shadowed" id="capBot"></div>
                </div>
              </div>
            </div>
          </div></div></div>
        </div>
      </div>
    </div>
    <script>
      const CONFIG = {
        // The meme: your own still (a game screenshot works best). face = the zoom target in image pixels;
        // faceAt / faceAtZoomed = where it sits in the photo window before / after the snap-zoom.
        image: { src: "media/meme-lamar.jpg", w: 1920, h: 1080, face: [630, 420], faceAt: [440, 310], faceAtZoomed: [420, 360], zoomFrom: 0.74, zoomTo: 0.88 },
        // Image-macro captions. [brackets] mark the keyword: it is rendered as real 3D (extruded, bevelled) and ignites gold.
        top: "LAMAR WHEN I SAY",
        bottom: "THE CAR IS [STOLEN]",
        type: { topSize: 92, botSize: 112, maxWidth: 1100, topY: 16, botBottom: 22 },
        // the print: centre on the canvas, photo size, paper border, card thickness, resting tilt
        card: { cx: 1160, cy: 540, photoW: 1200, photoH: 770, border: 26, depth: 10, rest: -3.5 },
        word3d: { depth: 15, bevel: 3.2, tilt: 0.3, edge: 6 },
        colors: {
          ink: "#07080B",
          white: "linear-gradient(180deg, #FFFFFF 0%, #FFFFFF 44%, #DCE2EA 56%, #EEF1F5 78%, #D3DAE3 100%)",
          face: ["#FFFFFF", "#F7F9FC", "#EEF2F7", "#E4E9F0"], side: ["#2A2F3A", "#07080B"],
          goldFace: ["#FFF1A0", "#FFC21E", "#E07F0A"], goldLip: "#F7B23A", goldSide: ["#C46A00", "#3A1400"], hot: "#FFF6D0"
        },
        timing: { slam: 0.40, land: 0.56, punch: 1.45, ignite: 1.60, wind: 3.45, whip: 3.55, gone: 3.77, end: 4.3 }
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const C = CONFIG, T = C.timing, K = C.card, $ = (s) => document.querySelector(s), FR = 1 / 30;
        if (!plate) document.querySelectorAll("video").forEach((v) => (v.style.display = "none"));

        // ---------- card geometry ----------
        const CW = K.photoW + 2 * K.border, CH = K.photoH + 2 * K.border, D = K.depth;
        const L0 = K.cx - CW / 2, T0 = K.cy - CH / 2;
        const pos = $("#cardPos");
        Object.assign(pos.style, { left: L0 + "px", top: T0 + "px", width: CW + "px", height: CH + "px" });
        ["#shdAmb", "#shdCon", "#shdOcc"].forEach((s) => Object.assign($(s).style, { left: L0 + "px", top: T0 + "px", width: CW + "px", height: CH + "px" }));
        $(".s-top").style.height = D + "px"; $(".s-top").style.transform = "rotateX(-90deg)";
        Object.assign($(".s-bot").style, { top: CH + "px", height: D + "px", transform: "rotateX(-90deg)" });
        $(".s-l").style.width = D + "px"; $(".s-l").style.transform = "rotateY(90deg)";
        Object.assign($(".s-r").style, { left: CW + "px", width: D + "px", transform: "rotateY(90deg)" });
        $(".back").style.transform = "translateZ(" + (-D) + "px)";
        const photo = $("#photo");
        Object.assign(photo.style, { left: K.border + "px", top: K.border + "px", width: K.photoW + "px", height: K.photoH + "px" });
        Object.assign($("#capLayer").style, { left: K.border + "px", top: K.border + "px", width: K.photoW + "px", height: K.photoH + "px" });
        const img = $("#meme"); img.src = C.image.src;

        // ---------- captions: 3 graded depth layers + ink edge + bevelled face, same text; the keyword is held for 3D ----------
        function buildCap(el, text) {
          const words = text.match(/\[[^\]]+\]|\S+/g).map((w) => w[0] === "[" ? { t: w.slice(1, -1), kw: true } : { t: w, kw: false });
          const inn = document.createElement("div"); inn.className = "capIn";
          const layer = (cls) => {
            const s = document.createElement("span"); s.className = cls;
            words.forEach((w, i) => { const x = document.createElement("span"); x.textContent = w.t; if (w.kw) x.className = "kw"; s.appendChild(x); if (i < words.length - 1) s.appendChild(document.createTextNode(" ")); });
            return s;
          };
          const layers = ["dp d3", "dp d2", "dp d1", "ink"].map((c) => { const s = layer(c); s.setAttribute("data-layout-ignore", ""); s.setAttribute("aria-hidden", "true"); inn.appendChild(s); return s; });
          const face = layer("face"); inn.appendChild(face); el.appendChild(inn);
          return { el, inn, face, layers, kws: Array.from(face.querySelectorAll(".kw")), allKw: Array.from(inn.querySelectorAll(".kw")) };
        }
        const capT = buildCap($("#capTop"), C.top), capB = buildCap($("#capBot"), C.bottom);

        const FACES = ["900 100px Archivo", "900 100px Inter"];
        const ready = [img.decode ? img.decode().catch(() => 0) : 0];
        Promise.all(FACES.map((f) => document.fonts.load(f)).concat(ready)).then(() => document.fonts.ready).then(() => {
          function fit(cap, size) {
            cap.inn.style.fontSize = size + "px";
            const w = cap.inn.offsetWidth;
            if (w > C.type.maxWidth) { size = Math.floor(size * C.type.maxWidth / w); cap.inn.style.fontSize = size + "px"; }
            return size;
          }
          fit(capT, C.type.topSize); const botSize = fit(capB, C.type.botSize);
          $("#capTop").style.top = C.type.topY + "px";
          const botTop = K.photoH - C.type.botBottom - capB.inn.offsetHeight;
          $("#capBot").style.top = botTop + "px";
          Look.fill(capT.face, C.colors.white); Look.fill(capB.face, C.colors.white);

          // ---------- the 3D keyword: real extruded glyphs at the DOM keyword's exact place, inside the bottom caption ----------
          let P3 = null;
          const kw = capB.kws[0];
          if (kw && window.THREE && window.PAYOFF_GLYPHS) {
            // keyword box in #capBot's (untransformed) layout space
            let kx = kw.offsetLeft + capB.face.offsetLeft + capB.inn.offsetLeft, ky = kw.offsetTop + capB.face.offsetTop + capB.inn.offsetTop;
            const probe = document.createElement("span"); probe.style.cssText = "display:inline-block;width:1px;height:0;vertical-align:baseline";
            kw.appendChild(probe); const baseY = probe.offsetTop + capB.face.offsetTop + capB.inn.offsetTop; kw.removeChild(probe);
            const capH = window.PAYOFF_GLYPHS.cap / window.PAYOFF_GLYPHS.upm * botSize;
            const CHH = 360, W3 = K.photoW, top3 = Math.round(baseY - capH / 2 - CHH / 2);
            const W3D = C.word3d, Cc = C.colors;
            P3 = Payoff3D({
              W: W3, H: CHH, glyphs: window.PAYOFF_GLYPHS, text: kw.textContent, size: botSize, tracking: -0.012,
              cx: kx + kw.offsetWidth / 2, cy: baseY - capH / 2 - top3, depth: W3D.depth, bevel: W3D.bevel, tilt: W3D.tilt,
              inkPx: W3D.edge, inkColor: Cc.ink, shadow: 0.55, shadowOff: 8,
              colors: { whiteFace: [Cc.face[0], Cc.face[3]], whiteSide: Cc.side, goldFace: Cc.goldFace, goldLip: Cc.goldLip, goldSide: Cc.goldSide, hot: Cc.hot },
              timing: { ignite: T.ignite, frontDur: 0.18, specAt: T.ignite + 0.06, specDur: 0.45, rakeDur: 0.6, holdEnd: T.wind }
            });
            const holder = document.createElement("div"); holder.className = "c3d";
            Object.assign(holder.style, { top: top3 + "px", width: W3 + "px", height: CHH + "px" });
            holder.appendChild(P3.canvas); $("#capBot").appendChild(holder);
            capB.allKw.forEach((k) => k.classList.add("hide3d"));
          } else {
            capB.kws.forEach((k) => Look.fill(k, "linear-gradient(180deg, #FFF3A8 0%, #FFD23C 38%, #FFB21E 64%, #E07F0A 100%)"));
          }
          document.querySelectorAll("#ov .cap, #ov .capIn, #ov .face, #ov .face span, #ov .c3d, #ov canvas, #meme, #gloss, #spec, #photo, .front, .shd, #cardPos, #capLayer").forEach((n) => { n.setAttribute("data-layout-allow-overlap", ""); n.setAttribute("data-layout-allow-occlusion", ""); n.setAttribute("data-layout-allow-overflow", ""); });

          const tl = gsap.timeline({ paused: true });

          // ---------- card state proxy: every set re-poses card + shadows + photo zoom ----------
          const FQ = C.image.face, F0 = C.image.faceAt, F1 = C.image.faceAtZoomed;
          const st = { sc: 1.5, rz: -14, rx: 26, ry: -14, x: 70, y: -50, lift: 1, sqx: 1, sqy: 1, z: C.image.zoomFrom, fx: F0[0], fy: F0[1] };
          const c3 = $("#c3"), shA = $("#shdAmb"), shC = $("#shdCon"), shO = $("#shdOcc"), gloss = $("#gloss");
          function apply() {
            const s = st, L = s.lift;
            c3.style.transform = "translate(" + s.x.toFixed(2) + "px," + s.y.toFixed(2) + "px) rotateZ(" + s.rz.toFixed(3) + "deg) rotateX(" + s.rx.toFixed(3) +
              "deg) rotateY(" + s.ry.toFixed(3) + "deg) scale3d(" + (s.sc * s.sqx).toFixed(4) + "," + (s.sc * s.sqy).toFixed(4) + "," + s.sc.toFixed(4) + ")";
            const sh = (el, ox, oy, k, blur, kb, scl) => {
              el.style.transform = "translate(" + (s.x + ox + k * L).toFixed(1) + "px," + (s.y + oy + k * 1.38 * L).toFixed(1) + "px) rotate(" + s.rz.toFixed(3) + "deg) scale(" + (s.sc * scl).toFixed(4) + ")";
              el.style.filter = "blur(" + (blur + kb * L).toFixed(1) + "px)";
            };
            sh(shO, 2, 4, 60, 2.5, 20, 0.998);
            sh(shC, 8, 12, 80, 9, 30, 1.0);
            sh(shA, 24, 42, 110, 30, 40, 1.02);
            gloss.style.transform = "translate(" + ((s.rz - K.rest) * 16 + s.ry * 9).toFixed(1) + "px," + (s.rx * 7).toFixed(1) + "px)";
            img.style.transform = "translate(" + (s.fx - FQ[0] * s.z).toFixed(2) + "px," + (s.fy - FQ[1] * s.z).toFixed(2) + "px) scale(" + s.z.toFixed(4) + ")";
          }
          const P = {};
          Object.keys(st).forEach((k) => Object.defineProperty(P, k, { get: () => st[k], set: (v) => { st[k] = v; apply(); } }));
          apply();
          const tw = (from, to, dur, ease, at) => tl.fromTo(P, from, Object.assign({}, to, { duration: dur, ease, immediateRender: false }), at);

          // ---------- entrance: the slam ----------
          tl.set(pos, { opacity: 1 }, T.slam);
          tl.fromTo([shA, shC, shO], { opacity: 0 }, { opacity: (i) => [0.55, 0.72, 0.6][i], duration: T.land - T.slam, ease: "power2.in", immediateRender: false }, T.slam);
          tl.fromTo("#cardBlur", { filter: "blur(7px)" }, { filter: "blur(0px)", duration: T.land - T.slam, ease: "power2.in", immediateRender: false }, T.slam);
          tl.set("#cardBlur", { filter: "none" }, T.land);
          const fall = T.land - T.slam;
          tw({ sc: 1.5, x: 70, y: -50 }, { sc: 1, x: 0, y: 0 }, fall, "power3.in", T.slam);
          tw({ lift: 1 }, { lift: 0 }, fall, "power2.in", T.slam);
          tw({ rz: -14, rx: 26, ry: -14 }, { rz: -5.2, rx: -3.2, ry: 2.2 }, fall, "power2.in", T.slam);
          // impact: 2-frame squash, spring back, the tilt springs to rest with overshoot
          tw({ sqx: 1, sqy: 1 }, { sqx: 1.04, sqy: 0.95 }, FR * 1.5, "power1.out", T.land);
          tw({ sqx: 1.04, sqy: 0.95 }, { sqx: 1, sqy: 1 }, 0.3, "back.out(3)", T.land + FR * 1.5);
          tw({ rz: -5.2 }, { rz: K.rest }, 0.62, "elastic.out(1, 0.42)", T.land);
          tw({ rx: -3.2, ry: 2.2 }, { rx: 0, ry: 0 }, 0.55, "elastic.out(1, 0.4)", T.land);
          if (plate) Look.impact(tl, T.land, { shake: "#shake", amp: 16, dur: 0.36, zoom: 1.025, flash: 0 });
          Look.chroma(tl, "#cardPos", T.land, 0.14, { px: 4 });

          // ---------- payoff: punchline stamps, face snap-zoom, squash hit, the 3D keyword ignites, a crisp gloss band rakes the photo ----------
          const pb = $("#capBot");
          gsap.set(pb, { opacity: 0 });
          tl.set(pb, { opacity: 1 }, T.punch);
          tl.fromTo(pb, { scale: 1.3 }, { scale: 0.94, duration: 0.09, ease: "power4.in", immediateRender: false }, T.punch);
          tl.fromTo(pb, { scale: 0.94 }, { scale: 1, duration: 0.32, ease: "back.out(3)", immediateRender: false }, T.punch + 0.09);
          tw({ z: C.image.zoomFrom, fx: F0[0], fy: F0[1] }, { z: C.image.zoomTo, fx: F1[0], fy: F1[1] }, 0.16, "expo.out", T.punch + 0.07);
          tw({ z: C.image.zoomTo }, { z: C.image.zoomTo + 0.02 }, T.wind - T.punch - 0.23, "none", T.punch + 0.23);
          tw({ sqx: 1, sqy: 1 }, { sqx: 1.03, sqy: 0.97 }, 2 * FR, "power2.out", T.punch + 0.08);
          tw({ sqx: 1.03, sqy: 0.97 }, { sqx: 1, sqy: 1 }, 0.34, "back.out(2.6)", T.punch + 0.08 + 2 * FR);
          if (plate) Look.impact(tl, T.punch + 0.08, { shake: "#shake", amp: 8, dur: 0.2, zoom: 1.012, flash: 0 });
          if (P3) {
            const holder = pb.querySelector(".c3d");
            gsap.set(holder, { transformOrigin: "50% 50%" });
            tl.fromTo(holder, { scale: 1 }, { scale: 1.06, duration: 0.07, ease: "power2.out", immediateRender: false }, T.ignite);
            tl.fromTo(holder, { scale: 1.06 }, { scale: 1, duration: 0.22, ease: "back.out(2.2)", immediateRender: false }, T.ignite + 0.07);
          }
          // one crisp gloss band across the photo, clipped to it
          const spec = $("#spec"), sweeps = [T.land + 0.04, T.ignite + 0.02], SD = 0.35, s0 = sweeps[0], sEnd = sweeps[1] + SD;
          Look.drive(tl, s0, sEnd - s0, (p) => {
            const t = s0 + p * (sEnd - s0);
            let q = -1; sweeps.forEach((a) => { if (t >= a && t <= a + SD) q = (t - a) / SD; });
            if (q < 0 || p <= 0 || p >= 1) { spec.style.opacity = "0"; return; }
            const e = gsap.parseEase("power3.inOut")(q);
            spec.style.transform = "translateX(" + (-380 + (CW + 760) * e).toFixed(1) + "px) rotate(10deg)";
            spec.style.opacity = Math.min(1, Math.sin(Math.PI * q) * 1.3).toFixed(3);
          });

          // ---------- hold: a living drift ----------
          tw({ rz: K.rest, y: 0 }, { rz: K.rest + 0.7, y: -6 }, T.wind - 1.75, "sine.inOut", 1.75);

          // ---------- exit: wind-up, whip out to the upper right, cut on the zero frame ----------
          tw({ sc: 1, rz: K.rest + 0.7, x: 0 }, { sc: 0.97, rz: K.rest - 2.2, x: -18 }, T.whip - T.wind, "power2.out", T.wind);
          tw({ sc: 0.97, rz: K.rest - 2.2, x: -18, y: -6 }, { sc: 1.06, rz: 24, x: 1500, y: -300 }, T.gone - T.whip, "power3.in", T.whip);
          Look.mblur(tl, "#cardMb", T.whip, T.gone - T.whip, { x: 0, y: 0, to: [42, 10], ease: "power2.in" });
          tl.set([pos, shA, shC, shO], { opacity: 0 }, T.gone);

          if (P3) { Look.drive(tl, 0, T.end, (p) => P3.renderAt(p * T.end)); P3.renderAt(0); }
          if (plate) {
            Look.push(tl, "#push", 0, T.end, { from: 1, to: 1.045 });
            Look.install(tl, { duration: T.end, grain: 0.06, vignette: 0.25 });
          }
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
