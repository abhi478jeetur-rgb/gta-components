<!doctype html>
<!-- GTA-niche 16 SFX word, variant A (16:9 long-form, 1920x1080, 30 fps): "NOOOOOOO!!!".
     The creators' giant outlined shout caption, bottom-centre, as real geometry: every letter is an extruded, bevelled
     Three.js mesh traced from Inter Black (white clearcoat enamel over graphite walls, the "!!!" in subscribe red), wrapped
     in one thick ink outline with a drop shadow. Letters slam in one after another and the word stretches out from the
     centre like the scream does; the "!!!" slam is the payoff: the word squashes onto its baseline, punches out to full
     depth, a hop ripples back through the letters, the key light rakes across the bevels and the footage shakes.
     See ../DECISIONS.md. Variable: bg "plate" (sample GTA V footage) / "none" (transparent overlay). -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="media/glyphs.js"></script>
    <script src="media/sfx3d.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; }
      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ov { position: absolute; inset: 0; pointer-events: none; }
      #word { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <div id="shake"><div id="push">
        <video id="shotA" class="clip shot" src="assets/shots/v12-heli-city-dusk-h.mp4" muted playsinline data-start="0" data-duration="0.72" data-media-start="0.68" data-track-index="0"></video>
        <video id="shotB" class="clip shot" src="assets/shots/v34-rocket-heli-h.mp4" muted playsinline data-start="0.72" data-duration="1.2" data-media-start="0.02" data-track-index="0"></video>
        <video id="shotC" class="clip shot" src="assets/shots/v26-bridge-explosion-h.mp4" muted playsinline data-start="1.92" data-duration="1.7" data-media-start="0.02" data-track-index="0"></video>
        <video id="shotD" class="clip shot" src="assets/shots/v30-street-explosion-h.mp4" muted playsinline data-start="3.62" data-duration="0.38" data-media-start="1.0" data-track-index="0"></video>
      </div></div>
      <div id="ov" class="clip" data-start="0" data-duration="4" data-track-index="1"><div id="word"></div></div>
    </div>
    <script>
      const CONFIG = {
        // The shout. Trailing ! / ? marks take the accent colour and land together as the payoff slam.
        text: "NOOOOOOO!!!",
        font: { size: 232, maxInk: 1480, tracking: -0.03 },           // Inter Black; the word auto-fits to maxInk px of ink
        place: { cx: 960, base: 908 },                                 // ink centre x and baseline y: the bottom-centre caption band
        depth: 64, bevel: 7, tilt: 0.30, yaw: -0.24,                   // extrusion (px) and its direction: down and to the right
        ink: 11, shadow: 0.6,                                          // ink outline (px) and drop-shadow strength
        colors: {
          face: ["#FFFFFF", "#EEF2F7", "#C3CCDA"],                     // enamel face: top, middle, bottom
          side: ["#4E5566", "#0F1116"], lip: "#DDE3EE",                // graphite walls: near, far, lit lip
          accentFace: ["#FF3C48", "#EE1528", "#A80A1E"],               // the "!!!"
          accentSide: ["#7A0814", "#200105"], accentLip: "#FF7A82",
          ink: "#0B0C10"
        },
        timing: {
          first: 0.74,      // the first letter starts its slam (lands 0.1 s later)
          step: 0.05,       // between letters
          gap: 0.12,        // the beat before the accent marks
          bangStep: 0.035,  // between the accent marks
          slam: 0.1,        // a letter's fall from the camera
          out: 3.42,        // exit: the word is stomped flat into its baseline, gone on the 3.62 cut
          end: 4.0
        }
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const T = CONFIG.timing, C = CONFIG.colors, $ = (s) => document.querySelector(s);
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));
        const clamp = (x, a, b) => Math.min(b, Math.max(a, x)), H = Look.hash;
        const E = (n) => gsap.parseEase(n), eBack = E("back.out(1.5)"), eIO = E("power2.inOut"), eSine = E("sine.inOut"), eIn = E("power3.in");
        Promise.all(["900 100px Inter"].map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
          const isAccent = (ch) => /[!?]/.test(ch);
          const S = SFX3D({
            W: 1920, H: 1080, glyphs: window.SFX_GLYPHS, pcx: CONFIG.place.cx, pcy: CONFIG.place.base - 90, fov: 10,
            lines: [{ text: CONFIG.text, cx: CONFIG.place.cx, base: CONFIG.place.base, size: CONFIG.font.size, maxInk: CONFIG.font.maxInk }],
            tracking: CONFIG.font.tracking, depth: CONFIG.depth, bevel: CONFIG.bevel, tilt: CONFIG.tilt, yaw: CONFIG.yaw,
            inkPx: CONFIG.ink, inkColor: C.ink, shadow: CONFIG.shadow, shadowOff: [6, 12], curveSeg: 12, specW: 0.28,
            setFor: (ch) => (isAccent(ch) ? "accent" : "base"),
            sets: {
              base: { face: C.face, side: C.side, lip: C.lip, metal: [0.0, 0.55], rough: [0.28, 0.3], emis: [0.36, 0.06] },
              accent: { face: C.accentFace, side: C.accentSide, lip: C.accentLip, metal: [0.0, 0.5], rough: [0.26, 0.3], emis: [0.3, 0.05], tint: [0.9, 0.5] }
            }
          });
          $("#word").appendChild(S.canvas);
          const Ls = S.letters, N = Ls.length, cap = S.cap;

          // ---------- the beat sheet: each letter's landing time ----------
          const tIn = []; let tLast = T.first, nAcc = 0;
          Ls.forEach((L, i) => {
            if (isAccent(L.ch) && i > 0) { tIn.push(tLast + (nAcc ? T.bangStep : T.gap)); tLast = tIn[i]; nAcc++; }
            else { tIn.push(i === 0 ? T.first : T.first + 0.08 + T.step * (i - 1)); tLast = tIn[i]; }
          });
          const tHit = tIn[N - 1] + T.slam;                       // the last mark lands: the payoff
          // the word grows from the centre: the visible ink stays centred as letters arrive
          const inkL0 = Ls[0].inkL, tgt = Ls.map((L) => CONFIG.place.cx - (inkL0 + L.inkR) / 2);
          const jitY = Ls.map((L, i) => (H(i * 7 + 1) - 0.5) * 12), jitR = Ls.map((L, i) => (H(i * 7 + 3) - 0.5) * (isAccent(L.ch) ? 0.12 : 0.08));
          const fall = Ls.map((L, i) => (H(i * 7 + 5) - 0.5) * 0.5);

          function stateAt(t) {
            const st = { letters: [], word: { px: CONFIG.place.cx, py: CONFIG.place.base } };
            // re-centring
            let ox = tgt[0];
            for (let i = 1; i < N; i++) ox += (tgt[i] - tgt[i - 1]) * eBack(clamp((t - tIn[i]) / 0.13, 0, 1));
            const v = t - tHit;
            // payoff: squash onto the baseline, spring back; a slow push through the hold
            const env = v < 0 ? 0 : Math.exp(-v * 6.5) * Math.cos(v * 24);
            const push = 1 + 0.022 * eSine(clamp((t - tHit) / (T.out - tHit), 0, 1));
            let gsx = (1 + 0.085 * env) * push, gsy = (1 - 0.2 * env) * push;
            // exit: a 2-frame stretch, then stomped flat into the baseline
            const xv = t - T.out; let ink = 1;
            if (xv >= 0) {
              const a = clamp(xv / 0.066, 0, 1), b = clamp((xv - 0.066) / 0.13, 0, 1);
              gsy *= (1 + 0.06 * a) * (1 - eIn(b)); gsx *= 1 + 0.22 * eIn(b); ink = clamp(gsy * 1.4, 0, 1);
            }
            // word-layer shake on the hit (small: transient frames stay inside the safe zone)
            let sx = 0, sy = 0;
            if (v >= 0 && v < 0.3) { const fr = Math.floor(v * 30), e2 = Math.pow(1 - v / 0.3, 2); sx = (H(fr * 3 + 11) * 2 - 1) * 7 * e2; sy = (H(fr * 3 + 12) * 2 - 1) * 5 * e2; }
            st.word.x = ox + sx; st.word.y = sy; st.word.sx = gsx; st.word.sy = gsy;
            const gone = xv >= 0 && gsy < 0.03;
            // letters: slam from the camera, squash on landing, settle slightly staggered; the payoff hop ripples back from the marks
            const szHit = v < 0 ? 0.5 : 0.5 + (1 + 0.32 * Math.exp(-v * 7) * Math.cos(v * 20) - 0.5) * clamp(v / 0.066, 0, 1);
            const hold = clamp((t - tHit) / Math.max(0.5, T.out - tHit), 0, 1);
            Ls.forEach((L, i) => {
              const u = t - tIn[i];
              if (u < 0 || gone) { st.letters.push({ vis: false }); return; }
              let s = 1, lx = 1, ly = 1, rz = jitR[i], y = jitY[i];
              if (u < T.slam) {
                const p = u / T.slam, q = (1 - p) * (1 - p);
                s = 1 + 0.45 * q; rz = jitR[i] + fall[i] * q; y += (s - 1) * cap * 0.5;
              } else {
                const w = u - T.slam, q = 0.15 * Math.exp(-w * 10) * Math.cos(w * 30);
                ly = 1 - q; lx = 1 + 0.55 * q;
              }
              const hv = v - (0.03 + 0.022 * (N - 1 - i));
              if (hv > 0 && hv < 0.24) y -= Math.sin(Math.PI * hv / 0.24) * 22 * (1 - 0.3 * hv / 0.24);
              st.letters.push({ vis: true, top: u < T.slam + 0.12, s, sx: lx, sy: ly, rz, y, sz: szHit, yaw: -0.04 + 0.08 * eSine(hold) });
            });
            // light: the key rakes across the bevels on the hit, one wide specular sweeps the faces, bloom peaks for 3 frames
            const rk = eIO(clamp((t - tHit + 0.05) / 0.7, 0, 1));
            st.key = { ang: -0.9 + 1.8 * rk, int: 2.0 + 3.4 * Math.exp(-Math.pow((v - 0.08) / 0.15, 2)) };
            const spP = clamp((t - tHit - 0.03) / 0.3, 0, 1), x0 = S.lines[0].inkL - 0.6 * cap, x1 = S.lines[0].inkR + 1.2 * cap;
            st.spec = { x: x0 + (x1 - x0) * eIO(spP), amp: spP > 0 && spP < 1 ? 0.9 * Math.sin(Math.PI * spP) : 0 };
            st.flash = v < 0 ? 0 : v < 0.1 ? 0.35 : 0.35 * Math.exp(-(v - 0.1) / 0.12);
            st.bloom = 0.08 + (v < 0 ? 0 : v < 0.1 ? 0.2 : 0.2 * Math.exp(-(v - 0.1) / 0.12));
            st.ink = ink;
            return st;
          }

          const tl = gsap.timeline({ paused: true });
          // the layer is hidden outright once the word is gone, so the exit always reaches an empty frame
          const render = (t) => { const on = S.draw(stateAt(t)); $("#word").style.visibility = on ? "visible" : "hidden"; };
          Look.drive(tl, 0, T.end, (p) => render(p * T.end));
          window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") render(e.detail.time); });
          Look.mblur(tl, "#word", T.out + 0.066, 0.13, { x: 0, y: 0, to: [0, 7], ease: "power2.in" });
          if (plate) {
            Look.impact(tl, tHit, { shake: "#shake", amp: 12, dur: 0.36, zoom: 1.035, flash: 0 });
            Look.expose(tl, tHit, { target: "#push", peak: 1.08, hold: 3 / 30, dur: 0.3, saturate: 1.12 });
            Look.push(tl, "#push", 0, T.end, { from: 1.0, to: 1.04 });
          }
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
          render(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
</body>
</html>
