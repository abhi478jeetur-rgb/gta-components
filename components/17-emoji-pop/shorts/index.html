<!doctype html>
<!-- GTA-niche 17 Emoji pop, variant B "Emoji burst" (9:16 Shorts, 1080x1920, 30 fps).
     Our own tears-of-joy face in real Three.js geometry at ~56% of the frame width: a golden clearcoat sphere with raised
     closed-eye arcs, a recessed mouth (teeth band, tongue) displaced from a painted height map, and glossy 3D teardrops.
     ONE payoff: the hero pops in grinning, then BURSTS into the laugh (mouth snaps open, tears squirt out, glass droplets fly,
     one shockwave rolls out from behind it and dissipates, the arcade-magenta rim flares). Two small faces land together
     as the echo. They laugh in bounce, then fall out under gravity. See ../DECISIONS.md.
     Variable: bg "plate" (sample GTA V footage) / "none" (transparent overlay). -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="media/emoji3d.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ov { position: absolute; inset: 0; pointer-events: none; }
      #gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.0" data-width="1080" data-height="1920">
      <div id="shake"><div id="push">
        <video id="shotA" class="clip shot" src="assets/shots/v35-penthouse-dusk-v.mp4" muted playsinline data-start="0" data-duration="4.0" data-media-start="0.2" data-track-index="0"></video>
      </div></div>
      <div id="ov" class="clip" data-start="0" data-duration="4.0" data-track-index="1">
        <canvas id="gl" width="1080" height="1920"></canvas>
      </div>
    </div>
    <script>
      const CONFIG = {
        // the faces: canvas-px centre, radius in px, pop time, exit time, resting tilt (rad), spin-in direction.
        // faces[0] is the hero: it pops in grinning and BURSTS into the laugh at `burst` (the payoff).
        // The others are the echo: give them the same `pop` so they land together, after the burst.
        // Exits are staggered so no falling face crosses another: lower-right, then the hero, then upper-left.
        faces: [
          { x: 505, y: 1110, size: 300, pop: 0.40, burst: 0.74, out: 2.84, tilt: -0.06, spin: -1 },
          { x: 205, y: 762, size: 92, pop: 1.08, out: 3.0, tilt: 0.22, spin: 1 },
          { x: 828, y: 1398, size: 72, pop: 1.08, out: 2.72, tilt: -0.24, spin: -1 }
        ],
        face: { top: "#FFD84A", mid: "#FFC530", low: "#F7A51C", chin: "#F0901A", feature: "#4A2A0B", mouth: "#3A1406", tongue: "#F2566A" },
        tear: "#3CB0FF",
        // one shockwave behind the hero's burst: outer radius from -> to (x the face radius), life (s), front / body / wake colours
        shockwave: { on: true, from: 0.95, to: 1.7, life: 0.34, front: "#FFF3C4", body: "#FFC23A", wake: "#FF4F7A" },
        splash: 8,                      // glass droplets flung from the burst
        rim: "#FF4F7A",                 // rim light from screen-left: the arcade's magenta-red neon (light + a fresnel edge on the faces)
        rimEdge: 0.75,                  // strength of that neon edge; it flares x3 on the burst
        key: "#FFE7CA",                 // warm key, top-left
        shadow: 0.22,
        laughBeat: 0.26,                // seconds per "ha"
        timing: { end: 4.0 },
        // the footage (plate only); keep these in sync with the <video> tags above
        shots: [
          { id: "shotA", src: "v35-penthouse-dusk-v", start: 0, dur: 4.0, in: 0.2 }
        ]
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const W = 1080, H = 1920, C = CONFIG, F = C.face, HA = C.laughBeat;
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));
        const E3 = window.Emoji3D, THREE = window.THREE, kf = E3.kf, lerp = E3.lerp, sstep = E3.sstep, clamp = E3.clamp;
        const MAIN = C.faces[0], K = MAIN.size / 185;   // K: scale of px-tuned motion vs the original 185 px hero

        const stage = E3.Stage(document.getElementById("gl"), W, H, {
          fov: 14, exposure: 0.85, toneMapping: THREE.LinearToneMapping, key: 1.3, keyColor: C.key, rim: 0.85, rimColor: C.rim,
          hemi: 0.5, hemiSky: "#dfe2ff", hemiGround: "#8a4630", shadowOpacity: C.shadow,
          shadowZ: -MAIN.size * 1.2, shadowRadius: 22, shadowSize: 950, bloomThreshold: 1.6,
          env: { ground: "#3a2018", boxes: [
            { w: 30, h: 18, pos: [-14, 30, 22], c: [4, 3.85, 3.6] },     // big soft key box, top-left front
            { w: 6, h: 30, pos: [36, 8, 8], c: [1.5, 1.8, 2.7] },        // dusk-blue window strip, right
            { w: 7, h: 30, pos: [-34, 2, -4], c: [3.0, 0.55, 1.05] },    // arcade neon strip, left
            { w: 40, h: 8, pos: [0, -30, 24], c: [0.75, 0.38, 0.22] }    // warm carpet bounce
          ] }
        });
        stage.dirs.shadow.set(-0.1, 0.2, 1);
        stage.dirs.rim.set(-0.8, 0.3, -0.45);      // from screen-left, behind: a neon edge on the faces' left side
        stage.shadowPlane.material.depthWrite = false;  // the shadow catcher must never occlude the shockwave behind the face

        // ---------- the face: painted + displaced; `open` 0 = toothy grin, 1 = the full open laugh ----------
        function mouthPath(c, X, Y, k) {
          const w = 0.5 + 0.07 * k, d = lerp(0.34, 0.67, k), lift = 0.025 * (1 - k);
          c.beginPath();
          c.moveTo(X(-w), Y(-0.04 + lift));
          c.quadraticCurveTo(X(0), Y(-0.17 + lift * 0.4), X(w), Y(-0.04 + lift));
          c.bezierCurveTo(X(w * 0.93), Y(-0.04 - d * 0.66), X(w * 0.47), Y(-0.04 - d), X(0), Y(-0.04 - d));
          c.bezierCurveTo(X(-w * 0.47), Y(-0.04 - d), X(-w * 0.93), Y(-0.04 - d * 0.66), X(-w), Y(-0.04 + lift));
          c.closePath();
        }
        function teethPath(c, X, Y) {
          c.beginPath();
          c.moveTo(X(-0.6), Y(-0.02)); c.quadraticCurveTo(X(0), Y(-0.15), X(0.6), Y(-0.02));
          c.lineTo(X(0.6), Y(-0.13)); c.quadraticCurveTo(X(0), Y(-0.29), X(-0.6), Y(-0.13)); c.closePath();
        }
        function eyePath(c, X, Y, sd) {
          const cx = sd * 0.34, cy = 0.19;
          c.beginPath();
          c.moveTo(X(cx - 0.17), Y(cy - 0.06 - sd * 0.02));
          c.quadraticCurveTo(X(cx), Y(cy + 0.17), X(cx + 0.17), Y(cy - 0.06 + sd * 0.02));
        }
        function drawFace(ctx, hctx, S, P) {
          const k = P.open == null ? 1 : P.open;
          const X = (x) => (x + 1) / 2 * S, Y = (y) => (1 - y) / 2 * S, U = (d) => d / 2 * S;
          let g = ctx.createLinearGradient(0, Y(1), 0, Y(-1));
          g.addColorStop(0, F.top); g.addColorStop(0.42, F.mid); g.addColorStop(0.85, F.low); g.addColorStop(1, F.chin);
          ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
          // a warm radial lift in the upper face
          g = ctx.createRadialGradient(X(-0.15), Y(0.45), U(0.05), X(-0.1), Y(0.3), U(0.9));
          g.addColorStop(0, "rgba(255,226,90,0.25)"); g.addColorStop(1, "rgba(255,226,90,0)");
          ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
          // eyes: raised strokes, round caps
          ctx.lineCap = hctx.lineCap = "round"; ctx.lineJoin = hctx.lineJoin = "round";
          [-1, 1].forEach((sd) => {
            eyePath(ctx, X, Y, sd); ctx.strokeStyle = F.feature; ctx.lineWidth = U(0.092); ctx.stroke();
            eyePath(hctx, X, Y, sd); hctx.strokeStyle = "#d6d6d6"; hctx.lineWidth = U(0.10); hctx.stroke();
          });
          // mouth: dark cavity, a teeth band under the top lip, the tongue at the bottom, a crisp lip line
          ctx.save(); mouthPath(ctx, X, Y, k); ctx.clip();
          g = ctx.createRadialGradient(X(0), Y(-0.36), U(0.05), X(0), Y(-0.36), U(0.62));
          g.addColorStop(0, "#1E0803"); g.addColorStop(1, F.mouth);
          ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
          const ty = lerp(-0.42, -0.66, k);
          g = ctx.createRadialGradient(X(-0.05), Y(ty + 0.11), U(0.03), X(0), Y(ty + 0.04), U(0.34));
          g.addColorStop(0, "#FF8A96"); g.addColorStop(0.6, F.tongue); g.addColorStop(1, "#B8324A");
          ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(X(0), Y(ty), U(0.33), U(0.2), 0, 0, Math.PI * 2); ctx.fill();
          g = ctx.createLinearGradient(0, Y(-0.05), 0, Y(-0.27));
          g.addColorStop(0, "#FFFFFF"); g.addColorStop(0.75, "#F4F0EC"); g.addColorStop(1, "#D9D2CC");
          ctx.fillStyle = g; teethPath(ctx, X, Y); ctx.fill();
          ctx.restore();
          mouthPath(ctx, X, Y, k); ctx.strokeStyle = "#8A4508"; ctx.lineWidth = U(0.022); ctx.stroke();
          // height: the mouth is a recess; the teeth and tongue sit a little higher inside it
          hctx.save(); mouthPath(hctx, X, Y, k); hctx.fillStyle = "#1a1a1a"; hctx.fill(); hctx.clip();
          hctx.fillStyle = "#4a4a4a"; hctx.beginPath(); hctx.ellipse(X(0), Y(ty), U(0.33), U(0.2), 0, 0, Math.PI * 2); hctx.fill();
          hctx.fillStyle = "#5a5a5a"; teethPath(hctx, X, Y); hctx.fill();
          hctx.restore();
          // cheeks lifted by the laugh
          hctx.save(); hctx.filter = "blur(" + Math.round(S * 0.03) + "px)"; hctx.fillStyle = "rgba(190,190,190," + (0.55 + 0.35 * k).toFixed(3) + ")";
          [-1, 1].forEach((sd) => { hctx.beginPath(); hctx.ellipse(X(sd * 0.55), Y(-0.08 + 0.03 * k), U(0.2), U(0.15), 0, 0, Math.PI * 2); hctx.fill(); });
          hctx.restore();
        }
        const face = E3.faceSphere({
          detail: 112, tex: 2048, hmap: 768, blur: 5, depth: 0.12,
          shape: (x, y, z) => [x * 1.01, y * 0.975, z * 0.97],
          // edge falloff toward warm orange, not grey (grey on yellow reads olive)
          vcolor: (x, y, z) => { const a = (1 - 0.08 * sstep(0.2, -1, y)) * (0.9 + 0.1 * sstep(-0.1, 0.75, z)); return [a, a * 0.95, a * 0.86]; },
          draw: drawFace,
          material: { roughness: 0.46, specularIntensity: 0.4, clearcoat: 1, clearcoatRoughness: 0.07, envMapIntensity: 0.6, emissive: "#C85A06", emissiveIntensity: 0.07 }
        });
        // the arcade neon: a fresnel edge on the faces' screen-left side (view-space normal.x < 0), pulsed on the burst
        const rimU = { uRimCol: { value: new THREE.Color(C.rim) }, uRimI: { value: C.rimEdge } };
        {
          const P = face.geometry.attributes.position.array, SN = new Float32Array(P.length);
          for (let i = 0; i < P.length; i += 3) { const l = Math.hypot(P[i], P[i + 1], P[i + 2]) || 1; SN[i] = P[i] / l; SN[i + 1] = P[i + 1] / l; SN[i + 2] = P[i + 2] / l; }
          face.geometry.setAttribute("snormal", new THREE.Float32BufferAttribute(SN, 3));
        }
        face.material.onBeforeCompile = (sh) => {
          sh.uniforms.uRimCol = rimU.uRimCol; sh.uniforms.uRimI = rimU.uRimI;
          sh.vertexShader = sh.vertexShader
            .replace("#include <common>", "#include <common>\nattribute vec3 snormal; varying vec3 vSN;")
            .replace("#include <beginnormal_vertex>", "#include <beginnormal_vertex>\nvSN = normalize( normalMatrix * snormal );");
          sh.fragmentShader = sh.fragmentShader
            .replace("#include <common>", "#include <common>\nuniform vec3 uRimCol; uniform float uRimI; varying vec3 vSN;")
            .replace("#include <emissivemap_fragment>", [
              "#include <emissivemap_fragment>",
              "{ vec3 vv = normalize( vViewPosition ); vec3 sn = normalize( vSN ); float ndv = clamp( dot( sn, vv ), 0.0, 1.0 );",
              "  float fr = pow( 1.0 - ndv, 2.4 );",
              "  float side = smoothstep( 0.3, -0.75, sn.x );",
              "  float up = 0.5 + 0.5 * smoothstep( -0.8, 0.35, sn.y );",
              "  totalEmissiveRadiance += uRimCol * fr * side * up * uRimI; }"].join("\n"));
        };
        face.material.customProgramCacheKey = () => "emoji17-rim";
        let openKey = -1;
        function setOpen(k) { const q = Math.round(clamp(k, 0, 1.06) * 32) / 32; if (q !== openKey) { openKey = q; face.update({ open: q }); } }
        setOpen(0);

        // ---------- tears and droplets ----------
        const tearProfile = [];
        for (let i = 0; i <= 40; i++) { const th = (i / 40) * Math.PI; tearProfile.push(new THREE.Vector2(Math.max(1e-4, Math.sin(th) * Math.pow((1 - Math.cos(th)) / 2, 0.85) * 0.78), Math.cos(th))); }
        const tearGeo = new THREE.LatheGeometry(tearProfile, 48);
        const tearMat = new THREE.MeshPhysicalMaterial({ color: new THREE.Color(C.tear), roughness: 0.05, clearcoat: 1, clearcoatRoughness: 0.03, envMapIntensity: 1.25, emissive: new THREE.Color("#0B4C96"), emissiveIntensity: 0.18, ior: 1.33, specularIntensity: 1 });
        const dropGeo = new THREE.SphereGeometry(1, 32, 20);
        const DOWN = new THREE.Vector3(0, -1, 0);

        function buildFace(cfg, idx) {
          const g = new THREE.Group();
          const m = new THREE.Mesh(face.geometry, face.material); m.castShadow = true; g.add(m);
          const tears = [-1, 1].map((sd) => {
            const tip = new THREE.Vector3(sd * 0.56, 0.12, 0.8);
            const dir = new THREE.Vector3(sd * 0.62, -0.5, -0.34).normalize();
            const t = new THREE.Mesh(tearGeo, tearMat); t.castShadow = true;
            t.quaternion.setFromUnitVectors(DOWN.clone().negate(), dir.clone().negate()); // tip (+y) points back to the eye
            g.add(t);
            const drops = [0, 1].map(() => { const d = new THREE.Mesh(dropGeo, tearMat); d.castShadow = true; g.add(d); return d; });
            return { sd, tip, dir, mesh: t, drops };
          });
          const root = new THREE.Group(); root.add(g); stage.scene.add(root);
          return { cfg, idx, root, g, tears };
        }
        const FACES3 = C.faces.map(buildFace);

        // ---------- the shockwave: ONE band of light that rolls out from behind the hero's burst and dissipates ----------
        // a flat disc in a tilted plane behind the face; the shader draws a crisp hot front, a soft magenta wake, and the
        // band thins and dims together to zero (never cut from full opacity). Premultiplied, so it only adds light.
        const SW = C.shockwave;
        const swMat = new THREE.ShaderMaterial({
          transparent: true, depthWrite: false, depthTest: true, side: THREE.DoubleSide,
          blending: THREE.CustomBlending, blendEquation: THREE.AddEquation,
          blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor, blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneMinusSrcAlphaFactor,
          uniforms: { uIn: { value: 0.6 }, uA: { value: 1 }, uHot: { value: 1 }, uPx: { value: 1 },
            cF: { value: new THREE.Color(SW.front) }, cB: { value: new THREE.Color(SW.body) }, cW: { value: new THREE.Color(SW.wake) } },
          vertexShader: "varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
          fragmentShader: [
            "uniform float uIn, uA, uHot, uPx; uniform vec3 cF, cB, cW; varying vec2 vP;",
            "void main(){",
            "  float r = length(vP);",
            "  float s = clamp((r - uIn) / max(1e-4, 1.0 - uIn), 0.0, 1.0);",
            "  float edge = uPx / max(1e-4, 1.0 - uIn);",                    // ~1.5 px of anti-aliasing at the front
            "  float front = 1.0 - smoothstep(1.0 - edge, 1.0, s);",
            "  float wake = smoothstep(0.0, 0.8, s);",
            "  float a = pow(wake, 2.6) * front * uA;",
            "  vec3 col = mix(cW, cB, smoothstep(0.15, 0.65, s));",
            "  col = mix(col, cF * uHot, smoothstep(0.62, 0.95, s));",
            "  if (r > 1.0) a = 0.0;",
            "  gl_FragColor = vec4(col * a, a * 0.32);",
            "}"].join("\n")
        });
        const swMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2, 1, 1), swMat);
        swMesh.visible = false; swMesh.renderOrder = 2; stage.scene.add(swMesh);
        const eSW = E3.ease("power3.out");
        function applyShock(t) {
          const u = (t - MAIN.burst - 0.01) / SW.life;
          if (!SW.on || u < 0 || u >= 1) { swMesh.visible = false; return; }
          const e = eSW(u), R = MAIN.size * lerp(SW.from, SW.to, e);
          const band = MAIN.size * lerp(0.34, 0.12, sstep(0, 1, u));          // a hot front with a short wake; it thins but never to a hairline
          const fade = 1 - sstep(0.25, 0.86, u);                               // dims to exactly 0 before the end of its life
          swMesh.scale.set(R, R, 1);
          swMat.uniforms.uIn.value = Math.max(0, 1 - band / R);
          swMat.uniforms.uA.value = fade * sstep(0, 0.06, u);
          swMat.uniforms.uHot.value = lerp(3.0, 1.2, sstep(0, 0.7, u));
          swMat.uniforms.uPx.value = 1.6 / R;
          swMesh.position.set(MAIN.x, -MAIN.y, -MAIN.size * 0.4);
          swMesh.rotation.set(0.45, -0.18, 0);
          swMesh.visible = true;
        }
        // ---------- splash: glass droplets flung from the burst, under gravity ----------
        const SPL = []; for (let i = 0; i < C.splash; i++) { const d = new THREE.Mesh(dropGeo, tearMat); d.castShadow = true; d.visible = false; stage.scene.add(d); SPL.push(d); }
        const UPV = new THREE.Vector3(0, 1, 0);
        function applySplash(t) {
          SPL.forEach((d, i) => {
            const f = t - MAIN.burst - 0.03 - 0.04 * Look.hash(i * 5 + 2), life = 0.45 + 0.2 * Look.hash(i * 7 + 3);
            if (f < 0 || f > life) { d.visible = false; return; }
            // irregular: each drop its own angle over the upper half, speed and size
            const a = Math.PI * (0.06 + 0.88 * ((i + Look.hash(i * 13 + 1)) / SPL.length)) + 0.35 * (Look.hash(i * 23 + 4) - 0.5);
            const sp = (480 + 520 * Look.hash(i * 31 + 5)) * Math.sqrt(K), dx = Math.cos(a), dy = Math.sin(a), g = 2600 * Math.sqrt(K);
            const x0 = MAIN.x + dx * MAIN.size * 0.9, y0 = MAIN.y - dy * MAIN.size * 0.9;
            const vx = dx * sp * 0.5, vy = dy * sp - g * f;         // world y is up (canvas y down)
            d.position.set(x0 + vx * f, -y0 + dy * sp * f - 0.5 * g * f * f, 30 * K);
            const px = x0 + vx * f, edge = E3.clamp(Math.min(px - 90, 915 - px) / 70, 0, 1);
            const r = (6 + 10 * Look.hash(i * 17 + 9)) * Math.sqrt(K) * E3.clamp(f / 0.04, 0, 1) * E3.clamp((life - f) / 0.12, 0, 1) * edge;
            const v = new THREE.Vector3(vx, vy, 0), sv = v.length();
            d.quaternion.setFromUnitVectors(UPV, v.normalize());
            d.scale.set(r, r * (1 + Math.min(1.2, sv / 900)), r);
            d.visible = r > 0.3;
          });
        }

        // ---------- motion: a pure function of time ----------
        const isMain = (cfg) => cfg === MAIN;
        const burstOf = (cfg) => (cfg.burst != null ? cfg.burst : cfg.pop);
        function openAt(t) { return kf(t - MAIN.burst, [[0, 0], [0.1, 1.05, "power3.out"], [0.2, 1, "sine.inOut"]]); }
        function pose(cfg, t) {
          const p = t - cfg.pop, r = t - cfg.out, b = t - burstOf(cfg), main = isMain(cfg), sp = cfg.spin || -1;
          const o = { vis: p >= 0, x: 0, y: 0, z: main ? 0 : -110, s: 1, st: 1, rx: 0, ry: 0, rz: cfg.tilt, tear: 0, beat: 0 };
          if (!o.vis) return o;
          // arrival: spin in from below with a stretch, squash on landing, settle
          o.s = kf(p, [[0, 0.3], [0.10, 1.10, "power2.out"], [0.18, 0.95, "sine.inOut"], [0.27, 1.02, "sine.inOut"], [0.36, 1, "sine.inOut"]]);
          o.st = kf(p, [[0, 1.45], [0.09, 1.2, "power1.out"], [0.135, 0.8, "power2.out"], [0.21, 1.08, "sine.inOut"], [0.3, 0.98, "sine.inOut"], [0.4, 1, "sine.inOut"]]);
          o.y = kf(p, [[0, 130], [0.10, -20, "power3.out"], [0.2, 6, "sine.inOut"], [0.3, 0, "sine.inOut"]]) * cfg.size / 200;
          o.rz += kf(p, [[0, 0.55 * sp], [0.12, -0.12 * sp, "power2.out"], [0.24, 0.05 * sp, "sine.inOut"], [0.36, 0, "sine.inOut"]]);
          o.ry = kf(p, [[0, 0.9 * sp], [0.14, -0.18 * sp, "power2.out"], [0.28, 0.06 * sp, "sine.inOut"], [0.42, 0, "sine.inOut"]]);
          o.rx = kf(p, [[0, 0.3], [0.14, -0.08, "power2.out"], [0.3, 0, "sine.inOut"]]);
          if (main) {
            // the burst: a short anticipation squash, then it stretches up and lands in the laugh
            o.st *= kf(b, [[-0.12, 1], [0, 0.87, "power2.in"], [0.06, 1.17, "power2.out"], [0.15, 0.94, "sine.inOut"], [0.25, 1.03, "sine.inOut"], [0.36, 1, "sine.inOut"]]);
            o.s *= kf(b, [[-0.12, 1], [0, 0.97, "power2.in"], [0.06, 1.05, "power2.out"], [0.2, 1, "sine.inOut"]]);
            o.y += kf(b, [[-0.12, 0], [0, 9, "power2.in"], [0.07, -16, "power2.out"], [0.2, 0, "sine.inOut"]]) * cfg.size / 200;
            o.rx += kf(b, [[-0.12, 0], [0, 0.07, "power2.in"], [0.08, -0.1, "power2.out"], [0.24, 0, "sine.inOut"]]);
            o.tear = kf(b, [[0, 0], [0.12, 1.16, "back.out(2)"], [0.24, 1, "sine.inOut"]]);
          } else {
            o.tear = kf(p, [[0.08, 0], [0.22, 1.16, "back.out(2)"], [0.32, 1, "sine.inOut"]]);
          }
          // laughing: a bounce per "ha", alternating wobble
          const q = main ? b - 0.2 : p - 0.34;
          if (q > 0) {
            const ph = q / HA, beat = 0.5 - 0.5 * Math.cos(2 * Math.PI * ph);
            const amp = sstep(0, 0.2, q);
            o.beat = beat * amp;
            o.y += -10 * o.beat * cfg.size / 200;
            o.st *= 1 + 0.045 * o.beat - 0.02;
            o.rz += 0.06 * Math.sin(Math.PI * ph) * amp;
            o.ry += 0.1 * Math.sin(2 * Math.PI * q / (HA * 4)) * amp;
            o.tear *= 1 + 0.12 * o.beat;
          }
          if (r >= 0) {
            o.st *= kf(r, [[0, 1], [0.1, 0.84, "power2.out"], [0.2, 1.14, "power2.out"], [0.34, 1.0, "sine.inOut"]]);
            o.y += kf(r, [[0, 0], [0.1, 12, "power2.out"], [0.22, -60, "power2.out"]]) * cfg.size / 200;
            if (r > 0.22) { const f = r - 0.22, side = cfg.x < 540 ? -1 : 1, gK = main ? 1.25 : 1; o.y += 0.5 * 7600 * gK * f * f; o.x += side * (main ? 200 : 300) * f; o.rz += side * (-3.0 * f * f - 1.0 * f); o.ry += 1.3 * f; o.rx += 0.8 * f; }
          }
          return o;
        }
        function applyFace(F3, t, tf) {
          // sub-frames never reach before a face's pop (a half-visible first frame would read see-through)
          const cfg = F3.cfg, o = pose(cfg, tf >= cfg.pop ? Math.max(t, cfg.pop) : t);
          F3.root.visible = o.vis;
          if (!o.vis) return;
          const s = o.s * cfg.size, sx = s / Math.sqrt(o.st), sy = s * Math.sqrt(o.st);
          F3.root.position.set(cfg.x + o.x, -(cfg.y + o.y), o.z);
          F3.root.rotation.z = 0;
          F3.g.scale.set(sx, sy, s);
          F3.g.rotation.set(o.rx, o.ry, o.rz);
          const bt = burstOf(cfg) + (isMain(cfg) ? 0.16 : 0.3);
          F3.tears.forEach((tr) => {
            const k = Math.max(0.0001, o.tear), L = 0.47;
            tr.mesh.visible = o.tear > 0.002;
            tr.mesh.scale.set(0.47 * Math.min(1, k * 1.1), L * k, 0.32 * Math.min(1, k * 1.1));
            tr.mesh.position.copy(tr.tip).addScaledVector(tr.dir, L * k);
            // droplets: flung from the bulbs on the first laugh beats, arcing out and falling
            const hv = isMain(cfg) ? 0.25 : 1, vv = isMain(cfg) ? 0.8 : 1, dl = isMain(cfg) ? 0.55 : 0.75;
            tr.drops.forEach((d, i) => {
              const t0 = bt + i * HA * 2 + (tr.sd > 0 ? 0.06 : 0), f = t - t0;
              if ((!isMain(cfg) && i > 0) || f < 0 || f > dl) { d.visible = false; return; }
              d.visible = true;
              const v = [tr.sd * (1.25 + 0.3 * i) * hv, (2.0 - 0.3 * i) * vv], gr = 10 * vv;
              const start = tr.tip.clone().addScaledVector(tr.dir, 0.9);
              d.position.set(start.x + v[0] * f, start.y + v[1] * f - 0.5 * gr * f * f, start.z + 0.1);
              const rr = (0.1 - 0.015 * i) * E3.clamp(1 - (f - (dl - 0.25)) / 0.25, 0, 1) * E3.clamp(f / 0.05, 0, 1);
              d.scale.set(rr * 0.9, rr * 1.15, rr * 0.9);
            });
          });
        }
        // the payoff light: held 3 frames at full, then it eases off
        const glowAt = (t) => kf(t - MAIN.burst, [[0.01, 0], [0.05, 1, "power2.out"], [0.15, 1], [0.6, 0, "power2.inOut"]]);
        function lightAt(t) {
          const b = t - MAIN.burst, g = glowAt(t);
          stage.dirs.key.set(kf(b, [[-0.3, -0.7], [0.4, 0.5, "power2.inOut"], [1.7, -0.35, "sine.inOut"]]), 0.78, 0.62);
          stage.rim.intensity = 0.85 * (1 + 2.2 * g);
          rimU.uRimI.value = C.rimEdge * (1 + 2.0 * g);
          stage.key.intensity = 1.3 * (1 + 0.45 * g);
          stage.aim(MAIN.x, MAIN.y);
        }
        let TF = 0;
        function update(ts) {
          lightAt(ts);
          FACES3.forEach((F3) => applyFace(F3, ts, TF));
          applyShock(TF >= MAIN.burst ? Math.max(ts, MAIN.burst) : ts);
          applySplash(TF >= MAIN.burst ? Math.max(ts, MAIN.burst) : ts);
        }
        const win = (t, t0, a, b) => t - t0 >= a && t - t0 < b;
        const fast = (t) => win(t, MAIN.burst, -0.14, 0.4) || C.faces.some((f) => win(t, f.pop, -0.02, 0.3) || win(t, f.out, 0.06, 1.3));
        const early = (t) => C.faces.some((f) => win(t, f.pop, -0.02, 0.14)) || win(t, MAIN.burst, -0.02, 0.12);
        function renderAt(t) {
          TF = t; const g = glowAt(t);
          setOpen(openAt(t));
          const first = C.faces.some((f) => win(t, f.pop, 0, 0.07));
          const falling = C.faces.some((f) => win(t, f.out, 0.15, 1.3));
          stage.frame(t, update, early(t) ? 16 : (falling ? 24 : (fast(t) ? 10 : 1)), first ? 0.2 : 0.5, 0.14 + 0.34 * g);
        }

        const FONTS = ["900 100px Inter"];
        Promise.all(FONTS.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
          const tl = gsap.timeline({ paused: true });
          Look.drive(tl, 0, C.timing.end, (p) => renderAt(p * C.timing.end));
          window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") renderAt(e.detail.time); });
          tl.set({}, {}, C.timing.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
          renderAt(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
