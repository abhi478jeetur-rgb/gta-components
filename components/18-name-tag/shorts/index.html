<!doctype html>
<!-- 18 Name tag, variant B "Character intro" (9:16, 1080x1920, 30 fps, 4.0 s).
     The character-intro freeze: the shot freezes on the character's look to camera, the world drops into a duotone in his
     colour while he stays natural (a head-and-shoulders matte with a green rim behind his head), and one big name tag slams
     in above him. The name is real geometry (Three.js, media/name3d.js): extruded, bevelled Archivo caps that land in white
     enamel and ignite into candy green behind a light front, then LOCK IN (scale punch, shake, bevel bloom held 3 frames).
     A green enamel role plate with a pointer tail ties it to his head. On the release the tag collapses into the tail tip
     while the frozen frame whips out, and the edit lands on the getaway.
     Variable: bg "plate" (sample GTA V footage + freeze-tint) / "none" (transparent overlay: the tag only). -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="media/glyphs.js"></script>
    <script src="media/name3d.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push { position: absolute; inset: 0; }
      .shot, .still { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #frz { position: absolute; inset: 0; visibility: hidden; }
      #tint { position: absolute; inset: 0; }
      #tint .duo { filter: url(#duo); }
      #tint .vig { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 62% at 30% 50%, rgba(0,0,0,0) 40%, rgba(0,12,6,0.3) 100%); }
      #tint .rimg { mix-blend-mode: screen; }
      #ov { position: absolute; inset: 0; }
      #nameWrap { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; opacity: 0; }
      #nameWrap .shade { position: absolute; }
      #tag { position: absolute; left: 0; top: 0; width: 0; height: 0; }
      #chipClip { position: absolute; overflow: visible; }
      /* the role plate: green enamel in the name's colour, a lit top rim, a dark bottom bevel, a short extruded side and
         the same ink keyline as the 3D name */
      #chip { position: absolute; left: 0; top: 0; border-radius: 999px;
        background: linear-gradient(180deg, #5AF094 0%, #2BD46C 30%, #19AE58 66%, #0E7A3A 100%);
        box-shadow: inset 0 2px 0 rgba(255,255,255,0.42), inset 0 -2px 0 rgba(0,40,16,0.5), inset 0 -10px 14px rgba(0,60,24,0.28),
          0 6px 0 0 #0A6430, 0 0 0 6px #05070A, 0 6px 0 6px #05070A, 0 20px 30px rgba(0,0,0,0.42); }
      #chip .gloss { position: absolute; left: 18px; right: 18px; top: 4px; height: 40%; border-radius: 999px;
        background: linear-gradient(180deg, rgba(255,255,255,0.30), rgba(255,255,255,0)); }
      #chip .win { position: absolute; overflow: hidden; }
      #roleTxt { position: absolute; left: 0; top: 0; white-space: nowrap; color: #fff; font-family: "Inter"; font-weight: 800;
        text-transform: uppercase; text-shadow: 0 2px 0 rgba(4,60,26,0.75); }
      #chip .sheen { position: absolute; inset: 0; border-radius: 999px; overflow: hidden; }
      #chip .sheen i { position: absolute; top: -20%; bottom: -20%; width: 120px; left: -160px; transform: skewX(-18deg);
        background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.42), rgba(255,255,255,0)); }
      #tail { position: absolute; transform-origin: 50% 0; filter: drop-shadow(0 6px 8px rgba(0,0,0,0.45)); }
      #tail i { position: absolute; display: block; }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden">
      <!-- the freeze duotone: luminance -> contrast -> Franklin-green ramp; shadows land on a deep green (#0A3A1E), not black -->
      <filter id="duo" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0" />
        <feComponentTransfer>
          <feFuncR type="linear" slope="1.45" intercept="-0.08" /><feFuncG type="linear" slope="1.45" intercept="-0.08" /><feFuncB type="linear" slope="1.45" intercept="-0.08" />
        </feComponentTransfer>
        <feComponentTransfer>
          <feFuncR type="table" tableValues="0.04 0.06 0.16 0.52 0.92" />
          <feFuncG type="table" tableValues="0.23 0.30 0.52 0.86 1.00" />
          <feFuncB type="table" tableValues="0.12 0.15 0.25 0.58 0.90" />
        </feComponentTransfer>
      </filter>
      <!-- the release whip: a horizontal directional blur (stdDeviation x driven from the timeline) -->
      <filter id="whip" x="-5%" y="0%" width="110%" height="100%" color-interpolation-filters="sRGB">
        <feGaussianBlur id="whipB" stdDeviation="0 0" />
      </filter>
    </svg>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <div id="shake"><div id="push">
        <video id="shotA" class="clip shot" src="assets/shots/v31-red-car-sunset-v.mp4" muted playsinline data-start="0" data-duration="0.9" data-media-start="0" data-track-index="0"></video>
        <video id="shotB" class="clip shot" src="assets/shots/v17-deluxo-sunset-v.mp4" muted playsinline data-start="3.34" data-duration="0.66" data-media-start="0.92" data-track-index="0"></video>
        <div id="frz">
          <img class="still" src="media/freeze-v31.png" alt="" />
          <div id="tint"><img class="still duo" src="media/freeze-v31.png" alt="" /><div class="vig"></div><img class="still rimg" src="media/freeze-v31-rim.png" alt="" /></div>
          <img class="still" id="cut" src="media/freeze-v31-cut.png" alt="" />
        </div>
      </div></div>
      <div id="ov" class="clip" data-start="0" data-duration="4" data-track-index="1">
        <div id="nameWrap"></div>
        <div id="tag">
          <div id="tail"><i class="ink"></i><i class="fill"></i></div>
          <div id="chipClip"><div id="chip"><div class="gloss"></div><div class="win"><div id="roleTxt"></div></div><div class="sheen"><i></i></div></div></div>
        </div>
      </div>
    </div>
    <script>
      const CONFIG = {
        name: "FRANKLIN",
        role: "THE GETAWAY DRIVER",
        // the character's head on the frozen frame (px): media/freeze-v31-cut.png is his head-and-shoulders matte (natural colour
        // over the duotone), media/freeze-v31-rim.png the green rim behind his head; the tail points at `top`
        head: { x: 280, y: 940, top: 722 },
        // the frozen frame is media/freeze-v31.png = shotA media time `at`; `release` starts the whip, `cut` lands on shotB
        freeze: { at: 0.90, release: 3.22, cut: 3.34 },
        name3d: { size: 250, maxInk: 790, cx: 504, cy: 430, depth: 30, bevel: 6.5, tilt: 0.3, ink: 7, shade: 0.4 },
        chip: { y: 568, h: 92, text: 40, track: 0.08, pad: 50, cx: 504 },
        tail: { w: 46, ink: 6 },
        colors: {
          whiteFace: ["#FFFFFF", "#E2E7EE"], whiteSide: ["#2A2F3A", "#07080B"],
          face: ["#D8FFB8", "#46E07A", "#0B8A40"], lip: "#9DF5AE", side: ["#0A7436", "#022010"], hot: "#EFFFE4",
          ink: "#05070A", tail: ["#5FF09A", "#11A34C"]
        },
        // slam: the name lands white; ignite: the light front starts; lock: the fill completes (punch + bloom); out: the tag exits
        timing: { slam: 0.96, ignite: 1.16, frontDur: 0.2, lock: 1.36, chip: 1.42, tail: 1.56, out: 3.06, end: 4.0 }
      };

      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const C = CONFIG, T = C.timing, F = C.freeze, K = C.colors, $ = (s) => document.querySelector(s);
        if (!plate) { document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none")); $("#frz").style.display = "none"; }
        const clamp = (x, a, b) => Math.min(b, Math.max(a, x)), lerp = (a, b, k) => a + (b - a) * k;
        const spring = (t, w, z) => { if (t <= 0) return 0; const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); };
        const E = (n) => gsap.parseEase(n);

        const FACES = ["900 100px Archivo", "800 100px Inter"];
        Promise.all(FACES.map((f) => document.fonts.load(f, "FRANKLIN THE GETAWAY DRIVER"))).then(() => document.fonts.ready).then(() => {
          // ---------- 3D name ----------
          const N3 = C.name3d;
          const P = Name3D({
            W: 1080, H: 1920, glyphs: window.PAYOFF_GLYPHS, text: C.name, size: N3.size, tracking: -0.005, maxInk: N3.maxInk,
            cx: N3.cx, cy: N3.cy, depth: N3.depth, bevel: N3.bevel, tilt: N3.tilt, inkPx: N3.ink, inkColor: K.ink, shadow: 0.6, shadowOff: 10,
            colors: { whiteFace: K.whiteFace, whiteSide: K.whiteSide, goldFace: K.face, goldLip: K.lip, goldSide: K.side, hot: K.hot },
            timing: { ignite: T.ignite, frontDur: T.frontDur, lockAt: T.lock, specAt: T.lock + 0.06, specDur: 0.5, rakeDur: 0.65, holdEnd: T.out }
          });
          const wrap = $("#nameWrap");
          const shade = document.createElement("div"); shade.className = "shade";
          const sw = P.inkW * 1.25, shH = P.cap * 2.4;
          shade.style.cssText = "left:" + (N3.cx - sw / 2) + "px;top:" + (N3.cy - shH / 2 + 14) + "px;width:" + sw + "px;height:" + shH + "px;" +
            "background:radial-gradient(closest-side, rgba(0,0,0," + N3.shade + ") 0%, rgba(0,0,0," + (N3.shade * 0.55).toFixed(3) + ") 55%, rgba(0,0,0,0) 100%)";
          wrap.appendChild(shade); wrap.appendChild(P.canvas);

          // ---------- role plate + tail ----------
          const CH = C.chip, chip = $("#chip"), clip = $("#chipClip"), txt = $("#roleTxt"), win = chip.querySelector(".win");
          txt.textContent = C.role;
          txt.style.cssText = "font-size:" + CH.text + "px;letter-spacing:" + CH.track + "em;line-height:" + CH.h + "px;height:" + CH.h + "px";
          const tw = txt.getBoundingClientRect().width - CH.text * CH.track;   // drop the trailing tracking for optical centring
          const cw = Math.round(2 * CH.pad + tw), cx0 = Math.round(CH.cx - cw / 2);
          clip.style.cssText = "left:" + cx0 + "px;top:" + CH.y + "px;width:" + cw + "px;height:" + CH.h + "px";
          chip.style.width = cw + "px"; chip.style.height = CH.h + "px";
          win.style.cssText = "left:" + CH.pad + "px;top:0;width:" + (tw + CH.text * CH.track + 4) + "px;height:" + CH.h + "px";
          // tail: from under the plate down to just above the head, green enamel with the ink keyline
          const HD = C.head, tailTop = CH.y + CH.h - 4, tailTip = HD.top - 10, tailX = HD.x + 18;
          const tail = $("#tail"), tW = C.tail.w, tH = tailTip - tailTop, ik = C.tail.ink;
          const TP = "polygon(0 0,100% 0,57% 94%,50% 100%,43% 94%)";
          tail.style.cssText = "left:" + (tailX - tW / 2) + "px;top:" + tailTop + "px;width:" + tW + "px;height:" + tH + "px";
          tail.querySelector(".ink").style.cssText = "left:" + (-ik) + "px;top:0;width:" + (tW + 2 * ik) + "px;height:" + (tH + ik) + "px;background:" + K.ink + ";clip-path:" + TP;
          tail.querySelector(".fill").style.cssText = "left:0;top:0;width:" + tW + "px;height:" + tH + "px;clip-path:" + TP + ";" +
            "background:linear-gradient(90deg," + K.tail[1] + " 0%," + K.tail[0] + " 45%," + K.tail[1] + " 100%)";
          document.querySelectorAll("#ov *").forEach((n) => { n.setAttribute("data-layout-allow-overlap", ""); n.setAttribute("data-layout-allow-occlusion", ""); n.setAttribute("data-layout-allow-overflow", ""); });

          const tl = gsap.timeline({ paused: true });

          // ---------- footage: live, FREEZE (punch + duotone spreading out from him), hold, WHIP out, land on the getaway ----------
          if (plate) {
            const push = $("#push"), shake = $("#shake"), whipB = $("#whipB"), ov = $("#ov");
            const e2o = E("power2.out"), e1i = E("power1.in"), e3o = E("power3.out");
            Look.drive(tl, 0, T.end, (p) => {
              const t = p * T.end; let s = 1, x = 0, bl = 0, ox = HD.x, oy = HD.y;
              if (t < F.at) s = 1 + 0.025 * (t / F.at);
              else if (t < F.at + 0.07) s = lerp(1.025, 1.085, e2o((t - F.at) / 0.07));
              else if (t < F.at + 0.37) s = lerp(1.085, 1.06, e2o((t - F.at - 0.07) / 0.3));
              else if (t < F.release) s = lerp(1.06, 1.1, (t - F.at - 0.37) / (F.release - F.at - 0.37));
              else if (t < F.cut) { const k = e1i((t - F.release) / (F.cut - F.release)); s = lerp(1.1, 1.32, k); x = -200 * k; bl = 10 * Math.min(1, k * 1.4); }
              else { const k = t - F.cut; ox = 540; oy = 960; s = lerp(1.3, 1.0, e3o(clamp(k / 0.4, 0, 1))); x = 120 * (1 - e3o(clamp(k / 0.2, 0, 1))); bl = 10 * (1 - clamp(k / 0.16, 0, 1)); }
              push.style.transformOrigin = ox + "px " + oy + "px";
              ov.style.transform = t >= F.release && t < F.cut ? "translate(" + x.toFixed(2) + "px,0px)" : "none";   // the collapsing tag rides the whip
              push.style.transform = "translate(" + x.toFixed(2) + "px,0px) scale(" + s.toFixed(4) + ")";
              whipB.setAttribute("stdDeviation", bl.toFixed(2) + " 0");
              shake.style.filter = bl > 0.05 ? "url(#whip)" : "none";
            });
            tl.set("#frz", { visibility: "visible" }, F.at);
            tl.set("#frz", { visibility: "hidden" }, F.cut);
            Look.impact(tl, F.at, { shake: "#shake", amp: 9, dur: 0.26, flash: 0, zoom: 1.0 });
            Look.impact(tl, T.slam + 0.1, { shake: "#shake", amp: 5, dur: 0.2, flash: 0, zoom: 1.0 });
            Look.impact(tl, T.lock, { shake: "#shake", amp: 6, dur: 0.22, flash: 0, zoom: 1.0 });
            // the duotone: a wave front spreads out from his face in 0.22 s and holds until the whip carries the frame away
            const tint = $("#tint");
            const setMask = (r1) => {
              const g = r1 >= 2299 ? "none" : "radial-gradient(circle at " + HD.x + "px " + HD.y + "px, #000 0px, #000 " + r1.toFixed(1) + "px, transparent " + (r1 + 40).toFixed(1) + "px)";
              tint.style.webkitMaskImage = g; tint.style.maskImage = g;
            };
            const eW = E("power2.out");
            Look.drive(tl, 0, T.end, (p) => { const t = p * T.end; setMask(t < F.at ? 0 : 2300 * eW(clamp((t - F.at) / 0.22, 0, 1))); });
            Look.chroma(tl, "#push", F.at, 0.12, { px: 4 });
          }

          // ---------- the name: slams in (scale + blur + drop), lands white, ignites green, LOCKS IN (punch) ----------
          const ox = N3.cx, oy = N3.cy + P.cap / 2;
          gsap.set(wrap, { transformOrigin: ox + "px " + oy + "px", opacity: 0 });
          tl.set(wrap, { opacity: 1 }, T.slam);   // no see-through frames: the name is fully opaque from its first frame (blur + scale carry the entrance)
          const punch = (k) => (k <= 0 ? 0 : 0.09 * Math.sin(k * 2 * Math.PI / 0.2) * Math.exp(-k * 9));
          Look.drive(tl, 0, T.end, (p) => {
            const t = p * T.end, ts = t - T.slam;
            let sc = 1, y = 0, bl = 0;
            if (ts <= 0) { sc = 1.3; y = -70; bl = 14; }
            else if (t < T.out) { const k = spring(ts, 16, 0.5); sc = (1.3 - 0.3 * k) * (1 + punch(t - T.lock)); y = -70 * (1 - spring(ts, 15, 0.7)); bl = 14 * Math.max(0, 1 - ts / 0.14); }
            else {   // exit: a quick anticipation up, then collapse down into the tail tip with a vertical smear
              const te = t - T.out, a = clamp(te / 0.08, 0, 1), b = clamp((te - 0.08) / 0.2, 0, 1), eb = E("power3.in")(b);
              sc = (1 + 0.05 * E("power2.out")(a)) * (1 - eb); y = -8 * a + (HD.top - oy) * eb; bl = 10 * eb;
            }
            wrap.style.transform = "translate(0px," + y.toFixed(2) + "px) scale(" + Math.max(0.0001, sc).toFixed(4) + ")";
            wrap.style.filter = bl > 0.05 ? "blur(" + bl.toFixed(2) + "px)" : "none";
            wrap.style.visibility = sc < 0.005 ? "hidden" : "visible";
          });

          // ---------- the role plate: wipes open left -> right, text rolls up, one sheen; then the tail drops ----------
          const eX = E("expo.out");
          gsap.set(txt, { yPercent: 105 }); gsap.set(tail, { scaleY: 0 });
          Look.drive(tl, 0, T.end, (p) => {
            const t = p * T.end, tc = t - T.chip;
            let open = tc <= 0 ? 0 : eX(clamp(tc / 0.4, 0, 1));
            if (t >= T.out) open = 1 - E("power3.in")(clamp((t - T.out) / 0.16, 0, 1));
            const r = (1 - open) * cw;
            clip.style.clipPath = "inset(-40px " + (r + (open < 0.999 ? 0 : -40)).toFixed(1) + "px -40px -40px round " + (CH.h / 2) + "px)";
            clip.style.visibility = open <= 0.001 ? "hidden" : "visible";
          });
          tl.fromTo(txt, { yPercent: 105 }, { yPercent: 0, duration: 0.4, ease: "expo.out", immediateRender: false }, T.chip + 0.06);
          tl.fromTo(chip.querySelector(".sheen i"), { x: 0 }, { x: cw + 320, duration: 0.6, ease: "power2.inOut", immediateRender: false }, T.chip + 0.24);
          tl.fromTo(tail, { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "back.out(2.2)", immediateRender: false }, T.tail);
          tl.to(tail, { scaleY: 0, duration: 0.12, ease: "power3.in" }, T.out);
          tl.to(txt, { yPercent: 105, duration: 0.12, ease: "power3.in" }, T.out - 0.02);

          if (P) { Look.drive(tl, 0, T.end, (p) => P.renderAt(p * T.end)); P.renderAt(0); }
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
</body>
</html>
