<!doctype html>
<!-- GTA-niche 19 Chapter card, variant B: "Time skip" (9:16 Shorts, 1080x1920, 30 fps).
     The "10 SECONDS LATER" card. The clip freezes on the crash (a held still that keeps pushing), dims and blurs, and the
     card is in and out in 1.44 s: a huge counter "00" over "SECONDS LATER", all real geometry (Three.js: extruded, bevelled
     Archivo outlines in white clearcoat enamel). The counter is two mechanical drums: the units wheel spins a full
     revolution like a fast-forwarded clock, decelerates and carries into the tens on the last step, and on the lock "10"
     floods into caption-yellow metal behind a hot light front with a raking key, bloom, a warm bounce and a hit. The card
     then rushes at the lens and cuts to the clip "later".
     See ../DECISIONS.md. Variable: bg "plate" / "none" (full-kind component: the footage is the component's bed). -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="media/glyphs.js"></script>
    <script src="media/card3d.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Archivo", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push, #bedWrap, #frzWrap { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #frz { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; visibility: hidden; }
      #shade, #bounce, #t3d { position: absolute; pointer-events: none; }
      #shade { inset: 0; opacity: 0; }
      #bounce { opacity: 0; mix-blend-mode: screen; }
      #t3d { left: 0; top: 0; width: 1080px; height: 1920px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.06" data-width="1080" data-height="1920">
      <div id="shake"><div id="push">
        <div id="bedWrap">
          <video id="s1" class="clip shot" src="assets/shots/v56-gp-truck-crash-v.mp4" muted playsinline data-start="0" data-duration="2.0" data-media-start="0" data-track-index="0"></video>
          <div id="frzWrap"><img id="frz" src="media/freeze.jpg" alt="" /></div>
          <video id="s2" class="clip shot" src="assets/shots/v11-yacht-v.mp4" muted playsinline data-start="3.4667" data-duration="0.5933" data-media-start="0.1" data-track-index="0"></video>
        </div>
        <div id="shade"></div>
        <div id="bounce"></div>
        <div id="t3d"></div>
      </div></div>
    </div>
    <script>
      const CONFIG = {
        // "#" are counter drums (tens, units). The counter lands as `from`, runs to `to` and locks in yellow.
        number: "##", from: 0, to: 10,
        caption: "SECONDS LATER",
        type: {
          num: { set: "wide", size: 560, maxInk: 740, tracking: -0.02, depth: 0.26, bevel: 0.06, tilt: 0.2 },
          cap: { set: "narrow", size: 130, maxInk: 740, tracking: 0.02, depth: 0.34, bevel: 0.09, tilt: 0.2 },
          cx: 540, blockCY: 830, gap: 92
        },
        colors: {
          white: { face: ["#FFFFFF", "#CDD4DE"], side: ["#8A93A2", "#1C2028"] },
          state: { face: ["#FFF6B8", "#FFD23C", "#EFA514", "#FFD54A", "#E0920F"], facePos: [0, 0.4, 0.53, 0.6, 1], lip: "#FFE07A", side: ["#C07A00", "#3A1E00"], hot: "#FFF6D0" },
          glow: "255,196,60"
        },
        freeze: { at: 2.0, brightness: 0.62, contrast: 1.18, saturate: 0.6, blur: 12, punch: 1.045, push: 1.08, shade: 0.32 },
        timing: { in: 2.0, stagger: 0.008, inDur: 0.15, spin: 2.02, spinDur: 0.28, out: 3.3667, outDur: 0.1, end: 4.06 }
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const $ = (s) => document.querySelector(s);
        const C = CONFIG, TY = C.type, TM = C.timing, FZ = C.freeze, FR = 1 / 30;
        const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
        if (!plate) {
          document.querySelectorAll("video.shot, #frz").forEach((v) => (v.style.display = "none"));
          [document.documentElement, document.body, $("#root")].forEach((n) => (n.style.background = "transparent"));
        }
        Promise.all([document.fonts.load("900 100px Archivo")]).then(() => document.fonts.ready).then(() => {
          const G = window.CARD_GLYPHS;
          const fit = (o, text) => { const m = Card3D.measure(G[o.set], text, 1000, o.tracking); const size = Math.min(o.size, o.maxInk / (m.inkW / 1000)); return { size, cap: G[o.set].cap * size / G[o.set].upm }; };
          const NUM = fit(TY.num, C.number), CAP = fit(TY.cap, C.caption);
          const blockH = NUM.cap + TY.gap + CAP.cap;
          const numCY = TY.blockCY - blockH / 2 + NUM.cap / 2, capCY = TY.blockCY + blockH / 2 - CAP.cap / 2;
          const eBack = gsap.parseEase("back.out(1.7)"), eSpin = gsap.parseEase("back.out(0.55)"), eExpo = gsap.parseEase("expo.out"),
            eSine = gsap.parseEase("sine.inOut"), eP2i = gsap.parseEase("power2.in"), eP2io = gsap.parseEase("power2.inOut"), eP3i = gsap.parseEase("power3.in");
          // ---------- the drums: the units wheel runs from..to (a full revolution, decelerating), the tens carries on the last step ----------
          const span = C.to - C.from;
          function units(t) { const p = clamp((t - TM.spin) / TM.spinDur, 0, 1); return C.from + span * eSpin(p); }
          function drums(t) { const u = units(t); return [Math.floor(C.from / 10) + clamp(u - 9, 0, 2), u]; }
          let ignite = TM.spin + TM.spinDur;
          for (let t = TM.spin; t < TM.spin + TM.spinDur; t += 0.002) { if (units(t) >= C.to - 0.003) { ignite = t; break; } }
          const outEnd = TM.out + TM.outDur;
          const H = (n) => Look.hash(n) * 2 - 1;
          const slam = (t, tf, t0, zFrom, rot, seed, dy) => {
            let up = (t - t0) / TM.inDur;
            if (tf < t0) return { hide: true };            // hidden by frame time; every sub-frame of the first frame is opaque (no see-through frame)
            up = Math.max(0, up);
            if (up < 1) { const k = eBack(up); return { z: zFrom * (1 - k), rx: rot * (1 - k), ry: 0.2 * H(seed) * (1 - k), rz: 0.05 * H(seed + 9) * (1 - k), y: dy * (1 - k) }; }
            const w = (t - t0 - TM.inDur) / 0.16;
            if (w < 1) { const sq = 0.06 * Math.cos(w * Math.PI * 1.5) * Math.exp(-3.2 * w); return { sy: 1 - sq, sx: 1 + sq * 0.45 }; }
            return {};
          };
          const C3 = Card3D({
            W: 1080, H: 1920, glyphs: G, fov: 22, px: TY.cx, py: TY.blockCY,
            lines: [
              { id: "n", set: TY.num.set, text: C.number, size: NUM.size, tracking: TY.num.tracking, cx: TY.cx, cy: numCY, depth: TY.num.depth, bevel: TY.num.bevel, tilt: TY.num.tilt, drumR: 2.15, winTop: 0.07, winBot: 0.07, winFeather: 0.14 },
              { id: "c", set: TY.cap.set, text: C.caption, size: CAP.size, tracking: TY.cap.tracking, cx: TY.cx, cy: capCY, depth: TY.cap.depth, bevel: TY.cap.bevel, tilt: TY.cap.tilt }
            ],
            colors: { white: C.colors.white, state: C.colors.state, material: { faceMetal: 0.3, faceRough: 0.3, clearcoat: 0.6, faceEnv: 0.42, sideMetal: 1.0 }, faceEmissive: 0.8, preEmissive: 0.52 },
            shadow: 0.62, shadowOff: [6, 10], wideShadow: 0.4,
            shutter: (t) => (t > TM.spin - 0.02 && t < ignite + 0.1 ? 1 / 400 : t > TM.in - 0.04 && t < TM.in + 0.32 ? 1 / 90 : (t > TM.out - 0.02 && t < outEnd + 0.02 ? 1 / 60 : 0)),
            subframes: (t) => (t > TM.spin - 0.02 && t < ignite + 0.1 ? 12 : t > TM.out - 0.02 ? 32 : 14),
            pose: (t, tf) => {
              const P = { lines: {}, glyphs: {}, drums: {}, state: {}, drumMin: { n: [0, C.from] }, drumMax: { n: [Math.floor(C.to / 10), C.to] } };
              const u = t - ignite;
              let s = 1;
              if (u >= 0 && u < 0.07) s = 1 + 0.05 * eExpo(u / 0.07);
              else if (u >= 0.07 && u < 0.34) s = 1 + 0.05 * (1 - eBack((u - 0.07) / 0.27));
              const hold = clamp((t - (TM.in + 0.3)) / (TM.out - TM.in - 0.3), 0, 1);
              // the exit: the whole card rushes at the lens (power3.in), cut on the frame it fills the frame
              const xo = clamp((t - TM.out) / TM.outDur, 0, 1), zx = 0.82 * (C3 ? C3.DIST : 3000) * eP3i(xo);
              const hide = tf >= outEnd;
              P.lines.n = { s, ry: -0.045 + 0.09 * eSine(hold), z: zx, y: -60 * eP3i(xo) };
              P.lines.c = { s: 1 + (s - 1) * 0.5, ry: -0.045 + 0.09 * eSine(hold), z: zx, y: 60 * eP3i(xo) };
              P.glyphs.n = (i) => (hide ? { hide: true } : slam(t, tf, TM.in + i * 0.02, 600, 0.4, i * 7 + 3, -24));
              P.glyphs.c = (i) => (hide ? { hide: true } : slam(t, tf, TM.in + i * TM.stagger, 260, 0.3, i * 5 + 11, 0));   // the caption lands in its own row: it never reaches the drum window
              P.drums.n = drums(t);
              if (t >= ignite) P.state.n = { p: eExpo(clamp(u / 0.22, 0, 1)), hot: 3.2 * (1 - eP2i(clamp(u / 0.34, 0, 1))) };
              // key: rakes across the bevels at the lock, then keeps travelling through the hold
              const rk = eP2io(clamp((t - (ignite - 0.05)) / 0.6, 0, 1));
              const kd = eSine(clamp((t - (ignite + 0.55)) / (TM.out - ignite - 0.55), 0, 1));
              P.keyAngle = -0.95 + 1.75 * rk - 1.0 * kd;
              P.key = 2.3 + 3.4 * Math.exp(-Math.pow((u - 0.12) / 0.15, 2));
              // the lock lights both lines: one hot band runs across the number and the caption, then a soft sheen drifts
              const sp = clamp((t - (ignite + 0.03)) / 0.38, 0, 1), sd = clamp((t - (ignite + 0.45)) / (TM.out - ignite - 0.45), 0, 1);
              if (sp > 0 && sp < 1) { const x0 = -620, x1 = 640; P.specX = x0 + (x1 - x0) * eP2io(sp); P.specAmp = 1.0 * Math.pow(Math.sin(Math.PI * sp), 0.6); P.specW = 0.42; }
              else if (sd > 0 && sd < 1) { const x0 = -900, x1 = 900; P.specX = x0 + (x1 - x0) * sd; P.specAmp = 0.18 * Math.sin(Math.PI * sd); P.specW = 1.3; }
              const env = u < 0 ? 0 : u < 0.1 ? 1 : Math.exp(-(u - 0.1) / 0.28);
              P.bloom = 0.14 + 0.85 * env;
              return P;
            }
          });
          $("#t3d").appendChild(C3.canvas);
          const bnc = $("#bounce");
          bnc.style.cssText += ";left:" + (TY.cx - 560) + "px;top:" + (numCY - 520) + "px;width:1120px;height:1040px;background:radial-gradient(closest-side, rgba(" + C.colors.glow + ",.5) 0%, rgba(" + C.colors.glow + ",.2) 45%, rgba(" + C.colors.glow + ",0) 100%)";
          $("#shade").style.background = "radial-gradient(ellipse 620px 640px at " + TY.cx + "px " + TY.blockCY + "px, rgba(0,0,0," + FZ.shade + ") 0%, rgba(0,0,0," + (FZ.shade * 0.5).toFixed(2) + ") 60%, rgba(0,0,0,0) 100%)";
          document.querySelectorAll("#root *").forEach((n) => { n.setAttribute("data-layout-allow-overlap", ""); n.setAttribute("data-layout-allow-occlusion", ""); });

          const tl = gsap.timeline({ paused: true });
          Look.drive(tl, 0, TM.end, (p) => C3.renderAt(p * TM.end));
          // ---------- the freeze: the clip stops on the crash, punches in, dims and blurs, and keeps pushing while it is held ----------
          const frz = $("#frz"), e2 = gsap.parseEase("power2.out");
          if (plate) {
            frz.style.transformOrigin = "50% 44%";
            Look.drive(tl, 0, TM.end, (p) => {
              const t = p * TM.end, on = t >= FZ.at && t < outEnd;
              frz.style.visibility = on ? "visible" : "hidden";
              if (!on) { frz.style.filter = ""; frz.style.transform = ""; $("#shade").style.opacity = 0; return; }
              const u = t - FZ.at, k = e2(clamp(u / 0.16, 0, 1));
              frz.style.filter = "brightness(" + (1 - (1 - FZ.brightness) * k).toFixed(3) + ") contrast(" + (1 + (FZ.contrast - 1) * k).toFixed(3) + ") saturate(" + (1 - (1 - FZ.saturate) * k).toFixed(3) + ") blur(" + (FZ.blur * k).toFixed(2) + "px)";
              const pu = 1 + (FZ.punch - 1) * eExpo(clamp(u / (3 * FR), 0, 1));
              const pushK = 1 + (FZ.push - FZ.punch) * clamp(u / (TM.out - FZ.at), 0, 1);
              const xo = clamp((t - TM.out) / TM.outDur, 0, 1), rush = 1 + 0.22 * eP3i(xo);
              frz.style.transform = "scale(" + (pu * pushK * rush).toFixed(4) + ")";
              $("#shade").style.opacity = k.toFixed(3);
            });
            Look.drive(tl, ignite, 0.9, (p) => {
              const u = p * 0.9; let k = 0;
              if (p > 0 && p < 1) k = u < 2 * FR ? u / (2 * FR) : u < 5 * FR ? 1 : 0.3 + 0.7 * Math.exp(-(u - 5 * FR) / 0.2);
              if (p >= 1) k = 0.3;
              bnc.style.opacity = (0.9 * k).toFixed(3);
            });
            tl.set(bnc, { visibility: "hidden" }, outEnd);
            Look.expose(tl, ignite, { target: "#frzWrap", peak: 1.22, hold: 3 / 30, dur: 0.35, saturate: 1.12 });
            Look.impact(tl, FZ.at, { shake: "#shake", amp: 6, dur: 0.2, zoom: 1.01, flash: 0 });
            Look.impact(tl, ignite, { shake: "#shake", amp: 8, dur: 0.3, zoom: 1.02, flash: 0 });
            // "later": the clip lands with a punch that settles
            const s2 = $("#s2");
            gsap.set(s2, { scale: 1.1, transformOrigin: "50% 50%" });
            tl.fromTo(s2, { scale: 1.1 }, { scale: 1.0, duration: 0.45, ease: "expo.out", immediateRender: false }, outEnd);
            Look.mblur(tl, "#s2", outEnd, 0.14, { x: 0, y: 16, ease: "power2.out" });
          }
          C3.renderAt(0);
          tl.set({}, {}, TM.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
</body>
</html>
