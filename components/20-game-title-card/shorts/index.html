<!doctype html>
<!-- 20 Game title card, variant B "Corner title" (9:16, 1080x1920, 30 fps, 5.1 s).
     A compact game-title sticker ("GTA 5" over a red "ROLEPLAY" bar) docked top-left in a Short, the way creators stamp the
     game's logo over the first seconds of gameplay. Real Three.js geometry (media/logo3d.js), with a quick shine on the lock-in.
     Variable: bg "plate" (sample GTA V footage) / "none" (transparent overlay). See gta/DESIGN.md. -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="media/glyphs.js"></script>
    <script src="media/logo3d.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ov { position: absolute; inset: 0; }
      #stage { position: absolute; inset: 0; }
      #shade { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; opacity: 0;
        background: radial-gradient(400px 230px at 340px 382px, rgba(6,8,14,.34), rgba(6,8,14,.15) 55%, rgba(6,8,14,0) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.1" data-width="1080" data-height="1920">
      <div id="shake"><div id="push">
        <video id="shot1" class="clip shot" src="assets/shots/v57-gp-red-car-highway-v.mp4" muted playsinline data-start="0" data-duration="0.9" data-media-start="0.3" data-track-index="0"></video>
        <video id="shot2" class="clip shot" src="assets/shots/v39-lowriders-downtown-v.mp4" muted playsinline data-start="0.9" data-duration="1.1" data-media-start="0" data-track-index="0"></video>
        <video id="shot3" class="clip shot" src="assets/shots/v28-tennis-mansion-v.mp4" muted playsinline data-start="2.0" data-duration="1.6" data-media-start="0.3" data-track-index="0"></video>
        <video id="shot4" class="clip shot" src="assets/shots/v17-deluxo-sunset-v.mp4" muted playsinline data-start="3.6" data-duration="1.5" data-media-start="0" data-track-index="0"></video>
      </div></div>
      <div id="ov" class="clip" data-start="0" data-duration="5.1" data-track-index="1">
        <div id="shade"></div>
        <div id="stage"></div>
      </div>
    </div>
    <script>
      const CONFIG = {
        lines: ["GTA 5"],                  // the game title (A-Z, 0-9, & . , ' ! ? - : #)
        tag: "ROLEPLAY",                   // the word on the accent bar
        layout: { x: 102, y: 262, cap: 136, lead: 0.15, tracking: -0.005, align: "left", barH: 72, barGap: 20, tagCap: 40, tagTracking: 0.06 },
        colors: {
          face: ["#FFFFFF", "#E8ECF1", "#A9B3C1"],   // pearl-white enamel: top, mid, foot
          lip: "#F6F8FB", wall: ["#0E0F13", "#020203"], ink: "#050608",
          bar: ["#FF3A44", "#C8102E"],     // accent bar: subscribe red -> shade
          barWall: ["#7A0716", "#250207"], barLip: "#FF8A90", tagWall: ["#5E0610", "#1E0205"]
        },
        timing: {                           // seconds
          lineIn: [0.26], stagger: 0.025, upDur: 0.3,
          barIn: 0.5, barDur: 0.28, tagIn: 0.89, tagStagger: 0.016, tagDur: 0.24,
          lock: 0.9, floatZ: 150, fallDur: 0.13, squashY: 0.08, squashX: 0.05, shake: 4,
          sweep: 0.97, sweepDur: 0.55, bloomAt: 0.9,
          exit: 4.3, exitStagger: 0.02, exitDur: 0.26, barOut: 4.34, barOutDur: 0.24,
          end: 5.1
        }
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const T = CONFIG.timing, L = CONFIG.layout, K = CONFIG.colors, $ = (s) => document.querySelector(s);
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));
        const FACES = ["900 100px Archivo", "800 100px Archivo"];
        Promise.all(FACES.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
          const tl = gsap.timeline({ paused: true });
          const logo = Logo3D({
            W: 1080, H: 1920, glyphs: window.LOGO_GLYPHS, anchor: "tl", x: L.x, y: L.y,
            lines: CONFIG.lines, cap: L.cap, lead: L.lead, tracking: L.tracking, align: L.align,
            bar: { text: CONFIG.tag, h: L.barH, gap: L.barGap, cap: L.tagCap, tracking: L.tagTracking,
              colors: K.bar, wall: K.barWall, lip: K.barLip, textWall: K.tagWall },
            colors: { face: K.face, lip: K.lip, wall: K.wall, ink: K.ink, faceGlow: 0.14, tagGlow: 0.3 },
            inkPx: 7, shadow: 0.6, shadowOff: [4, -10], tilt: -0.24, turn: [-0.2, -0.08], depthK: 0.42, wallEnv: 0.35,
            sweepW: 0.2, sweepAmp: 1.0, faceSweep: 0.9, faceEnv: 0.6, bloomTh: 2.8, bloomBase: 0.03, bloomPeak: 0.3,
            timing: T
          });
          $("#stage").appendChild(logo.canvas);
          logo.renderAt(0);
          Look.drive(tl, 0, T.end, (p) => logo.renderAt(p * T.end));
          if (plate) {
            Look.push(tl, "#push", 0, T.end, { from: 1.0, to: 1.05 });
            Look.impact(tl, T.lock, { shake: "#shake", amp: 6, dur: 0.22, flash: 0, zoom: 1.015 });
            tl.fromTo("#shade", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, T.lineIn[0]);
            tl.fromTo("#shade", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in", immediateRender: false }, T.exit);
          } else $("#shade").style.display = "none";
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
</body>
</html>
