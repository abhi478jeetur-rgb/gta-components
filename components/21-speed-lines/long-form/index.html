<!doctype html>
<!-- 21 Speed lines, variant A: radial anime speed streaks (16:9, 1920x1080, 30 fps).
     Variable: bg "plate" (sample GTA V footage) / "none" (transparent overlay: streaks only). See gta/DESIGN.md and ../README.md. -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .zb { filter: blur(4px); opacity: 0; will-change: transform, opacity; }
      #ov { position: absolute; inset: 0; pointer-events: none; }
      #lines, #linesIn { position: absolute; inset: 0; }
      #lines canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #cvHaze { filter: blur(10px); mix-blend-mode: screen; }
      #cvNear { filter: blur(12px); }
      #cvShade { filter: blur(4px); opacity: 0; }
      #cvGlow { filter: blur(13px); mix-blend-mode: screen; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.65" data-width="1920" data-height="1080">
      <div id="shake"><div id="push">
        <video id="s1" class="clip shot" src="assets/shots/v57-gp-red-car-highway-h.mp4" muted playsinline data-start="0" data-duration="1.7" data-media-start="0" data-track-index="0"></video>
        <video id="s2" class="clip shot" src="assets/shots/v29-plane-clouds-h.mp4" muted playsinline data-start="1.7" data-duration="0.95" data-media-start="0.3" data-track-index="0"></video>
        <video id="s3" class="clip shot" src="assets/shots/v32-skydive-towers-h.mp4" muted playsinline data-start="2.65" data-duration="0.95" data-media-start="0" data-track-index="0"></video>
        <video id="s4" class="clip shot" src="assets/shots/v11-yacht-h.mp4" muted playsinline data-start="3.6" data-duration="2.05" data-media-start="0.05" data-track-index="0"></video>
        <!-- edge zoom blur: a blurred, slightly scaled copy of each shot, masked to the outside of the clear zone -->
        <video id="z1" class="clip shot zb" src="assets/shots/v57-gp-red-car-highway-h.mp4" muted playsinline data-start="0" data-duration="1.7" data-media-start="0" data-track-index="1"></video>
        <video id="z2" class="clip shot zb" src="assets/shots/v29-plane-clouds-h.mp4" muted playsinline data-start="1.7" data-duration="0.95" data-media-start="0.3" data-track-index="1"></video>
        <video id="z3" class="clip shot zb" src="assets/shots/v32-skydive-towers-h.mp4" muted playsinline data-start="2.65" data-duration="0.95" data-media-start="0" data-track-index="1"></video>
        <video id="z4" class="clip shot zb" src="assets/shots/v11-yacht-h.mp4" muted playsinline data-start="3.6" data-duration="2.05" data-media-start="0.05" data-track-index="1"></video>
      </div></div>
      <div id="ov" class="clip" data-start="0" data-duration="5.65" data-track-index="2">
        <div id="lines"><div id="linesIn">
          <canvas id="cvShade" data-layout-allow-overflow width="1920" height="1080"></canvas>
          <canvas id="cvHaze" data-layout-allow-overflow width="1920" height="1080"></canvas>
          <canvas id="cvGlow" data-layout-allow-overflow width="1920" height="1080"></canvas>
          <canvas id="cvLines" data-layout-allow-overflow width="1920" height="1080"></canvas>
          <canvas id="cvNear" data-layout-allow-overflow width="1920" height="1080"></canvas>
        </div></div>
      </div>
    </div>
    <script>
      const CONFIG = {
        // One entry per <video> pair above (s# and z#). focus = the subject the streaks converge on, as a fraction of the frame;
        // "to" (optional) tracks it across the shot.
        shots: [
          { id: "s1", zb: "z1", start: 0.00, dur: 1.70, focus: [0.47, 0.60], to: [0.47, 0.61] },
          { id: "s2", zb: "z2", start: 1.70, dur: 0.95, focus: [0.50, 0.60] },
          { id: "s3", zb: "z3", start: 2.65, dur: 0.95, focus: [0.42, 0.36], to: [0.42, 0.24] },
          { id: "s4", zb: "z4", start: 3.60, dur: 2.05, focus: [0.53, 0.46] }
        ],
        lines: {
          color: "#FFFFFF",        // streak colour
          tint: null,              // optional body tint (two-tone streaks with a white core); null = pure white
          glow: "#D9F0FF",         // bloom behind the streaks
          glowOpacity: 0.62,       // bloom strength (rises to this on the beat)
          shade: "#06111C",        // soft separation halo under the streaks (keeps white legible on bright sky); null = none
          shadeOpacity: 0,
          cruise: 0.62,            // streak density before the beat (0-1); the beat slams it to 1
          clear: [0.30, 0.31],     // clear-zone ellipse radii around the focus, fraction of canvas width / height
          bottom: 0.45,            // 0-1: thins the streaks along the bottom edge (minimap, subject's feet)
          vertical: 0,             // 0-1: bias towards the top and bottom edges
          layers: {   // n streaks, base width w px, alpha a, life in frames, len = how far short of the clear zone, travel = px rushed inward per life
            haze:  { n: 30, w: [40, 110], a: [0.03, 0.07], life: [8, 12], len: [-0.05, 0.30], rot: 0.37, travel: 40 },
            mid:   { n: 72, w: [1.6, 5.0], a: [0.55, 0.85], life: [6, 10], len: [0.04, 0.62], rot: 0.11, travel: 90, detach: true },
            front: { n: 36, w: [10, 30],   a: [0.92, 1.00], life: [5, 8],  len: [0.00, 0.55], rot: 0.00, travel: 125 },
            near:  { n: 4,  w: [70, 130],  a: [0.26, 0.40], life: [5, 7],  len: [0.15, 0.45], travel: 200, corners: true, gate: 0.75 }
          }
        },
        // in: streaks shoot in; beat: the payoff slam (cut on it); kicks: smaller re-hits on later cuts; out: retract off the edges.
        timing: { in: 0.22, beat: 1.70, kicks: [2.65, 3.60], out: 4.95, end: 5.65 },
        footage: { punch: 1.05, shake: 8, push: 1.035, zoomBlur: 1 }
      };

      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const T = CONFIG.timing, L = CONFIG.lines, F = CONFIG.footage, FPS = 30;
        const $ = (s) => document.querySelector(s);
        const W = 1920, H = 1080;
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));

        const cvL = $("#cvLines"), cvG = $("#cvGlow"), cvS = $("#cvShade"), cvH = $("#cvHaze"), cvN = $("#cvNear");
        const cL = cvL.getContext("2d"), cG = cvG.getContext("2d"), cS = cvS.getContext("2d"), cH = cvH.getContext("2d"), cN = cvN.getContext("2d");
        const hash = Look.hash;
        const ez = (n) => gsap.parseEase(n);
        const eOut = ez("expo.out"), p2io = ez("power2.inOut"), p2out = ez("power2.out"), p3in = ez("power3.in");
        const c01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
        const mix = (a, b, k) => a + (b - a) * k;
        const rgb = (h) => { const n = parseInt(h.replace("#", ""), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
        const COL = rgb(L.color), TINT = L.tint ? rgb(L.tint) : null;

        // damped spring from a to b (seconds since release)
        function spring(tau, a, b, f, z) {
          f = f || 3.2; z = z || 0.38;
          const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z);
          return b + (a - b) * Math.exp(-z * w * tau) * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau));
        }

        // ---- envelopes: pure functions of time (seek-safe) ----
        const CRUISE = 1.04, WIND = 1.34, SLAM = 0.70, BURST = 0.95, OFF = 3.0, XO = 0.30;
        function reach(t) {
          if (t < T.in) return OFF;
          if (t < T.in + 0.32) return mix(OFF, CRUISE, eOut((t - T.in) / 0.32));
          if (t < T.beat - 0.22) return CRUISE;
          if (t < T.beat) return mix(CRUISE, WIND, p2io((t - T.beat + 0.22) / 0.22));
          let r = spring(t - T.beat, SLAM, BURST, 3.0, 0.34);
          T.kicks.forEach((k) => { if (t >= k) r += spring(t - k, -0.08, 0, 3.6, 0.42); });
          if (t >= T.out) r = mix(r, OFF, p3in(c01((t - T.out) / XO)));
          return r;
        }
        function density(t) {
          if (t < T.in) return 0;
          const cr = L.cruise;
          if (t < T.in + 0.25) return cr * p2out((t - T.in) / 0.25);
          if (t < T.beat - 0.22) return mix(cr, cr + 0.08, (t - T.in - 0.25) / (T.beat - 0.22 - T.in - 0.25));
          if (t < T.beat) return cr - 0.02;
          let d = t < T.beat + 0.4 ? 1 : mix(1, 0.84, p2io(c01((t - T.beat - 0.4) / 0.5)));
          T.kicks.forEach((k) => { if (t >= k && t < k + 0.3) d += 0.12 * (1 - (t - k) / 0.3); });
          return Math.min(1, d);
        }
        function heat(t) {
          if (t < T.beat || t >= T.out + XO) return 0;
          let h = t < T.beat + 3 / FPS ? 1 : mix(1, 0.22, p2out(c01((t - T.beat - 3 / FPS) / 0.45)));
          T.kicks.forEach((k) => { if (t >= k && t < k + 0.3) h += 0.5 * (t < k + 2 / FPS ? 1 : 1 - (t - k - 2 / FPS) / (0.3 - 2 / FPS)); });
          if (t >= T.out) h *= 1 - c01((t - T.out) / XO);
          return Math.min(1, h);
        }
        function zoomAmt(t) {
          if (t < T.beat) return 0;
          let z = t < T.beat + 2 / FPS ? 1 : 1 - p2out(c01((t - T.beat - 2 / FPS) / 0.45));
          T.kicks.forEach((k) => { if (t >= k && t < k + 0.25) z += 0.4 * (1 - p2out((t - k) / 0.25)); });
          if (t >= T.out) z *= 1 - c01((t - T.out) / XO);
          return Math.min(1, z);
        }
        function shotAt(t) {
          let s = CONFIG.shots[0], idx = 0;
          CONFIG.shots.forEach((x, i) => { if (t >= x.start - 1e-6) { s = x; idx = i; } });
          const k = c01((t - s.start) / s.dur), to = s.to || s.focus;
          return { s: s, idx: idx, fx: mix(s.focus[0], to[0], k) * W, fy: mix(s.focus[1], to[1], k) * H };
        }

        // distance from (fx,fy) along (c,s) to the canvas edge
        function edgeDist(fx, fy, c, s) {
          let d = 1e9;
          if (c > 1e-6) d = Math.min(d, (W - fx) / c); else if (c < -1e-6) d = Math.min(d, -fx / c);
          if (s > 1e-6) d = Math.min(d, (H - fy) / s); else if (s < -1e-6) d = Math.min(d, -fy / s);
          return d;
        }
        // tip retraction within a streak's life: 0 = fully in, 1 = at the edge
        function jab(j, P) {
          if (j === 0) return 0.42;
          if (j === 1) return 0.1;
          if (j === P - 1) return 0.68;
          if (j === P - 2) return 0.3;
          return 0;
        }
        // the last "slam" event at or before frame f (lives restart in sync on it)
        function segStart(f) {
          let s = 0;
          [T.beat].concat(T.kicks).forEach((k) => { const kf = Math.round(k * FPS); if (f >= kf) s = Math.max(s, kf); });
          return s;
        }

        // one streak along the ray (c,s) from the focus: tip at radius rT, tail at rB.
        // attached = a wedge whose wide base sits past the frame edge; detached = a needle pointed at both ends (flying inward).
        function wedge(ctx, fx, fy, c, s, rT, rB, w, a, col, tip, attached) {
          const px = -s, py = c, hw = w / 2, len = rB - rT;
          const at = (r) => [fx + c * r, fy + s * r];
          const T0 = at(rT), B0 = at(rB);
          const g = ctx.createLinearGradient(T0[0], T0[1], fx + c * (rT + len * tip), fy + s * (rT + len * tip));
          g.addColorStop(0, "rgba(" + col + ",0)");
          g.addColorStop(0.5, "rgba(" + col + "," + (a * 0.72).toFixed(3) + ")");
          g.addColorStop(1, "rgba(" + col + "," + a.toFixed(3) + ")");
          ctx.fillStyle = g;
          ctx.beginPath();
          if (attached !== false) {
            const C = at(rT + len * 0.55);
            ctx.moveTo(B0[0] + px * hw, B0[1] + py * hw);
            ctx.quadraticCurveTo(C[0] + px * hw * 0.32, C[1] + py * hw * 0.32, T0[0], T0[1]);
            ctx.quadraticCurveTo(C[0] - px * hw * 0.32, C[1] - py * hw * 0.32, B0[0] - px * hw, B0[1] - py * hw);
          } else {
            const C = at(rT + len * 0.5), M = at(rT + len * 0.8), D = at(rT + len * 0.95);
            ctx.moveTo(T0[0], T0[1]);
            ctx.quadraticCurveTo(C[0] + px * hw * 0.45, C[1] + py * hw * 0.45, M[0] + px * hw, M[1] + py * hw);
            ctx.quadraticCurveTo(D[0] + px * hw * 0.7, D[1] + py * hw * 0.7, B0[0], B0[1]);
            ctx.quadraticCurveTo(D[0] - px * hw * 0.7, D[1] - py * hw * 0.7, M[0] - px * hw, M[1] - py * hw);
            ctx.quadraticCurveTo(C[0] - px * hw * 0.45, C[1] - py * hw * 0.45, T0[0], T0[1]);
          }
          ctx.closePath();
          ctx.fill();
        }

        function drawLayer(ctx, name, t, f, sh, seedBase) {
          const Ly = L.layers[name], N = Ly.n, R = reach(t), D = density(t), Ht = heat(t);
          if (R >= OFF - 0.01 || D <= 0) return;
          if (Ly.gate && D < Ly.gate) return;                       // the near layer only exists in the burst
          const ax = L.clear[0] * W * R, ay = L.clear[1] * H * R;
          const wMul = (0.78 + 0.22 * Math.min(1, D)) * (1 + 0.35 * Ht);
          const aMul = name === "haze" ? (0.8 + 0.4 * Ht) : (0.86 + 0.14 * Math.min(1, D * 1.2));
          const f0 = segStart(f);
          const colS = COL.join(",");
          const corners = [[0, 0], [W, 0], [W, H], [0, H]];
          for (let i = 0; i < N; i++) {
            const seed = seedBase + i * 97;
            const P = Ly.life[0] + Math.floor(hash(seed + 3) * (Ly.life[1] - Ly.life[0] + 1));
            const slam = f0 > 0;
            const phase = slam ? 2 + Math.floor(hash(seed + 5) * 2) : Math.floor(hash(seed + 7) * P);
            const lf = f - f0 + phase, k = Math.floor(lf / P), j = lf % P;
            const ls = seed * 13 + k * 7919 + f0 * 31 + sh.idx * 104729;
            let th;
            if (Ly.corners) { const cn = corners[i % 4]; th = Math.atan2(cn[1] - sh.fy, cn[0] - sh.fx) + (hash(ls + 1) - 0.5) * 0.45; }
            else th = Ly.rot + 2 * Math.PI * (i + 0.5 + (hash(ls + 1) - 0.5) * 0.85) / N;
            const c = Math.cos(th), s = Math.sin(th);
            let wgt = 1 - L.bottom * Math.pow(Math.max(0, s), 2);
            if (L.vertical && !Ly.corners) wgt *= (1 - L.vertical) + L.vertical * Math.pow(Math.abs(s), 1.2);
            if (hash(ls + 2) > D * wgt) continue;
            const rE = 1 / Math.sqrt((c / ax) * (c / ax) + (s / ay) * (s / ay));
            const rEdge = edgeDist(sh.fx, sh.fy, c, s), rB = rEdge + 40;
            const jit = Ly.len[0] + (Ly.len[1] - Ly.len[0]) * Math.pow(hash(ls + 3), 1.3);
            const rT0 = rE * (1 + jit);
            if (rT0 > rEdge - 40) continue;
            // the tip shoots in (frames 0-1), keeps rushing inward through the life (travel, eased), and on detaching
            // layers the tail leaves the edge for the last 2 frames, so the streak flies in as a needle before it respawns
            const q = P > 1 ? j / (P - 1) : 0;
            const trav = (Ly.travel || 0) * (0.7 + 0.6 * hash(ls + 6)) * (1 - Math.pow(1 - q, 1.6));
            let rT, rTail = rB, attached = true;
            if (Ly.detach) {
              rT = rT0 + (rB - rT0) * (j === 0 ? 0.42 : j === 1 ? 0.1 : 0) - trav;
              if (j >= P - 2 && P >= 5) { rTail = rB - (rB - rT) * (j === P - 1 ? 0.6 : 0.3); attached = false; }
            } else {
              rT = rT0 + (rB - rT0) * jab(j, P) - trav;
            }
            rT = Math.max(rT, rE * 0.82);
            if (rTail - rT < 24) continue;
            const lenK = Math.min(1.4, (rB - rT) / 420);
            let w = (Ly.w[0] + (Ly.w[1] - Ly.w[0]) * Math.pow(hash(ls + 4), 1.8)) * wMul * (0.7 + 0.45 * lenK);
            if (!attached) w *= 0.55 * Math.min(1, (rTail - rT) / 320);   // a detached needle stays long and thin
            const a = Math.min(1, (Ly.a[0] + (Ly.a[1] - Ly.a[0]) * hash(ls + 5)) * aMul);
            if (TINT && name === "front") {
              const hk = Math.min(1, Ht * 1.15);
              const body = [0, 1, 2].map((q) => Math.round(mix(TINT[q], 255, hk))).join(",");
              wedge(ctx, sh.fx, sh.fy, c, s, rT, rTail, w, a, body, 0.55, attached);
              wedge(ctx, sh.fx, sh.fy, c, s, rT + (rTail - rT) * 0.06, attached ? rTail : rTail - (rTail - rT) * 0.08, w * 0.42, Math.min(1, a * 1.05), "255,255,255", 0.5, attached);
            } else if (TINT && (name === "mid" || name === "haze")) {
              const body = [0, 1, 2].map((q) => Math.round(mix(TINT[q], 255, 0.55 + 0.45 * Ht))).join(",");
              wedge(ctx, sh.fx, sh.fy, c, s, rT, rTail, w, a, body, 0.55, attached);
            } else {
              wedge(ctx, sh.fx, sh.fy, c, s, rT, rTail, w, a, colS, 0.55, attached);
            }
          }
        }

        const GLOW = rgb(L.glow), SHADE = L.shade ? rgb(L.shade) : null;
        cvS.style.opacity = String(L.shadeOpacity || 0);
        let lastF = -1;
        function render(t0) {
          const f = Math.round(t0 * FPS), t = f / FPS;
          if (f === lastF) return; lastF = f;
          [cL, cG, cS, cH, cN].forEach((c) => c.clearRect(0, 0, W, H));
          const sh = shotAt(t), Ht = heat(t);
          drawLayer(cH, "haze", t, f, sh, 1000);
          drawLayer(cL, "mid", t, f, sh, 5000);
          drawLayer(cL, "front", t, f, sh, 9000);
          drawLayer(cN, "near", t, f, sh, 13000);
          // bloom and separation halo: tinted copies of the crisp lines
          cG.globalCompositeOperation = "source-over"; cG.drawImage(cvL, 0, 0);
          cG.globalCompositeOperation = "source-in"; cG.fillStyle = "rgb(" + GLOW.join(",") + ")"; cG.fillRect(0, 0, W, H);
          if (SHADE) {
            cS.globalCompositeOperation = "source-over"; cS.drawImage(cvL, 0, 0);
            cS.globalCompositeOperation = "source-in"; cS.fillStyle = "rgb(" + SHADE.join(",") + ")"; cS.fillRect(0, 0, W, H);
          }
          cvG.style.opacity = Math.min(1, L.glowOpacity * (0.5 + 0.9 * Ht)).toFixed(3);
          // entrance / exit blur
          let bl = 0;
          if (t >= T.in && t < T.in + 0.18) bl = 7 * (1 - (t - T.in) / 0.18);
          if (t >= T.out) bl = 6 * c01((t - T.out) / XO);
          $("#linesIn").style.filter = bl > 0.05 ? "blur(" + bl.toFixed(2) + "px)" : "";
          // edge zoom blur on the footage
          if (plate && F.zoomBlur) {
            const z = zoomAmt(t) * F.zoomBlur;
            CONFIG.shots.forEach((x) => {
              const el = document.getElementById(x.zb); if (!el) return;
              if (x !== sh.s) { el.style.opacity = "0"; return; }
              const ox = (sh.fx / W * 100).toFixed(2) + "%", oy = (sh.fy / H * 100).toFixed(2) + "%";
              const rx = (L.clear[0] * 100 * 1.05).toFixed(1) + "%", ry = (L.clear[1] * 100 * 1.15).toFixed(1) + "%";
              el.style.transformOrigin = ox + " " + oy;
              el.style.transform = "scale(" + (1.012 + 0.03 * z).toFixed(4) + ")";
              const m = "radial-gradient(ellipse " + rx + " " + ry + " at " + ox + " " + oy + ", rgba(0,0,0,0) 0%, rgba(0,0,0,0) 70%, #000 150%)";
              el.style.webkitMaskImage = m; el.style.maskImage = m;
              el.style.opacity = (0.6 * z).toFixed(3);
            });
          }
        }

        const FACES = ["900 100px Inter"];
        Promise.all(FACES.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
          const tl = gsap.timeline({ paused: true });
          Look.drive(tl, 0, T.end, (p) => render(p * T.end));
          if (plate) {
            CONFIG.shots.forEach((x) => {
              tl.set("#push", { transformOrigin: (x.focus[0] * 100) + "% " + (x.focus[1] * 100) + "%" }, x.start);
              tl.fromTo("#push", { scale: 1 }, { scale: F.push, duration: x.dur, ease: "none", immediateRender: false }, x.start);
            });
            Look.impact(tl, T.beat, { shake: "#shake", amp: F.shake, dur: 0.36, zoom: F.punch, flash: 0 });
            T.kicks.forEach((k) => Look.impact(tl, k, { shake: "#shake", amp: F.shake * 0.45, dur: 0.24, zoom: 1 + (F.punch - 1) * 0.4, flash: 0 }));
          }
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
