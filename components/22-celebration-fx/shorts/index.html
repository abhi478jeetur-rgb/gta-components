<!-- 22 Celebration FX, variant B (9:16): power-up aura + confetti burst for a Short. The aura is a real lit Three.js object: a thick
     glass torus filled with cyan plasma (a braided white-hot filament twisting inside it, a key-light specular band and a glass rim
     clipped to the tube), crowned by faceted crystal barbs. It draws on round the subject's shoulders, then locks in on the cut: the
     tube inflates with a spring, runs white-hot for 3 frames, the barbs erupt from it, a light rakes round the glass, a shockwave and
     two wing slashes leave it, a few embers fly and two foil confetti cannons fire. The far arc passes behind his head (a tracked head
     matte). Real screen-space bloom of the emissive parts; three depth layers and sub-frame motion blur on the confetti.
     Variable: bg "plate" / "none" (transparent overlay). -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}

    <script>
      const CONFIG = {
        aura: {
          color: "#33D6FF",                 // plasma colour (cyan); the braid and the lock-in run white-hot
          center: [540, 935],               // ring centre in canvas px (the subject's shoulder line)
          radius: 330,                      // ring radius in px (to the tube's centre line)

          barbs: [[38, 1, 165], [72, 1, 150], [108, 1, 155], [142, 1, 165], [218, 1, 150], [255, 1, 140], [285, 1, 142], [322, 1, 155],

          head: { drop: 120, ry: 126, pad: 4 },    // matte ellipse: centre = top + drop, half-height ry, half-width = width / 2 + pad
          follow: { x: 0.7, y: 0.5, ref: [560, 675], max: [25, 16] },  // the ring follows the smoothed head track
          slash: { span: 368, rise: 250 },  // the wing-slash pair on the lock-in: half-span and tip height above the ring centre (px)
          wrap: { peak: 0.42, hold: 0.2, shoulders: [335, 330, 210], hair: [95, 150, 170] }  // light on the subject: y below head top, rx, ry (px)
        },

        subject: { matte: "plate", lightWrap: "plate" },
        confetti: { count: 100, streamers: 12, colors: { gold: "#F6C453", pearl: "#F3EEE6", cyan: "#33D6FF" } },
        timing: { drawOn: [0.42, 1.34], payoff: 1.5, collapse: 4.3, gone: 4.66, clear: 4.95, end: 5.2 },
        camera: { push: [1.04, 1.045], kick: 8 },  // slow push on each shot (scale), shake amplitude on the lock-in (px)
        dof: { nearBlur: 5, farBlur: 1.6 },
        motionBlur: { samples: 15, shutter: 0.5 }
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const useMatte = CONFIG.subject.matte === true || (CONFIG.subject.matte === "plate" && plate);
        const useWrap = CONFIG.subject.lightWrap === true || (CONFIG.subject.lightWrap === "plate" && plate);
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));
        document.getElementById("lNear").style.filter = "blur(" + CONFIG.dof.nearBlur + "px)";
        document.getElementById("lFar").style.filter = "blur(" + CONFIG.dof.farBlur + "px)";

        const W = 1080, H = 1920, FPS = 30, T = CONFIG.timing, END = T.end;
        const FOV = 44, CAMZ = 10, TAN = Math.tan((FOV / 2) * Math.PI / 180);
        const halfH = (z) => (CAMZ - z) * TAN, halfW = (z) => halfH(z) * W / H;
        const PX = H / (2 * halfH(0));                                   // px per world unit at z = 0
        const hs = (i, k) => { const s = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return s - Math.floor(s); };
        const lerp = (a, b, u) => a + (b - a) * u, clamp01 = (u) => Math.max(0, Math.min(1, u));
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const sstep = (a, b, x) => { const u = clamp01((x - a) / (b - a)); return u * u * (3 - 2 * u); };
        const easeOut3 = (u) => 1 - Math.pow(1 - clamp01(u), 3), easeIn3 = (u) => Math.pow(clamp01(u), 3);
        const inOut = (u) => { u = clamp01(u); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
        const spring = (u, zeta, w) => u <= 0 ? 0 : 1 - Math.exp(-zeta * w * u) * Math.cos(w * Math.sqrt(1 - zeta * zeta) * u);  // 0 -> 1 with overshoot

        // ---------- camera (footage push + lock-in kick), computed here so the head matte maps exactly ----------
        const P = T.payoff, CAM = CONFIG.camera;
        const pushAt = (t) => t < P ? lerp(1, CAM.push[0], t / P) : lerp(1, CAM.push[1], (t - P) / (END - P));
        const kickAt = (t) => { const v = t - P, D = 0.32; if (!plate || v <= 0 || v >= D) return { x: 0, y: 0, z: 1 };
          const p = v / D, f = Math.floor(v * FPS), env = (1 - p) * (1 - p);
          return { x: (Look.hash(9001 + f * 3) * 2 - 1) * CAM.kick * env, y: (Look.hash(9002 + f * 3) * 2 - 1) * CAM.kick * env, z: 1 + 0.022 * env }; };
        const toCanvas = (x, y, t) => { const s = plate ? pushAt(t) : 1, k = kickAt(t);
          const X = 540 + (x - 540) * s, Y = 864 + (y - 864) * s; return [540 + (X - 540) * k.z + k.x, 960 + (Y - 960) * k.z + k.y, s * k.z]; };
        // ---------- head track ----------
        const TR = CONFIG.aura.track;
        const headAt = (t) => { if (t <= TR[0][0]) return TR[0].slice(1); for (let i = 1; i < TR.length; i++) if (t <= TR[i][0]) {
          const a = TR[i - 1], b = TR[i], u = (t - a[0]) / (b[0] - a[0]); return [lerp(a[1], b[1], u), lerp(a[2], b[2], u), lerp(a[3], b[3], u)]; }
          return TR[TR.length - 1].slice(1); };
        const headSmooth = (t) => { let x = 0, y = 0; for (let k = -3; k <= 3; k++) { const h = headAt(clamp(t + k * 0.1, 0, END)); x += h[0]; y += h[1]; } return [x / 7, y / 7]; };

        Promise.all(["900 100px Inter"].map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
          const glc = document.createElement("canvas"); glc.width = W; glc.height = H;
          const renderer = new THREE.WebGLRenderer({ canvas: glc, alpha: true, antialias: true, preserveDrawingBuffer: true, premultipliedAlpha: true });

          const envScene = new THREE.Scene();
          envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 48, 24), new THREE.ShaderMaterial({
            side: THREE.BackSide, depthWrite: false,
            vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
            fragmentShader: "varying vec3 vP; void main(){ float y = vP.y; vec3 top = vec3(1.0,.62,.70), mid = vec3(1.0,.78,.55), low = vec3(.16,.12,.2); vec3 c = y > 0. ? mix(mid, top, smoothstep(0.,.8,y)) : mix(mid*.5, low, smoothstep(0.,-.6,y)); gl_FragColor = vec4(c * .34, 1.0); }"
          })));
          const box = (col, w, h, pos) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: col, side: THREE.DoubleSide })); m.position.set(...pos); m.lookAt(0, 0, 0); envScene.add(m); };
          box(new THREE.Color(10, 8, 5.6), 18, 9, [-16, 22, 26]);
          box(new THREE.Color(1.6, 5.8, 7.6), 8, 24, [24, 0, 16]);
          box(new THREE.Color(6, 6, 6.4), 26, 3, [0, -20, 22]);
          box(new THREE.Color(8, 6.4, 6.8), 9, 9, [20, 18, -12]);
          box(new THREE.Color(8, 5.6, 3.6), 10, 5, [-24, -6, 10]);
          box(new THREE.Color(6, 6.4, 7.2), 7, 7, [-8, 12, -26]);
          const pmrem = new THREE.PMREMGenerator(renderer);
          scene.environment = pmrem.fromScene(envScene, 0.02).texture;
          scene.add(new THREE.HemisphereLight(0xffd6e2, 0x2a2236, 0.6));
          const key = new THREE.DirectionalLight(0xffe6cf, 2.4); key.position.set(-5, 7, 8); scene.add(key);
          const auraLight = new THREE.PointLight(0x33d6ff, 0, 0, 2); scene.add(auraLight);

          // ---------- the aura: glass plasma torus + braid + crystal barbs ----------
          const A = CONFIG.aura, R = A.radius / PX, TUBE = A.tube / PX;
          const CY = new THREE.Color(A.color);
          const KEY = new THREE.Vector3(-0.22, 0.62, 0.75).normalize();      // key light direction (view space = world space here)
          const PASS = { value: 0 };                                          // 0 = beauty, 1 = emissive-only (bloom source)
          const HEAD = { value: new THREE.Vector4(540, 800, 100, 126) }, MATTE = { value: useMatte ? 1 : 0 };
          const premult = { transparent: true, depthWrite: false, toneMapped: false, blending: THREE.CustomBlending, blendEquation: THREE.AddEquation,

          const additive = Object.assign({}, premult, { blendDst: THREE.OneFactor });
          const OCC = "uniform vec4 uHead; uniform float uMatte; varying float vWz; float occ(){ if (uMatte < .5) return 1.0; vec2 p = vec2(gl_FragCoord.x, " + H.toFixed(1) +
            " - gl_FragCoord.y); float e = length((p - uHead.xy) / uHead.zw); return 1.0 - (1.0 - smoothstep(.93, 1.03, e)) * smoothstep(.03, -.08, vWz); }";
          const NOISE = "float h1(float n){ return fract(sin(n * 12.9898) * 43758.5453); } float n1(float x){ float i = floor(x), f = fract(x); f = f * f * (3. - 2. * f); return mix(h1(i), h1(i + 1.), f); }";
          // glass shell with plasma inside
          const SU = { uColor: { value: CY }, uKey: { value: KEY }, uI: { value: 0 }, uSweep: { value: 0 }, uTime: { value: 0 }, uHot: { value: 0 }, uFlash: { value: 0 },
            uRake: { value: -100 }, uRakeI: { value: 0 }, uDraw: { value: 0 }, uGrow: { value: 0 }, uPass: PASS, uHead: HEAD, uMatte: MATTE };
          const shellMat = new THREE.ShaderMaterial(Object.assign({
            uniforms: SU,
            vertexShader: "uniform float uGrow; varying vec3 vL; varying vec3 vN; varying vec3 vV; varying float vWz; void main(){ vL = position; vec3 p = position + normal * uGrow;" +
              "vN = normalize(normalMatrix * normal); vec4 w = modelMatrix * vec4(p, 1.0); vWz = w.z; vec4 mv = viewMatrix * w; vV = -mv.xyz; gl_Position = projectionMatrix * mv; }",
            fragmentShader: "uniform vec3 uColor, uKey; uniform float uI, uSweep, uTime, uHot, uFlash, uRake, uRakeI, uDraw, uPass; varying vec3 vL; varying vec3 vN; varying vec3 vV;" + OCC + NOISE +
              "float ang(vec3 p){ return mod(atan(p.y, p.x) + 6.2831853, 6.2831853); }" +
              "vec3 env(vec3 r){ vec3 c = mix(vec3(.04,.05,.08), vec3(.85,.72,.78), smoothstep(-.25, .9, r.y));" +
              "  c += vec3(2.6,2.3,2.0) * smoothstep(.88, .97, dot(r, normalize(vec3(-.5,.72,.48))));" +
              "  c += vec3(.5,1.4,1.9) * smoothstep(.92, .99, dot(r, normalize(vec3(.85,.05,.5)))); return c; }" +
              "void main(){ float a = ang(vL); if (a > uSweep) discard;" +
              "  vec3 N = normalize(vN), V = normalize(vV); float ndv = clamp(dot(N, V), 0.0, 1.0); float b2 = 1.0 - ndv * ndv;" +
              "  float fl = n1(a * 5.0 - uTime * 14.0); float flow = .42 + .78 * fl * fl + .18 * n1(a * 17.0 + uTime * 9.0);" +
              "  float head = uHot * exp(-pow((uSweep - a) * 2.6, 2.0));" +
              "  float core = exp(-b2 / .07), Ie = uI * flow;" +
              "  float lit = .42 + .78 * clamp(dot(N, uKey) * .5 + .5, 0.0, 1.0);" +
              "  vec3 emis = uColor * (ndv * .62 + core * .7) * Ie * lit + vec3(.8,.96,1.0) * core * (Ie * .22 + head * 2.4 + uFlash * 1.6);" +
              "  float rk = uRakeI * exp(-pow(mod(a - uRake + 3.14159, 6.28318) - 3.14159, 2.0) / .16);" +
              "  vec3 Rf = reflect(-V, N); float F = .04 + .96 * pow(1.0 - ndv, 5.0);" +
              "  vec3 refl = env(Rf) * F * (1.0 + 2.5 * rk);" +
              "  vec3 Hk = normalize(uKey + V); float nh = max(dot(N, Hk), 0.0); float sp = (pow(nh, 220.0) * 2.2 + pow(nh, 24.0) * .22) * (1.0 + 2.5 * rk) + rk * .35 * pow(ndv, 2.0);" +
              "  float tA = (.18 + .42 * (1.0 - ndv)) * uDraw;" +
              "  vec3 col = vec3(.0,.025,.04) * tA + emis + refl + vec3(sp); float al = clamp(tA + dot(emis + refl + vec3(sp), vec3(.3,.45,.25)), 0.0, 1.0);" +
              "  if (uPass > .5) { col = emis + vec3(sp) * .5; al = clamp(dot(col, vec3(.3,.45,.25)), 0.0, 1.0); }" +
              "  float o = occ(); gl_FragColor = vec4(col * o, al * o); }"

          const spin = new THREE.Group(); aura.add(spin);
          const shell = new THREE.Mesh(new THREE.TorusGeometry(R, TUBE, 40, 480), shellMat); shell.renderOrder = 2; spin.add(shell);

          // crystal barbs: faceted thorns (diamond section, hooked tip), lit facets, a luminous core and a white-hot root
          function thornGeo() {
            const rings = [[0, 1, 0], [0.3, 0.8, 0.03], [0.62, 0.46, 0.1], [1, 0, 0.24]];
            const S = 4, pos = [], nor = [];
            const Pt = (r, k) => { const g = rings[r], a = (k / S) * Math.PI * 2; return new THREE.Vector3(g[2] + g[1] * Math.cos(a), g[0], g[1] * Math.sin(a)); };
            for (let r = 0; r < 3; r++) for (let k = 0; k < S; k++) {

              const n = new THREE.Vector3().subVectors(d, a).cross(new THREE.Vector3().subVectors(b, a)).normalize();
              const mid = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5), ax = new THREE.Vector3(rings[r][2], mid.y, 0);
              if (n.dot(mid.sub(ax)) < 0) n.negate();

            }
            const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3)); return g;
          }
          const BU = { uColor: { value: CY }, uKey: { value: KEY }, uI: { value: 0 }, uFlash: { value: 0 }, uPass: PASS, uHead: HEAD, uMatte: MATTE };
          const barbMat = new THREE.ShaderMaterial(Object.assign({}, premult, {
            uniforms: BU, depthWrite: true, side: THREE.DoubleSide,
            vertexShader: "varying vec3 vN; varying vec3 vV; varying float vWz; varying float vY; void main(){ vY = position.y; vN = normalize(normalMatrix * normal); vec4 w = modelMatrix * vec4(position, 1.0); vWz = w.z; vec4 mv = viewMatrix * w; vV = -mv.xyz; gl_Position = projectionMatrix * mv; }",
            fragmentShader: "uniform vec3 uColor, uKey; uniform float uI, uFlash, uPass; varying vec3 vN; varying vec3 vV; varying float vY;" + OCC +
              "void main(){ vec3 N = normalize(vN), V = normalize(vV); if (dot(N, V) < 0.0) N = -N; float ndv = clamp(dot(N, V), 0.0, 1.0);" +
              "  float lam = max(dot(N, uKey), 0.0); vec3 Hh = normalize(uKey + V); float sp = pow(max(dot(N, Hh), 0.0), 70.0); float fr = pow(1.0 - ndv, 2.5);" +
              "  float root = pow(1.0 - vY, 2.2);" +
              "  vec3 body = uColor * (.28 + 1.05 * lam) * uI + vec3(.75,.95,1.0) * (root * .75 + uFlash * .8) * uI + uColor * fr * 1.3 * uI;" +
              "  vec3 col = body + vec3(1.0) * sp * 1.8; float al = clamp(.9 + sp, 0.0, 1.0);" +
              "  if (uPass > .5) { col = (uColor * .55 + vec3(.75,.95,1.0) * root * .7) * uI + vec3(1.0) * sp * .9; al = clamp(dot(col, vec3(.3,.45,.25)), 0.0, 1.0); }" +
              "  float o = occ(); gl_FragColor = vec4(col * al * o, al * o); }"
          }));
          const TG = thornGeo();
          const barbs = A.barbs.map((b, i) => {
            const phi = b[0] * Math.PI / 180, out = !!b[1], L = b[2] / PX, bw = A.barbBase / PX * (out ? 1 : 0.8);
            const rad = new THREE.Vector3(Math.cos(phi), Math.sin(phi), 0), tan = new THREE.Vector3(-Math.sin(phi), Math.cos(phi), 0), up = new THREE.Vector3(0, 0, 1);
            const Y = rad.clone().multiplyScalar(out ? 0.5 : -0.5).add(up.clone().multiplyScalar(0.87)).normalize();
            const X = tan.clone().sub(Y.clone().multiplyScalar(tan.dot(Y))).normalize(), Z = new THREE.Vector3().crossVectors(X, Y);
            const base = rad.clone().multiplyScalar(R).add(Y.clone().multiplyScalar(-TUBE * 0.35));
            const m = new THREE.Mesh(TG, barbMat); m.matrixAutoUpdate = false; m.renderOrder = 1; spin.add(m);
            // erupt order: from the near point outwards round both sides
            const dn = Math.abs(((b[0] - 270 + 540) % 360) - 180) / 180;
            return { m, X, Y, Z, base, L, bw, delay: 0.07 * dn + 0.012 * hs(i, 3) };

          const auraCtx = document.getElementById("lAura").getContext("2d");
          const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); x.imageSmoothingQuality = "high"; return [c, x]; };
          const [bc1, bx1] = mk(270, 480), [bc2, bx2] = mk(135, 240);
          const wrapEl = document.getElementById("wrap");
          function wrapAt(t, st) {                                          // the ring's light on him: builds, peaks 3 frames on the lock-in, settles, dies with the collapse
            if (!st.on || !useWrap) return 0;
            const Wr = A.wrap;
            let w;
            if (t < P) w = Wr.hold * (0.45 * sstep(T.drawOn[0], T.drawOn[1], t) + 0.4 * sstep(T.drawOn[1], P, t));
            else { const v = t - P; w = v < 3 / FPS ? Wr.peak : Wr.hold + (Wr.peak - Wr.hold) * Math.exp(-(v - 3 / FPS) / 0.2); w *= 1 + 0.05 * Math.sin(t * 9); }
            if (t > T.collapse) { const c = clamp01((t - T.collapse) / (T.gone - T.collapse)); w *= (1 + 1.2 * c) * (1 - easeIn3(c)); }
            return Math.max(0, w);
          }
          const depthOnly = new THREE.MeshBasicMaterial({ colorWrite: false });
          function renderAt(t) {
            if (Math.abs(t - lastT) < 1e-6) return; lastT = t;
            // camera on the footage
            const s = pushAt(t), k = kickAt(t);
            if (plate) {
              document.getElementById("push").style.transform = "scale(" + s.toFixed(5) + ")";
              document.getElementById("shake").style.transform = "translate(" + k.x.toFixed(2) + "px," + k.y.toFixed(2) + "px) scale(" + k.z.toFixed(5) + ")";
            }
            // confetti with sub-frame motion blur
            ctx.forEach((c) => { c.globalCompositeOperation = "source-over"; c.globalAlpha = 1; c.clearRect(0, 0, W, H); c.globalCompositeOperation = "lighter"; c.globalAlpha = 1 / N; });
            aura.visible = false; SL.mesh.visible = false;
            for (let kk = 0; kk < N; kk++) {
              const tk = Math.max(0, t + (N > 1 ? (kk / (N - 1) - 0.5) : 0) * SHUT);
              lightAt(tk);
              const any = [false, false, false];
              for (const p of pieces) {
                const ps = pState(p, tk);
                if (p.skip || !ps || !onScreen(ps, 0.6)) { p.vis = false; continue; }
                p.vis = true; any[p.band] = true;
                p.m.position.set(ps.x, ps.y, ps.z); p.m.rotation.set(ps.r[0], ps.r[1], ps.r[2]);
              }
              for (let L = 0; L < 3; L++) {
                if (!any[L]) continue;
                for (const p of pieces) p.m.visible = p.vis && p.band === L;
                renderer.render(scene, camera);
                ctx[L].drawImage(glc, 0, 0);
              }
            }
            ctx.forEach((c) => { c.globalCompositeOperation = "source-over"; c.globalAlpha = 1; });
            // the aura
            auraCtx.globalCompositeOperation = "source-over"; auraCtx.globalAlpha = 1; auraCtx.clearRect(0, 0, W, H);
            lightAt(t);
            const st = applyAura(t), WR = A.wrap;
            const h = headAt(t);
            wrapEl.style.opacity = wrapAt(t, st).toFixed(3);
            wrapEl.style.background = "radial-gradient(ellipse " + WR.shoulders[1] + "px " + WR.shoulders[2] + "px at " + h[0].toFixed(1) + "px " + (h[1] + WR.shoulders[0]).toFixed(1) + "px, rgba(150,232,255,1) 0%, rgba(51,214,255,.5) 42%, rgba(51,214,255,0) 100%), " +
              "radial-gradient(ellipse " + WR.hair[1] + "px " + WR.hair[2] + "px at " + h[0].toFixed(1) + "px " + (h[1] + WR.hair[0]).toFixed(1) + "px, rgba(150,232,255,.75) 0%, rgba(51,214,255,0) 100%)";
            if (st.on) {
              for (const p of pieces) {
                const ps = p.band === 1 && !p.skip ? pState(p, t) : null;
                p.m.visible = !!(ps && onScreen(ps, 0.6));
                if (p.m.visible) { p.m.position.set(ps.x, ps.y, ps.z); p.m.rotation.set(ps.r[0], ps.r[1], ps.r[2]); p.m.material = depthOnly; }
              }
              PASS.value = 0; renderer.render(scene, camera); auraCtx.drawImage(glc, 0, 0);
              PASS.value = 1; renderer.render(scene, camera); PASS.value = 0;
              bx1.clearRect(0, 0, 270, 480); bx1.filter = "blur(3px)"; bx1.drawImage(glc, 0, 0, 270, 480); bx1.filter = "none";
              bx2.clearRect(0, 0, 135, 240); bx2.filter = "blur(4px)"; bx2.drawImage(glc, 0, 0, 135, 240); bx2.filter = "none";
              const gain = 1 + 0.8 * st.flash;
              auraCtx.globalCompositeOperation = "lighter";
              auraCtx.globalAlpha = Math.min(1, 0.85 * gain); auraCtx.drawImage(bc1, 0, 0, W, H);
              auraCtx.globalAlpha = Math.min(1, 0.75 * gain); auraCtx.drawImage(bc2, 0, 0, W, H);
              auraCtx.globalCompositeOperation = "source-over"; auraCtx.globalAlpha = 1;
              for (const p of pieces) p.m.material = p.mat;
            }
          }

          const tl = gsap.timeline({ paused: true });
          Look.drive(tl, 0, END, (p) => renderAt(p * END));
          window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") renderAt(e.detail.time); });
          tl.set({}, {}, END);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
          renderAt(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
