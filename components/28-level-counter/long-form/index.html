<!doctype html>
<!-- GTA-niche 28 Level counter, variant A (16:9 long-form, 1920x1080, 30 fps): "Level roll".
     The creators' outlined "LVL 1,340" climb counter, docked top-left, built as real geometry: extruded, bevelled Inter Black
     glyphs (Three.js) wrapped in one thick ink outline with a soft drop shadow. Every digit column is a mechanical counter
     drum seen through its own window, so the climb rolls like an odometer and new columns push in with a pulse on each
     level-up. The payoff is the max: 999,999 carries over column by column into LVL 1,000,000, the new 1 slams in on the cut,
     and the digits fill with gold behind a hot meniscus while a key light rakes the bevels.
     See ../DECISIONS.md. Variable: bg "plate" (sample GTA V footage) / "none" (transparent overlay). -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>

    <script src="media/lvl3d.js"></script>

      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ov { position: absolute; inset: 0; pointer-events: none; }
      #counter { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.7" data-width="1920" data-height="1080">
      <div id="shake"><div id="push">
        <video id="shotA" class="clip shot" src="assets/shots/v37-tower-looking-up-h.mp4" muted playsinline data-start="0" data-duration="1.3" data-media-start="0.3" data-track-index="0"></video>
        <video id="shotB" class="clip shot" src="assets/shots/v32-skydive-towers-h.mp4" muted playsinline data-start="1.3" data-duration="1.2" data-media-start="0.04" data-track-index="0"></video>
        <video id="shotC" class="clip shot" src="assets/shots/v29-plane-clouds-h.mp4" muted playsinline data-start="2.5" data-duration="0.8" data-media-start="0.4" data-track-index="0"></video>
        <video id="shotD" class="clip shot" src="assets/shots/v36-hills-city-view-h.mp4" muted playsinline data-start="3.3" data-duration="1.9" data-media-start="0" data-track-index="0"></video>
        <video id="shotE" class="clip shot" src="assets/shots/v11-yacht-h.mp4" muted playsinline data-start="5.2" data-duration="0.5" data-media-start="0.6" data-track-index="0"></video>
      </div></div>
      <div id="ov" class="clip" data-start="0" data-duration="5.7" data-track-index="1"><div id="counter"></div></div>
    </div>
    <script>
      const CONFIG = {
        label: "LVL",                       // the label in front of the number
        climbTo: 999996,                     // the climb rolls 1 -> climbTo (log scale: a new column every ~0.25 s)
        ticks: [999997, 999998, 999999],     // then the last levels tick in one by one (set timing.ticks to match)
        max: 1000000,                        // ...and the payoff carries over into the max
        place: { align: "left", x: 66, capTop: 64 },   // "left": docked top-left, x = ink left of the label; "center": top-centre (x ignored); capTop = cap top of the digits (px)
        font: { size: 94, label: 0.7, gap: 0.26 },   // Inter Black em for the digits (cap 68 px), label scale, label-number gap (em)
        depth: 22, bevel: 3.5, tilt: 0.24, yaw: -0.2,  // extrusion (px) and its direction: down and to the right
        ink: 6, shadow: 0.62,                // ink outline (px) and drop-shadow strength
        colors: {
          face: ["#FFFFFF", "#EEF2F7", "#C3CCDA"], side: ["#7F889A", "#161A22"], lip: "#E6EBF2",            // white enamel digits
          gold: ["#FFF1A8", "#FFD23C", "#E59A1C", "#B5650E"], goldSide: ["#A85A08", "#241000"], goldLip: "#FFF4C2",   // polished gold: hard horizon, lit chamfer
          hot: "#FFF6D0", ink: "#0C0D11"
        },
        timing: {
          enter: 0.25,          // the counter slams in big and docks
          climb: [0.5, 2.52],   // the odometer climb
          ticks: [2.6, 2.71, 2.82],   // then 999,997 / 998 / 999, a beat of held breath, and the carry from 3.02
          pay: 3.3,             // the new "1" lands (on the cut): LVL 1,000,000, gold fill, light
          out: 4.78,            // exit: the reels turn away left to right, gone on the 5.2 cut
          end: 5.7
        }
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const T = CONFIG.timing, C = CONFIG.colors, $ = (s) => document.querySelector(s);
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));
        const clamp = (x, a, b) => Math.min(b, Math.max(a, x)), Hh = Look.hash, PI = Math.PI;
        const E = (n) => gsap.parseEase(n), eOut = E("power2.out"), eIO = E("power2.inOut"), eIn = E("power2.in"), eBack = E("back.out(1.9)"),
          eBack2 = E("back.out(2.6)"), eExpo = E("expo.out"), eClimb = E("power2.inOut"), eSine = E("sine.inOut"), eSpec = E("power3.inOut"), eTick = E("power3.out");
        const sstep = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
        Promise.all(["900 100px Inter"].map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
          const G = window.LVL_GLYPHS, SZ = CONFIG.font.size, P = CONFIG.place;
          const S = LVL3D({
            W: 1920, H: 1080, glyphs: G, size: SZ, pcx: P.align === "center" ? 960 : 400, pcy: 110, fov: 10,
            depth: CONFIG.depth, bevel: CONFIG.bevel, tilt: CONFIG.tilt, yaw: CONFIG.yaw, curveSeg: 10, bevelSeg: 2, bevelK: 0.95,
            inkPx: CONFIG.ink, inkColor: C.ink, shadow: CONFIG.shadow, shadowOff: [4, 9], specW: 0.35, hotW: 4, hot: C.hot,
            fill: { set: "gold" },
            sets: {
              base: { face: C.face, side: C.side, lip: C.lip, metal: [0.0, 0.55], rough: [0.28, 0.3], emis: [0.4, 0.06] },
              gold: { face: C.gold, side: C.goldSide, lip: C.goldLip, metal: [0.35, 0.8], rough: [0.2, 0.24], emis: [0.26, 0.06], tint: [1.0, 0.45], horizon: 0.5 }
            },
            prewarm: [["0", "base", 6], ["9", "base", 6], ["1", "base", 2], [",", "base", 2], ["L", "gold", 2], ["V", "gold", 1]]
          });
          $("#counter").appendChild(S.canvas);
          const CAP = S.cap, CELL = S.adv("0"), CW = S.adv(","), SL = CONFIG.font.label;
          const yc = P.capTop + CAP / 2, base = P.capTop + CAP;               // digits: cap middle and baseline
          const capL = CAP * SL, ycL = base - capL / 2;                          // label: baseline-aligned
          // ---- label layout (ink-left at P.x, kerned) ----
          const lab = []; { let pen = P.x - S.inkL(CONFIG.label[0]) * SL; const tx = CONFIG.label;
            for (let i = 0; i < tx.length; i++) { const ch = tx[i]; lab.push({ ch, x: pen + (S.inkL(ch) + S.inkR(ch)) / 2 * SL, r: pen + S.inkR(ch) * SL });
              pen += (S.adv(ch) + (i < tx.length - 1 ? S.kern(ch, tx[i + 1]) : 0)) * SL; } }
          let xN = lab[lab.length - 1].r + CONFIG.font.gap * SZ;                // the number's left edge
          const CEN = P.align === "center";
          if (CEN) {                                                              // top-centre: centre "LVL 1,000,000" (its widest state) on the frame
            const wMax = xN + 7 * CELL + 2 * CW - P.x, dx = 960 - wMax / 2 - P.x;
            lab.forEach((L) => { L.x += dx; L.r += dx; }); xN += dx;
          }
          const ax = CEN ? 960 : P.x, ay = yc;                                     // group anchor: docked corner (left, middle) or the centre
          // ---- slots: the number is left-anchored at xN and grows to the right (the left ink edge never moves) ----
          const commaAfter = (nd, i) => i < nd - 1 && (nd - 1 - i) % 3 === 0;
          const slotX = (nd, j) => { let x = xN + j * CELL; for (let i = 0; i < j; i++) if (commaAfter(nd, i)) x += CW; return x; };
          // every digit change is a flip of the real glyph on a short drum: the old digit tips back over the top (its bevel and
          // walls catch the light) and the new one turns up from below into its place. Always whole glyphs, never a window or a
          // half-digit; a face is skipped only in the instant it is edge-on.
          const TL = CONFIG.tilt;
          // a flip turns a square drum (radius half a cap) by 90 degrees: mid-turn both faces show, so no frame is ever empty;
          // faces are [digit, turn (rad), drum radius (cap)]; f > 1 settles slightly past rest
          const flip = (a, b, f) => {
            if (f <= 0) return [[a, 0, 0.5]];
            if (f >= 1) return [[b, (1 - f) * PI / 2, 0.5]];
            const out = [], ra = -f * PI / 2; if (ra > -(PI / 2 - TL) + 0.03) out.push([a, ra, 0.5]);
            out.push([b, (1 - f) * PI / 2, 0.5]); return out;
          };
          const ROLL = (p) => { const n0 = Math.floor(p + 1e-9); return flip(n0, n0 + 1, p - n0); };
          const turnUp = (d, e) => [[d, (1 - e) * (PI / 2 + TL), 0.3]];                 // a lone glyph turning up into place
          // ---- the count ----
          const U = Math.log10(CONFIG.climbTo);
          const tk = T.ticks.slice();
          const FD = 0.12, eSlot = E("back.out(1.6)"), eFlip = E("back.out(1.4)");      // a flip lasts FD and settles slightly past rest
          const vClimb = (t) => (t < T.climb[0] ? 1 : Math.pow(10, U * eClimb(clamp((t - T.climb[0]) / (T.climb[1] - T.climb[0]), 0, 1))));
          function vAt(t) { if (t < T.climb[1]) return vClimb(t); let v = CONFIG.climbTo; tk.forEach((t0) => { if (t >= t0) v += 1; }); return v; }
          const tReach = (v) => { let a = T.climb[0], b = T.climb[1]; for (let i = 0; i < 32; i++) { const m = (a + b) / 2; if (vClimb(m) >= v) b = m; else a = m; } return b; };
          // the faces of every column (0 = units): a column flips each time it changes, from the moment the climb crossed that
          // value; a column changing faster than 9 times a second shows whole digits, like the creators' counters
          function cols(t) {
            const vC = vAt(t), tickPh = t >= T.climb[1], nd = String(Math.floor(vC + 1e-6)).length;
            const rate = tickPh ? 0 : Math.abs(vClimb(t + 1 / 60) - vClimb(t - 1 / 60)) * 30, fcs = [], fast = [], dig = [];
            for (let k = 0; k < 7; k++) {
              const p10 = Math.pow(10, k), n = Math.floor(vC / p10 + 1e-9); dig[k] = n;
              fast[k] = rate / p10 > 9; fcs[k] = [[n, 0, 0.5]];
              if (!tickPh && !fast[k] && n >= 1 && t >= T.climb[0]) { const dt = t - tReach(n * p10); if (dt < FD) fcs[k] = flip(n - 1, n, eFlip(clamp(dt / FD, 0, 1))); }
            }
            if (tickPh) { let t0 = -9; tk.forEach((x) => { if (t >= x) t0 = x; }); if (t - t0 < FD) fcs[0] = flip(dig[0] - 1, dig[0], eFlip((t - t0) / FD)); }   // the ticks
            return { fcs, fast, nd, dig };
          }
          // the value reaches 10^k at tc[k]: the number gains a slot on the right, and every existing slot flips to the digit it
          // now reads (9 -> 1 on the left, 9 -> 0 after it); found by bisection, the steps measured at the crossing
          const tc = [0, 0, 0, 0, 0, 0], dl = [];
          for (let k = 1; k <= 5; k++) {
            tc[k] = tReach(Math.pow(10, k));
            const A0 = cols(tc[k] - 1e-4), B0 = cols(tc[k] + 1e-4); dl[k] = [];
            for (let j = 0; j < k; j++) dl[k][j] = (((B0.dig[k - j] - A0.dig[k - 1 - j]) % 10) + 10) % 10;
          }
          const STAG = 0.024, tRoll = T.pay - FD - 5 * STAG, tNew = T.pay - 0.12;   // the carry flips right to left and reaches the 1 on the pay
          const pulse = (u, a) => (u < 0 ? 0 : a * Math.sin(u * 22) * Math.exp(-u * 8));   // a punch out, a smaller rebound, damped
          function stateAt(t) {
            const items = [], st = { items };
            // --- slots: digit reel position, x, scale and drop-in per slot (left to right) ---
            // each slot resolves to one visible face: [digit, flip angle]
            const sl = [];
            let nd, ndPrev, tT;
            if (t < tRoll) {
              const c = cols(t); nd = c.nd; ndPrev = nd - 1; tT = nd > 1 ? tc[nd - 1] : -9;
              const u = t - tT;
              for (let j = 0; j < nd; j++) {
                const k = nd - 1 - j, dg = c.dig[k];
                let fc = c.fcs[k];
                if (j < nd - 1 && u < FD && !c.fast[k] && dl[nd - 1][j]) fc = flip(dg - dl[nd - 1][j], dg, eFlip(clamp(u / FD, 0, 1)));   // re-reads one column up: flips to it
                if (j === nd - 1 && nd > 1 && u < FD) fc = turnUp(dg, eFlip(clamp(u / FD, 0, 1)));   // the new slot turns up into view
                sl.push({ fc, s: 1 });
              }
            } else {
              nd = t >= tNew ? 7 : 6; ndPrev = 6; tT = tNew;
              for (let j = 0; j < 6; j++) sl.push({ fc: flip(9, j === 0 ? 1 : 0, eFlip(clamp((t - (tRoll + (5 - j) * STAG)) / FD, 0, 1))), s: 1 });
              if (nd === 7) { const u = t - tNew; sl.push({ fc: [[0, 0, 0.5]], s: u < 0.12 ? 1.26 - 0.26 * eIn(u / 0.12) : 1 }); }   // the last 0 slams in from the camera
            }
            const uT = t - tT, kx = uT < 0.16 ? eSlot(clamp(uT / 0.16, 0, 1)) : 1;
            sl.forEach((o, j) => { o.x = j < nd - 1 && nd > 1 ? slotX(ndPrev, j) + (slotX(nd, j) - slotX(ndPrev, j)) * kx : slotX(nd, j); });
            // --- group: entrance (big, then docks), level-up pulses, payoff squash + shake, slow push in the hold ---
            const ue = t - T.enter, up = t - T.pay;
            let g = ue < 0 ? 0 : 1 + 0.4 * (1 - eBack(clamp(ue / 0.5, 0, 1)));
            for (let k = 1; k <= 5; k++) g += pulse(t - tc[k], 0.06);
            tk.forEach((t0) => (g += pulse(t - t0, 0.025)));
            g += pulse(t - T.pay, 0.07);
            let gx = g, gy = g, shx = 0, shy = 0;
            if (up >= 0) {
              const sq = up < 0.06 ? eOut(up / 0.06) : Math.exp(-(up - 0.06) * 10) * Math.cos((up - 0.06) * 30);
              gy *= 1 - 0.14 * sq; gx *= 1 + 0.07 * sq;
              if (up < 0.3) { const fr = Math.floor(up * 30), e2 = Math.pow(1 - up / 0.3, 2); shx = (Hh(fr * 3 + 11) * 2 - 1) * 5 * e2; shy = (Hh(fr * 3 + 12) * 2 - 1) * 5 * e2; }
              const hp = clamp((up - 0.3) / (T.out - T.pay - 0.3), 0, 1); gx *= 1 + 0.015 * eSine(hp); gy *= 1 + 0.015 * eSine(hp);
            }
            if (ue < 0) return st;
            const grp = (it) => {
              it.x = ax + (it.x - ax) * gx + shx; it.y = ay + (it.y - ay) * gy + shy; it.z = (it.z || 0) * g;
              it.sx = (it.sx == null ? 1 : it.sx) * gx; it.sy = (it.sy == null ? 1 : it.sy) * gy;
              if (it.clip) it.clip = [ay + (it.clip[0] - ay) * gy + shy, ay + (it.clip[1] - ay) * gy + shy];
              items.push(it);
            };
            // --- one glyph face on its drum: a small lift with the turn; skipped only while edge-on ---
            const face = (ch, set, x, y, s, rx, capH, fr) => {
              if (Math.abs(-TL + rx) > PI / 2 - 0.03 || s < 0.06) return;
              fr = fr == null ? 0.3 : fr;
              grp({ ch, set, x, y: y + fr * capH * s * Math.sin(rx), z: -fr * capH * s * (1 - Math.cos(rx)), rx, s, clip: null });
            };
            // --- exit, left to right: every glyph tips back over the top of its drum and is gone ---
            const xo = (i) => eIn(clamp((t - T.out - i * 0.022) / 0.16, 0, 1));
            const XA = -0.75 * (PI / 2 - TL);
            // --- label: gold, the letters turn up into place with the first digit ---
            lab.forEach((L, i) => {
              const ui = t - T.enter - i * 0.035; if (ui < 0) return;
              const ex = xo(i); if (ex >= 1) return;
              const rx = (PI / 2 + TL) * (1 - eFlip(clamp(ui / 0.26, 0, 1))) + XA * ex;
              face(L.ch, "gold", L.x, ycL, SL * (1 - ex), rx, capL / SL);
            });
            // --- digits ---
            sl.forEach((o, j) => {
              let fc = o.fc;
              if (ue < 0.41 && nd === 1) fc = ROLL(-1 + 2 * eOut(clamp((ue - 0.05) / 0.36, 0, 1)));      // entrance: 0 turns up, the drum turns on to 1
              const ex = xo(lab.length + j); if (ex >= 1) return;
              const s = o.s * (1 - ex);
              fc.forEach((F) => { if (F[0] < 0 && nd === 1) return; const ch = String(((F[0] % 10) + 10) % 10);
                const gw = o.s > 1 ? (o.s - 1) * (S.inkR(ch) - S.inkL(ch)) / 2 : 0;          // the slamming 0 grows to the right: never over its neighbour
                face(ch, "base", o.x + (S.inkL(ch) + S.inkR(ch)) / 2 + gw, yc, s, F[1] + XA * ex, CAP, ex > 0 ? 0.3 : F[2]); });
            });
            // --- commas: pop into the gap that opens for them, shrink out of one that closes (about their own ink centre) ---
            const cm = (i, s) => {
              if (s <= 0.02) return;
              const ex = xo(lab.length + i + 0.5); if (ex >= 1) return;
              const x = sl[i].x + CELL + (S.inkL(",") + S.inkR(",")) / 2, sc = s * (1 - ex);
              face(",", "base", x, yc + 0.522 * CAP * (1 - sc), sc, XA * ex, CAP);
            };
            let shift = false; for (let i = 0; i < nd - 1; i++) if (commaAfter(ndPrev, i) && i < ndPrev - 1 && !commaAfter(nd, i)) shift = true;
            const cd = shift && t < tRoll ? 0.035 : 0;                                      // a comma that moves waits for the old one to leave
            const tCm = tRoll + 2 * STAG + 0.02;                                            // payoff: the 999,999 comma leaves as the carry passes it
            for (let i = 0; i < nd - 1; i++) {
              const now = commaAfter(nd, i), was = commaAfter(ndPrev, i) && i < ndPrev - 1;
              if (now && t >= tRoll && nd === 6) cm(i, t < tCm ? 1 : 1 - eIn(clamp((t - tCm) / 0.05, 0, 1)));
              else if (now) cm(i, was && t < tRoll || uT >= 0.16 + cd ? 1 : uT < cd ? 0 : eBack(clamp((uT - cd) / 0.12, 0, 1)));
              else if (was && uT < 0.05 && t < tRoll) cm(i, 1 - eIn(clamp(uT / 0.05, 0, 1)));
            }

            const uf = up + 0.04, fp = clamp(uf / 0.26, 0, 1), yB = base + 26, yT = P.capTop - 30;
            st.fill = { y: uf < 0 ? yB + 400 : yB + (yT - yB) * eSine(fp) - (uf > 0.26 ? (uf - 0.26) * 600 : 0), amp: uf < 0 ? 0 : 4 * (1 - 0.5 * fp), ph: t * 15, hot: uf < 0 ? 0 : 2.0 + 1.6 * Math.exp(-uf / 0.08) };
            // --- light: key rake on the pay; one clean specular band 0.15 s after the fill; small light ticks on each level-up ---
            st.key = { ang: -0.9 + 1.8 * eIO(clamp((up + 0.05) / 0.7, 0, 1)), int: 2.0 + 1.8 * Math.exp(-Math.pow((up - 0.08) / 0.15, 2)) };
            const spP = clamp((up - 0.37) / 0.35, 0, 1), sx0 = lab[0].x - 200, sx1 = slotX(7, 6) + CELL + 260;
            st.spec = { x: sx0 + (sx1 - sx0) * eSpec(spP), amp: spP > 0 && spP < 1 ? 0.75 * Math.sin(PI * spP) : 0 };
            let fl = 0; for (let k = 1; k <= 5; k++) { const u = t - tc[k]; if (u >= 0 && u < 0.2) fl = Math.max(fl, 0.12 * Math.exp(-u / 0.06)); }
            if (up >= 0) fl = Math.max(fl, up < 0.1 ? 0.18 : 0.18 * Math.exp(-(up - 0.1) / 0.12));
            st.flash = fl;
            st.bloom = 0.12 + (up < 0 ? fl * 1.2 : up < 0.1 ? 0.42 : 0.42 * Math.exp(-(up - 0.1) / 0.14));
            return st;
          }
          const tl = gsap.timeline({ paused: true });
          const render = (t) => { const on = S.draw(stateAt(t)); $("#counter").style.visibility = on ? "visible" : "hidden"; };
          Look.drive(tl, 0, T.end, (p) => render(p * T.end));
          window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") render(e.detail.time); });
          if (plate) {
            Look.impact(tl, T.pay, { shake: "#shake", amp: 7, dur: 0.26, zoom: 1.02, flash: 0 });
            Look.push(tl, "#push", 0, T.end, { from: 1.0, to: 1.04 });
          }
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
          render(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
