<!doctype html>
<!-- GTA-niche 29 Cash counter, variant B "Cash pill" (9:16 Shorts, 1080x1920, 30 fps).
     Phone-first: the cash pill is a chunky real-3D slab (Three.js, perspective camera): a white enamel bezel standing proud of a
     pillowed money-green face, on a 60 px deep green body whose bottom wall and end caps show. Digits are a raised odometer in
     Archivo 900 (masked columns, multi-sample + vertical motion blur), pinned to the face plane with a matching CSS perspective.
     Each gain pops as a neon "+$" under the slab and shoots up into it. The payoff gain crosses $1,000,000: a new column grows
     in, the changed columns spin and land on the cut, and a hot light front re-skins the slab from money green to polished gold
     while the slab turns into the key light (the light sweep stays on the object). The Archivo label rolls to MILLIONAIRE.
     See ../DECISIONS.md. Variable: bg "plate" (sample GTA V footage) / "none" (transparent overlay). -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="media/gloss3d.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Archivo", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ov { position: absolute; inset: 0; pointer-events: none; }
      #stage { position: absolute; left: 0; top: 0; overflow: visible; }
      .lay { position: absolute; left: 0; top: 0; visibility: hidden; }
      #aura { position: absolute; mix-blend-mode: screen; opacity: 0; visibility: hidden; }
      #face, #label { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
      #win { position: absolute; overflow: hidden; }
      #sheen { position: absolute; inset: 0; }
      .col, .glyph { position: absolute; top: 0; }
      .smp { position: absolute; left: 0; top: 0; width: 100%; }
      .smp span, .glyph span { position: absolute; left: 0; top: 0; width: 100%; text-align: center; white-space: pre; }
      #label { position: absolute; overflow: hidden; visibility: hidden; }
      #label .lt { position: absolute; left: 0; top: 0; width: 100%; text-align: center; white-space: nowrap; }
      #label .lt span { position: absolute; left: 0; top: 0; width: 100%; text-align: center; white-space: nowrap; }
      #chips { position: absolute; left: 0; width: 100%; overflow: hidden; }
      #chipsIn { position: absolute; left: 0; width: 100%; }
      .chip { position: absolute; white-space: nowrap; visibility: hidden; }
      .chip span { position: absolute; left: 0; top: 0; white-space: nowrap; }
    </style>
  </head>
  <body>
    <svg id="fxs" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"><defs id="fx"></defs></svg>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1080" data-height="1920">
      <!-- shots overlap by 2 frames: each incoming clip starts early UNDER the outgoing one (z-index), so a cut never shows a late-painted frame -->
      <div id="shake"><div id="push">
        <video id="shotA" class="clip shot" style="z-index:5" src="assets/shots/v30-street-explosion-v.mp4" muted playsinline data-start="0" data-duration="1.6333" data-media-start="0" data-track-index="0"></video>
        <video id="shotB" class="clip shot" style="z-index:4" src="assets/shots/v28-tennis-mansion-v.mp4" muted playsinline data-start="1.5667" data-duration="2.0333" data-media-start="0.2333" data-track-index="0"></video>
        <video id="shotC" class="clip shot" style="z-index:3" src="assets/shots/v11-yacht-v.mp4" muted playsinline data-start="3.5333" data-duration="0.6" data-media-start="0.3333" data-track-index="0"></video>
        <video id="shotD" class="clip shot" style="z-index:2" src="assets/shots/v37-tower-looking-up-v.mp4" muted playsinline data-start="4.0667" data-duration="1.9333" data-media-start="0" data-track-index="0"></video>
        <video id="shotE" class="clip shot" style="z-index:1" src="assets/shots/v44-bridge-skyline-v.mp4" muted playsinline data-start="5.9333" data-duration="1.0667" data-media-start="0.1333" data-track-index="0"></video>
      </div></div>
      <div id="ov" class="clip" data-start="0" data-duration="7" data-track-index="1">
        <div id="aura"></div>
        <div id="chips"><div id="chipsIn"></div></div>
        <div id="stage">
          <div id="pillWrap" class="lay"></div>
          <div id="face" class="lay"><div id="win"><div id="digits"></div><div id="sheen"></div></div></div>
          <div id="label"></div>
        </div>
      </div>
    </div>
    <script>
      const CONFIG = {
        start: 640000,                          // the balance when the slab lands
        gains: [                                 // pop = "+$" appears under the slab, merge = it hits the slab (put merges on cuts)
          { amount: 210000, pop: 0.98, merge: 1.60 },                  // a small gain: absorbed 1 frame before the cut
          { amount: 150000, pop: 2.30, merge: 3.5667, payoff: true }   // crosses the milestone: new column, gold re-skin, label roll
        ],
        milestone: 1000000,
        label: { idle: "BANK BALANCE", payoff: "MILLIONAIRE" },
        timing: { in: 0.2, out: 6.3, end: 7.0, lockAfter: 0.5666 },   // the gold lock lands on the cut to the tower (4.133 s)
        pill: { cx: 510, y: 352, w: 740, h: 236, r: 100, rim: 18, depth: 72, lip: 16 },   // 69% of the frame wide, inside safe x 72-936
        view: { D: 2000, eyeX: 540, eyeY: 1450, tiltX: -0.05, tiltY: 0 },   // camera distance + a low eye point (the bottom wall shows, the face stays square); held tilt
        type: { family: "Archivo", weight: 900, stretch: 66, size: 150, labelSize: 62, labelStretch: 86, chipSize: 96, paySize: 128 },
        colors: {
          digit: ["#FFFFFF", "#FFFFFF", "#F1FFF5", "#D3F7E0"],   // white enamel numerals: top, upper, lower, baseline
          digitGold: ["#FFFFFF", "#FFFDF4", "#FFF4D8", "#FFE6B0"],
          ink: "#022410", inkGold: "#4A2A00",                    // numeral edge on green / on gold
          body: ["#41E481", "#05692B"],                          // money-green lacquer on the reeded wall: top, bottom
          face: ["#25C862", "#035A26"],                          // the deeper lacquer face: top, bottom
          gold: ["#FFD85A", "#B96A02"],                          // gold lacquer: top, bottom
          rim: "#F4F2EC", rimGold: "#FFF1CC",
          hot: "#FFF6CF", aura: "#FFC93C", auraGreen: "#38E07B",
          chip: ["#FFFFFF", "#D9FFC9", "#5CF27A", "#22C55E"], chipInk: "#032612", glow: "#38E07B",
          label: ["#FFFFFF", "#E6F5EB"], labelGold: ["#FFF3B8", "#F6C453", "#E59A1C"]
        },
        shots: ["#shotA", "#shotB", "#shotC", "#shotD", "#shotE"]
      };

      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const $ = (s) => document.querySelector(s);
        const C = CONFIG, T = C.timing, P = C.pill, TY = C.type, K = C.colors, VW = C.view, FR = 1 / 30;
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));
        else $("#root").style.background = "#0E0F13";   // a missed frame can never flash white
        const clamp = (x, a, b) => Math.min(b, Math.max(a, x)), lerp = (a, b, k) => a + (b - a) * k;
        const E = (n) => gsap.parseEase(n);
        const hexA = (h, a) => "rgba(" + [1, 3, 5].map((i) => parseInt(h.substr(i, 2), 16)).join(",") + "," + a.toFixed(3) + ")";
        const mixHex = (a, b, k) => { const p = (h) => [1, 3, 5].map((i) => parseInt(h.substr(i, 2), 16)); const A = p(a), B = p(b);
          return "rgb(" + A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(",") + ")"; };

        const FACES = [TY.weight + " 100px Archivo", "italic 900 100px Inter"];
        Promise.all(FACES.map((f) => document.fonts.load(f, "$0123456789,+ABCDEFGHIJKLMNOPQRSTUVWXYZ"))).then(() => document.fonts.ready).then(build);

        function build() {
          // ---------- stage: the slab's canvas + DOM layers share one perspective (camera D px away, eye at (eyeX, eyeY)) ----------
          const BW = 1080, BH = 1000;
          const PX = P.cx, PY = P.y + P.h / 2;
          Object.assign($("#stage").style, { width: BW + "px", height: BH + "px", perspective: VW.D + "px", perspectiveOrigin: VW.eyeX + "px " + VW.eyeY + "px" });
          ["#pillWrap", "#face", "#aura"].forEach((s) => Object.assign($(s).style, { left: "0px", top: "0px", width: BW + "px", height: BH + "px", transformOrigin: PX + "px " + PY + "px" }));
          const px0 = PX - P.w / 2, py0 = PY - P.h / 2;
          const aura = $("#aura");
          const auraBg = (c, a) => "radial-gradient(ellipse " + (P.w * 0.62) + "px " + (P.h * 1.05) + "px at " + PX + "px " + PY + "px, " + hexA(c, a) + " 0%, " + hexA(c, a * 0.35) + " 50%, rgba(0,0,0,0) 100%)";

          // ---------- the slab: real geometry ----------
          const G = Gloss3D({ W: BW, H: BH, pivot: [PX, PY], persp: { D: VW.D, ox: VW.eyeX, oy: VW.eyeY }, exposure: 1.0, env: { front: 0.6, top: 1.25, back: 1.1 } });
          const rimM = G.mat("lacquer", { color: K.rim, toneMapped: false, specGain: 0.9, glowColor: K.hot, params: { roughness: 0.2, clearcoat: 1.0, clearcoatRoughness: 0.05 } });
          const RM = P.rim, LIP = P.lip, DEP = P.depth;
          const faceM = G.mat("lacquer", { color: K.face[1], toneMapped: false, specGain: 0.8, glowColor: K.hot,
            grad: { top: P.h / 2 - 24, bottom: -P.h / 2 + 24, colTop: K.face[0], colBot: K.face[1] },
            reskin: { colTop: K.gold[0], colBot: K.gold[1], frontGain: 1 },
            params: { roughness: 0.28, clearcoat: 1.0, clearcoatRoughness: 0.05, envMapIntensity: 0.5 } });
          // the body's wall is a reeded coin edge (grooves every 9 px), the money cue that survives phone size
          const edgeM = G.mat("lacquer", { color: K.body[1], toneMapped: false, specGain: 0.8, glowColor: K.hot,
            grad: { top: P.h / 2 - 12, bottom: -P.h / 2 + 12, colTop: K.body[0], colBot: K.body[1] },
            reskin: { colTop: K.gold[0], colBot: K.gold[1], frontGain: 1 },
            reed: { hw: P.w / 2, r: P.r, z0: -DEP + 8, z1: -8, period: 9, depth: 0.5 },
            params: { roughness: 0.34, clearcoat: 0.8, clearcoatRoughness: 0.1, envMapIntensity: 0.8 } });
          // body: the deep green block (front at z 0, back at -depth); its bottom wall and end caps carry the thickness
          G.add([px0, py0, P.w, P.h, P.r], null, { mat: edgeM, z: 0, depth: DEP - 16, bt: 8, bs: 8, bseg: 6 });
          // face plate: pillowed (its rounded edge falls off into the recess under the bezel), front at z 5
          G.add([px0 + 12, py0 + 12, P.w - 24, P.h - 24, P.r - 12], null, { mat: faceM, z: 5, depth: 4, bt: 8, bs: 12, bseg: 8 });
          // bezel: a white enamel lip standing proud of the face (front at z = lip), flush with the body's wall
          G.add([px0 - 1, py0 - 1, P.w + 2, P.h + 2, P.r + 1], [[px0 + RM, py0 + RM, P.w - 2 * RM, P.h - 2 * RM, P.r - RM]], { mat: rimM, z: LIP, depth: 2, bt: 6, bs: 6, bseg: 8 });
          G.U.uFrontF.value = 50; G.U.uFrontCol.value.set(K.hot);
          const SH = "drop-shadow(0 6px 8px rgba(0,0,0,.42)) drop-shadow(0 20px 34px rgba(0,0,0,.45))";
          G.canvas.style.filter = SH;
          $("#pillWrap").appendChild(G.canvas);

          // ---------- the odometer (DOM, pinned to the face plane at z 5) ----------
          const win = $("#win"), WI = RM + 6, WX = px0 + WI, WY = py0 + WI, WW = P.w - 2 * WI, WH = P.h - 2 * WI;
          Object.assign(win.style, { left: WX + "px", top: WY + "px", width: WW + "px", height: WH + "px", borderRadius: (P.r - WI) + "px" });
          const font = TY.weight + " " + TY.size + "px/1 " + TY.family;
          const probe = document.createElement("span");
          probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre;font:" + font + ";font-stretch:" + TY.stretch + "%";
          document.body.appendChild(probe);
          const adv = (s) => { probe.textContent = s; return probe.getBoundingClientRect().width; };
          let colW = 0; for (let d = 0; d < 10; d++) colW = Math.max(colW, adv(String(d)));
          colW = Math.ceil(colW + 1);
          const commaW = adv(","), dollarW = adv("$");
          const cv = document.createElement("canvas").getContext("2d"); cv.font = TY.weight + " " + TY.size + "px " + TY.family;
          const mm = cv.measureText("0"), fa = mm.fontBoundingBoxAscent, fd = mm.fontBoundingBoxDescent, cap = mm.actualBoundingBoxAscent;
          const L = Math.round(TY.size * 1.12);
          const base = (L - (fa + fd)) / 2 + fa, capTop = base - cap;
          const rowTop = WH / 2 - (capTop + cap / 2) - 1;

          // 7 columns (millions..ones); the millions column and its comma only exist once the milestone is crossed
          const nd = 7;
          const VEND = C.start + C.gains.reduce((a, g) => a + g.amount, 0), M0 = Math.floor(VEND / 1e6) % 10;   // the millions digit it lands on
          const mk = (kind, i, w) => ({ kind, i, w });
          const itemsAll = [mk("$", -1, dollarW + 6), mk("d", 0, colW), mk(",", -2, commaW + 2)];
          for (let i = 1; i < nd; i++) { itemsAll.push(mk("d", i, colW)); if (i === 3) itemsAll.push(mk(",", -3, commaW + 2)); }
          function layoutX(withM) {
            const its = itemsAll.filter((it) => withM || (it.i !== 0 && it.i !== -2));
            const tw = its.reduce((s, it) => s + it.w, 0);
            let x = (WW - tw) / 2 - 3; const out = {};
            its.forEach((it) => { out[it.kind + it.i] = x; x += it.w; });
            return out;
          }
          const X6 = layoutX(false), X7 = layoutX(true);
          // the new column + comma sit in the opening slot between "$" and the hundred-thousands column, centred in it
          const slotC = (k) => lerp(X6["$-1"] + dollarW + 6, X6["d1"], 0.5);

          const faceGrad = (cols) => "repeating-linear-gradient(180deg, " + cols[0] + " 0px, " + cols[0] + " " + (capTop - 2).toFixed(1) + "px, " +
            cols[1] + " " + (capTop + cap * 0.3).toFixed(1) + "px, " + cols[2] + " " + (capTop + cap * 0.68).toFixed(1) + "px, " +
            cols[3] + " " + (capTop + cap + 2).toFixed(1) + "px, " + cols[3] + " " + L + "px)";
          // raised numerals: a solid 6 px extrusion under the ink edge, then a soft contact shadow on the lacquer
          const extr = (ink) => [1, 2, 3, 4, 5, 6].map((d) => "0 " + d + "px 0 " + ink).join(", ") + ", 0 9px 12px rgba(0,0,0,.32)";
          const digitsEl = $("#digits"), SVGNS = "http://www.w3.org/2000/svg";
          const NS = 3, faces = [], outs = [];
          function layerPair(parent, text) {
            const o = document.createElement("span"), f = document.createElement("span");
            o.textContent = text; f.textContent = text;
            const st = "font:" + font + ";font-stretch:" + TY.stretch + "%;line-height:" + L + "px;";
            o.style.cssText = st + "color:" + K.ink + ";-webkit-text-stroke:11px " + K.ink + ";text-shadow:" + extr(K.ink) + ";";
            f.style.cssText = st + "color:transparent;-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text;background-image:" + faceGrad(K.digit) + ";";
            parent.appendChild(o); parent.appendChild(f); outs.push(o); faces.push(f);
          }
          const cols = [], statics = [];
          itemsAll.forEach((it) => {
            if (it.kind === "d") {
              const c = document.createElement("div"); c.className = "col"; c.style.cssText = "left:0px;width:" + it.w + "px;height:" + WH + "px;transform-origin:50% " + (rowTop + capTop + cap).toFixed(1) + "px";
              const txt = Array.from({ length: 30 }, (_, r) => (it.i === 0 && r % 10 !== M0) ? " " : String(r % 10)).join("\n");
              const smps = [];
              for (let s = 0; s < NS; s++) { const sm = document.createElement("div"); sm.className = "smp"; layerPair(sm, txt); c.appendChild(sm); smps.push(sm); }
              digitsEl.appendChild(c);
              const fid = "vb" + it.i, f = document.createElementNS(SVGNS, "filter");
              f.setAttribute("id", fid); f.setAttribute("x", "-10%"); f.setAttribute("y", "-50%"); f.setAttribute("width", "120%"); f.setAttribute("height", "200%");
              const gb = document.createElementNS(SVGNS, "feGaussianBlur"); gb.setAttribute("in", "SourceGraphic"); gb.setAttribute("stdDeviation", "0 0");
              f.appendChild(gb); $("#fx").appendChild(f);
              cols.push({ el: c, smps, i: it.i, key: "d" + it.i, ev: [], fid, gb });
            } else {
              const g = document.createElement("div"); g.className = "glyph"; g.style.cssText = "left:0px;width:" + it.w + "px;height:" + WH + "px;top:" + rowTop.toFixed(1) + "px;transform-origin:50% " + (capTop + cap).toFixed(1) + "px";
              layerPair(g, it.kind); digitsEl.appendChild(g); statics.push({ el: g, key: it.kind + it.i, i: it.i });
            }
          });

          const dig = (v, i) => Math.floor(v / Math.pow(10, nd - 1 - i)) % 10;
          const W_DET = 6.2832 / 0.2, K_DET = 18, mainEase = (q) => 0.85 * (1 - (1 - q) * (1 - q)) + 0.15 * q;
          cols.forEach((c) => { c.P0 = dig(C.start, c.i) - (c.i === 0 ? 0 : 10); c.cur = c.P0; });
          function roll(at, dur, toV, o) {
            o = o || {};
            const moves = [];
            cols.forEach((c) => {
              const to = dig(toV, c.i), from = ((c.cur % 10) + 10) % 10;
              let rows = (to - from + 10) % 10;
              if (o.boot) rows = c.i === 0 ? 0 : 10;
              else if (rows && o.spin) rows += o.spin;            // only columns that change move; the big one takes an extra turn
              if (o.skip0 && c.i === 0) return;
              if (rows) moves.push({ c, rows });
            });
            moves.forEach((m, j) => {
              const rank = o.ltr ? j : (moves.length - 1 - j);    // stagger by rank among the columns that actually move
              // landAt: cascade right -> left, the leftmost moving column lands last, exactly on landAt
              const t0 = o.landAt != null ? o.landAt - dur - j * o.step : at + rank * (o.stagger || 0);
              m.c.ev.push({ t0, dur, from: m.c.cur, to: m.c.cur + m.rows, A: clamp(m.rows * 0.15 / dur / W_DET, 0.06, 0.2) });
              m.c.cur += m.rows;
            });
          }
          // fast start, arrives still moving, then a mechanical detent: <= 0.08 row past the mark, settled within 4 frames
          function Pat(c, t) {
            let p = c.P0;
            for (let j = 0; j < c.ev.length; j++) {
              const e = c.ev[j];
              if (t < e.t0) return p;
              if (t < e.t0 + e.dur) return e.from + (e.to - e.from) * mainEase((t - e.t0) / e.dur);
              p = e.to;
              const u = t - (e.t0 + e.dur), nx = c.ev[j + 1];
              if (u < 0.25 && (!nx || t < nx.t0)) return e.to + e.A * Math.sin(W_DET * u) * Math.exp(-K_DET * u);
            }
            return p;
          }
          let V = C.start, PAY = null;
          roll(T.in + 0.08, 0.42, V, { boot: true, ltr: true, stagger: 0.03 });
          C.gains.forEach((g) => {
            const nv = V + g.amount;
            if (g.payoff) {
              PAY = g;
              // the new millions column rolls blank -> 1 while it grows into the opening slot; the changed columns spin and land right -> left
              const c0 = cols[0], r0 = (dig(nv, 0) - (((c0.cur % 10) + 10) % 10) + 10) % 10;
              if (r0) { c0.ev.push({ t0: g.merge - 0.002, dur: 0.001, from: c0.cur, to: c0.cur + r0, A: 0 }); c0.cur += r0; }   // no roll: it grows in from its baseline
              roll(0, 0.44, nv, { spin: 10, skip0: true, landAt: g.merge + T.lockAfter, step: 0.07 });
            }
            else roll(g.merge + 0.02, 0.36, nv, { stagger: 0.04 });
            V = nv;
          });
          const TLOCK = PAY ? PAY.merge + T.lockAfter : 1e9, TM = PAY ? PAY.merge : 1e9;

          function setCol(c, t) {
            const p = Pat(c, t), v = (Pat(c, t + 1 / 120) - Pat(c, t - 1 / 120)) * 60;
            const idx = (((p % 10) + 10) % 10) + 10, y0 = rowTop - idx * L;
            const smear = Math.abs(v) * L / 60;
            const n = smear < 2 ? 1 : 3, spread = Math.min(smear, 0.9 * L);
            const sd = smear > 6 ? Math.min(6, smear / 6 + 0.5) : 0;
            if (sd > 0) { c.gb.setAttribute("stdDeviation", "0 " + sd.toFixed(2)); c.el.style.filter = "url(#" + c.fid + ")"; } else c.el.style.filter = "none";
            c.smps.forEach((sm, j) => {
              if (j >= n) { sm.style.visibility = "hidden"; return; }
              const off = n === 1 ? 0 : (j / (n - 1) - 0.5) * spread;
              sm.style.visibility = "inherit"; sm.style.opacity = (1 / (j + 1)).toFixed(3);
              sm.style.transform = "translate3d(0," + (y0 + off).toFixed(2) + "px,0)";
            });
          }

          // ---------- label: heavy Archivo caps above the slab, on the slab's plane; rolls to the payoff word (overflow window) ----------
          const lab = $("#label"), LS = TY.labelSize, LH = Math.round(LS * 1.3), LBW = 820, LBX = PX - LBW / 2, LBY = P.y - LH - 10;
          Object.assign(lab.style, { left: LBX + "px", top: LBY + "px", width: LBW + "px", height: LH + "px", transformOrigin: (PX - LBX) + "px " + (PY - LBY) + "px" });
          function labelLine(txt, grad, ink) {
            const d = document.createElement("div"); d.className = "lt"; d.style.height = LH + "px";

          }
          const lab1 = labelLine(C.label.idle, K.label, "#04140A"), lab2 = labelLine(C.label.payoff, K.labelGold, "#2E1A00");

          // ---------- gain chips ----------
          const fmt = (v) => "+$" + v.toLocaleString("en-US");
          const CLIP = P.y + P.h - 22;   // the chips window starts inside the slab's lower edge: a chip rising past it goes INTO the slab
          Object.assign($("#chips").style, { top: CLIP + "px", height: (1920 - CLIP) + "px" }); $("#chipsIn").style.top = -CLIP + "px";
          const chips = C.gains.map((g, gi) => {
            const el = document.createElement("div"); el.className = "chip";
            const size = g.payoff ? TY.paySize : TY.chipSize, txt = fmt(g.amount);
            const st = "font:italic 900 " + size + "px/1.2 Inter;letter-spacing:-0.02em;";
            const glow = document.createElement("span"), out = document.createElement("span"), face = document.createElement("span");

            glow.style.cssText = st + "color:" + K.glow + ";text-shadow:0 0 " + Math.round(size * 0.3) + "px " + hexA(K.glow, 0.95) + ",0 0 " + Math.round(size * 0.75) + "px " + hexA(K.glow, 0.6) + ";";
            out.style.cssText = st + "color:" + K.chipInk + ";-webkit-text-stroke:" + Math.round(size * 0.1) + "px " + K.chipInk + ";text-shadow:0 " + Math.round(size * 0.06) + "px " + Math.round(size * 0.12) + "px rgba(0,0,0,.45);";
            face.style.cssText = st + "color:transparent;-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text;";
            el.appendChild(glow); el.appendChild(out); el.appendChild(face);
            $("#chipsIn").appendChild(el);
            const h = size * 1.2, w = face.getBoundingClientRect().width;
            face.style.backgroundImage = "linear-gradient(180deg, " + K.chip[0] + " " + (h * 0.22).toFixed(1) + "px, " + K.chip[1] + " " + (h * 0.4).toFixed(1) + "px, " + K.chip[2] + " " + (h * 0.62).toFixed(1) + "px, " + K.chip[3] + " " + (h * 0.8).toFixed(1) + "px)";
            el.style.width = w + "px"; el.style.height = h + "px";
            const cx = P.cx + (g.payoff ? 0 : 70), top = P.y + P.h + (g.payoff ? 62 : 56);

          });

          // ---------- pose as a pure function of time ----------
          const spring = (t, t0, amp, dec, f) => (t < t0 ? 0 : amp * Math.exp(-dec * (t - t0)) * Math.sin(6.2832 * f * (t - t0)));
          const damp = (t, t0, amp, dec, f) => (t < t0 ? amp : amp * Math.exp(-dec * (t - t0)) * Math.cos(6.2832 * f * (t - t0)));
          const eBack = E("back.out(1.7)");
          function poseAt(t) {
            const p = { dx: 0, dy: 0, sx: 1, sy: 1, rx: VW.tiltX, ry: VW.tiltY, vis: t >= T.in && t < T.out + 0.34 };
            const ue = t - T.in;
            // entrance: drops out of the top, tipped face-down (its reeded top wall shows), big, and springs to the held tilt
            let s = ue < 0.36 ? 0.55 + 0.51 * E("power3.out")(clamp(ue / 0.36, 0, 1)) : 1 + 0.06 * Math.exp(-7 * (ue - 0.36)) * Math.cos(6.2832 * 0.9 * (ue - 0.36));

            p.dy = ue < 0 ? -150 : -150 * Math.exp(-9 * ue) * Math.cos(6.2832 * 0.6 * ue);

            p.ry += ui * 0.05 * Math.sin(6.2832 * 0.22 * (t - T.in)); p.rx += ui * 0.025 * Math.sin(6.2832 * 0.27 * (t - T.in) + 0.7);
            // gains hit from below: squash, bottom kicked back, hop (the small gain stays small)
            C.gains.forEach((g) => {
              const u = t - g.merge; if (u < 0) return;
              const a = g.payoff ? 1.4 : 0.75;

              p.rx += spring(t, g.merge, 0.15 * a, 6.5, 1.5);

            });
            // lock-in: a punch, and the slab turns into the key light while the gold front crosses (a real light move on the bezel)
            if (t >= TLOCK) {
              const u = t - TLOCK;
              const pu = u < 0.06 ? 1 + 0.065 * (u / 0.06) : 1 + 0.065 * Math.exp(-8 * (u - 0.06)) * Math.cos(6.2832 * 1.2 * (u - 0.06));

          const eIO = E("power2.inOut"), eSpread = E("back.out(1.4)"), eGrow = E("power2.out");
          const diag = Math.hypot(P.w, P.h) * 0.62, LG = WW * 0.8642 + WH * 0.5025;
          function renderAt(t) {

            if (sa > 0.01) {
              const at = (d) => (LG / 2 + d).toFixed(1) + "px", a = (0.13 * sa).toFixed(3);

            const sk = t < TM ? 0 : t >= TM + 0.45 ? 1 : eSpread(clamp((t - TM) / 0.32, 0, 1));
            const gr = t < TM ? 0 : E("back.out(1.8)")(clamp((t - TM) / 0.2, 0, 1));
            cols.forEach((c) => {
              let x = lerp(X6[c.key] != null ? X6[c.key] : X7[c.key], X7[c.key], sk);
              if (c.i === 0) {
                x = lerp(slotC() - colW / 2 - (commaW + 2) / 2, X7["d0"], clamp(sk, 0, 1));

                c.el.style.transform = "scale(" + Math.max(0.001, gr).toFixed(3) + ")";

            const lin = clamp((t - (T.in + 0.42)) / 0.3, 0, 1), lsw = clamp((t - (TLOCK + 0.08)) / 0.28, 0, 1), lout = clamp((t - T.out) / 0.14, 0, 1);

            chips.forEach((ch) => {
              const g = ch.g, up = t - g.pop, rise0 = g.merge - (g.payoff ? 0.2 : 0.17);

            });

              const v = $(s), st = parseFloat(v.dataset.start), du = parseFloat(v.dataset.duration);

          }

          tl.set({}, {}, T.end);
          window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") renderAt(e.detail.time); });

          window.__timelines["main"] = tl;
          tl.seek(0);
        }
      })();
