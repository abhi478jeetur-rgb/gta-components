        const trimGeo = new THREE.ExtrudeGeometry(trimShape, { depth: 10, bevelEnabled: true, bevelThickness: 2.5, bevelSize: 2, bevelOffset: -2, bevelSegments: 3, curveSegments: 40 });
        trimGeo.translate(0, 0, -11);
        const floorGeo = new THREE.ExtrudeGeometry(pill(RL + 18, RH + 18, 0), { depth: 4, bevelEnabled: false, curveSegments: 40 }); floorGeo.translate(0, 0, -22);
        const rail = new THREE.Group(); rail.add(new THREE.Mesh(railGeo, [railMat, railSide])); rail.add(new THREE.Mesh(trimGeo, [trimF, trimS])); rail.add(new THREE.Mesh(floorGeo, floorMat));
        const ghostGeo = new THREE.ExtrudeGeometry(carShapes(CR * 1.45 / 100, 0, 0), { depth: 1.2, bevelEnabled: true, bevelThickness: 0.8, bevelSize: 0.6, bevelOffset: -0.6, bevelSegments: 2, curveSegments: 10 });
        ghostGeo.translate(0, 0, -18);
        for (let i = 0; i < NSOCK; i++) { const g = new THREE.Mesh(ghostGeo, ghostMat); g.position.x = sockX(i); rail.add(g); }
        const railOuter = new THREE.Group(); railOuter.add(rail); railOuter.position.set(railCx, railCy, R.z); scene.add(railOuter);
        coinMats = [goldSatin, goldNum, goldSide].map((m) => { const c = m.clone(); c.clippingPlanes = [clipPlane]; return c; });
        const coins = []; for (let i = 0; i < C.found + 1; i++) { const c = makeCoin(); scene.add(c); coins.push(c); }   // the last one is the find

        // ring burst + socket bloom on the landing (normal blending so it survives the transparent render)
        const ringMat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, depthTest: false, toneMapped: false,
          uniforms: { uR: { value: 30 }, uW: { value: 8 }, uA: { value: 0 }, uG: { value: 0 } },
          vertexShader: "varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
          fragmentShader: "uniform float uR; uniform float uW; uniform float uA; uniform float uG; varying vec2 vP; void main(){ float r = length(vP);" +
            " float ring = exp(-pow((r - uR) / uW, 2.0)) * uA; float glow = exp(-pow(r / 62.0, 2.0)) * uG; float a = clamp(ring + glow * 0.55, 0.0, 1.0);" +
            " vec3 c = mix(vec3(1.0, 0.78, 0.3), vec3(1.0, 0.97, 0.85), clamp(ring * 1.4, 0.0, 1.0)); gl_FragColor = vec4(c, a); }" });
        const ring = new THREE.Mesh(new THREE.PlaneGeometry(320, 320), ringMat); ring.renderOrder = 10; scene.add(ring);
        const popRing = new THREE.Mesh(new THREE.PlaneGeometry(420, 420), ringMat.clone()); popRing.renderOrder = 10; scene.add(popRing);

        // soft shadows that land on the footage
        function shadowPlane(drawFn, w, h) {
          const SC = document.createElement("canvas"); SC.width = 512; SC.height = Math.round(512 * h / w); const x = SC.getContext("2d");
          x.filter = "blur(" + Math.round(10 * 512 / w) + "px)"; x.fillStyle = "#000"; drawFn(x, SC.width / w); x.fill();
          const tex = new THREE.CanvasTexture(SC); tex.colorSpace = THREE.SRGBColorSpace;
          const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0.5, depthWrite: false, color: 0x0a0602 }));
          m.renderOrder = -1; return m;
        }
        const shShield = shadowPlane((x, k) => { const pts = shieldShape(-3).getPoints(24); x.beginPath(); pts.forEach((p, i) => { const X = (p.x + SW + 40) * k, Y = (SH + 40 - p.y) * k; i ? x.lineTo(X, Y) : x.moveTo(X, Y); }); x.closePath(); }, C.shield.w + 80, C.shield.h + 80);
        shShield.position.set(10, -SH - 16, -60); hang.add(shShield);
        const shRail = shadowPlane((x, k) => { x.beginPath(); x.roundRect(40 * k, 40 * k, (RL + 16) * k, (RH + 16) * k, (RH + 16) / 2 * k); }, RL + 96, RH + 96);
        shRail.material.clippingPlanes = [clipPlane]; shRail.position.set(8, -14, -40); rail.add(shRail);

        // ---------- gold streak behind the flying coin (2D, under the GL layer) ----------
        const sk = $("#streak").getContext("2d");

        // ---------- motion: everything is a pure function of t ----------
        const eBackA = E("back.out(2.2)"), eIn3 = E("power3.in"), eOut3 = E("power3.out"), eKey = E("power2.inOut"), eEl = E("elastic.out(1,0.42)");
        const SOCK3 = { x: wx(R.first + R.pitch * C.found), y: railCy };
        const P0 = { x: wx(C.find.from[0]), y: wy(C.find.from[1]) }, P1 = { x: SOCK3.x + 90, y: P0.y + 40 };   // swings left over the road, then rises into the socket from below
        const bez = (u) => { const a = (1 - u) * (1 - u), b = 2 * u * (1 - u), c = u * u; return { x: a * P0.x + b * P1.x + c * SOCK3.x, y: a * P0.y + b * P1.y + c * SOCK3.y }; };
        const FLY = T.land - T.fly, flyU = (t) => { const u = seg(t, T.fly, FLY); return u * u * (1.55 - 0.55 * u) / 1.0; };

        function renderAt(t) {
          // --- shield: drops from above the top edge on a damped spring, swings on its top pivot, then lifts out
          const td = t - T.drop;
          let dy = 0, sw = 0, tilt = 0, vis = td >= 0 && t < T.end - 0.001;
          if (td < 0) dy = 420;
          else { const u = seg(td, 0, 0.32); dy = 420 * (1 - eIn3(u) * 1) * (u < 1 ? 1 : 0);
            if (u >= 1) { const s = td - 0.32; dy = -16 * Math.exp(-7.5 * s) * Math.sin(2 * Math.PI * 2.1 * s); }
            sw = 0.11 * Math.exp(-4.2 * Math.max(0, td - 0.2)) * Math.sin(2 * Math.PI * 1.25 * Math.max(0, td - 0.2));
            tilt = -0.5 * (1 - eOut3(seg(td, 0, 0.42))); }
          const to = seg(t, T.out + 0.14, 0.28), eo = E("back.in(1.7)")(to);
          dy += 460 * eo; sw += -0.06 * eo; tilt += 0.35 * eo;
          hang.position.set(HX, HY + dy, 0); hang.rotation.z = sw; hang.rotation.x = tilt; hang.visible = vis && to < 1;
          // payoff punch: scale kick + a Y wobble that shows the gold edge
          const tp = t - T.flip;
          let ps = 1, wob = 0;
          if (tp >= 0) { ps = 1 + 0.12 * Math.exp(-6 * tp) * Math.cos(2 * Math.PI * 1.8 * tp); wob = 0.22 * Math.exp(-4.5 * tp) * Math.sin(2 * Math.PI * 1.5 * tp); }
          const idle = 0.05 * Math.sin(2 * Math.PI * 0.45 * Math.max(0, t - T.flip - 0.9)) * seg(t, T.flip + 0.9, 0.6);
          punch.scale.setScalar(ps); punch.rotation.y = wob + idle;
          // count flip: old digits fold back, new digits swing down with overshoot (real extruded edges, no crossing)
          const f1 = seg(t, T.flip, 0.09), f2 = seg(t, T.flip + 0.09, 0.34);
          numOld.visible = f1 < 1; numOld.rotation.x = -Math.PI / 2 * eIn3(f1);
          numNew.visible = t >= T.flip + 0.09; numNew.rotation.x = Math.PI / 2 * (1 - E("back.out(2.6)")(f2));
          // light: the key rakes across the gold at the payoff
          const ks = eKey(seg(t, T.flip - 0.05, 0.6));
          key.position.set(lerp(-1.0, 0.9, ks), 0.8, 1.0);
          key.intensity = 1.4 + 2.2 * Math.exp(-Math.pow((t - T.flip - 0.12) / 0.14, 2)) + 0.8 * Math.exp(-Math.pow((td - 0.34) / 0.12, 2));
          const bu = seg(t, T.flip + 0.1, 0.42);
          bandMat.uniforms.uPos.value = bu <= 0 || bu >= 1 ? -1e4 : lerp(-260, 260, eKey(bu));
          bandMat.uniforms.uAmp.value = 0.5 * Math.sin(Math.PI * bu);

          // --- rail slides out of the shield, later retracts into it
          const ri = eOut3(seg(t, T.rail, 0.36)), ro = Math.max(0, E("back.in(1.4)")(seg(t, T.out, 0.22)));
          const rx = -(RL + 30) * (1 - ri) - (RL + 30) * ro;
          rail.position.x = rx + 10 * Math.exp(-9 * Math.max(0, t - T.rail - 0.36)) * Math.sin(2 * Math.PI * 1.8 * Math.max(0, t - T.rail - 0.36)) * (t > T.rail + 0.36 ? 1 : 0);
          railOuter.visible = t >= T.rail && ro < 1;

          // --- coins already found pop into their sockets; the find coin pops off the car and flies in
          coins.forEach((c, i) => {
            const sx = SOCK3.x + (i - C.found) * R.pitch + rail.position.x, sy = railCy;
            if (i < C.found) {
              const tc = t - (T.fill + i * 0.08), u = seg(tc, 0, 0.3);
              const s = tc < 0 ? 0 : eBackA(u);
              c.visible = tc >= 0 && ro < 0.999 && s > 0.01;
              c.position.set(sx, sy, R.z + 8);
              c.scale.setScalar(Math.max(0.001, s)); c.rotation.set(0, (1 - eOut3(u)) * Math.PI * 2, 0);
              return;
            }
            // the find
            const tpp = t - T.pop;
            if (tpp < 0 || ro >= 0.999) { c.visible = false; return; }
            c.visible = true;
            const spin = -Math.PI * 4 * (1 - E("power2.out")(seg(t, T.pop, T.land - T.pop)));   // two turns, face-on at the landing
            if (t < T.fly) {
              const u = seg(tpp, 0, 0.16), s = 2.5 * eBackA(u);
              c.position.set(P0.x, P0.y - 30 + 30 * eOut3(u), 120); c.scale.setScalar(Math.max(0.001, s));
              c.rotation.set(0.25, spin, 0);
            } else if (t < T.land) {
              const u = flyU(t), p = bez(u);
              c.position.set(p.x, p.y, 120 * (1 - u) + 30 * Math.sin(Math.PI * u));
              c.scale.setScalar(lerp(2.5, 1.0, E("power2.in")(seg(t, T.fly, FLY))));
              c.rotation.set(0.25 * (1 - u), spin, 0.3 * Math.sin(Math.PI * u));
            } else {
              const tl2 = t - T.land, sq = Math.exp(-10 * tl2) * Math.cos(2 * Math.PI * 2.4 * tl2);
              c.position.set(sx, sy, R.z + 8 + 6 * sq); c.rotation.set(0, 0, 0);
              c.scale.set(1 + 0.16 * sq, 1 + 0.16 * sq, 1 - 0.3 * Math.max(0, sq));
            }
          });

          // ring burst at the socket on the landing, a small one at the car on the pop
          const tr = t - T.land, ru = seg(tr, 0, 0.36);
          ring.visible = tr >= 0 && ru < 1; ring.position.set(SOCK3.x + rail.position.x, railCy, 10);
          ringMat.uniforms.uR.value = lerp(R.hole + 2, 118, eOut3(ru)); ringMat.uniforms.uW.value = lerp(9, 3, ru);
          ringMat.uniforms.uA.value = 0.95 * (1 - ru) * (1 - ru);
          ringMat.uniforms.uG.value = tr < 0 ? 0 : tr < 0.033 ? tr / 0.033 * 0.8 : tr < 0.13 ? 0.8 : 0.8 * Math.exp(-(tr - 0.13) / 0.12);
          const pr = t - T.pop, pu = seg(pr, 0, 0.3), pm = popRing.material.uniforms;
          popRing.visible = pr >= 0 && pu < 1; popRing.position.set(P0.x, P0.y, 110);
          pm.uR.value = lerp(40, 190, eOut3(pu)); pm.uW.value = lerp(12, 4, pu); pm.uA.value = 0.8 * (1 - pu) * (1 - pu);
          pm.uG.value = pr < 0 ? 0 : 0.7 * Math.exp(-pr / 0.1);

          renderer.render(scene, camera);

          // gold light streak along the flight path (behind the coin), resolves to nothing on landing
          sk.clearRect(0, 0, W, H);
          if (t > T.fly && t < T.land + 0.05) {
            const u1 = flyU(Math.min(t, T.land)), u0 = Math.max(0, u1 - 0.26), fade = 1 - seg(t, T.land, 0.05), N = 24;
            const pts = []; for (let i = 0; i <= N; i++) { const p = bez(lerp(u0, u1, i / N)); pts.push([p.x + W / 2, H / 2 - p.y]); }
            const sc = lerp(2.5, 1.0, E("power2.in")(seg(t, T.fly, FLY)));
            sk.lineCap = "round";
            for (let pass = 0; pass < 2; pass++) {
              sk.shadowColor = pass ? "rgba(255,190,70,0)" : "rgba(255,170,40,0.9)"; sk.shadowBlur = pass ? 0 : 18;
              for (let i = 1; i <= N; i++) {
                const k = i / N; sk.beginPath(); sk.moveTo(pts[i - 1][0], pts[i - 1][1]); sk.lineTo(pts[i][0], pts[i][1]);
                if (pass === 0) { sk.strokeStyle = "rgba(255,196,80," + (0.32 * k * k * fade).toFixed(3) + ")"; sk.lineWidth = CR * 1.1 * sc * (0.2 + 0.8 * k); }
                else { sk.strokeStyle = "rgba(255,246,214," + (0.85 * k * k * fade).toFixed(3) + ")"; sk.lineWidth = 9 * sc * (0.15 + 0.85 * k); }
                sk.stroke();
              }
            }
            sk.shadowBlur = 0;
          }
        }
        window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") renderAt(e.detail.time); });

        const FACES = ["800 124px Archivo", "900 100px Archivo"];
        Promise.all(FACES.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
          drawLabel();
          const tl = gsap.timeline({ paused: true });
          renderAt(0);
          Look.drive(tl, 0, T.end, (p) => renderAt(p * T.end));
          if (plate) {
            Look.impact(tl, T.land, { shake: "#shake", amp: 6, dur: 0.28, flash: 0, host: "#root", zoom: 1.02 });
            Look.push(tl, "#push", 0, T.end, { from: 1.0, to: 1.04 });
          }
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>

/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
