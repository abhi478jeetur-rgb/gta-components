        const halo = new THREE.Mesh(new THREE.PlaneGeometry(440, 440), haloMat); halo.position.set(0, 0, -60); halo.renderOrder = 0;

        const skullRig = new THREE.Group(); [skInk, teethInk, eyeGlow, skull, crack, upperTeeth, jaw].forEach((o) => skullRig.add(o)); chips.forEach((c) => skullRig.add(c));
        const skullSpin = new THREE.Group(); skullSpin.add(skullRig);
        const skullPos = new THREE.Group(); skullPos.add(halo); skullPos.add(skullSpin); shSkull.position.set(12, -18, -80); skullPos.add(shSkull);
        const counter = new THREE.Group(); counter.add(skullPos); scene.add(counter);
        const SX = wx(C.skull.x), SY = wy(C.skull.y);
        counter.position.set(SX, SY, 0); skullPos.scale.setScalar(C.skull.size);

        // ---------- the multiplier: traced Archivo (wdth 80, wght 900) glyphs, italic shear, bevelled extrusion + ink outline ----------
        const F = window.NUM_GLYPHS, SKEW = 0.16, MIN_SEG = 0.6, CURVE_SEG = 7;
        function glyphShapes(d, ox, oy, s) {
          const sp = new THREE.ShapePath(); const re = /([MLQCZ])([^MLQCZ]*)/g; let m;
          while ((m = re.exec(d))) {
            const n = m[2].trim() ? m[2].trim().split(/[\s,]+/).map(Number) : [];

        }
        const CAP = C.number.cap, NS = CAP / F.cap, TRACK = -30, GD = 16;
        function glyphGroup(str, x0, base, s, faceMat) {   // group pivot at its ink centre; returns {grp, w}
          const grp = new THREE.Group(), geos = [], inks = [], all = []; let pen = 0;
          for (const ch of str) {
            const g = F.g[ch]; if (!g) continue;
            const shapes = glyphShapes(g[1], x0 + pen * s, base, s); all.push(...shapes);
            geos.push(new THREE.ExtrudeGeometry(shapes, { depth: GD, bevelEnabled: true, bevelThickness: 4, bevelSize: 3, bevelOffset: -3, bevelSegments: 5, curveSegments: 1 }));

          geos.forEach((geo) => { geo.translate(-cx, -cy, -GD / 2); geo.computeVertexNormals(); grp.add(new THREE.Mesh(geo, [faceMat, digSide])); });
          inks.forEach((geo) => { geo.translate(-cx, -cy, -GD / 2 - 9); grp.add(new THREE.Mesh(geo, digInk)); });

          const pad = 34, sw = box.max.x - box.min.x + 2 * pad, sh = box.max.y - box.min.y + 2 * pad, k = 2;
          const SC = document.createElement("canvas"); SC.width = Math.ceil(sw * k); SC.height = Math.ceil(sh * k);
          const x = SC.getContext("2d"); x.filter = "blur(" + 9 * k + "px)"; x.fillStyle = "#000"; x.beginPath();

        const XS = 0.62, xg = F.g["×"];
        const xMark = glyphGroup("×", nx0 - xg[2] * NS * XS, base + CAP / 2 - 264 * NS * XS, NS * XS, xFace);   // x centred on the digits' cap height

        const counts = []; for (let k = 0; k <= C.deaths.length; k++) counts.push(glyphGroup(String(C.start + k), dX0 - F.g[String(C.start + k)[0]][2] * NS, base, NS, digFace).grp);

        // ---------- motion: a pure function of t ----------

        const D = C.deaths;
        function renderAt(t) {
          // entrance: the skull spins in on Y (real thickness shows), drops 70 px and lands with a squash; the jaw lags and clacks

          const tn = t - T.num, un = seg(tn, 0, 0.32);
          let nS = tn < 0 ? 0 : lerp(2.4, 1, eOut3(un)) * (1 - eo), nZ = tn < 0 ? 0 : 300 * (1 - eOut3(un));
          const land = tn - 0.26; if (land > 0) nS *= 1 + 0.08 * Math.exp(-9 * land) * Math.cos(2 * Math.PI * 2.4 * land);

          numPos.scale.setScalar(Math.max(0.0001, nS)); numPos.position.set(-80 * eo, 0, nZ);
          numRig.rotation.z = 0.12 * (1 - eOut3(un));

          // deaths escalate: the first is a hit (hairline crack, eyes light), the last is the payoff (crack splits, chips fly,

          D.forEach((td, k) => {
            const dt = t - td; if (dt < 0) return;

            shx += (Look.hash(97 * k + f * 3) * 2 - 1) * 14 * big * env; shy += (Look.hash(97 * k + f * 3 + 1) * 2 - 1) * 11 * big * env;
            shr += (Look.hash(97 * k + f * 3 + 2) * 2 - 1) * 0.17 * big * env;
            jawOpen += (last ? 1.25 : 0.75) * Math.exp(-5 * dt) * Math.max(0, Math.cos(2 * Math.PI * 1.9 * dt)) * (dt < 0.03 ? dt / 0.03 : 1);
            const pk = dt < 0.033 ? dt / 0.033 : dt < (last ? 0.133 : 0.08) ? 1 : Math.exp(-(dt - (last ? 0.133 : 0.08)) / 0.16);
            flare += (last ? 1.0 : 0.55) * pk; hot = Math.max(hot, (last ? 1.0 : 0.25) * pk);
            ember = Math.max(ember, (last ? 0.55 : 0.4) * seg(dt, 0.05, 0.3));
            haloA = Math.max(haloA, (last ? 0.95 : 0.45) * pk); if (last && dt < 0.6) haloS = 1 + 0.6 * E("power2.out")(seg(dt, 0, 0.25));
            digHot += 1.6 * Math.exp(-Math.max(0, dt - 0.1) / 0.22) * (dt > 0.1 ? 1 : 0);
            nPunch *= 1 + 0.16 * big * Math.exp(-6 * Math.max(0, dt - 0.08)) * Math.cos(2 * Math.PI * 1.7 * Math.max(0, dt - 0.08)) * (dt > 0.08 ? 1 : 0);
            if (last) cPunch = 1 + 0.22 * Math.min(1, dt / 0.05) * Math.exp(-6.5 * dt) * Math.cos(2 * Math.PI * 1.5 * dt);

            if (!c.visible) return;
            const v = CHIPV[i]; c.position.set(12 + v[0] * tl2, 62 + v[1] * tl2 - 0.5 * 1500 * tl2 * tl2, DEPTH / 2 + BT + 6);
            c.rotation.set(v[2] * tl2 * 0.6, v[2] * tl2 * 0.4, v[2] * tl2);

          numRig.scale.setScalar(nPunch);
          // count roll: a drum through the counter window: the old number drops out the bottom (tilting on the drum),
          // the next one comes in from the top with overshoot. Clip planes keep both inside the window; they never overlap.
          const RH = CAP + 44;
          counts.forEach((g, k) => {
            const tIn = k === 0 ? -1 : D[k - 1], tOut = k < D.length ? D[k] : 1e9, cy0 = g.userData.cy;
            const fo = seg(t, tOut, 0.1), fi = k === 0 ? 1 : seg(t, tIn + 0.1, 0.26);   // strictly sequential: out, then in
            if (t >= tOut + 0.1 || (k > 0 && t < tIn + 0.1)) { g.visible = false; return; }
            g.visible = true;
            if (t >= tOut) { const e = E("power2.in")(fo); g.position.y = cy0 - RH * e; g.rotation.x = 0.7 * e; }
            else { const e = E("back.out(1.5)")(fi); g.position.y = cy0 + RH * (1 - e); g.rotation.x = -0.7 * (1 - e); }

          });
          winLocal[0].constant = base + CAP + 13; winLocal[1].constant = -(base - 13);

        const FACES = ["900 100px Archivo"];
        Promise.all(FACES.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
          const tl = gsap.timeline({ paused: true });
          renderAt(0);
          Look.drive(tl, 0, T.end, (p) => renderAt(p * T.end));
          if (plate) {
            D.forEach((td, k) => Look.impact(tl, td, { shake: "#shake", amp: k === D.length - 1 ? 12 : 5, dur: k === D.length - 1 ? 0.36 : 0.26, flash: 0, host: "#root", zoom: k === D.length - 1 ? 1.035 : 1.015 }));
            Look.push(tl, "#push", 0, T.end, { from: 1.0, to: 1.03 });
          }

          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
