        camera.position.set(0, 0, DIST); camera.lookAt(0, 0, 0);
        const wx = (x) => x - W / 2, wy = (y) => H / 2 - y;

        // studio environment: a big softbox overhead, a strip key front-left, a cool bar right, dark floor
        const envScene = new THREE.Scene();
        envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 48, 24), new THREE.ShaderMaterial({
          side: THREE.BackSide, depthWrite: false,
          vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",

            " vec3 c = y > 0.0 ? mix(hor, top, smoothstep(0.1, 0.9, y)) : mix(hor, low, smoothstep(0.0, 0.4, -y)); gl_FragColor = vec4(c, 1.0); }"
        })));
        const panel = (w, h, x, y, z, c) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); envScene.add(m); };
        panel(40, 12, -4, 30, 22, new THREE.Color(5.0, 4.95, 4.9));

        scene.add(new THREE.HemisphereLight(0xf2f5ff, 0x0c0e14, 0.5));

        const trackGeo = new THREE.ExtrudeGeometry(ring(103 * k, 81 * k), { depth: 3 * k, bevelEnabled: false, curveSegments: 72 });
        badge.add(new THREE.Mesh(trackGeo, trackMat));

        for (let i = 0; i < 60; i++) {

          const m = new THREE.Mesh(g, tickMat); m.position.set(Math.cos(a) * rr, Math.sin(a) * rr, 3.6 * k); m.rotation.z = a - Math.PI / 2; badge.add(m);

        { const g = GC.getContext("2d"), rg = g.createRadialGradient(128, 128, 0, 128, 128, 128); rg.addColorStop(0, "#fff"); rg.addColorStop(0.45, "#9a9a9a"); rg.addColorStop(1, "#000"); g.fillStyle = rg; g.fillRect(0, 0, 256, 256); }

          emissive: new THREE.Color(CONFIG.colors.warn), emissiveMap: glowTex, emissiveIntensity: 0 });
        const faceGeo = new THREE.CircleGeometry(81 * k, 72); faceGeo.translate(0, 0, 2.2 * k);
        badge.add(new THREE.Mesh(faceGeo, faceMat));
        // the band: an annular sector with round caps, rebuilt as it drains

          const phi = (1 - f) * Math.PI * 2, a1 = Math.PI / 2 - phi, a0 = Math.PI / 2 - Math.PI * 2;

          uniforms: { uAmp: { value: 0 }, uCol: { value: warn.clone() } },
          vertexShader: "varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
          fragmentShader: "uniform float uAmp; uniform vec3 uCol; varying vec2 vP; void main(){ float d = length(vP) - " + r0.toFixed(1) + "; " + (inner ? "" : "d = max(d, 0.0); ") + "float a = uAmp * exp(-pow(d / " + w.toFixed(1) + ", 2.0)); gl_FragColor = vec4(uCol, a); }" });

        const halo2 = new THREE.Mesh(new THREE.PlaneGeometry(380 * k, 380 * k), glowMat(117 * k, 20 * k, false)); halo2.position.z = -14 * k; halo2.renderOrder = 1; badge.add(halo2);

          vertexShader: "varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
          fragmentShader: "uniform float uR; uniform float uW; uniform float uAmp; uniform vec3 uCol; varying vec2 vP; void main(){ float d = length(vP) - uR; float a = uAmp * exp(-pow(d / uW, 2.0)); gl_FragColor = vec4(uCol * 1.4, a); }" });
        const wave = new THREE.Mesh(new THREE.PlaneGeometry(440 * k, 440 * k), waveMat); wave.position.z = -2; wave.renderOrder = 1; pivot.add(wave);

        const eBack = E("back.out(1.7)"), eOut3 = E("power3.out"), eIO3 = E("power3.inOut"), eIn3 = E("power3.in"), eIO2 = E("power2.inOut");

          bead.position.set(Math.cos(a1) * RM, Math.sin(a1) * RM, 11.5 * k); halo.position.set(Math.cos(a1) * RM, Math.sin(a1) * RM, 14 * k);

          const arm = t >= tWarn ? 1 : 0, col = arm ? warn.clone() : calm.clone();
          let heat = 0; ticks.forEach((tk) => { if (tk.t >= tWarn) { const tau = t - tk.t; if (tau >= 0) heat += (tk.t === tWarn ? 1 : 0.5) * (tau < 3 / 30 ? 1 : Math.exp(-(tau - 3 / 30) / 0.12)); } });
          bandMat.color.copy(col); bandMat.emissive.copy(col);
          bandMat.emissiveIntensity = 0.14 + 0.06 * arm + 0.7 * Math.min(1, heat);
          // red light blooms onto the steel: a 3-frame peak at the arming, a low burn while armed, a lift on every beat
          const bloom = arm * (0.16 + 0.75 * Math.min(1.2, heat));
          bezelGlow.material.uniforms.uAmp.value = 0.42 * bloom; halo2.material.uniforms.uAmp.value = 0.5 * bloom;
          beadMat.emissive.copy(col); beadMat.emissiveIntensity = 1.2 + 2.5 * heat;
          haloMat.color.copy(col); haloMat.opacity = 0.55 + 0.4 * Math.min(1, heat);
          faceMat.emissiveIntensity = arm * (0.15 + 0.75 * heat);
          // light: the key swings across the steel as it arms and peaks for 3 frames
          const ks = eIO2(seg(t, tWarn - 0.12, 0.6));
          let ka = 2.25; ticks.forEach((tk) => { ka -= 0.26 * E("power3.out")(seg(t, tk.t, 0.2)); });
          key.position.set(Math.cos(ka) * 1.1 + 1.2 * ks, Math.sin(ka) * 1.1, 0.9);
          key.intensity = 1.6 + 2.2 * (t < tWarn ? 0 : (t - tWarn < 0.1 ? 1 : Math.exp(-(t - tWarn - 0.1) / 0.18)));
          const rk = seg(t, tWarn, 0.38), ro = seg(t, T.dock + 0.3, 0.45);
          rakeB.material.uniforms.uPos.value = rk > 0 && rk < 1 ? lerp(-170, 170, eIO2(rk)) * k : (ro > 0 && ro < 1 ? lerp(-170, 170, eIO2(ro)) * k : -1e4);
          rakeB.material.uniforms.uAmp.value = rk > 0 && rk < 1 ? Math.sin(Math.PI * rk) : (ro > 0 && ro < 1 ? 0.6 * Math.sin(Math.PI * ro) : 0);
          rakeF.material.uniforms.uPos.value = rakeB.material.uniforms.uPos.value; rakeF.material.uniforms.uAmp.value = rakeB.material.uniforms.uAmp.value;
          // ring wave on armed ticks
          let wr = 0, wa = 0;
          ticks.forEach((tk) => { if (tk.t >= tWarn && t >= tk.t && t < tk.t + 0.5) { const p = (t - tk.t) / 0.5; wr = lerp(121, tk.t === tWarn ? 158 : 142, eOut3(p)) * k; wa = (tk.t === tWarn ? 0.7 : 0.3) * Math.pow(1 - p, 1.5) * Math.min(1, p * 8); } });
          waveMat.uniforms.uR.value = wr; waveMat.uniforms.uAmp.value = 0 * wa; waveMat.uniforms.uW.value = (4 + 6 * seg(wr, 121 * k, 37 * k)) * k;
          renderer.render(scene, camera);
          // the canvas carries the motion blur of the spins (no blur on the settled badge)
          const bl = (u > 0 && u < 0.55 ? 7 * (1 - u / 0.55) : 0) + (d > 0.15 && d < 0.85 ? 2.5 * Math.sin(Math.PI * (d - 0.15) / 0.7) : 0) + 7 * xe;
          canvas.style.filter = bl > 0.2 ? "blur(" + bl.toFixed(2) + "px)" : "none";

          // ---------- DOM: pinned to the projected badge centre ----------
          const pc = new THREE.Vector3(0, 0, 3 * k); badge.localToWorld(pc); pc.project(camera);
          const px = (pc.x + 1) / 2 * W, py = (1 - pc.y) / 2 * H;
          const sc = s * DIST / (DIST - 3 * k);
          const ryd = ry * 180 / Math.PI, dvis = vis && Math.abs(ry) < 1.25 && t >= T.in + 0.22;
          $("#dial").style.transform = "translate(" + px.toFixed(2) + "px," + py.toFixed(2) + "px) perspective(900px) rotateY(" + ryd.toFixed(2) + "deg) rotateX(" + (-rx * 57.3).toFixed(2) + "deg) scale(" + sc.toFixed(4) + ")";
          $("#dial").style.opacity = dvis ? clamp((1.25 - Math.abs(ry)) / 0.35, 0, 1).toFixed(3) : 0;
          $("#dial").style.filter = bl > 0.2 ? "blur(" + (bl * 0.8).toFixed(2) + "px)" : "none";
          // columns: roll in from above on entry, then roll per tick
          const hEm = 1.3 * FS;
          [0, 1, 2, 3].forEach((i) => {
            const din = seg(t, T.in + 0.26 + i * 0.045, 0.3);
            const de2 = E("back.out(1.6)")(din);
            cols[i].style.transform = "translateY(" + (-(1 - de2) * 0.4 * hEm).toFixed(2) + "px)";
            cols[i].parentElement.style.clipPath = "inset(0.26em -20% " + Math.max(0.26, 1.3 * (1 - Math.min(1, de2))).toFixed(3) + "em -20%)";
            if (strips[i]) { const cp = colPos(i, t), fr = Math.abs(cp - Math.round(cp));
              strips[i].style.transform = "translateY(" + (-cp * 0.8 * FS).toFixed(2) + "px)";
              strips[i].style.filter = fr > 0.04 ? "blur(" + (Math.min(1, fr * 4) * 1.6).toFixed(2) + "px)" : "none"; }
          });
          const glowA = arm * (0.55 + 0.45 * Math.min(1, heat));
          dg.style.filter = "drop-shadow(0 0 " + (6 + 10 * glowA).toFixed(1) + "px rgba(255,46,58," + (0.85 * glowA).toFixed(3) + ")) drop-shadow(0 2px 1.5px rgba(0,0,0,.7))";
          // contact shadow on the footage: wide and soft while big, tight once docked
          const sh = $("#shadow");
          sh.style.transform = "translate(" + (cx + 10 * s).toFixed(1) + "px," + (cy + 16 * s).toFixed(1) + "px) scale(" + (s * R / 120 * 0.98).toFixed(4) + ")";
          sh.style.opacity = vis ? (0.9 * Math.min(1, u * 2) * (1 - xe)).toFixed(3) : 0;
        }
        window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") renderAt(e.detail.time); });

        const FACES = ["900 100px Inter"];
        Promise.all(FACES.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
          // centre the digit row on the dial origin (measured after the font is in)
          FS = Math.round(64 * Math.min(1, (CONFIG.digitWidth * k) / dg.offsetWidth)); dg.style.fontSize = FS + "px";
          dg.style.left = (-dg.offsetWidth / 2).toFixed(1) + "px"; dg.style.top = (-dg.offsetHeight / 2 + 1).toFixed(1) + "px";
          const tl = gsap.timeline({ paused: true });
          renderAt(0);
          Look.drive(tl, 0, T.end, (p) => renderAt(p * T.end));
          if (plate) Look.impact(tl, tWarn, { shake: "#shake", amp: 5, dur: 0.28, flash: 0, host: "#root", zoom: 1.012 });
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
