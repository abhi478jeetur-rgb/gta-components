  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1920" data-height="1080">
      <div id="shake"><div id="push">
        <video id="s1" class="clip shot" src="assets/shots/v49-gp-franklin-mural-h.mp4" muted playsinline data-start="0" data-duration="1.5" data-media-start="0.3" data-track-index="0"></video>
        <video id="s2" class="clip shot" src="assets/shots/v17-deluxo-sunset-h.mp4" muted playsinline data-start="1.5" data-duration="1.5" data-media-start="0.05" data-track-index="0"></video>
        <video id="s3" class="clip shot" src="assets/shots/v52-gp-police-bridge-h.mp4" muted playsinline data-start="3.0" data-duration="1.5" data-media-start="1.0" data-track-index="0"></video>
        <video id="s4" class="clip shot" src="assets/shots/v11-yacht-h.mp4" muted playsinline data-start="4.5" data-duration="2.1" data-media-start="0" data-track-index="0"></video>
        <video id="s5" class="clip shot" src="assets/shots/v45-beach-aerial-h.mp4" muted playsinline data-start="6.6" data-duration="0.4" data-media-start="0.1" data-track-index="0"></video>

        <div id="gl"></div>
        <div id="hdr">

          <div style="display:flex;align-items:center" class="numS"><div class="win" id="cw"><div class="strip" id="cwS" data-layout-allow-overflow></div></div><span class="of" id="of"></span></div>
        </div>
        <div id="rows"></div>
        <div id="gglow"></div>
        <div id="gold3d"></div>
      </div>
    </div>
    <script>
      const CONFIG = {
        title: "GOALS",                    // header word above the column
        doneTitle: ["Challenge", "complete"], // gold title that slams out of the column once every goal is ticked (1-2 lines)
        title3d: { size: 122, lineGap: 120, depth: 26, bevel: 5.5, tilt: 0.3, maxInk: 640,   // real extruded glyphs (media/title3d.js): lands white enamel, a light front turns it gold
          colors: { whiteFace: ["#FFFFFF", "#E4E9F0"], whiteSide: ["#2A2F3A", "#07080B"], goldFace: ["#FFF1A0", "#FFC21E", "#E07F0A"], goldLip: "#F7B23A", goldSide: ["#C46A00", "#3A1400"], hot: "#FFF6D0" } },
        goals: [                           // done: second the goal ticks (0 = already ticked when the list enters, null = never in this clip)
          { text: "Rob the cash stash",  img: "media/goal-cash.jpg",   done: 0 },
          { text: "Steal the Deluxo",    img: "media/goal-deluxo.jpg", done: 1.5 },
          { text: "Lose a 5-star chase", img: "media/goal-police.jpg", done: 3.0 },
          { text: "Take the superyacht", img: "media/goal-yacht.jpg",  done: 4.5 }
        ],
        colors: { ring: "#F4F6F9", done: "#2BD65A", coin: "#1DBE4E", active: "#FFD23C", doneText: "#DDF9E6" },
        layout: { x: 96, top: 204, R: 76, pitch: 166, labelGap: 26 },   // token column: left edge, first token top, radius, row pitch
        timing: { in: 0.10, dock: 0.85, out: 6.45, end: 7.0 }   // dock: after the first tick, the list collapses to its token column this long later
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const T = CONFIG.timing, Lay = CONFIG.layout, G = CONFIG.goals, N = G.length, R = Lay.R, $ = (s) => document.querySelector(s);
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));
        const CX = Lay.x + R, CY = (i) => Lay.top + R + i * Lay.pitch;
        const LX = Lay.x + 2 * R + Lay.labelGap;

        // ---------- DOM: header + rows ----------
        const hdr = $("#hdr"); hdr.style.left = (Lay.x - 8) + "px"; hdr.style.top = (Lay.top - 100) + "px";
        $("#hwS").children[0].textContent = CONFIG.title;
        const gold3d = $("#gold3d");
        const ticks0 = G.filter((g) => g.done === 0).length;
        for (let k = ticks0; k <= N; k++) { const d = document.createElement("div"); d.textContent = String(k); if (k === N) d.className = "g"; $("#cwS").appendChild(d); }
        $("#of").textContent = "/" + N;
        const rows = G.map((g, i) => {
          const r = document.createElement("div"); r.className = "row"; r.style.left = (LX - 6) + "px"; r.style.top = (CY(i) - 46) + "px";
          r.innerHTML = '<div class="clipw"><div class="lab cap"><span class="txt" data-layout-allow-occlusion></span><i class="strike" data-layout-allow-occlusion></i></div></div>';
          r.querySelector(".txt").textContent = g.text; $("#rows").appendChild(r);
          return { row: r, clip: r.querySelector(".clipw"), lab: r.querySelector(".lab"), txt: r.querySelector(".txt"), strike: r.querySelector(".strike") };
        });
        const bloom = $("#bloom"); bloom.style.left = (CX - 260 + 40) + "px"; bloom.style.top = (CY(1.5) - 410) + "px";
        const midY = (CY(0) + CY(N - 1)) / 2, nGL = CONFIG.doneTitle.length;
        const gglow = $("#gglow"); gglow.style.left = (LX - 160) + "px"; gglow.style.top = (midY - 210) + "px";

        // ---------- time helpers (pure functions of t) ----------
        const TAU = Math.PI * 2, clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
        const eo3 = (x) => 1 - Math.pow(1 - clamp(x), 3), eio = (x) => { x = clamp(x); return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
        const backIn = (x) => { x = clamp(x); const c1 = 1.70158; return (c1 + 1) * x * x * x - c1 * x * x; };
        const spring = (t, f, z) => { if (t <= 0) return 0; const w = TAU * f, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); };
        const bell = (t, a, d) => { const u = (t - a) / d; return u <= 0 || u >= 1 ? 0 : Math.sin(Math.PI * u); };
        const flash = (t, a) => { const u = t - a; if (u < 0) return 0; if (u < 1 / 30) return u * 30; if (u < 4 / 30) return 1; return Math.max(0, 1 - (u - 4 / 30) / 0.42); }; // 1-frame attack, 3-frame hold
        const tIn = (i) => T.in + i * 0.08, tOut = (i) => T.out + i * 0.03;
        const done = G.map((g) => g.done), finals = done.filter((d) => d != null), tLast = Math.max(...finals), tLock = (d) => d + 0.3;
        const activeFrom = (i) => { const prev = i > 0 ? done[i - 1] : null; return prev == null ? tIn(i) + 0.35 : (prev === 0 ? tIn(i) + 0.45 : prev + 0.42); };
        const isActive = (i, t) => done[i] !== 0 && t >= activeFrom(i) && (done[i] == null || t < done[i]) && (i === 0 || done[i - 1] != null);
        const waveAt = tLock(tLast) + 0.05;

        function tokenState(i, t) {
          const cy = CY(i), te = t - tIn(i);
          const S = { x: CX, y: cy, z: 0, s: 0, rx: 0, ry: 0, rz: 0, prog: 0, hot: 0, glow: 0, dim: 1, shadow: 0, tick: { s: 0, ry: 0 }, hy: 0, hg: 0 };
          if (te < 0) return S;
          // entrance: swing in from the left edge on a spring, edge-on first so the ring's thickness reads
          const k = spring(te, 2.5, 0.42);
          S.s = 0.32 + 0.68 * k; S.ry = -78 * (1 - eo3(te / 0.5)); S.x = CX - 70 * (1 - eo3(te / 0.42)); S.rz = -14 * (1 - eo3(te / 0.5));
          S.shadow = 0.85 * clamp(te / 0.2);
          const d = done[i];
          if (d === 0) { S.prog = 1; S.tick.s = spring(te - 0.16, 3.0, 0.4); S.tick.ry = 360 * (1 - eo3((te - 0.16) / 0.5)); }
          else if (d != null) {
            const pr = t < d ? eio((t - (d - 0.1)) / 0.1) : 1 - spring(t - d, 3.3, 0.36);       // press 0.1 s before the cut, release on a spring
            S.s *= 1 - 0.1 * pr; S.rx += 16 * pr; S.z -= 16 * pr;
            S.prog = t <= d ? 0 : eio((t - d) / 0.3);
            S.hot = t <= d ? 0 : (t < d + 0.3 ? 1 : clamp(1 - (t - d - 0.3) / 0.16));
            const tt = t - (d + 0.2); S.tick.s = spring(tt, 3.0, 0.38); S.tick.ry = 360 * (1 - eo3(tt / 0.55)); S.tick.rz = -24 * (1 - eo3(tt / 0.4));
            S.glow = 0.55 * flash(t, tLock(d)); S.hg = 0.95 * flash(t, tLock(d)); S.hgS = 1 + 0.12 * eo3((t - tLock(d)) / 0.5);
            // a broad specular band crosses ring and glass, upper left to lower right, as the ring locks
            const bu = (t - (d + 0.14)) / 0.5; if (bu > 0 && bu < 1) { S.band = -1.7 + 3.4 * eio(bu); S.bandAmp = 0.8 * Math.sin(Math.PI * bu); }
          }
          // the current goal: full brightness and a breathing gold halo; pending goals sit back
          const act = isActive(i, t), isDone = d != null && t > d;
          if (act) { const ta = t - activeFrom(i); S.hy = clamp(ta / 0.18) * (0.55 + 0.2 * Math.sin(TAU * 1.4 * ta)); }
          else if (d != null && d > 0 && t >= d && t < d + 0.15) S.hy = 0.6 * (1 - (t - d) / 0.15);
          const pend = !isDone && !(d === 0);
          const wAct = act ? clamp((t - activeFrom(i)) / 0.2) : (d != null && d > 0 && t >= d ? 1 : 0);
          S.dim = pend ? 0.66 + 0.34 * wAct : 1;
          if (d != null && d > 0 && t > d) S.dim = 1;
          // payoff: the whole column punches, then every ring rocks through the light in turn and the green glow swells
          if (finals.length === N && t >= tLock(tLast)) { const u = t - tLock(tLast), p = u < 0.07 ? eo3(u / 0.07) : 1 - spring(u - 0.07, 2.6, 0.4); S.s *= 1 + 0.07 * p; }
          if (t >= waveAt && finals.length === N) { const w = bell(t, waveAt + i * 0.07, 0.5); S.ry += 26 * w; S.rx -= 6 * w; S.glow += 0.4 * w; S.hg += 0.55 * w;
            const bu = (t - (waveAt + i * 0.07)) / 0.5; if (bu > 0 && bu < 1) { S.band = -1.7 + 3.4 * eio(bu); S.bandAmp = Math.max(S.bandAmp || 0, 0.7 * Math.sin(Math.PI * bu)); } }
          // exit: a small lift, then the token collapses edge-on into its own centre
          const tx = t - tOut(i);
          if (tx > 0) { const a = tx < 0.07 ? 1 + 0.07 * eo3(tx / 0.07) : 1.07 * (1 - backIn((tx - 0.07) / 0.22)); S.s *= Math.max(0, a); S.ry += 85 * eio(tx / 0.29); S.shadow *= Math.max(0, a); S.hg = 0; S.hy = 0; }
          return S;
        }
        function selState(t) {
          for (let i = 0; i < N; i++) {
            if (done[i] === 0 || (i > 0 && done[i - 1] == null)) continue;
            const a = activeFrom(i), d = done[i] == null ? Infinity : done[i];
            if (t >= a && t < d + 0.12) {
              const ta = t - a, s = 0.86 + 0.14 * spring(ta, 2.6, 0.4) + (t < a + 0.001 ? 0 : 0);
              let alpha = clamp(ta / 0.06), sc = s * (1 + 0.28 * (1 - eo3(ta / 0.3)));
              if (t > d - 0.1) { const u = clamp((t - (d - 0.1)) / 0.22); sc *= 1 - 0.12 * eio(u); alpha *= 1 - eio(u); }
              const tok = tokenState(i, t);
              return { x: tok.x, y: tok.y, z: tok.z, s: sc * tok.s, a: alpha, glow: 0.5 + 0.5 * Math.sin(TAU * 1.4 * ta) };
            }
          }
          return null;
        }
        function rakeState(t) { return null; }   // light now crosses as a broad band in the ring/glass shaders (S.band)

        const FACES = ["900 100px Archivo", "900 100px Inter", "800 100px Inter"];
        const imgs = G.map((g) => { const im = new Image(); im.src = g.img; return im; });
        Promise.all(FACES.map((f) => document.fonts.load(f))).then(() => document.fonts.ready)
          .then(() => Promise.all(imgs.map((im) => im.decode()))).then(() => {
          // 3D layer covers the token column (plus room for pops and halos)
          const GL = { left: 20, top: CY(0) - R - 90, W: 340, H: (N - 1) * Lay.pitch + 2 * R + 180 };
          const T3 = Tokens3D({ left: GL.left, top: GL.top, W: GL.W, H: GL.H, dpr: 2, R, white: CONFIG.colors.ring, green: CONFIG.colors.done, coin: CONFIG.colors.coin, select: CONFIG.colors.active,
            tokens: G.map((g, i) => ({ img: imgs[i] })) });
          $("#gl").appendChild(T3.canvas);
          // strike bar sits on the cap-height middle of the label
          rows.forEach((r) => { const h = r.lab.offsetHeight; r.strike.style.top = (h / 2 - 3 + 2) + "px"; });

          const renderAt = (t) => T3.render({ tokens: G.map((g, i) => tokenState(i, t)), sel: selState(t), rake: rakeState(t) });

          const tl = gsap.timeline({ paused: true });
          const OPEN = "inset(-30px -40px -30px -12px)", SHUT = "inset(-30px 100% -30px 0px)";
          // header: masked wipe + slam
          gsap.set("#hdr", { clipPath: "inset(-30px 100% -30px 0px)", x: -30 });
          tl.set("#hdr", { visibility: "visible" }, T.in + 0.02);
          tl.to("#hdr", { clipPath: "inset(-30px -60px -30px -30px)", x: 0, duration: 0.42, ease: "expo.out" }, T.in + 0.02);
          // a label wipes out of its token / back into it (hidden outside its windows: no residue)
          const show = (r, at) => {
            tl.set(r.clip, { visibility: "visible" }, at);
            tl.fromTo(r.clip, { clipPath: SHUT, x: -46 }, { clipPath: OPEN, x: 0, duration: 0.42, ease: "expo.out", immediateRender: false }, at);
          };
          const hide = (r, at) => {
            tl.fromTo(r.clip, { clipPath: OPEN, x: 0 }, { clipPath: SHUT, x: -40, duration: 0.24, ease: "power3.in", immediateRender: false }, at);
            tl.set(r.clip, { visibility: "hidden" }, at + 0.25);
          };
          // schedule: the whole list enters big; after the first tick it docks to its token column and only the current goal keeps its name
          const firstTick = Math.min(...done.filter((d) => d != null && d > 0));
          const dockAt = firstTick + T.dock;
          const doneCol = CONFIG.colors.doneText;
          rows.forEach((r, i) => {
            const d = done[i], a = activeFrom(i), canAct = d !== 0 && (i === 0 || done[i - 1] != null);
            gsap.set(r.clip, { clipPath: SHUT, x: -46 });
            show(r, tIn(i) + 0.14);
            const activeAtDock = canAct && a <= dockAt && (d == null || d > dockAt), later = canAct && a > dockAt;
            if (!activeAtDock) hide(r, dockAt + i * 0.04);                 // everything but the current goal folds into its token
            if (later) show(r, a);                                          // a goal's name comes back when it becomes the current goal
            if (activeAtDock || later) {                                    // ... is struck, then folds away again
              if (d != null && d > 0) hide(r, d === tLast ? d + 0.46 : d + T.dock);
              else if (d == null) hide(r, tOut(i) - 0.02);
            }
            if (d === 0) { gsap.set(r.txt, { color: doneCol }); gsap.set(r.strike, { scaleX: 1 }); }
            else {
              gsap.set(r.txt, { color: "#ffffff" });
              if (canAct) {
                tl.to(r.txt, { color: CONFIG.colors.active, duration: 0.12, ease: "none" }, a);
                tl.fromTo(r.lab, { scale: 1 }, { scale: 1.07, duration: 0.09, ease: "power2.out", transformOrigin: "0% 50%", immediateRender: false }, a);
                tl.to(r.lab, { scale: 1, duration: 0.36, ease: "back.out(2.4)" }, a + 0.09);
              }
              if (d != null) {
                tl.fromTo(r.strike, { scaleX: 0 }, { scaleX: 1, duration: 0.26, ease: "expo.out", immediateRender: false }, d + 0.22);
                tl.fromTo(r.strike, { "--tip": 1 }, { "--tip": 0, duration: 0.3, ease: "power2.in", immediateRender: false }, d + 0.22);
                tl.to(r.txt, { color: doneCol, duration: 0.16, ease: "none" }, d + 0.26);
                tl.fromTo(r.lab, { x: 0 }, { x: 10, duration: 0.08, ease: "power2.out", immediateRender: false }, d + 0.22);
                tl.to(r.lab, { x: 0, duration: 0.4, ease: "back.out(2.6)" }, d + 0.3);
              }
            }
          });
          // counter rolls on each lock
          let step = 0;
          done.forEach((d) => { if (d == null || d === 0) return; step++;
            const k = step; tl.to("#cwS", { y: -80 * k, duration: 0.42, ease: "back.out(1.7)" }, tLock(d)); });
          if (finals.length === N) {
            const L = tLock(tLast);
            tl.to(["#hw .strip > div", "#of"], { color: "#5BEA8A", duration: 0.1 }, L + 0.1);
            tl.fromTo("#hdr", { scale: 1 }, { scale: 1.12, duration: 0.08, ease: "power2.out", transformOrigin: "0% 50%", immediateRender: false }, L + 0.04);
            tl.to("#hdr", { scale: 1, duration: 0.5, ease: "elastic.out(1, 0.45)" }, L + 0.12);
            // payoff light stays on the object: green bloom behind the column, 1-frame attack, 3-frame hold
            tl.fromTo(bloom, { opacity: 0 }, { opacity: 1, duration: 1 / 30, ease: "none", immediateRender: false }, L);
            tl.to(bloom, { opacity: 0, duration: 0.6, ease: "power2.out" }, L + 4 / 30);
            if (plate) Look.impact(tl, L, { flash: 0, shake: "#shake", amp: 7, dur: 0.3, zoom: 1.012 });
            // the payoff title: real extruded, bevelled glyphs (title3d.js) wipe out of the column and slam, land as white enamel,
            // then a light front turns them to polished gold with a raking key, one specular sweep and a bloom on the letters
            const G0 = tLast + 0.5, TT = CONFIG.title3d, RW = 780, RH = 240;
            const titles = CONFIG.doneTitle.map((w, k) => {
              const ig = G0 + 0.14 + k * 0.07;
              const P = Payoff3D({ W: RW, H: RH, glyphs: window.PAYOFF_GLYPHS, text: w, size: TT.size, tracking: -0.01, maxInk: TT.maxInk,
                cx: RW / 2, cy: RH / 2, depth: TT.depth, bevel: TT.bevel, tilt: TT.tilt, inkPx: 6, inkColor: "#07080B", shadow: 0.6, shadowOff: 10,
                colors: TT.colors, timing: { ignite: ig, frontDur: 0.22, specAt: ig + 0.1, specDur: 0.45, rakeDur: 0.6, holdEnd: T.out } });
              const wrap = document.createElement("div"); wrap.className = "t3";
              const cy = midY + (k - (nGL - 1) / 2) * TT.lineGap;
              wrap.style.cssText = "left:" + (LX - P.inkLeft).toFixed(1) + "px;top:" + (cy - RH / 2).toFixed(1) + "px;width:" + RW + "px;height:" + RH + "px";
              wrap.appendChild(P.canvas); gold3d.appendChild(wrap);
              return { P, wrap, cy };
            });
            gsap.set(gold3d, { transformOrigin: LX + "px " + midY + "px" });
            tl.set(gold3d, { visibility: "visible" }, G0);
            titles.forEach((o, k) => {
              const inkX = LX - parseFloat(o.wrap.style.left);   // ink left inside the wrapper
              gsap.set(o.wrap, { clipPath: "inset(-20px " + RW + "px -20px " + (inkX - 16) + "px)", x: -60 });
              tl.to(o.wrap, { clipPath: "inset(-20px 0px -20px " + (inkX - 16) + "px)", x: 0, duration: 0.4, ease: "expo.out" }, G0 + k * 0.07);
            });
            tl.fromTo(gold3d, { scale: 1.16 }, { scale: 1, duration: 0.7, ease: "elastic.out(1, 0.5)", immediateRender: false }, G0);
            tl.fromTo(gglow, { opacity: 0 }, { opacity: 1, duration: 1 / 30, ease: "none", immediateRender: false }, G0 + 0.18);
            tl.to(gglow, { opacity: 0.3, duration: 0.7, ease: "power2.out" }, G0 + 0.18 + 4 / 30);
            const X0 = T.out - 0.1;
            titles.forEach((o, k) => {
              const inkX = LX - parseFloat(o.wrap.style.left);
              tl.to(o.wrap, { clipPath: "inset(-20px " + RW + "px -20px " + (inkX - 16) + "px)", x: -50, duration: 0.26, ease: "power3.in" }, X0 + k * 0.04);
            });
            tl.to(gglow, { opacity: 0, duration: 0.25 }, X0);
            tl.set(gold3d, { visibility: "hidden" }, X0 + 0.34);
            Look.drive(tl, 0, T.end, (p) => titles.forEach((o) => o.P.renderAt(p * T.end)));
            titles.forEach((o) => o.P.renderAt(0));
          }
          tl.to("#hdr", { clipPath: "inset(-30px 100% -30px 0px)", x: -30, duration: 0.24, ease: "power3.in" }, T.out - 0.06);
          tl.set("#hdr", { visibility: "hidden" }, T.out + 0.2);
          if (plate) Look.push(tl, "#push", 0, T.end, { to: 1.04 });
          Look.drive(tl, 0, T.end, (p) => renderAt(p * T.end));
          window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") renderAt(e.detail.time); });
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          renderAt(0);
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
