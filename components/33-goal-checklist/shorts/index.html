    <script>
      const CONFIG = {
        goals: [                           // done: second the goal ticks (0 = already ticked when the row enters, null = never in this clip)
          { text: "Rob the cash stash",  img: "media/goal-cash.jpg",   done: 0 },
          { text: "Steal the Deluxo",    img: "media/goal-deluxo.jpg", done: 1.5 },
          { text: "Lose a 5-star chase", img: "media/goal-police.jpg", done: 3.0 },
          { text: "Take the superyacht", img: "media/goal-yacht.jpg",  done: 4.5 }
        ],
        kicker: "Goal {n} of {N}",         // line above the current goal
        doneKicker: "All goals done",
        doneTitle: ["Challenge", "complete"], // gold title that slams in once everything is ticked (1-2 lines)
        title3d: { size: 156, lineGap: 150, depth: 32, bevel: 6.5, tilt: 0.3, maxInk: 800,   // real extruded glyphs (media/title3d.js): lands white enamel, a light front turns it gold

      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const T = CONFIG.timing, Lay = CONFIG.layout, G = CONFIG.goals, N = G.length, R = Lay.R, $ = (s) => document.querySelector(s);
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));
        const CX = (i) => Lay.cx + (i - (N - 1) / 2) * Lay.pitch, CY = Lay.cy;

        const done = G.map((g) => g.done), first = G.findIndex((g) => g.done !== 0);
        const order = []; for (let i = first; i < N; i++) order.push(i);

        const lines = order.map((i) => {
          const k = document.createElement("div"); k.setAttribute("data-layout-allow-occlusion", ""); k.textContent = CONFIG.kicker.replace("{n}", i + 1).replace("{N}", N); $("#kickS").appendChild(k);

          return { i, lab: l.querySelector(".lab"), txt: l.querySelector(".txt"), strike: l.querySelector(".strike") };
        });
        const gold3d = $("#gold3d"), gglow = $("#gglow");
        if (allDone) {
          const k = document.createElement("div"); k.setAttribute("data-layout-allow-occlusion", ""); k.className = "g"; k.textContent = CONFIG.doneKicker; $("#kickS").appendChild(k);
        }

        // a blank line after the last so the exit can roll everything out upward
        $("#kickS").appendChild(document.createElement("div")); $("#labS").appendChild(document.createElement("div"));
        const bloom = $("#bloom"); bloom.style.left = (Lay.cx - 490) + "px"; bloom.style.top = (CY - 230) + "px";
        const caret = $("#caret");

        // ---------- time helpers (pure functions of t) ----------

        const finals = done.filter((d) => d != null), tLast = Math.max(...finals), tLock = (d) => d + 0.3;
        const STEP = 0.48;                                                             // label rolls to the next goal this long after a tick
        const activeFrom = (i) => { const prev = i > 0 ? done[i - 1] : null; return (prev == null || prev === 0) ? tIn(N - 1) + 0.4 : prev + STEP; };
        const isActive = (i, t) => done[i] !== 0 && t >= activeFrom(i) && (done[i] == null || t < done[i] + 0.12) && (i === 0 || done[i - 1] != null);
        const waveAt = tLock(tLast) + 0.05;

        function tokenState(i, t) {
          const te = t - tIn(i);
          const S = { x: CX(i), y: CY, z: 0, s: 0, rx: 0, ry: 0, rz: 0, prog: 0, hot: 0, glow: 0, dim: 1, shadow: 0, tick: { s: 0, ry: 0 }, hy: 0, hg: 0 };
          if (te < 0) return S;

          const k = spring(te, 2.5, 0.42);
          S.s = 0.32 + 0.68 * k; S.rx = 70 * (1 - eo3(te / 0.5)); S.y = CY - 80 * (1 - eo3(te / 0.42)); S.rz = 12 * (1 - eo3(te / 0.5));
          S.shadow = 0.85 * clamp(te / 0.2);
          const d = done[i];
          if (d === 0) { S.prog = 1; S.tick.s = spring(te - 0.16, 3.0, 0.4); S.tick.ry = 360 * (1 - eo3((te - 0.16) / 0.5)); }
          else if (d != null) {
            const pr = t < d ? eio((t - (d - 0.1)) / 0.1) : 1 - spring(t - d, 3.3, 0.36);
            S.s *= 1 - 0.1 * pr; S.rx += 16 * pr; S.z -= 16 * pr;
            S.prog = t <= d ? 0 : eio((t - d) / 0.3);
            S.hot = t <= d ? 0 : (t < d + 0.3 ? 1 : clamp(1 - (t - d - 0.3) / 0.16));
            const tt = t - (d + 0.2); S.tick.s = spring(tt, 3.0, 0.38); S.tick.ry = 360 * (1 - eo3(tt / 0.5)); S.tick.rz = -24 * (1 - eo3(tt / 0.4));
            S.glow = 0.55 * flash(t, tLock(d)); S.hg = 0.95 * flash(t, tLock(d)); S.hgS = 1 + 0.12 * eo3((t - tLock(d)) / 0.5);
            // a broad specular band crosses ring and glass, upper left to lower right, as the ring locks
            const bu = (t - (d + 0.14)) / 0.5; if (bu > 0 && bu < 1) { S.band = -1.7 + 3.4 * eio(bu); S.bandAmp = 0.8 * Math.sin(Math.PI * bu); }
          }
          // the current goal is lifted and lit: bigger, forward, a breathing gold halo; pending goals sit back
          const act = isActive(i, t);
          let lift = 0;
          if (act) lift = spring(t - activeFrom(i), 2.6, 0.45);
          if (d != null && d > 0 && t >= d + 0.12) lift = 1 - eio((t - d - 0.12) / 0.35);
          if (lift > 0) { S.s *= 1 + 0.12 * lift; S.z += 18 * lift; }
          if (act) { const ta = t - activeFrom(i); S.hy = clamp(ta / 0.18) * (0.6 + 0.2 * Math.sin(TAU * 1.4 * ta)) * (d != null && t > d ? clamp(1 - (t - d) / 0.12) : 1); S.hyS = 1.12; }
          const isDone = d === 0 || (d != null && t > d);
          if (!isDone) S.dim = act ? 0.62 + 0.38 * clamp((t - activeFrom(i)) / 0.2) : 0.62;
          if (allDone && t >= tLock(tLast)) { const u = t - tLock(tLast), p = u < 0.07 ? eo3(u / 0.07) : 1 - spring(u - 0.07, 2.6, 0.4); S.s *= 1 + 0.07 * p; }
          if (t >= waveAt && allDone) { const w = bell(t, waveAt + i * 0.07, 0.5); S.ry += 24 * w; S.rx -= 6 * w; S.glow += 0.35 * w; S.hg += 0.5 * w; S.y -= 10 * w;
            const bu = (t - (waveAt + i * 0.07)) / 0.5; if (bu > 0 && bu < 1) { S.band = -1.7 + 3.4 * eio(bu); S.bandAmp = Math.max(S.bandAmp || 0, 0.7 * Math.sin(Math.PI * bu)); } }
          const tx = t - tOut(i);
          if (tx > 0) { const a = tx < 0.07 ? 1 + 0.07 * eo3(tx / 0.07) : 1.07 * (1 - backIn((tx - 0.07) / 0.22)); S.s *= Math.max(0, a); S.rx -= 80 * eio(tx / 0.29); S.shadow *= Math.max(0, a); S.hg = 0; S.hy = 0; }
          return S;
        }
        // the selector: a gold ring that rides from goal to goal with a stretch, and a caret that points down at the label
        function selState(t) {
          for (let k = 0; k < order.length; k++) {
            const i = order[k], a = activeFrom(i), d = done[i] == null ? Infinity : done[i];
            if (t >= a && t < d + 0.12) {
              // no travel: the ring irises out on the ticked goal and springs in on the next one (0.7 -> 1 with overshoot)
              const ta = t - a, x = CX(i);
              let alpha = clamp(ta / 0.05), sc = 0.7 + 0.3 * spring(ta, 2.8, 0.42);
              if (t > d - 0.1) { const u = clamp((t - (d - 0.1)) / 0.22); sc *= 1 - 0.12 * eio(u); alpha *= 1 - eio(u); }
              const tok = tokenState(i, t);
              return { x, y: CY, z: tok.z, s: sc * tok.s, a: alpha, glow: 0.5 + 0.5 * Math.sin(TAU * 1.4 * ta) };
            }
          }
          return null;
        }
        function rakeState(t) { return null; }   // light now crosses as a broad band in the ring/glass shaders (S.band)

        const FACES = ["900 100px Archivo", "800 100px Inter"];
        const imgs = G.map((g) => { const im = new Image(); im.src = g.img; return im; });
        Promise.all(FACES.map((f) => document.fonts.load(f))).then(() => document.fonts.ready)
          .then(() => Promise.all(imgs.map((im) => im.decode()))).then(() => {
          const GL = { left: Lay.cx - 450, top: CY - 190, W: 900, H: 380 };
          const T3 = Tokens3D({ left: GL.left, top: GL.top, W: GL.W, H: GL.H, dpr: 2, R, white: CONFIG.colors.ring, green: CONFIG.colors.done, coin: CONFIG.colors.coin, select: CONFIG.colors.active,
            tokens: G.map((g, i) => ({ img: imgs[i] })) });
          $("#gl").appendChild(T3.canvas);
          // fit every label line to the safe width, then park the strike on the cap-height middle
          document.querySelectorAll("#labS .lab").forEach((lab) => { const w = lab.offsetWidth; if (w > Lay.maxW) lab.style.fontSize = (96 * Lay.maxW / w).toFixed(1) + "px"; });
          lines.forEach((l) => { l.strike.style.top = (l.lab.offsetHeight / 2 - 4 + 3) + "px"; });

          const renderAt = (t) => {
            const sel = selState(t);
            T3.render({ tokens: G.map((g, i) => tokenState(i, t)), sel, rake: rakeState(t) });
            if (sel && sel.a > 0.004) { caret.style.opacity = Math.min(1, sel.a).toFixed(3); caret.style.transform = "translate(" + sel.x.toFixed(2) + "px," + (CY + R * 1.12 * sel.s + 12).toFixed(2) + "px) scale(" + (0.6 + 0.4 * Math.min(1, sel.s)).toFixed(3) + ")"; }
            else caret.style.opacity = "0";
          };

          const LH = 118, KH = 58;
          // kicker and label rise into their windows
          gsap.set(["#kickS", "#labS"], { yPercent: 0 });
          gsap.set("#kickS", { y: KH }); gsap.set("#labS", { y: LH });
          const tA = tIn(N - 1) + 0.18;
          tl.to("#kickS", { y: 0, duration: 0.42, ease: "expo.out" }, tA);
          tl.to("#labS", { y: 0, duration: 0.5, ease: "back.out(1.5)" }, tA + 0.05);
          // each tick: strike the current goal, then roll both strips to the next line
          lines.forEach((l, k) => {
            const d = done[l.i]; if (d == null) return;
            tl.fromTo(l.strike, { scaleX: 0 }, { scaleX: 1, duration: 0.26, ease: "expo.out", immediateRender: false }, d + 0.2);
            tl.fromTo(l.strike, { "--tip": 1 }, { "--tip": 0, duration: 0.3, ease: "power2.in", immediateRender: false }, d + 0.2);
            tl.to(l.txt, { color: "#DDF9E6", duration: 0.14, ease: "none" }, d + 0.24);
            tl.fromTo(l.lab, { scale: 1 }, { scale: 1.05, duration: 0.08, ease: "power2.out", immediateRender: false }, d + 0.2);
            tl.to(l.lab, { scale: 1, duration: 0.36, ease: "back.out(2.4)" }, d + 0.28);
            const at = d + STEP, fin = d === tLast && allDone;
            tl.to("#kickS", { y: -KH * (k + 1), duration: 0.42, ease: "back.out(1.4)" }, at);
            tl.to("#labS", { y: -LH * (k + 1), duration: fin ? 0.26 : 0.46, ease: fin ? "power3.in" : "back.out(1.35)" }, at);
          });
          if (allDone) {
            // the payoff title: real extruded, bevelled glyphs (title3d.js) slam in once the struck goal has rolled out, land as white
            // enamel, then a light front turns them to polished gold with a raking key, one specular sweep and a bloom on the letters
            const G0 = tLast + STEP + 0.26, TT = CONFIG.title3d, RW = 1000, RH = 280, nGL = CONFIG.doneTitle.length;
            const titles = CONFIG.doneTitle.map((w, k) => {
              const ig = G0 + 0.12 + k * 0.07;
              const P = Payoff3D({ W: RW, H: RH, glyphs: window.PAYOFF_GLYPHS, text: w, size: TT.size, tracking: -0.01, maxInk: TT.maxInk,
                cx: RW / 2, cy: RH / 2, depth: TT.depth, bevel: TT.bevel, tilt: TT.tilt, inkPx: 7, inkColor: "#07080B", shadow: 0.6, shadowOff: 12,
                colors: TT.colors, timing: { ignite: ig, frontDur: 0.22, specAt: ig + 0.1, specDur: 0.45, rakeDur: 0.6, holdEnd: T.out } });
              const wrap = document.createElement("div"); wrap.className = "t3";
              const cy = Lay.goldMid + (k - (nGL - 1) / 2) * TT.lineGap;
              wrap.style.cssText = "left:" + (Lay.cx - RW / 2) + "px;top:" + (cy - RH / 2).toFixed(1) + "px;width:" + RW + "px;height:" + RH + "px";
              wrap.appendChild(P.canvas); gold3d.appendChild(wrap);
              return { P, wrap };
            });
            tl.set(gold3d, { visibility: "visible" }, G0);
            titles.forEach((o, k) => {
              const at = G0 + k * 0.07;
              gsap.set(o.wrap, { scale: 1.45, visibility: "hidden", transformOrigin: "50% 55%" });
              tl.set(o.wrap, { visibility: "visible" }, at);
              tl.to(o.wrap, { scale: 1, duration: 0.7, ease: "elastic.out(1, 0.5)" }, at);
            });
            tl.fromTo(gglow, { opacity: 0 }, { opacity: 1, duration: 1 / 30, ease: "none", immediateRender: false }, G0 + 0.16);
            tl.to(gglow, { opacity: 0.3, duration: 0.7, ease: "power2.out" }, G0 + 0.16 + 4 / 30);
            const X0 = T.out - 0.1;
            titles.forEach((o, k) => {
              tl.fromTo(o.wrap, { clipPath: "inset(0px 0px 0px 0px)", y: 0 }, { clipPath: "inset(0px 0px 100% 0px)", y: -40, duration: 0.26, ease: "power3.in", immediateRender: false }, X0 + (nGL - 1 - k) * 0.04);
            });

            tl.set(gold3d, { visibility: "hidden" }, X0 + 0.34);
            Look.drive(tl, 0, T.end, (p) => titles.forEach((o) => o.P.renderAt(p * T.end)));
            titles.forEach((o) => o.P.renderAt(0));
            tl.fromTo(bloom, { opacity: 0 }, { opacity: 1, duration: 1 / 30, ease: "none", immediateRender: false }, tLock(tLast));
            tl.to(bloom, { opacity: 0, duration: 0.6, ease: "power2.out" }, tLock(tLast) + 4 / 30);
            if (plate) Look.impact(tl, tLock(tLast), { flash: 0, shake: "#shake", amp: 8, dur: 0.3, zoom: 1.012 });
          }
          // exit: both strips roll out upward, the tokens fold away
          const nk = lines.length + (allDone ? 1 : 0);
          tl.to("#kickS", { y: -KH * nk, duration: 0.3, ease: "power3.in" }, T.out - 0.04);
          if (!allDone) {
            tl.to("#labS", { y: -LH * lines.length, duration: 0.32, ease: "power3.in" }, T.out - 0.04);
          }
          tl.set(["#kick", "#labw"], { visibility: "hidden" }, T.out + 0.32);
          if (plate) Look.push(tl, "#push", 0, T.end, { to: 1.04 });
          Look.drive(tl, 0, T.end, (p) => renderAt(p * T.end));
          window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") renderAt(e.detail.time); });
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          renderAt(0);
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
