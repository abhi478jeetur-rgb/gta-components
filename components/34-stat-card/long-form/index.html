     The creators' purple glass stat panel in the top-left corner: a pink header pill on the top edge, the car's name and class,
     and four stat rows (icon, caps label, value, rounded bar). Ours is a real object: the card body is a thick edge-lit acrylic
     slab (Three.js rim, frosted DOM glass face pinned under it), the bars are liquid tubes, the class badge is a bevelled metal
     coin with extruded letters. Payoff: the upgrade locks in: gold surges solidify behind a light front, the coin flips B -> S
     with real thickness and turns gold, the card punches.
     Variable: bg "plate" (sample GTA V footage) / "none" (transparent overlay). -->

    <script>
      const CONFIG = {
        pill: "CAR STATS",
        name: "MY FIRST CAR",
        sub: ["SPORTS CLASS <b>·</b> STOCK", "SPORTS CLASS <b>·</b> <span class=\"gold\">FULLY UPGRADED</span>"],
        grade: ["B", "S"],                                   // class letters on the coin: before / after the upgrade
        stats: [                                             // value 0-100: stock, then upgraded
          { label: "TOP SPEED",    icon: "speed", base: 62, up: 92 },
          { label: "ACCELERATION", icon: "bolt",  base: 55, up: 96 },
          { label: "BRAKING",      icon: "brake", base: 48, up: 84 },
          { label: "HANDLING",     icon: "wheel", base: 58, up: 90 }

        card: { x: 96, y: 72, w: 640, h: 440, r: 30, bevel: 8, depth: 16, tiltY: 0.11, tiltX: 0.035 },
        colors: { base: "#3DE0C8", up: "#FFC23A" },

        const clamp = (x, a, b) => Math.min(b, Math.max(a, x)), lerp = (a, b, k) => a + (b - a) * k, cl01 = (x) => clamp(x, 0, 1);

          bolt:  '<svg viewBox="0 0 24 24"><path d="M13.8 1.8L4.6 13.6h6.3L9.4 22.2l10-12.6h-6.4l.8-7.8z" fill="#fff"/></svg>',
          brake: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-linecap="round"><circle cx="11" cy="13" r="8" stroke-width="2.5"/><circle cx="11" cy="13" r="2.4" fill="#fff" stroke="none"/><path d="M16.4 3.6a10 10 0 0 1 4.4 6.6" stroke-width="4.2"/></svg>',
          wheel: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="2.6"><circle cx="12" cy="12" r="8.7"/><circle cx="12" cy="12" r="2.3" fill="#fff" stroke="none"/><path d="M3.6 11h6.1M14.3 11h6.1M12 14.4v6.2"/></svg>'
        };

        const FACES = ["900 64px Archivo", "900 30px Inter", "800 21px Inter"];
        Promise.all(FACES.map((f) => document.fonts.load(f, "MYFIRSTCAR0123456789+ABCDEFGHIJKLMNOPQRSTUVWXYZ·"))).then(() => document.fonts.ready).then(() => {
          const S3 = Stat3D({ W: 1920, H: 1080, fov: 22 });
          $("#gl").appendChild(S3.canvas);
          document.querySelectorAll(".stage").forEach((s) => (s.style.perspective = S3.dist().toFixed(3) + "px"));
          const card = S3.card({ w: K.w, h: K.h, r: K.r, bevel: K.bevel, depth: K.depth });

          card.group.add(coin.group); coin.group.position.set(fx(COIN.x), fy(COIN.y), COIN.z);

          // ---------- DOM ----------
          const face = $("#face"); face.style.width = FW + "px"; face.style.height = FH + "px";
          const cont = $("#content"); cont.style.width = FW + "px"; cont.style.height = FH + "px";
          const el = (cls, html, css) => { const d = document.createElement("div"); d.className = cls; if (html != null) d.innerHTML = html; if (css) d.style.cssText = css; cont.appendChild(d); return d; };
          const pill = el("pill", C.pill, "left:26px;top:-27px");
          const nmWin = el("win", null, "left:26px;top:30px;height:74px;width:470px");
          const nm = document.createElement("div"); nm.className = "nm"; nmWin.appendChild(nm);
          const nmChars = C.name.split("").map((ch) => { const s = document.createElement("span"); s.textContent = ch === " " ? " " : ch; nm.appendChild(s); return s; });
          const subWin = el("win", null, "left:28px;top:104px;height:24px;width:480px");
          const subA = document.createElement("div"); subA.className = "sub"; subA.innerHTML = C.sub[0]; subWin.appendChild(subA);

          const divider = el("divider", null, "left:28px;top:146px;width:" + (FW - 56) + "px");
          const BW = FW - 56, R0 = 160, RP = 61;
          const rows = C.stats.map((s, i) => {
            const top = R0 + i * RP;
            const chip = el("chip", ICON[s.icon], "left:28px;top:" + (top - 4) + "px");
            const labWin = el("win", null, "left:72px;top:" + top + "px;height:26px;width:300px");
            const lab = document.createElement("div"); lab.className = "lab"; lab.textContent = s.label; labWin.appendChild(lab);
            const valWin = el("win", null, "left:" + (FW - 28 - 74) + "px;top:" + (top - 4) + "px;height:34px;width:74px");
            const val = document.createElement("div"); val.className = "val"; val.style.marginLeft = "4px"; valWin.appendChild(val);

            const track = document.createElement("div"); track.className = "track"; bar.appendChild(track);
            const ticks = document.createElement("div"); ticks.className = "ticks"; ticks.style.width = BW + "px"; track.appendChild(ticks);
            const delta = document.createElement("div"); delta.className = "delta"; bar.appendChild(delta);
            const stripes = document.createElement("div"); stripes.className = "stripes"; delta.appendChild(stripes);
            const front = document.createElement("div"); front.className = "front"; delta.appendChild(front);
            const base = document.createElement("div"); base.className = "base"; bar.appendChild(base);
            const gloss = document.createElement("div"); gloss.className = "gloss"; base.appendChild(gloss);
            const men = document.createElement("div"); men.className = "men"; bar.appendChild(men);
            return { s, top, chip, lab, val, dchip, bar, track, ticks, delta, stripes, front, base, men };
          });
          document.querySelectorAll("#ov *").forEach((n) => { n.setAttribute("data-layout-allow-overlap", ""); n.setAttribute("data-layout-allow-occlusion", ""); n.setAttribute("data-layout-allow-overflow", ""); });

          const coinGlow = $("#coinGlow"), coinShadow = $("#coinShadow"), sheen = $("#faceSheen"), glEl = $("#gl"), frontStage = $("#frontStage");
          coinGlow.style.cssText += ";width:300px;height:300px;background:radial-gradient(closest-side, rgba(255,226,120,.95), rgba(255,170,50,.45) 40%, rgba(255,120,40,0) 100%)";
          coinShadow.style.cssText += ";width:150px;height:150px;background:radial-gradient(closest-side, rgba(6,0,14,.75), rgba(6,0,14,.35) 55%, rgba(6,0,14,0) 100%)";

          // ---------- timeline state ----------
          const TL = T.lock, TU = T.upgrade, TI = T.in, TO = T.out;
          const fillT = (i) => TI + 0.40 + i * 0.07;          // base fill start per row
          const upT = (i) => TU + i * 0.06;                   // upgrade surge start per row
          const frontT = (i) => TL + 0.02 + i * 0.035;          // light front per row at the lock

          function frame(t) {
            // ---- card body: entrance swing, payoff punch, idle float, exit into the pill anchor ----
            const te = t - TI, kIn = spring(te, 12.5, 0.58), vis = te >= 0;
            let s = lerp(0.74, 1, kIn), ry = lerp(1.05, K.tiltY, kIn), rx = lerp(-0.22, K.tiltX, kIn), dx = lerp(-150, 0, kIn), dy = lerp(-40, 0, kIn), dz = 0;
            const tp = t - TL, punch = tp < 0 ? 0 : tp < 0.06 ? tp / 0.06 : Math.exp(-(tp - 0.06) * 7) * Math.cos((tp - 0.06) * 26);
            s *= 1 + 0.035 * punch; dz += 30 * Math.max(0, punch);
            ry += 0.018 * Math.sin(2 * Math.PI * t / 3.1) * cl01(te / 1.2); rx += 0.01 * Math.sin(2 * Math.PI * t / 2.6 + 1) * cl01(te / 1.2);
            dy += 3 * Math.sin(2 * Math.PI * t / 2.6) * cl01(te / 1.2);
            const xo = eP3i(seg(t, TO, 0.3));
            if (xo > 0) { s *= lerp(1, 0.04, xo); ry += 0.9 * xo; rx -= 0.25 * xo; }

            const ax = -K.w / 2 + 110, ay = K.h / 2;
            const g = card.group;

            g.position.set(cx0 + dx + ax * (1 - s), cy0 + dy + ay * (1 - s), dz);
            const show = vis && xo < 1;

            // ---- DOM layers pinned to the card ----

            const cxl = fx(COIN.x), cyl = fy(COIN.y);

            const gk = flash * 1.0 + 0.0;

            coinGlow.style.transform = "scale(" + (0.75 + 0.5 * gk).toFixed(3) + ")";
            coinGlow.style.opacity = (gk * 0.95).toFixed(3); coinGlow.style.visibility = show && gk > 0.01 ? "visible" : "hidden";
            const sp = seg(t, TL + 0.06, 0.62);
            sheen.style.transform = "translateX(" + lerp(-260, FW + 60, eIO(sp)).toFixed(1) + "px) skewX(-18deg)"; sheen.style.opacity = sp > 0 && sp < 1 ? 1 : 0;

            // ---- pill, name, sub ----

            pill.style.transform = "translateY(" + ((1 - kp) * -26).toFixed(2) + "px) scale(" + lerp(1.6, 1, kp).toFixed(3) + ")";
            pill.style.opacity = t >= TI + 0.16 ? 1 : 0; pill.style.transformOrigin = "30% 50%";
            nmChars.forEach((c, i) => { const p = eExpo(seg(t, TI + 0.22 + i * 0.022, 0.5)); c.style.transform = "translateY(" + ((1 - p) * 108).toFixed(1) + "%)"; });
            const ps = eExpo(seg(t, TI + 0.34, 0.45)), roll = eIO(seg(t, TL + 0.08, 0.24));
            subA.style.transform = "translateY(" + ((1 - ps) * 26 - roll * 24).toFixed(2) + "px)";
            subB.style.transform = "translateY(" + (-roll * 24).toFixed(2) + "px)";
            const pd = eP3o(seg(t, TI + 0.3, 0.5)); divider.style.transform = "scaleX(" + pd.toFixed(3) + ")"; divider.style.transformOrigin = "0 50%";

            // ---- rows ----
            rows.forEach((r, i) => {
              const s0 = r.s.base / 100, s1 = r.s.up / 100;
              const tin = TI + 0.30 + i * 0.07;
              const kc = spring(t - tin, 16, 0.45); r.chip.style.transform = "scale(" + Math.max(0, kc).toFixed(3) + ") rotate(" + ((1 - kc) * -40).toFixed(1) + "deg)";
              r.chip.style.opacity = t >= tin ? 1 : 0;
              const pl = eExpo(seg(t, tin + 0.04, 0.5)); r.lab.style.transform = "translateY(" + ((1 - pl) * 110).toFixed(1) + "%)";
              const pw = eExpo(seg(t, tin + 0.02, 0.4)); r.track.style.width = (pw * BW).toFixed(2) + "px";
              r.track.style.visibility = pw > 0.002 ? "visible" : "hidden";
              // base fill (teal) and the upgrade surge (gold, under the teal): width-driven pills with a box-shadow bloom
              const pf = seg(t, fillT(i), 0.62), fb = s0 * eExpo(pf);
              const tu = t - upT(i), ku = tu <= 0 ? 0 : spring(tu, 11, 0.62);   // surge with a little overshoot (slosh)
              const fu = s0 + (s1 - s0) * ku;
              r.base.style.width = (fb * BW).toFixed(2) + "px"; r.base.style.visibility = fb > 0.002 ? "visible" : "hidden";
              const wd = Math.max(fb, fu) * BW;
              r.delta.style.width = wd.toFixed(2) + "px"; r.delta.style.visibility = tu > 0 ? "visible" : "hidden";
              const fl = pulse(t, frontT(i) + 0.12, 3 / 30, 0.35);
              r.base.style.boxShadow = "inset 0 -3px 4px rgba(0,60,60,.35), 0 0 10px rgba(61,224,200,.55), 0 0 22px rgba(61,224,200,.25)";
              r.delta.style.boxShadow = "inset 0 -3px 4px rgba(120,50,0,.35), 0 0 " + (10 + 10 * fl).toFixed(1) + "px rgba(255,190,60," + (0.55 + 0.4 * fl).toFixed(2) + "), 0 0 " + (22 + 16 * fl).toFixed(1) + "px rgba(255,170,40," + (0.22 + 0.3 * fl).toFixed(2) + ")";
              // stripes = preview state; the light front sweeps them away at the lock
              const pfr = seg(t, frontT(i), 0.30), fxp = lerp(-0.12, s1 + 0.04, eIO(pfr)) * BW;
              const sl = pfr > 0 ? Math.max(0, fxp) : 0;
              r.stripes.style.left = sl.toFixed(1) + "px"; r.stripes.style.backgroundPosition = (t * 46 - sl).toFixed(1) + "px 0";
              r.stripes.style.opacity = pfr >= 1 ? 0 : 1;
              r.front.style.left = (fxp - 52).toFixed(1) + "px"; r.front.style.opacity = pfr > 0 && pfr < 1 ? 1 : 0;
              // the hot meniscus rides the leading edge while liquid moves
              const vb = pf > 0 && pf < 1 ? (1 - pf) : 0, vu = tu > 0 && tu < 0.7 ? Math.exp(-tu * 3.2) : 0;
              const lead = tu > 0 ? Math.max(fb, fu) : fb, mk = clamp(Math.max(vb * 1.6, vu * 1.4), 0, 1);
              r.men.style.left = (lead * BW - 4).toFixed(1) + "px"; r.men.style.opacity = (0.15 + 0.85 * mk).toFixed(3);
              r.men.style.visibility = lead > 0.004 ? "visible" : "hidden";
              // value: counts the fill; gold from the lock
              const v = tu > 0 ? Math.round(r.s.base + (r.s.up - r.s.base) * eP3o(seg(t, upT(i), 0.5))) : Math.round(100 * fb);
              r.val.textContent = String(clamp(v, 0, 100));
              r.val.style.color = mixHex("#FFFFFF", "#FFD23C", cl01((t - frontT(i) - 0.1) / 0.12));
              const pv = eExpo(seg(t, tin + 0.06, 0.45)); r.val.style.transform = "translateY(" + ((1 - pv) * 110).toFixed(1) + "%)";
              const vp = pulse(t, frontT(i) + 0.12, 2 / 30, 0.25); r.val.style.transform += " scale(" + (1 + 0.16 * vp).toFixed(3) + ")";
              r.val.style.transformOrigin = "100% 70%";
              // +delta chip pops during the surge
              const kd = spring(t - (upT(i) + 0.16), 17, 0.48);
              r.dchip.style.opacity = t >= upT(i) + 0.16 ? 1 : 0;
              r.dchip.style.transform = "scale(" + Math.max(0, kd).toFixed(3) + ")";
            });
            S3.render();
          }

          const tl = gsap.timeline({ paused: true });
          Look.drive(tl, 0, T.end, (p) => frame(p * T.end));
          if (plate) {
            Look.push(tl, "#push", 0, T.end, { from: 1.0, to: 1.05 });
            Look.impact(tl, T.lock, { shake: "#shake", amp: 7, dur: 0.3, flash: 0, zoom: 1.015 });
          }
          window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") frame(e.detail.time); });
          frame(0);
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
