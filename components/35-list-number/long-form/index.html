<!-- GTA-niche 35 List number, variant A: "Number card" (16:9 long-form, 1920x1080, 30 fps, 6.0 s).
     The big number that opens an entry of a top-10 video. A giant "#5" (real Three.js geometry: extruded, bevelled Archivo
     outlines) slams in on the right as white enamel showing the previous entry's 6, the counter drum rolls 6 -> 5 and locks,
     and the lock floods it into pink-violet candy metal behind a hot light front, with a raking key and a neon bloom. The
     entry title card builds on the left (pill, two-line title, subline, top-10 progress). After the read the title folds
     away and the number flies into the top-left corner, where it stays as the small persistent entry number over gameplay.
     See ../DECISIONS.md. Variable: bg "plate" (sample GTA V footage) / "none" (transparent overlay). -->

    <script>
      const CONFIG = {

        number: { from: 6, to: 5, prefix: "#" },
        pill: "NUMBER 5",
        title: ["fly over", "los santos"],      // two lines; the line index in `accent` is set in the accent gradient
        accent: 1,
        sub: "Take a chopper up at golden hour",
        progress: { total: 10, done: 5 },         // a top-10 countdown at #5: five entries done, this one lit
        // giant number: cap height (px), right ink edge, vertical centre; the '#' is a superscript at hashScale of the number
        type: { set: "wide", cap: 470, right: 1730, cy: 520, hashScale: 0.46, gap: 0.05, depth: 0.3, bevel: 0.07, tilt: 0.2 },
        card: { left: 150 },
        // where the number docks: its ink box's top-left corner and its docked cap height
        dock: { x: 66, y: 56, cap: 86, at: 3.0, dur: 0.42 },
        colors: {
          white: { face: ["#FFFFFF", "#D6D0E4"], side: ["#9790AE", "#201B2E"] },     // white enamel, lilac steel walls
          state: { face: ["#FFA6F0", "#FF46D6", "#B314C4", "#FF7AE4", "#7A2BFF"], facePos: [0, 0.4, 0.5, 0.56, 1], lip: "#FF9AEB", side: ["#8A1ED8", "#1A0236"], hot: "#FFE3FA" },
          glow: "255,79,216", shadow: "#0C0016"
        },
        timing: { in: 0.22, inDur: 0.22, tick: 0.64, rollDur: 0.3, out: 2.92, end: 6.0 }
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const $ = (s) => document.querySelector(s);
        const C = CONFIG, TY = C.type, TM = C.timing, DK = C.dock, FR = 1 / 30;
        const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
        const lerp = (a, b, k) => a + (b - a) * k;
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));
        // ---------- DOM content ----------
        $("#pillTxt").textContent = C.pill;
        $("#ti1").textContent = C.title[0]; $("#ti2").textContent = C.title[1];
        $("#si").textContent = C.sub;
        const dotsEl = $("#dots"), dots = [];
        for (let i = 0; i < C.progress.total; i++) {
          const d = document.createElement("div"); d.className = "dot" + (i < C.progress.done ? "" : i === C.progress.done ? " c" : " f");
          dotsEl.appendChild(d); dots.push(d);
        }
        const FACES = ["900 100px Archivo", "900 100px Inter", "800 100px Inter", "italic 600 100px Inter"];
        Promise.all(FACES.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
          const F = window.CARD_GLYPHS[TY.set];
          // ---------- number geometry: the numeral (a drum, '%') and the superscript '#', top-aligned ----------
          const size = TY.cap * F.upm / F.cap, hsize = size * TY.hashScale;
          const mN = Num3D.measure(F, "%", size, 0), mH = Num3D.measure(F, C.number.prefix, hsize, 0);
          const capN = mN.cap, capH = mH.cap;
          const nCX = TY.right - mN.inkW / 2, nCY = TY.cy;
          const hCX = nCX - mN.inkW / 2 - TY.gap * capN - mH.inkW / 2, hCY = nCY - capN / 2 + capH / 2;
          const blockL = hCX - mH.inkW / 2, blockT = nCY - capN / 2;
          const SD = DK.cap / capN;                                   // docked scale
          const eBack = gsap.parseEase("back.out(1.5)"), eRoll = gsap.parseEase("back.out(1.6)"), eExpo = gsap.parseEase("expo.out"),
            eSine = gsap.parseEase("sine.inOut"), eRec = gsap.parseEase("back.out(2.5)"), eP3io = gsap.parseEase("power3.inOut"),
            eP2i = gsap.parseEase("power2.in"), eP2io = gsap.parseEase("power2.inOut"), eFly = gsap.parseEase("power4.inOut"), eP2o = gsap.parseEase("power2.out");
          // ---------- the drum: a 2-frame wind-back, then a roll with overshoot; the lock is the first frame it reaches the digit ----------
          const WB = 0.07, span = C.number.to - C.number.from, dir = Math.sign(span) || 1;
          function drumIdx(t) {
            const a = TM.tick - 2 * FR;
            if (t < a) return C.number.from;
            if (t < TM.tick) return C.number.from - dir * WB * Math.sin((Math.PI / 2) * (t - a) / (2 * FR));
            const p = clamp((t - TM.tick) / TM.rollDur, 0, 1);
            return C.number.from - dir * WB + (span + dir * WB) * eRoll(p);
          }
          let ignite = TM.tick;
          for (let t = TM.tick; t < TM.tick + TM.rollDur; t += 0.002) { if ((drumIdx(t) - C.number.to) * dir >= -0.002) { ignite = t; break; } }
          const H = (n) => Look.hash(n) * 2 - 1;
          const landN = TM.in + TM.inDur, inH = TM.in + 0.07, landH = inH + TM.inDur;
          // ---------- the dock: anticipation swell, a fast arcing throw to the corner with a turn, a squash on landing ----------
          const flyA = DK.at + 0.08, flyB = flyA + DK.dur;
          function rig(t) {
            let S = 1, ax = blockL, ay = blockT, ry = 0, rz = 0, sq = 0;
            if (t >= DK.at && t < flyA) { const u = (t - DK.at) / (flyA - DK.at); S = 1 + 0.035 * Math.sin(u * Math.PI / 2); }

          }
          const lineAt = (R, cx, cy) => ({ x: R.ax + (cx - blockL) * R.S - cx, y: R.ay + (cy - blockT) * R.S - cy });
          function slam(t, tf, t0, seed) {

            const w = (t - t0 - TM.inDur) / 0.18;
            if (w < 1) { const s = 0.075 * Math.cos(w * Math.PI * 1.5) * Math.exp(-3.2 * w); return { sy: 1 - s, sx: 1 + s * 0.45 }; }
            return {};
          }
          const N3 = Num3D({
            W: 1920, H: 1080, glyphs: window.CARD_GLYPHS, fov: 20, px: nCX, py: nCY,
            lines: [
              { id: "n", set: TY.set, text: "%", size, tracking: 0, cx: nCX, cy: nCY, depth: TY.depth, bevel: TY.bevel, tilt: TY.tilt, drumR: 2.15, winTop: 0.05, winBot: 0.06, winFeather: 0.08 },
              { id: "h", set: TY.set, text: C.number.prefix, size: hsize, tracking: 0, cx: hCX, cy: hCY, depth: TY.depth * capN / capH, bevel: 0.06, tilt: TY.tilt, state: true }
            ],
            colors: { white: C.colors.white, state: C.colors.state, material: { faceMetal: 0.3, faceRough: 0.28, clearcoat: 0.6, faceEnv: 0.38, sideMetal: 1.0 }, faceEmissive: 0.8, preEmissive: 0.5, tint: 0.85 },
            shadow: 0.62, shadowOff: [8, 12], wideShadow: 0.36, shadowColor: C.colors.shadow,
            shutter: (t) => (t > TM.in - 0.04 && t < landH + 0.1 ? 1 / 90 : t > TM.tick - 0.1 && t < TM.tick + TM.rollDur ? 1 / 120 : t > flyA && t < flyB + 0.05 ? 1 / 110 : 0),
            subframes: (t) => (t > flyA && t < flyB + 0.05 ? 24 : t > TM.tick - 0.1 && t < TM.tick + TM.rollDur ? 16 : 14),
            pose: (t, tf) => {
              const P = { lines: {}, glyphs: {}, drums: {}, state: {}, drumMin: { n: [Math.min(C.number.from, C.number.to)] }, drumMax: { n: [Math.max(C.number.from, C.number.to)] } };
              const u = t - ignite, R = rig(t);
              // whole number: a punch on the lock, a slow living turn through the hold, then the dock rig
              let s = 1;
              if (u >= 0 && u < 0.07) s = 1 + 0.05 * eExpo(u / 0.07);
              else if (u >= 0.07 && u < 0.34) s = 1 + 0.05 * (1 - eBack((u - 0.07) / 0.27));
              const rc = u >= 0 && u < 0.2 ? 8 * (1 - eRec(u / 0.2)) : 0;
              const hold = clamp((t - landN) / (DK.at - landN), 0, 1);
              const live = t < flyA ? 1 : 0;
              const ryL = (-0.07 + 0.12 * eSine(hold)) * live;
              const pn = lineAt(R, nCX, nCY), ph = lineAt(R, hCX, hCY);
              const sqx = 1 + R.sq * 0.5, sqy = 1 - R.sq;
              P.lines.n = { x: pn.x, y: pn.y + rc, s: s * R.S, sx: sqx, sy: sqy, ry: ryL + R.ry, rz: R.rz, rx: 0.015 * Math.sin(hold * Math.PI) };
              P.lines.h = { x: ph.x, y: ph.y + rc * 0.6, s: s * R.S, sx: sqx, sy: sqy, ry: ryL + R.ry, rz: R.rz, rx: 0.015 * Math.sin(hold * Math.PI) };
              P.glyphs.n = () => slam(t, tf, TM.in, 11);
              P.glyphs.h = () => slam(t, tf, inH, 29);
              P.drums.n = [drumIdx(t)];
              // the state change: a feathered front floods the number into pink-violet candy metal, led by a hot band
              if (t >= ignite) P.state.n = { p: eExpo(clamp(u / 0.24, 0, 1)), hot: 3.0 * (1 - eP2i(clamp(u / 0.36, 0, 1))) };
              if (t >= ignite + 0.05) { const v = u - 0.05; P.state.h = { p: eExpo(clamp(v / 0.2, 0, 1)), hot: 2.6 * (1 - eP2i(clamp(v / 0.3, 0, 1))) }; }

              const rk = eP2io(clamp((t - (ignite - 0.05)) / 0.75, 0, 1));
              const kd = eSine(clamp((t - (ignite + 0.7)) / (DK.at - ignite - 0.7), 0, 1));
              const kl = eP2io(clamp((t - flyB + 0.1) / 0.6, 0, 1));
              P.keyAngle = -0.95 + 1.75 * rk - 1.1 * kd + 1.2 * kl;
              P.key = 2.3 + 3.2 * Math.exp(-Math.pow((u - 0.14) / 0.16, 2)) + 1.6 * Math.exp(-Math.pow((t - flyB - 0.08) / 0.14, 2));

              const half = mN.inkW / 2;
              const sp = clamp((t - (ignite + 0.03)) / 0.4, 0, 1);
              const sd = clamp((t - (ignite + 0.75)) / (DK.at - ignite - 0.75), 0, 1);
              const sg = clamp((t - (flyB + 0.02)) / 0.45, 0, 1);
              if (sp > 0 && sp < 1) { const a = -half - 0.5 * capN, b = half + 0.5 * capN; P.specX = a + (b - a) * eP3io(sp); P.specAmp = 0.9 * Math.pow(Math.sin(Math.PI * Math.min(1, sp * 1.2)), 0.6); P.specW = 0.4; }
              else if (sd > 0 && sd < 1) { const a = -half - 1.2 * capN, b = half + 1.2 * capN; P.specX = a + (b - a) * sd; P.specAmp = 0.22 * Math.sin(Math.PI * sd); P.specW = 1.2; }
              else if (sg > 0 && sg < 1) { const a = -half - 0.6 * capN, b = half + 0.6 * capN; P.specX = a + (b - a) * eP2io(sg); P.specAmp = 0.8 * Math.sin(Math.PI * sg); P.specW = 0.5; }
              // bloom: a 3-frame peak on the lock, then a neon glow that settles; less when docked

              return P;
            }
          });
          $("#t3d").appendChild(N3.canvas);
          // ---------- the title card (DOM): placed against the number's vertical centre ----------
          const card = $("#card");
          card.style.left = C.card.left + "px";
          card.style.top = Math.round(nCY - card.offsetHeight / 2) + "px";
          const acc = C.accent === 0 ? $("#ti1") : $("#ti2");
          Look.fill(acc, "linear-gradient(180deg, #FFB0F2 0%, #FF5FDC 46%, #E33FE0 70%, #B34BFF 100%)");
          // plate-only light: a local shade behind the title, a pink bounce behind the number on the lock
          $("#shade").style.background = "radial-gradient(ellipse 820px 470px at " + (C.card.left + 300) + "px " + nCY + "px, rgba(10,0,24,.5) 0%, rgba(10,0,24,.3) 50%, rgba(10,0,24,0) 100%)";
          const bnc = $("#bounce");
          bnc.style.cssText += ";left:" + (nCX - 160 - 560) + "px;top:" + (nCY - 420) + "px;width:1120px;height:840px;background:radial-gradient(closest-side, rgba(" + C.colors.glow + ",.5) 0%, rgba(" + C.colors.glow + ",.2) 45%, rgba(" + C.colors.glow + ",0) 100%)";
          document.querySelectorAll("#root *").forEach((n) => { n.setAttribute("data-layout-allow-overlap", ""); n.setAttribute("data-layout-allow-occlusion", ""); });

          const tl = gsap.timeline({ paused: true });
          Look.drive(tl, 0, TM.end, (p) => N3.renderAt(p * TM.end));
          // ---------- title card build: pill springs open, lines rise out of their windows, the progress lights ----------
          const c0 = ignite + 0.02;
          gsap.set("#pill", { scaleX: 0 }); gsap.set("#pillTxt", { xPercent: -40, opacity: 0 });
          tl.fromTo("#pill", { scaleX: 0 }, { scaleX: 1, duration: 0.36, ease: "back.out(1.7)", immediateRender: false }, c0);
          tl.fromTo("#pillTxt", { xPercent: -40, opacity: 0 }, { xPercent: 0, opacity: 1, duration: 0.3, ease: "expo.out", immediateRender: false }, c0 + 0.08);
          tl.fromTo("#pillSheen", { x: 0 }, { x: 420, duration: 0.5, ease: "power2.inOut", immediateRender: false }, c0 + 0.3);
          const rise = [["#ti1", c0 + 0.07], ["#ti2", c0 + 0.15], ["#si", c0 + 0.3]];

          // ---------- title card exit: lines drop back up out of their windows, the pill folds into its left edge ----------

          });
          dots.slice().reverse().forEach((d, i) => tl.fromTo(d, { scaleX: 1 }, { scaleX: 0, duration: 0.14, ease: "power3.in", immediateRender: false }, O + i * 0.012));
          tl.fromTo("#pillTxt", { xPercent: 0 }, { xPercent: -60, duration: 0.18, ease: "power3.in", immediateRender: false }, O + 0.06);
          tl.fromTo("#pill", { scaleX: 1 }, { scaleX: 0, duration: 0.22, ease: "power3.in", immediateRender: false }, O + 0.1);
          tl.set("#card", { visibility: "hidden" }, O + 0.34);
          // ---------- plate: the footage takes the lock; local shade and bounce ----------
          if (plate) {
            Look.push(tl, "#push", 0, TM.end, { to: 1.05 });
            Look.drive(tl, 0, TM.end, (p) => {
              const t = p * TM.end;
              const k = eP2o(clamp((t - TM.in) / 0.3, 0, 1)) * (1 - eP2i(clamp((t - O) / 0.4, 0, 1)));
              $("#shade").style.opacity = k.toFixed(3);
            });
            Look.drive(tl, ignite, 2.4, (p) => {
              const u = p * 2.4; let k = 0;
              if (p > 0 && p < 1) k = u < 2 * FR ? u / (2 * FR) : u < 5 * FR ? 1 : 0.3 + 0.7 * Math.exp(-(u - 5 * FR) / 0.22);
              const off = 1 - eP2i(clamp((ignite + u - DK.at) / 0.3, 0, 1));
              bnc.style.opacity = (0.85 * k * off).toFixed(3);
            });
            Look.expose(tl, ignite, { target: "#push", peak: 1.16, hold: 3 / 30, dur: 0.35, saturate: 1.1 });
            Look.impact(tl, ignite, { shake: "#shake", amp: 7, dur: 0.3, zoom: 1.016, flash: 0 });
            Look.impact(tl, landN - 0.02, { shake: "#shake", amp: 5, dur: 0.22, zoom: 1.01, flash: 0 });
            Look.impact(tl, flyB, { shake: "#shake", amp: 3, dur: 0.18, zoom: 1.004, flash: 0 });
          }
          N3.renderAt(0);
          tl.set({}, {}, TM.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
