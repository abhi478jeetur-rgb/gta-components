<!doctype html>
<!-- 38 Spin wheel, variant B (9:16, 1080x1920): the challenge-video picker wheel as a real 3D prize wheel.
     It enters, winds up, spins (physics: friction + pegs + sprung ticker), slows tick by tick, lands on the winner,
     pops the winning wedge out and pops the result plaque out of the hub, down in front of the wheel. Variable: bg "plate" / "none". See gta/DESIGN.md. -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="media/spinsim.js"></script>
    <script src="media/wheel3d.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ov { position: absolute; inset: 0; }
      #wheel { position: absolute; inset: 0; opacity: 0; }
      /* hidden measuring text so the fonts the canvases use are loaded and pass the lint */
      #fontprobe { position: absolute; left: -9999px; top: 0; font: 900 40px "Archivo"; font-stretch: 75%; opacity: 0; }
      #fontprobe span { font: 800 20px "Inter"; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.0" data-width="1080" data-height="1920">
      <div id="shake"><div id="push">
        <video id="shotA" class="clip shot" src="assets/shots/v35-penthouse-dusk-v.mp4" muted playsinline data-start="0" data-duration="6.4" data-media-start="2.2" data-track-index="0"></video>
        <video id="shotB" class="clip shot" src="assets/shots/v07-biplane-sunset-v.mp4" muted playsinline data-start="6.4" data-duration="0.6" data-media-start="0.3" data-track-index="0"></video>
      </div></div>
      <div id="ov" class="clip" data-start="0" data-duration="7.0" data-track-index="1">
        <div id="wheel"></div>
        <div id="fontprobe" aria-hidden="true">FLY A BIPLANE <span>YOUR CHALLENGE</span></div>
      </div>
    </div>
    <script>
      const CONFIG = {
        // the wedges, clockwise from the pointer side; ink:true prints dark labels on light colours
        wedges: [
          { label: "5 STARS", color: "#FF2E3A" },
          { label: "NO GUNS", color: "#22C7F0", ink: true },
          { label: "BIPLANE", color: "#FF8A1F" },
          { label: "SKYDIVE", color: "#8B4DFF" },
          { label: "BMX ONLY", color: "#FFD23C", ink: true },
          { label: "YACHT", color: "#2F62FF" }
        ],
        winner: 2,            // index into wedges: where the wheel lands
        land: 0.34,           // how far past the last peg it stops (0..1 of the wedge)
        turns: 3,             // minimum full turns
        kicker: "YOUR CHALLENGE",
        result: "FLY A BIPLANE",
        wheel: { x: 504, y: 830 },           // centre, canvas px
        card: { x: 504, y: 1335, w: 800, h: 210 },
        pointerAngle: -90,                   // 12 o'clock (the right edge belongs to the platform buttons)
        timing: { in: 0.1, wind: 0.72, launch: 0.95, exit: 5.97, cut: 6.4, end: 7.0 }   // lock = launch + the physics settle time
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const $ = (s) => document.querySelector(s);
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));
        const FACES = ["900 100px Archivo", "800 100px Inter", "900 100px Inter"];
        Promise.all(FACES.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
          const W = 1080, H = 1920, N = CONFIG.wedges.length, D = 360 / N;
          const GEO = { Rhub: 66, Rw: 360, gap: 11, divW: 9, rPeg: 368, pegR: 10, ringIn: 384, ringOut: 424, bulbR: 10.5, nBulbs: 24, bulbPhase: 7.5,
            pivotR: 466, headR: 40, L: 108, labelSize: 60, labelPad: 36 };
          const win = CONFIG.wedges[CONFIG.winner];
          const wheel = Wheel3D({ host: $("#wheel"), W, H, dpr: 1.5, geo: GEO, wedges: CONFIG.wedges, pointerAngle: CONFIG.pointerAngle,
            exposure: 1.0, emis: 0.17,
            card: { w: CONFIG.card.w, h: CONFIG.card.h, r: 34, color: win.color, kicker: CONFIG.kicker, result: CONFIG.result,
              fw: 16, kickY: 68, kickSize: 28, resY: 174, resSize: 116, padX: 52, kickColor: "#FFF2DA" } });

          // ---------- physics ----------
          const PTR = CONFIG.pointerAngle, WIND = 14, DRIFT = 20;
          const thStart = PTR + 0.66 * D - D / 2;
          const SIMO = { n: N, rPeg: GEO.rPeg, e: 14, dMax: 46, flapHz: 7, flapZeta: 0.22, G: 12, mu: 80, drag: 1.0,
            pegOffset: D / 2, pointer: PTR, theta0: thStart - WIND, pushDur: 0.06, tMax: 6, w0lo: 100, w0hi: 5000 };
          let target = PTR - (CONFIG.winner * D + D / 2 - CONFIG.land * D);
          while (target < SIMO.theta0 + 360 * CONFIG.turns) target += 360;
          SIMO.target = target;
          const sim = SpinSim.simulate(SIMO);
          let tSettle = sim.tStop;
          for (let t = 0; t < sim.tStop; t += 1 / 240) if (Math.abs(sim.thetaStop - sim.at(t).theta) < 0.12) { tSettle = t; break; }

          const TM = CONFIG.timing, T = {};
          T.in = TM.in; T.wind = TM.wind; T.launch = TM.launch;
          T.lock = T.launch + tSettle;
          T.card = T.lock + 0.22; T.cardDur = 0.5;
          T.exit = TM.exit; T.cut = TM.cut; T.end = TM.end;
          T.colDur = 0.3; T.collapse = T.cut - T.colDur;

          const E = (n) => gsap.parseEase(n);
          const cl = (x) => Math.max(0, Math.min(1, x));
          const lerp = (a, b, p) => a + (b - a) * p;
          const eBack = E("back.out(1.7)"), eExpo = E("expo.out"), eP2io = E("power2.inOut"), eP3in = E("power3.in"), eP3o = E("power3.out"), eCard = E("back.out(1.15)"), eLift = E("back.out(2.2)");

          function thetaAt(t) {
            let th;
            if (t <= T.in) th = thStart - DRIFT;
            else if (t < T.wind) th = thStart - DRIFT + DRIFT * eExpo(cl((t - T.in) / (T.wind - T.in)));
            else if (t < T.launch) th = thStart - WIND * eP2io(cl((t - T.wind) / (T.launch - T.wind)));
            else th = sim.at(t - T.launch).theta;
            if (t > T.collapse) th += 150 * eP3in(cl((t - T.collapse) / T.colDur));
            return th;
          }
          function rigAt(t) {
            const u = cl((t - T.in) / 0.5), ue = eBack(u);
            let s = t < T.in ? 0 : 0.35 + 0.65 * ue;
            const rx = lerp(26, 3, eP3o(cl((t - T.in) / 0.6))), ry = lerp(-20, 0, eP3o(cl((t - T.in) / 0.6)));
            const ul = t - T.lock; if (ul > 0 && ul < 0.26) s *= 1 + 0.022 * Math.sin(Math.PI * ul / 0.26);
            if (t > T.collapse) s *= 1 - eP3in(cl((t - T.collapse) / (T.colDur - 1 / 30)));
            if (t >= T.cut) s = 0;
            return { x: CONFIG.wheel.x, y: CONFIG.wheel.y, s, rx, ry };
          }
          const SH = 0.5 / 30;
          function bulbsAt(t, th) {
            const n = GEO.nBulbs, out = [];
            for (let i = 0; i < n; i++) {
              const on = cl((t - (T.in + 0.14 + 0.36 * i / n)) / 0.05);
              let v;
              if (t < T.lock) {
                const ph = th / 360 * 1.2 + t * 0.35, x = ((i / n * 3 - ph) % 1 + 1) % 1;
                v = 0.3 + 0.7 * Math.pow(0.5 + 0.5 * Math.cos(2 * Math.PI * x), 6);
              } else {
                const u = t - T.lock;
                if (u < 0.13) v = 1; else if (u < 0.2) v = 0.3; else if (u < 0.33) v = 1;
                else { const x = ((i / n * 2 - (u - 0.33) * 0.7) % 1 + 1) % 1; v = lerp(1, 0.6 + 0.4 * Math.pow(0.5 + 0.5 * Math.cos(2 * Math.PI * x), 4), cl((u - 0.33) / 0.3)); }
              }
              out.push(on * v);
            }
            return out;
          }
          function wedgesAt(t) {
            const u = t - T.lock, out = [];
            for (let i = 0; i < N; i++) {
              if (u < 0) { out.push({}); continue; }
              if (i === CONFIG.winner) {
                const lp = eLift(cl(u / 0.32));
                let hot = u < 1 / 30 ? 30 * u * 0.62 : (u < 4 / 30 ? 0.62 : lerp(0.62, 0.22, eP3o(cl((u - 4 / 30) / 0.5))));
                const sp = cl((u - 0.06) / 0.55);
                out.push({ lift: 18 * lp, grow: 0.03 * lp, hot, spec: sp, specAmp: 0.55 });
              } else out.push({ dim: 0.55 * eP3o(cl((u - 0.04) / 0.3)) });
            }
            return out;
          }
          function cardAt(t) {
            const C = CONFIG.card;
            if (t < T.card || t >= T.cut) return { vis: false };
            // pops out of the hub, flies down in front of the wheel, lands with a squash
            const u = cl((t - T.card) / 0.42), ex = cl((t - T.exit) / 0.22);
            const pe = eP3o(u), se = E("back.out(1.8)")(u);
            let y = lerp(CONFIG.wheel.y, C.y, pe), s = lerp(0.3, 1, se), z = lerp(150, 80, pe);
            const land = t - T.card - 0.42;
            const sq = land > 0 && land < 0.24 ? Math.sin(Math.PI * land / 0.24) * Math.exp(-land / 0.12) : 0;
            const rx = lerp(-34, 0, E("back.out(2.2)")(cl((t - T.card - 0.04) / 0.5)));
            y = lerp(y, CONFIG.wheel.y, eP3in(ex)); s = lerp(s, 0.12, eP3in(ex)); z = lerp(z, 150, eP3in(ex));
            const kick = eExpo(cl((t - T.card - 0.12) / 0.34)), res = eExpo(cl((t - T.card - 0.18) / 0.38));
            const spec = cl((t - T.card - 0.62) / 0.6);
            return { vis: ex < 1, x: C.x, y, z, s, sx: 1 + 0.06 * sq, sy: 1 - 0.08 * sq, rx, kick, res, spec, hot: 0.12 * Math.sin(Math.PI * spec) };
          }
          function renderAt(t) {
            const rg = rigAt(t);
            const ta = thetaAt(t - SH / 2), tb = thetaAt(t + SH / 2);
            const travel = Math.abs(tb - ta) * Math.PI / 180 * GEO.Rw * rg.s;
            const K = Math.max(1, Math.min(56, Math.ceil(travel / 4)));
            const thetas = []; for (let k = 0; k < K; k++) thetas.push(thetaAt(t - SH / 2 + SH * (k + 0.5) / K));
            if (K === 1) thetas[0] = thetaAt(t);
            let d = t < T.launch ? 0 : sim.at(t - T.launch).d;
            if (t > T.collapse) d *= 1 - cl((t - T.collapse) / 0.12);
            const ul = t - T.lock;
            wheel.render({ rig: rg, thetas, d, wedges: wedgesAt(t), bulbs: bulbsAt(t, thetaAt(t)),
              ptrHot: ul > 0 ? 0.9 * Math.exp(-ul / 0.25) : 0, card: cardAt(t) });
            const host = $("#wheel");
            host.style.opacity = t < T.in ? 0 : 1;
            const bl = 8 * (1 - eP3o(cl((t - T.in) / 0.2)));
            host.style.filter = t > T.in && bl > 0.05 ? "blur(" + bl.toFixed(2) + "px)" : "";
            // the bed: blurred + graded while the wheel is up (lesson 17: contrast >= 1.1, brightness <= .7, saturate >= .4)
            if (plate) {
              const k = t < T.cut ? eP2io(cl((t - T.in) / 0.38)) : 0;
              $("#shotA").style.filter = k > 0.001 ? "blur(" + (10 * k).toFixed(2) + "px) brightness(" + (1 - 0.3 * k).toFixed(3) + ") contrast(" + (1 + 0.15 * k).toFixed(3) + ") saturate(" + (1 - 0.35 * k).toFixed(3) + ")" : "";
              $("#shotA").style.transform = "scale(" + (1 + 0.05 * k).toFixed(4) + ")";
            }
          }

          const tl = gsap.timeline({ paused: true });
          Look.drive(tl, 0, T.end, (p) => renderAt(p * T.end));
          window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") renderAt(e.detail.time); });
          if (plate) {
            Look.impact(tl, T.cut, { shake: "#shake", amp: 7, dur: 0.3, flash: 0, zoom: 1.025 });
            Look.expose(tl, T.cut, { target: "#push", peak: 1.12, hold: 3 / 30, dur: 0.3, saturate: 1.08 });
          }
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          window.__spinT = T; window.__spinSim = { w0: sim.w0, err: sim.err, tSettle, ticks: sim.ticks.length };
          tl.seek(0);
          renderAt(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
</body>
</html>
