<!doctype html>
<!-- 42 Social post card, variant A: "Post card" (16:9, 1920x1080, 30 fps, 6.1 s).
     A post on "sunwire" (our own in-world network) drops in as a real 3D porcelain slab, a caption-yellow marker extends word
     by word behind the key phrase, then the like lands: a glossy extruded 3D heart bursts out of its slot and the count rolls
     up in masked odometer columns. Variable: bg "plate" (sample footage) / "none" (transparent overlay). -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="media/post3d.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ov { position: absolute; inset: 0; }
      #stage { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.1" data-width="1920" data-height="1080">
      <div id="shake"><div id="push">
        <video id="shot1" class="clip shot" src="assets/shots/v28-tennis-mansion-h.mp4" muted playsinline data-start="0" data-duration="2.5" data-media-start="0.04" data-track-index="0"></video>
        <video id="shot2" class="clip shot" src="assets/shots/v11-yacht-h.mp4" muted playsinline data-start="2.5" data-duration="2.1" data-media-start="0" data-track-index="0"></video>
        <video id="shot3" class="clip shot" src="assets/shots/v44-bridge-skyline-h.mp4" muted playsinline data-start="4.6" data-duration="1.5" data-media-start="0.1" data-track-index="0"></video>
      </div></div>
      <div id="ov" class="clip" data-start="0" data-duration="6.1" data-track-index="1">
        <div id="stage" data-layout-allow-occlusion data-layout-allow-overflow></div>
      </div>
    </div>
    <script>
      const CONFIG = {
        platform: { name: "sunwire" },
        author: { name: "Everest Chris", handle: "@everestchris6", time: "2h", verified: true },
        // [square brackets] mark the phrase the marker sweeps across
        body: "Been in Los Santos since Sept 2013. Thirteen years later, [GTA 6 is finally here.]",
        media: ["media/post-1.jpg", "media/post-2.jpg"], clip: "0:34",
        counts: { replies: "1,204", relays: "3,817", likesFrom: 12481, likesTo: 48213 },
        colors: {
          ink: "#101217", sub: "#667085", icon: "#6B7383", card: ["#FFFFFF", "#F1F2F5"], edge: "#C9CDD5",
          hi: ["#FFE866", "#FFD23C", "#F5BC12"], like: "#F2295B", pill: ["#FFEEF2", "#FFDCE5"],
          sun: ["#FFC93C", "#FF7A45", "#FF3D7F"], mountain: "#1A1530"
        },
        card: { x: 980, y: 540, w: 1200, h: 730 },
        timing: { in: 0.2, hiFrom: 1.15, hiTo: 1.95, payoff: 2.5, out: 5.45, end: 6.1 }
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const C = CONFIG, T = C.timing, K = C.colors, PI = Math.PI, $ = (s) => document.querySelector(s);
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));
        const Ez = (n) => gsap.parseEase(n);
        const cl = (v) => Math.max(0, Math.min(1, v));
        const seg = (t, a, b, e) => { const p = t <= a ? 0 : t >= b ? 1 : (t - a) / (b - a); return e ? Ez(e)(p) : p; };
        const spring = (t, t0, f, z) => { const x = t - t0; if (x <= 0) return 0; const w = 2 * PI * f, wd = w * Math.sqrt(1 - z * z);
          return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x)); };
        const wob = (t, t0, amp, f, k) => (t < t0 ? 0 : amp * Math.exp(-k * (t - t0)) * Math.sin(2 * PI * f * (t - t0)));
        const TS = 2;

        const imgs = C.media.map((src) => { const im = new Image(); im.src = src; return im; });
        const FACES = ["800 100px Inter", "700 100px Inter", "600 100px Inter", "500 100px Inter"];
        Promise.all(FACES.map((f) => document.fonts.load(f)).concat(imgs.map((im) => im.decode().catch(() => {})))).then(() => document.fonts.ready).then(() => {
          const inter = (g, wt, size, track) => { g.font = wt + " " + size + "px Inter"; g.letterSpacing = (track || 0) + "px"; };

          // ---------------- face layout (face px, origin top-left) ----------------
          const BV = 5, CW = C.card.w - 2 * BV, CH = C.card.h - 2 * BV, PAD = 48;
          const AV = { x: 96, y: 92, r: 46 };
          const BODY = { x: PAD, y0: 212, lh: 62, size: 46, max: CW - 2 * PAD };
          const MED = { y: 316, h: 300, gap: 16 };
          const ROW = { y: 668 };
          const LIKE = { x: 640, y: ROW.y, w: 42 };          // heart slot centre + width
          const CNT = { x: 686, base: ROW.y + 12, size: 34 };

          // body words, with the marked phrase flagged
          const words = [];
          C.body.split(/(\[[^\]]*\])/).forEach((part) => {
            const hi = part.startsWith("[");
            part.replace(/[\[\]]/g, "").split(/\s+/).filter(Boolean).forEach((w) => words.push({ w, hi }));
          });
          (function layout() {
            const g = document.createElement("canvas").getContext("2d");
            let x = 0, line = 0;
            words.forEach((o) => {
              inter(g, o.hi ? 700 : 500, BODY.size, -0.3); o.wd = g.measureText(o.w).width;
              inter(g, 500, BODY.size, -0.3); const sp = g.measureText(" ").width;
              if (x > 0 && x + o.wd > BODY.max) { x = 0; line++; }
              o.x = BODY.x + x; o.line = line; x += o.wd + sp;
            });
          })();
          const hiWords = words.filter((o) => o.hi);

          // ---------------- static art ----------------
          function sunMark(g, cx, cy, r) {
            g.save(); g.beginPath(); g.arc(cx, cy, r, 0, 2 * PI); g.clip();
            const gr = g.createLinearGradient(0, cy - r, 0, cy + r);
            gr.addColorStop(0, K.sun[0]); gr.addColorStop(0.5, K.sun[1]); gr.addColorStop(1, K.sun[2]);
            g.fillStyle = gr; g.fillRect(cx - r, cy - r, 2 * r, 2 * r);
            g.fillStyle = "#fff";
            [[0.18, 0.09], [0.44, 0.12], [0.7, 0.15]].forEach((b) => g.fillRect(cx - r, cy + r * b[0], 2 * r, r * b[1]));
            g.restore();
          }
          function avatar(g) {
            const { x, y, r } = AV;
            g.save(); g.beginPath(); g.arc(x, y, r + 4, 0, 2 * PI); g.fillStyle = "#fff"; g.shadowColor = "rgba(20,24,40,.22)"; g.shadowBlur = 8; g.shadowOffsetY = 2; g.fill(); g.restore();
            g.save(); g.beginPath(); g.arc(x, y, r, 0, 2 * PI); g.clip();
            let gr = g.createLinearGradient(0, y - r, 0, y + r);
            gr.addColorStop(0, "#FFD86A"); gr.addColorStop(0.42, "#FF8A4C"); gr.addColorStop(1, "#E8306E");
            g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
            g.fillStyle = "rgba(255,247,214,.95)"; g.beginPath(); g.arc(x + r * 0.34, y - r * 0.12, r * 0.3, 0, 2 * PI); g.fill();
            // the peak (our own drawing): a ridge line with a snow cap
            g.fillStyle = K.mountain; g.beginPath();
            g.moveTo(x - r, y + r * 0.42); g.lineTo(x - r * 0.48, y - r * 0.02); g.lineTo(x - r * 0.3, y + r * 0.1); g.lineTo(x - r * 0.02, y - r * 0.46);
            g.lineTo(x + r * 0.36, y + r * 0.16); g.lineTo(x + r * 0.55, y + r * 0.02); g.lineTo(x + r, y + r * 0.44); g.lineTo(x + r, y + r); g.lineTo(x - r, y + r); g.closePath(); g.fill();
            g.fillStyle = "#fff"; g.beginPath();
            g.moveTo(x - r * 0.02, y - r * 0.46); g.lineTo(x + r * 0.17, y - r * 0.17); g.lineTo(x + r * 0.06, y - r * 0.2); g.lineTo(x - r * 0.02, y - r * 0.1);
            g.lineTo(x - r * 0.1, y - r * 0.22); g.lineTo(x - r * 0.17, y - r * 0.2); g.closePath(); g.fill();
            g.restore();
          }
          function verified(g, cx, cy, s) {
            g.save(); g.translate(cx, cy); g.rotate(PI / 4);
            const gr = g.createLinearGradient(-s, -s, s, s); gr.addColorStop(0, K.sun[1]); gr.addColorStop(1, K.sun[2]);
            g.fillStyle = gr; g.beginPath(); g.roundRect(-s / 2, -s / 2, s, s, s * 0.22); g.fill(); g.restore();
            g.strokeStyle = "#fff"; g.lineWidth = s * 0.13; g.lineCap = "round"; g.lineJoin = "round";
            g.beginPath(); g.moveTo(cx - s * 0.24, cy + s * 0.02); g.lineTo(cx - s * 0.06, cy + s * 0.2); g.lineTo(cx + s * 0.27, cy - s * 0.17); g.stroke();
          }
          function iconReply(g, x, y) {
            g.beginPath(); g.roundRect(x, y - 16, 38, 30, [13, 13, 13, 3]); g.stroke();
          }
          function iconRelay(g, x, y) {
            g.beginPath(); g.arc(x + 19, y, 15, -0.25 * PI, 1.5 * PI); g.stroke();
            const a = 1.5 * PI, ex = x + 19 + 15 * Math.cos(a), ey = y + 15 * Math.sin(a);
            g.beginPath(); g.moveTo(ex - 7, ey - 7); g.lineTo(ex + 2, ey); g.lineTo(ex - 7, ey + 7); g.stroke();
          }
          function iconShare(g, x, y) {
            g.beginPath(); g.moveTo(x, y - 2); g.lineTo(x, y + 15); g.lineTo(x + 34, y + 15); g.lineTo(x + 34, y - 2); g.stroke();
            g.beginPath(); g.moveTo(x + 17, y + 5); g.lineTo(x + 17, y - 20); g.moveTo(x + 8, y - 12); g.lineTo(x + 17, y - 21); g.lineTo(x + 26, y - 12); g.stroke();
          }
          function coverImg(g, im, x, y, w, h, r) {
            g.save(); g.beginPath(); g.roundRect(x, y, w, h, r); g.clip();
            g.fillStyle = "#2a2d36"; g.fillRect(x, y, w, h);
            if (im.naturalWidth) {
              const s = Math.max(w / im.naturalWidth, h / im.naturalHeight), iw = im.naturalWidth * s, ih = im.naturalHeight * s;
              g.drawImage(im, x + (w - iw) / 2, y + (h - ih) / 2, iw, ih);
            }
            g.restore();
            g.strokeStyle = "rgba(16,18,23,.10)"; g.lineWidth = 1.5; g.beginPath(); g.roundRect(x + 0.75, y + 0.75, w - 1.5, h - 1.5, r); g.stroke();
          }

          // the static layer (drawn once, composited under the animated layer each redraw)
          const baseCv = document.createElement("canvas"); baseCv.width = CW * TS; baseCv.height = CH * TS;
          (function drawBase() {
            const g = baseCv.getContext("2d"); g.scale(TS, TS);
            let gr = g.createLinearGradient(0, 0, 0, CH); gr.addColorStop(0, K.card[0]); gr.addColorStop(1, K.card[1]);
            g.fillStyle = gr; g.fillRect(0, 0, CW, CH);
            gr = g.createRadialGradient(160, 40, 0, 160, 40, 900); gr.addColorStop(0, "rgba(255,255,255,.9)"); gr.addColorStop(1, "rgba(255,255,255,0)");
            g.fillStyle = gr; g.fillRect(0, 0, CW, CH);
            g.fillStyle = "rgba(255,255,255,1)"; g.fillRect(24, 0, CW - 48, 1.5);
            avatar(g);
            g.textBaseline = "alphabetic"; g.fillStyle = K.ink;
            inter(g, 800, 37, -0.5); g.fillText(C.author.name, 164, 82);
            const nw = g.measureText(C.author.name).width;
            if (C.author.verified) verified(g, 164 + nw + 24, 70, 28);
            inter(g, 500, 30, -0.2); g.fillStyle = K.sub; g.fillText(C.author.handle + "  ·  " + C.author.time, 164, 124);
            // platform: mark + wordmark, top right
            inter(g, 800, 31, -0.8); const pw = g.measureText(C.platform.name).width;
            sunMark(g, CW - PAD - 22, 74, 22);
            g.fillStyle = K.ink; g.fillText(C.platform.name, CW - PAD - 56 - pw, 85);
            // media
            const mw = (BODY.max - MED.gap) / 2;
            coverImg(g, imgs[0], PAD, MED.y, mw, MED.h, 22);
            coverImg(g, imgs[1], PAD + mw + MED.gap, MED.y, mw, MED.h, 22);
            const cx0 = PAD + mw + MED.gap + 16, cy0 = MED.y + 16;
            inter(g, 700, 24, 0); const cwid = g.measureText(C.clip).width;
            g.fillStyle = "rgba(10,12,16,.72)"; g.beginPath(); g.roundRect(cx0, cy0, cwid + 62, 40, 20); g.fill();
            g.fillStyle = "#fff"; g.beginPath(); g.moveTo(cx0 + 18, cy0 + 11); g.lineTo(cx0 + 34, cy0 + 20); g.lineTo(cx0 + 18, cy0 + 29); g.closePath(); g.fill();
            g.fillText(C.clip, cx0 + 44, cy0 + 29);
            // action row (all but the like group, which is animated)
            g.strokeStyle = K.icon; g.lineWidth = 3.4; g.lineCap = "round"; g.lineJoin = "round";
            iconReply(g, PAD, ROW.y); iconRelay(g, 340, ROW.y); iconShare(g, CW - PAD - 34, ROW.y);
            inter(g, 600, CNT.size, -0.3); g.fillStyle = K.sub;
            g.fillText(C.counts.replies, PAD + 54, CNT.base); g.fillText(C.counts.relays, 340 + 52, CNT.base);
          })();

          // odometer columns
          const meas = document.createElement("canvas").getContext("2d");
          inter(meas, 700, CNT.size, 0);
          const DIG = Math.max(...[..."0123456789"].map((d) => meas.measureText(d).width)) + 1;
          const COMMA = meas.measureText(",").width + 2;
          const NDIG = String(C.counts.likesTo).length;
          function colPos(v, k) {
            const p = Math.pow(10, k), base = Math.floor(v / p), rem = v - base * p;
            return base + cl(rem - (p - 1));
          }
          function drawCount(g, v, liked, dv) {
            inter(g, liked ? 700 : 600, CNT.size, 0);
            g.fillStyle = liked ? K.like : K.sub;
            let x = CNT.x;
            const cap = CNT.size * 0.73, top = CNT.base - cap - 3, H = cap + 10;
            for (let k = NDIG - 1; k >= 0; k--) {
              const pk = colPos(v, k), d = Math.floor(pk) % 10, f = dv / Math.pow(10, k) > 0.4 ? 0 : pk - Math.floor(pk);
              g.save(); g.beginPath(); g.rect(x - 1, top, DIG + 2, cap + 7); g.clip();
              g.textAlign = "center";
              g.fillText(String(d), x + DIG / 2, CNT.base - f * H);
              if (f > 0.001) g.fillText(String((d + 1) % 10), x + DIG / 2, CNT.base + (1 - f) * H);
              g.restore();
              x += DIG;
              if (k === 3) { g.textAlign = "left"; g.fillText(",", x, CNT.base); x += COMMA; }
            }
            g.textAlign = "left";
            return x;
          }
          const countEnd = (function () { let x = CNT.x + NDIG * DIG + (NDIG > 3 ? COMMA : 0); return x; })();

          // ---------------- animated face ----------------
          const faceCv = document.createElement("canvas"); faceCv.width = CW * TS; faceCv.height = CH * TS;
          function drawFace(s) {
            const g = faceCv.getContext("2d"); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(baseCv, 0, 0); g.setTransform(TS, 0, 0, TS, 0, 0);
            // marker behind the phrase, word by word
            if (s.hi > 0) {
              const n = hiWords.length;
              const byLine = {};
              hiWords.forEach((o, i) => {
                const p = cl(s.hi * n - i); if (p <= 0) return;
                const e = Ez("power2.out")(p), ln = o.line;
                const L = byLine[ln] || (byLine[ln] = { x0: o.x - 10, x1: o.x - 10 });
                L.x1 = Math.max(L.x1, o.x + (o.wd + 10) * e + (i < n - 1 && hiWords[i + 1].line === ln ? 0 : 0));
              });
              Object.keys(byLine).forEach((ln) => {
                const L = byLine[ln], yb = BODY.y0 + ln * BODY.lh;
                const y0 = yb - 41, h = 54, mw2 = Math.max(8, L.x1 - L.x0);
                const gr = g.createLinearGradient(0, y0, 0, y0 + h);
                gr.addColorStop(0, K.hi[0]); gr.addColorStop(0.55, K.hi[1]); gr.addColorStop(1, K.hi[2]);
                g.save();
                if (s.mglow > 0) { g.shadowColor = "rgba(255,190,20," + (0.95 * s.mglow).toFixed(3) + ")"; g.shadowBlur = 34; }
                g.fillStyle = gr; g.beginPath(); g.roundRect(L.x0, y0, mw2, h, 9); g.fill(); g.restore();
                g.fillStyle = "rgba(255,255,255,.55)"; g.fillRect(L.x0 + 6, y0 + 2, Math.max(0, mw2 - 12), 2);
                g.fillStyle = "rgba(160,100,0,.22)"; g.fillRect(L.x0 + 6, y0 + h - 2.5, Math.max(0, mw2 - 12), 2.5);
                if (s.sheen > 0 && s.sheen < 1) {                      // one specular pass across the marker only
                  g.save(); g.beginPath(); g.roundRect(L.x0, y0, mw2, h, 9); g.clip();
                  const sx = L.x0 - 80 + (mw2 + 160) * s.sheen;
                  g.translate(sx, y0 + h / 2); g.transform(1, 0, -0.55, 1, 0, 0);
                  const sg = g.createLinearGradient(-44, 0, 44, 0);
                  sg.addColorStop(0, "rgba(255,255,255,0)"); sg.addColorStop(0.5, "rgba(255,255,255,.8)"); sg.addColorStop(1, "rgba(255,255,255,0)");
                  g.fillStyle = sg; g.fillRect(-44, -h, 88, 2 * h); g.restore();
                }
              });
            }
            // body text
            g.textBaseline = "alphabetic"; g.fillStyle = K.ink;
            words.forEach((o) => { inter(g, o.hi ? 700 : 500, BODY.size, -0.3); g.fillText(o.w, o.x, BODY.y0 + o.line * BODY.lh); });
            // like group: bloom, pill, ring, outline heart, count
            if (s.glow > 0) {
              const gr = g.createRadialGradient(LIKE.x, LIKE.y, 0, LIKE.x, LIKE.y, 170);
              gr.addColorStop(0, "rgba(255,70,120," + (0.42 * s.glow).toFixed(3) + ")"); gr.addColorStop(0.5, "rgba(255,90,140," + (0.16 * s.glow).toFixed(3) + ")"); gr.addColorStop(1, "rgba(255,120,160,0)");
              g.fillStyle = gr; g.fillRect(LIKE.x - 180, LIKE.y - 180, 360, 360);
            }
            if (s.pill > 0) {
              const x0 = LIKE.x - 36, x1 = countEnd + 22, w = (x1 - x0) * s.pill;
              const gr = g.createLinearGradient(0, LIKE.y - 30, 0, LIKE.y + 30); gr.addColorStop(0, K.pill[0]); gr.addColorStop(1, K.pill[1]);
              g.save();
              if (s.rim > 0) { g.shadowColor = "rgba(255,46,58," + (0.55 * s.rim).toFixed(3) + ")"; g.shadowBlur = 26; }
              g.fillStyle = gr; g.beginPath(); g.roundRect(x0, LIKE.y - 30, Math.max(60, w), 60, 30); g.fill(); g.restore();
              g.strokeStyle = "rgba(242,41,91,.18)"; g.lineWidth = 1.5; g.stroke();
            }
            if (s.outline > 0) {
              g.save(); g.translate(LIKE.x, LIKE.y); g.scale(s.outline, s.outline);
              g.strokeStyle = K.icon; g.lineWidth = 3.4 / s.outline; g.lineJoin = "round";
              g.beginPath(); K3.heartPath(g, LIKE.w - 4, 0, 1, true); g.stroke(); g.restore();
            }
            drawCount(g, s.v, s.liked, s.dv);
          }

          // ---------------- 3D scene ----------------
          const SX = 260, SW = 1440;
          const st = K3.stage({ x: SX, y: 0, w: SW, h: 1080, ss: 2, fov: 24, exposure: 1.0 });
          $("#stage").appendChild(st.canvas);
          const SHADOW = "drop-shadow(0 26px 30px rgba(0,0,0,.42)) drop-shadow(0 4px 6px rgba(0,0,0,.25))";
          st.canvas.style.filter = SHADOW;
          const rig = new THREE.Group(); st.scene.add(rig);
          const [RX, RY] = st.W(C.card.x, C.card.y);
          const card = K3.slab({ w: C.card.w, h: C.card.h, r: 40, depth: 30, bevel: BV, face: faceCv, side: K.edge, sideMetal: 0.25, emissive: 0.97, env: 0.6, diffuse: 0.03, bandK: 0, sideBandK: 0, seg: 24 });
          rig.add(card.mesh);
          const L = (fx, fy) => [fx - CW / 2, CH / 2 - fy];
          const PH = (function () {                                  // card-local centre of the marked phrase
            const f = hiWords[0], l = hiWords[hiWords.length - 1];
            return L((f.x + l.x + l.wd) / 2, BODY.y0 + l.line * BODY.lh - 16);
          })();

          const HEART = K3.heart({ w: LIKE.w, depth: 5, bevelT: 6, bevelS: 2.2, bandK: 0.55 });
          const heartG = new THREE.Group(); const [hx, hy] = L(LIKE.x, LIKE.y);
          heartG.position.set(hx, hy, 0); rig.add(heartG); heartG.add(HEART.mesh);
          const hSh = K3.shadow(LIKE.w * 0.9, LIKE.w * 0.62, 10, 7, true); hSh.mesh.position.set(hx + 3, hy - 6, 0.6); rig.add(hSh.mesh);
          const EMB = [];
          const embG = new THREE.Group(); embG.position.set(hx, hy, 0); rig.add(embG);
          const emGeo = K3.heart({ w: 21, depth: 2.5, bevelT: 3, bevelS: 1.2 });
          for (let i = 0; i < 3; i++) {
            const m = new THREE.Mesh(emGeo.mesh.geometry, HEART.mat);
            const ang = (58 + i * 34 + 6 * Look.hash(i + 3)) * PI / 180;
            EMB.push({ m, ang, dist: 150 + 50 * Look.hash(i + 11), rot: (Look.hash(i + 23) - 0.5) * 1.6, t0: 0.04 * i });
            embG.add(m);
          }

          const mb = (function () {
            const NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS, "svg");
            svg.setAttribute("width", "0"); svg.setAttribute("height", "0"); svg.style.position = "absolute";
            svg.innerHTML = '<filter id="mby" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB"><feGaussianBlur id="mbyg" stdDeviation="0 0"/></filter>';
            document.body.appendChild(svg); return document.getElementById("mbyg");
          })();

          // ---------------- state from time ----------------
          const P = T.payoff, X = T.out;
          function dropY(t) { return 1150 * (1 - spring(t, T.in, 1.35, 0.58)) - 1350 * seg(t, X, X + 0.4, "power3.in"); }
          const keyOf = (o) => Object.keys(o).map((k) => (typeof o[k] === "number" ? o[k].toFixed(3) : String(o[k]))).join("|");
          let faceKey = "";
          function heartState(t) {
            // returns {vis, s, sx, sy, z, y}
            if (t < P - 0.04) return { vis: false };
            const up = seg(t, P - 0.04, P + 0.14, "power3.out");
            const fall = seg(t, P + 0.46, P + 0.74, "power2.in");
            const land = t - (P + 0.74);
            let s = 0.8 + 1.8 * up, z = 170 * up, y = 58 * up;
            s = s + (1.25 - s) * fall; z = z * (1 - fall) + 2 * fall; y = y * (1 - fall);
            s += 0.06 * Math.sin(2 * PI * 2.2 * Math.max(0, t - P - 0.14)) * (1 - seg(t, P + 0.14, P + 0.46)) * up * (1 - fall);
            let sx = 1, sy = 1;
            if (land > 0) { const q = wob(t, P + 0.74, 1, 2.9, 6.5); sx = 1 + 0.25 * q; sy = 1 - 0.2 * q; }
            return { vis: true, s, sx, sy, z, y };
          }

          const likes = (t) => C.counts.likesFrom + (C.counts.likesTo - C.counts.likesFrom) * seg(t, P + 0.02, P + 1.1, "expo.out");
          function renderAt(t) {
            const on = t >= T.in && t < X + 0.4;
            st.canvas.style.visibility = on ? "visible" : "hidden";
            if (!on) return;
            // card: drop in, drift, payoff recoil, drop out
            const e = spring(t, T.in, 1.35, 0.58), pe = seg(t, X, X + 0.4, "power3.in");
            const drift = seg(t, 1.0, X, "sine.inOut");
            const pu = 1 + 0.07 * seg(t, T.hiFrom - 0.05, T.hiTo + 0.05, "power3.inOut");
            rig.scale.set(pu, pu, pu);
            rig.position.set(RX - (pu - 1) * PH[0], RY + dropY(t) - (pu - 1) * PH[1], 120 * (1 - e) + 22 * drift - 10 * wob(t, P + 0.74, 1, 2.4, 7));
            rig.rotation.set(-0.05 + 0.42 * (1 - e) + 0.012 * wob(t, P + 0.74, 1, 2.2, 6) - 0.4 * pe, -0.12 + 0.055 * drift, -0.05 * (1 - e) + 0.03 * pe);
            const v = Math.abs(dropY(t + 1 / 60) - dropY(t - 1 / 60));
            const blur = Math.min(10, Math.max(0, v - 12) * 0.12);
            if (blur > 0.3) { mb.setAttribute("stdDeviation", "0 " + blur.toFixed(2)); st.canvas.style.filter = "url(#mby) " + SHADOW; }
            else st.canvas.style.filter = SHADOW;

            // face state
            const hs = heartState(t);
            const fs = {
              hi: seg(t, T.hiFrom, T.hiTo),
              outline: t < P - 0.04 ? 1 - 0.22 * seg(t, P - 0.12, P - 0.04, "power2.in") : 0,
              glow: seg(t, P + 0.02, P + 0.06) * (1 - seg(t, P + 0.16, P + 0.6, "power2.out")),
              pill: seg(t, P + 0.04, P + 0.26, "expo.out"),
              rim: seg(t, P + 0.72, P + 0.76) * (1 - seg(t, P + 0.92, P + 1.1, "power2.out")),
              mglow: seg(t, T.hiTo - 0.06, T.hiTo) * (1 - seg(t, T.hiTo + 0.1, T.hiTo + 0.5, "power2.out")),
              sheen: seg(t, T.hiTo - 0.04, T.hiTo + 0.34, "power1.inOut"),
              v: likes(t), dv: Math.abs(likes(t) - likes(t - 1 / 30)),
              liked: t >= P
            };
            fs.v = Math.round(fs.v * 4) / 4; fs.dv = Math.round(fs.dv);
            const k = keyOf(fs); if (k !== faceKey) { faceKey = k; drawFace(fs); card.tex.needsUpdate = true; }

            // 3D heart
            HEART.mesh.visible = hs.vis; hSh.mesh.visible = hs.vis;
            if (hs.vis) {
              heartG.position.set(hx, hy + hs.y, HEART.depth * hs.s + 0.5 + hs.z);
              HEART.mesh.scale.set(hs.s * hs.sx, hs.s * hs.sy, hs.s);
              heartG.rotation.set(0.1 * Math.sin(2 * PI * 1.4 * (t - P)) * (1 - seg(t, P + 0.5, P + 1.2)), -0.28 * wob(t, P - 0.04, 1, 1.6, 4), 0);
              const lift = hs.z / 160;
              hSh.mat.opacity = 0.42 * (1 - 0.65 * lift);
              const ss = (hs.s / 1.25) * (1 + 0.8 * lift); hSh.mesh.scale.set(ss, ss, 1);
              hSh.mesh.position.set(hx + 4 + 14 * lift, hy - 6 - 18 * lift, 0.6);
              HEART.mat.emissiveIntensity = 0.3 + 0.3 * seg(t, P + 0.02, P + 0.06) * (1 - seg(t, P + 0.16, P + 0.5, "power2.out"));
            }
            // embers: six small glossy hearts thrown up and out, shrinking to nothing
            EMB.forEach((o) => {
              const p = seg(t, P + 0.06 + o.t0, P + 0.7 + o.t0);
              o.m.visible = p > 0 && p < 1;
              if (!o.m.visible) return;
              const e2 = Ez("power3.out")(p), d = o.dist * e2;
              o.m.position.set(Math.cos(o.ang) * d, Math.sin(o.ang) * d + 30 * e2, 40 + 60 * e2);
              const sc = Math.sin(PI * Math.min(1, p * 1.25)) * (1 - p) * 1.9 + 0.001;
              o.m.scale.set(sc, sc, sc); o.m.rotation.set(0, 0, o.rot * e2);
            });
            // light: one specular band across the heart (and faintly the card), a raking key on the payoff
            const bp = seg(t, P + 0.08, P + 0.44, "power1.inOut");
            K3.U.uBand.value = (hx + RX) - 260 + 520 * bp;
            K3.U.uBandW.value = 34;
            K3.U.uBandAmp.value = seg(t, P + 0.06, P + 0.1) * (1 - seg(t, P + 0.36, P + 0.46)) * 1.0;
            st.rake.intensity = 1.0 * seg(t, P, P + 0.1) * (1 - seg(t, P + 0.3, P + 0.7, "power2.out"));
            st.rake.position.set((-1 + 2 * bp) * st.DIST, st.DIST * 0.5, st.DIST * 0.6);
            st.render();
          }

          const tl = gsap.timeline({ paused: true });
          Look.drive(tl, 0, T.end, (p) => renderAt(p * T.end));
          window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") renderAt(e.detail.time); });
          if (plate) Look.push(tl, "#push", 0, T.end, { to: 1.045 });
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          renderAt(0);
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
