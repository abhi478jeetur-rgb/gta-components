     and a tray slams open beneath it with the amount seated inside as real Three.js gold numerals (one landing frame: slam, squash,
     light). The footage is laid out the way GTA Shorts carry landscape gameplay: the 16:9 shot sharp at 1.0x in a full-width window
     over its own graded blur, with the alert living in the top band.
     Variable: bg "plate" (sample GTA V footage) / "none" (transparent overlay). See gta/DESIGN.md. -->

        function shapesFor(d, gx) {
          const sp = new THREE.ShapePath(), re = /([MLQCZ])([^MLQCZ]*)/g; let m;

            while (out.length > 3 && out[0].distanceTo(out[out.length - 1]) <= 0.6) out.pop(); return out; };

        const md = mg.getImageData(0, 0, TW, TH).data, N = TW * TH, INF = 1e12;
        const f = new Float64Array(N); for (let i = 0; i < N; i++) f[i] = md[i * 4 + 3] > 127 ? INF : 0;

        }

        for (let y = 1; y < TH - 1; y++) for (let x = 1; x < TW - 1; x++) {
          const i = x + y * TW; if (dist[i] <= 0) continue;
          const dx = (hA[i + 1] - hA[i - 1]) * hs, dy = -(hA[i + TW] - hA[i - TW]) * hs;     // dh/dx, dh/dy in px (word space, +y up)
          let nx = -dx, ny = -dy, nz = 1; const nl = Math.hypot(nx, ny, nz); nx /= nl; ny /= nl;
          nrm[i * 4] = Math.round((nx * 0.5 + 0.5) * 255); nrm[i * 4 + 1] = Math.round((ny * 0.5 + 0.5) * 255); nrm[i * 4 + 2] = Math.round(255 * Math.min(1, hA[i] / RAD)); nrm[i * 4 + 3] = 255;
        }
        const nrmTex = new THREE.DataTexture(nrm, TW, TH, THREE.RGBAFormat); nrmTex.magFilter = THREE.LinearFilter; nrmTex.minFilter = THREE.LinearFilter; nrmTex.needsUpdate = true;
        // true gold: metal, warm saturated F0, no clear coat (a dielectric coat reflects untinted and washes gold to cream)
        const goldOpts = { color: new THREE.Color(1.0, 0.62, 0.17), metalness: 1.0, roughness: 0.24, envMapIntensity: 1.0 };
        const gold = new THREE.MeshPhysicalMaterial(goldOpts), rodMat = new THREE.MeshStandardMaterial(goldOpts);
        const uBloom = { value: 0 };
        gold.onBeforeCompile = (sh) => {
          sh.uniforms.uNrm = { value: nrmTex }; sh.uniforms.uBox = { value: new THREE.Vector4(bx0, by1, bx1 - bx0, by1 - by0) }; sh.uniforms.uZ = { value: -BT - 0.6 };
          sh.uniforms.uBloom = uBloom;
          sh.vertexShader = "varying vec3 vLP;\n" + sh.vertexShader.replace("#include <begin_vertex>", "#include <begin_vertex>\n vLP = position;");
          sh.fragmentShader = "varying vec3 vLP; uniform sampler2D uNrm; uniform vec4 uBox; uniform float uZ; uniform float uBloom; uniform mat3 normalMatrix;\n" + sh.fragmentShader
            .replace("#include <normal_fragment_maps>", "#include <normal_fragment_maps>\n float rimK = 0.25; if (vLP.z > uZ) { vec2 tuv = vec2((vLP.x - uBox.x) / uBox.z, (uBox.y - vLP.y) / uBox.w); vec4 nt = texture2D(uNrm, tuv);" +
              " if (nt.a > 0.5) { vec3 nO = vec3(nt.rg * 2.0 - 1.0, 0.0); nO.z = sqrt(max(0.0, 1.0 - dot(nO.xy, nO.xy))); normal = normalize(normalMatrix * nO); rimK = pow(1.0 - nO.z, 1.4); } else { rimK = 0.6; } }")
            .replace("#include <emissivemap_fragment>", "#include <emissivemap_fragment>\n totalEmissiveRadiance += uBloom * vec3(1.0, 0.55, 0.12) * (0.15 + rimK);");
        };
        // the light rake: a soft additive warm band on each glyph's silhouette, just in front of its face
        const rakeMat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false,
          uniforms: { uPos: { value: -1e4 }, uAmp: { value: 0 } },
          vertexShader: "varying vec2 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xy; gl_Position = projectionMatrix * viewMatrix * w; }",
          fragmentShader: "uniform float uPos; uniform float uAmp; varying vec2 vW; void main(){ float d = dot(vW, normalize(vec2(0.8, -0.6))); float a = uAmp * exp(-pow((d - uPos) / 34.0, 2.0)); gl_FragColor = vec4(1.0, 0.9, 0.66, a); }" });
        const glyphs = [];
        pens.forEach((p, i) => {
          // "$": the font draws it as an S-body plus an overlapping bar; extrude the body and pass a thick round rod behind it
          const shapes = shapesFor(bodyPath(p), p.x);
          const geo = smooth(new THREE.ExtrudeGeometry(shapes, { depth: DEPTH, bevelEnabled: true, bevelThickness: BT, bevelSize: BS, bevelOffset: -BS, bevelSegments: 3, curveSegments: 1 }));
          geo.translate(0, 0, -(DEPTH + BT));
          // geometry stays in word space (the normal map is looked up there); each glyph pivots on its own baseline centre (squash onto the floor)
          const cx = ox + (p.x + (p.g[2] + p.g[3]) / 2) * s, cy = -CAP / 2;
          const pivot = new THREE.Group(); pivot.position.set(cx, cy, 0); scene.add(pivot);
          const body = new THREE.Group(); body.position.set(-cx, -cy, 0); pivot.add(body);
          body.add(new THREE.Mesh(geo, gold));
          if (p.ch === "$") {
            const bar = p.g[1].split("M").filter(Boolean)[0].match(/-?\d+/g).map(Number);   // x0 y0 x1 y1 ... of the bar rectangle
            const xs = bar.filter((_, k) => k % 2 === 0), ys = bar.filter((_, k) => k % 2 === 1);
            const bx = ox + (p.x + (Math.min(...xs) + Math.max(...xs)) / 2) * s, r = (Math.max(...xs) - Math.min(...xs)) * s * 0.5 * 1.45;
            const yT = -Math.min(...ys) * s - CAP / 2, yB = -Math.max(...ys) * s - CAP / 2;
            const rod = new THREE.Mesh(new THREE.CapsuleGeometry(r, Math.max(1, yT - yB - 2 * r), 8, 24), rodMat);
            rod.position.set(bx, (yT + yB) / 2, -(DEPTH + 2 * BT) / 2); body.add(rod);
          }
          const rk = new THREE.Mesh(new THREE.ShapeGeometry(shapes, 12), rakeMat); rk.geometry.translate(0, 0, 0.6); rk.renderOrder = 3; body.add(rk);
          glyphs.push(pivot);
        });

        function hit3(t, at, d) { const u = t - at; if (u < 0) return 0; return u < 3 / 30 ? 1 : Math.exp(-(u - 3 / 30) / d); }   // full on the landing frame, 3-frame hold, then decay
        const P0 = T.pop, He = C.expanded, Hc = C.collapsed;

        // ---------- motion: everything is a pure function of t ----------
        function renderAt(t) {
          // ---- banner: drops from above the frame on a spring, motion-blurred on the fall ----
          const d = seg(t, T.in, 0.55), de = E("back.out(1.15)")(d);
          const x = seg(t, T.out + 0.3, 0.26), xe = eIn3(x);
          const y = lerp(-(C.y + Hc + 40), 0, de) - xe * (C.y + Hc + 40);
          const visible = t >= T.in && x < 1 && C.y + y + Hc > 0;          // cut on the frame it clears the top
          card.style.visibility = visible ? "visible" : "hidden";
          const sq = 1 + 0.02 * Math.sin(Math.PI * seg(t, T.in + 0.3, 0.22));            // landing squash
          card.style.transform = "translateY(" + y.toFixed(2) + "px) scale(" + (2 - sq).toFixed(4) + "," + sq.toFixed(4) + ")";
          const fallBlur = (d > 0 && d < 1 ? 8 * Math.pow(1 - d, 2.5) : 0) + 9 * x * x;     // blur follows speed
          card.style.filter = fallBlur > 0.3 ? "blur(" + fallBlur.toFixed(2) + "px)" : "none";

          // ---- the amount drops out of the pill (masked roll, down toward the tray) before any numeral is on screen ----
          const ao = eIn3(seg(t, T.swap, 0.09));
          $("#amt").style.transform = "translateY(" + (ao * 96).toFixed(2) + "px)";
          $("#amt").style.visibility = ao < 1 ? "visible" : "hidden";
          // ---- tier word rolls into the same slot after the landing ----
          const ci = E("back.out(1.7)")(seg(t, P0 + 0.1, 0.22));
          $("#chip").style.transform = "translateY(" + ((ci - 1) * 72).toFixed(2) + "px)";
          $("#chip").style.visibility = ci > 0 ? "visible" : "hidden";

          // ---- the tray: shoots out from under the pill at full speed (numerals in view from its first frame) and slams to its stop on P0; damped bounce; retracts on exit ----
          const op = seg(t, T.open, P0 - T.open), opE = op > 0 ? 0.19 + 0.81 * op : 0;   // constant speed: 46% / 73% / 100% open on the 3 frames before the stop
          const rt = seg(t, T.out, 0.24), rtE = eIn2(rt);
          const open = opE * (1 - rtE);
          const u = t - P0, bounce = (u >= 0 && rt <= 0) ? 22 * Math.sin(2 * Math.PI * u / 0.24) * Math.exp(-u / 0.08) : 0;
          const h = Hc + (He - Hc) * open + bounce;
          card.style.height = h.toFixed(2) + "px";
          card.style.borderRadius = lerp(Hc / 2, 60, clamp(open, 0, 1)).toFixed(2) + "px";   // the pill opens into a card
          const pn = $("#panel");
          pn.style.top = (152 + (h - He)).toFixed(2) + "px";                                 // attached to the card's bottom edge
          pn.style.visibility = open > 0.001 ? "visible" : "hidden";
          const slideBlur = op > 0 && op < 1 ? 5 * opE : (rt > 0 && rt < 1 ? 5 * Math.sin(Math.PI * rt) : 0);
          pn.style.filter = slideBlur > 0.3 ? "blur(" + slideBlur.toFixed(2) + "px)" : "none";
          $("#headShade").style.opacity = clamp(open * 3, 0, 1).toFixed(3);

          // ---- the landing frame P0: tray slams, numerals squash onto the floor, bevel bloom + key spike + rake, all on the same frame ----
          const heat = hit3(t, P0, 0.16);
          $("#panelGlow").style.opacity = (u >= 0 ? 0.16 + 0.6 * heat : 0).toFixed(3);
          const hs2 = seg(t, P0, 0.42);
          $("#hSheen").style.opacity = hs2 > 0 && hs2 < 1 ? Math.min(1, 4 * Math.sin(Math.PI * hs2)).toFixed(3) : 0;
          $("#hSheen").style.transform = "translateX(" + lerp(-160, 900, eOut3(hs2)).toFixed(1) + "px) skewX(-18deg)";
          const shp = seg(t, P0, 0.4);
          $("#pSheen").style.opacity = shp > 0 && shp < 1 ? Math.min(1, 4 * Math.sin(Math.PI * shp)).toFixed(3) : 0;
          $("#pSheen").style.transform = "translateX(" + lerp(-120, 860, eOut3(shp)).toFixed(1) + "px) skewX(-16deg)";

          const squash = u >= 0 ? 1 - 0.1 * Math.cos(2 * Math.PI * u / 0.22) * Math.exp(-u / 0.09) : 1 + 0.05 * opE;   // stretch in flight, squash on contact
          $("#floor").style.transform = "scaleX(" + (1 + (1 - squash) * 0.8).toFixed(4) + ")";
          $("#floor").style.opacity = (u >= 0 ? 1 : 0.6 + 0.4 * opE).toFixed(3);
          const idle = seg(t, P0 + 0.45, 0.6);
          glyphs.forEach((g, i) => {
            g.scale.set(1 + (1 - squash) * 0.6, squash, 1);
            g.position.y = -CAP / 2 + idle * 3.5 * Math.sin((t - P0) * 2.4 + i * 0.9);
            g.rotation.y = idle * 0.07 * Math.sin((t - P0) * 1.7 + i * 1.3);
            g.visible = t >= T.open && rt < 1;
          });
          // key light: spikes on the landing frame and swings left -> rest, so the specular travels across the strokes
          const sw = seg(t, P0, 0.36);
          key.position.set(lerp(-1.6, -0.6, eOut3(sw)), 0.8, 0.9);
          key.intensity = 2.2 + 2.0 * heat;
          uBloom.value = 0.42 * heat;
          // the rake: full strength from the landing frame, crossing the numerals in 0.3 s; a slower second pass mid-hold
          const rk = seg(t, P0, 0.3), rk2 = seg(t, 3.55, 0.6);
          if (u >= 0 && rk < 1) { rakeMat.uniforms.uPos.value = lerp(-215, 440, eOut3(rk)); rakeMat.uniforms.uAmp.value = 0.62 * (1 - eIn3(rk)); }
          else if (u >= 0 && rk2 > 0 && rk2 < 1) { rakeMat.uniforms.uPos.value = lerp(-440, 440, eIO2(rk2)); rakeMat.uniforms.uAmp.value = 0.32 * Math.sin(Math.PI * rk2); }
          else rakeMat.uniforms.uAmp.value = 0;
          renderer.render(scene, camera);
        }
        window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") renderAt(e.detail.time); });

        const FACES = ["900 100px Inter", "800 100px Inter", "700 100px Inter"];
        Promise.all(FACES.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
          const tl = gsap.timeline({ paused: true });
          renderAt(0);
          Look.drive(tl, 0, T.end, (p) => renderAt(p * T.end));
          if (plate) {
            Look.push(tl, ".shot", 0, T.end, { from: 1, to: 1.03 });
            Look.impact(tl, P0, { shake: "#shake", amp: 4, dur: 0.26, flash: 0, zoom: 1.01 });
          }
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
