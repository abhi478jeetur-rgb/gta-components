          Look.drive(tl, T.port, T.end - T.port, (p) => {
            const t = T.port + p * (T.end - T.port), a = clamp((t - T.port) / T.portDur, 0, 1);
            const ea = portE(a), ma = moveE(a), R = lerp(86, PR, ea);
            const cx = lerp(TG[0] + DX, PC[0], ma), cy = lerp(TG[1] + DY, PC[1], ma);
            // ring (lives in #dest, which carries the DY drift)
            ringG.setAttribute("transform", "translate(" + (cx - DX).toFixed(1) + "," + (cy - DY).toFixed(1) + ")");
            [rShadow, rWhite, rRed].forEach((c) => c.setAttribute("r", R.toFixed(1)));
            rSpec.setAttribute("r", (R + 2).toFixed(1)); rSpec.setAttribute("stroke-dasharray", (90 * R / 86).toFixed(1) + " " + (450 * R / 86).toFixed(1));
            rEdge.setAttribute("r", (R + 12).toFixed(1));
            rDot.setAttribute("opacity", (1 - sstep(0, 0.3, a)).toFixed(3));
            // label rides above the window
            dl.style.left = lerp(504, PC[0] - DX, ma).toFixed(1) + "px"; dl.style.top = (cy - R - 30 - DY).toFixed(1) + "px";
            // footage: the -h shot at <= 1.0x (0.94 -> 1.0 settle), never upscaled
            const on = a > 0; port.style.visibility = on ? "visible" : "hidden";
            port.style.clipPath = "circle(" + Math.max(0, R - 3).toFixed(1) + "px at " + cx.toFixed(1) + "px " + cy.toFixed(1) + "px)";
            const vs = lerp(0.94, 1.0, ma);
            pvs.forEach((v) => { v.style.left = (cx - 960).toFixed(1) + "px"; v.style.top = (cy - 540).toFixed(1) + "px"; v.style.transform = "scale(" + vs.toFixed(4) + ")"; });
            // lens depth: inner shadow at the rim and a soft top-left glint
            pshade.style.background = on ? "radial-gradient(circle " + R.toFixed(1) + "px at " + cx.toFixed(1) + "px " + cy.toFixed(1) + "px, rgba(12,8,4,0) " + (R * 0.74).toFixed(1) + "px, rgba(12,8,4,.4) " + R.toFixed(1) + "px), radial-gradient(ellipse " + (R * 0.7).toFixed(1) + "px " + (R * 0.42).toFixed(1) + "px at " + (cx - R * 0.32).toFixed(1) + "px " + (cy - R * 0.55).toFixed(1) + "px, rgba(255,255,255,.14), rgba(255,255,255,0) 70%)" : "none";
            // graded bed (lesson 17: brightness <= .7, contrast >= 1.1, saturation >= .4)
            mapshake.style.filter = on ? "brightness(" + lerp(1, 0.6, ma).toFixed(3) + ") contrast(" + lerp(1, 1.12, ma).toFixed(3) + ") saturate(" + lerp(1, 0.72, ma).toFixed(3) + ") blur(" + (4 * ma).toFixed(2) + "px)" : "";
          });
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
