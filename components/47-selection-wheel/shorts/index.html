<!doctype html>
<!-- 47 Selection wheel, variant B: "Radio wheel" (9:16, 1080x1920, 30 fps).
     A game radio wheel for a Short: a ring of 8 station badges (our own invented stations) round a centre label, on a
     lacquered disc with a neon rim. While it is open the plate drops to slow motion, blurs and desaturates (the game's wheel
     slow-mo). The selector ticks through the stations with masked label rolls and lands; the landed badge becomes a real lit
     coin (Three.js: chrome bead rim, domed clear-coated face) that is pressed and springs out while a white-hot arc runs the
     rim, then flies into the socket of a NOW PLAYING strip that wipes open from it. The badges fold into the hub, the disc
     zooms out and is cut on the frame the plate snaps back to colour; the strip later wipes shut and the coin pops out.
     Variable bg: "plate" (sample footage) / "none" (transparent overlay). -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

    <script src="../../../shared/kit/look/look.js"></script>
    <script src="media/coin3d.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Barlow Condensed", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push, #grade { position: absolute; inset: 0; }
      .shot { position: absolute; left: -40px; top: -40px; width: calc(100% + 80px); height: calc(100% + 80px); object-fit: cover; }
      #ov, #npRig { position: absolute; inset: 0; }

      /* ---------- wheel (840 px box, centre 420/420) ---------- */
      #wheel { position: absolute; width: 840px; height: 840px; }
      .layer { position: absolute; left: 0; top: 0; width: 840px; height: 840px; }
      /* lacquered disc: 3-stop radial (lit centre, base, dark edge), near-opaque so there is no grey veil */
      #wBase { position: absolute; left: 40px; top: 40px; width: 760px; height: 760px; border-radius: 50%;
        background: radial-gradient(circle at 50% 40%, #6A2C9E 0%, #431470 46%, #1F0636 100%);
        box-shadow: inset 0 2px 0 rgba(255,255,255,.22), inset 0 -30px 60px rgba(0,0,0,.42), 0 4px 10px rgba(0,0,0,.45), 0 50px 100px -30px rgba(0,0,0,.85); }
      /* a slow conic sheen over the lacquer */
      #wSheen { position: absolute; left: 40px; top: 40px; width: 760px; height: 760px; border-radius: 50%; mix-blend-mode: screen;
        background: conic-gradient(from 300deg, rgba(255,255,255,0) 0deg, rgba(255,214,240,.09) 34deg, rgba(255,255,255,0) 80deg, rgba(255,255,255,0) 170deg,
          rgba(255,140,210,.06) 210deg, rgba(255,255,255,0) 250deg, rgba(255,255,255,0) 360deg); }
      /* the hub sits in a recess */
      #hubRecess { position: absolute; left: 226px; top: 226px; width: 388px; height: 388px; border-radius: 50%;
        background: radial-gradient(circle, rgba(10,0,22,0) 0px, rgba(10,0,22,0) 171px, rgba(10,0,22,.62) 176px, rgba(10,0,22,.22) 186px, rgba(10,0,22,0) 194px); }
      .tok { position: absolute; width: 148px; height: 148px; border-radius: 50%;
        box-shadow: 0 3px 6px rgba(0,0,0,.45), 0 14px 26px -6px rgba(0,0,0,.6); }
      .tok-art { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; }
      .tok-art svg { display: block; }
      .tok-bevel { position: absolute; inset: 0; border-radius: 50%;
        background: linear-gradient(158deg, rgba(255,255,255,.26) 0%, rgba(255,255,255,.06) 30%, rgba(255,255,255,0) 46%);
        box-shadow: inset 0 0 0 2px rgba(255,255,255,.2), inset 0 2px 1px rgba(255,255,255,.45), inset 0 -10px 18px rgba(0,0,0,.42); }
      .tok-flash { position: absolute; inset: 0; border-radius: 50%; opacity: 0; mix-blend-mode: screen;
        background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.6) 0%, rgba(255,255,255,.16) 55%, rgba(255,255,255,0) 72%); }
      /* the locked badge stays seated and lit after the coin duplicate leaves: a full pink rim and a 24 px bloom behind it
         (outer box-shadows paint only outside the badge, so the bloom sits behind it without veiling the art) */
      .tok-bloom { position: absolute; inset: 0; border-radius: 50%; opacity: 0;
        box-shadow: 0 0 24px 6px rgba(255,79,163,.92), 0 0 46px 12px rgba(255,79,163,.34); }
      .tok-rim { position: absolute; inset: 0; border-radius: 50%; opacity: 0;
        box-shadow: 0 0 0 3px #FF4FA3, 0 0 0 4.5px rgba(255,230,243,.6), inset 0 0 0 1px rgba(255,230,243,.5); }
      /* the seat under the coin while it is pressed in the wheel */
      .tsock { position: absolute; width: 148px; height: 148px; border-radius: 50%; opacity: 0;
        background: radial-gradient(circle at 50% 58%, #0E0219 0%, #1A062C 62%, #2A0C44 100%);
        box-shadow: inset 0 8px 16px rgba(0,0,0,.75), inset 0 -2px 0 rgba(255,255,255,.14), 0 0 0 1.5px rgba(255,92,174,.45); }
      #halo { position: absolute; width: 270px; height: 270px; border-radius: 50%; mix-blend-mode: screen;
        background: radial-gradient(circle, rgba(255,79,163,.62) 0%, rgba(255,79,163,.26) 40%, rgba(255,79,163,0) 70%); }

      /* hub lens (348 px) */
      #hub { position: absolute; left: 246px; top: 246px; width: 348px; height: 348px; border-radius: 50%;
        background: radial-gradient(circle at 50% 30%, #7E38B4 0%, #4A1680 48%, #24073E 100%);
        box-shadow: inset 0 0 0 2px rgba(255,92,174,.95), inset 0 0 0 3.5px rgba(255,255,255,.28), inset 0 3px 2px 2px rgba(255,255,255,.2),
          inset 0 -18px 36px rgba(0,0,0,.45), 0 0 22px rgba(255,79,163,.5), 0 12px 30px rgba(0,0,0,.5); }
      #hubFlash { position: absolute; inset: 0; border-radius: 50%; opacity: 0;
        box-shadow: inset 0 0 0 3px #fff, inset 0 0 40px rgba(255,140,198,.8), 0 0 50px rgba(255,79,163,.95); }
      #hubGloss { position: absolute; inset: 0; border-radius: 50%; mix-blend-mode: screen;
        background: linear-gradient(160deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,.04) 30%, rgba(255,255,255,0) 48%); }
      #hKick { position: absolute; left: 0; top: 54px; width: 100%; text-align: center; font: 700 24px/1 "Barlow Condensed";
        letter-spacing: .4em; padding-left: .4em; color: #FF9ACD; text-transform: uppercase; }
      /* station label: name and genre roll in their own windows, pitch = window height (never two stations readable) */
      #hWin { position: absolute; left: 24px; top: 90px; width: 300px; height: 132px; overflow: hidden; }
      #gWin { position: absolute; left: 24px; top: 228px; width: 300px; height: 34px; overflow: hidden; }
      #hCol, #gCol { position: absolute; left: 0; top: 0; width: 100%; }
      .hn { width: 300px; height: 132px; display: flex; align-items: center; justify-content: center; text-align: center;
        font: 800 72px/66px "Barlow Condensed"; letter-spacing: .02em; color: #fff; text-transform: uppercase; text-wrap: balance;
        text-shadow: 0 2px 12px rgba(0,0,0,.45); }
      .hg { width: 300px; height: 34px; text-align: center; font: 600 28px/34px "Barlow Condensed"; letter-spacing: .12em; padding-left: .12em;
        color: rgba(255,255,255,.86); text-transform: uppercase; white-space: nowrap; }
      #hEq { position: absolute; left: 0; top: 274px; width: 100%; height: 30px; display: flex; justify-content: center; align-items: flex-end; gap: 5px; }
      .eqb { width: 6px; height: 30px; border-radius: 3px; transform-origin: 50% 100%;
        background: linear-gradient(180deg, #FFD0E8 0%, #FF4FA3 60%, #B93CFF 100%); box-shadow: 0 0 8px rgba(255,79,163,.6); }

      /* now playing strip (720 x 188, x 180-900): wipes open out of the coin socket */
      #np { position: absolute; width: 720px; height: 188px; border-radius: 34px;
        background: linear-gradient(180deg, #52207A 0%, #2E0A4E 58%, #1C0532 100%);
        box-shadow: inset 0 0 0 2px rgba(255,92,174,.95), inset 0 0 0 3.5px rgba(255,255,255,.18), inset 0 2px 1px 2px rgba(255,255,255,.2),
          inset 0 -14px 30px rgba(0,0,0,.4), 0 0 26px rgba(255,79,163,.42), 0 26px 50px -14px rgba(0,0,0,.75); }
      #npGloss { position: absolute; inset: 0; border-radius: 34px; mix-blend-mode: screen;
        background: linear-gradient(172deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,0) 42%); }
      #npSocket { position: absolute; left: 26px; top: 26px; width: 136px; height: 136px; border-radius: 50%;
        background: radial-gradient(circle at 50% 60%, #12041F 0%, #1E0833 70%, #2A0C45 100%);
        box-shadow: inset 0 7px 14px rgba(0,0,0,.75), inset 0 -1px 0 rgba(255,255,255,.18), 0 0 0 1.5px rgba(255,92,174,.5); }
      #sockRing { position: absolute; left: 26px; top: 26px; width: 136px; height: 136px; border-radius: 50%; opacity: 0;
        box-shadow: 0 0 0 3px #FF4FA3, 0 0 0 5px rgba(255,255,255,.4), 0 0 24px rgba(255,79,163,.85); }

      #npKickT { font: 700 24px/26px "Barlow Condensed"; letter-spacing: .32em; color: #FF9ACD; text-transform: uppercase; white-space: nowrap; }
      #npTitle { position: absolute; left: 186px; top: 48px; width: 420px; font: 800 64px/1.02 "Barlow Condensed"; letter-spacing: .02em; color: #fff;
        text-transform: uppercase; white-space: nowrap; }
      #npArtist { position: absolute; left: 186px; top: 122px; font: 600 28px/32px "Barlow Condensed"; letter-spacing: .1em; color: rgba(255,255,255,.86);
        text-transform: uppercase; white-space: nowrap; }
      #npEq { position: absolute; right: 34px; top: 34px; height: 56px; display: flex; align-items: flex-end; gap: 7px; }
      #npEq .eqb { width: 10px; height: 56px; border-radius: 4px; }
      #npProg { position: absolute; left: 186px; right: 34px; bottom: 16px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.16); overflow: hidden; }
      #npFill { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 2px; transform-origin: 0 50%;

      #npEdge { position: absolute; width: 8px; height: 170px; border-radius: 4px; opacity: 0;
        background: linear-gradient(180deg, rgba(255,230,243,0) 0%, #FFE6F3 30%, #fff 50%, #FFE6F3 70%, rgba(255,230,243,0) 100%);
        box-shadow: 0 0 14px rgba(255,79,163,.95), 0 0 30px rgba(255,79,163,.6); }
      /* the coin's own bloom: a pink glow that follows the 3D coin */
      #coinGlow { position: absolute; left: 0; top: 0; width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 50%; opacity: 0; mix-blend-mode: screen;
        background: radial-gradient(circle, rgba(255,79,163,.75) 0%, rgba(255,79,163,.34) 36%, rgba(255,79,163,0) 66%); }
    </style>

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.75" data-width="1080" data-height="1920">
      <div id="shake"><div id="push"><div id="grade">

             v57 from 0.3 s, motion-interpolated to a smooth 2.5x stretch (a plain playback-rate would step at 12 fps) -->
        <video id="shotA" class="clip shot" src="assets/shots/v57-gp-red-car-highway-v.mp4" muted playsinline data-start="0" data-duration="0.3" data-media-start="0" data-track-index="0"></video>
        <video id="shotA2" class="clip shot" src="media/v57-slowmo-v.mp4" muted playsinline data-start="0.3" data-duration="4.02" data-media-start="0" data-track-index="0"></video>
        <!-- the landing shot is a wide (DESIGN 11.21: never pay off on an upscaled 9:16 face close-up) -->
        <video id="shotB" class="clip shot" src="assets/shots/v38-freeway-dusk-v.mp4" muted playsinline data-start="4.32" data-duration="1.43" data-media-start="0.2" data-track-index="0"></video>

    <script>
      const CONFIG = {
        kicker: "Radio",
        // 8 stations clockwise from the top. art: palms | soul | block | talk | rock | night | bahia | deep (our own marks).
        stations: [
          { name: "Palms FM",       genre: "Pop hits",       art: "palms" },
          { name: "Soul Cruise",    genre: "Classic soul",   art: "soul" },
          { name: "808 Block",      genre: "West coast rap", art: "block" },
          { name: "Static Talk",    genre: "Talk radio",     art: "talk" },
          { name: "Desert Rock",    genre: "Classic rock",   art: "rock" },
          { name: "Night Drive FM", genre: "Synthwave",      art: "night" },
          { name: "Bahia 98",       genre: "Latin",          art: "bahia" },
          { name: "Deep End",       genre: "House",          art: "deep" }

        current: 0,                       // station playing when the wheel opens

        wheel: { cx: 540, cy: 780 },

        coin: { thick: 16, rim: "#FF9ACD", hot: "#FF4FA3" },   // the landed badge as a real coin: edge thickness (px) and chrome tint
        plate: { blur: 12, saturate: 0.45, brightness: 0.66, contrast: 1.15 },
        // lock = press; fly = the coin leaves for the strip (it lands flyDur later and the strip wipes open);
        // snap = the frame the plate comes back (keep it at collapse + 0.32 and start the next shot there)
        timing: { open: 0.3, ticks: [1.0, 1.15, 1.33, 1.56, 1.88], lock: 2.26, fly: 2.7, flyDur: 0.42, collapse: 4.0, snap: 4.32, stripOut: 5.22, end: 5.75 }
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const T = CONFIG.timing, $ = (s) => document.querySelector(s);
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));
        const NS = "http://www.w3.org/2000/svg", C = 420, RT = 278, RR = 376;
        const rad = (d) => d * Math.PI / 180;
        const svgEl = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
        const P = (r, a) => [C + r * Math.cos(rad(a)), C + r * Math.sin(rad(a))];
        const arcPath = (r, a1, a2) => { const p1 = P(r, a1), p2 = P(r, a2); return "M" + p1[0].toFixed(2) + " " + p1[1].toFixed(2) + " A" + r + " " + r + " 0 0 1 " + p2[0].toFixed(2) + " " + p2[1].toFixed(2); };

        // ---------- station marks (our own; drawn in SVG with the two library faces) ----------

            <g fill="none" stroke="#3A0F45" stroke-linecap="round"><path d="M106 150 C105 130 102 114 97 100" stroke-width="5.5"/>

            <circle cx="74" cy="74" r="61" fill="none" stroke="url(#sg${u})" stroke-width="2.5"/><circle cx="74" cy="74" r="55" fill="none" stroke="#F6C453" stroke-opacity=".45" stroke-width="1"/>

            <path d="M54 50 Q54 76 74 76 Q94 76 94 50" fill="none" stroke="#1B1D24" stroke-width="4" stroke-linecap="round"/><line x1="74" y1="76" x2="74" y2="86" stroke="#1B1D24" stroke-width="4"/>

          });

          // ---- LOCK-IN (payoff): the coin is pressed and springs (Coin3D); the rim light runs the wheel; one exposure beat ----
          const LA = -90 + 45 * LS;
          FT("#selO", { scale: 1 }, { scale: 0.985, duration: 0.06, ease: "power2.out" }, L);
          FT("#selO", { scale: 0.985 }, { scale: 1, duration: 0.3, ease: "back.out(2.2)" }, SPR);
          TK.forEach((t) => { if (t !== pick) FT(t.art, { filter: DIM }, { filter: DROP, duration: 0.3 }, SPR); });
          FT([ringGlow, ringCore, ringHot], { attr: { r: 88 } }, { attr: { r: 98 }, duration: 0.45, ease: "back.out(3.2)" }, SPR);
          FT(ringHot, { attr: { "stroke-width": 1.6 } }, { attr: { "stroke-width": 4.5 }, duration: 1 / 30, ease: "none" }, SPR);
          FT(ringHot, { attr: { "stroke-width": 4.5 } }, { attr: { "stroke-width": 2.2 }, duration: 0.4, ease: "power2.out" }, SPR + 3 / 30);
          // white-hot arc: from the pick, once round the full rim in 0.45 s, the tube itself flares as it passes
          FT(runG, { rotation: LA + 20 }, { rotation: LA + 20 + 360, duration: 0.45, ease: "power2.inOut" }, SPR);
          FT(runG, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, SPR);
          FT(runG, { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "power2.in" }, SPR + 0.4);
          FT(rimGlow, { attr: { opacity: 0.55, "stroke-width": 12 } }, { attr: { opacity: 1, "stroke-width": 20 }, duration: 0.08, ease: "power2.out" }, SPR);
          FT(rimGlow, { attr: { opacity: 1, "stroke-width": 20 } }, { attr: { opacity: 0.6, "stroke-width": 12 }, duration: 0.6, ease: "power2.out" }, SPR + 0.4);
          FT(rimCore, { attr: { stroke: "#FF5CAE" } }, { attr: { stroke: "#FFC2E1" }, duration: 0.08 }, SPR);
          FT(rimCore, { attr: { stroke: "#FFC2E1" } }, { attr: { stroke: "#FF5CAE" }, duration: 0.5, ease: "power2.out" }, SPR + 0.4);
          if (plate) Look.expose(tl, SPR, { target: "#shake", peak: 1.25, hold: 2 / 30, dur: 0.36, saturate: 1.12 });
          flashAt("#hubFlash", SPR + 0.02, 1, 0.5);
          FT("#hub", { scale: 1 }, { scale: 1.04, duration: 0.08, ease: "power2.out" }, SPR);
          FT("#hub", { scale: 1.04 }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, SPR + 0.08);
          eqDrive(HB, 11, 0.12, SPR, T.snap, 0.2);

          // ---- the coin lands in the strip socket (Coin3D), the socket ring lights, the strip wipes open from it ----
          FT("#sockRing", { opacity: 0 }, { opacity: 1, duration: 0.05 }, LAND);
          // the strip's clip is driven per frame (hidden -> wipe open from the socket -> free -> wipe shut into the socket)
          const EO = gsap.parseEase("expo.out"), P3I = gsap.parseEase("power3.in");
          const stripClip = (t) => {
            if (t < LAND) return CLIP(CLOSED + 200);
            if (t < LAND + 0.25) return CLIP(CLOSED + (WIPED - CLOSED) * EO((t - LAND) / 0.25));
            if (t < X) return "none";
            if (t < X + 0.22) return CLIP(OPEN + (CLOSED - OPEN) * P3I((t - X) / 0.22));
            return CLIP(CLOSED + 200);
          };
          np.style.clipPath = stripClip(0);
          Look.drive(tl, 0, T.end, (p) => { np.style.clipPath = stripClip(p * T.end); });
          FT(edge, { x: 94, opacity: 1 }, { x: 720, duration: 0.25, ease: "expo.out" }, LAND);
          tl.set(edge, { opacity: 0 }, LAND + 0.25);
          gsap.set(edge, { opacity: 0 });
          // strip type: masked rises only (nothing fades in)
          Look.reveal(tl, "#npTitle", LAND - 0.01, { by: "chars", dur: 0.38, stagger: 0.02 });
          Look.reveal(tl, "#npKickT", LAND - 0.02, { by: "words", dur: 0.34, stagger: 0.05 });
          Look.reveal(tl, "#npArtist", LAND + 0.05, { by: "words", dur: 0.4, stagger: 0.04 });
          gsap.set("#npDot", { scale: 0 });
          FT("#npDot", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, LAND);
          gsap.set("#npFill", { scaleX: 0.06 });
          FT("#npFill", { scaleX: 0.06 }, { scaleX: 0.42, duration: X - LAND, ease: "none" }, LAND);
          eqDrive(NB, 29, 0.15, LAND, X + 0.2, 0.3);

          // ---- collapse: the badges (the lit one last) fold into the hub, the disc zooms out with blur and is cut on the snap frame ----
          const K = T.collapse;
          FT(["#selU", "#selO"], { scale: 1 }, { scale: 0, duration: 0.2, ease: "power3.in" }, K);
          tl.set(["#selU", "#selO"], { opacity: 0 }, K + 0.2);
          let q = 0;
          for (let j = 1; j <= 8; j++) {
            const i = (LS + j) % 8, t = TK[i], el = t.el, at = K + q * 0.015, s0 = i === LS ? 1.12 : 1;
            FT(el, { scale: s0, x: 0, y: 0 }, { scale: 0.2, x: -t.dx, y: -t.dy, duration: 0.2, ease: "power3.in" }, at);
            Look.mblur(tl, el, at, 0.2, { x: 0, y: 0, to: [Math.abs(t.dx) / RT * 6, Math.abs(t.dy) / RT * 6], ease: "power3.in" });
            tl.set(el, { opacity: 0 }, at + 0.2);
            q++;
          }
          const DZ = K + 0.16;
          FT("#wheel", { scale: 1 }, { scale: 0.6, duration: T.snap - DZ, ease: "power2.in" }, DZ);
          FT("#wheel", { filter: "blur(0px)" }, { filter: "blur(8px)", duration: T.snap - DZ, ease: "power2.in" }, DZ);
          tl.set("#wheel", { opacity: 0 }, T.snap);
          if (plate) {
            FT("#grade", { filter: BLUR }, { filter: CLEAN, duration: 1 / 60, ease: "none" }, T.snap - 1 / 60);
            Look.expose(tl, T.snap, { target: "#shake", peak: 1.32, hold: 2 / 30, dur: 0.42, saturate: 1.16 });
            Look.impact(tl, T.snap, { shake: "#shake", amp: 6, dur: 0.28, flash: 0, zoom: 1.025 });
            Look.push(tl, "#push", T.snap, T.end - T.snap, { from: 1, to: 1.035 });
          }
          FT("#npRig", { y: 0 }, { y: -8, duration: 0.1, ease: "power2.out" }, T.snap);
          FT("#npRig", { y: -8 }, { y: 0, duration: 0.4, ease: "back.out(3)" }, T.snap + 0.1);

          // ---- strip leaves: wipes shut into its socket; the coin pops out after it (Coin3D, cut on its zero frame) ----
          tl.set("#sockRing", { opacity: 0 }, X + 0.22);

          // the coin is drawn from t on every render (and on hf-seek)
          Look.drive(tl, 0, T.end, (p) => coin.renderAt(p * T.end));

          // the coin canvas is a full-frame layer over the strip on purpose (the coin seats in the socket): tell the layout check
          document.querySelectorAll("#np, #np *, #hub, #hub *").forEach((n) => { n.setAttribute("data-layout-allow-occlusion", ""); n.setAttribute("data-layout-allow-overlap", ""); });

          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
