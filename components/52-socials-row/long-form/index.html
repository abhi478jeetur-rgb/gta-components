<!doctype html>
<!-- 52 Socials row, variant A: "THE END + socials" (16:9, 1920x1080, 30 fps, 6.9 s).
     The end tag of a long-form video: a red lacquer THE END slab swings in, then a row of our own social marks (play,
     camera, bird, music note) pops on as real 3D candy-lacquer tiles, and @everestchris6 rises under them. Payoff: the
     row presses like a button wave while one raking light crosses the slab, every tile and the handle.
     Variable: bg "plate" (sample footage) / "none" (transparent overlay). -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="media/glyphs.js"></script>
    <script src="media/marks.js"></script>
    <script src="media/social3d.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ov { position: absolute; inset: 0; }
      #gl { position: absolute; }
      .tx { position: absolute; white-space: nowrap; font-weight: 800; line-height: 1; }
      .tx .layer { position: absolute; left: 0; top: 0; white-space: nowrap; }
      .tx .ch { display: inline-block; will-change: transform; }
      .tx .back { color: #07090d; paint-order: stroke fill; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.6" data-width="1920" data-height="1080">
      <div id="shake"><div id="push">
        <video id="s1" class="clip shot" style="z-index:4" src="assets/shots/v29-plane-clouds-h.mp4" muted playsinline data-start="0" data-duration="1.0" data-media-start="0.25" data-track-index="0"></video>
        <video id="s2" class="clip shot" style="z-index:3" src="assets/shots/v07-biplane-sunset-h.mp4" muted playsinline data-start="0.93" data-duration="2.2" data-media-start="0" data-track-index="1"></video>
        <video id="s3" class="clip shot" style="z-index:2" src="assets/shots/v36-hills-city-view-h.mp4" muted playsinline data-start="3.06" data-duration="1.92" data-media-start="0" data-track-index="0"></video>
        <video id="s4" class="clip shot" style="z-index:1" src="assets/shots/v44-bridge-skyline-h.mp4" muted playsinline data-start="4.91" data-duration="1.69" data-media-start="0" data-track-index="1"></video>
      </div></div>
      <div id="ov" class="clip" data-start="0" data-duration="6.6" data-track-index="2" data-layout-allow-occlusion data-layout-allow-overflow>
        <div id="gl" data-layout-allow-occlusion data-layout-allow-overflow></div>
      </div>
    </div>
    <script>
      const CONFIG = {
        title: "THE END",
        handle: "@everestchris6",
        // our own marks only (media/marks.js): "play", "camera", "bird", "note"; colours are [top, bottom] of the lacquer
        socials: [
          { mark: "play",   colors: ["#FF5560", "#C8102E"] },
          { mark: "camera", colors: ["#FF78BE", "#D42A82"] },
          { mark: "bird",   colors: ["#5ADCFF", "#1688DC"] },
          { mark: "note",   colors: ["#3C3F4B", "#101116"] }
        ],
        slab: { cx: 960, top: 498, w: 548, h: 134, r: 32, colors: ["#FF4F59", "#C8102E"], cap: 70, tracking: 0.035 },
        row: { cy: 762, size: 150, gap: 54 },
        text: { size: 60, cy: 912 },
        colors: {
          face: "linear-gradient(180deg, #FFFFFF 0%, #FFFFFF 46%, #EEF1F6 64%, #D3D9E2 100%)",
          at: "linear-gradient(180deg, #FFE9A6 0%, #FFD23C 48%, #E59A1C 100%)",
          band: "rgba(255,214,140,.95)",
          stroke: "rgba(7,9,13,.94)"
        },
        timing: { slab: 0.2, tiles: 0.72, stagger: 0.12, handle: 1.22, payoff: 2.55, wave: 0.12, lock: 3.13, out: 5.65, end: 6.6 }
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const C = CONFIG, T = C.timing, $ = (s) => document.querySelector(s), PI = Math.PI;
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));
        const Ez = (n) => gsap.parseEase(n);
        const seg = (t, a, b, e) => { const p = t <= a ? 0 : t >= b ? 1 : (t - a) / (b - a); return e ? Ez(e)(p) : p; };
        const damp = (u, k, f) => (u <= 0 ? 1 : Math.exp(-k * u) * Math.cos(2 * PI * f * u));
        // a press: 0 -> 1 in 0.07 s, then a damped spring back through 0 (the rebound overshoots the other way)
        // press -> pressed -> released: down in 2 frames, held 3 frames, back.out(2.4) release (overshoots past rest)
        const BO = Ez("back.out(2.4)");
        const press = (b) => (b <= 0 ? 0 : b < 0.067 ? Math.sin(PI / 2 * b / 0.067) : b < 0.167 ? 1 : b < 0.567 ? 1 - BO((b - 0.167) / 0.4) : 0);

        // the GL canvas covers the lockup region only
        const GX = 360, GY = 330, GW = 1200, GH = 750;
        const host = $("#gl"); host.style.left = GX + "px"; host.style.top = GY + "px"; host.style.width = GW + "px"; host.style.height = GH + "px";

        const FACES = ["800 100px Inter", "900 100px Inter", "900 100px Archivo"];
        Promise.all(FACES.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
          const S3 = Social3D({ W: GW, H: GH, host, fov: 18, exposure: 1.0 });
          const slab = S3.slab({ cx: C.slab.cx - GX, top: C.slab.top - GY, w: C.slab.w, h: C.slab.h, r: C.slab.r, depth: 24, bevel: 11, bevelT: 10,
            colors: C.slab.colors, text: C.title, glyphs: window.END_GLYPHS, cap: C.slab.cap, tracking: C.slab.tracking, letterDepth: 7, letterBevel: 3.0,
            face: ["#EEF1F6", "#FFFFFF", "#FFFFFF"], letterGlow: 0.2 });
          const N = C.socials.length, pitch = C.row.size + C.row.gap;
          const tiles = C.socials.map((s, i) => S3.tile({ cx: 960 + (i - (N - 1) / 2) * pitch - GX, cy: C.row.cy - GY, size: C.row.size,
            colors: s.colors, mark: s.mark, markScale: 0.7, side: s.mark === "note" ? 0.9 : 0.8, shadow: 0.62, markGlow: 0.14 }));
          S3.U.uBandW.value = 7; S3.U.uBandFace.value = 0.45;

          // ---------- handle: an ink outline + contact-shadow layer under a satin face layer, per character ----------
          const ov = $("#ov");
          const tx = document.createElement("div"); tx.className = "tx"; tx.style.fontSize = C.text.size + "px"; tx.style.letterSpacing = "-0.015em";
          const back = document.createElement("div"), front = document.createElement("div");
          back.className = "layer back"; front.className = "layer front";
          back.style.webkitTextStroke = (C.text.size * 0.16).toFixed(1) + "px " + C.colors.stroke;
          back.style.textShadow = "0 3px 3px rgba(0,0,0,.35), 0 10px 24px rgba(0,0,0,.45)";
          Array.from(C.handle).forEach((ch, i) => [back, front].forEach((L) => {
            const s = document.createElement("span"); s.className = "ch"; s.textContent = ch; L.appendChild(s);
          }));
          tx.appendChild(back); tx.appendChild(front); ov.appendChild(tx);
          const tw = front.offsetWidth, th = front.offsetHeight;
          tx.style.width = tw + "px"; tx.style.height = th + "px";
          tx.style.left = (960 - tw / 2) + "px"; tx.style.top = (C.text.cy - th / 2) + "px";
          tx.style.clipPath = "inset(-40px -60px -16px -60px)";       // the characters rise out of this line
          tx.style.transformOrigin = "50% 55%";
          const fr = Array.from(front.children), bk = Array.from(back.children);
          fr.forEach((n, i) => {
            const x = n.offsetLeft, at = i === 0 && n.textContent === "@";
            n.style.backgroundImage = "linear-gradient(105deg, rgba(255,200,110,0) 34%, " + C.colors.band + " 46%, rgba(255,250,232,1) 50%, " + C.colors.band + " 54%, rgba(255,200,110,0) 66%), " + (at ? C.colors.at : C.colors.face);
            n.style.backgroundRepeat = "no-repeat";
            n.style.backgroundSize = (tw * 1.1) + "px " + th + "px, " + (at ? n.offsetWidth : tw) + "px " + th + "px";
            n.style.backgroundPosition = (-tw * 2 - x) + "px 0px, " + (at ? 0 : -x) + "px 0px";
            n.style.webkitBackgroundClip = "text"; n.style.backgroundClip = "text";
            n.style.color = "transparent"; n.style.webkitTextFillColor = "transparent";
            n.__x = x; n.__at = at;
          });
          const pairs = fr.map((f, i) => [bk[i], f]);
          [tx].concat(Array.from(tx.querySelectorAll("*"))).forEach((nd) => ["occlusion", "overlap", "overflow"].forEach((k) => nd.setAttribute("data-layout-allow-" + k, "")));

          // ---------- 3D poses from time ----------
          const P = T.payoff, X0 = T.out;
          function state(t) {
            // slab: swings down on its top hinge, drops into place, settles; glints first at the payoff; swings back up on exit
            const u = t - T.slab;
            if (u < 0) S3.pose(slab, { s: 0 });
            else {
              const xs = seg(t, X0 + 0.16, X0 + 0.46, "power2.in");
              const rx = -1.25 * damp(u, 4.4, 1.3) - 1.35 * xs;
              const dy = 150 * (1 - seg(t, T.slab, T.slab + 0.5, "back.out(1.5)")) + 70 * xs;
              const s = (0.78 + 0.22 * seg(t, T.slab, T.slab + 0.42, "power3.out")) * (1 - xs);
              S3.pose(slab, { rx, dy, s, sh: 1 - seg(u, 0, 0.3) * 0 });
            }
            // tiles: spin-pop up from below with overshoot; the press wave at the payoff; a slow idle; spin edge-on out
            tiles.forEach((n, i) => {
              const a = t - (T.tiles + i * T.stagger);
              if (a < 0) { S3.pose(n, { s: 0 }); return; }
              let s = 1 - damp(a, 6.2, 1.55);
              let ry = -PI * (1 - seg(a, 0, 0.62, "power3.out")) + 0.12 * Math.exp(-6 * Math.max(0, a - 0.62)) * Math.sin(2 * PI * 1.8 * Math.max(0, a - 0.62));
              let rx = 0.35 * damp(a, 5.5, 1.2) * (a < 0.6 ? 1 : 1);
              let dy = -70 * damp(a, 6.5, 1.25), dz = 0;
              // payoff: press -> pressed -> released as the light reaches each tile (scale 0.92, sy 0.9, 14 px in, 3-frame hold,
              // back.out(2.4) release), and its mark switches on: soft white -> lit white, and it stays lit
              const b = t - (P + T.wave * i), pr = press(b + 0.03);
              let sx = 1, sy = 1;
              s *= 1 - 0.08 * pr; sy *= 1 - 0.1 * Math.max(0, pr); dz -= 14 * Math.max(0, pr); rx += 0.16 * pr;
              n.markMat.emissiveIntensity = 0.14 + 0.24 * seg(b, -0.02, 0.06) + 0.45 * seg(b, -0.02, 0.03) * (1 - seg(b, 0.13, 0.4, "power2.out"));
              const idle = seg(t, T.lock + 0.3, T.lock + 1.1, "sine.inOut");
              rx += idle * 0.05 * Math.sin(2 * PI * 0.32 * t + i * 1.1);
              ry += idle * 0.08 * Math.sin(2 * PI * 0.27 * t + i * 0.9 + 1);
              dy += idle * 4 * Math.sin(2 * PI * 0.4 * t + i * 1.3);
              const xa = X0 + (N - 1 - i) * 0.07, e = seg(t, xa, xa + 0.3, "power2.in");
              ry += PI / 2 * e; s *= 1 - e; dy += 26 * e;
              S3.pose(n, { s, sx, sy, rx, ry, dy, dz });
            });
            // the light: one crisp '/' specular line crossing slab and row left -> right, over tile i exactly as it is pressed
            const v = pitch / T.wave, sBand = tiles[0].X - 0.45 * tiles[0].Y + v * (t - P);
            S3.U.uBand.value = sBand;
            S3.U.uBandAmp.value = 1.4 * seg(t, P - 0.3, P - 0.2) * (1 - seg(t, P + 3 * T.wave + 0.2, P + 3 * T.wave + 0.32));
            S3.rake.position.set(sBand + 120, GH * 0.9, 160);           // high and grazing: it lights top bevels, not the faces
            S3.rake.intensity = 0.35 * seg(t, P - 0.3, P - 0.2) * (1 - seg(t, P + 3 * T.wave + 0.2, P + 3 * T.wave + 0.32));
            // a 3-frame exposure peak on the 3D only, as each tile is pressed
            let ex = 0;
            for (let i = 0; i < N; i++) { const h = P + T.wave * i; ex = Math.max(ex, seg(t, h, h + 0.033) * (1 - seg(t, h + 0.133, h + 0.3, "power2.out"))); }
            S3.renderer.toneMappingExposure = 1.0 + 0.12 * ex;
          }
          const fast = (t) => (t > T.slab && t < T.slab + 0.55) || (t > T.tiles && t < T.tiles + 3 * T.stagger + 0.45) || (t > P - 0.05 && t < P + 3 * T.wave + 0.6) || (t > X0 && t < X0 + 0.5);
          function renderAt(t) { S3.render(state, t, fast(t) ? 5 : 1, 1 / 60); }

          const tl = gsap.timeline({ paused: true });
          Look.drive(tl, 0, T.end, (p) => renderAt(p * T.end));
          window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") renderAt(e.detail.time); });

          // handle: characters rise out of their line on a spring, 1-frame opacity attack, a short vertical smear
          pairs.forEach((pp, i) => gsap.set(pp, { yPercent: 135, opacity: 0 }));
          pairs.forEach((pp, i) => {
            const at = T.handle + i * 0.022;
            tl.set(pp, { opacity: 1 }, at);
            tl.fromTo(pp, { yPercent: 135 }, { yPercent: 0, duration: 0.5, ease: "back.out(1.6)", immediateRender: false }, at);
          });
          Look.mblur(tl, tx, T.handle, 0.42, { x: 0, y: 7, to: [0, 0] });
          // lock-in on the cut: the handle punches 1.0 -> 1.07 -> 1.0 (back.out(2.2)), its @ flares for 3 frames, and the light
          // that crossed the row runs along its satin face
          const L = T.lock, atEl = fr.filter((n) => n.__at);
          tl.fromTo(tx, { scale: 1 }, { scale: 1.07, duration: 0.08, ease: "power2.out", immediateRender: false }, L);
          tl.to(tx, { scale: 1, duration: 0.4, ease: "back.out(2.2)" }, L + 0.08);
          atEl.forEach((n) => {
            tl.fromTo(n, { filter: "brightness(1)" }, { filter: "brightness(1.45)", duration: 0.034, ease: "none", immediateRender: false }, L);
            tl.to(n, { filter: "brightness(1)", duration: 0.3, ease: "power2.out" }, L + 0.134);
          });
          Look.drive(tl, L - 0.04, 0.42, (p) => {
            const E = Ez("power1.inOut")(p), bx = tw * 1.15 - (tw * 2.3) * E;
            fr.forEach((n) => { if (n.__at) return; n.style.backgroundPosition = (bx - n.__x) + "px 0px, " + (-n.__x) + "px 0px"; });
          });
          // exit: characters drop back into their line, last first
          pairs.forEach((pp, i) => {
            const at = X0 + (pairs.length - 1 - i) * 0.012;
            tl.to(pp, { yPercent: 140, duration: 0.26, ease: "power3.in", immediateRender: false }, at);
            tl.set(pp, { opacity: 0 }, at + 0.27);
          });
          Look.mblur(tl, tx, X0 + 0.05, 0.34, { x: 0, y: 0, to: [0, 6] });
          Look.mblur(tl, tx, X0 + 0.39, 0.02, { x: 0, y: 0, to: [0, 0] });

          if (plate) Look.push(tl, "#push", 0, T.end, { to: 1.045 });
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
          renderAt(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
</body>
</html>
