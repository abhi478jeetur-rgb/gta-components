<!doctype html>
<!-- 52 Socials row, variant B: "Corner handles" (9:16, 1080x1920, 30 fps, 6 s).
     For a Short: two handle tags drop into the top corners, each a real 3D candy-lacquer mark tile (camera left, music note
     right) with a white enamel name plate that slides out from behind it. On the cut each tile is pressed and its colour
     floods the plate (ink handle flips to white behind a lit front), the tag locks in, then both hold quietly.
     Variable: bg "plate" (sample footage) / "none" (transparent overlay). -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="media/marks.js"></script>
    <script src="media/social3d.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ov { position: absolute; inset: 0; }
      #gl { position: absolute; left: 0; }
      .hd { position: absolute; white-space: nowrap; }
      .hd .in { position: absolute; left: 0; top: 0; white-space: nowrap; font-family: "Archivo"; font-weight: 800; line-height: 1;
        color: #0E0F13; will-change: transform; }
      .hd .ink { position: relative; white-space: nowrap; }
      .hd .lit { position: absolute; left: 0; top: 0; white-space: nowrap; color: #FFFFFF;
        text-shadow: 0 2px 0 rgba(60, 0, 30, 0.22), 0 3px 10px rgba(0, 0, 0, 0.22); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <div id="shake"><div id="push">
        <video id="s1" class="clip shot" style="z-index:4" src="assets/shots/v44-bridge-skyline-v.mp4" muted playsinline data-start="0" data-duration="1.73" data-media-start="0" data-track-index="0"></video>
        <video id="s2" class="clip shot" style="z-index:3" src="assets/shots/v17-deluxo-sunset-v.mp4" muted playsinline data-start="1.66" data-duration="1.6" data-media-start="0" data-track-index="1"></video>
        <video id="s3" class="clip shot" style="z-index:2" src="assets/shots/v29-plane-clouds-v.mp4" muted playsinline data-start="3.19" data-duration="1.02" data-media-start="0.25" data-track-index="0"></video>
        <video id="s4" class="clip shot" style="z-index:1" src="assets/shots/v11-yacht-v.mp4" muted playsinline data-start="4.14" data-duration="1.86" data-media-start="0" data-track-index="1"></video>
      </div></div>
      <div id="ov" class="clip" data-start="0" data-duration="6" data-track-index="2" data-layout-allow-occlusion data-layout-allow-overflow>
        <div id="gl" data-layout-allow-occlusion data-layout-allow-overflow></div>
      </div>
    </div>
    <script>
      const CONFIG = {
        // two corner handle tags stacked at the top of the Short: [mark tile][plate] seated in the top-left corner, and a
        // mirrored [plate][mark tile] seated against the right edge directly under it. Marks are our own (media/marks.js):
        // "play", "camera", "bird", "note". colors = the tile's lacquer; lit = the plate's lacquer once the tag is pressed;
        // at / litAt = the @ before / after
        tags: [
          { mark: "camera", handle: "@everestchris6", colors: ["#FF78BE", "#D42A82"], lit: ["#FF4FA6", "#B0105F"], at: "#E0308A", litAt: "#FFD84A", side: "left" },
          { mark: "note",   handle: "@everestchris6", colors: ["#3C3F4B", "#101116"], lit: ["#38AEF4", "#0A55A6"], at: "#0C82BA", litAt: "#FFD84A", side: "right" }
        ],
        safe: { left: 76, right: 932, top: 236 },   // inside the 9:16 safe zone (x 72-936, y 230-1480)
        tile: 150,                                  // mark tile size (px)
        plateH: 120,                                // name plate height (px)
        stackGap: 22,                               // gap between the two plates (px)
        tagW: 690,                                  // each tag's width (px): about 64% of the frame; the right tile clears the left tag
        text: { max: 92, min: 64, stretch: 66, weight: 800 },   // handle size auto-fits the tag between these (px), Archivo width %
        plate: ["#FFFFFF", "#D3D9E3"],              // white enamel, top -> bottom
        dock: 0.76,                                 // after the read, both tags spring back into their corners at this scale
        timing: { left: 0.2, right: 0.34, payoff: 1.73, echo: 0.1, dock: 3.0, out: 5.05, end: 6.0 }
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const C = CONFIG, T = C.timing, $ = (s) => document.querySelector(s), PI = Math.PI;
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));
        const Ez = (n) => gsap.parseEase(n);
        const seg = (t, a, b, e) => { const p = t <= a ? 0 : t >= b ? 1 : (t - a) / (b - a); return e ? Ez(e)(p) : p; };
        const damp = (u, k, f) => (u <= 0 ? 1 : Math.exp(-k * u) * Math.cos(2 * PI * f * u));
        const bump = (u, d) => (u <= 0 || u >= d ? 0 : Math.sin(PI * u / d));
        // press -> pressed -> released: down in 2 frames, held 3 frames, back.out(2.6) release (overshoots past rest)
        const BO = Ez("back.out(2.6)"), BL = Ez("back.out(2.2)");
        const press = (b) => (b <= 0 ? 0 : b < 0.067 ? Math.sin(PI / 2 * b / 0.067) : b < 0.167 ? 1 : b < 0.567 ? 1 - BO((b - 0.167) / 0.4) : 0);

        const TS = C.tile, PH = C.plateH;
        // tile centres (frame px): left tile in the top-left corner; right tile against the right edge, its plate one gap
        // under the left plate
        const cy0 = C.safe.top + TS / 2, cy1 = cy0 + PH + C.stackGap;
        const CEN = [[C.safe.left + TS / 2, cy0], [C.safe.right - TS / 2, cy1]];
        // the GL canvas spans the frame width and starts above the frame, so the tiles can fall in from off screen;
        // its camera axis sits between the two tags so both read square-on
        const midY = (cy0 + cy1) / 2;
        const GY = -260, GW = 1080, GH = Math.round(2 * (midY - GY));
        const host = $("#gl"); host.style.top = GY + "px"; host.style.width = GW + "px"; host.style.height = GH + "px";
        const ov = $("#ov");

        const FACES = ["800 100px Archivo", "900 100px Archivo"];
        Promise.all(FACES.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
          const GAP = Math.round(TS * 0.11), PADE = Math.round(PH * 0.26);
          // ---------- handle text: two layers (ink on enamel, white on lacquer) swapped by a clip at the fill front ----------
          const mk = (cls, tg, at, col) => {
            const d = document.createElement("div"); d.className = cls;
            Array.from(tg.handle).forEach((ch, k) => { const sp = document.createElement("span"); sp.textContent = ch; if (k === 0 && ch === "@") sp.style.color = at; d.appendChild(sp); });
            d.style.color = col; return d;
          };
          const tags = C.tags.map((tg) => {
            const hd = document.createElement("div"); hd.className = "hd";
            const inn = document.createElement("div"); inn.className = "in";
            const ink = mk("ink", tg, tg.at || "#0E0F13", "#0E0F13"), lit = mk("lit", tg, tg.litAt || "#FFFFFF", "#FFFFFF");
            inn.appendChild(ink); inn.appendChild(lit);
            inn.style.fontStretch = C.text.stretch + "%"; inn.style.fontWeight = C.text.weight; inn.style.letterSpacing = "-0.006em";
            hd.appendChild(inn); ov.appendChild(hd);
            return { tg, hd, inn, ink, lit, dir: tg.side === "right" ? -1 : 1 };
          });
          let fs = C.text.max;
          const widthAt = (f) => Math.max.apply(null, tags.map((x) => { x.inn.style.fontSize = f + "px"; return x.ink.offsetWidth; }));
          while (fs > C.text.min && TS + GAP + widthAt(fs) + PADE > C.tagW) fs -= 1;
          const tw = widthAt(fs);
          window.__fit = { fs, tw };
          const S3 = Social3D({ W: GW, H: GH, host, fov: 11, exposure: 1.12, key: 1.45 });
          // the shared band uniforms become the lock-in's bevel bloom: infinitely wide, bevels only (no face), warm white
          S3.U.uBand.value = 0; S3.U.uBandW.value = 1e6; S3.U.uBandFace.value = 0; S3.U.uBandAmp.value = 0; S3.U.uBandCol.value.setRGB(1.0, 0.95, 0.88);
          tags.forEach((x, i) => {
            const d = x.dir, tcx = CEN[i][0], tcy = CEN[i][1];
            x.tcx = tcx; x.tcy = tcy;
            x.tile = S3.tile({ cx: tcx, cy: tcy - GY, size: TS, colors: x.tg.colors, mark: x.tg.mark, markScale: 0.7,
              side: x.tg.mark === "note" ? 0.9 : 0.8, shadow: 0.55, markGlow: 0.16 });
            x.pw = C.tagW - TS / 2;
            x.plate = S3.plate({ x0: tcx, cy: tcy - GY, w: x.pw, h: PH, r: Math.round(PH * 0.26), depth: 14, bevel: 15, bevelT: 13, colors: C.plate, fill: x.tg.lit,
              clipX: tcx, dir: d, zFront: -15, glow: 0.7, faceK: 4.8, bandK: 1.0, shadow: 0.5, ao0: TS / 2, aoK: 0.42, whiteFloor: 0.25, fillSoft: 1.5, edgeW: 3.5, edgeOff: 3.5 });
            // DOM handle: on the plate, clipped at the tile's outer edge so it slides out from under the tile
            const h = x.inn.offsetHeight, tl0 = d > 0 ? tcx + TS / 2 + GAP : tcx - TS / 2 - GAP - tw;
            x.tl0 = tl0;
            x.hd.style.left = tl0 + "px"; x.hd.style.top = (tcy - h / 2 + fs * 0.035) + "px";
            x.hd.style.width = tw + "px"; x.hd.style.height = h + "px";
            // the lock-in pop scales text and plate together about the plate's root (the tile centre)
            x.inn.style.transformOrigin = (tcx - tl0).toFixed(1) + "px 50%";
            x.hd.style.clipPath = d > 0 ? "inset(-80px -60px -80px " + (-GAP + 4) + "px)" : "inset(-80px " + (-GAP + 4) + "px -80px -60px)";
            [x.hd, x.inn, x.ink, x.lit].forEach((nd) => { nd.setAttribute("data-layout-allow-overflow", ""); nd.setAttribute("data-layout-allow-occlusion", ""); });
          });

          const P = T.payoff, X0 = T.out;
          const t0s = [T.left, T.right];
          // plate slide: 0 = parked behind the tile (fully past the clip line), 1 = out. The retract is power2.in (not expo):
          // its last frames stay slow enough that the 16-sample shutter blur is a smooth smear, never stepped copies
          const slide = (t, i) => {
            const a = t0s[i] + 0.36, o = seg(t, a, a + 0.5, "expo.out"), r = seg(t, X0 + i * 0.08, X0 + i * 0.08 + 0.32, "power2.in");
            return o * (1 - r);
          };
          // ---------- the payoff: press -> flood -> lock ----------
          // each tile is pressed (fully down on the 1.73 cut for the left, one echo later for the right). As it springs back,
          // its colour floods the plate from the tile outwards: a lacquer front with a light line on the bevels, the handle
          // flipping from ink to white behind it. The full plate then blooms and the tag locks in with a small pop.
          // timed so the flood is already a quarter of the way out on the cut frame: the colour change IS the cut
          tags.forEach((x, i) => {
            x.F0 = P - 0.033 + i * T.echo; x.F1 = x.F0 + 0.26;   // the flood (a hard edge, posed at the frame time)
            x.hit = x.F0 - 0.167;                                 // press: down 2 frames, held 3, released as the flood starts
            x.L = x.F0 + 0.19;                                    // lock-in: pop + bevel bloom + lacquer bloom
          });
          const fillU = (t, x) => (TS * 0.15) + (x.pw + 30 - TS * 0.15) * seg(t, x.F0, x.F1, "power2.out");
          // the dock: after the read, both tags spring back into their corners (scale about the top-left / right edge),
          // and the lower one rises so the stack stays one gap apart
          const dockK = (t) => 1 - (1 - C.dock) * seg(t, T.dock, T.dock + 0.38, "back.out(1.4)");
          const cenAt = (i, k) => i === 0 ? [C.safe.left + TS / 2 * k, C.safe.top + TS / 2 * k]
            : [C.safe.right - TS / 2 * k, cy1 - TS / 2 + TS / 2 * k - (PH + C.stackGap) * (1 - k)];
          let tFrame = 0;
          const lock = (t, x) => { const b = t - x.L; return 1 + 0.045 * (seg(b, -0.08, 0, "power2.out") - (b <= 0 ? 0 : BL(Math.min(1, b / 0.4)))); };
          const bloom = (t, x) => { const b = t - x.L; return seg(b, -0.067, 0) * (1 - seg(b, 0.1, 0.42, "power2.out")); };
          const edge = (t, x) => seg(t, x.F0 - 0.034, x.F0) * (1 - seg(t, x.F1 - 0.07, x.F1 + 0.04));
          // the drop: falls in from above the frame, lands and bounces; the plate and handle ride the same offset, so the
          // parked plate never peeks out above a tile that is still settling
          const dropY = (t, i) => { const u = t - t0s[i]; return u < 0 ? 0 : (620 + 160 * i) * damp(u, 7.2, 1.05); };
          function state(t) {
            tags.forEach((x, i) => {
              const u = t - t0s[i];
              if (u < 0) { S3.pose(x.tile, { s: 0 }); S3.pose(x.plate, { hide: true }); return; }
              // the drop: falls in from above the frame with a part turn into the light, lands with a squash and a small bounce
              const dy0 = dropY(t, i); let dy = dy0;
              let ry = -0.6 * PI * (1 - seg(u, 0, 0.55, "power3.out")) + 0.1 * Math.exp(-6 * Math.max(0, u - 0.55)) * Math.sin(2 * PI * 1.9 * Math.max(0, u - 0.55));
              const sq = bump(u - 0.22, 0.14);
              let sx = 1 + 0.09 * sq, sy = 1 - 0.12 * sq, s = 1, rx = 0, dz = 0;
              // payoff press: scale 0.83, a little in, top rocks forward, held 3 frames, released with overshoot;
              // its mark switches on (3-frame flare) and stays lit
              const hb = t - x.hit, pr = press(hb);
              s *= 1 - 0.17 * pr; sy *= 1 - 0.03 * Math.max(0, pr); dz -= 8 * Math.max(0, pr); rx += 0.1 * pr;   // dz stays small: the pressed face must stay in front of the plate (z -15)
              x.tile.markMat.emissiveIntensity = 0.16 + 0.34 * seg(hb, 0.03, 0.1) + 0.6 * seg(hb, 0.03, 0.07) * (1 - seg(hb, 0.17, 0.5, "power2.out"));
              // the quiet hold: a barely-there tilt so the lacquer keeps a live highlight
              const idle = seg(t, P + 0.9, P + 1.7, "sine.inOut");
              rx += idle * 0.035 * Math.sin(2 * PI * 0.3 * t + i * 1.7);
              ry += idle * 0.06 * Math.sin(2 * PI * 0.24 * t + i * 2.1 + 0.6);
              // exit: after the plate retracts, the tile spins and lifts back out of the frame
              const xa = X0 + 0.3 + i * 0.08, e = seg(t, xa, xa + 0.42, "back.in(1.5)");
              dy += (660 + 160 * i) * e; ry += 0.5 * PI * seg(t, xa, xa + 0.42, "power2.in");
              const k = dockK(t), cc = cenAt(i, k), ddx = cc[0] - x.tcx, ddy = cc[1] - x.tcy;
              S3.pose(x.tile, { s: s * k, sx, sy, rx, ry, dx: ddx, dy: dy - ddy, dz });
              const sl = slide(t, i), lk = lock(t, x);
              // the plate's root tracks the tile's current edge (45% in, clear of its rounded corners), so a pressed, smaller tile never uncovers the part
              // of the plate parked behind it; its baked contact shadow follows the same edge
              const halfW = TS / 2 * s * k * sx * Math.max(0.2, Math.abs(Math.cos(ry)));
              S3.clipAt(x.plate, cc[0] + x.dir * 0.45 * halfW);
              const F = x.plate.FU;
              F.uAO0.value = halfW; F.uTileX.value = S3.toX(cc[0]);
              S3.pose(x.plate, { dx: ddx - x.dir * (x.pw + 8) * k * (1 - sl), dy: dy0 - ddy, s: k, sx: lk, sy: lk, hide: sl <= 0.001 });
              // the flood front and its light line are posed at the frame time (never smeared across shutter sub-frames), so
              // the edge stays one hard line that the handle's colour flip can match exactly
              F.uFill.value = fillU(tFrame, x);
              F.uEdgeAmp.value = 3.2 * edge(tFrame, x);
              F.uLitGlow.value = 0.12 * bloom(t, x);
              x.plate.mat.emissiveIntensity = 0.7; x.plate.capM.emissiveIntensity = 0.7;
            });
            // a 3-frame exposure peak on the 3D only, as each tag locks in
            let ex = 0;
            tags.forEach((x) => { ex = Math.max(ex, bloom(t, x)); });
            S3.renderer.toneMappingExposure = 1.12 * (1 + 0.16 * ex);
            S3.U.uBandAmp.value = 1.1 * ex;      // the lock's light: a 3-frame bloom on every bevel (tiles, marks, plates)
          }
          const n3d = (t) => (t > X0 - 0.02 && t < X0 + 0.85) ? 16 : (t > T.left && t < T.right + 0.95) ? 16 : (t > P - 0.25 && t < P + 0.75) ? 9 : (t > T.dock && t < T.dock + 0.45) ? 5 : 1;
          function renderAt(t) {
            tFrame = t;
            S3.render(state, t, n3d(t), 1 / 60);
            tags.forEach((x, i) => {
              const sl = slide(t, i), lk = lock(t, x), k = dockK(t), cc = cenAt(i, k);
              x.inn.style.transform = "translate(" + (cc[0] - x.tcx - x.dir * (x.pw + 8) * k * (1 - sl)).toFixed(2) + "px, " + (cc[1] - x.tcy - dropY(t, i)).toFixed(2) + "px) scale(" + (lk * k).toFixed(4) + ")";
              // the handle is clipped at the tile's current outer edge (it moves when the tag docks)
              const ex = cc[0] + x.dir * (TS / 2 * k + 4);
              x.hd.style.clipPath = x.dir > 0 ? "inset(-80px -60px -80px " + (ex - x.tl0).toFixed(1) + "px)" : "inset(-80px " + (x.tl0 + tw - ex).toFixed(1) + "px -80px -60px)";
              // ink / white swap at the flood front, in the text's own (pre-transform) coordinates; no overlap, no fade
              const fx = (x.dir > 0 ? x.tcx + fillU(t, x) : x.tcx - fillU(t, x)) - x.tl0;
              const W = tw, cl = (a, b) => "inset(-30px " + b.toFixed(1) + "px -30px " + a.toFixed(1) + "px)";
              if (x.dir > 0) { x.lit.style.clipPath = cl(-60, Math.min(W + 60, W - fx)); x.ink.style.clipPath = cl(Math.min(W + 60, fx), -60); }
              else { x.lit.style.clipPath = cl(Math.min(W + 60, fx), -60); x.ink.style.clipPath = cl(-60, Math.min(W + 60, W - fx)); }
              const f = bloom(t, x);
              const at = x.lit.firstChild;
              if (at) at.style.filter = f > 0.001 ? "brightness(" + (1 + 0.35 * f).toFixed(3) + ")" : "none";
              x.hd.style.opacity = sl > 0.001 ? "1" : "0";
            });
          }

          const tl = gsap.timeline({ paused: true });
          Look.drive(tl, 0, T.end, (p) => renderAt(p * T.end));
          window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") renderAt(e.detail.time); });
          if (plate) Look.push(tl, "#push", 0, T.end, { to: 1.04 });
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
          renderAt(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
</body>
</html>
