<!doctype html>
<!-- 53 Freeze-frame intro, variant A "Character freeze" (16:9 long-form, 1920x1080, 30 fps, 4.8 s). Full kind: it always shows footage.
     The shot plays, FREEZES on the beat (exposure hit + shake, letterbox bars slam in, the frame snaps down into them, the world
     drops into a cool steel grade from his face outward while he stays in full warm colour with a gold light-wrap, a gold keyline
     zips around him from the crown), his name slams in as real 3D gold lettering BEHIND his head (Three.js, media/title3d.js),
     locks in with a raking light, the role plate wipes in; then everything releases and the same shot plays on from the same frame.
     See README.md, DECISIONS.md and gta/DESIGN.md. -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="media/glyphs.js"></script>
    <script src="media/outline.js"></script>
    <script src="media/title3d.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; background: #000;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #shake2, #shake3, #expo, .cam, .par { position: absolute; inset: 0; }
      .cam { transform-origin: 50% 0%; }
      .shot, .lay { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
      .lay { visibility: hidden; }
      #grade { clip-path: circle(0px at 1316px 330px); }
      .bar { position: absolute; left: -40px; right: -40px; height: 132px; background: #000; }
      #barT { top: 0; }
      #barB { bottom: 0; }
      #titleWrap { position: absolute; inset: 0; }
      #kl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; visibility: hidden; }
      /* role plate: a slanted ink slab in a gold bevel frame */
      #plate { position: absolute; left: 186px; top: 350px; height: 88px; visibility: hidden;
        clip-path: inset(-20px 100% -40px -20px); filter: drop-shadow(0 14px 22px rgba(0,0,0,.55)); }
      .pl-frame { position: relative; height: 88px; padding: 4px; border-radius: 6px;
        background: linear-gradient(180deg, #FFF1C2 0%, #F6C453 30%, #C8862A 62%, #7A4A12 100%); }
      .pl-face { position: relative; height: 80px; display: flex; align-items: center; gap: 0; padding: 0 34px 0 58px; border-radius: 3px; overflow: hidden;
        background: linear-gradient(180deg, #2B2217 0%, #120E09 46%, #060504 100%);
        box-shadow: inset 0 2px 0 rgba(255,236,190,.28), inset 0 -4px 6px rgba(0,0,0,.7); }
      .pl-cap { position: absolute; left: 0; top: 0; bottom: 0; width: 30px;
        background: linear-gradient(180deg, #FFF1C2 0%, #F6C453 38%, #C8862A 72%, #8A5516 100%); box-shadow: inset -3px 0 4px rgba(0,0,0,.35); }
      .pl-cap::after { content: ""; position: absolute; right: 6px; top: 50%; width: 10px; height: 10px; margin-top: -5px; background: #120E09; transform: rotate(45deg); }
      .pl-txt { position: relative; overflow: hidden; height: 64px; display: flex; align-items: center; }
      .pl-txt span { display: inline-block; font: 900 54px/1 "Archivo"; font-stretch: 100%; letter-spacing: 0.035em; color: #FFFFFF; white-space: pre; }
      .pl-txt .k { color: #F6C453; margin-right: 0.28em; }
      .pl-sheen { position: absolute; top: -10px; bottom: -10px; width: 120px; left: 0; transform: translateX(-200px) skewX(-18deg);
        background: linear-gradient(90deg, rgba(255,247,220,0) 0%, rgba(255,247,220,.42) 50%, rgba(255,247,220,0) 100%); mix-blend-mode: screen; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.8" data-width="1920" data-height="1080">
      <div id="shake"><div id="shake2"><div id="shake3"><div id="expo">
        <div id="camBg" class="cam">
          <!-- lead-in: Lamar on the street, then the two-shot; the freeze holds frame 24 of v06; the same shot resumes from it.
               Consecutive clips overlap by 2 frames (the incoming one starts early underneath; lesson 25). -->
          <video id="shotA" class="clip shot" src="assets/shots/v05-franklin-lamar-street-h.mp4" muted playsinline data-start="0" data-duration="0.7667" data-media-start="0.25" data-track-index="0"></video>
          <video id="shotB" class="clip shot" src="assets/shots/v06-franklin-lamar-portrait-h.mp4" muted playsinline data-start="0.7" data-duration="0.8667" data-media-start="0" data-track-index="1"></video>
          <video id="shotC" class="clip shot" src="assets/shots/v06-franklin-lamar-portrait-h.mp4" muted playsinline data-start="3.9333" data-duration="0.8667" data-media-start="0.7333" data-track-index="2"></video>
          <img id="still" class="lay" src="media/frz.png" alt="" />
          <div id="gradeP" class="par"><img id="grade" class="lay" src="media/grade.png" alt="" /></div>
        </div>
        <div id="barT" class="bar"></div>
        <div id="titleWrap"></div>
        <div id="camFg" class="cam">
          <div id="subjP" class="par">
            <svg id="kl" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
              <defs><linearGradient id="klg" gradientUnits="userSpaceOnUse" x1="0" y1="190" x2="0" y2="980">
                <stop offset="0" stop-color="#FFF4C8" /><stop offset=".35" stop-color="#F6C453" /><stop offset="1" stop-color="#B9761F" />
              </linearGradient></defs>
              <g fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path id="klGL" stroke="#FFB43C" stroke-opacity=".32" stroke-width="30" d="M0 0" />
                <path id="klGR" stroke="#FFB43C" stroke-opacity=".32" stroke-width="30" d="M0 0" />
                <path id="klL" stroke="url(#klg)" stroke-width="15" d="M0 0" />
                <path id="klR" stroke="url(#klg)" stroke-width="15" d="M0 0" />
              </g>
            </svg>
            <img id="subj" class="lay" src="media/subj.png" alt="" />
          </div>
        </div>
        <div id="barB" class="bar"></div>
      </div></div></div></div>
      <div id="plate"><div class="pl-frame"><div class="pl-face">
        <div class="pl-cap"></div>
        <div class="pl-txt"><span class="k" id="plK"></span><span id="plW"></span></div>
        <div class="pl-sheen" id="plSheen"></div>
      </div></div></div>
    </div>
    <script>
      const CONFIG = {
        name: "FRANKLIN",                    // the 3D title (A-Z, 0-9 and . , ' ! ? - & : #)
        roleKicker: "THE",                   // gold word on the plate
        role: "HUSTLER",                     // white word on the plate
        freeze: { at: 1.50, release: 4.00, end: 4.80 },   // freeze-frame window (s); the still is frame 24 of v06 (media 0.80 s)
        face: [1316, 330],                   // his face on the still (the grade spreads out from here and collapses back into it)
        cam: { scale: 1.08, drop: 80, creep: 0.02 },      // the snap into the letterbox: scale from the top edge + drop (px)
        title: { cx: 960, cy: 186, maxInk: 1600, depth: 34, bevel: 7, shear: 0.2, tilt: 0.1, ink: 8.5,
                 colors: { face: ["#FFF7DD", "#F3C766", "#FFE9A6", "#C98A2B", "#6B3F0E"], lip: "#FFE7A8", side: ["#8A5516", "#140B03"] } },
        timing: { slamDelay: 0.14, stagger: 0.035, slamDur: 0.13, rakeDur: 0.55, plateAfterLock: 0.08 }
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        // full kind: bg "none" keeps the footage (the freeze is a treatment of the footage itself)
        const Z = CONFIG.freeze, TF = Z.at, TR = Z.release, END = Z.end, FR = 1 / 30, $ = (s) => document.querySelector(s);
        $("#plK").textContent = CONFIG.roleKicker; $("#plW").textContent = CONFIG.role;
        const O = window.FRZ_OUTLINE;
        ["L", "R"].forEach((k) => {
          const d = k === "L" ? O.left : O.right, len = k === "L" ? O.lenL : O.lenR;
          ["#kl" + k, "#klG" + k].forEach((id) => { const p = $(id); p.setAttribute("d", d); p.style.strokeDasharray = len + " " + (len + 40); p.style.strokeDashoffset = String(len); });
        });
        const FACES = ["900 100px Archivo", "900 100px Inter"];
        Promise.all(FACES.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
          const tl = gsap.timeline({ paused: true });
          const Tm = CONFIG.timing, TT = CONFIG.title;

          // ---------- 3D title ----------
          const t3 = Title3D({ W: 1920, H: 1080, glyphs: window.FRZ_GLYPHS, text: CONFIG.name, cx: TT.cx, cy: TT.cy, maxInk: TT.maxInk,
            depth: TT.depth, bevel: TT.bevel, shear: TT.shear, tilt: TT.tilt, inkPx: TT.ink, colors: TT.colors, shadow: 0.6,
            timing: { slam0: TF + Tm.slamDelay, stagger: Tm.stagger, slamDur: Tm.slamDur, rakeDur: Tm.rakeDur, holdEnd: TR - 0.36,
                      exit0: TR - 0.36, exitStagger: 0.02, exitDur: 0.22 } });
          $("#titleWrap").appendChild(t3.canvas);
          const LOCK = t3.lockAt;
          Look.drive(tl, 0, END, (p) => t3.renderAt(p * END));

          // ---------- the freeze hit ----------
          tl.set(["#still"], { visibility: "visible" }, TF);
          Look.expose(tl, TF, { target: "#expo", peak: 1.32, hold: 2 * FR, dur: 0.3, saturate: 1.15 });
          Look.impact(tl, TF, { shake: "#shake", amp: 9, dur: 0.3, flash: 0, zoom: 1.025 });
          // letterbox slams in; the frozen frame snaps down into it (the bars lead, so no frame edge ever shows)
          tl.fromTo("#barT", { yPercent: -101 }, { yPercent: 0, duration: 0.14, ease: "expo.out", immediateRender: false }, TF);
          tl.fromTo("#barB", { yPercent: 101 }, { yPercent: 0, duration: 0.14, ease: "expo.out", immediateRender: false }, TF);
          const C = CONFIG.cam;
          tl.fromTo(".cam", { scale: 1, y: 0 }, { scale: C.scale, y: C.drop, duration: 0.18, ease: "expo.out", immediateRender: false }, TF);
          tl.to(".cam", { scale: C.scale + C.creep, duration: TR - TF - 0.18, ease: "sine.inOut" }, TF + 0.18);
          // desaturate snap: the cool steel grade spreads out from his face as a hard wave front; he stays warm
          const [fx, fy] = CONFIG.face;
          tl.set(["#grade", "#subj", "#kl"], { visibility: "visible" }, TF + FR);
          tl.fromTo("#grade", { clipPath: `circle(0px at ${fx}px ${fy}px)` }, { clipPath: `circle(2300px at ${fx}px ${fy}px)`, duration: 0.24, ease: "expo.out", immediateRender: false }, TF + FR);
          // gold keyline zips down both sides from the crown
          tl.fromTo(["#klL", "#klGL"], { strokeDashoffset: O.lenL }, { strokeDashoffset: 0, duration: 0.36, ease: "expo.out", immediateRender: false }, TF + 0.05);
          tl.fromTo(["#klR", "#klGR"], { strokeDashoffset: O.lenR }, { strokeDashoffset: 0, duration: 0.36, ease: "expo.out", immediateRender: false }, TF + 0.05);
          // 2.5D: through the hold he drifts towards camera a touch faster than the world behind him
          gsap.set(".pl-txt span", { yPercent: 115 });   // r04: the words start below their mask, so the wipe never opens on them
          gsap.set("#plate", { skewX: -12 }); gsap.set("#barT", { yPercent: -101 }); gsap.set("#barB", { yPercent: 101 }); gsap.set("#subjP", { transformOrigin: "1320px 700px" }); gsap.set("#gradeP", { transformOrigin: "1320px 700px" });
          tl.fromTo("#subjP", { scale: 1 }, { scale: 1.03, duration: TR - TF - 0.55, ease: "sine.inOut", immediateRender: false }, TF + 0.2);
          tl.fromTo("#gradeP", { scale: 1 }, { scale: 1.01, duration: TR - TF - 0.55, ease: "sine.inOut", immediateRender: false }, TF + 0.2);

          // ---------- lock-in (payoff): the last letter lands; light rakes the bevels (in title3d), a small punch ----------
          Look.impact(tl, LOCK, { shake: "#shake2", amp: 5, dur: 0.24, flash: 0, zoom: 1.012 });

          // ---------- role plate ----------
          const PIN = LOCK + Tm.plateAfterLock;
          tl.set("#plate", { visibility: "visible" }, PIN);
          tl.fromTo("#plate", { clipPath: "inset(-20px 100% -40px -20px)", x: -36 }, { clipPath: "inset(-20px -20px -40px -20px)", x: 0, duration: 0.3, ease: "expo.out", immediateRender: false }, PIN);
          tl.fromTo([".pl-txt span"], { yPercent: 115 }, { yPercent: 0, duration: 0.42, ease: "back.out(1.6)", stagger: 0.06, immediateRender: false }, PIN + 0.06);
          tl.fromTo("#plSheen", { x: -200 }, { x: 720, duration: 0.7, ease: "power2.inOut", immediateRender: false }, PIN + 0.3);

          // ---------- release ----------
          tl.to("#plate", { clipPath: "inset(-20px 100% -40px -20px)", x: -24, duration: 0.16, ease: "power2.in" }, TR - 0.44);
          tl.set("#plate", { visibility: "hidden" }, TR - 0.28);
          tl.to(["#klL", "#klGL"], { strokeDashoffset: O.lenL, duration: 0.16, ease: "power2.in" }, TR - 0.22);
          tl.to(["#klR", "#klGR"], { strokeDashoffset: O.lenR, duration: 0.16, ease: "power2.in" }, TR - 0.22);
          tl.to(["#subjP", "#gradeP"], { scale: 1, duration: 0.24, ease: "power2.inOut" }, TR - 0.33);
          tl.to("#grade", { clipPath: `circle(0px at ${fx}px ${fy}px)`, duration: 0.16, ease: "power3.in" }, TR - 0.16);
          tl.set(["#still", "#grade", "#subj", "#kl"], { visibility: "hidden" }, TR);
          // the same shot plays on: the frame rises out of the letterbox as the bars retract (same ease, bars lead)
          tl.to(".cam", { scale: 1, y: 0, duration: 0.26, ease: "power3.inOut" }, TR);
          tl.to("#barT", { yPercent: -101, duration: 0.26, ease: "power3.inOut" }, TR);
          tl.to("#barB", { yPercent: 101, duration: 0.26, ease: "power3.inOut" }, TR);
          Look.impact(tl, TR, { shake: "#shake3", amp: 4, dur: 0.2, flash: 0, zoom: 1.0 });

          tl.set({}, {}, END);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
</body>
</html>
