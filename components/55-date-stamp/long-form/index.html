<!doctype html>
<!-- GTA-niche 55 Date stamp, variant A: "Date and time" (16:9 long-form, 1920x1080, 30 fps, 5.2 s).
     The creators' centred two-line date/clock stamp ("NOV 18th 2026 / 23:59"), rebuilt as real geometry (Three.js: extruded,
     bevelled Archivo outlines in white clearcoat enamel with brushed-steel walls and a cast contact shadow). It types on
     behind a glossy caption-yellow caret, the colon ticks, and on the cut the clock flips 7:59 -> 8:00 as three mechanical
     drums carrying right to left; the time locks into caption-yellow metal behind a hot light front, a raking key and bloom.
     It clears with a short slanted wipe whose edge is a light band on the letters, cut on the zero frame.
     Footage is GTA V at sunset and dusk, so the copy is 8 PM. See ../DECISIONS.md. Variable: bg "plate" / "none". -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="media/glyphs.js"></script>
    <script src="media/card3d.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Archivo", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #s1 { z-index: 4; } #s2 { z-index: 3; } #s3 { z-index: 2; } #s4 { z-index: 1; } #s5 { z-index: 0; }
      #bounce, #t3d { position: absolute; pointer-events: none; }
      #bounce { opacity: 0; mix-blend-mode: screen; z-index: 6; }
      #t3d { left: 0; top: 0; width: 1920px; height: 1080px; z-index: 7; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.2" data-width="1920" data-height="1080">
      <div id="shake"><div id="push">
        <!-- each incoming shot starts 2 frames early underneath the outgoing one (no late-painting cut frame) -->
        <video id="s1" class="clip shot" src="assets/shots/v38-freeway-dusk-h.mp4" muted playsinline data-start="0" data-duration="1.5333" data-media-start="0.25" data-track-index="0"></video>
        <video id="s2" class="clip shot" src="assets/shots/v17-deluxo-sunset-h.mp4" muted playsinline data-start="1.4667" data-duration="1.1533" data-media-start="0.2" data-track-index="1"></video>
        <video id="s3" class="clip shot" src="assets/shots/v12-heli-city-dusk-h.mp4" muted playsinline data-start="2.5533" data-duration="1.3467" data-media-start="0.2" data-track-index="2"></video>
        <video id="s4" class="clip shot" src="assets/shots/v41-smokestacks-dusk-h.mp4" muted playsinline data-start="3.8333" data-duration="0.9167" data-media-start="0.1" data-track-index="3"></video>
        <video id="s5" class="clip shot" src="assets/shots/v24-sunset-powerlines-h.mp4" muted playsinline data-start="4.6833" data-duration="0.5167" data-media-start="0.5" data-track-index="4"></video>
      </div></div>
      <div id="bounce"></div>
      <div id="t3d"></div>
    </div>
    <script>
      const CONFIG = {
        day: "SATURDAY",
        // H:MM or HH:MM. Each digit is a mechanical drum (the digit after ":" is a 0-5 wheel). On the tick every drum rolls
        // forward to `to`, carrying right to left. suffix "" for a 24 h clock.
        time: { from: "7:59", to: "8:00", suffix: "PM" },
        place: "LOS SANTOS",
        type: {
          stamp: { set: "stamp", size: 112, maxInk: 1180, tracking: -0.012, depth: 0.30, bevel: 0.075, tilt: 0.2 },
          place: { set: "place", size: 70, tracking: 0.26, depth: 0.30, bevel: 0.08, tilt: 0.2 },
          wordGap: 0.30,                       // em between the day and the time
          cx: 960, cy: 556, gap: 36            // block centre (the evidence's mid-frame position) and the line gap
        },
        colors: {
          white: { face: ["#FFFFFF", "#CDD4DE"], side: ["#8A93A2", "#1C2028"] },
          state: { face: ["#FFF6B8", "#FFD23C", "#EFA514", "#FFD54A", "#E0920F"], facePos: [0, 0.4, 0.53, 0.6, 1], lip: "#FFE07A", side: ["#C07A00", "#3A1E00"], hot: "#FFF6D0" },
          caret: "#FFD23C", glow: "255,196,60"
        },
        timing: { caret: 0.16, type: 0.30, cps: 0.04, wordPause: 0.07, linePause: 0.1, blinkOff: [1.55, 2.05], caretOff: 2.22,
          lock: 2.62, out: 4.39, outDur: 0.36, end: 5.2 }
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const $ = (s) => document.querySelector(s);
        const C = CONFIG, TY = C.type, TM = C.timing, FR = 1 / 30;
        const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));
        Promise.all([document.fonts.load("900 100px Archivo")]).then(() => document.fonts.ready).then(() => {
          const G = window.CARD_GLYPHS;
          // ---------- the time line: digits become drums ('%' = the 0-5 minute-tens wheel) ----------
          const fromD = C.time.from.replace(/\D/g, "").split("").map(Number), toD = C.time.to.replace(/\D/g, "").split("").map(Number);
          const colonAt = C.time.from.indexOf(":");
          const timeText = C.time.from.split("").map((ch, i) => (ch === ":" ? ":" : i === colonAt + 1 ? "%" : "#")).join("") + (C.time.suffix ? " " + C.time.suffix : "");
          const wheel = timeText.replace(/[^#%]/g, "").split("").map((c) => (c === "%" ? 6 : 10));
          const steps = fromD.map((f, k) => ((toD[k] - f) % wheel[k] + wheel[k]) % wheel[k]);
          // ---------- fit the row (day + time) to maxInk, then place both lines on the ink centre ----------
          const S = TY.stamp, Pl = TY.place;
          const m1 = (txt) => Card3D.measure(G[S.set], txt, 1000, S.tracking);
          const dW0 = m1(C.day).inkW, tW0 = m1(timeText).inkW, row0 = dW0 + TY.wordGap * 1000 + tW0;
          const size = Math.min(S.size, S.maxInk / (row0 / 1000)), k = size / 1000;
          const dW = dW0 * k, tW = tW0 * k, gapW = TY.wordGap * size, rowW = dW + gapW + tW;
          const cap = G[S.set].cap * k, pcap = G[Pl.set].cap * Pl.size / 1000;
          const blockH = cap + TY.gap + pcap, row1 = TY.cy - blockH / 2 + cap / 2, row2 = TY.cy + blockH / 2 - pcap / 2;
          const left = TY.cx - rowW / 2;
          const dCX = left + dW / 2, tCX = left + dW + gapW + tW / 2;
          const eBack = gsap.parseEase("back.out(2.2)"), eKey = gsap.parseEase("back.out(1.8)"), eExpo = gsap.parseEase("expo.out"), eSine = gsap.parseEase("sine.inOut"),
            eP2i = gsap.parseEase("power2.in"), eP2io = gsap.parseEase("power2.inOut"), eP3io = gsap.parseEase("power3.inOut");
          // ---------- type-on order: day, time, suffix, then the place on line 2 ----------
          const seq = []; let tc = TM.type;
          const push = (line, n, chars) => { let si = 0; for (let i = 0; i < chars.length; i++) { if (chars[i] === " ") { tc += TM.wordPause; continue; } seq.push({ line, slot: si++, t: tc }); tc += TM.cps; } };
          push("d", 0, C.day); tc += TM.wordPause; push("t", 0, timeText); tc += TM.linePause; push("p", 0, C.place);
          const typedAt = {}; seq.forEach((e) => { (typedAt[e.line] = typedAt[e.line] || [])[e.slot] = e.t; });
          const typeEnd = seq[seq.length - 1].t;
          // ---------- the tick: drums roll forward and carry right to left; lock = the hour drum reaching its mark ----------
          const RIP = 0.035, ROLL = 0.16, nD = wheel.length;
          const firstOne = (() => { for (let p = 0; p <= 1; p += 0.002) if (eBack(p) >= 1) return p; return 1; })();
          const tick = TM.lock - ((nD - 1) * RIP + firstOne * ROLL);
          function drums(t) {
            return fromD.map((f, j) => {
              const order = nD - 1 - j;                                    // units first, then tens, then the hour
              const t0 = tick + order * RIP, p = clamp((t - t0) / ROLL, 0, 1);
              const pre = t < t0 && t > t0 - 0.07 ? -0.06 * Math.sin(Math.PI * (t0 - t) / 0.07) : 0;   // a 2-frame tension before the flick
              return f + steps[j] * (p > 0 ? eBack(p) : 0) + pre;
            });
          }
          const H = (n) => Look.hash(n) * 2 - 1;
          const strike = (t, tf, t0, seed) => {                         // a key strike: lands from near the lens, tips down, squashes
            if (t0 == null || tf < t0) return { hide: true };
            const up = Math.max(0, (t - t0) / 0.12);
            if (up < 1) { const e = eKey(up); return { z: 190 * (1 - e), rx: -0.42 * (1 - e), rz: 0.04 * H(seed) * (1 - e), y: -10 * (1 - e) }; }
            const w = (t - t0 - 0.12) / 0.14;
            if (w < 1) { const sq = 0.05 * Math.cos(w * Math.PI * 1.5) * Math.exp(-3.2 * w); return { sy: 1 - sq, sx: 1 + sq * 0.45 }; }
            return {};
          };
          const outEnd = TM.out + TM.outDur;
          let C3 = null;
          C3 = Card3D({
            W: 1920, H: 1080, glyphs: G, fov: 18, px: TY.cx, py: TY.cy,
            lines: [
              { id: "d", set: S.set, text: C.day, size, tracking: S.tracking, cx: dCX, cy: row1, depth: S.depth, bevel: S.bevel, tilt: S.tilt },
              { id: "t", set: S.set, text: timeText, size, tracking: S.tracking, cx: tCX, cy: row1, depth: S.depth, bevel: S.bevel, tilt: S.tilt, state: true,
                drumR: 2.15, winTop: 0.09, winBot: 0.09, winFeather: 0.13 },
              { id: "p", set: Pl.set, text: C.place, size: Pl.size, tracking: Pl.tracking, cx: TY.cx, cy: row2, depth: Pl.depth, bevel: Pl.bevel, tilt: S.tilt }
            ],
            colors: { white: C.colors.white, state: C.colors.state, material: { faceMetal: 0.3, faceRough: 0.3, clearcoat: 0.6, faceEnv: 0.42, sideMetal: 1.0 }, faceEmissive: 0.8, preEmissive: 0.52 },
            caret: { color: C.colors.caret, w: 0.11, h: 1.24, dy: 0.0, glow: 1.1 },
            shadow: 0.62, shadowOff: [5, 9], wideShadow: 0.42,
            shutter: (t) => (t > tick - 0.08 && t < TM.lock + 0.2 ? 1 / 90 : t > TM.type - 0.02 && t < typeEnd + 0.14 ? 1 / 120 : 0),
            subframes: (t) => (t > tick - 0.08 && t < TM.lock + 0.2 ? 10 : 6),
            pose: (t, tf) => {
              const P = { lines: {}, glyphs: {}, drums: {}, state: {} };
              const hide = tf >= outEnd;
              const u = t - TM.lock;
              let s = 1;
              if (u >= 0 && u < 0.07) s = 1 + 0.06 * eExpo(u / 0.07);
              else if (u >= 0.07 && u < 0.34) s = 1 + 0.06 * (1 - eKey((u - 0.07) / 0.27));
              const hold = clamp((t - (typeEnd + 0.2)) / (TM.out - typeEnd - 0.2), 0, 1), sway = -0.035 + 0.07 * eSine(hold);
              const rec = u > 0 && u < 0.3 ? -7 * Math.sin(Math.PI * u / 0.3) * Math.exp(-u / 0.12) : 0;   // the day and place recoil from the flick
              P.lines.d = { ry: sway, x: rec * 0.6 };
              P.lines.t = { s, ry: sway };
              P.lines.p = { ry: sway, s: 1 + (s - 1) * 0.35 };
              ["d", "t", "p"].forEach((id) => {
                P.glyphs[id] = (i) => {
                  if (hide) return { hide: true };
                  const q = strike(t, tf, typedAt[id] && typedAt[id][i], i * 7 + id.charCodeAt(0));
                  if (id === "t" && i === colonAt && !q.hide && tf >= TM.blinkOff[0] && tf < TM.blinkOff[1]) return { hide: true };   // the colon ticks
                  return q;
                };
              });
              P.drums.t = drums(t);
              if (u >= 0) P.state.t = { p: eExpo(clamp(u / 0.24, 0, 1)), hot: 3.0 * (1 - eP2i(clamp(u / 0.36, 0, 1))) };
              // caret: rides after the last typed letter, jumps ahead on a pause, blinks when the line is done, then folds away
              if (tf >= TM.caret && tf < TM.caretOff + 0.06 && !hide) {
                let j = -1; for (let q = 0; q < seq.length; q++) if (seq[q].t <= tf) j = q;
                const gapC = cap * 0.07;
                let line, x;
                const nx = seq[j + 1];
                if (j < 0) { line = seq[0].line; x = C3.lines.find((l) => l.L.id === line).slotInk[0][0] - gapC * 2.2 - cap * 0.11; }
                else if (nx && tf >= seq[j].t + TM.cps + 0.001) { line = nx.line; x = C3.lines.find((l) => l.L.id === line).slotInk[nx.slot][0] - gapC * 2.2 - cap * 0.11; }
                else { line = seq[j].line; x = C3.lines.find((l) => l.L.id === line).slotInk[seq[j].slot][1] + gapC * 1.6; }
                const done = tf > typeEnd + 0.1, ph = (tf - typeEnd - 0.1) % 0.4;
                const blinkOn = !done || ph < 0.24;
                const fold = clamp((t - TM.caretOff) / 0.06, 0, 1);
                const fresh = clamp((t - TM.caret) / 0.08, 0, 1);
                P.caret = { line, x, on: blinkOn && fold < 1, sy: (1 - eP2i(fold)) * (0.4 + 0.6 * eKey(fresh)) };
              }
              // key: rakes across the bevels on the lock, then keeps travelling through the hold
              const rk = eP2io(clamp((t - (TM.lock - 0.05)) / 0.6, 0, 1));
              const kd = eSine(clamp((t - (TM.lock + 0.55)) / (TM.out - TM.lock - 0.55), 0, 1));
              P.keyAngle = -0.95 + 1.75 * rk - 1.0 * kd;
              P.key = 2.3 + 3.2 * Math.exp(-Math.pow((u - 0.12) / 0.15, 2));
              // light: one hot band crosses the whole stamp on the lock; a soft sheen drifts in the hold; on the exit the band rides the wipe edge
              const xL = left - TY.cx - 260, xR = left + rowW - TY.cx + 260;
              const sp = clamp((t - (TM.lock + 0.03)) / 0.42, 0, 1), sd = clamp((t - (TM.lock + 0.5)) / (TM.out - TM.lock - 0.5), 0, 1);
              const wp = clamp((t - TM.out) / TM.outDur, 0, 1);
              if (wp > 0 && wp < 1) { P.specX = wipeEdge(t) - TY.cx + 34; P.specAmp = 1.7; P.specW = 0.32; }
              else if (sp > 0 && sp < 1) { P.specX = xL + (xR - xL) * eP2io(sp); P.specAmp = 1.0 * Math.pow(Math.sin(Math.PI * sp), 0.6); P.specW = 0.42; }
              else if (sd > 0 && sd < 1) { P.specX = xL * 1.2 + (xR - xL * 1.2) * sd; P.specAmp = 0.2 * Math.sin(Math.PI * sd); P.specW = 1.3; }
              const env = u < 0 ? 0 : u < 0.1 ? 1 : Math.exp(-(u - 0.1) / 0.28);
              P.bloom = 0.14 + 0.85 * env;
              return P;
            }
          });
          // ---------- the exit: a short slanted wipe (clip-path, never a mask) from left to right, cut on the frame it ends ----------
          const inkL = left - 40, inkR = left + rowW + 60, SL = 0.36;
          function wipeEdge(t) { return inkL - 120 + (inkR - inkL + 240) * eP3io(clamp((t - TM.out) / TM.outDur, 0, 1)); }
          const host = $("#t3d"); host.appendChild(C3.canvas);
          const bnc = $("#bounce");
          bnc.style.cssText += ";left:" + (tCX - 520) + "px;top:" + (row1 - 360) + "px;width:1040px;height:720px;background:radial-gradient(closest-side, rgba(" + C.colors.glow + ",.5) 0%, rgba(" + C.colors.glow + ",.2) 45%, rgba(" + C.colors.glow + ",0) 100%)";
          document.querySelectorAll("#root *").forEach((n) => { n.setAttribute("data-layout-allow-overlap", ""); n.setAttribute("data-layout-allow-occlusion", ""); });

          const tl = gsap.timeline({ paused: true });
          Look.drive(tl, 0, TM.end, (p) => {
            const t = p * TM.end;
            if (t >= TM.out && t < outEnd) {
              const e = wipeEdge(t), y0 = TY.cy;       // the edge leans with the light band: x = e + SL * (y - cy)
              host.style.clipPath = "polygon(" + (e + SL * (0 - y0)).toFixed(1) + "px 0px, 1920px 0px, 1920px 1080px, " + (e + SL * (1080 - y0)).toFixed(1) + "px 1080px)";
            } else host.style.clipPath = t >= outEnd ? "polygon(0px 0px, 0px 0px, 0px 0px)" : "none";
            C3.renderAt(t);
          });
          if (plate) {
            Look.drive(tl, TM.lock, 1.6, (p) => {
              const u = p * 1.6; let k = 0;
              if (p > 0 && p < 1) k = u < 2 * FR ? u / (2 * FR) : u < 5 * FR ? 1 : 0.22 + 0.78 * Math.exp(-(u - 5 * FR) / 0.22);
              if (p >= 1) k = 0.22;
              bnc.style.opacity = (0.85 * k).toFixed(3);
            });
            tl.set(bnc, { visibility: "hidden" }, TM.out + 0.12);
            Look.expose(tl, TM.lock, { target: "#push", peak: 1.18, hold: 3 / 30, dur: 0.36, saturate: 1.12 });
            Look.impact(tl, TM.lock, { shake: "#shake", amp: 6, dur: 0.28, zoom: 1.015, flash: 0 });
            // each shot gets a slow push so held plates breathe; the payoff shot lands with a small punch that settles
            [["#s1", 0, 1.5333], ["#s2", 1.4667, 1.1533], ["#s3", 2.5533, 1.3467], ["#s4", 3.8333, 0.9167], ["#s5", 4.6833, 0.5167]].forEach(([sel, at, d], i) => {
              gsap.set(sel, { scale: 1.0, transformOrigin: "50% 50%" });
              tl.fromTo(sel, { scale: i === 2 ? 1.07 : 1.0 }, { scale: i === 2 ? 1.0 : 1.045, duration: d, ease: i === 2 ? "expo.out" : "none", immediateRender: false }, at);
            });
          } else {
            bnc.style.display = "none";
          }
          C3.renderAt(0);
          tl.set({}, {}, TM.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
</body>
</html>
