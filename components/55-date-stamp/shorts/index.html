<!doctype html>
<!-- GTA-niche 55 Date stamp, variant B: "Time jump" (9:16 Shorts, 1080x1920, 30 fps, 5.6 s).
     The creators' centred date/clock stamp as a Shorts time jump: "THREE HOURS LATER" over a big 24 h clock, all real
     geometry (Three.js: extruded, bevelled Archivo outlines in white clearcoat enamel with brushed-steel walls and a cast
     contact shadow). The clock is four mechanical drums (the minute-tens wheel is 0-5): it fast-forwards 03:12 -> 06:12,
     the minutes spinning three full hours while the hours carry, over one continuous GTA V shot in which the party in a
     penthouse empties out and the windows turn pink. It stops dead on 06:12 with a click (overshoot and snap back), and
     the clock locks into caption-yellow metal behind a hot light front, a raking key, bloom and a punch.
     See ../DECISIONS.md. Variable: bg "plate" / "none". -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="media/glyphs.js"></script>
    <script src="media/card3d.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Archivo", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #bounce, #t3d { position: absolute; pointer-events: none; }
      #bounce { opacity: 0; mix-blend-mode: screen; z-index: 6; }
      #t3d { left: 0; top: 0; width: 1080px; height: 1920px; z-index: 7; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.6" data-width="1080" data-height="1920">
      <div id="shake"><div id="push">
        <video id="s1" class="clip shot" src="assets/shots/v35-penthouse-dusk-v.mp4" muted playsinline data-start="0" data-duration="5.6" data-media-start="1.4" data-track-index="0"></video>
      </div></div>
      <div id="bounce"></div>
      <div id="t3d"></div>
    </div>
    <script>
      const CONFIG = {
        caption: "THREE HOURS LATER",
        // 24 h HH:MM. The clock rolls forward from `from` to `to` (minutes spin, hours carry) and stops with a click.
        clock: { from: "03:12", to: "06:12" },
        type: {
          cap: { set: "cond", size: 120, maxInk: 740, tracking: 0.012, depth: 0.34, bevel: 0.09, tilt: 0.2 },
          clock: { set: "clock", size: 330, maxInk: 740, tracking: -0.01, depth: 0.26, bevel: 0.06, tilt: 0.2 },
          cx: 540, blockCY: 860, gap: 66
        },
        colors: {
          white: { face: ["#FFFFFF", "#CDD4DE"], side: ["#8A93A2", "#1C2028"] },
          state: { face: ["#FFF6B8", "#FFD23C", "#EFA514", "#FFD54A", "#E0920F"], facePos: [0, 0.4, 0.53, 0.6, 1], lip: "#FFE07A", side: ["#C07A00", "#3A1E00"], hot: "#FFF6D0" },
          glow: "255,196,60"
        },
        timing: { in: 0.10, stagger: 0.014, clockIn: 0.28, clockStagger: 0.04, inDur: 0.15, roll: 1.15, rollDur: 1.85, endSpeed: 0.35,
          out: 4.95, outDur: 0.16, end: 5.6 }
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const $ = (s) => document.querySelector(s);
        const C = CONFIG, TY = C.type, TM = C.timing, FR = 1 / 30;
        const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));
        Promise.all([document.fonts.load("900 100px Archivo")]).then(() => document.fonts.ready).then(() => {
          const G = window.CARD_GLYPHS;
          const toMin = (s) => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
          const m0 = toMin(C.clock.from), m1 = toMin(C.clock.to) + (toMin(C.clock.to) < toMin(C.clock.from) ? 1440 : 0), span = m1 - m0;
          const clockText = "##:%#";
          const fit = (o, text) => { const m = Card3D.measure(G[o.set], text, 1000, o.tracking); const size = Math.min(o.size, o.maxInk / (m.inkW / 1000)); return { size, cap: G[o.set].cap * size / G[o.set].upm }; };
          const CAP = fit(TY.cap, C.caption), CLK = fit(TY.clock, clockText);
          const blockH = CAP.cap + TY.gap + CLK.cap;
          const capCY = TY.blockCY - blockH / 2 + CAP.cap / 2, clkCY = TY.blockCY + blockH / 2 - CLK.cap / 2;
          const eBack = gsap.parseEase("back.out(1.7)"), eKey = gsap.parseEase("back.out(1.8)"), eExpo = gsap.parseEase("expo.out"), eSine = gsap.parseEase("sine.inOut"),
            eP2i = gsap.parseEase("power2.in"), eP2io = gsap.parseEase("power2.inOut"), eP3i = gsap.parseEase("power3.in");
          // ---------- the fast-forward: ease in, spin, arrive still moving, then stop dead with a click (overshoot, snap back) ----------
          const L = TM.roll + TM.rollDur, s1 = TM.endSpeed;
          const herm = (u) => -2 * u * u * u + 3 * u * u + (u * u * u - u * u) * s1;
          function minutes(t) {
            const u = clamp((t - TM.roll) / TM.rollDur, 0, 1);
            let m = m0 + span * herm(u);
            if (t > L) { const w = t - L; m += 0.32 * Math.sin(2 * Math.PI * w / 0.16) * Math.exp(-w / 0.06); }
            return m;
          }
          const carry = (m, unit) => Math.floor(m / unit) + clamp((m % unit) - (unit - 1), 0, 1);   // odometer: a wheel turns during the last minute of its unit
          function drums(t) { const m = minutes(t); return [carry(m, 600), carry(m, 60), carry(m, 10), m]; }
          const outEnd = TM.out + TM.outDur;
          const H = (n) => Look.hash(n) * 2 - 1;
          const slam = (t, tf, t0, zFrom, rot, seed, dy) => {
            if (tf < t0) return { hide: true };                          // hidden by frame time: no see-through first frame
            const up = Math.max(0, (t - t0) / TM.inDur);
            if (up < 1) { const k = eBack(up); return { z: zFrom * (1 - k), rx: rot * (1 - k), ry: 0.2 * H(seed) * (1 - k), rz: 0.05 * H(seed + 9) * (1 - k), y: dy * (1 - k) }; }
            const w = (t - t0 - TM.inDur) / 0.16;
            if (w < 1) { const sq = 0.06 * Math.cos(w * Math.PI * 1.5) * Math.exp(-3.2 * w); return { sy: 1 - sq, sx: 1 + sq * 0.45 }; }
            return {};
          };
          const C3 = Card3D({
            W: 1080, H: 1920, glyphs: G, fov: 22, px: TY.cx, py: TY.blockCY,
            lines: [
              { id: "c", set: TY.cap.set, text: C.caption, size: CAP.size, tracking: TY.cap.tracking, cx: TY.cx, cy: capCY, depth: TY.cap.depth, bevel: TY.cap.bevel, tilt: TY.cap.tilt },
              { id: "k", set: TY.clock.set, text: clockText, size: CLK.size, tracking: TY.clock.tracking, cx: TY.cx, cy: clkCY, depth: TY.clock.depth, bevel: TY.clock.bevel, tilt: TY.clock.tilt,
                state: true, drumR: 2.15, winTop: 0.07, winBot: 0.07, winFeather: 0.14 }
            ],
            colors: { white: C.colors.white, state: C.colors.state, material: { faceMetal: 0.3, faceRough: 0.3, clearcoat: 0.6, faceEnv: 0.42, sideMetal: 1.0 }, faceEmissive: 0.8, preEmissive: 0.52 },
            shadow: 0.62, shadowOff: [6, 10], wideShadow: 0.42,
            shutter: (t) => (t > TM.roll && t < L + 0.3 ? 1 / 900 : t > TM.in - 0.04 && t < TM.clockIn + 0.4 ? 1 / 90 : (t > TM.out - 0.02 && t < outEnd + 0.02 ? 1 / 60 : 0)),
            subframes: (t) => (t > TM.roll && t < L + 0.3 ? 8 : t > TM.out - 0.02 ? 16 : 12),
            pose: (t, tf) => {
              const P = { lines: {}, glyphs: {}, drums: {}, state: {} };
              const u = t - L;
              let s = 1, sq = 0;
              if (u >= 0 && u < 0.06) s = 1 + 0.07 * eExpo(u / 0.06);
              else if (u >= 0.06 && u < 0.36) s = 1 + 0.07 * (1 - eKey((u - 0.06) / 0.3));
              if (u >= 0 && u < 0.3) sq = 0.05 * Math.cos(Math.PI * 1.5 * u / 0.3) * Math.exp(-u / 0.09);   // the click squashes the clock and springs
              const hold = clamp((t - (TM.clockIn + 0.4)) / (TM.out - TM.clockIn - 0.4), 0, 1), sway = -0.045 + 0.09 * eSine(hold);
              const rec = u > 0 && u < 0.32 ? -9 * Math.sin(Math.PI * u / 0.32) * Math.exp(-u / 0.12) : 0;
              // the exit: each line collapses into its own centre line with a forward rush, the caption first; cut on the zero frame
              const xc = clamp((t - TM.out) / (TM.outDur - 0.03), 0, 1), xk = clamp((t - TM.out - 0.03) / (TM.outDur - 0.03), 0, 1);
              P.lines.c = { s: (1 + (s - 1) * 0.4) * (1 + 0.08 * eP3i(xc)), ry: sway, y: rec, sy: 1 - 0.97 * eP3i(xc), z: 160 * eP3i(xc) };
              P.lines.k = { s: s * (1 + 0.08 * eP3i(xk)), ry: sway, sy: (1 - sq) * (1 - 0.97 * eP3i(xk)), sx: 1 + sq * 0.5, z: 160 * eP3i(xk) };
              const hide = tf >= outEnd;
              P.glyphs.c = (i) => (hide ? { hide: true } : slam(t, tf, TM.in + i * TM.stagger, 420, 0.3, i * 5 + 11, 0));
              P.glyphs.k = (i) => (hide ? { hide: true } : slam(t, tf, TM.clockIn + i * TM.clockStagger, 700, 0.4, i * 7 + 3, -20));
              P.drums.k = drums(t);
              if (u >= 0) P.state.k = { p: eExpo(clamp(u / 0.22, 0, 1)), hot: 3.2 * (1 - eP2i(clamp(u / 0.34, 0, 1))) };
              // key: rakes across the bevels at the click, then keeps travelling through the hold
              const rk = eP2io(clamp((t - (L - 0.05)) / 0.6, 0, 1));
              const kd = eSine(clamp((t - (L + 0.55)) / (TM.out - L - 0.55), 0, 1));
              P.keyAngle = -0.95 + 1.75 * rk - 1.0 * kd;
              P.key = 2.3 + 3.4 * Math.exp(-Math.pow((u - 0.12) / 0.15, 2));
              // light: one hot band crosses the clock and the caption on the click, then a soft sheen drifts through the hold
              const sp = clamp((t - (L + 0.03)) / 0.4, 0, 1), sd = clamp((t - (L + 0.45)) / (TM.out - L - 0.45), 0, 1);
              if (sp > 0 && sp < 1) { const x0 = -620, x1 = 640; P.specX = x0 + (x1 - x0) * eP2io(sp); P.specAmp = 1.0 * Math.pow(Math.sin(Math.PI * sp), 0.6); P.specW = 0.42; }
              else if (sd > 0 && sd < 1) { const x0 = -900, x1 = 900; P.specX = x0 + (x1 - x0) * sd; P.specAmp = 0.2 * Math.sin(Math.PI * sd); P.specW = 1.3; }
              const env = u < 0 ? 0 : u < 0.1 ? 1 : Math.exp(-(u - 0.1) / 0.28);
              P.bloom = 0.14 + 0.85 * env;
              return P;
            }
          });
          $("#t3d").appendChild(C3.canvas);
          const bnc = $("#bounce");
          bnc.style.cssText += ";left:" + (TY.cx - 560) + "px;top:" + (clkCY - 470) + "px;width:1120px;height:940px;background:radial-gradient(closest-side, rgba(" + C.colors.glow + ",.5) 0%, rgba(" + C.colors.glow + ",.2) 45%, rgba(" + C.colors.glow + ",0) 100%)";
          document.querySelectorAll("#root *").forEach((n) => { n.setAttribute("data-layout-allow-overlap", ""); n.setAttribute("data-layout-allow-occlusion", ""); });

          const tl = gsap.timeline({ paused: true });
          Look.drive(tl, 0, TM.end, (p) => C3.renderAt(p * TM.end));
          if (plate) {
            Look.push(tl, "#push", 0, TM.end, { from: 1.0, to: 1.06 });
            Look.drive(tl, L, 1.6, (p) => {
              const u = p * 1.6; let k = 0;
              if (p > 0 && p < 1) k = u < 2 * FR ? u / (2 * FR) : u < 5 * FR ? 1 : 0.25 + 0.75 * Math.exp(-(u - 5 * FR) / 0.22);
              if (p >= 1) k = 0.25;
              bnc.style.opacity = (0.85 * k).toFixed(3);
            });
            tl.set(bnc, { visibility: "hidden" }, TM.out + 0.08);
            Look.expose(tl, L, { target: "#shake", peak: 1.2, hold: 3 / 30, dur: 0.36, saturate: 1.1 });
            Look.impact(tl, TM.clockIn + 4 * TM.clockStagger + 0.1, { shake: "#shake", amp: 5, dur: 0.22, zoom: 1.01, flash: 0 });
            Look.impact(tl, L, { shake: "#shake", amp: 8, dur: 0.3, zoom: 1.02, flash: 0 });
          } else {
            bnc.style.display = "none";
          }
          C3.renderAt(0);
          tl.set({}, {}, TM.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
</body>
</html>
