<!doctype html>
<!-- 56 Earth zoom, variant A (16:9, 1920x1080): "Globe dive (3D)". Three.js r160 global build.
     One continuous dive. A real Earth (NASA Blue Marble NG day mosaic + Black Marble night lights + Blue Marble cloud layer,
     public domain, see DECISIONS.md) lit physically: day/night terminator, atmosphere rim, sun glint on the oceans. The camera
     dives onto Southern California through four texture levels (4K globe, western North America, 460 m SoCal, 30 m Landsat
     of the Los Angeles basin), so the coast and the city stay sharp all the way down. Small in-game style district labels
     (our own lettering) sit on the city, under the clouds. The dive falls into a raymarched cumulus tower over the hills,
     and the cloud breaks up outward onto real Los Santos footage (the hills over downtown, 1.0x): a glossy 3D pin lands on
     the skyline and the place name springs out. Radial zoom blur is a shader pass driven from timeline time.
     Kind: full (always shows footage). Rendered from timeline time only (GSAP proxy + hf-seek). -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>

    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;

      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
      #ov { position: absolute; inset: 0; }

      /* landing label: place name under the 3D pin */

        background: radial-gradient(closest-side, rgba(4,8,14,.58), rgba(4,8,14,.3) 55%, rgba(4,8,14,0)); }
      #place { position: absolute; left: 0; top: 0; width: 1920px; text-align: center; }

        white-space: nowrap; filter: drop-shadow(0 3px 0 #77818F) drop-shadow(0 1px 0 #4B535E) drop-shadow(0 3px 3px rgba(0,0,0,.6)) drop-shadow(0 10px 24px rgba(0,0,0,.45)); }
      #kickWin { position: absolute; left: 0; top: 832px; width: 1920px; height: 46px; overflow: hidden; }
      #kick { display: inline-flex; align-items: center; gap: 18px; font: normal 800 30px/46px "Inter"; letter-spacing: .34em; color: #fff;
        white-space: nowrap; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,.6); padding-left: .34em; }
      #kick b { display: inline-block; width: 46px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #FF5A63, #E0162B);

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.47" data-width="1920" data-height="1080">
      <div id="shake"><div id="push">
        <video id="shotLand" class="clip shot" src="assets/shots/v36-hills-city-view-h.mp4" muted playsinline data-start="4.54" data-duration="1.93" data-media-start="0" data-track-index="2"></video>
      </div></div>
      <div id="ov" class="clip" data-start="0" data-duration="6.47" data-track-index="1">
        <div id="scrim"></div>
        <canvas id="gl" width="1920" height="1080" data-layout-allow-overflow></canvas>
        <div id="place">
          <div id="nameWin"><span id="nameMove" data-layout-allow-overflow><span id="name" data-layout-allow-occlusion></span></span></div>
          <div id="kickWin"><span id="kick" data-layout-allow-overflow><b></b><span id="kickT" data-layout-allow-occlusion></span><b></b></span></div>
        </div>
      </div>
    </div>
    <script>
      const CONFIG = {
        place: { name: "Los Santos", kicker: "San Andreas" },
        target: [34.050, -118.250],    // [lat, lon] the dive falls into: downtown Los Angeles (the real-world Los Santos), where the pin lands in the landing shot
        start: [22, -101],             // [lat, lon] at the centre of the globe at t = 0
        sun: [15, -175],               // subsolar point: afternoon over California, dusk on the US east coast, night over Brazil
        spin: 9,                       // degrees the globe turns eastward over the first 2.6 s
        pin: { screen: [1217, 606], height: 250, color: "#E3162B" },   // the pin's tip stands on the downtown towers of the landing shot
        cam: {
          fov: 28,
          // log-altitude keys [time, altitude above the ground in planet radii, slope d(ln h)/dt]
          alt: [[0, 4.1, -0.10], [1.2, 3.1, -0.45], [2.3, 0.95, -1.7], [2.95, 0.16, -2.6], [3.45, 0.038, -1.8], [3.8, 0.0235, -1.2],
                [4.1, 0.0158, -1.4], [4.3, 0.0105, -2.2], [4.42, 0.0079, -2.2], [4.52, 0.0066, -1.4], [4.7, 0.0058, -0.6], [4.9, 0.0055, -0.25]],
          swing: [0.45, 2.75],         // the view swings from the start point to straight down over the target over [t0, t1]
          aim: [2.1, 3.5]              // the dive's vanishing point slides from frame centre onto pin.screen over [t0, t1]
        },
        // the cumulus field over the basin and the cumulus tower we fall into (units of 1/1000 planet radius; ground = 0)
        deck: { base: 2.0, top: 4.6, size: 1.5, tower: { r: 1.1, top: 7.0, off: [0.0, 0.0], skirt: 2.9 } },
        // the closest texture level (30 m Landsat of the LA basin): swap in your own top-down map capture (an in-game map
        // screenshot works) with its [lon0, lon1, lat0, lat1] box; water = a white-on-black sea mask of the same image
        city: { src: "la_city.jpg", water: "la_city_water.jpg", box: [-118.95, -117.75, 33.55, 34.45] },
        // in-game style district labels on the city (our lettering): [lat, lon] of the place, time it lands; water = italic sea style
        labels: { px: 34, safe: [96, 54, 1824, 1026], list: [
          { t: "Pacific Ocean", ll: [33.890, -118.720], at: 3.56, water: true },
          { t: "Vinewood Hills", ll: [34.160, -118.330], at: 3.62 },
          { t: "Del Perro", ll: [34.018, -118.492], at: 3.80 },
          { t: "Los Santos Int'l", ll: [33.942, -118.390], at: 3.78 } ] },
        // swap: full cloud cover, the globe goes off and the landing shot is under the cloud; part..partEnd: the cloud breaks
        // up outward from the pin; land: pin impact + title; out: exit; end
        timing: { swap: 4.52, part: 4.52, partEnd: 4.84, land: 4.66, out: 6.31, end: 6.47 }
      };

      (function () {
        const W = 1920, H = 1080, T = CONFIG.timing, C = CONFIG;
        const $ = (s) => document.querySelector(s);
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, k) => a + (b - a) * k;
        const sstep = (a, b, x) => { const k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };
        const hh = (n) => Look.hash(n);
        const DEG = Math.PI / 180;
        const dirLL = (lat, lon) => new THREE.Vector3(Math.cos(lon * DEG) * Math.cos(lat * DEG), Math.sin(lat * DEG), -Math.sin(lon * DEG) * Math.cos(lat * DEG));
        const mkCv = (n) => { const c = document.createElement("canvas"); c.width = c.height = n; return c; };

        // ======================= renderer + textures (NASA, public domain) =======================
        const canvas = $("#gl");
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, premultipliedAlpha: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(1); renderer.setSize(W, H, false);
        renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
        renderer.autoClear = false;
        const maxAniso = renderer.capabilities.getMaxAnisotropy();
        window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
        let pending = 0, readyRes; const ready = new Promise((r) => { readyRes = r; });
        window.__hf.buildReady["earth56"] = ready;
        const loader = new THREE.TextureLoader();
        const ld = (f, srgb, repeatU) => { pending++;
          const t = loader.load("media/" + f, () => { if (--pending === 0) readyRes(); });
          t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace; t.anisotropy = maxAniso;
          t.minFilter = THREE.LinearMipmapLinearFilter; t.magFilter = THREE.LinearFilter; if (repeatU) t.wrapS = THREE.RepeatWrapping; return t; };
        const tex = {
          day: ld("earth_day_4k.jpg", true), water: ld("earth_water_4k.jpg"), lights: ld("earth_lights_4k.jpg"), clouds: ld("earth_clouds_2k.jpg", false, true),
          mid: ld("wna_mid.jpg", true), midW: ld("wna_mid_water.jpg"), det: ld("socal_detail.jpg", true), detW: ld("socal_water.jpg"),
          city: ld(CONFIG.city.src, true), cityW: ld(CONFIG.city.water)
        };
        // lon/lat boxes of the detail levels (radians): [lon0, lon1, lat0, lat1]
        const MID_BOX = new THREE.Vector4(-140 * DEG, -92 * DEG, 12 * DEG, 52 * DEG);
        const DET_BOX = new THREE.Vector4(-123 * DEG, -113 * DEG, 29.5 * DEG, 38.5 * DEG);
        const CITY_BOX = new THREE.Vector4(...CONFIG.city.box.map((v) => v * DEG));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(C.cam.fov, W / H, 0.0004, 200);
        const TGT0 = dirLL(C.target[0], C.target[1]);
        const SUN_W = dirLL(C.sun[0], C.sun[1]);
        const D0 = dirLL(C.start[0], C.start[1]);

        const NOISE = `
          vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
          vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
          vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
          vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
          float snoise(vec3 v){
            const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
            vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
            vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
            vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
            i=mod289(i);
            vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
            float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
            vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
            vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
            vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
            vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
            vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
            vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
            vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
            p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
            vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
            return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
          }
          float fbm(vec3 p,int oct){ float s=0.0,a=0.5; for(int i=0;i<6;i++){ if(i>=oct) break; s+=a*snoise(p); p=p*2.07+vec3(1.7,9.2,3.1); a*=0.5; } return s; }`;
        const VERT = `varying vec3 vPos; varying vec2 vUv; varying vec3 vWP;
          void main(){ vPos=position; vUv=uv; vec4 wp=modelMatrix*vec4(position,1.0); vWP=wp.xyz; gl_Position=projectionMatrix*viewMatrix*wp; }`;
        // shared lighting helpers (object space; the sphere normal is the position)
        const LIGHT = `
          uniform vec3 uSunO, uCamO, uTgtO; uniform float uSunI, uCloudU, uHoleR, uThin;
          vec3 sunColor(float ndl){ return mix(vec3(1.0,0.42,0.16), vec3(1.0,0.95,0.88), smoothstep(-0.02,0.20,ndl)); }
          vec3 skyColor(float ndl){ vec3 s=mix(vec3(0.17,0.38,1.0),vec3(0.40,0.64,1.0),smoothstep(0.0,0.6,ndl));
            return mix(s,vec3(1.0,0.50,0.26),0.22*(1.0-smoothstep(0.0,0.10,abs(ndl-0.01)))); }
          // clear sky over the target: the cumulus deck takes over there
          float clearing(vec3 q){ float d=distance(q,uTgtO); return smoothstep(uHoleR*0.45,uHoleR,d+0.012*sin(q.x*170.0+q.y*90.0)); }`;

        // ---------- the planet ----------
        const earthU = {
          tDay: { value: tex.day }, tWater: { value: tex.water }, tLights: { value: tex.lights }, tClouds: { value: tex.clouds },
          tMid: { value: tex.mid }, tMidW: { value: tex.midW }, tDet: { value: tex.det }, tDetW: { value: tex.detW },
          tCity: { value: tex.city }, tCityW: { value: tex.cityW },
          uMidBox: { value: MID_BOX }, uDetBox: { value: DET_BOX }, uCityBox: { value: CITY_BOX },
          uSunO: { value: SUN_W.clone() }, uCamO: { value: new THREE.Vector3() }, uTgtO: { value: TGT0.clone() },
          uSunI: { value: 1.75 }, uCloudU: { value: 0 }, uHoleR: { value: 0.085 }, uGlint: { value: 1 }, uLightsK: { value: 1 }, uThin: { value: 0 }, uSeaK: { value: 0 }
        };
        const earthMat = new THREE.ShaderMaterial({ uniforms: earthU, vertexShader: VERT,
          fragmentShader: LIGHT + `
          uniform sampler2D tDay,tWater,tLights,tClouds,tMid,tMidW,tDet,tDetW,tCity,tCityW; uniform vec4 uMidBox,uDetBox,uCityBox; uniform float uGlint,uLightsK,uSeaK;
          varying vec3 vPos; varying vec2 vUv; varying vec3 vWP;
          float feather(vec2 u,float e){ vec2 m=min(u,1.0-u); return smoothstep(0.0,e,min(m.x,m.y)); }
          void main(){
            vec3 p=normalize(vPos); vec3 V=normalize(uCamO-vPos); vec3 L=uSunO;
            float lon=atan(-p.z,p.x), lat=asin(clamp(p.y,-1.0,1.0));
            vec2 gx=dFdx(vUv), gy=dFdy(vUv);
            // four texture levels share one mosaic: 4K globe, 1.4 km western North America, 460 m Southern California,
            // 30 m Landsat over the Los Angeles basin (each sampled with gradients matched to the globe's uv)
            vec2 mu=vec2((lon-uMidBox.x)/(uMidBox.y-uMidBox.x),(lat-uMidBox.z)/(uMidBox.w-uMidBox.z));
            vec2 du=vec2((lon-uDetBox.x)/(uDetBox.y-uDetBox.x),(lat-uDetBox.z)/(uDetBox.w-uDetBox.z));
            vec2 cu=vec2((lon-uCityBox.x)/(uCityBox.y-uCityBox.x),(lat-uCityBox.z)/(uCityBox.w-uCityBox.z));
            vec2 sM=vec2(6.2831853/(uMidBox.y-uMidBox.x),3.1415927/(uMidBox.w-uMidBox.z));
            vec2 sD=vec2(6.2831853/(uDetBox.y-uDetBox.x),3.1415927/(uDetBox.w-uDetBox.z));
            vec2 sC=vec2(6.2831853/(uCityBox.y-uCityBox.x),3.1415927/(uCityBox.w-uCityBox.z));
            vec3 alb=texture2D(tDay,vUv).rgb; float wat=texture2D(tWater,vUv).r;
            float wm=feather(mu,0.05), wd=feather(du,0.09), wc=feather(cu,0.12);
            vec3 aM=textureGrad(tMid,mu,gx*sM,gy*sM).rgb; float wM=textureGrad(tMidW,mu,gx*sM,gy*sM).r;
            vec3 aD=textureGrad(tDet,du,gx*sD,gy*sD).rgb; float wD=textureGrad(tDetW,du,gx*sD,gy*sD).r;
            vec3 aC=textureGrad(tCity,cu,gx*sC,gy*sC).rgb; float wC=textureGrad(tCityW,cu,gx*sC,gy*sC).r;
            alb=mix(alb,aM,wm); wat=mix(wat,wM,wm); alb=mix(alb,aD,wd); wat=mix(wat,wD,wd); alb=mix(alb,aC,wc); wat=mix(wat,wC,wc);
            wat=smoothstep(0.25,0.75,wat);
            vec3 albS=texture2D(tDay,vUv,3.0).rgb;
            albS=mix(albS,textureGrad(tMid,mu,gx*sM*10.0,gy*sM*10.0).rgb,wm); albS=mix(albS,textureGrad(tDet,du,gx*sD*10.0,gy*sD*10.0).rgb,wd);
            albS=mix(albS,textureGrad(tCity,cu,gx*sC*10.0,gy*sC*10.0).rgb,wc);
            alb=mix(alb,albS,0.88*wat);
            float wB=texture2D(tWater,vUv,4.0).r;
            wB=mix(wB,textureGrad(tMidW,mu,gx*sM*24.0,gy*sM*24.0).r,wm); wB=mix(wB,textureGrad(tDetW,du,gx*sD*24.0,gy*sD*24.0).r,wd);
            wB=mix(wB,textureGrad(tCityW,cu,gx*sC*40.0,gy*sC*40.0).r,wc);
            float shal=1.0-smoothstep(0.45,0.97,wB);                                         // near the coast: the shelf
            vec3 sea=mix(vec3(0.016,0.046,0.108),vec3(0.030,0.118,0.165),shal);
            alb=mix(alb,sea,wat*uSeaK);
            float NdL=dot(p,L), NdV=clamp(dot(p,V),0.0,1.0);
            // cloud shadows from the cloud shell (looked up toward the sun)
            vec3 ps=normalize(p+L*0.009);
            vec2 suv=vec2(atan(-ps.z,ps.x)/6.2831853+0.5+uCloudU, asin(clamp(ps.y,-1.0,1.0))/3.1415927+0.5);
            float cs=smoothstep(0.85*uThin,1.0,textureGrad(tClouds,suv,gx,gy).r)*clearing(ps);
            float shade=1.0-0.5*smoothstep(0.12,0.8,cs);
            vec3 sc=sunColor(NdL);
            float lam=clamp((NdL+0.03)/1.03,0.0,1.0);
            vec3 col=alb*sc*lam*uSunI*shade;
            col+=alb*vec3(0.30,0.45,0.80)*0.05*smoothstep(-0.2,0.3,NdL);          // sky fill
            // ocean: a clipped sun glint (two GGX lobes) and the sky in it at grazing angles
            vec3 Hh=normalize(L+V); float NdH=clamp(dot(p,Hh),0.0,1.0), VdH=clamp(dot(V,Hh),0.0,1.0);
            float F=0.02+0.98*pow(1.0-VdH,5.0);
            float wind=0.75+0.5*sin(dot(p,vec3(61.0,37.0,53.0)))*sin(dot(p,vec3(-29.0,71.0,43.0)));
            float a1=0.07*0.07*wind, a2=0.17*0.17*wind;
            float q1=NdH*NdH*(a1-1.0)+1.0, q2=NdH*NdH*(a2-1.0)+1.0;
            float D=0.5*a1/(3.1415927*q1*q1)+0.22*a2/(3.1415927*q2*q2);
            float spec=D*F/(4.0*max(NdV,0.2))*max(NdL,0.0);
            col+=wat*sc*spec*uSunI*shade*uGlint;
            float Fv=0.02+0.98*pow(1.0-NdV,5.0);
            col+=wat*vec3(0.30,0.50,0.95)*Fv*0.35*smoothstep(-0.1,0.3,NdL);
            // night side: city lights
            float night=1.0-smoothstep(-0.10,0.03,NdL);
            float li=texture2D(tLights,vUv,1.2).r;
            col+=vec3(1.0,0.64,0.30)*li*li*3.2*night*uLightsK;
            // atmosphere: aerial perspective toward the limb
            float fres=pow(1.0-NdV,3.0);
            float skyL=smoothstep(-0.28,0.25,NdL);
            vec3 sk=skyColor(NdL)*uSunI*0.5*skyL;
            col=mix(col,sk,clamp(fres*0.8,0.0,1.0))+sk*0.03;
            gl_FragColor=vec4(col,1.0);
          }` });
        const earth = new THREE.Mesh(new THREE.SphereGeometry(1, 384, 192), earthMat);
        earth.renderOrder = 0; scene.add(earth);

        // ---------- cloud shell (Blue Marble cloud layer) ----------
        const cloudU = { tClouds: { value: tex.clouds }, uSunO: earthU.uSunO, uCamO: earthU.uCamO, uTgtO: earthU.uTgtO,
          uSunI: earthU.uSunI, uCloudU: earthU.uCloudU, uHoleR: earthU.uHoleR, uAlpha: { value: 1 }, uThin: earthU.uThin };
        const cloudMat = new THREE.ShaderMaterial({ uniforms: cloudU, vertexShader: VERT, transparent: true, depthWrite: false,
          fragmentShader: LIGHT + `
          uniform sampler2D tClouds; uniform float uAlpha; varying vec3 vPos; varying vec2 vUv; varying vec3 vWP;
          void main(){ vec3 p=normalize(vPos); vec3 V=normalize(uCamO-vPos);
            float c=texture2D(tClouds,vUv+vec2(uCloudU,0.0)).r;

        $("#name").textContent = C.place.name.toUpperCase();

            const P = pose(L.at), q = dirLL(L.ll[0], L.ll[1]), d = q.clone().applyAxisAngle(Yax, P.rot).distanceTo(camera.position);
            const upp = d * 2 * Math.tan(C.cam.fov * DEG / 2) / H / S, mg = LPX * 0.55, rel = q.clone().sub(T0);

        const inE = gsap.parseEase("expo.out"), outE = gsap.parseEase("power3.in");

          tl.fromTo(nm, { yPercent: 0, filter: "blur(0px)" }, { yPercent: 108, filter: "blur(6px)", duration: 0.11, ease: "power3.in", immediateRender: false }, T.out);
