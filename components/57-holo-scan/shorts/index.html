<!doctype html>
<!-- 57 Holo scan, variant B (9:16, 1080x1920): the same 3D lidar scan built phone-first for a Short.
     The car fills ~75% of the width mid-frame on a holographic projector pad; the readout (scan % -> result) is the hook-zone
     headline at 236 px; numbered reticles lock onto the parts and the matching data boxes sit in a 2x2 grid under the car.
     Payoff: the curtain bounces back as a lock wave that prints the car solid and slams the result in.
     Variable: bg "plate" / "none". -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="media/holo3d.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ov { position: absolute; inset: 0; }
      /* plate only: a clean local darkening behind the hologram (black, never a grey veil) */
      #vig { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse 62% 25% at 50% 45%, rgba(1,6,10,.7) 0%, rgba(1,6,10,.5) 50%, rgba(1,6,10,0) 100%); }
      #holo { position: absolute; inset: 0; }
      #hud { position: absolute; inset: 0; overflow: visible; }
      /* readout: the hook-zone headline */
      #ro { position: absolute; left: 72px; width: 864px; top: 236px; height: 380px; }
      #ro .rk { position: absolute; left: 0; right: 0; top: 0; height: 44px; overflow: hidden; }
      #ro .rk span { position: absolute; left: 0; right: 0; top: 0; text-align: center; font: 800 32px/44px "JetBrains Mono"; letter-spacing: .16em; color: #d2f7ff;
        text-shadow: 0 2px 12px rgba(0,0,0,.85); white-space: nowrap; }
      #ro .rm { position: absolute; left: 0; right: 0; top: 52px; height: 250px; overflow: hidden; }
      #ro .grp { position: absolute; left: 0; right: 0; top: 0; height: 250px; display: flex; justify-content: center; align-items: baseline; gap: 18px; }
      #ro .num { font: 900 236px/250px "Archivo"; font-stretch: 64%; letter-spacing: -.01em; font-variant-numeric: tabular-nums; color: #fff;
        text-shadow: 0 0 40px rgba(51,214,255,.5), 0 6px 18px rgba(0,0,0,.7); }
      #ro .unit { font: 900 104px/104px "Archivo"; font-stretch: 70%; color: #bff3ff; text-shadow: 0 0 26px rgba(51,214,255,.5), 0 4px 12px rgba(0,0,0,.7); }
      #ro #gRes .num { color: #FFD23C; text-shadow: 0 0 44px rgba(255,190,40,.55), 0 6px 18px rgba(0,0,0,.75); }
      #ro #gRes .unit { color: #FFE27A; text-shadow: 0 0 26px rgba(255,190,40,.5), 0 4px 12px rgba(0,0,0,.7); }
      #ro .bar { position: absolute; left: 92px; right: 92px; top: 318px; height: 18px; transform-origin: 50% 50%; background: rgba(4,22,30,.55); border-radius: 3px;
        box-shadow: inset 0 0 0 3px rgba(51,214,255,.45); overflow: hidden; }
      #ro .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(180deg, #c8f7ff, #33D6FF 55%, #1690bd); }
      #ro .bar b { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 40px, rgba(2,14,20,.9) 40px 46px); }
      #ro .bar #barY { width: 0; background: linear-gradient(180deg, #fff1b0, #FFD23C 55%, #E59A1C); }
      #ro .bar u { position: absolute; top: 0; bottom: 0; left: 0; width: 110px; opacity: 0; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.9), rgba(255,255,255,0)); }
      #ro .rglow { position: absolute; left: 120px; right: 120px; top: 40px; height: 280px; opacity: 0; pointer-events: none;
        background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(255,196,50,.5), rgba(255,196,50,0) 72%); }
      /* spec data boxes: the evidence's bracketed HUD boxes, set heavy, in a 2x2 grid under the car, numbered to the reticles */
      .row { position: absolute; width: 420px; height: 178px; }
      .row .clip { position: absolute; inset: 0; }
      .row .cn { position: absolute; width: 40px; height: 40px; border: 0 solid #33D6FF; filter: drop-shadow(0 0 6px rgba(51,214,255,.6)); }
      .row .tl { left: 0; top: 0; border-left-width: 6px; border-top-width: 6px; }
      .row .br { right: 0; bottom: 0; border-right-width: 6px; border-bottom-width: 6px; }
      .row .spine { position: absolute; left: -2px; top: 22px; bottom: 22px; width: 6px; background: linear-gradient(180deg, #9ff0ff, #33D6FF 45%, #1a8fb8);
        box-shadow: 0 0 14px rgba(51,214,255,.75); }
      .row .hd { position: absolute; left: 26px; top: 20px; height: 54px; display: flex; align-items: center; gap: 14px; overflow: hidden; }
      .row .ix { display: block; font: 900 40px/52px "Archivo"; font-stretch: 80%; color: #02121a; background: linear-gradient(180deg, #c4f6ff, #33D6FF 60%, #1aa3cf);
        padding: 0 10px; border-radius: 5px; box-shadow: 0 0 16px rgba(51,214,255,.55), inset 0 2px 0 rgba(255,255,255,.6); }
      .row .k { display: block; font: 800 40px/52px "JetBrains Mono"; letter-spacing: .04em; color: #d6f9ff; text-shadow: 0 0 2px rgba(0,0,0,.9), 0 2px 8px rgba(0,0,0,.85); white-space: nowrap; }
      .row .vw { position: absolute; left: 14px; top: 78px; height: 96px; padding: 4px 12px 0 12px; overflow: hidden; }
      .row .v { display: block; font: 900 78px/88px "Archivo"; font-stretch: 68%; word-spacing: .14em; color: #fff; white-space: nowrap;
        text-shadow: 0 0 22px rgba(51,214,255,.5), 0 3px 8px rgba(0,0,0,.65); }
      .pin { position: absolute; left: 0; top: 0; width: 78px; height: 58px; border-radius: 7px; background: linear-gradient(180deg, #c4f6ff, #33D6FF 60%, #1aa3cf);
        box-shadow: 0 0 16px rgba(51,214,255,.6), 0 3px 10px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.6); font: 900 44px/58px "Archivo"; font-stretch: 78%; text-align: center; color: #02121a; }
      #fontprobe { position: absolute; left: -9999px; top: 0; font: 900 40px "Archivo"; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.4" data-width="1080" data-height="1920">
      <div id="shake"><div id="push">
        <video id="s1" class="clip shot" style="z-index:4" src="assets/shots/v12-heli-city-dusk-v.mp4" muted playsinline data-start="0" data-duration="1.54" data-media-start="0" data-track-index="0"></video>
        <video id="s2" class="clip shot" style="z-index:3" src="assets/shots/v41-smokestacks-dusk-v.mp4" muted playsinline data-start="1.4733" data-duration="1.4667" data-media-start="0" data-track-index="1"></video>
        <video id="s3" class="clip shot" style="z-index:2" src="assets/shots/v44-bridge-skyline-v.mp4" muted playsinline data-start="2.8733" data-duration="1.7" data-media-start="0" data-track-index="0"></video>
        <video id="s4" class="clip shot" style="z-index:1" src="assets/shots/v36-hills-city-view-v.mp4" muted playsinline data-start="4.5067" data-duration="1.8933" data-media-start="0" data-track-index="1"></video>
      </div><div id="vig"></div></div>
      <div id="ov" class="clip" data-start="0" data-duration="6.4" data-track-index="2">
        <div id="holo"></div>
        <svg id="hud" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
        <div id="pins"></div>
        <div id="rows"></div>
        <div id="ro">
          <div class="rk"><span id="rk1"></span><span id="rk2"></span></div>
          <div class="rglow" id="rglow"></div>
          <div class="rm">
            <div class="grp" id="gPct"><span class="num" id="pct">000</span><span class="unit">%</span></div>
            <div class="grp" id="gRes"><span class="num" id="resN"></span><span class="unit" id="resU"></span></div>
          </div>
          <div class="bar"><i id="barF"></i><i id="barY"></i><u id="barS"></u><b></b></div>
        </div>
        <div id="fontprobe" aria-hidden="true">213 <span style="font-family:'JetBrains Mono'">SCAN</span></div>
      </div>
    </div>
    <script>
      const CONFIG = {
        kicker: "HOLO SCAN // CAR 07",            // shown while scanning
        done: "SCAN COMPLETE // TOP SPEED",        // rolls in at the lock
        result: { value: "213", unit: "MPH" },
        // spec rows, in scan order (nose -> tail); anchor = the part on the car the numbered reticle locks onto
        tags: [
          { k: "TYRES", v: "20\u2033 SLICKS", anchor: "tyre" },
          { k: "WEIGHT", v: "1,290 KG", anchor: "roof" },
          { k: "ENGINE", v: "4.0L V8", anchor: "intake" },
          { k: "AERO", v: "ACTIVE WING", anchor: "wing" }
        ],
        rows: { top: 1098, pitch: 200, x: [72, 516] },   // data boxes: first row top, row pitch, column lefts (px)
        car: { yaw: [128, 146], pitch: 14, dist: 23.5, target: [0.05, 0.6, 0], shift: [-36, -108] },   // car + pad stay inside x 72-936 across the orbit
        colors: { body: 0x1a3a46 },                    // shell tint (dark clearcoat)
        points: 115000,
        timing: { ignite: 0.12, scan0: 0.24, scan1: 2.5, wave0: 2.64, lock: 2.94, rake0: 3.2, rake1: 4.6, exit: 5.46, erase0: 5.5, erase1: 6.02, end: 6.4 }
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const $ = (s) => document.querySelector(s);
        if (!plate) { document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none")); document.getElementById("vig").style.display = "none"; }
        const FACES = ["900 100px Archivo", "800 100px 'JetBrains Mono'"];
        Promise.all(FACES.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
          const W = 1080, H = 1920, T = CONFIG.timing, C = CONFIG.car, DBG = Object.assign({ bloom: 1, wire: 1, pts: 1 }, window.__DBG || {});
          const holo = Holo3D({ host: $("#holo"), W, H, dpr: 1.5, points: CONFIG.points, colors: CONFIG.colors,
            cam: { fov: 26, target: C.target, shift: C.shift }, ptSize: 2.6, bloomPx: 6 });
          const side = -1; // the camera sees the car's -z flank (nose to the left)
          const A = {
            tyre: [holo.XF, holo.WY + 0.1, side * (holo.WZ + 0.14)],
            roof: [-0.2, 1.11, side * 0.1],
            intake: [-0.6, 0.6, side * 0.93],
            wing: [holo.XT + 0.32, 1.17, side * 0.62]
          };
          const E = (n) => gsap.parseEase(n);
          const cl = (x) => Math.max(0, Math.min(1, x)), lerp = (a, b, p) => a + (b - a) * p;
          const eEl = E("elastic.out(1, 0.5)"), eSine = E("sine.inOut"), eBack = E("back.out(2.2)"), eBack1 = E("back.out(1.4)"), eExpo = E("expo.out"), eP2in = E("power2.in"), eP3in = E("power3.in"), eP3o = E("power3.out"), eP2io = E("power2.inOut");
          const XN = holo.XN + 0.12, XT = holo.XT - 0.12;
          const scanXAt = (t) => lerp(XN, XT, eSine(cl((t - T.scan0) / (T.scan1 - T.scan0))));
          const tCross = (x) => { let lo = T.scan0, hi = T.scan1; for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (scanXAt(m) > x) lo = m; else hi = m; } return (lo + hi) / 2; };

          // ---------- DOM: reticles + numbered pins on the car, spec rows under it ----------
          const NS = "http://www.w3.org/2000/svg", svg = $("#hud");
          const mk = (tag, at, parent) => { const n = document.createElementNS(NS, tag); for (const k in at) n.setAttribute(k, at[k]); (parent || svg).appendChild(n); return n; };
          const TG = CONFIG.tags.map((g, i) => {
            const row = document.createElement("div"); row.className = "row";
            row.innerHTML = '<div class="clip"><i class="cn tl"></i><i class="cn br"></i><div class="spine"></div><div class="hd"><b class="ix">0' + (i + 1) + '</b><span class="k"></span></div><div class="vw"><span class="v"></span></div></div>';
            row.querySelector(".k").textContent = g.k; row.querySelector(".v").textContent = g.v;
            row.style.left = CONFIG.rows.x[i % 2] + "px"; row.style.top = (CONFIG.rows.top + CONFIG.rows.pitch * Math.floor(i / 2)) + "px";
            $("#rows").appendChild(row);
            const pin = document.createElement("div"); pin.className = "pin"; pin.textContent = "0" + (i + 1); $("#pins").appendChild(pin);
            const glow = mk("line", { stroke: "rgba(51,214,255,0.25)", "stroke-width": "12", "stroke-linecap": "round", opacity: "1" });
            const line = mk("line", { stroke: "#5fe0ff", "stroke-width": "4.5", "stroke-linecap": "round", opacity: "1" });
            const ret = mk("g", { opacity: "1" });
            const R0 = 30, arm = 15;
            const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([sx, sy]) => mk("path", { d: "M" + (sx * R0) + " " + (sy * (R0 - arm)) + " L" + (sx * R0) + " " + (sy * R0) + " L" + (sx * (R0 - arm)) + " " + (sy * R0),
              fill: "none", stroke: "#7fe8ff", "stroke-width": "6", "stroke-linecap": "square" }, ret));
            const dot = mk("circle", { cx: "0", cy: "0", r: "8", fill: "#e6fbff", opacity: "1" }, ret);
            return { g, row, clip: row.querySelector(".clip"), v: row.querySelector(".v"), k: row.querySelector(".k"), ix: row.querySelector(".ix"), cns: row.querySelectorAll(".cn"), pin, glow, line, ret, dot, corners, tl: tCross(A[g.anchor][0]) };
          });
          // pin offsets from the anchor (px): up-left / up / up-right so pins never sit on the readout or each other
          const POFF = { tyre: [-120, 30], roof: [-10, -100], intake: [60, 92], wing: [-64, -96] };   // wing pin inboard (up-left): the right rail stays clear

          $("#rk1").textContent = CONFIG.kicker; $("#rk2").textContent = CONFIG.done;
          $("#resN").textContent = CONFIG.result.value; $("#resU").textContent = CONFIG.result.unit;

          function hudAt(t) {
            TG.forEach((o, i) => {
              const a = holo.project(A[o.g.anchor]);
              const u = t - o.tl;
              const exT = T.exit + 0.05 * i;
              const gone = t >= exT + 0.3;
              const shown = u > -0.02 && !gone;
              o.ret.style.display = shown ? "" : "none";
              o.pin.style.display = o.line.style.display = o.glow.style.display = shown && u > 0.08 ? "" : "none";
              o.row.style.display = shown && u > 0.12 ? "" : "none";
              if (!shown) return;
              const sn = eBack(cl((u + 0.02) / 0.26)), exE = eP3in(cl((t - exT) / 0.26));
              // the payoff tick: at the lock every reticle kicks out and snaps tight again, white for 3 frames
              const lu = t - T.lock, tk = lu >= -0.02 && lu < 0.32 ? 1 + 0.5 * (1 - eBack(cl((lu + 0.02) / 0.24))) : 1;
              const sc = lerp(2.3, 1, sn) * (1 - 0.9 * exE) * tk, rot = lerp(45, 0, eP3o(cl((u + 0.02) / 0.24)));
              o.ret.setAttribute("transform", "translate(" + a.x.toFixed(1) + " " + a.y.toFixed(1) + ") rotate(" + rot.toFixed(2) + ") scale(" + sc.toFixed(3) + ")");
              const hotF = (u > 0.2 && u < 0.2 + 2 / 30) || (lu >= 0 && lu < 3 / 30);
              o.corners.forEach((c) => c.setAttribute("stroke", hotF ? "#ffffff" : "#7fe8ff"));
              o.dot.setAttribute("r", (hotF ? 10 : 8).toString());
              // numbered pin: springs out of the reticle along a short leader
              const off = POFF[o.g.anchor], pp = eBack(cl((u - 0.08) / 0.3)) * (1 - exE);
              const px = a.x + off[0] * pp, py = a.y + off[1] * pp;
              o.pin.style.transform = "translate(" + (px - 39).toFixed(1) + "px," + (py - 29).toFixed(1) + "px) scale(" + (0.4 + 0.6 * pp).toFixed(3) + ")";
              const d = Math.hypot(off[0], off[1]) * pp, ux = off[0] / Math.hypot(off[0], off[1]), uy = off[1] / Math.hypot(off[0], off[1]);
              const x1 = a.x + ux * 24, y1 = a.y + uy * 24, x2 = a.x + ux * Math.max(24, d - 34), y2 = a.y + uy * Math.max(24, d - 34);
              [o.line, o.glow].forEach((l) => { l.setAttribute("x1", x1.toFixed(1)); l.setAttribute("y1", y1.toFixed(1)); l.setAttribute("x2", x2.toFixed(1)); l.setAttribute("y2", y2.toFixed(1)); });
              // row: wipes open left -> right, value rolls up in its window; collapses back on exit
              const op = eExpo(cl((u - 0.12) / 0.32)) * (1 - eP3in(cl((t - exT) / 0.2)));
              o.clip.style.clipPath = "inset(0 " + ((1 - op) * 100).toFixed(2) + "% 0 0)";
              // long values are fitted to the box once the face is loaded (never clipped by the box)
              if (!o.fit && (!document.fonts || document.fonts.status === "loaded" || document.fonts.check('900 78px "Archivo"'))) { const w = o.v.scrollWidth; if (w > 0) { o.fit = 1; if (w > 380) o.v.style.fontSize = (78 * 380 / w).toFixed(1) + "px"; } }
              o.v.style.transform = "translateY(" + (90 * (1 - eBack1(cl((u - 0.2) / 0.34)))).toFixed(2) + "px)";
              o.cns.forEach((c) => (c.style.borderColor = (lu >= 0 && lu < 3 / 30) ? "#ffffff" : "#33D6FF"));
              o.k.style.display = "block"; o.k.style.transform = "translateY(" + (32 * (1 - eExpo(cl((u - 0.16) / 0.3)))).toFixed(2) + "px)";
              o.ix.style.transform = "scale(" + (1 + 0.12 * Math.sin(Math.PI * cl((u - 0.12) / 0.2))).toFixed(4) + ")";
              o.row.style.opacity = u > 0.24 && u < 0.24 + 1 / 30 ? "0.85" : "1";
            });
          }
          function readoutAt(t) {
            const inP = eExpo(cl((t - (T.scan0 + 0.06)) / 0.4));
            const outP = eP3in(cl((t - (T.exit + 0.1)) / 0.24));
            const ro = $("#ro");
            const inE = eExpo(cl((t - (T.scan0 + 0.06)) / 0.24));
            ro.style.display = t > T.scan0 + 0.06 && outP < 1 ? "" : "none";
            ro.style.clipPath = "inset(0 0 " + (100 * Math.max(outP, 1 - inE)).toFixed(2) + "% 0)";
            ro.style.filter = inE < 1 ? "blur(" + (6 * (1 - inE)).toFixed(2) + "px)" : "";
            ro.style.transform = "translateY(" + (30 * (1 - inP) - 6 * outP).toFixed(2) + "px)";   // rises in from below, so no frame crosses y 230
            const sp = cl((t - T.scan0) / (T.scan1 - T.scan0));
            $("#pct").textContent = String(Math.round(100 * eSine(sp))).padStart(3, "0");
            const sw = cl((t - (T.lock - 0.2)) / 0.14), swE = eP3in(sw);
            const rs = cl((t - (T.lock - 0.12)) / 0.26), rsE = eBack1(rs);
            $("#gPct").style.transform = "translateY(" + (-254 * swE).toFixed(2) + "px)";
            $("#gPct").style.visibility = sw >= 1 ? "hidden" : "visible";
            // the result counts up in its window, swells as it climbs and lands on a spring; a local bloom sits behind it
            const RV = parseInt(CONFIG.result.value, 10), cu = eP3o(cl((t - (T.lock - 0.1)) / 0.45)), land = T.lock + 0.35;
            $("#resN").textContent = isNaN(RV) ? CONFIG.result.value : String(Math.round(RV * cu)).padStart(CONFIG.result.value.length, "0");
            const rsc = t < land ? 1 + 0.1 * eP2in(cl((t - (land - 0.3)) / 0.3)) : 1 + 0.1 * (1 - eEl(cl((t - land) / 0.6)));
            $("#gRes").style.transform = "translateY(" + (256 * (1 - rsE)).toFixed(2) + "px) scale(" + rsc.toFixed(4) + ")";
            $("#rglow").style.opacity = (t < T.lock - 0.1 ? 0 : t < land ? 0.6 * cl((t - (T.lock - 0.1)) / 0.45) : 0.32 + 0.68 * Math.exp(-(t - land) / 0.25)).toFixed(3);
            $("#gRes").style.visibility = t >= T.lock - 0.12 ? "visible" : "hidden";
            const k1 = eP3in(cl((t - (T.lock - 0.2)) / 0.12)), k2 = eExpo(cl((t - (T.lock - 0.06)) / 0.3));
            $("#rk1").style.transform = "translateY(" + (-46 * k1).toFixed(2) + "px)";
            $("#rk2").style.transform = "translateY(" + (46 * (1 - k2)).toFixed(2) + "px)";
            $("#rk2").style.visibility = t >= T.lock - 0.06 ? "visible" : "hidden";
            const bar = $("#barF"), locked = t >= T.lock;
            bar.style.width = (100 * eSine(sp)).toFixed(2) + "%";
            const by = eP3o(cl((t - T.lock) / 0.3)), bs = cl((t - (T.lock + 0.04)) / 0.42);
            $("#barY").style.width = (100 * by).toFixed(2) + "%";
            $("#barS").style.opacity = bs > 0 && bs < 1 ? "1" : "0";
            $("#barS").style.transform = "translateX(" + (-110 + 790 * eP2io(bs)).toFixed(1) + "px)";
            // the bar collapses to the centre (0.18 s power3.in, 6 px blur) before the readout mask reaches it
            const bc = eP3in(cl((t - (T.exit + 0.04)) / 0.18));
            bar.parentNode.style.transform = bc > 0 ? "scaleX(" + (1 - bc).toFixed(4) + ")" : "";
            bar.parentNode.style.filter = bc > 0 ? "blur(" + (6 * bc).toFixed(2) + "px)" : "";
            bar.parentNode.style.opacity = (1 - bc * bc).toFixed(3);
            bar.style.boxShadow = locked ? "0 0 " + (22 * (1 - cl((t - T.lock) / 0.6)) + 8).toFixed(1) + "px rgba(255,200,60,.9)" : "0 0 12px rgba(51,214,255,.8)";
          }
          function holoAt(t) {
            const yaw = lerp(C.yaw[0], C.yaw[1], eP2io(cl(t / T.end)));
            // the scan is a thin laser contour on the body (plus a floor line), never a slab
            const scanK = t < T.scan1 ? eP3o(cl((t - T.ignite) / 0.22)) : 0;
            let lockK = 0, lockX = holo.XT - 0.1;
            if (t >= T.wave0) { lockK = 1; lockX = lerp(holo.XT - 0.05, holo.XN + 0.32, eP2in(cl((t - T.wave0) / (T.lock - T.wave0)))); }
            const eraseX = t >= T.erase0 ? lerp(holo.XN + 0.05, holo.XT - 0.5, cl((t - T.erase0) / (T.erase1 - T.erase0))) : 10;
            // payoff light: localized on the car (rim + emissive), peak held 3 frames, then decays; the lamps switch on
            const hu = t - T.lock;
            const hot = hu < 0 ? 0 : (hu < 3 / 30 ? 1 : Math.exp(-(hu - 3 / 30) / 0.22));
            const lights = eExpo(cl((t - (T.lock - 0.04)) / 0.12));
            // the payoff light is one specular band raking the printed car nose -> tail; the cloud squeezes and springs back
            const gu = (t - T.lock) / 0.24, glK = t >= T.lock - 0.02 && gu < 1.05 ? 1 : 0, glX = lerp(holo.XN + 0.5, holo.XT - 0.6, eP2io(cl(gu)));
            const su = t - T.lock, squeeze = su < 0 ? 0 : (su < 0.06 ? 0.06 * eP3o(su / 0.06) : 0.06 * (1 - eBack(cl((su - 0.06) / 0.35))));
            const floor = t < T.exit + 0.1 ? eP3o(cl((t - T.ignite) / 0.7)) : 1 - eP3in(cl((t - (T.exit + 0.1)) / 0.45));
            const erT = t >= T.erase0 ? cl((t - T.erase0) / (T.erase1 - T.erase0)) : 0;
            // projector pad: the rim draws round on boot with the floor, a ripple runs out to the rim on the lock, the pad retracts behind the erase
            const padIn = eP3o(cl((t - T.ignite) / 0.7)), padOut = eP2io(cl((t - (T.erase0 + 0.04)) / (T.erase1 - T.erase0)));
            const pulse = t >= T.lock ? (t - T.lock) / 0.55 : 0;
            holo.render({ yaw, pitch: C.pitch, dist: C.dist, scanX: t < T.scan1 ? scanXAt(t) : XT - 0.3, scanK, lockK, lockX, eraseX, erT, padIn, padOut, pulse,
              floor, shadow: lockK * eP3o(cl((t - T.wave0) / 0.4)) * (t < T.erase0 ? 1 : 1 - cl((t - T.erase0) / 0.4)),
              hot, lights, glK, glX, squeeze, rake: cl((t - T.rake0) / (T.rake1 - T.rake0)), bloom: (lockK > 0 ? 0.24 + 0.42 * hot : 0.4) * DBG.bloom, wire: DBG.wire, pts: DBG.pts,
              ghost: eP2io(cl((t - T.ignite) / 0.22)), t, pool: floor * (0.6 + 0.4 * lockK) });
            $("#holo").style.display = t < T.ignite || t > T.erase1 + 0.1 ? "none" : "";
          }
          function bedAt(t) {
            if (!plate) return;
            // the dim / scrim releases with the erase: it starts clearing as the last third of the car goes and is gone at erase1 + 0.04
            const eP2o = (x) => 1 - (1 - x) * (1 - x);
            const k = Math.min(eP2io(cl((t - 0.1) / 0.45)), 1 - eP2o(cl((t - (T.erase1 - 0.24)) / 0.28)));
            $("#push").style.filter = k > 0.001 ? "blur(" + (4 * k).toFixed(2) + "px) brightness(" + (1 - 0.36 * k).toFixed(3) + ") contrast(" + (1 + 0.15 * k).toFixed(3) + ") saturate(" + (1 - 0.15 * k).toFixed(3) + ")" : "";
            $("#vig").style.opacity = k.toFixed(3);
            $("#push").style.transform = "scale(" + (1.02 + 0.03 * eP2io(cl(t / T.end))).toFixed(4) + ")";
          }
          function renderAt(t) { bedAt(t); holoAt(t); hudAt(t); readoutAt(t); }

          const tl = gsap.timeline({ paused: true });
          Look.drive(tl, 0, T.end, (p) => renderAt(p * T.end));
          window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") renderAt(e.detail.time); });
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          window.__holoT = { T, locks: TG.map((o) => o.tl) };
          tl.seek(0);
          renderAt(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
