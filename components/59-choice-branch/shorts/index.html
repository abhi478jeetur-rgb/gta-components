     Variable: bg "plate" (sample GTA V footage) / "none" (transparent overlay). -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}

  <head>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;

      #title { position: absolute; left: 72px; width: 864px; top: 238px; text-align: center; }
      #pill { display: inline-flex; align-items: center; gap: 14px; height: 52px; padding: 0 26px 0 22px; border-radius: 26px;

      #pill .dot { width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 8px #FFFFFF; }
      #tline { margin-top: 26px; font: 800 108px/1.02 "Inter"; letter-spacing: -0.025em; color: #FFFFFF; white-space: nowrap; }

      .wi .k { color: #FFB2D9; text-shadow: 0 0 6px rgba(255,79,163,.95), 0 0 18px rgba(255,79,163,.85), 0 0 36px rgba(255,79,163,.55), 0 4px 14px rgba(0,0,0,.5); }

      .kl.on { color: #FF62B0; text-shadow: 0 0 12px rgba(255,79,163,.7), 0 2px 8px rgba(0,0,0,.6); }

        letter-spacing: -0.01em; color: #FFFFFF; -webkit-text-stroke: 7px rgba(8,6,12,.9); paint-order: stroke fill;

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <div id="shake"><div id="push">
        <video id="s1" class="clip shot" style="z-index:5" src="assets/shots/v05-franklin-lamar-street-v.mp4" muted playsinline data-start="0" data-duration="1.3" data-media-start="0" data-track-index="0"></video>
        <video id="s2" class="clip shot" style="z-index:4" src="assets/shots/v13-lowrider-gang-v.mp4" muted playsinline data-start="1.233" data-duration="1.167" data-media-start="0" data-track-index="1"></video>
        <video id="s3" class="clip shot" style="z-index:3" src="assets/shots/v14-driveby-sunset-v.mp4" muted playsinline data-start="2.333" data-duration="0.937" data-media-start="0.35" data-track-index="0"></video>
        <video id="s4" class="clip shot" style="z-index:2" src="assets/shots/v44-bridge-skyline-v.mp4" muted playsinline data-start="3.203" data-duration="1.667" data-media-start="0" data-track-index="1"></video>
        <video id="s5" class="clip shot" style="z-index:1" src="assets/shots/v36-hills-city-view-v.mp4" muted playsinline data-start="4.803" data-duration="1.197" data-media-start="0.3" data-track-index="0"></video>

        <div class="opt" id="opt0"><div class="kw"><div class="kin"><div class="kl k1"></div><div class="kl k2 on"></div></div></div><div class="nw"><div class="nin"></div></div></div>
        <div class="opt" id="opt1"><div class="kw"><div class="kin"><div class="kl k1"></div><div class="kl k2 on"></div></div></div><div class="nw"><div class="nin"></div></div></div>

    <script>
      const CONFIG = {
        pill: "GROVE STREET · WHAT IF?",
        title: "one choice.|two [endings].",          // [word] = pink keyword, "|" = line break
        options: [
          { kicker: "SIDE WITH", chosenKicker: "YOU SIDED WITH", name: "LAMAR",   icon: "crew",   color: ["#5BF098", "#1DB257", "#0A6A31"] },
          { kicker: "SIDE WITH", chosenKicker: "YOU SIDED WITH", name: "STRETCH", icon: "dagger", color: ["#BE8EFF", "#7E43EE", "#43179A"] }
        ],
        chosen: 0,
        neon: "#FF4FA3", neonHot: "#FFE9F4",
        timing: { title: 0.16, trunk: 0.40, trunkDur: 0.56, fork: 0.96, branchDur: 0.56, tiles: 1.34, labels: 1.52,
                  pulse: 2.62, hit: 3.27, out: 5.05, end: 6.0 }
      };

      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const C = CONFIG, T = C.timing, $ = (s) => document.querySelector(s);
        const W = 1080, H = 1920, VERT = true;
        if (!plate) { document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none")); $("#dim").style.display = "none"; }

        // ---------------- layout (page px) ----------------
        const LY = {
          r: 9, pivot: [504, 950],
          trunk: [[504, 585], [504, 800]], node: [504, 800],
          S: 222, bev: 10, depth: 38, corner: 50, gap: 16,
          tiles: [[290, 1090], [718, 1090]],
          restRot: [[0.24, -0.12], [0.24, 0.12]],          // [rx, ry]
          labelDX: 0, nodeR: 21, spark: 92
        };
        const HALF = LY.S / 2 + LY.bev, KH = 44;              // KH = kicker line height (px)                      // outer half size of a tile
        const ATT = HALF + LY.gap;                           // wrap / socket offset from tile centre

        // ---------------- helpers ----------------
        const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
        const seg = (t, a, d) => clamp((t - a) / d);
        const lerp = (a, b, k) => a + (b - a) * k;
        const eO3 = (p) => 1 - Math.pow(1 - p, 3), eI2 = (p) => p * p, eI3 = (p) => p * p * p;
        const eIO2 = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
        const eOB = (p, s = 1.7) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);
        const springTo = (p, k = 6, f = 2.4) => p <= 0 ? 0 : 1 - Math.exp(-k * p) * Math.cos(f * Math.PI * p);
        const hex3 = (h) => { const n = parseInt(h.slice(1), 16); return new THREE.Vector3(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255); };

        // ---------------- DOM text ----------------
        $("#pillTxt").textContent = C.pill;
        const tline = $("#tline"), words = [];
        C.title.split("|").forEach((line, li) => {
          if (li) tline.appendChild(document.createElement("br"));
          line.split(" ").forEach((wd, wi, arr) => {
            const m = wd.match(/^(.*?)\[(.+?)\](.*)$/);
            const w = document.createElement("span"); w.className = "w";
            const i = document.createElement("span"); i.className = "wi";
            if (m) { i.appendChild(document.createTextNode(m[1])); const kk = document.createElement("span"); kk.className = "k"; kk.textContent = m[2]; i.appendChild(kk); i.appendChild(document.createTextNode(m[3])); }
            else i.textContent = wd;
            w.appendChild(i); tline.appendChild(w); words.push(i);
            if (wi < arr.length - 1) tline.appendChild(document.createTextNode(" "));
          });
        });
        const opts = C.options.map((o, i) => {
          const el = $("#opt" + i);
          el.querySelector(".k1").textContent = o.kicker; el.querySelector(".k2").textContent = o.chosenKicker;
          el.querySelector(".nin").textContent = o.name;
          return { el, kin: el.querySelector(".kin"), nin: el.querySelector(".nin"), k1: el.querySelector(".k1"), k2: el.querySelector(".k2") };
        });

        function radialTex(stops, size = 128) {
          const cv = document.createElement("canvas"); cv.width = cv.height = size; const ctx = cv.getContext("2d");
          const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
          stops.forEach(([o, c]) => g.addColorStop(o, c)); ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
          const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; return tex;
        }

        // ---------------- tile faces: our own icons ----------------
        function person(c, x, y, r, bw, bottom) {
          c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
          const top = y + r + 20, ry = bw * 0.82, cy = top + ry;
          c.beginPath(); c.ellipse(x, cy, bw, ry, 0, Math.PI, 0); c.lineTo(x + bw, bottom - 26);
          c.quadraticCurveTo(x + bw, bottom, x + bw - 26, bottom); c.lineTo(x - bw + 26, bottom);
          c.quadraticCurveTo(x - bw, bottom, x - bw, bottom - 26); c.closePath(); c.fill();
        }
        const ICONS = {
          crew(c, N, o) {
            c.fillStyle = "rgba(255,255,255,.80)"; person(c, 322, 170, 56, 104, 404);
            c.save(); c.shadowColor = "transparent"; c.fillStyle = o.color[1];
            c.beginPath(); c.arc(208, 196, 84, 0, Math.PI * 2); c.fill();
            c.beginPath(); c.ellipse(208, 196 + 68 + 20 + 116, 144, 128, 0, Math.PI, 0); c.lineTo(352, 420); c.lineTo(64, 420); c.closePath(); c.fill();
            c.restore();
            c.fillStyle = "#FFFFFF"; person(c, 208, 196, 68, 128, 410);
          },
          dagger(c, N) {
            c.translate(256, 262); c.rotate(Math.PI / 4); c.fillStyle = "#FFFFFF";
            c.beginPath(); c.moveTo(0, -214); c.lineTo(40, -158); c.lineTo(38, 26); c.lineTo(-38, 26); c.lineTo(-40, -158); c.closePath(); c.fill();
            c.save(); c.shadowColor = "transparent"; c.fillStyle = "rgba(40,20,70,.16)";
            c.beginPath(); c.moveTo(0, -214); c.lineTo(40, -158); c.lineTo(38, 26); c.lineTo(0, 26); c.closePath(); c.fill(); c.restore();
            c.beginPath(); c.roundRect(-98, 26, 196, 38, 19); c.fill();
            c.beginPath(); c.roundRect(-24, 64, 48, 112, 12); c.fill();
            c.save(); c.shadowColor = "transparent"; c.fillStyle = "rgba(40,20,70,.22)";
            for (let k = 0; k < 4; k++) c.fillRect(-24, 84 + k * 24, 48, 7); c.restore();
            c.beginPath(); c.arc(0, 200, 32, 0, Math.PI * 2); c.fill();
          }
        };
        function faceCanvas(o) {
          const N = 512, cv = document.createElement("canvas"); cv.width = cv.height = N; const c = cv.getContext("2d");
          let g = c.createLinearGradient(0, 0, 0, N); g.addColorStop(0, o.color[0]); g.addColorStop(0.52, o.color[1]); g.addColorStop(1, o.color[2]);
          c.fillStyle = g; c.fillRect(0, 0, N, N);
          g = c.createRadialGradient(N * 0.28, N * 0.1, 0, N * 0.28, N * 0.1, N * 0.8); g.addColorStop(0, "rgba(255,255,255,.34)"); g.addColorStop(1, "rgba(255,255,255,0)");
          c.fillStyle = g; c.fillRect(0, 0, N, N);
          g = c.createLinearGradient(0, N * 0.62, 0, N); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.3)");
          c.fillStyle = g; c.fillRect(0, 0, N, N);
          c.save(); c.shadowColor = "rgba(0,0,0,.4)"; c.shadowBlur = 22; c.shadowOffsetY = 10;
          ICONS[o.icon](c, N, o); c.restore();
          const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4; return tex;
        }

        function build() {
          const canvas = $("#gl");
          const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true, premultipliedAlpha: true });
          renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.setClearColor(0x000000, 0);
          renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
          const scene = new THREE.Scene();
          const FOV = 24, DIST = (H / 2) / Math.tan((FOV / 2) * Math.PI / 180);
          const camera = new THREE.PerspectiveCamera(FOV, W / H, 10, DIST * 3);
          camera.position.set(0, 0, DIST); camera.lookAt(0, 0, 0);

          // studio env for the clear coat
          const envScene = new THREE.Scene();
          envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 48, 24), new THREE.ShaderMaterial({
            side: THREE.BackSide, depthWrite: false,
            vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
            fragmentShader: "varying vec3 vP; void main(){ float y = vP.y; vec3 top = vec3(0.92,0.94,1.0), hor = vec3(0.24,0.2,0.26), low = vec3(0.03,0.03,0.04);" +
              " vec3 c = y > 0.0 ? mix(hor, top, smoothstep(0.0, 0.9, y)) : mix(hor, low, smoothstep(0.0, 0.45, -y)); gl_FragColor = vec4(c, 1.0); }"
          })));
          const panel = (w, h, x, y, z, c) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); envScene.add(m); };
          panel(36, 14, -14, 26, 26, new THREE.Color(4.2, 4.1, 4.0));
          panel(5, 34, 30, 2, 18, new THREE.Color(2.4, 2.5, 2.9));
          panel(30, 8, -30, -4, 10, new THREE.Color(3.2, 0.9, 2.0));       // pink neon strip on the left
          panel(26, 8, -6, -24, 24, new THREE.Color(0.8, 0.75, 0.8));
          const pmrem = new THREE.PMREMGenerator(renderer);
          scene.environment = pmrem.fromScene(envScene, 0.02, 0.1, 200).texture;
          const key = new THREE.DirectionalLight(0xffffff, 2.1); key.position.set(-0.5, 0.9, 1.0); scene.add(key);
          scene.add(new THREE.HemisphereLight(0xffffff, 0x2a2232, 0.85));

          // diagram group, pivoted at the diagram centre
          const G = new THREE.Group(); G.position.set(LY.pivot[0] - W / 2, H / 2 - LY.pivot[1], 0); scene.add(G);
          const P = (x, y, z = 0) => new THREE.Vector3(x - LY.pivot[0], LY.pivot[1] - y, z);

          // ---------- neon shaders ----------
          const VS = "varying vec2 vUv; varying vec3 vN; varying vec3 vV;" +
            "void main(){ vUv = uv; vec4 mv = modelViewMatrix * vec4(position,1.0); vV = mv.xyz; vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * mv; }";
          const COMMON = "uniform vec3 uCol; uniform vec3 uHot; uniform float uLen, uProg, uTail, uFade, uDim, uGlow, uP1, uA1, uP2, uA2, uP3, uA3;" +
            "varying vec2 vUv; varying vec3 vN; varying vec3 vV;" +
            "float bump(float x, float p){ float d = x - p; float w = d < 0.0 ? 170.0 : 30.0; return exp(-d*d/(w*w)); }" +
            "float pulses(float x){ return uA1*bump(x,uP1) + uA2*bump(x,uP2) + uA3*bump(x,uP3); }";
          const FS_CORE = COMMON +
            "void main(){ float x = vUv.x * uLen; if (x > uProg || x < uTail) discard;" +
            " vec3 N = normalize(vN); vec3 V = normalize(-vV); float f = clamp(abs(dot(N,V)),0.0,1.0);" +
            " vec3 lit = mix(uCol*0.5, uCol, smoothstep(0.0,0.5,f)); lit = mix(lit, uHot, smoothstep(0.55,0.97,f)*0.92);" +
            " vec3 off = vec3(0.30,0.24,0.31)*(0.55+0.45*f);" +
            " vec3 L = normalize(vec3(-0.45,0.8,0.6)); vec3 Hh = normalize(L+V); float sp = pow(max(dot(N,Hh),0.0),24.0);" +
            " float pl = pulses(x);" +
            " vec3 c = mix(off, lit, uDim) + vec3(1.0,0.93,0.97)*pl + vec3(1.0)*sp*(0.28+0.3*(1.0-uDim));" +
            " float a = uFade > 0.0 ? smoothstep(0.0, uFade, x) : 1.0;" +
            " gl_FragColor = vec4(min(c, vec3(1.0)), a); }";
          const FS_GLOW = COMMON +
            "void main(){ float x = vUv.x * uLen; if (x > uProg || x < uTail) discard;" +
            " vec3 N = normalize(vN); vec3 V = normalize(-vV); float f = clamp(abs(dot(N,V)),0.0,1.0);" +
            " float pl = pulses(x); float a = pow(f, 2.4) * (uGlow + pl*0.45);" +
            " a *= uFade > 0.0 ? smoothstep(0.0, uFade*1.4, x) : 1.0;" +
            " gl_FragColor = vec4(mix(uCol, vec3(1.0,0.9,0.96), clamp(pl*0.5,0.0,0.7)), clamp(a,0.0,1.0)); }";
          const FS_SHADOW = COMMON +
            "void main(){ float x = vUv.x * uLen; if (x > uProg || x < uTail) discard;" +
            " vec3 N = normalize(vN); vec3 V = normalize(-vV); float f = clamp(abs(dot(N,V)),0.0,1.0);" +
            " float a = pow(f, 1.6) * uGlow; a *= uFade > 0.0 ? smoothstep(0.0, uFade*1.4, x) : 1.0;" +
            " gl_FragColor = vec4(0.02,0.0,0.03, clamp(a,0.0,1.0)); }";
          const NEON = hex3(C.neon), HOT = hex3(C.neonHot);
          function uni(len, fade) {
            return { uCol: { value: NEON }, uHot: { value: HOT }, uLen: { value: len }, uProg: { value: 0 }, uTail: { value: 0 }, uFade: { value: fade || 0 },
              uDim: { value: 1 }, uGlow: { value: 0.55 }, uP1: { value: -999 }, uA1: { value: 0 }, uP2: { value: -999 }, uA2: { value: 0 }, uP3: { value: -999 }, uA3: { value: 0 } };
          }
          // a neon line = shadow + glow + core tubes sharing one uniform set
          function neon(curve, parent, fade, segs) {
            const len = curve.getLength(), n = segs || Math.max(24, Math.round(len / 3));
            const U = uni(len, fade);
            const mk = (rad, fs, order, depthWrite) => {
              const m = new THREE.Mesh(new THREE.TubeGeometry(curve, n, rad, 20, false),
                new THREE.ShaderMaterial({ uniforms: U, vertexShader: VS, fragmentShader: fs, transparent: true, depthWrite, side: THREE.FrontSide }));
              m.renderOrder = order; parent.add(m); return m;
            };
            const sh = mk(LY.r * 3.0, FS_SHADOW, 0, false);
            const gl = mk(LY.r * 4.2, FS_GLOW, 1, false);
            const co = mk(LY.r, FS_CORE, 2, true);
            return { curve, len, U, meshes: [sh, gl, co], shadowU: null };
          }
          // shadow tube uses its own glow strength (darker, steadier)
          function neonLine(curve, parent, fade) {
            const L = neon(curve, parent, fade);
            const SU = Object.assign({}, L.U, { uGlow: { value: 0.36 } });
            L.meshes[0].material.uniforms = SU; L.SU = SU; return L;
          }
          function sync(L) { ["uProg", "uTail", "uDim"].forEach((k) => (L.SU[k].value = L.U[k].value)); }

          // trunk + branches
          const trunk = neonLine(new THREE.LineCurve3(P(...LY.trunk[0]), P(...LY.trunk[1])), G, 70);
          const branches = LY.tiles.map(([tx, ty]) => {
            const n = LY.node;
            const c = VERT
              ? new THREE.CubicBezierCurve3(P(n[0], n[1]), P(n[0], n[1] + 92), P(tx, ty - ATT - 104), P(tx, ty - ATT))
              : new THREE.CubicBezierCurve3(P(n[0], n[1]), P(n[0] + 140, n[1]), P(tx - ATT - 112, ty), P(tx - ATT, ty));
            return neonLine(c, G, 0);
          });

            if (plate) $("#dim").style.opacity = (eIO2(seg(t, 0.2, 0.5)) * (1 - eIO2(seg(t, T.out + 0.2, 0.45)))).toFixed(3);
          }

          window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") renderAt(e.detail.time); });
          const tl = gsap.timeline({ paused: true });
          renderAt(0);
          Look.drive(tl, 0, T.end, (p) => renderAt(p * T.end));
          if (plate) {
            Look.impact(tl, T.hit, { shake: "#shake", amp: 6, dur: 0.3, flash: 0, zoom: 1.012 });
            Look.push(tl, "#push", 0, T.end, { to: 1.04 });
          }
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        }

        const FACES = ["800 100px Inter", "900 100px Archivo"];
        Promise.all(FACES.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(build);
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
