<!doctype html>
<!-- 60 Song credit, variant A: "Now playing" (16:9, 1920x1080, 30 fps, 6.9 s).
     Lower-left music credit: a real 3D record slides out of its album sleeve and spins, the title and artist pull out from
     under it, a live equaliser beside the kicker. Variable: bg "plate" (sample footage) / "none" (transparent overlay). -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="media/vinyl3d.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push { position: absolute; inset: 0; }
      #shake { z-index: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ov { position: absolute; inset: 0; z-index: 10; }
      #deck { position: absolute; left: 0; top: 0; z-index: 3; will-change: transform; }
      #deck canvas { filter: drop-shadow(0 2px 2px rgba(0,0,0,.5)) drop-shadow(0 10px 16px rgba(0,0,0,.42)); }
      #credit { position: absolute; z-index: 2; white-space: nowrap; }
      #slide { position: relative; will-change: transform; }
      #kick { display: flex; align-items: flex-end; gap: 12px; height: 30px; margin-bottom: 8px; }
      #eq { display: flex; align-items: flex-end; gap: 4px; height: 30px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.7)) drop-shadow(0 3px 6px rgba(0,0,0,.45)); }
      #eq i { display: block; width: 7px; height: 30px; border-radius: 2.5px 2.5px 1px 1px; transform-origin: 50% 100%;
        background: linear-gradient(180deg, #FFF3C4 0%, #FFD23C 18%, #F6B13A 60%, #E07A16 100%);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.85), inset 0 -2px 2px rgba(120,50,0,.35); }
      #kicktx { font: 800 23px/1 "Inter"; letter-spacing: .16em; color: #FFD23C; paint-order: stroke fill; -webkit-text-stroke: 4px rgba(7,6,10,.85);
        text-shadow: 0 1px 1px rgba(0,0,0,.75), 0 2px 10px rgba(0,0,0,.6); padding-bottom: 1px; }
      .tx { position: relative; line-height: 1; white-space: nowrap; }
      .tx .layer { position: absolute; left: 0; top: 0; white-space: nowrap; }
      .tx .back { color: #07060a; paint-order: stroke fill; }
      .tx .sizer { visibility: hidden; }
      #title { font: 900 62px/1 "Inter"; letter-spacing: -0.022em; height: 66px; }
      #artist { font: 600 36px/1 "Inter"; letter-spacing: -0.01em; margin-top: 6px; height: 40px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.9" data-width="1920" data-height="1080">
      <div id="shake"><div id="push">
        <video id="s1" class="clip shot" style="z-index:5" src="assets/shots/v17-deluxo-sunset-h.mp4" muted playsinline data-start="0" data-duration="1.6" data-media-start="0" data-track-index="0"></video>
        <video id="s2" class="clip shot" style="z-index:4" src="assets/shots/v38-freeway-dusk-h.mp4" muted playsinline data-start="1.5333" data-duration="1.4667" data-media-start="0.2" data-track-index="1"></video>
        <video id="s3" class="clip shot" style="z-index:3" src="assets/shots/v12-heli-city-dusk-h.mp4" muted playsinline data-start="2.9333" data-duration="1.6" data-media-start="0" data-track-index="0"></video>
        <video id="s4" class="clip shot" style="z-index:2" src="assets/shots/v41-smokestacks-dusk-h.mp4" muted playsinline data-start="4.4667" data-duration="1.4667" data-media-start="0" data-track-index="1"></video>
        <video id="s5" class="clip shot" style="z-index:1" src="assets/shots/v24-sunset-powerlines-h.mp4" muted playsinline data-start="5.8667" data-duration="1.0333" data-media-start="0" data-track-index="0"></video>
      </div></div>
      <div id="ov" class="clip" data-start="0" data-duration="6.9" data-track-index="2">
        <div id="credit">
          <div id="slide">
            <div id="kick"><div id="eq"><i></i><i></i><i></i><i></i><i></i></div><div id="kicktx"></div></div>
            <div class="tx" id="title"></div>
            <div class="tx" id="artist"></div>
          </div>
        </div>
        <div id="deck"></div>
      </div>
    </div>
    <script>
      const CONFIG = {
        title: "Coastline Ghosts",
        artist: "Mara Solace",
        kicker: "NOW PLAYING",
        side: "SIDE A  ·  33⅓",
        // where the sleeve sits: its left edge and its vertical centre (px). Lower-left, lifted clear of the GTA minimap
        // (the bottom-left 300 x 140 stays free). For the evidence's top placement use { x: 96, y: 190 }.
        anchor: { x: 96, y: 772 },
        sleeve: 212,                 // sleeve size (px); the record is 0.94 x sleeve
        cover: null,                 // optional path to your own square cover art (e.g. "media/cover.jpg"); null = our synthwave sleeve
        rpm: 33.333,
        colors: {
          title: "linear-gradient(180deg, #FFFFFF 0%, #FFFFFF 52%, #ECE6F2 100%)",
          artist: "linear-gradient(180deg, #FFFFFF 0%, #F1EDF5 100%)",
          stroke: "rgba(7,6,10,.9)",
          vinyl: "#0b0b0e"
        },
        timing: { in: 0.15, out: 0.6, lock: 1.08, tuck: 5.95, home: 6.05, gone: 6.22, end: 6.9 }
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const C = CONFIG, T = C.timing, $ = (s) => document.querySelector(s), PI = Math.PI;
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));
        const Ez = (n) => gsap.parseEase(n);
        const seg = (t, a, b, e) => { const p = t <= a ? 0 : t >= b ? 1 : (t - a) / (b - a); return e ? Ez(e)(p) : p; };
        const wob = (t, t0, amp, f, k) => (t < t0 ? 0 : amp * Math.exp(-k * (t - t0)) * Math.sin(2 * PI * f * (t - t0)));

        // ---------- geometry (screen px) ----------
        const S = C.sleeve, R = Math.round(S * 0.47), OUT = Math.round(S * 0.52);
        const CW = 470, CH = 320, padL = 44;
        const deckX = C.anchor.x - padL, deckY = C.anchor.y - CH / 2;
        const sleeveC = [padL + S / 2, CH / 2];                         // canvas coords
        const discOutRight = deckX + sleeveC[0] + OUT + R;              // screen x of the record's right edge once out
        const discCX = deckX + sleeveC[0] + OUT;                         // screen x of the record's centre once out
        const deck = $("#deck"); deck.style.width = CW + "px"; deck.style.height = CH + "px";
        gsap.set(deck, { x: deckX, y: deckY });

        const FACES = ["900 100px Inter", "800 100px Inter", "600 100px Inter", "900 100px Archivo", "800 100px Archivo"];
        const cover = C.cover ? new Image() : null; if (cover) cover.src = C.cover;
        Promise.all(FACES.map((f) => document.fonts.load(f)).concat(cover ? [cover.decode().catch(() => {})] : [])).then(() => document.fonts.ready).then(() => {
          // ---------- 3D record + sleeve ----------
          const V = Vinyl3D({ w: CW, h: CH, ss: 2, R, disc: sleeveC, vinyl: C.colors.vinyl, wedgeAngle: 0.8, exposure: 1.0,
            label: Vinyl3D.drawLabel({ title: C.title, artist: C.artist, side: C.side }),
            ringW: 0.045, sleeve: { size: S, depth: 5, at: sleeveC, art: Vinyl3D.drawSleeve({ title: C.title, artist: C.artist, cover }) } });
          deck.appendChild(V.canvas);

          // ---------- type: a dark edge + shadow layer under a satin face layer ----------
          $("#kicktx").textContent = C.kicker;
          function layered(el, text, grad, strokePx) {
            const sizer = document.createElement("div"); sizer.className = "sizer"; sizer.textContent = text;
            const back = document.createElement("div"); back.className = "layer back"; back.textContent = text;
            back.style.webkitTextStroke = strokePx + "px " + C.colors.stroke;
            back.style.textShadow = "0 2px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.5)";
            const front = document.createElement("div"); front.className = "layer front"; front.textContent = text;
            el.appendChild(sizer); el.appendChild(back); el.appendChild(front);
            Look.fill(front, grad, { sheen: true });
            return front;
          }
          const tFront = layered($("#title"), C.title, C.colors.title, 6);
          layered($("#artist"), C.artist, C.colors.artist, 5);
          const credit = $("#credit"), slide = $("#slide");
          const textX = discOutRight + 26;
          credit.style.left = textX + "px";
          const blockH = credit.offsetHeight; credit.style.top = (C.anchor.y - blockH / 2 - 2) + "px";
          const tw = credit.offsetWidth;
          // the text lives only right of the record's centre line: it pulls out from under the record
          const clipL = discCX - textX;
          credit.style.clipPath = "inset(-40px -60px -40px " + clipL + "px)";
          const SX = -(tw + (textX - discCX) + 10);
          gsap.set(slide, { x: SX });

          // ---------- equaliser (deterministic live noise + a 120 bpm pulse) ----------
          const bars = Array.from(document.querySelectorAll("#eq i"));
          const ph = bars.map((_, i) => [Look.hash(i * 7 + 1) * 6.28, Look.hash(i * 7 + 2) * 6.28, Look.hash(i * 7 + 3) * 6.28]);
          function eqAt(t) {
            const live = seg(t, T.lock + 0.02, T.lock + 0.22, "back.out(2.6)") * (1 - seg(t, T.tuck, T.tuck + 0.16, "power2.in"));
            bars.forEach((b, i) => {
              const p = ph[i], f = 1 + i * 0.37;
              const n = 0.5 + 0.22 * Math.sin(2 * PI * 1.9 * f * t + p[0]) + 0.16 * Math.sin(2 * PI * 4.3 * f * t + p[1]) + 0.12 * Math.sin(2 * PI * 7.7 * t + p[2]);
              const bt = ((t - T.lock) % 0.5 + 0.5) % 0.5, beat = Math.exp(-9 * bt) * (i % 2 ? 0.8 : 1);
              const pu = t > T.lock + i * 0.03 ? 0.75 * Math.exp(-5 * (t - T.lock - i * 0.03)) : 0;   // the payoff pump: every bar slams to the top, then settles into the groove
              const h = Math.min(1, Math.max(0.12, 0.18 + 0.55 * n + 0.32 * beat + pu));
              b.style.transform = "scaleY(" + (0.14 + (h - 0.14) * live).toFixed(3) + ")";
            });
          }

          // ---------- the record's state from time ----------
          const w0 = 2 * PI * C.rpm / 60, tA = T.out, tB = T.lock + 0.3;   // spins up while it slides out
          function spinAt(t) {
            if (t <= tA) return 0;
            const ramp = tB - tA;
            let th = t < tB ? w0 * (t - tA) * (t - tA) / (2 * ramp) : w0 * ramp / 2 + w0 * (t - tB);
            if (t > T.home) { const d = Math.min(t, T.home + 0.3) - T.home; th -= w0 * d * d / (2 * 0.3) * 0.9; }
            return th;
          }
          function deckState(t) {
            const st = { rig: {} }, P = T.lock;
            // sleeve swings in spine-first and settles flat-ish (spine stays a little forward so its edge reads)
            const pin = seg(t, T.in, T.in + 0.62, "power3.out");
            st.rig.ry = 0.3 + 0.8 * (1 - pin) + wob(t, T.in + 0.55, 0.06, 1.8, 6);
            st.rig.rx = -0.08 + 0.12 * (1 - pin);
            st.rig.rz = 0.08 * (1 - pin) + wob(t, T.in + 0.5, -0.025, 2, 7);
            // the hold breathes: a slow orbit turns the sleeve a little further to the lens, so the light glides over the laminate
            const orb = seg(t, T.lock + 0.4, T.tuck, "sine.inOut");
            st.rig.ry -= 0.13 * orb; st.rig.rx += 0.03 * orb;
            // the record slides out with overshoot; the sleeve recoils a few px and springs back
            const so = seg(t, T.out, P, "back.out(1.9)") * (1 - seg(t, T.home, T.home + 0.24, "power2.in"));
            st.out = OUT * so;
            st.rig.x = -4 * Math.sin(PI * seg(t, T.out, T.out + 0.25)) + wob(t, P, -2.5, 3.2, 9);
            st.spin = spinAt(t);
            // the record seats as it locks: a 2-frame pop toward the lens, then a damped settle
            const pk = seg(t, P - 0.04, P + 0.03), dt = Math.max(0, t - P - 0.03);
            st.discS = 1 + 0.06 * pk * Math.exp(-7 * dt) * Math.cos(2 * PI * 2.6 * dt);
            // payoff light: the wedge flares and swings with the raking light, exposure lift on the 3D layer only
            const fl = seg(t, P - 0.03, P + 0.04) * (1 - seg(t, P + 0.16, P + 0.6, "power2.out"));
            st.wedge = 0.6 + 1.1 * fl;
            st.wedgeAngle = 1.55 - 0.8 * seg(t, P - 0.08, P + 0.6, "power2.out") + 0.06 * Math.sin(2 * PI * 0.25 * (t - P));
            st.rake = fl; st.rakeX = -1.6 + 3 * seg(t, P - 0.05, P + 0.5, "power1.inOut");
            st.band = -1.9 + 3.8 * seg(t, P - 0.02, P + 0.42, "power1.inOut");
            st.bandAmp = 0.2 * seg(t, P - 0.04, P + 0.04) * (1 - seg(t, P + 0.3, P + 0.44));
            if (t > P + 0.44) { st.band = -1.9 + 3.8 * seg(t, P + 0.5, T.tuck, "sine.inOut"); st.bandAmp = 0.06 * Math.sin(PI * seg(t, P + 0.5, T.tuck)); }
            // a ring of light runs in across the grooves from the lip to the label as the record locks and starts to play
            const rg = seg(t, P - 0.02, P + 0.42, "power2.out");
            st.ringR = 0.95 - 0.55 * rg; st.ringA = 2.0 * seg(t, P - 0.02, P + 0.02) * (1 - seg(t, P + 0.22, P + 0.44, "power1.in"));
            st.expo = seg(t, P, P + 0.034) * (1 - seg(t, P + 0.134, P + 0.42, "power2.out"));
            return st;
          }
          const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("width", "0"); svg.setAttribute("height", "0"); svg.style.position = "absolute";
          svg.innerHTML = '<filter id="mbx" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB"><feGaussianBlur id="mbxg" stdDeviation="0 0"/></filter>';
          document.body.appendChild(svg);
          const mbg = document.getElementById("mbxg");
          const deckOff = (t) => -(deckX + CW + 40) * (1 - seg(t, T.in, T.in + 0.55, "expo.out")) - (deckX + CW + 60) * seg(t, T.gone, T.gone + 0.3, "power3.in");
          function renderAt(t) {
            const on = t >= T.in && t < T.gone + 0.3;
            const x = deckOff(t), v = Math.abs(deckOff(t + 1 / 60) - deckOff(t - 1 / 60)) * 15;
            gsap.set(deck, { x: deckX + x, y: deckY, opacity: on ? 1 : 0 });
            const mb = Math.min(14, Math.max(0, v - 6) * 0.1);
            if (mb > 0.5) { mbg.setAttribute("stdDeviation", mb.toFixed(2) + " 0"); deck.style.filter = "url(#mbx)"; } else deck.style.filter = "";
            if (on) V.render(deckState(t));
            eqAt(t);
          }

          [$("#ov")].concat(Array.from($("#ov").querySelectorAll("*"))).forEach((nd) => ["occlusion", "overlap", "overflow"].forEach((k) => nd.setAttribute("data-layout-allow-" + k, "")));
          const tl = gsap.timeline({ paused: true });
          Look.drive(tl, 0, T.end, (p) => renderAt(p * T.end));
          window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") renderAt(e.detail.time); });

          // ---------- text: pulls out from under the record as it locks, tucks back on exit ----------
          tl.fromTo(slide, { x: SX }, { x: 0, duration: 0.52, ease: "expo.out", immediateRender: false }, T.lock - 0.02);
          Look.mblur(tl, slide, T.lock - 0.02, 0.3, { x: 16, ease: "power2.out" });
          Look.sheen(tl, $("#title"), T.lock + 0.26, { dur: 0.7, ease: "power2.inOut" });
          tl.fromTo(slide, { x: 0 }, { x: SX, duration: 0.3, ease: "power3.in", immediateRender: false }, T.tuck);
          Look.mblur(tl, slide, T.tuck + 0.1, 0.2, { x: 0, to: [12, 0], ease: "power2.in" });
          tl.set(slide, { opacity: 0 }, T.tuck + 0.3);
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
</body>
</html>
