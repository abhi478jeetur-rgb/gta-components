<!doctype html>
<!-- GTA-niche 61 Disclaimer card, variant A: "Full-screen disclaimer" (16:9 long-form, 1920x1080, 30 fps, 5.6 s).
     The disclaimer before a mod / story video: a hard cut from gameplay to a black card. A red enamel warning plate
     (Three.js: a rounded steel-bevelled slab, chrome screws, a raised white pinstripe, a white enamel warning triangle with
     its "!" cut through, "DISCLAIMER" in raised white enamel Archivo letters) slams onto the black, a red rule draws out
     under it, the first line rises in, then the punchline (the creators' red bracketed middle line) stamps down and a light
     rakes across the plate. A 3 s hold, then the card rushes at the lens and hard-cuts back to gameplay.
     Variable: bg "plate" (sample footage + the black card) / "none" (transparent: the plate and lines only). See ../DECISIONS.md. -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="media/glyphs.js"></script>
    <script src="media/plate3d.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ov, #card, #cardShake, #cardIn, #t3d, #pool { position: absolute; inset: 0; pointer-events: none; }
      #card { opacity: 0; }
      #card.solid { background: #000; }
      #pool { opacity: 0; }
      .line { position: absolute; left: 0; width: 1920px; text-align: center; white-space: nowrap; color: #FFFFFF;
        font: 600 54px/1 "Inter"; letter-spacing: -0.012em; font-feature-settings: "ss01" 1, "cv11" 1; }
      #l2 { font-weight: 800; color: #FF2E3A; letter-spacing: -0.014em; }
      #l2 .br { color: #FF2E3A; font-weight: 600; }
      #l2in { display: inline-block; transform-origin: 50% 60%; }
      #rule { position: absolute; height: 8px; border-radius: 4px; transform-origin: 50% 50%;
        background: linear-gradient(180deg, #FF8A8F 0%, #FF3A46 30%, #E3182C 62%, #A50C1E 100%);
        box-shadow: 0 0 0 1px rgba(80,0,8,.35), 0 0 22px rgba(255,46,58,.42), 0 0 60px rgba(255,46,58,.18); }
      #ruleHot { position: absolute; left: 0; top: -10px; width: 100%; height: 28px; opacity: 0;
        background: radial-gradient(closest-side, rgba(255,236,226,.95) 0%, rgba(255,120,120,.4) 40%, rgba(255,46,58,0) 100%); }
      .ink .line { text-shadow: 0 2px 3px rgba(0,0,0,.55), 0 4px 18px rgba(0,0,0,.45); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.6" data-width="1920" data-height="1080">
      <div id="shake"><div id="push">
        <video id="s2" class="clip shot" src="assets/shots/v11-yacht-h.mp4" muted playsinline data-start="4.9" data-duration="0.7" data-media-start="0.3" data-track-index="0"></video>
        <video id="s1" class="clip shot" src="assets/shots/v05-franklin-lamar-street-h.mp4" muted playsinline data-start="0" data-duration="0.7" data-media-start="0.1" data-track-index="1"></video>
      </div></div>
      <div id="ov" class="clip" data-start="0" data-duration="5.6" data-track-index="2">
        <div id="card">
          <div id="pool"></div>
          <div id="cardShake">
            <div id="t3d"></div>
            <div id="cardIn">
              <div id="rule"><div id="ruleHot"></div></div>
              <div class="line" id="l1"></div>
              <div class="line" id="l2"><span id="l2in"></span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const CONFIG = {
        heading: "DISCLAIMER",                                         // raised enamel letters on the plate (A-Z 0-9 . , ' ! ? - & : #)
        line1: "No NPCs were harmed in the making of this video.",     // white, rises in word by word
        line2: "[Okay, a few. They all respawned.]",                   // the red bracketed punchline that stamps down (the payoff)
        type: { cap: 126, tracking: 0.012, lineSize: 54 },
        colors: {
          plate: ["#FF5A63", "#F0202F", "#D3122A", "#A00C1F"],          // red enamel, top -> bottom
          steel: ["#DCE1E8", "#2E333B", "#F4F6FA"],                     // bevel / walls: near, far, lit lip
          white: ["#FFFFFF", "#F3F5F8", "#D7DCE4"],                     // enamel letters, triangle, pinstripe
          wall: ["#E9EDF2", "#7D8592", "#FFFFFF"],                      // their walls
          hot: "#FFE6C8",                                               // the triangle's pulse on the payoff
          pool: "255,46,58"                                             // the plate's red light on the black card
        },
        plate: { padX: 84, h: 252, r: 40, depth: 40, bevel: 9, ring: { inset: 20, w: 6, h: 3 }, screws: { r: 12, inset: 40 } },
        layout: { cx: 960, cy: 412, ruleY: 612, ruleW: 620, l1Y: 682, l2Y: 762 },
        shots: { before: "s1", after: "s2" },                           // mirrored on the <video> tags above
        timing: { cutIn: 0.6, slam: 0.22, rule: 0.98, l1: 1.06, l2: 1.76, stampDur: 0.1, cutOut: 5.0, exitDur: 0.16, end: 5.6 }
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const $ = (s) => document.querySelector(s);
        const C = CONFIG, L = C.layout, TM = C.timing, FR = 1 / 30;
        const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));
        if (plate) $("#card").classList.add("solid"); else $("#card").classList.add("ink");
        $("#l1").textContent = C.line1;
        $("#l2in").textContent = C.line2;
        $("#l1").style.top = (L.l1Y - C.type.lineSize / 2) + "px";
        $("#l2").style.top = (L.l2Y - C.type.lineSize / 2) + "px";
        $("#l1").style.fontSize = $("#l2").style.fontSize = C.type.lineSize + "px";
        const rule = $("#rule");
        rule.style.left = (L.cx - L.ruleW / 2) + "px"; rule.style.top = (L.ruleY - 4) + "px"; rule.style.width = L.ruleW + "px";
        $("#pool").style.background = "radial-gradient(ellipse 980px 330px at " + L.cx + "px " + L.cy + "px, rgba(" + C.colors.pool + ",.20) 0%, rgba(" + C.colors.pool + ",.07) 48%, rgba(" + C.colors.pool + ",0) 78%)";
        const FACES = ["900 100px Archivo", "600 100px Inter", "800 100px Inter"];
        Promise.all(FACES.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
          const E = (n) => gsap.parseEase(n);
          const eIn = E("power2.in"), eIO = E("power2.inOut"), eSine = E("sine.inOut"), eP3io = E("power3.inOut");
          const land = TM.cutIn + TM.slam, pay = TM.l2 + TM.stampDur, exitAt = TM.cutOut - TM.exitDur;
          let DIST = 3400;
          const spring = (r, A, tau, per) => (r <= 0 ? 0 : A * Math.exp(-r / tau) * Math.sin(r * 2 * Math.PI / per));
          const P3 = Plate3D({
            W: 1920, H: 1080, fov: 18, px: L.cx, py: L.cy, cx: L.cx, cy: L.cy,
            glyphs: window.TITLE_GLYPHS, word: C.heading, cap: C.type.cap, tracking: C.type.tracking,
            icon: { h: C.type.cap * 1.18, gap: 46, dy: 2 },
            plate: C.plate, letterH: 13, letterBevel: 4.2, gloss: { elev: 1.55, span: 1.3, k: 5 },
            colors: C.colors, shadow: plate ? 0 : 0.5, wideShadow: plate ? 0 : 0.3, shadowOff: [6, 10],
            shutter: (t) => (t > TM.cutIn - 0.02 && t < land + 0.2 ? 1 / 55 : (t > pay - 0.02 && t < pay + 0.25 ? 1 / 90 : (t > exitAt - 0.02 ? 1 / 40 : 0))),
            subframes: (t) => (t < land + 0.2 ? 14 : 10),
            pose: (t, tf) => {
              if (tf < TM.cutIn - 1e-4 || tf >= TM.cutOut - 1e-4) return { hide: true };
              const P = {};
              // the slam: from near the lens, tilted back, accelerating onto its mark (hard stop), then a squash and recoil
              const u = clamp((t - TM.cutIn) / TM.slam, 0, 1), k = Math.pow(u, 1.15);
              let z = DIST * 0.3 * (1 - k), rx = 0.3 * (1 - k), rz = -0.04 * (1 - k), y = -22 * (1 - k), sx = 1, sy = 1;
              const r = t - land;
              if (r > 0) {
                z += spring(r, -30, 0.08, 0.2);
                rx += spring(r, 0.03, 0.1, 0.24);
                const w = r / 0.2; if (w < 1) { const sq = 0.055 * Math.cos(w * Math.PI * 1.5) * Math.exp(-3.4 * w); sy = 1 - sq; sx = 1 + sq * 0.45; }
              }
              // the payoff: the punchline stamps, the plate takes the hit (recoil) and a light rakes across it
              const q = t - pay;
              if (q > 0) z += spring(q, -16, 0.07, 0.18);
              // the hold: a slow living turn
              const hold = clamp((t - (pay + 0.3)) / (exitAt - pay - 0.3), 0, 1);
              const ry = -0.028 + 0.056 * eSine(hold);
              rx += 0.012 * Math.sin(hold * Math.PI);
              // the exit: rush at the lens into the cut
              const xo = clamp((t - exitAt) / TM.exitDur, 0, 1);
              if (xo > 0) z += DIST * 0.42 * eIn(xo);
              Object.assign(P, { z, rx, ry, rz, y, sx, sy });
              // light: key rakes across the bevels on the land and again on the payoff; drifts back through the hold
              const rk1 = eIO(clamp((t - land + 0.05) / 0.5, 0, 1)), rk2 = eIO(clamp((t - pay + 0.04) / 0.6, 0, 1));
              P.keyAngle = -1.0 + 0.7 * rk1 + 1.3 * rk2 - 0.9 * eSine(hold);
              P.key = 2.0 + 1.4 * Math.exp(-Math.pow((r - 0.05) / 0.12, 2)) + 2.6 * Math.exp(-Math.pow((q - 0.12) / 0.16, 2));
              // the payoff specular band: one wide soft band across the whole plate, left to right
              const sp = clamp((q - 0.02) / 0.55, 0, 1), half = P3 ? P3.pw / 2 : 640;
              if (sp > 0 && sp < 1) { const a = -half - 260, b = half + 260; P.specX = a + (b - a) * eP3io(sp); P.specAmp = 0.38 * Math.pow(Math.sin(Math.PI * sp), 0.7); P.specW = 150; }
              else {
                const sd = clamp((t - 3.1) / 1.3, 0, 1);       // one soft sheen through the hold
                if (sd > 0 && sd < 1) { const a = -half - 400, b = half + 400; P.specX = a + (b - a) * sd; P.specAmp = 0.16 * Math.sin(Math.PI * sd); P.specW = 320; }
              }
              // the warning triangle flares on the payoff (3-frame peak, then settles)
              P.iconHot = 0;   // (a triangle flare washed the "!" out at the bloom peak)
              const env = q < 0 ? 0 : q < 2 * FR ? q / (2 * FR) : q < 5 * FR ? 1 : Math.exp(-(q - 5 * FR) / 0.25);
              const envL = r < 0 ? 0 : r < 4 * FR ? 1 : Math.exp(-(r - 4 * FR) / 0.2);
              P.bloom = 0.1 + 0.26 * env + 0.16 * envL;
              return P;
            }
          });
          DIST = P3.DIST;
          $("#t3d").appendChild(P3.canvas);
          document.querySelectorAll("#root *").forEach((n) => { n.setAttribute("data-layout-allow-overlap", ""); n.setAttribute("data-layout-allow-occlusion", ""); });

          const tl = gsap.timeline({ paused: true });
          Look.drive(tl, 0, TM.end, (p) => P3.renderAt(p * TM.end));
          // ---------- the card: a hard cut in and a hard cut out, like the evidence ----------
          const card = $("#card");
          tl.set(card, { opacity: 0 }, 0);
          tl.set(card, { opacity: 1 }, TM.cutIn);
          tl.set(card, { opacity: 0 }, TM.cutOut);
          if (plate) {
            // the plate's own red light pools on the black; it flares with the payoff
            Look.drive(tl, TM.cutIn, TM.cutOut - TM.cutIn, (p) => {
              const t = TM.cutIn + p * (TM.cutOut - TM.cutIn), r = t - land, q = t - pay;
              let k = r < 0 ? 0 : 0.55 + 0.45 * Math.exp(-r / 0.25);
              if (q > 0) k = Math.min(1.25, k + 0.6 * (q < 5 * FR ? 1 : Math.exp(-(q - 5 * FR) / 0.3)));
              $("#pool").style.opacity = (p >= 1 ? 0 : k * 0.9).toFixed(3);
            });
          }
          // ---------- the red rule draws out from the centre, a hot core riding it ----------
          gsap.set(rule, { scaleX: 0 });
          tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: "expo.out", immediateRender: false }, TM.rule);
          tl.fromTo("#ruleHot", { opacity: 0, scaleX: 0.1 }, { opacity: 1, scaleX: 0.6, duration: 0.1, ease: "power2.out", immediateRender: false }, TM.rule);
          tl.to("#ruleHot", { opacity: 0, scaleX: 1, duration: 0.4, ease: "power2.out" }, TM.rule + 0.1);
          // ---------- line 1: masked word rise ----------
          Look.reveal(tl, "#l1", TM.l1, { by: "words", dur: 0.5, stagger: 0.035, ease: "expo.out", from: 110 });
          // ---------- line 2: the punchline stamps down (opaque from frame 1), squashes, settles ----------
          const l2 = $("#l2in");
          gsap.set(l2, { opacity: 0, scale: 1.36, filter: "blur(0px)" });
          tl.set(l2, { opacity: 1 }, TM.l2);
          tl.fromTo(l2, { scale: 1.36, filter: "blur(7px)" }, { scale: 1, filter: "blur(0px)", duration: TM.stampDur, ease: "power3.in", immediateRender: false }, TM.l2);
          tl.fromTo(l2, { scaleY: 0.9, scaleX: 1.035 }, { scaleY: 1, scaleX: 1, duration: 0.24, ease: "back.out(3)", immediateRender: false }, pay);
          tl.set(l2, { filter: "none" }, pay);
          Look.impact(tl, land, { shake: "#cardShake", amp: 4, dur: 0.2, zoom: 1.004, flash: 0 });
          Look.impact(tl, pay, { shake: "#cardShake", amp: 5, dur: 0.24, zoom: 1.006, flash: 0 });
          // ---------- the exit: the lines rush at the lens with the plate, then the hard cut ----------
          // the lines scale about the plate's principal point by exactly the plate's perspective factor, with a matching blur
          const cin = $("#cardIn"); cin.style.transformOrigin = L.cx + "px " + L.cy + "px";
          Look.drive(tl, exitAt, TM.exitDur, (p) => {
            if (p <= 0) { cin.style.transform = ""; cin.style.filter = ""; return; }
            const f = 1 / (1 - 0.42 * eIn(Math.min(1, p)));
            cin.style.transform = "scale(" + f.toFixed(4) + ")"; cin.style.filter = "blur(" + Math.min(6, (f - 1) * 14).toFixed(2) + "px)";
          });
          // ---------- footage: a slow push on the opener; the shot after the cut lands with a punch ----------
          if (plate) {
            Look.push(tl, "#push", 0, TM.cutIn, { to: 1.04 });
            tl.fromTo("#push", { scale: 1.08 }, { scale: 1.0, duration: 0.5, ease: "expo.out", immediateRender: false }, TM.cutOut);
          }
          P3.renderAt(0);
          tl.set({}, {}, TM.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
</body>
</html>
