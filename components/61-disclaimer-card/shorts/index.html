<!doctype html>
<!-- GTA-niche 61 Disclaimer card, variant B: "Corner disclaimer" (9:16 Shorts, 1080x1920, 30 fps, 6 s).
     The persistent "*mods used, not real gameplay" line of a Short, built phone-first: at 0.5 s a red enamel warning
     plate (Three.js: steel-bevelled slab, chrome screws, white pinstripe, a white enamel warning triangle with its "!" cut
     through, "MODS USED" in raised white enamel Archivo letters) slams in big with the line "*not real gameplay (sadly)"
     under it; then, on the first cut, it whips into the top-right corner as a small chip with the line hung under it,
     lands with a spring, a hot rim and a raking key (the payoff), and stays there for the whole Short.
     Variable: bg "plate" (sample footage) / "none" (transparent overlay). See ../DECISIONS.md. -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="media/glyphs.js"></script>
    <script src="media/plate3d.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ov, #t3d { position: absolute; inset: 0; pointer-events: none; }
      #subWrap { position: absolute; left: 0; top: 0; width: 0; height: 0; }
      #sub { position: absolute; left: 0; top: 0; white-space: nowrap; transform-origin: 0 0; color: #FFFFFF;
        font: 800 46px/1.1 "Inter"; letter-spacing: -0.01em; paint-order: stroke fill; -webkit-text-stroke: 3px #0E0F13;
        text-shadow: 0 3px 4px rgba(0,0,0,.5), 0 4px 16px rgba(0,0,0,.4); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <div id="shake"><div id="push">
        <video id="s4" class="clip shot" src="assets/shots/v45-beach-aerial-v.mp4" muted playsinline data-start="5.1167" data-duration="0.8833" data-media-start="0" data-track-index="3"></video>
        <video id="s3" class="clip shot" src="assets/shots/v17-deluxo-sunset-v.mp4" muted playsinline data-start="3.6167" data-duration="1.5667" data-media-start="0" data-track-index="2"></video>
        <video id="s2" class="clip shot" src="assets/shots/v21-race-topdown-v.mp4" muted playsinline data-start="1.9333" data-duration="1.75" data-media-start="0" data-track-index="1"></video>
        <video id="s1" class="clip shot" src="assets/shots/v11-yacht-v.mp4" muted playsinline data-start="0" data-duration="2.0" data-media-start="0" data-track-index="0"></video>
      </div></div>
      <div id="ov" class="clip" data-start="0" data-duration="6" data-track-index="4">
        <div id="t3d"></div>
        <div id="subWrap"><div id="sub"></div></div>
      </div>
    </div>
    <script>
      const CONFIG = {
        heading: "MODS USED",                          // raised enamel letters on the plate (A-Z 0-9 . , ' ! ? - & : #)
        line: "*not real gameplay (sadly)",            // the persistent line hung under the plate
        type: { cap: 84, tracking: 0.012, wordGap: 0.14, lineSize: 46 },
        colors: {
          plate: ["#FF5A63", "#F0202F", "#D3122A", "#A00C1F"],          // red enamel, top -> bottom
          steel: ["#DCE1E8", "#2E333B", "#F4F6FA"],                     // bevel / walls: near, far, lit lip
          white: ["#FFFFFF", "#F3F5F8", "#D7DCE4"],                     // enamel letters, triangle, pinstripe
          wall: ["#E9EDF2", "#7D8592", "#FFFFFF"],
          hot: "#FFF2DC"                                                // the bevel's hot rim on the landing
        },
        plate: { padX: 56, h: 166, r: 30, depth: 32, bevel: 8, ring: { inset: 14, w: 5, h: 3 }, screws: { r: 9, inset: 27 } },
        layout: { hero: [504, 520], subGap: 16, dock: { right: 936, top: 238, scale: 0.57, subScale: 0.78 } },
        // the dock lands on the first cut (s1 -> s2 at 2.0 s)
        timing: { in: 0.5, slam: 0.2, sub: 0.74, dock: 1.74, dockDur: 0.26, end: 6.0 }
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const $ = (s) => document.querySelector(s);
        const C = CONFIG, L = C.layout, TM = C.timing, FR = 1 / 30;
        const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
        const lerp = (a, b, k) => a + (b - a) * k;
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));
        const sub = $("#sub");
        sub.textContent = C.line; sub.style.fontSize = C.type.lineSize + "px";
        const FACES = ["900 100px Archivo", "800 100px Inter"];
        Promise.all(FACES.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
          const E = (n) => gsap.parseEase(n);
          const eIO = E("power2.inOut"), eSine = E("sine.inOut"), eDock = (u) => 0.35 * u + 0.65 * u * u;   // leaves at once, accelerates into the corner, hard stop on the cut
          const land = TM.in + TM.slam, dockEnd = TM.dock + TM.dockDur;
          let DIST = 6000, dock = null, PW = 780, PH = C.plate.h;
          const spring = (r, A, tau, per) => (r <= 0 ? 0 : A * Math.exp(-r / tau) * Math.sin(r * 2 * Math.PI / per));
          const squash = (r, a) => { const w = r / 0.2; if (r <= 0 || w >= 1) return 0; return a * Math.cos(w * Math.PI * 1.5) * Math.exp(-3.4 * w); };
          // ---------- the plate's motion (shared by the 3D pose and the pinned line) ----------
          function geo(t) {
            const u = clamp((t - TM.in) / TM.slam, 0, 1), k = Math.pow(u, 1.15);
            let z = DIST * 0.22 * (1 - k), rx = 0.3 * (1 - k), rz = 0.05 * (1 - k), y = -30 * (1 - k);
            const r = t - land;
            z += spring(r, -30, 0.08, 0.2); rx += spring(r, 0.03, 0.1, 0.24);
            let sq = squash(r, 0.055);
            // the dock: a fast whip into the corner, banking through the move...
            const du = clamp((t - TM.dock) / TM.dockDur, 0, 1), dk = eDock(du);
            const cx = lerp(L.hero[0], dock ? dock.cx : L.hero[0], dk), cy = lerp(L.hero[1], dock ? dock.cy : L.hero[1], dk);
            const s = lerp(1, L.dock.scale, dk);
            rz += 0.07 * Math.sin(Math.PI * du);
            // ...landing on the cut: rotation overshoot (-3 deg, +1 deg, 0), a push back and a squash
            const q = t - dockEnd;
            rz += spring(q, -0.055, 0.075, 0.18);
            z += spring(q, -16, 0.07, 0.2);
            sq += squash(q, 0.05);
            const hold = clamp((t - dockEnd - 0.3) / (TM.end - dockEnd - 0.3), 0, 1);
            const ry = -0.02 + 0.04 * eSine(hold);
            return { cx, cy, s, z, rx, ry, rz, y, sx: 1 + sq * 0.45, sy: 1 - sq, dk, r, q };
          }
          const P3 = Plate3D({
            W: 1080, H: 1920, fov: 18, px: L.hero[0], py: L.hero[1], cx: L.hero[0], cy: L.hero[1], follow: true,
            glyphs: window.TITLE_GLYPHS, word: C.heading, cap: C.type.cap, tracking: C.type.tracking, wordGap: C.type.wordGap,
            icon: { h: C.type.cap * 1.18, gap: 30, dy: 2 },
            plate: C.plate, letterH: 10, letterBevel: 3.4, gloss: { elev: 0.5, span: 0.5, k: 5 },
            colors: C.colors, shadow: 0.6, wideShadow: 0.32, shadowOff: [6, 10],
            shutter: (t) => (t > TM.in - 0.02 && t < land + 0.2 ? 1 / 55 : (t > TM.dock && t < dockEnd + 0.12 ? 1 / 45 : 0)),
            subframes: (t) => 12,
            pose: (t, tf) => {
              if (tf < TM.in - 1e-4) return { hide: true };
              const G = geo(t), P = { cx: G.cx, cy: G.cy, s: G.s, z: G.z, rx: G.rx, ry: G.ry, rz: G.rz, y: G.y, sx: G.sx, sy: G.sy };
              // light: a small rake on the slam; the payoff rake + hot steel rim on the dock landing; a slow drift in the hold
              const rk1 = eIO(clamp((t - land + 0.04) / 0.45, 0, 1)), rk2 = eIO(clamp((t - dockEnd + 0.06) / 0.5, 0, 1));
              P.keyAngle = -0.9 + 0.5 * rk1 + 1.1 * rk2 - 1.0 * eSine(clamp((t - dockEnd - 0.5) / (TM.end - dockEnd - 0.5), 0, 1));
              P.key = 2.0 + 0.8 * Math.exp(-Math.pow((G.r - 0.06) / 0.12, 2)) + 0.9 * Math.exp(-Math.pow((G.q - 0.06) / 0.14, 2));
              const q = G.q, env = q < 0 ? 0 : q < 2 * FR ? q / (2 * FR) : q < 5 * FR ? 1 : Math.exp(-(q - 5 * FR) / 0.22);
              P.rimHot = 1.9 * env;
              P.bloom = 0.1 + 0.5 * env;
              P.bloomTh = 1.3 + 0.35 * env;            // only the hot steel rim blooms, the white letters stay crisp
              // one faint sheen through the docked hold (life, not a second beat)
              const sd = clamp((t - 4.0) / 1.4, 0, 1), half = P3 ? P3.pw / 2 : 380;
              if (sd > 0 && sd < 1) { const a = -half - 300, b = half + 300; P.specX = a + (b - a) * sd; P.specAmp = 0.14 * Math.sin(Math.PI * sd); P.specW = 240; }
              return P;
            }
          });
          DIST = P3.DIST; PW = P3.pw; PH = P3.ph;
          dock = { cx: L.dock.right - PW * L.dock.scale / 2, cy: L.dock.top + PH * L.dock.scale / 2 };
          $("#t3d").appendChild(P3.canvas);
          document.querySelectorAll("#root *").forEach((n) => { n.setAttribute("data-layout-allow-overlap", ""); n.setAttribute("data-layout-allow-occlusion", ""); });

          const tl = gsap.timeline({ paused: true });
          Look.drive(tl, 0, TM.end, (p) => P3.renderAt(p * TM.end));
          // ---------- the line, pinned under the plate: centred under it when big, right-aligned under the chip when docked ----------
          Look.reveal(tl, "#sub", TM.sub, { by: "words", dur: 0.36, stagger: 0.03, ease: "expo.out", from: 112 });
          const SW = sub.offsetWidth, wrap = $("#subWrap");
          Look.drive(tl, 0, TM.end, (p) => {
            const t = p * TM.end, G = geo(t), f = DIST / (DIST - G.z), sc = G.s * f;
            const ss = lerp(1, L.dock.subScale, G.dk);
            const ax = lerp(0, (PW / 2) * sc, G.dk) - SW * ss * lerp(0.5, 1, G.dk) - lerp(0, 6, G.dk);
            const ay = (PH / 2) * sc * G.sy + L.subGap * ss;
            wrap.style.transform = "translate(" + G.cx.toFixed(2) + "px," + G.cy.toFixed(2) + "px) rotate(" + (-G.rz).toFixed(4) + "rad)";
            sub.style.transform = "translate(" + ax.toFixed(2) + "px," + ay.toFixed(2) + "px) scale(" + ss.toFixed(4) + ")";
            // the line smears with the plate through the whip (speed-scaled blur, sharp again on the landing frame)
            const du = (t - TM.dock) / TM.dockDur;
            sub.style.filter = du > 0 && du < 0.97 ? "blur(" + (5 * Math.sin(Math.PI * Math.min(1, du / 0.97) * 0.5 + 0.0) * (1 - Math.pow(du, 6))).toFixed(2) + "px)" : "none";
          });
          if (plate) {
            Look.push(tl, "#push", 0, TM.end, { to: 1.05 });
            Look.impact(tl, land, { shake: "#shake", amp: 5, dur: 0.24, zoom: 1.008, flash: 0 });
            Look.impact(tl, dockEnd, { shake: "#shake", amp: 4, dur: 0.22, zoom: 1.006, flash: 0 });
          }
          P3.renderAt(0);
          tl.set({}, {}, TM.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
</body>
</html>
