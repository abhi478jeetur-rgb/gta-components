<!-- 62 Like goal, variant B "Goal for Shorts" (9:16, 1080x1920, 30 fps, 6.5 s). Designed phone-first.
     One centred stack in the Short's upper half: a big real 3D thumbs-up (Three.js, our own sculpted drawing) over the rolling
     like count and a fat porcelain fill tube. Thumb and tube fill with red liquid as the likes climb; at the goal the last
     odometer carry rolls, the thumb pumps, the number lands, one ring shock and speed streaks burst behind it.
     Variable: bg "plate" (sample GTA V footage) / "none" (transparent overlay). See gta/DESIGN.md. -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>

      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ov { position: absolute; inset: 0; }
      /* the 3D layer: a tight dark edge (the evidence glyphs' outline) + a soft drop shadow onto the footage */
      #gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block;
        filter: drop-shadow(0 0 1.2px rgba(6,7,10,.9)) drop-shadow(0 4px 3px rgba(0,0,0,.35)) drop-shadow(0 18px 26px rgba(0,0,0,.42)); }
      /* payoff light behind the number: additive, never a veil */
      #fx { position: absolute; left: 0; top: 0; overflow: visible; filter: drop-shadow(0 0 9px rgba(255,46,70,.7)) drop-shadow(0 2px 3px rgba(0,0,0,.35)); }

      /* ---------- type ---------- */
      .arch { font-family: "Archivo", sans-serif; }
      #labWin { position: absolute; left: 0; top: 0; overflow: hidden; padding: 8px 24px 24px; }
      .lab { display: inline-block; white-space: nowrap; font-family: "Archivo", sans-serif; font-weight: 800; font-stretch: 100%; line-height: 1;
        letter-spacing: .12em; color: #FFFFFF; paint-order: stroke fill; -webkit-text-stroke: 6px #0B0C10;
        text-shadow: 0 3px 0 #0B0C10, 0 8px 14px rgba(0,0,0,.45); }
      #lab2 { position: absolute; left: 24px; top: 8px; color: #FF4655; visibility: hidden; }
      #numWrap { position: absolute; left: 0; top: 0; will-change: transform, filter;
        filter: drop-shadow(0 16px 22px rgba(0,0,0,.5)); }
      #num { position: relative; display: flex; align-items: flex-start; }
      .col { position: relative; flex: none; clip-path: inset(0px -80px 0px -80px); }
      .reel { position: absolute; left: 0; top: 0; width: 100%; will-change: transform; }
      .cell, .comma { position: relative; display: block; text-align: center; white-space: nowrap; font-family: "Archivo", sans-serif;
        font-weight: 900; font-stretch: 87.5%; letter-spacing: 0; }
      .comma { flex: none; }
      .bk { display: block; color: #FFFFFF; paint-order: stroke fill; -webkit-text-stroke: 18px #0B0C10;
        text-shadow: 0 4px 0 #0B0C10, 0 8px 0 #0B0C10, 0 12px 0 #07080B; }
      .fr { position: absolute; left: 0; top: 0; width: 100%; display: block; color: #FFFFFF; }

      /* the target tag riding the tube's right end */
      #tag { position: absolute; left: 0; top: 0; width: 160px; height: 76px; margin: -38px 0 0 -80px; overflow: hidden; }
      #tag .t1, #tag .t2 { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #tag .t1 { font-family: "Archivo", sans-serif; font-weight: 900; font-stretch: 100%; font-size: 46px; letter-spacing: .02em; color: #1A0A0D; }
      #tag .t2 { visibility: hidden; }

  <body>

        <canvas id="gl" width="1080" height="1920"></canvas>
        <div id="labWin" data-layout-allow-overflow data-layout-allow-occlusion><span class="lab" id="lab1" data-layout-allow-overflow data-layout-allow-occlusion></span><span class="lab" id="lab2" data-layout-allow-overflow data-layout-allow-occlusion></span></div>
        <div id="numWrap" data-layout-allow-overflow data-layout-allow-occlusion><div id="num" data-layout-allow-overflow data-layout-allow-occlusion></div></div>

          <div class="t2" id="tag2" data-layout-allow-overflow data-layout-allow-occlusion><svg viewBox="0 0 40 40"><path id="chk" d="M8 21 L17 30 L33 11" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
      </div>
    </div>
    <script>
      const CONFIG = {
        label: "LIKE GOAL",          // label over the number
        labelHit: "GOAL HIT!",       // label after the goal
        from: 12480,                 // likes when it appears
        goal: 50000,                 // the goal
        tag: "50K",                  // target printed on the tube end
        colors: { porcelain: "#F4F5F8", like: "#F2122C", deep: "#6E0312", meniscus: "#FFE8EC" },
        layout: {                    // one centred stack, phone-first, inside x 72-936 / y 230+
          thumbH: 440,               // the hero thumb's height (px)
          thumbX: 504, thumbY: 518,  // thumb centre
          numX: 504, numCapY: 945,   // number: centre x, centre of the digit caps
          numMaxW: 640, numMaxFont: 250,
          labelY: 812,               // label cap centre
          labelFont: 60,
          tubeX0: 150, tubeX1: 858, tubeY: 1124, tubeR: 48   // the fill tube
        },
        burst: { x: 504, y: 720, r0: 110, r1: 400, w: 24, d0: 780,    // ring shock + speed streaks [angle deg, length, width, delay]
          streaks: [[148, 300, 12, 0], [178, 330, 13, 0.02], [207, 290, 11, 0.035], [-30, 300, 12, 0.01], [-2, 330, 13, 0.03], [27, 290, 11, 0.045]] },
        timing: { thumbsIn: 0.12, tubeIn: 0.26, numIn: 0.32, labelIn: 0.44, count: 0.78, goal: 3.8, out: 5.7, end: 6.5 }
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const T = CONFIG.timing, Ly = CONFIG.layout, C = CONFIG.colors, $ = (s) => document.querySelector(s), D = T.end, G = T.goal;
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));
        const clamp = (x, a, b) => Math.min(b, Math.max(a, x)), cl01 = (x) => clamp(x, 0, 1);
        const E = (n) => gsap.parseEase(n);
        const eO3 = E("power3.out"), eIn3 = E("power3.in"), eIn2 = E("power2.in"), eIO = E("power2.inOut"), eB14 = E("back.out(1.4)"),
              eB20 = E("back.out(2)"), eBIn = E("back.in(1.7)"), eO2 = E("power2.out"), eEl = E("elastic.out(1,0.45)");
        const DEG = Math.PI / 180;

        // ---------- renderer + camera (world units = page px on the z=0 plane, origin at the canvas centre) ----------
        const W = 1080, H = 1920;
        const renderer = new THREE.WebGLRenderer({ canvas: $("#gl"), alpha: true, antialias: true, preserveDrawingBuffer: true, premultipliedAlpha: true });
        renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.setClearColor(0x000000, 0);
        renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
        const scene = new THREE.Scene();
        const FOV = 18, L = (H / 2) / Math.tan(FOV / 2 * DEG);
        const camera = new THREE.PerspectiveCamera(FOV, W / H, 100, 20000);
        camera.position.set(0, 0, L); camera.lookAt(0, 0, 0); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
        const wx = (px) => px - W / 2, wy = (py) => H / 2 - py;

        // studio environment: a lit dome, a wide softbox above-front for the clear-coat sheen, a strip key at the left
        const envScene = new THREE.Scene();
        envScene.add(new THREE.Mesh(new THREE.SphereGeometry(100, 48, 24), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false,
          vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
          fragmentShader: "varying vec3 vP; void main(){ float y = vP.y; vec3 top = vec3(0.55,0.56,0.6); vec3 hor = vec3(0.32,0.31,0.32); vec3 low = vec3(0.06,0.055,0.06);" +
            " vec3 c = y > 0.0 ? mix(hor, top, pow(clamp(y,0.0,1.0),0.7)) : mix(hor*0.6, low, clamp(-y*2.5,0.0,1.0)); gl_FragColor = vec4(c,1.0); }" })));
        const hdr = (v) => new THREE.MeshBasicMaterial({ color: new THREE.Color(v, v, v * 0.97), side: THREE.DoubleSide });
        const soft = new THREE.Mesh(new THREE.PlaneGeometry(150, 40), hdr(3.0)); soft.position.set(0, 70, 55); soft.lookAt(0, 0, 0); envScene.add(soft);
        const strip = new THREE.Mesh(new THREE.PlaneGeometry(10, 80), hdr(2.0)); strip.position.set(-80, 20, 40); strip.lookAt(0, 0, 0); envScene.add(strip);
        const strip2 = new THREE.Mesh(new THREE.PlaneGeometry(8, 70), hdr(1.2)); strip2.position.set(85, 10, 30); strip2.lookAt(0, 0, 0); envScene.add(strip2);
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(envScene, 0.02, 0.1, 400).texture;
        scene.add(new THREE.HemisphereLight(0xf2f5ff, 0x3a2a26, 0.55));
        const key = new THREE.DirectionalLight(0xfff4ea, 2.0); key.position.set(-700, 900, 1100); scene.add(key);
        const rim = new THREE.DirectionalLight(0xd6e4ff, 0.9); rim.position.set(900, 300, -600); scene.add(rim);

        // ---------- the liquid-fill porcelain material (world-space level + meniscus + specular sweep) ----------
        const SW = { x: { value: -9999 }, w: { value: 34 }, a: { value: 0 } };
        function fillUniforms(axis, cross) {
          return { uAxis: { value: new THREE.Vector3().copy(axis) }, uCross: { value: new THREE.Vector3().copy(cross) },
            uFill: { value: new THREE.Color(C.like) }, uDeep: { value: new THREE.Color(C.deep) }, uMenC: { value: new THREE.Color(C.meniscus) },
            uLevel: { value: -9999 }, uQc: { value: 0 }, uSlope: { value: 0 }, uCurve: { value: 0 }, uWob: { value: 1.5 }, uPh: { value: 0 },
            uMenW: { value: 1.1 }, uMen: { value: 1.2 }, uEmit: { value: 0.05 }, uDepthL: { value: 160 }, uSwX: SW.x, uSwW: SW.w, uSwA: SW.a };
        }
        function fillMat(U, o) {
          const m = new THREE.MeshPhysicalMaterial(Object.assign({ color: new THREE.Color(C.porcelain), roughness: 0.32, metalness: 0,
            clearcoat: 1, clearcoatRoughness: 0.04, envMapIntensity: 1.1 }, o || {}));
          m.onBeforeCompile = (sh) => {
            for (const k in U) sh.uniforms[k] = U[k];
            sh.vertexShader = "varying vec3 vLgW;\n" + sh.vertexShader.replace("#include <worldpos_vertex>",
              "#include <worldpos_vertex>\n  vLgW = (modelMatrix * vec4(transformed, 1.0)).xyz;");
            sh.fragmentShader = "varying vec3 vLgW;\nuniform vec3 uAxis, uCross, uFill, uDeep, uMenC;\n" +
              "uniform float uLevel, uQc, uSlope, uCurve, uWob, uPh, uMenW, uMen, uEmit, uDepthL, uSwX, uSwW, uSwA;\n" +
              sh.fragmentShader
                .replace("#include <color_fragment>", "#include <color_fragment>\n" +
                  "  float lgS = dot(vLgW, uAxis), lgQ = dot(vLgW, uCross) - uQc;\n" +
                  "  float lgL = uLevel + uSlope * lgQ - uCurve * lgQ * lgQ + uWob * (sin(lgQ * 0.045 + uPh) + 0.45 * sin(lgQ * 0.12 - uPh * 1.7));\n" +
                  "  float lgD = lgS - lgL;\n" +
                  "  float lgLiq = 1.0 - smoothstep(-0.9, 0.9, lgD);\n" +
                  "  vec3 lgC = mix(uFill, uDeep, clamp(-lgD / uDepthL, 0.0, 1.0) * 0.55);\n" +
                  "  lgC = mix(lgC, min(uFill * 1.45 + vec3(0.06, 0.02, 0.03), vec3(1.0)), smoothstep(-8.0, -1.0, lgD) * 0.55);\n" +
                  "  diffuseColor.rgb = mix(diffuseColor.rgb, lgC, lgLiq);\n" +
                  "  float lgMen = exp(-(lgD + 0.6) * (lgD + 0.6) / (2.0 * uMenW * uMenW));")
                .replace("#include <roughnessmap_fragment>", "#include <roughnessmap_fragment>\n  roughnessFactor = mix(roughnessFactor, 0.2, lgLiq);")
                .replace("#include <emissivemap_fragment>", "#include <emissivemap_fragment>\n" +
                  "  totalEmissiveRadiance += uMenC * lgMen * uMen + lgC * lgLiq * uEmit;\n" +
                  "  { float lgB = (vLgW.x + vLgW.y * 0.5 - uSwX) / uSwW; totalEmissiveRadiance += vec3(1.0, 0.96, 0.92) * exp(-lgB * lgB * 1.4) * uSwA; }");
          };
          return m;
        }

        // ---------- geometry: our own thumbs-up, built from extruded bevelled parts ----------
        function rr(x0, y0, x1, y1, r) {          // rounded rect as an open point list (no duplicate closing point)
          const pts = [], N = 10;
          [[x1 - r, y0 + r, -Math.PI / 2], [x1 - r, y1 - r, 0], [x0 + r, y1 - r, Math.PI / 2], [x0 + r, y0 + r, Math.PI]].forEach(([cx, cy, a0]) => {
            for (let i = 0; i <= N; i++) { const a = a0 + (i / N) * (Math.PI / 2); pts.push(new THREE.Vector2(cx + Math.cos(a) * r, cy + Math.sin(a) * r)); }
          });
          return new THREE.Shape(pts);
        }
        function smooth(g) {                       // smooth normals across the bevel facets (positions welded by value)
          const pos = g.attributes.position, n = pos.count, fn = new Float32Array(n), nor = new Float32Array(n * 3), F = [];
          const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), e1 = new THREE.Vector3(), e2 = new THREE.Vector3();
          for (let i = 0; i < n; i += 3) { a.fromBufferAttribute(pos, i); b.fromBufferAttribute(pos, i + 1); c.fromBufferAttribute(pos, i + 2);
            e1.subVectors(c, b); e2.subVectors(a, b); e1.cross(e2).normalize(); F.push(e1.x, e1.y, e1.z); }
          const map = new Map();
          for (let i = 0; i < n; i++) { const k = Math.round(pos.getX(i) * 50) + "_" + Math.round(pos.getY(i) * 50) + "_" + Math.round(pos.getZ(i) * 50);
            let arr = map.get(k); if (!arr) map.set(k, (arr = [])); arr.push(i); }
          const cosT = Math.cos(60 * DEG);
          map.forEach((arr) => { arr.forEach((i) => { const f = (i / 3 | 0) * 3; let sx = 0, sy = 0, sz = 0;
            arr.forEach((j) => { const h = (j / 3 | 0) * 3; if (F[f] * F[h] + F[f + 1] * F[h + 1] + F[f + 2] * F[h + 2] >= cosT) { sx += F[h]; sy += F[h + 1]; sz += F[h + 2]; } });
            const l = Math.hypot(sx, sy, sz) || 1; nor[i * 3] = sx / l; nor[i * 3 + 1] = sy / l; nor[i * 3 + 2] = sz / l; }); });
          g.setAttribute("normal", new THREE.BufferAttribute(nor, 3));
          return g;
        }
        function ext(shape, depth, bev, bt) {
          const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bt, bevelSize: bev, bevelOffset: -bev,
            bevelSegments: 7, curveSegments: 14, steps: 1 });
          g.translate(0, 0, -depth / 2); return smooth(g);
        }
        function pathShape(start, segs) {          // lines / quadratic / cubic segments sampled to an open point list
          const pts = [new THREE.Vector2(start[0], start[1])]; let p = start;
          segs.forEach((g) => {
            if (g[0] === "L") { pts.push(new THREE.Vector2(g[1], g[2])); p = [g[1], g[2]]; }
            else if (g[0] === "Q") { for (let i = 1; i <= 10; i++) { const u = i / 10, m = 1 - u;
              pts.push(new THREE.Vector2(m * m * p[0] + 2 * m * u * g[1] + u * u * g[3], m * m * p[1] + 2 * m * u * g[2] + u * u * g[4])); } p = [g[3], g[4]]; }
            else { for (let i = 1; i <= 14; i++) { const u = i / 14, m = 1 - u;
              pts.push(new THREE.Vector2(m * m * m * p[0] + 3 * m * m * u * g[1] + 3 * m * u * u * g[3] + u * u * u * g[5],
                m * m * m * p[1] + 3 * m * m * u * g[2] + 3 * m * u * u * g[4] + u * u * u * g[6])); } p = [g[5], g[6]]; }
          });
          const A = pts[0], B = pts[pts.length - 1]; if (Math.hypot(A.x - B.x, A.y - B.y) < 0.01) pts.pop();
          return new THREE.Shape(pts);
        }
        // design units: the icon spans x 1..95, y 1..104 (cuff on the left, fist on the right, thumb up)
        const PARTS = (() => {
          const P = [];
          P.push({ g: ext(rr(1, 4, 20.5, 58, 6), 22, 4.5, 5.5), z: -1 });                 // cuff
          const palm = pathShape([34, 1], [["L", 60, 1], ["Q", 64, 1, 64, 6], ["L", 64, 56], ["Q", 64, 61, 58, 61.5], ["Q", 53.5, 62, 53.5, 68],
            ["C", 54, 78, 53, 88, 50.5, 95], ["C", 48, 103.5, 37, 104, 34.5, 96], ["C", 33, 88, 33.5, 78, 30.5, 70], ["Q", 27.5, 63, 26.5, 55],
            ["L", 26, 10], ["Q", 26, 1, 34, 1]]);
          P.push({ g: ext(palm, 24, 5.5, 7), z: 0 });                                        // palm + thumb, one volume
          [[46.6, 60.4, 95], [32.2, 46.0, 92], [17.8, 31.6, 88], [4.0, 17.2, 82.5]].forEach(([y0, y1, x1]) =>
            P.push({ g: ext(rr(42, y0, x1, y1, (y1 - y0) / 2 - 0.3), 18, 5, 5.5), z: 6 }));  // curled fingers, stepped, rounded knuckles
          return P;
        })();
        const ICX = 48, ICY = 52.5, ICH = 103;        // icon centre and height in design units
        function thumbMesh(mat, sizePx, mirror) {
          const s = sizePx / ICH, outer = new THREE.Group(), body = new THREE.Group();
          PARTS.forEach((p) => { const m = new THREE.Mesh(p.g, mat); m.position.set(-ICX, -ICY, p.z); body.add(m); });
          body.scale.set(s * (mirror ? -1 : 1), s, s); outer.add(body);
          return outer;
        }

        // ---------- the scene ----------
        const thumbs = [-1].map((side) => {             // one hero thumb, turned 22 deg so its sculpted depth reads
          const U = fillUniforms(new THREE.Vector3(0, 1, 0), new THREE.Vector3(1, 0, 0));
          const g = thumbMesh(fillMat(U), Ly.thumbH, false); scene.add(g);
          return { side, g, U, x: wx(Ly.thumbX), y: wy(Ly.thumbY) };
        });
        const TL = Ly.tubeX1 - Ly.tubeX0, TR = Ly.tubeR;
        const tubeU = fillUniforms(new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 1, 0));
        tubeU.uMenW.value = 1.4; tubeU.uCurve.value = 0.012; tubeU.uWob.value = 0.6; tubeU.uDepthL.value = 900;
        const tubeG = new THREE.CapsuleGeometry(TR, TL - 2 * TR, 16, 56); tubeG.rotateZ(Math.PI / 2);
        const tube = new THREE.Mesh(tubeG, fillMat(tubeU, { roughness: 0.34 }));
        const tubeCX = wx((Ly.tubeX0 + Ly.tubeX1) / 2), tubeCY = wy(Ly.tubeY);
        tube.position.set(tubeCX, tubeCY, 0); scene.add(tube);

        // ---------- motion, pure functions of t ----------
        const V0 = CONFIG.from, V1 = CONFIG.goal;
        // the count: a power3.out run to goal-5, then five readable ticks, the last one landing on the goal
        const NT = 5, TICK = 0.15, VJ = V1 - NT, TJ = G - NT * TICK, CD = TJ - T.count;
        function likes(t) {
          if (t <= T.count) return V0;
          if (t < TJ) return V0 + (VJ - V0) * eO3((t - T.count) / CD);
          if (t >= G) return V1;
          const n = Math.floor((t - TJ) / TICK), fr = (t - TJ - n * TICK) / TICK;
          return VJ + n + eIO(cl01((fr - 0.45) / 0.55));
        }
        const inv1 = (c) => T.count + CD * (1 - Math.cbrt(1 - (c - V0) / (VJ - V0)));
        const rate1 = (t) => { const u = cl01((t - T.count) / CD); return 3 * (VJ - V0) * (1 - u) * (1 - u) / CD; };
        const eIn2b = E("power2.in");
