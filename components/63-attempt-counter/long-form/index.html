          const blurOf = (src, r) => { const c = mk(), x = c.getContext("2d"); x.fillStyle = "#000"; x.fillRect(0, 0, CW, CH); if (r > 0) x.filter = "blur(" + r + "px)"; x.drawImage(src, 0, 0); return x.getImageData(0, 0, CW, CH).data; };
          const wide = blurOf(sil, o.dome * o.k), tight = blurOf(sil, 3 * o.k);

          if (o.engrave) { const ec = mk(), ex = ec.getContext("2d"); ex.fillStyle = "#000"; ex.fillRect(0, 0, CW, CH); ex.fillStyle = "#fff"; o.engrave(ex, P); eng = blurOf(ec, 1.1 * o.k); engS = blurOf(ec, 0); }
