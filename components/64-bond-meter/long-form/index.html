        const envScene = new THREE.Scene();

          side: THREE.BackSide, depthWrite: false,
          vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
          fragmentShader: "varying vec3 vP; void main(){ float y = vP.y; vec3 top = vec3(0.80,0.78,0.86), hor = vec3(0.12,0.08,0.13), low = vec3(0.015,0.01,0.02);" +
            " vec3 c = y > 0.0 ? mix(hor, top, smoothstep(0.1, 0.9, y)) : mix(hor, low, smoothstep(0.0, 0.4, -y)); gl_FragColor = vec4(c, 1.0); }"
        })));
        const panel = (w, h, x, y, z, c) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); envScene.add(m); };
        panel(40, 12, -4, 30, 22, new THREE.Color(5.0, 4.9, 4.9));

        const key = new THREE.DirectionalLight(0xfff2ea, 1.5); key.position.set(-0.6, 0.9, 1.0); scene.add(key);
        const rim = new THREE.DirectionalLight(0xff7ccf, 1.1); rim.position.set(0.9, -0.3, 0.4); scene.add(rim);
        scene.add(new THREE.HemisphereLight(0xfff0f8, 0x140814, 0.55));

          for (let i = 0; i < p.count; i++) {

          for (let i = 0; i < n; i += 3) { const a = remap[idx ? idx[i] : i], b = remap[idx ? idx[i + 1] : i + 1], c = remap[idx ? idx[i + 2] : i + 2]; if (a !== b && b !== c && a !== c) out.push(a, b, c); }
          const G = new THREE.BufferGeometry(); G.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3)); G.setIndex(out); G.computeVertexNormals(); return G;
        }
        const heartXY = (t) => [16 * Math.pow(Math.sin(t), 3), 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)];
        function heartGeo(w, th) {   // a balloon heart: a sphere mapped onto the heart outline, elliptical cross-section
          const k = w / 32, cy = -2.5, pts = [];
          for (let i = 0; i < 2880; i++) { const [x, y] = heartXY(i / 2880 * Math.PI * 2); pts.push([Math.atan2(y - cy, x), Math.hypot(x, y - cy) * k]); }
          pts.sort((a, b) => a[0] - b[0]);
          const B = 4096, lut = new Float32Array(B);
          for (let b = 0; b < B; b++) {
            const a = -Math.PI + (b + 0.5) / B * 2 * Math.PI; let lo = 0, hi = pts.length - 1;
            if (a <= pts[0][0] || a >= pts[hi][0]) { lut[b] = a <= pts[0][0] ? pts[0][1] : pts[hi][1]; continue; }
            while (hi - lo > 1) { const m = (lo + hi) >> 1; if (pts[m][0] < a) lo = m; else hi = m; }
            const p0 = pts[lo], p1 = pts[hi], u = p1[0] - p0[0] > 1e-9 ? (a - p0[0]) / (p1[0] - p0[0]) : 0; lut[b] = p0[1] + (p1[1] - p0[1]) * u;
          }
          const R = (a) => { let f = (a + Math.PI) / (2 * Math.PI) * B - 0.5; f = ((f % B) + B) % B; const i0 = Math.floor(f) % B, i1 = (i0 + 1) % B, u = f - Math.floor(f); return lut[i0] * (1 - u) + lut[i1] * u; };
          const g = new THREE.SphereGeometry(1, 220, 140); g.rotateX(Math.PI / 2);
          const p = g.attributes.position;
          for (let i = 0; i < p.count; i++) { const dx = p.getX(i), dy = p.getY(i), dz = p.getZ(i), r = R(Math.atan2(dy, dx)); p.setXYZ(i, dx * r, dy * r, dz * th); }
          return smooth(g);
        }
        function heartFlat(w) { const k = w / 32, s = new THREE.Shape(); for (let i = 0; i <= 96; i++) { const [x, y] = heartXY(i / 96 * Math.PI * 2); if (i === 0) s.moveTo(x * k, (y + 2.5) * k); else s.lineTo(x * k, (y + 2.5) * k); } return s; }
        function stadium(len, h, hole) {   // a pill outline centred on 0 (len includes the round caps)

        }
        const glowMat = (col, kind, a, b) => new THREE.ShaderMaterial({ transparent: true, depthWrite: false, depthTest: true, blending: THREE.AdditiveBlending, toneMapped: false,
          uniforms: { uCol: { value: new THREE.Color(col) }, uAmp: { value: 0 }, uA: { value: a }, uB: { value: b }, uW: { value: 18 } },
          vertexShader: "varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
          fragmentShader: "uniform vec3 uCol; uniform float uAmp, uA, uB, uW; varying vec2 vP; void main(){" +

            " float g = d > 0.0 ? exp(-d / uW) : 1.0; g *= g; gl_FragColor = vec4(uCol * g * uAmp, g * uAmp); }" });

        const meter = new THREE.Group(); scene.add(meter);

        const halo = new THREE.Mesh(new THREE.PlaneGeometry(2 * S + HH + 220, HH + 220), glowMat(C.neon, "pill", S, HH / 2)); halo.position.z = -6; halo.renderOrder = 1; bar.add(halo);
        // recessed channel behind the tube (inner shadow at the top, lit lip at the bottom)
        const CH = 2 * TR + 10;
        const chanMat = new THREE.ShaderMaterial({ uniforms: { uH: { value: CH / 2 } },
          vertexShader: "varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
          fragmentShader: "uniform float uH; varying vec2 vP; void main(){ float y = vP.y / uH; vec3 c = mix(vec3(0.030,0.012,0.040), vec3(0.11,0.05,0.13), smoothstep(-0.2, -1.0, y));" +
            " c *= 1.0 - 0.55 * smoothstep(0.45, 1.0, y); gl_FragColor = vec4(c, 1.0); }" });
        const chan = new THREE.Mesh(new THREE.ShapeGeometry(stadium(2 * S, CH), 48), chanMat); chan.position.z = HF + 0.2; bar.add(chan);
        // liquid: two cylinders + meniscus caps, shaded in a custom shader (gradient fixed in meter space)

        const liqUniforms = () => ({ uOx: { value: 0 }, uSx: { value: 1 }, uHalf: { value: S }, uTime: { value: 0 }, uDim: { value: 0 }, uHot: { value: 0 }, uCap: { value: 0 },
          uC0: { value: new THREE.Color(C.magenta) }, uC1: { value: new THREE.Color(C.pink) } });
        const liqVS = "uniform float uOx, uSx; varying vec3 vN; varying float vX; void main(){ vec4 wp = modelMatrix * vec4(position,1.0); vX = (wp.x - uOx) / uSx; vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * viewMatrix * wp; }";
        const liqFS = "uniform float uHalf, uTime, uDim, uHot, uCap; uniform vec3 uC0, uC1; varying vec3 vN; varying float vX; void main(){" +
          " float ax = clamp(abs(vX) / uHalf, 0.0, 1.0); vec3 base = mix(uC1, uC0, smoothstep(0.05, 0.95, ax));" +
          " float ny = vN.y; float body = 0.50 + 0.55 * smoothstep(-0.95, 0.55, ny);" +
          " float flow = 0.5 + 0.5 * sin(ax * uHalf * 0.075 + uTime * 11.0);" +
          " float rim = pow(1.0 - abs(vN.z), 2.2);" +
          " float spec = smoothstep(0.40, 0.62, ny) * (1.0 - smoothstep(0.70, 0.92, ny));" +
          " vec3 c = base * body * (0.92 + 0.16 * flow) + uC1 * rim * 0.45 + vec3(1.0, 0.86, 0.96) * spec * 0.55;" +
          " c += vec3(1.0, 0.80, 0.94) * uCap * (0.35 + 0.65 * pow(max(vN.z, 0.0), 2.0));" +
          " c = mix(c, vec3(1.0, 0.86, 0.95), 0.42 * uHot) + base * 0.35 * uHot;" +
          " c *= 1.0 - 0.5 * uDim; c = mix(c, vec3(dot(c, vec3(0.3, 0.5, 0.2))), 0.35 * uDim); gl_FragColor = vec4(c, 1.0); }";

          m.position.set(sd * headX(q), 0, TZ + TR + 2); m.renderOrder = 4; bar.add(m); ticks.push({ m, q, sd }); }));

        const chromeMat = new THREE.MeshPhysicalMaterial({ color: new THREE.Color(C.chrome), metalness: 1, roughness: 0.16, clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: 1.6 });
        const bezelProfile = [[0, 16], [BR - 9, 16], [BR - 4, 14.5], [BR - 1, 11], [BR, 6], [BR, -10], [0, -10]].map(([r, z]) => new THREE.Vector2(r, z));
        const bezelGeo = new THREE.LatheGeometry(bezelProfile, 128); bezelGeo.rotateX(Math.PI / 2);
