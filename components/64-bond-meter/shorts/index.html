     glass capsule, portrait medallion, with a real 3D glass heart perched on the capsule's centre as the payoff gauge, under a
     heavy "62% TIGHT" line. Bright magenta-pink liquid pours along the capsule from both portraits toward the centre and fills
     the heart in sync. On the drain the heart cracks and both fills retreat to the faces (BEEF); on the refill the two fronts
     collide under the heart's tip on the cut, the weld blazes, the halves slam shut and MAX BOND locks in on the same frame.
     Footage: a Shorts split layout (each -h shot sharp at 0.5625x in a full-width window over a blurred bed of itself).
     Everything but the % and the status word is Three.js. Variable bg: "plate" / "none". -->
