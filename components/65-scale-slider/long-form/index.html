     The card slab, slot, fill, ticks, knob and end stop are real Three.js geometry; type is DOM pinned to projected 3D anchors. See ../DECISIONS.md.
     Variable: bg "plate" (sample GTA V footage) / "none" (transparent overlay). -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }

      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ov { position: absolute; inset: 0; }

      #ttl .i { display: flex; align-items: center; gap: 14px; }
      #ttl svg { display: block; filter: drop-shadow(0 3px 6px rgba(0,0,0,.5)) drop-shadow(0 0 10px rgba(255,79,163,.5)); }
      #ttl .word { font-family: "Archivo"; font-weight: 900; font-stretch: 75%; font-size: 78px; line-height: 1; letter-spacing: -0.004em; color: #FFFFFF;
        text-shadow: 0 3px 0 rgba(28,8,48,.6), 0 8px 22px rgba(0,0,0,.45); }
      #read .i { font: 900 68px/1 "Inter"; letter-spacing: -0.035em; color: #FFFFFF; font-variant-numeric: tabular-nums lining-nums;
        font-feature-settings: "tnum" 1, "lnum" 1; text-shadow: 0 3px 0 rgba(28,8,48,.6), 0 8px 22px rgba(0,0,0,.4); }
      #read .pct { font-size: 40px; letter-spacing: 0; margin-left: 3px; color: #D9C9FF; }
      .stop .i { font: 800 24px/1.1 "Inter"; letter-spacing: .12em; color: #A99BC8; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.8" data-width="1920" data-height="1080">
      <div id="shake"><div id="push">
        <video id="s1" class="clip shot" style="z-index:4" src="assets/shots/v17-deluxo-sunset-h.mp4" muted playsinline data-start="0" data-duration="1.533" data-media-start="0" data-track-index="0"></video>
        <video id="s2" class="clip shot" style="z-index:3" src="assets/shots/v52-gp-police-bridge-h.mp4" muted playsinline data-start="1.467" data-duration="1.533" data-media-start="0.534" data-track-index="1"></video>
        <video id="s3" class="clip shot" style="z-index:2" src="assets/shots/v30-street-explosion-h.mp4" muted playsinline data-start="2.933" data-duration="1.667" data-media-start="0" data-track-index="0"></video>
        <video id="s4" class="clip shot" style="z-index:1" src="assets/shots/v26-bridge-explosion-h.mp4" muted playsinline data-start="4.533" data-duration="1.267" data-media-start="0.3" data-track-index="1"></video>
      </div></div>
      <div id="ov" class="clip" data-start="0" data-duration="5.8" data-track-index="2">
        <canvas id="gl" width="1920" height="1080"></canvas>
        <div class="pin" id="kick"><div class="m"><div class="i"></div></div></div>
        <div class="pin" id="ttl"><div class="m"><div class="i">
          <svg width="52" height="60" viewBox="0 0 58 66"><defs><linearGradient id="flg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB8DA"/><stop offset=".45" stop-color="#FF4FA3"/><stop offset="1" stop-color="#E0182A"/></linearGradient></defs>
            <path d="M30 2 C34 15 47 21 49 37 C51 53 41 63 29 63 C17 63 8 54 9 41 C10 31 16 25 19 18 C21 26 24 29 27 30 C26 20 27 10 30 2 Z" fill="url(#flg)" stroke="#2A0A1E" stroke-width="3" stroke-linejoin="round"/>
            <path d="M29 35 C33 41 37 45 36 52 C35 58 31 60 28 60 C23 60 20 56 21 51 C22 46 26 43 29 35 Z" fill="#FFE6F2"/></svg>
          <span class="word"></span></div></div></div>

    </div>
    <script>
      const CONFIG = {
        kicker: "HOW I'M PLAYING IT",
        title: "VIOLENCE",
        stops: ["CALM", "ROWDY", "RECKLESS", "CHAOS"],           // evenly spaced, first = 0 %, last = 100 %
        ramp: [[0, "#6FD8FF"], [0.4, "#A779FF"], [0.72, "#FF4FA3"], [1, "#FF2E3A"]],
        neon: "#FF4FA3", chaos: "#FF2E3A",
        // knob path: [time s, value 0..1, move] ; "detent" = settle with overshoot, "wind" = pull back, "slam" = accelerate into the end stop
        knob: [[1.15, 0], [1.5, 1 / 3, "detent"], [1.85, 1 / 3], [2.25, 2 / 3, "detent"], [2.55, 2 / 3], [2.82, 0.56, "wind"], [3.0, 1, "slam"]],
        timing: { in: 0.15, knob: 0.6, labels: 0.62, out: 4.95, end: 5.8 }
      };

      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const C = CONFIG, T = C.timing, $ = (s) => document.querySelector(s);
        const W = 1920, H = 1080, VERT = false;
        const HIT = C.knob[C.knob.length - 1][0];
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));

        // ---------------- layout (page px) ----------------
        const LY = {
          pivot: [562, 242],
          panel: { w: 900, h: 312, r: 42, d: 24, bev: 8 },
          track: { a: [188, 292], b: [884, 292], th: 26 },        // a = 0 %, b = 100 %
          knob: { w: 62, h: 104, r: 18, d: 30, bev: 7 },
          dome: 19,
          kick: [166, 134], ttl: [164, 196], read: [962, 196], stopY: 362,
          tick: { gap: 9, minor: [3, 12], major: [5, 21] }
        };
        const L = Math.hypot(LY.track.b[0] - LY.track.a[0], LY.track.b[1] - LY.track.a[1]);
        const FACE = LY.panel.d / 2 + LY.panel.bev;                // slab front face z
        const KDT = LY.knob.d + 2 * LY.knob.bev;                    // knob total depth

        // ---------------- helpers ----------------
        const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
        const seg = (t, a, d) => clamp((t - a) / d);
        const lerp = (a, b, k) => a + (b - a) * k;
        const eO3 = (p) => 1 - Math.pow(1 - p, 3), eI2 = (p) => p * p, eI3 = (p) => p * p * p;
        const eIO2 = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
        const eOB = (p, s = 1.7) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);
        const springTo = (p, k = 6, f = 2.4) => p <= 0 ? 0 : 1 - Math.exp(-k * p) * Math.cos(f * Math.PI * p);
        const hexRGB = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
        const hex3 = (h) => { const c = hexRGB(h); return new THREE.Vector3(c[0] / 255, c[1] / 255, c[2] / 255); };
        const RAMP = C.ramp.map(([p, h]) => [p, hexRGB(h)]);
        function rampRGB(u) {
          u = clamp(u); for (let k = 1; k < RAMP.length; k++) if (u <= RAMP[k][0]) {
            const [p0, c0] = RAMP[k - 1], [p1, c1] = RAMP[k], q = (u - p0) / (p1 - p0 || 1);
            return [lerp(c0[0], c1[0], q), lerp(c0[1], c1[1], q), lerp(c0[2], c1[2], q)];
          } return RAMP[RAMP.length - 1][1];
        }
        const css = (c, a = 1) => "rgba(" + c.map((x) => Math.round(x)).join(",") + "," + a + ")";

        // knob value over time
        function knobV(t) {
          const K = C.knob; if (t <= K[0][0]) return K[0][1];
          for (let i = 1; i < K.length; i++) {
            const [t1, v1, m] = K[i], [t0, v0] = K[i - 1];
            if (t <= t1) { const p = (t - t0) / (t1 - t0); const e = m === "detent" ? eOB(p, 1.5) : m === "wind" ? eO3(p) : m === "slam" ? p * p * p : 1; return m ? lerp(v0, v1, e) : v1; }
          }
          const q = t - HIT; return 1 - 0.038 * Math.exp(-6.5 * q) * Math.abs(Math.sin(q * Math.PI / 0.16));
        }
        // inertia lean (+ = the cap's front lags behind the travel direction)
        function knobLean(t) {
          const K = C.knob; let lean = 0;
          for (let i = 1; i < K.length; i++) {
            const [t1, , m] = K[i], t0 = K[i - 1][0];
            if (t > t0 && t <= t1 && m) { const p = (t - t0) / (t1 - t0);
              if (m === "detent") lean = 0.1 * Math.sin(Math.PI * p) - 0.06 * Math.max(0, p - 0.7) / 0.3;
              if (m === "wind") lean = -0.12 * Math.sin(Math.PI * p);
              if (m === "slam") lean = 0.26 * p * p; }
          }
          // detent settle wobble
          for (let i = 1; i < K.length; i++) if (K[i][2] === "detent") { const q = t - K[i][0]; if (q > 0 && q < 0.5) lean += -0.06 * Math.exp(-8 * q) * Math.cos(18 * q); }
          if (t > HIT) { const q = t - HIT; lean = -0.34 * Math.exp(-7 * q) * Math.cos(15 * q); }
          return lean;
        }

        // ---------------- DOM text ----------------
        $("#kick .i").textContent = C.kicker;
        $("#ttl .word").textContent = C.title;
        const stopEls = C.stops.map((s, i) => { const el = $("#st" + i); el.querySelector(".i").textContent = s; return { el, i: el.querySelector(".i") }; });
        const numEl = $("#read .num");

        function canvasTex(w, h, draw) {
          const cv = document.createElement("canvas"); cv.width = w; cv.height = h; const c = cv.getContext("2d"); draw(c, w, h);
          const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4; return tex;
        }
        function radialTex(stops, size = 128) {
          return canvasTex(size, size, (c, N) => { const g = c.createRadialGradient(N / 2, N / 2, 0, N / 2, N / 2, N / 2); stops.forEach(([o, col]) => g.addColorStop(o, col)); c.fillStyle = g; c.fillRect(0, 0, N, N); });
        }
        function rrShape(w, h, r) {
          r = Math.min(r, w / 2 - 0.01, h / 2 - 0.01);
          const s = new THREE.Shape(), x0 = -w / 2, y0 = -h / 2, x1 = w / 2, y1 = h / 2;
          s.moveTo(x0 + r, y0); s.lineTo(x1 - r, y0); s.absarc(x1 - r, y0 + r, r, -Math.PI / 2, 0, false);
          s.lineTo(x1, y1 - r); s.absarc(x1 - r, y1 - r, r, 0, Math.PI / 2, false);
          s.lineTo(x0 + r, y1); s.absarc(x0 + r, y1 - r, r, Math.PI / 2, Math.PI, false);
          s.lineTo(x0, y0 + r); s.absarc(x0 + r, y0 + r, r, Math.PI, Math.PI * 1.5, false); return s;
        }
        function rrCurve(w, h, r) {
          const pts = [], hw = w / 2, hh = h / 2;
          const arc = (cx, cy, a0, a1) => { for (let k = 0; k <= 12; k++) { const a = lerp(a0, a1, k / 12); pts.push(new THREE.Vector3(cx + r * Math.cos(a), cy + r * Math.sin(a), 0)); } };
          arc(hw - r, hh - r, 0, Math.PI / 2); arc(-hw + r, hh - r, Math.PI / 2, Math.PI); arc(-hw + r, -hh + r, Math.PI, Math.PI * 1.5); arc(hw - r, -hh + r, Math.PI * 1.5, Math.PI * 2);
          return new THREE.CatmullRomCurve3(pts, true, "catmullrom", 0.1);
        }
        function extrude(w, h, r, d, bev, seg = 5) {
          const g = new THREE.ExtrudeGeometry(rrShape(w, h, r), { depth: d, bevelEnabled: true, bevelThickness: bev, bevelSize: bev, bevelSegments: seg, curveSegments: 16 });
          g.translate(0, 0, -d / 2); return g;
        }

        function build() {
          const canvas = $("#gl");
          const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true, premultipliedAlpha: true });
          renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.setClearColor(0x000000, 0);
          renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
          const scene = new THREE.Scene();
          const FOV = 24, DIST = (H / 2) / Math.tan((FOV / 2) * Math.PI / 180);
          const camera = new THREE.PerspectiveCamera(FOV, W / H, 10, DIST * 3);
          camera.position.set(0, 0, DIST); camera.lookAt(0, 0, 0);

          // studio env for the clear coat
          const envScene = new THREE.Scene();
          envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 48, 24), new THREE.ShaderMaterial({
            side: THREE.BackSide, depthWrite: false,
            vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
            fragmentShader: "varying vec3 vP; void main(){ float y = vP.y; vec3 top = vec3(0.92,0.94,1.0), hor = vec3(0.26,0.2,0.3), low = vec3(0.03,0.03,0.04);" +
              " vec3 c = y > 0.0 ? mix(hor, top, smoothstep(0.0, 0.9, y)) : mix(hor, low, smoothstep(0.0, 0.45, -y)); gl_FragColor = vec4(c, 1.0); }"
          })));
          const panelL = (w, h, x, y, z, c) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); envScene.add(m); };
          panelL(36, 14, -14, 26, 26, new THREE.Color(4.2, 4.1, 4.0));
          panelL(5, 34, 30, 2, 18, new THREE.Color(2.4, 2.5, 2.9));
          panelL(30, 8, -30, -4, 10, new THREE.Color(3.2, 0.9, 2.0));
          panelL(26, 8, -6, -24, 24, new THREE.Color(0.8, 0.75, 0.8));
          const pmrem = new THREE.PMREMGenerator(renderer);
          scene.environment = pmrem.fromScene(envScene, 0.02, 0.1, 200).texture;
          const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(-0.5, 0.9, 1.0); scene.add(key);
          scene.add(new THREE.HemisphereLight(0xffffff, 0x2a2232, 0.85));

          const G = new THREE.Group(); G.position.set(LY.pivot[0] - W / 2, H / 2 - LY.pivot[1], 0); scene.add(G);
          const P = (x, y, z = 0) => new THREE.Vector3(x - LY.pivot[0], LY.pivot[1] - y, z);

          // ---------- shaders ----------
          const VS = "varying vec2 vUv; varying vec3 vN; varying vec3 vV; varying vec2 vP;" +
            "void main(){ vUv = uv; vP = position.xy; vec4 mv = modelViewMatrix * vec4(position,1.0); vV = mv.xyz; vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * mv; }";
          const SD = "float sdRR(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q,0.0)) + min(max(q.x,q.y),0.0) - r; }";
          const NEON_CORE = "uniform vec3 uCol; uniform vec3 uHot; uniform float uOn; varying vec3 vN; varying vec3 vV;" +
            "void main(){ vec3 N = normalize(vN); vec3 V = normalize(-vV); float f = clamp(abs(dot(N,V)),0.0,1.0);" +
            " vec3 lit = mix(uCol*0.55, uCol, smoothstep(0.0,0.5,f)); lit = mix(lit, uHot, smoothstep(0.55,0.97,f)*0.9);" +
            " vec3 off = vec3(0.32,0.2,0.34)*(0.55+0.45*f); gl_FragColor = vec4(min(mix(off, lit, uOn), vec3(1.0)), 1.0); }";
          const NEON_GLOW = "uniform vec3 uCol; uniform float uGlow; varying vec3 vN; varying vec3 vV;" +
            "void main(){ vec3 N = normalize(vN); vec3 V = normalize(-vV); float f = clamp(abs(dot(N,V)),0.0,1.0);" +
            " gl_FragColor = vec4(uCol, clamp(pow(f, 2.4) * uGlow, 0.0, 1.0)); }";
          // soft rounded-rect halo / shadow (outside falloff + optional inside fill)
          const HALO = SD + "uniform vec3 uCol; uniform vec2 uB; uniform float uR, uA, uFall, uIn; varying vec2 vP;" +
            "void main(){ float d = sdRR(vP, uB, uR); float a = d > 0.0 ? exp(-d/uFall) * uA : uIn;" +
            " gl_FragColor = vec4(uCol, clamp(a,0.0,1.0)); }";
          // liquid-light fill in the slot (local x = along the track, y = across)
          const FILL = "uniform float uA0, uLen, uHead, uEnd, uR, uBoost, uGlow, uFall; uniform vec3 uC0, uC1, uC2, uC3; uniform vec4 uS; varying vec2 vP;" +
            "vec3 ramp(float u){ u = clamp(u,0.0,1.0); if (u < uS.y) return mix(uC0, uC1, u/uS.y); if (u < uS.z) return mix(uC1, uC2, (u-uS.y)/(uS.z-uS.y)); return mix(uC2, uC3, (u-uS.z)/(1.0-uS.z)); }" +
            "float cap(vec2 p, float a, float b, float r){ float x = clamp(p.x, a, b); return length(vec2(p.x - x, p.y)) - r; }" +
            "void main(){ vec2 p = vP; float u = (p.x - uA0) / uLen; vec3 c = ramp(u);" +
            " float dF = cap(p, uA0, uHead, uR), dE = cap(p, uA0, uEnd, uR);" +
            " float yy = clamp(p.y / uR, -1.0, 1.0);" +
            " vec3 fc = c * (0.6 + 0.4*(1.0 - yy*yy)) * uBoost + vec3(1.0)*pow(max(1.0-abs(yy),0.0),5.0)*0.4*uBoost + vec3(1.0)*exp(-pow((yy-0.52)/0.16,2.0))*0.32;" +
            " float inF = smoothstep(0.9, -0.9, dF), inE = smoothstep(0.9, -0.9, dE);" +
            " float gA = dF > 0.0 ? exp(-dF/uFall) * uGlow : 0.0; vec3 gc = ramp(min(u, (uHead-uA0)/uLen));" +
            " vec3 col = gc; float a = gA * (1.0 - inE);" +
            " vec3 dim = c * 0.26 * (0.7 + 0.3*(1.0-yy*yy)); float aD = inE * (1.0 - inF) * 0.9;" +
            " col = mix(col, dim, aD / max(a + aD - a*aD, 0.001)); a = a + aD - a*aD;" +
            " col = mix(col, min(fc, vec3(1.0)), inF); a = a + inF - a*inF;" +
            " gl_FragColor = vec4(col, clamp(a,0.0,1.0)); }";

          const RS = new THREE.Vector4(0, C.ramp[1][0], C.ramp[2][0], 1);
          const RC = C.ramp.map(([, h]) => hex3(h));

          // ---------- the card slab ----------
          const PN = LY.panel;
          const SG = new THREE.Group(); G.add(SG);                    // slab group: everything on the card
          const faceTex = canvasTex(512, Math.round(512 * PN.h / PN.w), (c, w, h) => {
            let g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#3A1C63"); g.addColorStop(0.5, "#221040"); g.addColorStop(1, "#140926");
            c.fillStyle = g; c.fillRect(0, 0, w, h);
            g = c.createRadialGradient(w * 0.22, h * 0.05, 0, w * 0.22, h * 0.05, w * 0.6); g.addColorStop(0, "rgba(190,140,255,.28)"); g.addColorStop(1, "rgba(190,140,255,0)");
            c.fillStyle = g; c.fillRect(0, 0, w, h);
            g = c.createRadialGradient(w * 0.62, h * 1.05, 0, w * 0.62, h * 1.05, w * 0.55); g.addColorStop(0, "rgba(255,79,163,.22)"); g.addColorStop(1, "rgba(255,79,163,0)");
            c.fillStyle = g; c.fillRect(0, 0, w, h);
          });
          faceTex.repeat.set(1 / PN.w, 1 / PN.h); faceTex.offset.set(0.5, 0.5);
          const slabFace = new THREE.MeshPhysicalMaterial({ map: faceTex, roughness: 0.34, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.12, envMapIntensity: 0.55, transparent: true, opacity: 0.94 });
          const slabSide = new THREE.MeshPhysicalMaterial({ color: 0x8a5ce0, metalness: 0.9, roughness: 0.26, clearcoat: 0.7, clearcoatRoughness: 0.1, envMapIntensity: 1.4 });
          const slab = new THREE.Mesh(extrude(PN.w, PN.h, PN.r, PN.d, PN.bev, 6), [slabFace, slabSide]); slab.renderOrder = 2; SG.add(slab);
          // pink glow border + contact shadow on the footage

              el.style.visibility = shownDom && p > 0 ? "visible" : "hidden"; if (el.style.visibility === "hidden") return;
              pinEl(el, obj, ax, sc || 1); rise(inner, p, lout);
            };
            pinRise($("#kick"), $("#kick .i"), aKick, 0, seg(t, T.labels, 0.45));
            pinRise($("#ttl"), $("#ttl .i"), aTtl, 0, seg(t, T.labels + 0.06, 0.5));
            // readout: counts with the knob, locks at 100 and turns red on the hit
            const readPunch = hp >= 0 ? 1 + 0.22 * Math.exp(-7 * hp) * Math.cos(Math.min(hp, 0.5) * 9) : 1;
            pinRise($("#read"), $("#read .i"), aRead, 1, seg(t, T.labels + 0.12, 0.5), 0, readPunch);
            const pct = hp >= 0 ? 100 : Math.round(clamp(v) * 100);
            if (numEl.textContent !== String(pct)) numEl.textContent = String(pct);
            const rc = hp >= 0 ? hexRGB("#FF5C66") : [255, 255, 255];
            numEl.style.color = css(rc); numEl.style.textShadow = hp >= 0 ? "0 0 14px rgba(255,46,58,.85), 0 0 34px rgba(255,46,58,.5), 0 3px 0 rgba(60,0,10,.6)" : "";
            const pc = rampRGB(v); $("#read .pct").style.color = css(hp >= 0 ? hexRGB("#FF8A92") : pc);
            // stop labels
            const N = C.stops.length - 1;
            stopEls.forEach((s, i) => {
              const sv = i / N, p = seg(t, T.labels + 0.14 + i * 0.06, 0.45);
              const active = hp < 0 ? Math.abs(v - sv) < 0.1 : i === N;
              let col = v >= sv - 0.02 ? [226, 216, 245] : [169, 155, 200], glow = "", scl = 1;
              if (active) { const c = rampRGB(sv); col = i === N && hp >= 0 ? hexRGB("#FF5C66") : [255, 255, 255]; glow = "0 0 12px " + css(c, 0.9) + ", 0 0 26px " + css(c, 0.5); }
              if (hp >= 0 && i < N) { col = [150, 138, 184]; glow = ""; }
              const tt = i === 0 ? null : i === N ? HIT : tDet[i - 1];
              if (tt !== null && tt !== undefined && t > tt) scl = 1 + (i === N ? 0.55 : 0.18) * Math.exp(-8 * (t - tt)) * Math.cos(Math.min(t - tt, 0.4) * 10);
              if (i === N && hp >= 0) scl *= 1 + 0.16 * eO3(seg(hp, 0, 0.3));
              s.i.style.color = css(col); s.i.style.textShadow = glow;
              pinRise(s.el, s.i, aStops[i], 0.5, p, 0, scl);
            });
          }

          window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") renderAt(e.detail.time); });
          const tl = gsap.timeline({ paused: true });
          renderAt(0);
          Look.drive(tl, 0, T.end, (p) => renderAt(p * T.end));
          if (plate) {
            Look.impact(tl, HIT, { shake: "#shake", amp: 6, dur: 0.3, flash: 0, zoom: 1.015 });
            Look.push(tl, "#push", 0, T.end, { to: 1.04 });
          }
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        }

        const FACES = ["800 100px Inter", "900 100px Inter", "900 100px Archivo"];
        Promise.all(FACES.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(build);
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
