<!doctype html>
<!-- 66 Time-passing clock, variant A (16:9, 1920x1080, 30 fps): "Clock face".
     A real 3D analog clock centred over the footage: black-ceramic bezel with polished steel lips, a frosted-glass dial
     (the footage blurs through it), applied numerals and bars that cast shadows, lacquer hands with a red minute tip and
     a recessed digital readout. The hands sweep 3:00 PM to 8:00 PM with shutter motion blur while the shots cut from
     afternoon to sunset on every second hour; the sun on the clock swings low and warm. Payoff: the minute hand hits
     8:00 and locks with an overshoot, the face lamp switches on, a rake crosses the bezel, the readout locks warm.
     Variable bg: "plate" (sample footage) / "none" (transparent overlay). Engine: media/clock3d.js. -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="media/glyphs.js"></script>
    <script src="media/clock3d.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #s1 { z-index: 5; } #s2 { z-index: 4; } #s3 { z-index: 3; } #s4 { z-index: 2; } #s5 { z-index: 1; }
      #ov { position: absolute; inset: 0; }
      #gl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
      #persp { position: absolute; inset: 0; perspective-origin: 50% 50%; pointer-events: none; }
      #cshadow { position: absolute; border-radius: 50%; opacity: 0;
        background: radial-gradient(closest-side, rgba(3,3,5,.5) 0%, rgba(3,3,5,.34) 62%, rgba(3,3,5,.12) 84%, rgba(3,3,5,0) 100%); }
      #halo { position: absolute; border-radius: 50%; opacity: 0; transform-origin: 50% 50%;
        background: radial-gradient(closest-side, rgba(255,176,96,0) 0%, rgba(255,176,96,0) 58%, rgba(255,184,104,.62) 65.5%, rgba(255,150,70,.26) 77%, rgba(255,120,40,0) 100%); }
      #frost { position: absolute; border-radius: 50%; overflow: hidden; transform-origin: 50% 50%; opacity: 0;
        background: radial-gradient(circle at 42% 34%, rgba(255,255,255,.76) 0%, rgba(250,251,253,.68) 55%, rgba(236,239,245,.72) 100%);
        -webkit-backdrop-filter: blur(16px) saturate(1.25) brightness(1.08); backdrop-filter: blur(16px) saturate(1.25) brightness(1.08);
        box-shadow: inset 0 10px 28px rgba(0,0,0,.26), inset 0 0 0 2px rgba(0,0,0,.14); }
      #warm { position: absolute; inset: 0; border-radius: 50%; opacity: 0;
        background: radial-gradient(circle at 50% 46%, rgba(255,240,206,.96) 0%, rgba(255,220,160,.9) 48%, rgba(255,186,108,.86) 84%, rgba(246,150,74,.9) 100%); }
      #flare { position: absolute; inset: 0; border-radius: 50%; opacity: 0;
        background: radial-gradient(circle at 50% 46%, rgba(255,252,240,.95) 0%, rgba(255,240,200,.55) 40%, rgba(255,220,160,0) 75%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.85" data-width="1920" data-height="1080">
      <div id="shake"><div id="push">
        <!-- afternoon to sunset; each cut lands on an hour pass (4 PM, 6 PM, 8 PM); incoming clips start 2 frames early underneath -->
        <video id="s1" class="clip shot" src="assets/shots/v44-bridge-skyline-h.mp4" muted playsinline data-start="0" data-duration="1.535" data-media-start="0.1" data-track-index="0"></video>
        <video id="s2" class="clip shot" src="assets/shots/v36-hills-city-view-h.mp4" muted playsinline data-start="1.4683" data-duration="0.7307" data-media-start="0.5333" data-track-index="1"></video>
        <video id="s3" class="clip shot" src="assets/shots/v07-biplane-sunset-h.mp4" muted playsinline data-start="2.1323" data-duration="1.1177" data-media-start="0.4667" data-track-index="2"></video>
        <video id="s4" class="clip shot" src="assets/shots/v24-sunset-powerlines-h.mp4" muted playsinline data-start="3.1833" data-duration="1.6167" data-media-start="0" data-track-index="3"></video>
        <video id="s5" class="clip shot" src="assets/shots/v01-lifeguard-sunset-h.mp4" muted playsinline data-start="4.7333" data-duration="1.1167" data-media-start="0.1333" data-track-index="4"></video>
      </div></div>
      <div id="ov" class="clip" data-start="0" data-duration="5.85" data-track-index="5">
        <div id="cshadow"></div>
        <div id="persp">
          <div id="halo"></div>
          <div id="frost"><div id="warm"></div><div id="flare"></div></div>
        </div>
        <canvas id="gl" width="1920" height="1080"></canvas>
      </div>
    </div>
    <script>
      const CONFIG = {
        start: { h: 15, m: 0 },        // 24 h clock time at the start (3:00 PM)
        hours: 5,                      // whole hours the hands sweep (lands on 8:00 PM)
        ampm: "PM",                    // readout suffix
        clock: { x: 960, y: 520, r: 300, bezel: 48 },   // centre and dial radius on the 1920x1080 canvas (outer diameter 2r + 2 bezel)
        numeralCap: 0.22,              // applied 12 / 3 / 6 / 9 height, fraction of the dial radius
        readout: { w: 0.76, h: 0.28, cy: 0.43, fs: 0.8 },  // digital window, fractions of the dial radius; fs = font size / window height
        accent: "#FF2E3A",             // minute-hand tip
        timing: { in: 0.2, spin: 0.95, spinDur: 2.3, out: 5.05, end: 5.85 }  // lock-in = spin + spinDur (3.25 s)
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const T = CONFIG.timing, C = CONFIG.clock, $ = (s) => document.querySelector(s);
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));
        const W = 1920, H = 1080, DIST = (H / 2) / Math.tan(12 * Math.PI / 180);
        // DOM layers sized from CONFIG
        const OUT = C.r + C.bezel, RF = C.r + 3;
        const place = (el, size) => { el.style.left = (C.x - size / 2) + "px"; el.style.top = (C.y - size / 2) + "px"; el.style.width = size + "px"; el.style.height = size + "px"; };
        place($("#frost"), 2 * RF); place($("#halo"), 2 * OUT * 1.55); place($("#cshadow"), 2 * OUT * 1.14);
        $("#persp").style.perspective = DIST.toFixed(2) + "px";

        const FACES = ["900 100px Inter", "800 100px Inter"];
        Promise.all(FACES.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
          const clock = Clock3D({ W, H, R: C.r, bezel: C.bezel, cx: C.x, cy: C.y, T, hours: CONFIG.hours, start: CONFIG.start, ampm: CONFIG.ampm,
            numCap: CONFIG.numeralCap, win: CONFIG.readout, readFs: CONFIG.readout.fs, accent: CONFIG.accent,
            canvas: $("#gl"), frost: $("#frost"), warm: $("#warm"), flareEl: $("#flare"), halo: $("#halo"), cshadow: $("#cshadow") });
          clock.measure();
          window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") clock.renderAt(e.detail.time); });
          const tl = gsap.timeline({ paused: true });
          clock.renderAt(0);
          Look.drive(tl, 0, T.end, (p) => clock.renderAt(p * T.end));
          if (plate) {
            Look.push(tl, "#push", 0, T.end, { from: 1.0, to: 1.04 });
            Look.impact(tl, clock.TL, { shake: "#shake", amp: 6, dur: 0.3, flash: 0, host: "#root", zoom: 1.012 });
          }
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
</body>
</html>
