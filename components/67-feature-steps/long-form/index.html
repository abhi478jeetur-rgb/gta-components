<!doctype html>
<!-- 67 Feature steps, variant A "Tile row". 16:9 1920x1080, 30 fps, 6.5 s. Overlay kind (bg:none = clean transparent overlay).
     The creators' row of glowing purple feature tiles joined by pink arrows, each with a caption pill under it, lit one step at a
     time as the narrator covers it. Tiles, icons and arrows are real Three.js geometry (media/steps3d.js); the pills are DOM.
     Payoff: the result step ignites gold on a cut, its coin flips and lands, a warm rake crosses it, then the chain relights.
     See DECISIONS.md / README.md. -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="media/glyphs.js"></script>
    <script src="media/steps3d.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push, #glHost, #ov { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #push { transform-origin: 50% 40%; }
      .shot { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
      /* caption pills: pink candy (3-stop body, glass top band, inner bottom shade, keyline, neon glow, contact shadow) */
      .pill { position: absolute; height: 78px; display: flex; align-items: center; gap: 16px; padding: 0 36px 0 30px; border-radius: 39px;
        background: linear-gradient(180deg, #FFA3D3 0%, #FF58A9 44%, #E0237F 78%, #C0156B 100%);
        box-shadow: inset 0 2px 0 rgba(255,255,255,.7), inset 0 -6px 12px rgba(105,0,55,.5), 0 0 0 2px rgba(255,186,222,.6),
          0 0 30px rgba(255,79,163,.8), 0 12px 24px rgba(12,0,22,.6); white-space: nowrap; visibility: hidden; }
      .pill::before { content: ""; position: absolute; left: 10px; right: 10px; top: 4px; height: 30px; border-radius: 30px;
        background: linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,0)); pointer-events: none; }
      .pill .dot { position: relative; width: 16px; height: 16px; border-radius: 50%; flex: none;
        background: radial-gradient(circle at 36% 34%, #FFFFFF 0%, #FFE6F3 55%, #FFB3D8 100%); box-shadow: 0 0 10px rgba(255,255,255,.95), 0 1px 0 rgba(110,0,60,.5); }
      .pill .win { position: relative; display: block; overflow: hidden; height: 78px; }
      .pill .txt { display: block; font-family: "Archivo", sans-serif; font-weight: 900; font-stretch: 72%; font-size: 48px; line-height: 78px;
        letter-spacing: 0.012em; color: #FFFFFF; text-shadow: 0 2px 0 rgba(118,0,62,.6), 0 0 14px rgba(255,255,255,.18); }
      .pill .gloss { position: absolute; inset: 0; border-radius: 39px; overflow: hidden; pointer-events: none; }
      .pill .shine { position: absolute; top: -10px; bottom: -10px; left: 0; width: 70px; transform: translateX(-140px);
        background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.75) 50%, rgba(255,255,255,0)); }
      .pill.gold { background: linear-gradient(180deg, #FFF3C4 0%, #FFD45E 42%, #EDA526 76%, #C97A0C 100%);
        box-shadow: inset 0 2px 0 rgba(255,255,255,.8), inset 0 -6px 12px rgba(120,60,0,.45), 0 0 0 2px rgba(255,232,170,.7),
          0 0 34px rgba(246,196,83,.85), 0 12px 24px rgba(12,0,22,.6); }
      .pill.gold .txt { color: #3A1C00; text-shadow: 0 2px 0 rgba(255,246,214,.7); }
      .pill.gold .dot { background: radial-gradient(circle at 36% 34%, #FFFFFF 0%, #7A4A06 30%, #3A1C00 100%); box-shadow: 0 1px 0 rgba(255,246,214,.8); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.5" data-width="1920" data-height="1080">
      <div id="shake"><div id="push">
        <!-- cut like an edit; each incoming shot starts 2 frames early underneath the outgoing one (lesson 25) -->
        <video id="sh1" class="clip shot" src="assets/shots/v17-deluxo-sunset-h.mp4" muted playsinline data-start="0" data-duration="1.25" data-media-start="0" data-track-index="5" style="z-index:5"></video>
        <video id="sh2" class="clip shot" src="assets/shots/v31-red-car-sunset-h.mp4" muted playsinline data-start="1.183" data-duration="1.167" data-media-start="0.283" data-track-index="4" style="z-index:4"></video>
        <video id="sh3" class="clip shot" src="assets/shots/v52-gp-police-bridge-h.mp4" muted playsinline data-start="2.283" data-duration="1.467" data-media-start="0.533" data-track-index="3" style="z-index:3"></video>
        <video id="sh4" class="clip shot" src="assets/shots/v11-yacht-h.mp4" muted playsinline data-start="3.683" data-duration="1.767" data-media-start="0.033" data-track-index="2" style="z-index:2"></video>
        <video id="sh5" class="clip shot" src="assets/shots/v36-hills-city-view-h.mp4" muted playsinline data-start="5.383" data-duration="1.117" data-media-start="0" data-track-index="1" style="z-index:1"></video>
      </div></div>
      <div id="glHost"></div>
      <div id="ov"></div>
    </div>
    <script>
      const CONFIG = {
        W: 1920, H: 1080,
        // the steps, left to right. label = caption pill; icon = wheel | star | coin; accent "gold" marks the result step
        steps: [
          { label: "STEAL A CAR", icon: "wheel", cx: 440, cy: 296, ry: 0.1 },
          { label: "LOSE THE COPS", icon: "star", cx: 960, cy: 296 },
          { label: "CASH OUT", icon: "coin", accent: "gold", cx: 1480, cy: 296, ry: -0.1 }
        ],
        pillY: 488,                                          // pill top (px)
        tile: { w: 400, h: 290, r: 44, depth: 30, bevel: 7, tube: 5.6, glowPad: 64, shadowPad: 70, shadowZ: 40, shadowDrop: 16,
                icon: { size: 152, x: 0, y: 0, z: 18 } },
        arrow: { tube: 6, head: 26, glow: 28 },
        look: { exposure: 1.0, neon: "#FF4FA3", gold: "#F6B23C", goldBody: "#E8A933", body: "#3A1260", faceTop: "#52207F", faceBot: "#1E0834",
                done: 0.5, glow: 0.62, glowPeak: 1.5, shadow: 0.55, lift: 26, punch: 0.08, sheen: 0.28, sheenPay: 0.5, rake: 9, arrowGlow: 0.6, sway: 0.025,
                samples: 14, shutter: 0.45 },
        camera: { fov: 30, dolly: 0.985, yaw: 0, pitch: 0 },
        timing: { in: [0.18, 0.3, 0.42], light: [0.95, 2.35, 3.75], draw: 0.24, drawPay: 0.1, charge: 0.3, chain: 0.5, chainStep: 0.1,
                  coinDur: 0.55, rakeAt: 0.12, rakeDur: 0.5, goldFront: 0.1, goldDur: 0.45,
                  exit: 5.55, exitStep: 0.07, exitDur: 0.3, pillOut: 5.38, end: 6.5 }
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const C = CONFIG, T = C.timing, $ = (s) => document.querySelector(s);
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));
        // arrows sit in the gaps, at the tile centre line
        C.arrows = C.steps.slice(0, -1).map((s, k) => {
          const n = C.steps[k + 1], g0 = s.cx + C.tile.w / 2, g1 = n.cx - C.tile.w / 2, m = (g0 + g1) / 2, half = Math.min(44, (g1 - g0) / 2 - 18);
          return { x0: m - half, y0: s.cy, x1: m + half, y1: n.cy, z: 14 };
        });
        const ov = $("#ov");
        const pills = C.steps.map((s, i) => {
          const p = document.createElement("div"); p.className = "pill" + (s.accent === "gold" ? " gold" : ""); p.id = "pill" + i;
          p.innerHTML = '<span class="gloss"><span class="shine"></span></span><span class="dot"></span><span class="win"><span class="txt"></span></span>';
          p.querySelector(".txt").textContent = s.label;
          ov.appendChild(p); return p;
        });
        const FACES = ["900 100px Inter", "800 100px Inter", "900 48px Archivo"];
        Promise.all(FACES.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
          const G3 = Steps3D(C, $("#glHost"));
          const tl = gsap.timeline({ paused: true });
          // pills: spring open from their centre as the step lights; the label rises in its window; out = label drops, pill closes
          pills.forEach((p, i) => {
            const s = C.steps[i], w = p.offsetWidth, h = p.offsetHeight, at = T.light[i] + 0.05;
            p.style.left = (s.cx - w / 2) + "px"; p.style.top = C.pillY + "px";
            const closed = "inset(-44px " + (w / 2 - h / 2) + "px -44px " + (w / 2 - h / 2) + "px round 60px)", open = "inset(-44px -44px -44px -44px round 60px)";
            const txt = p.querySelector(".txt"), dot = p.querySelector(".dot");
            tl.set(txt, { yPercent: 105 }, 0); tl.set(dot, { scale: 0 }, 0);
            tl.set(p, { visibility: "visible", clipPath: closed, scale: 0.5, y: -26, transformOrigin: "50% 0%" }, at);
            tl.to(p, { scale: 1, y: 0, duration: 0.42, ease: "back.out(2.2)" }, at);
            tl.to(p, { clipPath: open, duration: 0.16, ease: "power3.out" }, at + 0.02);
            tl.fromTo(txt, { yPercent: 105 }, { yPercent: 0, duration: 0.4, ease: "expo.out", immediateRender: false }, at + 0.13);
            tl.fromTo(dot, { scale: 0 }, { scale: 1, duration: 0.36, ease: "back.out(3)", immediateRender: false }, at + 0.1);
            tl.fromTo(p.querySelector(".shine"), { x: -140, skewX: -22 }, { x: w + 80, skewX: -22, duration: s.accent === "gold" ? 0.5 : 0.42, ease: "power2.inOut", immediateRender: false }, at + (s.accent === "gold" ? 0.3 : 0.26));
            const out = T.pillOut + i * T.exitStep;
            tl.to(txt, { yPercent: -105, duration: 0.14, ease: "power3.in" }, out);
            tl.to(p, { clipPath: closed, scale: 0.55, y: -34, duration: 0.16, ease: "power3.in" }, out + 0.03);
            tl.set(p, { visibility: "hidden" }, out + 0.19);
          });
          if (plate) {
            Look.push(tl, "#push", 0, T.end, { from: 1.0, to: 1.04 });
            Look.impact(tl, T.light[2], { shake: "#shake", amp: 6, dur: 0.3, flash: 0, zoom: 1.015 });
          }
          Look.drive(tl, 0, T.end, (p) => G3.renderAt(p * T.end));
          window.addEventListener("hf-seek", (e) => G3.renderAt(e.detail && e.detail.time != null ? e.detail.time : 0));
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
</body>
</html>
