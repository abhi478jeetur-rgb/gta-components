<!doctype html>
<!-- 67 Feature steps, variant B "Step stack". 9:16 1080x1920, 30 fps, 6.5 s. Overlay kind (bg:none = clean transparent overlay).
     The same glowing purple step tiles stacked down a Short: three wide slabs (69-72% of the frame width) joined by neon arrows,
     each with its 3D icon and its step word as extruded Archivo glyphs, lit one at a time. Everything is real Three.js geometry
     (media/steps3d.js). Payoff: the result step ignites gold on a cut, its coin flips and lands, CASH OUT turns gold behind a
     hot light front, then the chain relights. See DECISIONS.md / README.md. -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="../../../shared/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../shared/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../../shared/kit/look/look.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="media/glyphs.js"></script>
    <script src="media/steps3d.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push, #glHost, #ov { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #push { transform-origin: 50% 50%; }
      .shot { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.5" data-width="1080" data-height="1920">
      <div id="shake"><div id="push">
        <!-- cut like an edit; each incoming shot starts 2 frames early underneath the outgoing one (lesson 25) -->
        <video id="sh1" class="clip shot" src="assets/shots/v17-deluxo-sunset-v.mp4" muted playsinline data-start="0" data-duration="1.25" data-media-start="0" data-track-index="5" style="z-index:5"></video>
        <video id="sh2" class="clip shot" src="assets/shots/v31-red-car-sunset-v.mp4" muted playsinline data-start="1.183" data-duration="1.167" data-media-start="0.283" data-track-index="4" style="z-index:4"></video>
        <video id="sh3" class="clip shot" src="assets/shots/v52-gp-police-bridge-v.mp4" muted playsinline data-start="2.283" data-duration="1.467" data-media-start="0.533" data-track-index="3" style="z-index:3"></video>
        <video id="sh4" class="clip shot" src="assets/shots/v11-yacht-v.mp4" muted playsinline data-start="3.683" data-duration="1.117" data-media-start="0.033" data-track-index="2" style="z-index:2"></video>
        <video id="sh5" class="clip shot" src="assets/shots/v36-hills-city-view-v.mp4" muted playsinline data-start="4.733" data-duration="1.767" data-media-start="0" data-track-index="1" style="z-index:1"></video>
      </div></div>
      <div id="glHost"></div>
      <div id="ov"></div>
    </div>
    <script>
      const CONFIG = {
        W: 1080, H: 1920,
        // the steps, top to bottom. word = the big extruded step word; pill = the caption pill hung under the tile;
        // icon = wheel | star | coin; accent "gold" marks the result step (it ignites gold and its word turns gold on the payoff)
        steps: [
          { word: "STEAL", pill: "A FAST CAR", icon: "wheel", cx: 504, cy: 430 },
          { word: "ESCAPE", pill: "LOSE THE COPS", icon: "star", cx: 504, cy: 820 },
          { word: "CASH OUT", pill: "SELL IT FAST", icon: "coin", accent: "gold", cx: 504, cy: 1210 }
        ],
        tile: { w: 780, h: 270, r: 54, depth: 36, bevel: 8, tube: 6.4, glowPad: 60, shadowPad: 74, shadowZ: 40, shadowDrop: 18,
                icon: { size: 178, x: -246, y: 12, z: 20 },
                word: { x: -128, y: -31, cap: 88, maxW: 478, depth: 16, bevel: 3.6 },
                pill: { h: 68, px: 44, bevel: 3, depth: 10, z: 10, dy: 0, x: 0, glow: 24 } },
        arrow: { tube: 6, head: 26, glow: 28 },
        look: { exposure: 1.0, neon: "#FF4FA3", gold: "#F6B23C", goldBody: "#F6C453", body: "#3A1260", faceTop: "#52207F", faceBot: "#1E0834",
                done: 0.5, glow: 0.55, glowPeak: 1.4, shadow: 0.55, lift: 26, punch: 0.07, sheen: 0.26, sheenPay: 0.46, rake: 10, arrowGlow: 0.6, sway: 0.022,
                frontPanel: [1.7, 1.6, 1.5], rim: 2.0, enamelExpo: 1.18, goldExpo: 1.12, coinBloom: 0.6, coinBloomRest: 0.25,
                samples: 14, shutter: 0.45 },
        camera: { fov: 30, dolly: 0.985, yaw: 0, pitch: 0 },
        timing: { in: [0.18, 0.3, 0.42], light: [0.95, 2.35, 3.75], draw: 0.24, drawPay: 0.1, charge: 0.3, chain: 0.6, chainStep: 0.1,
                  coinDur: 0.55, rakeAt: 0.12, rakeDur: 0.5, goldFront: 0.08, goldDur: 0.5, pillIn: 0.06, pillOutLead: 0.2,
                  exit: 5.55, exitStep: 0.07, exitDur: 0.3, end: 6.5 }
      };
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const C = CONFIG, T = C.timing, $ = (s) => document.querySelector(s);
        if (!plate) document.querySelectorAll("video.shot").forEach((v) => (v.style.display = "none"));
        // arrows run down the gaps at the icon column
        C.arrows = C.steps.slice(0, -1).map((s, k) => {
          const n = C.steps[k + 1], x = s.cx + C.tile.icon.x, g0 = s.cy + C.tile.h / 2, g1 = n.cy - C.tile.h / 2, m = (g0 + g1) / 2, half = Math.min(40, (g1 - g0) / 2 - 14);
          return { x0: x, y0: m - half, x1: x, y1: m + half, z: 14 };
        });
        const FACES = ["900 100px Inter", "800 100px Inter", "900 44px Archivo"];
        Promise.all(FACES.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
          const G3 = Steps3D(C, $("#glHost"));
          const tl = gsap.timeline({ paused: true });
          if (plate) {
            Look.push(tl, "#push", 0, T.end, { from: 1.0, to: 1.04 });
            Look.impact(tl, T.light[2], { shake: "#shake", amp: 6, dur: 0.3, flash: 0, zoom: 1.015 });
          }
          Look.drive(tl, 0, T.end, (p) => G3.renderAt(p * T.end));
          window.addEventListener("hf-seek", (e) => G3.renderAt(e.detail && e.detail.time != null ? e.detail.time : 0));
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
</body>
</html>
