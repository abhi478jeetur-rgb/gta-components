<!-- GTA-niche 75 Honor to profile slider, variant B (9:16, 1080x1920, 30 fps, 6.6 s). RDR2's honor meter flips into GTA VI's
     criminal profile and slides to IRREDEEMABLE: a meter that changes identity, the comparison object for a system that crossed games.
     The meter is a physical object: a Three.js navy housing with a title tab, a recessed lit slot with a liquid fill, a bevelled ceramic
     puck with a contact shadow; labels are DOM Oswald pinned to the housing face. Full-kind component over official GTA VI footage.
     Variable: bg "plate" / "none" (full kind: footage stays). Content and timing live in CONFIG. -->
<html lang="en" data-composition-variables='[

    <script>
      // Content structure: the film kit ports this (type "slider"): title / left / right per identity, colours, knob positions, times.
      const CONFIG = {
        title: ["HONOR", "CRIMINAL PROFILE"],        // identity 0 (RDR2) -> identity 1 (GTA VI)
        left:  ["LOW HONOR", "PROFESSIONAL"],
        right: ["HIGH HONOR", "IRREDEEMABLE"],
        colour: ["#E6D9BC", "#F2558E"],              // fill / LED per identity: RDR2 parchment cream, GTA VI pink
        hot:    ["#FFFBEE", "#FFC2DA"],              // hot core of the fill
        tint:   ["#E6D9BC", "#F2558E"],              // active end label tint (>= 5:1 on the leather / navy face)
        home: 0.9,                                   // knob after the honor rises (HIGH HONOR)
        flipHome: 0.08,                              // where it lands after the flip (PROFESSIONAL)

        timing: { in: 0.0, knob: 0.25, flip: 2.24, slide: 3.6, hit: 4.0, out: 5.85, end: 6.6 }

      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const plate = VARS.bg !== "none";
        const W = 1080, H = 1920, T = CONFIG.timing, $ = (s) => document.querySelector(s), C = CONFIG;
        const LY = { housing: { x: 136, y: 1104, w: 780, h: 226, r: 20, d: 30, bev: 6 }, tab: { h: 80, pad: 30, over: 10 },
          slot: { x0: 216, x1: 836, cy: 1190, r: 20, lip: 8 }, title: { size: 52, track: 0.1 },
          labels: { size: 58, track: 0.015, xL: 162, cyL: 1268, xR: 890, cyR: 1268, fit: 76 }, knob: { r: 48, h: 32, ch: 9 }, inset: 18, hitSweep: true, shake: 8, blur: 8 };
        const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, p) => a + (b - a) * p;
        const seg = (t, a, d) => clamp((t - a) / d);
        const eO3 = (p) => 1 - Math.pow(1 - p, 3), eI3 = (p) => p * p * p, eI2 = (p) => p * p, eIO2 = (p) => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        const eIO3 = (p) => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
        const eOB = (p, s = 1.7) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);
        const sm = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
        const hex3 = (h) => new THREE.Color(h);

        // ---------------- DOM type ----------------
        const t0 = $("#t0"), t1 = $("#t1"), l0 = $("#l0"), l1 = $("#l1"), r0 = $("#r0"), r1 = $("#r1");
        t0.textContent = C.title[0]; t1.textContent = C.title[1]; l0.textContent = C.left[0]; l1.textContent = C.left[1]; r0.textContent = C.right[0]; r1.textContent = C.right[1];
        [t0, t1].forEach((e) => { e.style.fontSize = LY.title.size + "px"; e.style.letterSpacing = LY.title.track + "em"; });
        [l0, l1, r0, r1].forEach((e) => { e.style.fontSize = LY.labels.size + "px"; e.style.letterSpacing = LY.labels.track + "em"; });
        const wT = $("#wT"), wL = $("#wL"), wR = $("#wR");

        function canvasTex(w, h, draw) {
          const cv = document.createElement("canvas"); cv.width = w; cv.height = h; const c = cv.getContext("2d"); draw(c, w, h);
          const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4; return tex;
        }
        function rrShape(w, h, r, Cls) {
          r = Math.min(r, w / 2 - 0.01, h / 2 - 0.01);
          const s = new (Cls || THREE.Shape)(), x0 = -w / 2, y0 = -h / 2, x1 = w / 2, y1 = h / 2;
          s.moveTo(x0 + r, y0); s.lineTo(x1 - r, y0); s.absarc(x1 - r, y0 + r, r, -Math.PI / 2, 0, false);
          s.lineTo(x1, y1 - r); s.absarc(x1 - r, y1 - r, r, 0, Math.PI / 2, false);
          s.lineTo(x0 + r, y1); s.absarc(x0 + r, y1 - r, r, Math.PI / 2, Math.PI, false);
          s.lineTo(x0, y0 + r); s.absarc(x0 + r, y0 + r, r, Math.PI, Math.PI * 1.5, false); return s;
        }
        function extrude(w, h, r, d, bev, seg = 4, hole) {
          const sh = rrShape(w, h, r); if (hole) sh.holes.push(rrShape(hole[0], hole[1], hole[2], THREE.Path));
          const g = new THREE.ExtrudeGeometry(sh, { depth: d, bevelEnabled: true, bevelThickness: bev, bevelSize: bev, bevelSegments: seg, curveSegments: 18 });
          g.translate(0, 0, -d / 2); return g;
        }

        function build() {
          // measure type (fonts are loaded): the tab fits the longer title, windows fit the longer label
          const mw = (el) => el.getBoundingClientRect().width;
          let leftW = Math.max(mw(l0), mw(l1)), rightW = Math.max(mw(r0), mw(r1));
          if (LY.labels.fit && LY.labels.cyL === LY.labels.cyR) {                 // one row: both ends must fit between xL and xR with a gap
            const room = LY.labels.xR - LY.labels.xL - LY.labels.fit, need = leftW + rightW;
            if (need > room) { const fs = Math.floor(LY.labels.size * room / need); [l0, l1, r0, r1].forEach((e) => (e.style.fontSize = fs + "px")); leftW = Math.max(mw(l0), mw(l1)); rightW = Math.max(mw(r0), mw(r1)); }
          }
          const titleW = Math.max(mw(t0), mw(t1));
          const HS = LY.housing, TB = LY.tab, SL = LY.slot, KB = LY.knob;
          const tabW = Math.round(titleW + TB.pad * 2 + 6), tabH = TB.h, tabX = HS.x, tabY = HS.y - tabH + TB.over;
          const winH = Math.round(LY.labels.size * 1.25), tWinH = Math.round(LY.title.size * 1.25);
          wT.style.width = (titleW + 8) + "px"; wT.style.height = tWinH + "px";
          wL.style.width = (leftW + 8) + "px"; wL.style.height = winH + "px";
          wR.style.width = (rightW + 8) + "px"; wR.style.height = winH + "px";

          const canvas = $("#gl");
          const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true, premultipliedAlpha: true });
          renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.setClearColor(0x000000, 0);
          renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
          const scene = new THREE.Scene();
          const FOV = 22, DIST = (H / 2) / Math.tan((FOV / 2) * Math.PI / 180);
          const camera = new THREE.PerspectiveCamera(FOV, W / H, 10, DIST * 3);
          camera.position.set(0, 0, DIST); camera.lookAt(0, 0, 0);

          // studio env for the clear coat and the metal
          const envScene = new THREE.Scene();
          envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 48, 24), new THREE.ShaderMaterial({
            side: THREE.BackSide, depthWrite: false,
            vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
            fragmentShader: "varying vec3 vP; void main(){ float y = vP.y; vec3 top = vec3(0.9,0.93,1.0), hor = vec3(0.22,0.22,0.3), low = vec3(0.03,0.03,0.05);" +
              " vec3 c = y > 0.0 ? mix(hor, top, smoothstep(0.0, 0.9, y)) : mix(hor, low, smoothstep(0.0, 0.45, -y)); gl_FragColor = vec4(c, 1.0); }"
          })));
          const panelL = (w, h, x, y, z, c) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); envScene.add(m); };
          panelL(36, 14, -14, 26, 26, new THREE.Color(4.0, 4.0, 4.1));
          panelL(5, 34, 30, 2, 18, new THREE.Color(2.2, 2.4, 3.0));
          panelL(26, 8, -6, -24, 24, new THREE.Color(0.7, 0.7, 0.8));
          const pmrem = new THREE.PMREMGenerator(renderer);
          scene.environment = pmrem.fromScene(envScene, 0.02, 0.1, 200).texture;
          const key = new THREE.DirectionalLight(0xffffff, 2.1); key.position.set(-0.45, 0.9, 1.0); scene.add(key);
          scene.add(new THREE.HemisphereLight(0xffffff, 0x1c1a2a, 0.8));

          // pixel-mapped world: P(x, y, z) takes canvas px
          const G = new THREE.Group(); scene.add(G);
          const HX = HS.x + HS.w / 2, HY = HS.y + HS.h / 2;                        // housing centre (the pivot)
          G.position.set(HX - W / 2, H / 2 - HY, 0);
          const P = (x, y, z = 0) => new THREE.Vector3(x - HX, HY - y, z);
          const SG = new THREE.Group(); G.add(SG);
          const FACE = HS.d / 2 + HS.bev;

          // ---------- housing: a brushed-metal bezel with a real recess, a key-lit navy panel sunk 8 px into it; the title tab is a solid slab ----------
          const INS = LY.inset, IW = HS.w - 2 * INS, IH = HS.h - 2 * INS, IR = Math.max(6, HS.r - 8);
          const brushTex = canvasTex(1024, 512, (c, w, h) => {
            c.fillStyle = "#4b5583"; c.fillRect(0, 0, w, h);
            for (let i = 0; i < 1400; i++) { const y = Look.hash(i * 3 + 1) * h, l = 40 + Look.hash(i * 3 + 2) * 300, x = Look.hash(i * 3 + 3) * w, a = 0.05 + Look.hash(i * 7 + 5) * 0.12;
              c.fillStyle = (i % 2 ? "rgba(255,255,255," : "rgba(0,0,10,") + a.toFixed(3) + ")"; c.fillRect(x, y, l, 1); }
            const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "rgba(255,255,255,.16)"); g.addColorStop(0.5, "rgba(255,255,255,0)"); g.addColorStop(1, "rgba(0,0,10,.28)");
            c.fillStyle = g; c.fillRect(0, 0, w, h);
          });
          brushTex.wrapS = brushTex.wrapT = THREE.RepeatWrapping; brushTex.repeat.set(1 / HS.w, 1 / HS.h); brushTex.offset.set(0.5, 0.5);
          const bezelMat = new THREE.MeshPhysicalMaterial({ map: brushTex, color: 0xffffff, metalness: 0.85, roughness: 0.44, clearcoat: 0.35, clearcoatRoughness: 0.25, envMapIntensity: 0.7 });
          const sideMat = new THREE.MeshPhysicalMaterial({ color: 0x3d4670, metalness: 0.9, roughness: 0.3, clearcoat: 0.5, clearcoatRoughness: 0.12, envMapIntensity: 1.2 });
          renderer.localClippingEnabled = true;
          const NRM = new THREE.Vector3(1, 0.45, 0).normalize();
          const planeOld = new THREE.Plane(NRM.clone(), 1e6), planeNew = new THREE.Plane(NRM.clone().negate(), -1e6);
          const clipTo = (mats, pl) => mats.forEach((m) => { m.clippingPlanes = [pl]; m.clipShadows = false; });
          // RDR2 skin: worn leather with a brass-lit top edge
          const leatherTex = canvasTex(1024, 512, (c, w, h) => {
            c.fillStyle = "#2b1d13"; c.fillRect(0, 0, w, h);
            for (let i = 0; i < 9000; i++) { const x = Look.hash(i * 5 + 1) * w, y = Look.hash(i * 5 + 2) * h, r = 0.6 + Look.hash(i * 5 + 3) * 1.9, a = 0.04 + Look.hash(i * 5 + 4) * 0.14;
              c.fillStyle = (i % 3 ? "rgba(0,0,0," : "rgba(215,175,120,") + a.toFixed(3) + ")"; c.beginPath(); c.arc(x, y, r, 0, 6.2832); c.fill(); }
            const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "rgba(184,155,106,.26)"); g.addColorStop(0.28, "rgba(184,155,106,0)"); g.addColorStop(1, "rgba(0,0,0,.38)");
            c.fillStyle = g; c.fillRect(0, 0, w, h);
          });
          leatherTex.wrapS = leatherTex.wrapT = THREE.RepeatWrapping; leatherTex.repeat.set(1 / HS.w, 1 / HS.h); leatherTex.offset.set(0.5, 0.5);
          const leatherMat = new THREE.MeshPhysicalMaterial({ map: leatherTex, roughness: 0.66, metalness: 0, clearcoat: 0.35, clearcoatRoughness: 0.45, envMapIntensity: 0.5 });
          const leatherSide = new THREE.MeshPhysicalMaterial({ color: 0x1a110b, roughness: 0.8, metalness: 0, clearcoat: 0.2 });
          const bezelG = extrude(HS.w, HS.h, HS.r, HS.d, HS.bev, 4, [IW, IH, IR]);
          const bezel = new THREE.Mesh(bezelG, [bezelMat, sideMat]); SG.add(bezel);
          const bezelR = new THREE.Mesh(bezelG, [leatherMat, leatherSide]); SG.add(bezelR);
          const faceTex = canvasTex(1024, 256, (c, w, h) => {
            let g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#1C2244"); g.addColorStop(0.45, "#141936"); g.addColorStop(1, "#0B0F22");
            c.fillStyle = g; c.fillRect(0, 0, w, h);
            g = c.createRadialGradient(w * 0.2, h * 0.0, 0, w * 0.2, h * 0.0, w * 0.5); g.addColorStop(0, "rgba(150,160,230,.22)"); g.addColorStop(1, "rgba(150,160,230,0)");
            c.fillStyle = g; c.fillRect(0, 0, w, h);
            g = c.createLinearGradient(0, 0, 0, h * 0.18); g.addColorStop(0, "rgba(0,0,8,.55)"); g.addColorStop(1, "rgba(0,0,8,0)");   // the recess's own shadow under the top lip
            c.fillStyle = g; c.fillRect(0, 0, w, h * 0.18);
          });
          faceTex.repeat.set(1 / (IW + 6), 1 / (IH + 6)); faceTex.offset.set(0.5, 0.5);
          const faceMat = new THREE.MeshPhysicalMaterial({ map: faceTex, roughness: 0.4, metalness: 0.05, clearcoat: 0.8, clearcoatRoughness: 0.2, envMapIntensity: 0.5 });
          const PF = FACE - 8;                                                      // the panel face, sunk 8 px into the bezel
          const panelG = extrude(IW + 6, IH + 6, IR + 3, 14, 2, 2);
          const panel = new THREE.Mesh(panelG, [faceMat, sideMat]); panel.position.z = PF - 9; SG.add(panel);
          const leatherPTex = leatherTex.clone(); leatherPTex.repeat.set(1 / (IW + 6), 1 / (IH + 6)); leatherPTex.offset.set(0.5, 0.5); leatherPTex.needsUpdate = true;
          const panelMatR = new THREE.MeshPhysicalMaterial({ map: leatherPTex, color: 0x7a6a58, roughness: 0.7, metalness: 0, clearcoat: 0.25, clearcoatRoughness: 0.5, envMapIntensity: 0.4 });
          const panelR = new THREE.Mesh(panelG, [panelMatR, leatherSide]); panelR.position.z = PF - 9; SG.add(panelR);
          const w0 = Math.round(mw(t0) + TB.pad * 2 + 6), w1 = Math.round(mw(t1) + TB.pad * 2 + 6);
          const tabG = extrude(tabW, tabH, Math.min(14, HS.r), HS.d, HS.bev); tabG.translate(tabW / 2, 0, 0);
          const tabTex = brushTex.clone(); tabTex.repeat.set(1 / tabW, 1 / (tabH * 1.6)); tabTex.offset.set(0.5, 0.5); tabTex.needsUpdate = true;

          tab.position.copy(P(tabX, tabY + tabH / 2, 0.5)); SG.add(tab);
          const tabTexR = leatherTex.clone(); tabTexR.repeat.set(1 / tabW, 1 / (tabH * 1.6)); tabTexR.offset.set(0.5, 0.5); tabTexR.needsUpdate = true;
          const tabMatR = leatherMat.clone(); tabMatR.map = tabTexR;
          const tabR = new THREE.Mesh(tabG, [tabMatR, leatherSide]); tabR.position.copy(tab.position); SG.add(tabR);
          clipTo([bezelMat, sideMat, faceMat, tabMat], planeNew); clipTo([leatherMat, leatherSide, panelMatR, tabMatR], planeOld);

          // ---------- the slot: metal lip ring, dark channel, liquid fill shader ----------
          const L = SL.x1 - SL.x0, SR = SL.r, LIP = SL.lip, SCX = (SL.x0 + SL.x1) / 2;
          const lipMat = new THREE.MeshPhysicalMaterial({ color: 0xb48c4e, metalness: 1, roughness: 0.24, clearcoat: 0.6, clearcoatRoughness: 0.1, envMapIntensity: 1.5 });
          const lip = new THREE.Mesh(extrude(L + 2 * LIP, 2 * (SR + LIP), SR + LIP, 3, 1.2, 3), lipMat); lip.position.copy(P(SCX, SL.cy, PF + 1.5)); SG.add(lip);
          const chanMat = new THREE.MeshPhysicalMaterial({ color: 0x05060c, metalness: 0.2, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.1, envMapIntensity: 0.8 });
          const chan = new THREE.Mesh(extrude(L, 2 * SR, SR, 1.5, 0.6, 2), chanMat); chan.position.copy(P(SCX, SL.cy, PF + 3.4)); SG.add(chan);
          const FILL = "uniform float uA0, uHead, uLen, uR, uSweep, uBoost; uniform vec3 uC0, uC1, uH0, uH1; varying vec2 vP;" +
            "float cap(vec2 p, float a, float b, float r){ float x = clamp(p.x, a, b); return length(vec2(p.x - x, p.y)) - r; }" +
            "void main(){ vec2 p = vP; float yy = clamp(p.y / uR, -1.0, 1.0);" +
            " float dE = cap(p, uA0, uA0 + uLen, uR); float hd = max(uHead, uA0 + 0.5); float dF = cap(p, uA0, hd, uR);" +
            " float inE = smoothstep(0.9, -0.9, dE), inF = smoothstep(0.9, -0.9, dF) * step(uA0 + 2.0, uHead);" +
            " float sw = smoothstep(-36.0, 36.0, uSweep - p.x); vec3 c = mix(uC0, uC1, sw), h = mix(uH0, uH1, sw);" +
            " float topShade = smoothstep(-0.15, 1.0, yy) * 0.8;" +
            " vec3 bed = mix(vec3(0.045,0.048,0.085), c * 0.2, 0.55) * (1.0 - topShade);" +
            " bed += vec3(0.62,0.66,0.84) * exp(-pow((yy + 0.84) / 0.13, 2.0)) * 0.38;" +
            " vec3 fc = c * (0.5 + 0.5 * (1.0 - yy * yy)); fc = mix(fc, c * 0.5, smoothstep(0.15, 1.0, yy) * 0.6);" +
            " fc += vec3(1.0) * exp(-pow((yy - 0.38) / 0.2, 2.0)) * 0.26; fc += h * exp(-pow((yy + 0.08) / 0.24, 2.0)) * 0.42 * (uBoost - 0.6);" +

          const VS = "varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }";

          const sweepTG = new THREE.PlaneGeometry(tabW - 6, tabH - 6); sweepTG.translate(tabW / 2, 0, 0);
          const sweepT = new THREE.Mesh(sweepTG, new THREE.ShaderMaterial({ uniforms: { uX: sweepU.uX, uW: sweepU.uW, uA: sweepU.uA }, vertexShader: VS, fragmentShader: SWEEP, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
          sweepT.position.copy(P(tabX, tabY + tabH / 2, FACE + 1.2)); sweepT.renderOrder = 3; SG.add(sweepT);

          // ---------- the knob: bevelled ceramic puck in a metal collar, an LED inset, a contact shadow ----------
          const KG = new THREE.Group(); SG.add(KG);

          const prof = [new THREE.Vector2(0, 0), new THREE.Vector2(KB.r, 0), new THREE.Vector2(KB.r, KB.h - KB.ch), new THREE.Vector2(KB.r - KB.ch, KB.h), new THREE.Vector2(0, KB.h)];

          const collarMat = new THREE.MeshPhysicalMaterial({ color: 0x3f4870, metalness: 1, roughness: 0.26, clearcoat: 0.5, envMapIntensity: 1.4, side: THREE.DoubleSide });

          const ledMat = new THREE.MeshPhysicalMaterial({ color: 0x2a0d18, roughness: 0.2, clearcoat: 1, clearcoatRoughness: 0.05, emissive: hex3(C.colour[0]), emissiveIntensity: 0.9 });
          const groove = new THREE.Mesh(new THREE.TorusGeometry(KB.r * 0.64, 1.6, 10, 72), new THREE.MeshPhysicalMaterial({ color: 0x8a8697, roughness: 0.5, metalness: 0.3 })); groove.position.z = KB.h - 0.4; KG.add(groove);
          const led = new THREE.Mesh(new THREE.CylinderGeometry(KB.r * 0.3, KB.r * 0.3, 1.6, 40), ledMat); led.rotation.x = Math.PI / 2; led.position.z = KB.h + 0.6; KG.add(led);
          const HALO = "uniform float uA; varying vec2 vP; void main(){ vec2 q = (vP - vec2(0.0, -0.16)) / vec2(1.0, 0.72); float d = length(q); float a = uA * exp(-d * d * 3.2); gl_FragColor = vec4(0.0, 0.0, 0.02, a); }";

          // ---------- anchors for the DOM type ----------
          const anchor = (x, y, z) => { const o = new THREE.Object3D(); o.position.copy(P(x, y, z)); SG.add(o); return o; };
          const aT = anchor(tabX + TB.pad, tabY + tabH / 2 - 1, FACE + 0.5), aL = anchor(LY.labels.xL, LY.labels.cyL, PF), aR = anchor(LY.labels.xR, LY.labels.cyR, PF);
          const v3 = new THREE.Vector3(), v3b = new THREE.Vector3();

          }

          };
          // roll: entrance (rise into the window), flip (old down and out, new down from above), exit (down and out)
          function roll(old, nw, t, delay) {
            const pIn = seg(t, T.in + 0.12 + delay, 0.32), pOutOld = seg(t, T.flip + delay, 0.2), pInNew = seg(t, T.flip + delay + 0.2, 0.3), pOut = seg(t, T.out + delay, 0.22);
            const yOld = pOutOld > 0 ? eI3(pOutOld) * 118 : (1 - eO3(pIn)) * 118;

          }

          // ---------- motion from time ----------

          function knobV(t) {
            if (t < T.flip + 0.05) return C.home;
            if (t < T.slide) return lerp(C.home, C.flipHome, eOB(seg(t, T.flip + 0.05, 0.6), 0.9));

          }
          const sweepX = (t) => { const p = seg(t, T.flip, 0.5); return p <= 0 ? -9999 : p >= 1 ? 9999 : lerp(-HS.w / 2 - 220, HS.w / 2 + 220, eIO2(p)); };

            const flip = eOB(sIn, 1.1);

            canvas.style.filter = bl > 0.2 ? "blur(" + bl.toFixed(1) + "px)" : "none";
            const envK = lerp(0.1, 1, eO3(sIn));                                   // the metal only catches the studio once it has settled (no blown-out first frames)

            const kx = KX(v);
            const ledMix = sm(-36, 36, sx - (kx - HX));
            ledMat.emissive.copy(hex3(C.colour[0])).lerp(hex3(C.colour[1]), ledMix);
            const lit = hp < 0 ? 0 : hp < 0.1 ? 1 : Math.exp(-4 * (hp - 0.1));
            ledMat.emissiveIntensity = 0.9 + 1.5 * lit;

            const tw = lerp(w0, w1, eIO3(seg(t, T.flip + 0.08, 0.42))) / tabW; tab.scale.x = tw; tabR.scale.x = tw; sweepT.scale.x = tw;

        Promise.all(FACES.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(build);
      })();
