<!doctype html>
<!-- GTA-niche 77 Animation count tiles, variant A (16:9, 1920x1080, 30 fps, 6.15 s).
     Same-scale tiles (one tile = 55,000 animations) fill in per game: GTA V one tile, RDR2 five and a half, GTA VI eleven.
     Three socket rails (Three.js extruded slabs with 11 recessed sockets each) slide in one per game; bevelled clearcoat tiles in
     the identity colour drop into the sockets with real contact shadows, a rake light travels the row that is filling, and the
     eleventh GTA VI tile landing is the beat (deeper drop, rail dip, elastic count, 3-frame localised expose). Names, counts,
     legend and source pill are DOM (Oswald). Content structure in CONFIG (rows: game/label/value/count/at/step), same shape
     as the film kit's `tiles` object. Full-kind component over the official GTA VI footage. Variable bg: "plate" / "none". -->

]'>

    <script>
      // ---- content: same shape as the film kit's `tiles` object (rows: game / label / count / at / step) plus the source pill ----

        const camera = new THREE.PerspectiveCamera(FOV, W / H, 100, 12000); camera.position.set(W / 2, -H / 2, D); camera.lookAt(W / 2, -H / 2, 0);
        const pmrem = new THREE.PMREMGenerator(renderer), env = new THREE.Scene();
        env.add(new THREE.Mesh(new THREE.SphereGeometry(60, 24, 16), new THREE.MeshBasicMaterial({ color: 0x1a1e30, side: THREE.BackSide })));
        const box = (col, w, h, px, py, pz) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: col, side: THREE.DoubleSide })); m.position.set(px, py, pz); m.lookAt(0, 0, 0); env.add(m); };
        box(0xfff4e4, 34, 22, -22, 26, 20); box(0x9fbcff, 16, 30, 34, 4, 8); box(0x6d7390, 60, 60, 0, -40, 0); box(0xffffff, 10, 6, 6, 30, 30);

        const cx = W / 2, cy = H / 2;
        const key = new THREE.DirectionalLight(0xfff1dc, 3.0); key.position.set(cx - 700, -cy + 900, 1500); key.target.position.set(cx, -cy, 0); scene.add(key); scene.add(key.target);

        const shc = key.shadow.camera; shc.left = -W * 0.6; shc.right = W * 0.6; shc.top = H * 0.6; shc.bottom = -H * 0.6; shc.near = 200; shc.far = 4000;
        const rim = new THREE.DirectionalLight(0xbcd0ff, 0.7); rim.position.set(cx + 1200, -cy + 300, 700); rim.target.position.set(cx, -cy, 0); scene.add(rim); scene.add(rim.target);
        scene.add(new THREE.HemisphereLight(0xc9d4ff, 0x14121a, 0.6));
        const rake = new THREE.PointLight(0xfff2dc, 0, 1400, 2); scene.add(rake);
        const rrect = (w, h, r) => { const s = new THREE.Shape(); s.moveTo(-w / 2 + r, -h / 2); s.lineTo(w / 2 - r, -h / 2); s.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r); s.lineTo(w / 2, h / 2 - r); s.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2); s.lineTo(-w / 2 + r, h / 2); s.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r); s.lineTo(-w / 2, -h / 2 + r); s.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2); return s; };
        // tile: rounded bevelled slab, bottom at z = 0 (one geometry per width: full, and the cut tile)

        const rails = CONFIG.rows.map((r, ri) => {

        }

          else { n.style.clipPath = "inset(0 " + (p * 100).toFixed(2) + "% 0 0)"; n.style.transform = "translate(" + (-40 * p).toFixed(2) + "px,0)"; }
        }
        const fmt = (v) => Math.round(v).toLocaleString("en-US");

          $("#grade").style.filter = g > 0.001 ? "brightness(" + lerp(1, gr.brightness, g).toFixed(3) + ") contrast(" + lerp(1, gr.contrast, g).toFixed(3) + ") saturate(" + lerp(1, gr.saturate, g).toFixed(3) + ")" : "";
          scrim.style.opacity = g.toFixed(3);
          const pe = payEnv(t);
          let blurMax = 0;
          rails.forEach((R, ri) => {
            const r = R.r, st = railState(r, ri, t), d = rowsDom[ri];
            R.grp.visible = st.vis; R.grp.position.set(r.railX + st.x, -(r.railY + st.y), st.z); blurMax = Math.max(blurMax, st.blur);
            d.rowEl.style.opacity = st.vis ? "1" : "0";
            d.rowEl.style.transform = "translate(" + st.x.toFixed(2) + "px," + st.y.toFixed(2) + "px) scale(" + st.s.toFixed(5) + ")";
            d.rowEl.style.filter = st.blur > 0.2 ? "blur(" + st.blur.toFixed(2) + "px)" : "";
            // labels: name wipes at the row start, count rises on the first landing, ticks per landing, leaves with the tiles
            const nIn = eOut(clamp((t - r.at) / 0.24, 0, 1)), nOut = t >= T.exit ? eIn(clamp((t - T.exit - ri * 0.03) / 0.22, 0, 1)) : 0;
            d.name.style.transform = "translate(0," + ((1 - nIn) * 130 + nOut * 130).toFixed(2) + "%)";
            const landed = pieces.filter((p) => p.ri === ri && t >= p.land), n = landed.length;
            let v = 0, last = r.landFirst; landed.forEach((p) => { v += p.frac; last = Math.max(last, p.land); });
            const atEnd = v >= r.count - 1e-6;
            d.count.textContent = atEnd ? r.label : (r.label.charAt(0) === "≈" ? "≈" : "") + fmt(Math.round(r.value * v / r.count / 1000) * 1000);
            const ri1 = eOut(clamp((t - r.landFirst) / 0.22, 0, 1));
            const heroBeat = ri === LAST && atEnd;
            const punch = !n ? 1 : heroBeat ? 1 + 0.18 * (1 - elastic(clamp((t - last) / 0.5, 0, 1))) : 1 + 0.06 * (1 - pOut(clamp((t - last) / 0.13, 0, 1)));
            const cOut = t >= T.exit ? eIn(clamp((t - T.exit - ri * 0.03 - 0.04) / 0.22, 0, 1)) : 0;
            d.count.style.transform = "translate(0," + ((1 - ri1) * 130 + cOut * 130).toFixed(2) + "%) scale(" + punch.toFixed(4) + ")";
            d.count.style.transformOrigin = L.stack ? "100% 100%" : "0% 100%";
            const lit = ri === LAST ? pe : 0;
            d.count.style.filter = lit > 0.01 ? "brightness(" + (1 + 0.5 * lit).toFixed(3) + ")" : ""; d.name.style.filter = d.count.style.filter;
            // tiles
            R.full.forEach((p) => {
              const s = pieceState(p, t);
              if (!s.vis) { P.set(p.x - r.railX, 0, 9000); SCL.set(0.001, 0.001, 0.001); Q.identity(); }
              else { P.set(p.x - r.railX, 0, s.z); SCL.set(1, 1, 1); EU.set(s.rx, 0, 0); Q.setFromEuler(EU); }
              M.compose(P, Q, SCL); R.inst.setMatrixAt(p.k, M);
              const k = Math.max(s.flash || 0, ri === LAST ? 0.16 * pe : 0);
              TMP.copy(p.c); if (k > 0) TMP.multiplyScalar(1 + 2.2 * k); R.inst.setColorAt(p.k, TMP);
            });
            R.inst.instanceMatrix.needsUpdate = true; if (R.inst.instanceColor) R.inst.instanceColor.needsUpdate = true;
            R.halves.forEach((p) => {
              const s = pieceState(p, t); p.mesh.visible = !!s.vis;
              if (s.vis) { p.mesh.position.set(p.x - r.railX + p.dx, 0, s.z); p.mesh.rotation.set(s.rx, 0, 0); TMP.copy(p.c); if (s.flash) TMP.multiplyScalar(1 + 2.2 * s.flash); p.mat.color.copy(TMP); }
            });
          });
          canvas.style.filter = blurMax > 0.2 ? "blur(" + blurMax.toFixed(2) + "px)" : "";
          wipeIn(legend, t, CONFIG.rows[0].in + 0.1, 0.26); if (t >= T.exit) wipeOut(legend, t, T.exit, 0.22);
          wipeIn(pill, t, CONFIG.rows[0].in + 0.2, 0.24); if (t >= T.out) wipeOut(pill, t, T.out, 0.2, "d");
          // the rake: a low warm light travels along the row that is filling; on the payoff it sweeps the GTA VI row at 2x
          let rx = 0, ry = 0, rI = 0;
          CONFIG.rows.forEach((r, i) => {
            const a = r.landFirst - 0.12, bEnd = r.landLast;
            if (t >= a && t <= bEnd + 0.08) { const q = clamp((t - a) / (bEnd - a), 0, 1); rx = lerp(r.x0 - 60, r.x1 + 60, q); ry = r.yc; rI = (i === LAST ? 1 : 0.6) * sIO(clamp(Math.min(t - a, bEnd + 0.08 - t) / 0.12, 0, 1)); }
          });
          const lastRow = CONFIG.rows[LAST], sp = clamp((t - T.pay) / T.sweep, 0, 1);
          if (sp > 0 && sp < 1) { rx = lerp(lastRow.x0 - 160, lastRow.x1 + 160, sIO(sp)); ry = lastRow.yc; rI = 1.5 * Math.sin(Math.PI * sp); }
          const Icand = S * S * 1.2;              // candela scaled to the tile size (irradiance ~ I / d^2 at ~3.2 S above the row)
          rake.intensity = rI * Icand; rake.position.set(rx, -ry, S * 4); rake.visible = rI > 0.001;
          renderer.render(scene, camera);
        }
        window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") renderAt(e.detail.time); });
        renderAt(0);

        window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["tiles"] = Promise.all(["500 36px Oswald", "600 48px Oswald", "700 84px Oswald"].map((f) => document.fonts.load(f).catch(() => null))).then(() => document.fonts.ready).then(() => {
          const tl = gsap.timeline({ paused: true });
          Look.drive(tl, 0, T.end, (p) => renderAt(p * T.end));
          Look.push(tl, "#push", 0, T.end, { from: 1.0, to: 1.05 });
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
          renderAt(0);
        });
      })();
    </script>
  <script>
/* Gallery autoplay: bina HyperFrames runtime ke browser me khule to timeline loop me chalao */
(function(){if(window.__hyperframes)return;var n=0;var t=setInterval(function(){n++;var tls=window.__timelines;if(tls&&Object.keys(tls).length){clearInterval(t);Object.keys(tls).forEach(function(k){try{tls[k].repeat(-1);tls[k].play(0);}catch(e){}});}if(n>60)clearInterval(t);},150);})();
</script>
